  <div class="card" style="margin-top:8px">${l.body()}</div>
  ${inf?`<div class="card" style="margin-top:14px"><div class="row spread"><div><div class="kicker gold">Infografía interactiva</div><h2 style="margin:0">${esc(inf.name)}</h2><p class="small muted" style="margin:2px 0 0">${esc(inf.desc||'')}</p></div>${hasReto?`<span class="pill ${r&&r.done?'good':'gray'}">${r&&r.done?'Reto superado · '+r.best+'%':'Reto pendiente'}</span>`:''}</div>
    ${hasReto?`<div class="tabs" style="margin-top:10px"><button class="${state.tab==='explore'?'on':''}" onclick="setTab('explore')">🔍 Explorar</button><button class="${state.tab==='reto'?'on':''}" onclick="setTab('reto')">🎯 Reto${r&&r.done?'<span class="badge ok">✔</span>':''}</button></div>`:''}
    <div id="infoMount"></div></div>`:''}
  <div class="lessonnav"><button class="btn ghost" ${prev?'':'disabled'} onclick="openLesson('${m.id}',${state.li-1})">← Anterior</button><div class="row">${lessonDone(l.id)?'<span class="pill good">Lección completada</span>':''}${next?`<button class="btn" onclick="finishLesson('${m.id}',${state.li})">Completar y seguir →</button>`:`<button class="btn gold" onclick="finishLesson('${m.id}',${state.li})">Completar y evaluar →</button>`}</div></div>`;
}
function setTab(t){state.tab=t;$$('.tabs button').forEach((b,i)=>b.classList.toggle('on',(i===0&&t==='explore')||(i===1&&t==='reto')));mountLessonInfo();}
function mountLessonInfo(){const m=MOD(state.mid),l=m.lessons[state.li];if(INFO[l.info])mountInfo(l.info,INFO[l.info].reto?state.tab:'explore','#infoMount');}
function finishLesson(mid,i){const m=MOD(mid);markLesson(m.lessons[i].id);beep('ok');if(i<m.lessons.length-1)openLesson(mid,i+1);else startQuiz(mid);}

/* ---------- EVALUACIÓN ---------- */
function prepQuestions(list){
  return shuffle(list).map(q0=>{
    const q=Object.assign({},q0);
    if(q.type==='mc'||q.type==='multi'){const idx=shuffle(q.opts.map((_,i)=>i));q.opts=idx.map(i=>q0.opts[i]);q.a=q.type==='mc'?idx.indexOf(q0.a):q0.a.map(x=>idx.indexOf(x)).sort();}
    if(q.type==='order'){let order;do{order=shuffle(q0.opts.map((_,i)=>i));}while(order.every((v,i)=>v===i));q.cur=order;q.a=q0.a;}
    return q;
  });
}
function startQuiz(mid){
  const m=MOD(mid);
  state.quiz={mid:mid,qs:prepQuestions(m.quiz),i:0,score:0,streak:0,correct:0,answered:false,log:[],title:'Módulo '+m.num+' · '+m.title,exam:false};
  go('quiz',{mid:mid});
}
function startExam(){
  const pool=MODULES.flatMap(m=>m.quiz.map(q=>Object.assign({mod:m.num},q)));
  const pick=[];const byMod={};shuffle(pool).forEach(q=>{byMod[q.mod]=(byMod[q.mod]||0);if(byMod[q.mod]<3&&pick.length<15){pick.push(q);byMod[q.mod]++;}});
  state.quiz={mid:'exam',qs:prepQuestions(pick),i:0,score:0,streak:0,correct:0,answered:false,log:[],title:'Examen final integrador',exam:true};
  go('exam');
}
function viewExamIntro(){
  return `<div class="card qcard"><div class="kicker gold">Examen final integrador</div><h1>🏁 15 preguntas de todos los módulos</h1><p>Se seleccionan al azar hasta tres preguntas por módulo. Cada respuesta recibe retroalimentación inmediata con la corrección paso a paso. Aprobar requiere ≥60%; tres estrellas con ≥90%.</p>${P.exam?`<p>Mejor resultado: <b>${P.exam.score} pts</b> · ${P.exam.accuracy}% <span class="stars">${starStr(P.exam.stars)}</span> · ${esc(P.exam.date)}</p>`:''}<div class="row"><button class="btn gold" onclick="startExam()">Comenzar examen</button><button class="btn ghost" onclick="go('home')">Volver</button></div></div>`;
}
function viewQuiz(){
  const Q=state.quiz,q=Q.qs[Q.i];
  const dots=Q.qs.map((x,i)=>`<i class="${i===Q.i?'cur':(Q.log[i]?(Q.log[i].ok?'ok':'bad'):'')}"></i>`).join('');
  let body='';
  if(q.type==='mc')body=`<div class="optlist">${q.opts.map((o,i)=>`<button class="opt" id="opt${i}" onclick="answer(${i})"><span class="k">${'ABCD'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  else if(q.type==='tf')body=`<div class="optlist" style="grid-template-columns:1fr 1fr">${['Verdadero','Falso'].map((o,i)=>`<button class="opt" id="opt${i}" onclick="answer(${i===0})"><span class="k">${i===0?'V':'F'}</span><span>${o}</span></button>`).join('')}</div>`;
  else if(q.type==='multi')body=`<div class="optlist">${q.opts.map((o,i)=>`<button class="opt" id="opt${i}" onclick="toggleOpt(${i})"><span class="k">☐</span><span>${esc(o)}</span></button>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn" id="checkBtn" onclick="answerMulti()">Comprobar selección</button></div>`;
  else if(q.type==='order')body=`<div class="orderlist" id="orderList">${q.cur.map((oi,pos)=>`<div class="oi" data-i="${oi}"><span class="n">${pos+1}</span><span>${esc(q.opts[oi])}</span><span class="mv"><button class="btn ghost sm" onclick="moveOrder(${pos},-1)" ${pos===0?'disabled':''}>▲</button><button class="btn ghost sm" onclick="moveOrder(${pos},1)" ${pos===q.cur.length-1?'disabled':''}>▼</button></span></div>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn" id="checkBtn" onclick="answerOrder()">Comprobar orden</button></div>`;
  return `<div class="card qcard"><div class="row spread"><div><div class="kicker">${esc(Q.title)}</div><div class="tiny muted">Pregunta ${Q.i+1} de ${Q.qs.length} · tema: ${esc(q.topic)}${q.mod?' · módulo '+q.mod:''}</div></div><div class="row"><span class="pill gold">⭐ ${Q.score}</span><span class="pill ${Q.streak>=3?'good':'gray'}">🔥 racha ${Q.streak}</span><button class="btn ghost sm" onclick="if(confirm('¿Abandonar la evaluación? No se guardará.'))go(state.quiz.exam?'home':'module')">✕</button></div></div>
  <div class="qnum">${dots}</div>
  <h2 style="margin-top:6px">${esc(q.q)}</h2>
  ${q.type==='multi'?'<p class="tiny muted">Selecciona todas las opciones correctas y comprueba.</p>':''}
  ${body}
  <div id="feedback"></div></div>`;
}
function toggleOpt(i){if(state.quiz.answered)return;const b=$('#opt'+i);b.classList.toggle('sel');b.querySelector('.k').textContent=b.classList.contains('sel')?'☑':'☐';}
function moveOrder(pos,d){const q=state.quiz.qs[state.quiz.i];if(state.quiz.answered)return;const j=pos+d;if(j<0||j>=q.cur.length)return;[q.cur[pos],q.cur[j]]=[q.cur[j],q.cur[pos]];render();}
function answer(val){const Q=state.quiz,q=Q.qs[Q.i];if(Q.answered)return;let ok,given;
  if(q.type==='mc'){ok=val===q.a;given=q.opts[val];$$('.opt').forEach((b,i)=>{b.classList.add(i===q.a?'ok':(i===val?'bad':'dim'));});}
  else{ok=val===q.a;given=val?'Verdadero':'Falso';$$('.opt').forEach((b,i)=>{const isT=i===0;b.classList.add(isT===q.a?'ok':(isT===val?'bad':'dim'));});}
  finishAnswer(ok,given);
}
function answerMulti(){const Q=state.quiz,q=Q.qs[Q.i];if(Q.answered)return;const sel=$$('.opt').map((b,i)=>b.classList.contains('sel')?i:-1).filter(i=>i>=0);
  const ok=sel.length===q.a.length&&sel.every(i=>q.a.includes(i));
  $$('.opt').forEach((b,i)=>{if(q.a.includes(i))b.classList.add('ok');else if(sel.includes(i))b.classList.add('bad');else b.classList.add('dim');});
  $('#checkBtn').disabled=true;finishAnswer(ok,sel.map(i=>q.opts[i]).join('; ')||'(nada)');
}
function answerOrder(){const Q=state.quiz,q=Q.qs[Q.i];if(Q.answered)return;const ok=q.cur.every((v,i)=>v===q.a[i]);
  $$('#orderList .oi').forEach((el,pos)=>el.classList.add(q.cur[pos]===q.a[pos]?'ok':'bad'));$('#checkBtn').disabled=true;
  finishAnswer(ok,q.cur.map(i=>q.opts[i]).join(' → '));
}
function correctText(q){if(q.type==='mc')return q.opts[q.a];if(q.type==='tf')return q.a?'Verdadero':'Falso';if(q.type==='multi')return q.a.map(i=>q.opts[i]).join('; ');return q.a.map(i=>q.opts[i]).join(' → ');}
function finishAnswer(ok,given){const Q=state.quiz,q=Q.qs[Q.i];Q.answered=true;
  let pts=0;if(ok){Q.correct++;Q.streak++;pts=100+(Q.streak>=3?25:0);Q.score+=pts;beep('ok');floatPoints('+'+pts);}else{Q.streak=0;beep('bad');shake($('.qcard'));}
  topicHit(q.topic,ok);Q.log[Q.i]={q:q.q,topic:q.topic,ok:ok,given:given,correct:correctText(q),why:q.why};
  $('#feedback').innerHTML=`<div class="explain pop" style="border-color:${ok?'var(--good)':'var(--bad)'}"><b>${ok?'✅ Correcto':'❌ Incorrecto'}</b>${ok?'':' · Respuesta correcta: <b>'+esc(correctText(q))+'</b>'}<div style="margin-top:6px">${esc(q.why)}</div>${q.steps?'<ol>'+q.steps.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ol>':''}<div class="row" style="margin-top:10px"><button class="btn" onclick="nextQ()">${Q.i<Q.qs.length-1?'Siguiente →':'Ver resultados'}</button></div></div>`;
  $('#feedback').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function nextQ(){const Q=state.quiz;if(Q.i<Q.qs.length-1){Q.i++;Q.answered=false;render();}else finishQuiz();}
function finishQuiz(){const Q=state.quiz;const total=Q.qs.length,acc=Math.round(Q.correct/total*100),stars=starsFor(acc);
  const res={score:Q.score,correct:Q.correct,total:total,accuracy:acc,stars:stars,date:today(),log:Q.log,title:Q.title,mid:Q.mid,player:P.player};
  if(Q.exam){if(!P.exam||res.accuracy>=P.exam.accuracy)P.exam=res;}
  else{const q=P.quiz[Q.mid]||{attempts:0,best:null};q.attempts++;if(!q.best||res.accuracy>q.best.accuracy||(res.accuracy===q.best.accuracy&&res.score>q.best.score))q.best=res;q.last=res;P.quiz[Q.mid]=q;}
  P.history.unshift({title:Q.title,score:Q.score,accuracy:acc,stars:stars,date:res.date,mid:Q.mid});P.history=P.history.slice(0,60);save();
  state.lastRes=res;if(stars>=2){confetti();beep('win');}
  go(Q.exam?'examres':'results',{mid:Q.mid});
}
function viewResults(){
  const r=state.lastRes||(P.quiz[state.mid]&&P.quiz[state.mid].last)||(state.view==='examres'?P.exam:null);
  if(!r)return viewHome();
  const m=MOD(r.mid);
  const byTopic={};r.log.forEach(l=>{const t=byTopic[l.topic]||{ok:0,n:0};t.n++;if(l.ok)t.ok++;byTopic[l.topic]=t;});
  const weak=Object.entries(byTopic).filter(([t,v])=>v.ok<v.n).map(([t])=>t);
  return `<div class="card qcard" style="text-align:center"><div class="kicker gold">${esc(r.title)}</div><div class="scorebig" id="scoreNum">0</div><div class="muted">puntos · ${r.correct}/${r.total} correctas · ${r.accuracy}% de precisión</div><div class="stars" style="font-size:2rem;margin:6px 0">${starStr(r.stars)}</div><p>${r.accuracy>=90?'Dominio sobresaliente. Ya puedes aplicar estos contenidos con solvencia.':r.accuracy>=75?'Buen dominio. Repasa los temas marcados para llegar a tres estrellas.':r.accuracy>=60?'Aprobado. Vuelve a las infografías de los temas débiles antes de continuar.':'Aún no. Repasa las lecciones y sus retos, luego inténtalo de nuevo.'}</p>
    ${weak.length?`<div class="callout bad" style="text-align:left"><b>Temas por reforzar</b>${weak.map(esc).join(' · ')}</div>`:'<div class="callout good"><b>Sin temas débiles</b>Respondiste bien todos los temas de esta evaluación.</div>'}
    <div class="row" style="justify-content:center;margin-top:8px">${m?`<button class="btn" onclick="startQuiz('${m.id}')">Repetir evaluación</button><button class="btn sec" onclick="openModule('${m.id}')">Volver al módulo</button>`:`<button class="btn" onclick="startExam()">Repetir examen</button>`}${(()=>{const i=m?MODULES.indexOf(m):-1;const n=i>=0?MODULES[i+1]:null;return n?`<button class="btn gold" onclick="openModule('${n.id}')">Módulo ${n.num} →</button>`:`<button class="btn gold" onclick="go('sprint')">Hoja de evidencia →</button>`;})()}<button class="btn ghost" onclick="downloadExcelResult()">⬇ Excel</button><button class="btn ghost" onclick="printResult()">🖨️ Informe</button></div></div>
  <div class="card qcard" style="margin-top:14px"><h3>Detalle y corrección paso a paso</h3>${r.log.map((l,i)=>`<div class="explain" style="border-color:${l.ok?'var(--good)':'var(--bad)'};margin-bottom:8px"><b>${i+1}. ${esc(l.q)}</b><div class="tiny muted">${esc(l.topic)}</div><div>Tu respuesta: <b>${esc(l.given)}</b> ${l.ok?'✅':'❌ · Correcta: <b>'+esc(l.correct)+'</b>'}</div><div class="small">${esc(l.why)}</div></div>`).join('')}</div>`;
}
function animateCount(el,target){const start=performance.now();(function step(t){const p=clamp((t-start)/900,0,1);el.textContent=Math.round(target*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(step);})(start);}

/* ---------- FICHA DE DOMINIO ---------- */

  const retos=Object.keys(INFO).filter(k=>INFO[k].reto).map(k=>({k,name:INFO[k].name,r:P.retos[k]}));

  <div class="grid g2"><div class="card"><h3>Dominio por tema</h3>${topics.length?`<div class="mastery">${topics.map(x=>`<div class="mrow2"><span>${esc(x.t)}</span><div class="bar"><i style="width:${x.pct}%;background:${x.pct>=80?'var(--good)':x.pct>=60?'var(--warn)':'var(--bad)'}"></i></div><span>${x.ok}/${x.n}</span></div>`).join('')}</div><p class="small muted" style="margin-top:8px">Sugerencia: refuerza primero <b>${esc(topics[0].t)}</b>.</p>`:'<p class="muted small">Aún no hay respuestas registradas.</p>'}</div>
  <div class="card"><h3>Retos interactivos</h3><div class="mastery">${retos.map(x=>`<div class="mrow2"><span>${esc(x.name)}</span><div class="bar"><i style="width:${x.r?x.r.best:0}%;background:${x.r&&x.r.done?'var(--good)':'var(--warn)'}"></i></div><span>${x.r?x.r.best+'%':'—'}</span></div>`).join('')}</div></div></div>

  const all=[...parts,...central,end];const total=all.reduce((a,b)=>a+b.length,0);const out=new Uint8Array(total);let p=0;all.forEach(a=>{out.set(a,p);p+=a.length;});return out;}
function xesc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));}
function colLetter(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}
function sheetXml(rows,cols){let colsXml=cols?'<cols>'+cols.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>':'';let body='';
  rows.forEach((row,r)=>{body+=`<row r="${r+1}">`;row.forEach((cell,c)=>{if(cell==null)return;const ref=colLetter(c)+(r+1);if(typeof cell==='number')body+=`<c r="${ref}"><v>${cell}</v></c>`;else if(cell&&cell.h)body+=`<c r="${ref}" s="1" t="inlineStr"><is><t xml:space="preserve">${xesc(cell.h)}</t></is></c>`;else body+=`<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xesc(cell)}</t></is></c>`;});body+='</row>';});
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${colsXml}<sheetData>${body}</sheetData></worksheet>`;}
function buildXlsx(sheets){const files=[];
  files.push({name:'[Content_Types].xml',data:strBytes(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`)});
  files.push({name:'_rels/.rels',data:strBytes(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`)});
  files.push({name:'xl/workbook.xml',data:strBytes(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xesc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`)});
  files.push({name:'xl/_rels/workbook.xml.rels',data:strBytes(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`)});
  files.push({name:'xl/styles.xml',data:strBytes(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF0D6E78"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs></styleSheet>`)});
  sheets.forEach((s,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:strBytes(sheetXml(s.rows,s.cols))}));
  return zipStore(files);}
function download(bytes,filename,mime){try{const blob=new Blob([bytes],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast('Descargando '+filename);}catch(e){toast('El navegador no permitió la descarga.');}}
const H=s=>({h:s});
function resultSheets(list){const sum=[[H('Participante'),H('Evaluación'),H('Fecha'),H('Puntos'),H('Correctas'),H('Total'),H('Precisión %'),H('Estrellas')]];const det=[[H('Evaluación'),H('#'),H('Tema'),H('Pregunta'),H('Tu respuesta'),H('Correcta'),H('Acierto'),H('Corrección')]];

  return [{name:'Resumen',rows:sum,cols:[20,34,20,10,10,8,12,10]},{name:'Detalle',rows:det,cols:[30,5,20,60,36,36,9,70]}];}

function downloadExcelAll(){const list=MODULES.map(m=>P.quiz[m.id]&&P.quiz[m.id].best).filter(Boolean);if(P.exam)list.push(P.exam);const sheets=resultSheets(list);const top=[[H('Tema'),H('Aciertos'),H('Intentos'),H('Dominio %')]];Object.entries(P.topics).forEach(([t,v])=>top.push([t,v.ok,v.n,Math.round(v.ok/v.n*100)]));sheets.push({name:'Dominio por tema',rows:top,cols:[28,10,10,12]});const rt=[[H('Reto'),H('Mejor %'),H('Superado'),H('Intentos')]];Object.keys(INFO).filter(k=>INFO[k].reto).forEach(k=>{const r=P.retos[k]||{};rt.push([INFO[k].name,r.best||0,r.done?'Sí':'No',r.tries||0]);});sheets.push({name:'Retos',rows:rt,cols:[36,10,10,10]});download(buildXlsx(sheets),'EvidenciaLab_progreso.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');}
function sprintRows(){const rows=[[H('Sección'),H('Campo'),H('Contenido')]];SPRINT_STEPS.forEach(s=>{if(s.fields)s.fields.forEach(f=>rows.push([s.t,f[1],spField(f[0])]));});rows.push(['Prioridad de supuestos','Pregunta de oro',spField('oro')]);if(SP.goal)rows.push(['Árbol GQM','Goal','Analizar '+SP.goal[0]+' con el propósito de '+SP.goal[1]+' respecto de '+SP.goal[2]+', desde el punto de vista de '+SP.goal[3]+', en el contexto de '+SP.goal[4]+'.']);(SP.gq||[]).forEach((q,i)=>{rows.push(['Árbol GQM','Question '+(i+1),q.q||'']);rows.push(['Árbol GQM','Metric Q'+(i+1),[q.m,q.f,q.src,q.fr,q.u,q.seg].filter(Boolean).join(' · ')]);});rows.push(['Registro','Resultado',SP.result||''],['Registro','Límites',spField('limits')],['Registro','Decisión',spField('decision')]);Object.entries(P.rubric).forEach(([c,v])=>rows.push(['Rúbrica',c,v===100?'Excelente':v===60?'Adecuado':'Insuficiente']));[['x1','Qué dejaré de hacer'],['x2','Qué aplicaré'],['x3','Qué debo validar']].forEach(([k,l])=>rows.push(['Ticket de salida',l,P.exit[k]||'']));return rows;}
function downloadSprintExcel(){const sheets=[{name:'Hoja de evidencia',rows:sprintRows(),cols:[26,44,90]}];const sup=[[H('Supuesto'),H('Tipo'),H('Impacto'),H('Incertidumbre'),H('Prioridad')]];(SP.sup||[]).filter(r=>r.s).forEach(r=>sup.push([r.s,r.t||'',+r.imp||0,+r.inc||0,(+r.imp||0)*(+r.inc||0)]));sheets.push({name:'Supuestos',rows:sup,cols:[60,16,10,14,10]});const obs=[[H('Participante'),H('Conducta observada'),H('Cita'),H('Métrica'),H('Interpretación'),H('Implicación')]];(SP.obsRows||[]).filter(r=>r.c||r.p).forEach(r=>obs.push([r.p||'',r.c||'',r.q||'',r.m||'',r.i||'',r.im||'']));sheets.push({name:'Observaciones',rows:obs,cols:[16,40,40,20,40,40]});download(buildXlsx(sheets),'EvidenciaLab_hoja_de_evidencia.xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');}
function printHtml(title,body){const w=window.open('','_blank');if(!w){toast('Permite ventanas emergentes para imprimir.');return;}w.document.write(`<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Segoe UI,Arial,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;color:#111;line-height:1.45}h1{color:#0d6e78;border-bottom:3px solid #c9950c;padding-bottom:6px}h2{color:#0d6e78;margin-top:22px}table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 14px}th,td{border:1px solid #ccc;padding:6px 8px;text-align:left;vertical-align:top}th{background:#e6f1f2}.box{border:1px solid #ccc;border-radius:8px;padding:10px 12px;margin:8px 0}.ok{color:#0a7a0a}.bad{color:#b02020}.muted{color:#666;font-size:12px}@media print{button{display:none}}</style></head><body><button onclick="window.print()" style="float:right;padding:8px 14px">Imprimir / Guardar PDF</button><h1>${esc(title)}</h1><div class="muted">Evidencia Lab · ${esc(P.player||'Participante')} · ${esc(today())}</div>${body}</body></html>`);w.document.close();}

function printAll(){const list=MODULES.map(m=>P.quiz[m.id]&&P.quiz[m.id].best).filter(Boolean);if(P.exam)list.push(P.exam);printHtml('Informe de aprendizaje',`<h2>Resumen</h2><table><tr><th>Evaluación</th><th>Fecha</th><th>Puntos</th><th>Precisión</th><th>Estrellas</th></tr>${list.map(r=>`<tr><td>${esc(r.title)}</td><td>${esc(r.date)}</td><td>${r.score}</td><td>${r.accuracy}%</td><td>${starStr(r.stars)}</td></tr>`).join('')}</table><h2>Dominio por tema</h2><table><tr><th>Tema</th><th>Aciertos</th><th>Dominio</th></tr>${Object.entries(P.topics).map(([t,v])=>`<tr><td>${esc(t)}</td><td>${v.ok}/${v.n}</td><td>${Math.round(v.ok/v.n*100)}%</td></tr>`).join('')}</table><h2>Retos</h2><table><tr><th>Reto</th><th>Mejor</th><th>Superado</th></tr>${Object.keys(INFO).filter(k=>INFO[k].reto).map(k=>{const r=P.retos[k]||{};return `<tr><td>${esc(INFO[k].name)}</td><td>${r.best||0}%</td><td>${r.done?'Sí':'No'}</td></tr>`;}).join('')}</table>`);}
function printSprint(){const rows=sprintRows();let cur='',html='';rows.slice(1).forEach(([s,f,v])=>{if(s!==cur){if(cur)html+='</table>';html+=`<h2>${esc(s)}</h2><table>`;cur=s;}html+=`<tr><th style="width:34%">${esc(f)}</th><td>${esc(v).replace(/\n/g,'<br>')||'<span class="muted">—</span>'}</td></tr>`;});html+='</table>';
  const sup=(SP.sup||[]).filter(r=>r.s);if(sup.length)html+=`<h2>Supuestos priorizados</h2><table><tr><th>Supuesto</th><th>Tipo</th><th>Impacto</th><th>Incert.</th><th>Prioridad</th></tr>${sup.map(r=>`<tr><td>${esc(r.s)}</td><td>${esc(r.t||'')}</td><td>${r.imp||''}</td><td>${r.inc||''}</td><td>${(+r.imp||0)*(+r.inc||0)}</td></tr>`).join('')}</table>`;
  const obs=(SP.obsRows||[]).filter(r=>r.c||r.p);if(obs.length)html+=`<h2>Registro de observación</h2><table><tr><th>Participante</th><th>Conducta</th><th>Cita</th><th>Métrica</th><th>Interpretación</th><th>Implicación</th></tr>${obs.map(r=>`<tr>${['p','c','q','m','i','im'].map(k=>'<td>'+esc(r[k]||'')+'</td>').join('')}</tr>`).join('')}</table>`;
  html+=`<h2>Pitch de 90 segundos</h2><div class="box">${pitchText()}</div>`;printHtml('Hoja de evidencia · '+(spField('reto')||'Reto de innovación'),html);}

<script>
/* ============================================================
   INFOGRAFÍAS INTERACTIVAS · modo Explorar y modo Reto
   ============================================================ */
function mountInfo(id,mode,sel){const el=typeof sel==='string'?$(sel):sel;const inf=INFO[id];if(!el||!inf)return;el.innerHTML='';el.classList.add('fade');(mode==='reto'&&inf.reto?inf.reto:inf.explore)(el);}
function retoState(id){return P.retos[id]||null;}
function retoHeader(id,intro){const r=retoState(id);return `<div class="reto-head"><div class="small"><b>🎯 Reto.</b> ${intro}</div>${r?`<span class="pill ${r.done?'good':'warn'}">Mejor: ${r.best}% · ${r.tries} intento(s)</span>`:''}</div>`;}
function retoResult(el,id,pct,okMsg,badMsg){const box=el.querySelector('.reto-msg')||el.appendChild(Object.assign(document.createElement('div'),{className:'reto-msg'}));box.className='reto-msg '+(pct>=80?'ok':'bad');box.innerHTML=`<b>${pct>=80?'✅ Reto superado':'❌ Aún no'} · ${pct}%</b><div class="small">${pct>=80?okMsg:badMsg}</div><div class="row" style="margin-top:6px"><button class="btn sm sec" onclick="mountInfo('${id}','reto',this.closest('#infoMount, .infohost'))">↻ Reintentar</button></div>`;retoDone(id,pct);}

/* ---- primitivas de reto ---- */
function sorterReto(el,cfg){
  const items=shuffle(cfg.items.map((it,i)=>Object.assign({i},it)));
  el.innerHTML=retoHeader(cfg.id,cfg.intro||'Arrastra cada tarjeta (o tócala y luego toca la caja) a la categoría correcta y comprueba.')+`<div class="pool" id="pool">${items.map(it=>`<div class="dragchip" draggable="true" data-i="${it.i}" data-b="${esc(it.b)}">${esc(it.t)}</div>`).join('')}</div><div class="buckets">${cfg.buckets.map(b=>`<div class="bucket" data-b="${esc(b.id)}"><h4>${b.emoji||''} ${esc(b.label)}</h4></div>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn" id="chk">Comprobar</button><span class="tiny muted" id="cnt"></span></div>`;
  let sel=null;const host=el;
  const cnt=()=>{const left=host.querySelectorAll('#pool .dragchip').length;host.querySelector('#cnt').textContent=left?left+' por ubicar':'Todas ubicadas: comprueba.';};
  const place=(chip,target)=>{target.appendChild(chip);chip.classList.remove('sel');sel=null;cnt();};
  host.querySelectorAll('.dragchip').forEach(c=>{c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text',c.dataset.i);c.classList.add('ghost');});c.addEventListener('dragend',()=>c.classList.remove('ghost'));c.addEventListener('click',()=>{if(host.dataset.locked)return;if(sel===c){c.classList.remove('sel');sel=null;return;}host.querySelectorAll('.dragchip.sel').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');sel=c;});});
  host.querySelectorAll('.bucket, #pool').forEach(b=>{b.addEventListener('dragover',e=>{e.preventDefault();b.classList.add('over');});b.addEventListener('dragleave',()=>b.classList.remove('over'));b.addEventListener('drop',e=>{e.preventDefault();b.classList.remove('over');if(host.dataset.locked)return;const chip=host.querySelector(`.dragchip[data-i="${e.dataTransfer.getData('text')}"]`);if(chip)place(chip,b);});b.addEventListener('click',e=>{if(sel&&!e.target.classList.contains('dragchip')&&!host.dataset.locked)place(sel,b);});});
  host.querySelector('#chk').addEventListener('click',()=>{const chips=host.querySelectorAll('.dragchip');let ok=0;chips.forEach(c=>{const b=c.closest('.bucket');const good=b&&b.dataset.b===c.dataset.b;c.classList.add(good?'ok':'bad');if(good)ok++;else if(b){c.title='Correcto: '+cfg.buckets.find(x=>x.id===c.dataset.b).label;c.innerHTML+=' <span class="tiny">→ '+esc(cfg.buckets.find(x=>x.id===c.dataset.b).label)+'</span>';}});host.dataset.locked='1';host.querySelector('#chk').disabled=true;host.querySelector('#cnt').textContent='';retoResult(host,cfg.id,Math.round(ok/chips.length*100),cfg.okMsg||'Clasificaste correctamente los elementos clave.',cfg.badMsg||'Las tarjetas en rojo muestran su categoría correcta. Revisa la lección y reinténtalo.');});
  cnt();
}
function orderReto(el,cfg){
  let cur;do{cur=shuffle(cfg.items.map((_,i)=>i));}while(cur.every((v,i)=>v===i));
  const draw=()=>{el.innerHTML=retoHeader(cfg.id,cfg.intro||'Ordena los elementos con las flechas y comprueba.')+`<div class="orderlist">${cur.map((oi,pos)=>`<div class="oi"><span class="n">${pos+1}</span><span>${esc(cfg.items[oi])}</span><span class="mv"><button class="btn ghost sm" data-m="${pos},-1" ${pos===0?'disabled':''}>▲</button><button class="btn ghost sm" data-m="${pos},1" ${pos===cur.length-1?'disabled':''}>▼</button></span></div>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn" id="chk">Comprobar orden</button></div>`;
    el.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('click',()=>{const [p,d]=b.dataset.m.split(',').map(Number);[cur[p],cur[p+d]]=[cur[p+d],cur[p]];draw();}));
    el.querySelector('#chk').addEventListener('click',()=>{let ok=0;el.querySelectorAll('.oi').forEach((row,pos)=>{const good=cur[pos]===pos;row.classList.add(good?'ok':'bad');if(good)ok++;});el.querySelectorAll('[data-m],#chk').forEach(b=>b.disabled=true);retoResult(el,cfg.id,Math.round(ok/cur.length*100),cfg.okMsg||'Secuencia correcta.',cfg.badMsg||'Las filas en rojo están fuera de lugar. Orden correcto: '+cfg.items.join(' → '));});};
  draw();
}
function matchReto(el,cfg){
  const rights=shuffle(cfg.pairs.map(p=>p[1]));
  el.innerHTML=retoHeader(cfg.id,cfg.intro||'Empareja cada elemento de la izquierda con su correspondiente y comprueba.')+`<div class="grid" style="gap:8px">${shuffle(cfg.pairs.map((p,i)=>i)).map(i=>`<div class="mrow"><div style="flex:1.2;font-size:.9rem"><b>${esc(cfg.pairs[i][0])}</b></div><select data-i="${i}"><option value="">— elige —</option>${rights.map(r=>`<option>${esc(r)}</option>`).join('')}</select></div>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn" id="chk">Comprobar</button></div>`;
  el.querySelector('#chk').addEventListener('click',()=>{let ok=0;el.querySelectorAll('select').forEach(s=>{const good=s.value===cfg.pairs[+s.dataset.i][1];s.style.borderColor=good?'var(--good)':'var(--bad)';s.style.background=good?'var(--good-soft)':'var(--bad-soft)';if(!good){const hint=document.createElement('div');hint.className='tiny';hint.style.color='var(--bad)';hint.textContent='Correcto: '+cfg.pairs[+s.dataset.i][1];s.parentElement.appendChild(hint);}if(good)ok++;s.disabled=true;});el.querySelector('#chk').disabled=true;retoResult(el,cfg.id,Math.round(ok/cfg.pairs.length*100),cfg.okMsg||'Emparejaste correctamente.',cfg.badMsg||'Revisa las respuestas en rojo y su corrección.');});
}
function slotReto(el,cfg){
  const pool=shuffle(cfg.slots.map(s=>s.answer).concat(cfg.distractors||[]));
  let sel=null;
  el.innerHTML=retoHeader(cfg.id,cfg.intro)+`<div class="slotrow" id="slots">${cfg.template.map(t=>t.slot!=null?`<span class="slot" data-s="${t.slot}" data-label="${esc(cfg.slots[t.slot].label)}">${esc(cfg.slots[t.slot].label)}</span>`:`<span>${esc(t.text)}</span>`).join(' ')}</div><div class="pool" id="pool" style="margin-top:10px">${pool.map((p,i)=>`<div class="dragchip" data-i="${i}" draggable="true">${esc(p)}</div>`).join('')}</div><div class="row" style="margin-top:10px"><button class="btn" id="chk">Comprobar</button><span class="tiny muted">Toca una tarjeta y luego el hueco (o arrástrala). Toca un hueco lleno para vaciarlo.</span></div>`;
  const chips=()=>el.querySelectorAll('#pool .dragchip');
  const fill=(slot,chip)=>{if(slot.dataset.chip){const old=el.querySelector(`.dragchip[data-i="${slot.dataset.chip}"]`);if(old){old.classList.remove('hidden');}}slot.dataset.chip=chip.dataset.i;slot.textContent=chip.textContent;slot.classList.add('filled');chip.classList.add('hidden');chip.classList.remove('sel');sel=null;};
  const empty=slot=>{if(!slot.dataset.chip)return;const c=el.querySelector(`.dragchip[data-i="${slot.dataset.chip}"]`);if(c)c.classList.remove('hidden');delete slot.dataset.chip;slot.textContent=slot.dataset.label;slot.classList.remove('filled');};

/* ---- Simulador de umbral ---- */
function umbralDecision(base,dig,nod,min,task){const avg=Math.round((dig+nod)/2);const gap=Math.abs(dig-nod);const mat=avg-base>=5;const issues=[];if(min>2)issues.push(['bad','Carga operativa: '+min.toFixed(1)+' min > 2 min sostenidos → no avanzar.']);if(gap>10)issues.push(['bad','Brecha de acceso: '+gap+' puntos > 10 → rediseñar el canal rezagado.']);if(task<8)issues.push(['warn','Comprensión: '+task+'/10 completan sin ayuda (< 8) → iterar el contenido.']);let verdict,kind;if(issues.some(i=>i[0]==='bad')){verdict=min>2?'Salvaguarda vulnerada: detener y rediseñar antes de continuar.':'Rediseñar por brecha de acceso antes de escalar.';kind='bad';}else if(avg>=80&&mat&&task>=8){verdict='Evidencia favorable: avanzar a una prueba más exigente o mayor fidelidad.';kind='good';}else if(avg>base){verdict='Mejora parcial: iterar el prototipo y repetir.';kind='gold';}else{verdict='No mejora: pivotar problema, solución o segmento; considerar detener.';kind='bad';}return {avg,gap,mat,issues,verdict,kind};}

 reto(el){matchReto(el,{id:'tipoproto',intro:'Empareja cada pregunta de aprendizaje con el prototipo recomendado.',pairs:PTYPES.map(p=>[p[0],p[1]])});}
};

/* ---- Fidelidad por dimensión ---- */
INFO.fidelidad={name:'Fidelidad por dimensión',desc:'Cuatro dimensiones independientes: visual, contenido, interacción y operación. Ajusta y observa costo y preguntas que puedes responder.',
 explore(el){const D={vis:20,con:40,int:30,ope:10};const L=[['vis','Visual (apariencia)'],['con','Contenido (textos y datos reales)'],['int','Interacción (respuesta a acciones)'],['ope','Operación (proceso real detrás)']];
  const draw=()=>{const avg=(D.vis+D.con+D.int+D.ope)/4;const cost=Math.round(avg*avg/100*10)/10;const lvl=avg<30?'Baja fidelidad':avg<55?'Media fidelidad':avg<80?'Alta fidelidad':'MVP / piloto';const qs=[];if(D.con>=30||D.vis>=30)qs.push('¿El problema y la propuesta se comprenden?');if(D.int>=40)qs.push('¿La interacción es comprensible?');if(D.ope>=40)qs.push('¿El flujo de servicio funciona?');if(D.ope>=60&&D.con>=50)qs.push('¿Una automatización sería útil? (Wizard of Oz)');if(D.vis>=70&&D.int>=70&&D.con>=70)qs.push('¿Usabilidad fina, tiempos y confianza?');if(avg>=80)qs.push('¿Genera valor en contexto real?');
    el.querySelector('#fdOut').innerHTML=`<svg class="svgbox" viewBox="0 0 320 240"><g transform="translate(160,120)">${[0.25,0.5,0.75,1].map(r=>`<polygon points="${[0,1,2,3].map(i=>{const a=-Math.PI/2+i*Math.PI/2;return (Math.cos(a)*90*r).toFixed(1)+','+(Math.sin(a)*90*r).toFixed(1);}).join(' ')}" fill="none" stroke="var(--line)"/>`).join('')}<polygon points="${['vis','con','int','ope'].map((k,i)=>{const a=-Math.PI/2+i*Math.PI/2;return (Math.cos(a)*90*D[k]/100).toFixed(1)+','+(Math.sin(a)*90*D[k]/100).toFixed(1);}).join(' ')}" fill="var(--teal)" opacity=".45" stroke="var(--teal)" stroke-width="2" style="transition:.3s"/><text x="0" y="-100" text-anchor="middle" font-size="11" fill="var(--ink2)">Visual</text><text x="108" y="4" text-anchor="middle" font-size="11" fill="var(--ink2)">Contenido</text><text x="0" y="112" text-anchor="middle" font-size="11" fill="var(--ink2)">Interacción</text><text x="-108" y="4" text-anchor="middle" font-size="11" fill="var(--ink2)">Operación</text></g></svg><div class="row"><span class="pill">${lvl}</span><span class="pill gold">Costo relativo ≈ ${cost}/10</span></div><div class="callout" style="margin-top:8px"><b>Preguntas que este prototipo puede responder</b>${qs.length?'<ul class="nice">'+qs.map(q=>'<li>'+q+'</li>').join('')+'</ul>':'<span class="muted">Muy poca fidelidad: sube alguna dimensión.</span>'}</div><div class="tiny muted">El costo crece de forma no lineal con la fidelidad: escala solo cuando la pregunta lo exige.</div>`;};
  el.innerHTML=`<div class="grid g2"><div>${L.map(l=>`<div class="sliderrow"><label>${l[1]}<input type="range" data-k="${l[0]}" min="0" max="100" value="${D[l[0]]}"></label><output data-o="${l[0]}">${D[l[0]]}%</output></div>`).join('')}</div><div id="fdOut"></div></div>`;
  el.querySelectorAll('input[type=range]').forEach(i=>i.addEventListener('input',()=>{D[i.dataset.k]=+i.value;el.querySelector(`[data-o="${i.dataset.k}"]`).textContent=i.value+'%';draw();}));draw();},
 reto(el){sorterReto(el,{id:'fidelidad',intro:'¿A qué dimensión de fidelidad corresponde cada decisión de diseño?',buckets:[{id:'vis',label:'Visual'},{id:'con',label:'Contenido'},{id:'int',label:'Interacción'},{id:'ope',label:'Operación'}],items:[{t:'Colores y tipografía definitivos',b:'vis'},{t:'Iconos y logotipo finales',b:'vis'},{t:'Textos reales en lugar de “lorem ipsum”',b:'con'},{t:'Lista de documentos con los requisitos verdaderos',b:'con'},{t:'Botones que responden al toque',b:'int'},{t:'Navegación entre pantallas',b:'int'},{t:'Una persona genera la lista detrás de escena',b:'ope'},{t:'Integración real con el sistema de citas',b:'ope'}]});}
};

/* ---- Errores frecuentes ---- */
const ERRS=[['Construir demasiado pronto','Apego, costo hundido y resistencia al cambio.','Prototipar la incertidumbre de mayor riesgo.'],['Preguntar “¿le gusta?”','Opinión cortés con poca capacidad predictiva.','Observar tarea y pedir ejemplos de conducta pasada.'],['Probar varias hipótesis a la vez','Resultado ambiguo.','Aislar la variable o declarar límites de atribución.'],['Cambiar el umbral después de ver datos','Sesgo de confirmación.','Registrar criterio antes de probar.'],['Confundir prototipo con MVP','Exposición prematura y mala medición.','Escalar fidelidad solo cuando la pregunta lo exige.']];
INFO.errores={name:'Errores frecuentes al prototipar',desc:'Voltea cada tarjeta. En el reto, empareja errores con su corrección.',
 explore(el){el.innerHTML=`<div class="grid g3">${ERRS.map(e=>`<div class="flip" onclick="this.classList.toggle('on')"><div class="inner"><div class="f"><div class="kicker" style="color:var(--bad)">Error</div><b>${e[0]}</b><div class="tiny muted" style="margin-top:8px">Toca para ver consecuencia y corrección</div></div><div class="b"><div class="tiny"><b>Consecuencia:</b> ${e[1]}</div><div class="tiny" style="margin-top:6px"><b>Corrección:</b> ${e[2]}</div></div></div></div>`).join('')}</div>`;},
 reto(el){matchReto(el,{id:'errores',intro:'Empareja cada error con su corrección.',pairs:ERRS.map(e=>[e[0],e[2]])});}
};

/* ---- Protocolo 15 min ---- */
const PROTO=[[0,2,'Explicar propósito, consentimiento, confidencialidad y que se evalúa el diseño, no a la persona.','Aceptación y preguntas iniciales.'],[2,3,'Presentar contexto y una tarea neutral. No describir la solución.','Comprensión de la tarea.'],[3,10,'Observar en silencio; preguntar “¿qué esperaba que ocurriera?” solo cuando sea necesario.','Ruta, tiempo, ayuda, errores, pausas, comentarios.'],[10,13,'Preguntar por interpretación, confianza, utilidad y alternativa actual.','Razones, comparaciones y objeciones.'],[13,15,'Cerrar, agradecer y verificar si existe malestar o dato que deba retirarse.','Consentimiento final y notas.']];
INFO.protocolo={name:'Protocolo de prueba de 15 minutos',desc:'Desliza el minutero y mira qué hace el facilitador y qué registra en cada momento.',
 explore(el){el.innerHTML=`<div class="sliderrow"><label>Minuto de la sesión<input type="range" id="pmin" min="0" max="15" step="0.5" value="5"></label><output id="pout">5:00</output></div><svg class="svgbox" viewBox="0 0 1000 90">${PROTO.map((p,i)=>{const x=20+p[0]/15*960,w=(p[1]-p[0])/15*960;return `<rect id="pb${i}" x="${x+1}" y="20" width="${w-2}" height="40" rx="8" fill="var(--teal-soft)" stroke="var(--teal)"/><text x="${x+w/2}" y="45" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${p[0]}–${p[1]}</text>`;}).join('')}<line id="pcur" x1="340" y1="10" x2="340" y2="70" stroke="var(--gold)" stroke-width="4" stroke-linecap="round"/><text x="20" y="82" font-size="11" fill="var(--ink3)">0 min</text><text x="980" y="82" text-anchor="end" font-size="11" fill="var(--ink3)">15 min</text></svg>${detailPanel('prD')}`;
  const upd=()=>{const m=+el.querySelector('#pmin').value;el.querySelector('#pout').textContent=Math.floor(m)+':'+(m%1?'30':'00');el.querySelector('#pcur').setAttribute('x1',20+m/15*960);el.querySelector('#pcur').setAttribute('x2',20+m/15*960);const i=PROTO.findIndex(p=>m>=p[0]&&m<p[1]);const k=i<0?4:i;PROTO.forEach((p,j)=>el.querySelector('#pb'+j).setAttribute('fill',j===k?'var(--gold-soft)':'var(--teal-soft)'));const p=PROTO[k];setDetail('prD','Minutos '+p[0]+'–'+p[1]+' · acción del facilitador',p[2]+'<div style="margin-top:4px"><b style="display:inline">Qué registrar:</b> '+p[3]+'</div>');};
  el.querySelector('#pmin').addEventListener('input',upd);upd();},
 reto(el){sorterReto(el,{id:'protocolo',intro:'Ubica cada acción o registro en el momento del protocolo al que pertenece.',buckets:PROTO.map((p,i)=>({id:String(i),label:p[0]+'–'+p[1]+' min'})),items:[{t:'Explicar que se evalúa el diseño, no a la persona',b:'0'},{t:'Registrar aceptación del consentimiento',b:'0'},{t:'Dar una tarea neutral sin describir la solución',b:'1'},{t:'Observar en silencio la ruta, pausas y errores',b:'2'},{t:'“¿Qué esperaba que ocurriera?” solo si es necesario',b:'2'},{t:'Preguntar por confianza, utilidad y alternativa actual',b:'3'},{t:'Registrar razones, comparaciones y objeciones',b:'3'},{t:'Verificar malestar o dato que deba retirarse',b:'4'}]});}
};

/* ---- Observación vs interpretación ---- */
INFO.obsint={name:'Observación o interpretación',desc:'“Leyó tres veces” no es igual a “estaba confundido”. Explora ejemplos y luego clasifica.',
 explore(el){const EX=[['Leyó tres veces la instrucción antes de tocar el botón.','Estaba confundido.'],['Tardó 48 segundos en encontrar la lista de documentos.','La lista es difícil de encontrar.'],['Dijo: “¿y esto lo tengo que imprimir?”','No confía en el canal digital.'],['Pidió ayuda dos veces durante la tarea.','La tarea es demasiado compleja.']];el.innerHTML=`<div class="grid g2">${EX.map(e=>`<div class="card soft"><div class="pill good">Observación</div><div style="margin:4px 0 8px">${e[0]}</div><div class="pill warn">Interpretación</div><div style="margin-top:4px">${e[1]}</div></div>`).join('')}</div><div class="callout"><b>Regla</b>Registra primero lo observable (conducta, tiempo, cita textual). La interpretación va en una columna separada y se contrasta con más casos.</div>`;},
 reto(el){sorterReto(el,{id:'obsint',intro:'Clasifica cada registro de una sesión de prueba.',buckets:[{id:'o',label:'Observación',emoji:'👁️'},{id:'i',label:'Interpretación',emoji:'💭'}],items:[{t:'Leyó tres veces la instrucción.',b:'o'},{t:'Tardó 48 segundos en encontrar la lista.',b:'o'},{t:'Preguntó “¿esto lo imprimo?”.',b:'o'},{t:'Retrocedió a la pantalla anterior dos veces.',b:'o'},{t:'No tocó el botón “confirmar lectura”.',b:'o'},{t:'Estaba confundido.',b:'i'},{t:'No confía en el canal digital.',b:'i'},{t:'La lista es difícil de encontrar.',b:'i'},{t:'Le pareció útil.',b:'i'},{t:'Prefiere el papel.',b:'i'}]});}
};

/* ---- Matriz de decisión ---- */
const DEC=[['Supera umbral y respeta salvaguardas','Evidencia favorable dentro del alcance de la prueba.','Avanzar a una prueba más exigente o mayor fidelidad.','good'],['Mejora parcial, con fallas identificables','Hipótesis aún plausible, diseño insuficiente.','Iterar el prototipo y repetir.','gold'],['No mejora o contradice mecanismo clave','Evidencia desfavorable.','Pivotar problema, solución o segmento; considerar detener.','bad'],['Datos ambiguos o prueba defectuosa','No permite inferir.','Corregir diseño de prueba; no declarar éxito ni fracaso.',''],['Genera daño, exclusión o riesgo no aceptable','Salvaguarda vulnerada.','Detener y rediseñar antes de continuar.','bad']];
INFO.decision={name:'Matriz de decisión previa',desc:'Elige el resultado de la prueba y observa la interpretación y la decisión acordadas de antemano.',
 explore(el){el.innerHTML=`<div class="optlist">${DEC.map((d,i)=>`<button class="opt node" data-i="${i}"><span class="k">${i+1}</span><span>${d[0]}</span></button>`).join('')}</div>${detailPanel('dcD')}`;
  el.querySelectorAll('.node').forEach(n=>n.addEventListener('click',()=>{el.querySelectorAll('.node').forEach(x=>x.classList.remove('sel'));n.classList.add('sel');const d=DEC[+n.dataset.i];setDetail('dcD','Interpretación: '+d[1],'<b style="display:inline">Decisión sugerida:</b> '+d[2],d[3]);}));},
 reto(el){matchReto(el,{id:'decision',intro:'Empareja cada resultado con la decisión que sugiere la matriz.',pairs:DEC.map(d=>[d[0],d[2]])});}
};

/* ---- Ciclo de evidencia (Figura 6) ---- */
const CYC=[['Hipótesis','#0d6e78','Afirmación refutable que orienta qué prototipar.'],['Prototipo','#2a78d6','La representación mínima que puede producir evidencia.'],['Evidencia','#c9950c','Conductas, métricas y citas registradas con un protocolo neutral.'],['Decisión','#a04a1c','Comparación con el umbral previo: avanzar, iterar, pivotar, detener o investigar.'],['Pregunta GQM','#4a8a2a','La siguiente incertidumbre que merece una prueba.']];
INFO.ciclo={name:'Ciclo de aprendizaje basado en evidencia',desc:'Toca cada nodo. En el centro, la pregunta de oro del equipo.',
 explore(el){const cx=500,cy=200,R=150;const pos=CYC.map((c,i)=>{const a=-Math.PI/2+i*2*Math.PI/5;return [cx+Math.cos(a)*R*1.5,cy+Math.sin(a)*R*0.85];});el.innerHTML=`<svg class="svgbox" viewBox="0 0 1000 400">${pos.map((p,i)=>{const q=pos[(i+1)%5];const mx=(p[0]+q[0])/2+(cx-(p[0]+q[0])/2)*-0.25,my=(p[1]+q[1])/2+(cy-(p[1]+q[1])/2)*-0.25;return `<path d="M ${p[0]} ${p[1]} Q ${mx} ${my} ${q[0]} ${q[1]}" fill="none" stroke="var(--teal)" stroke-width="3" marker-end="url(#arrCy)" style="stroke-dasharray:400;stroke-dashoffset:400;animation:dash 1.2s ${i*0.25}s ease-out forwards"/>`;}).join('')}<style>@keyframes dash{to{stroke-dashoffset:0}}</style><defs><marker id="arrCy" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="var(--teal)"/></marker></defs>${pos.map((p,i)=>`<g class="node" data-i="${i}"><circle class="nb" cx="${p[0]}" cy="${p[1]}" r="58" fill="${CYC[i][1]}" stroke="var(--bg2)" stroke-width="4"/><text x="${p[0]}" y="${p[1]+5}" text-anchor="middle" fill="#fff" font-weight="800" font-size="${CYC[i][0].length>9?13:16}">${CYC[i][0]}</text></g>`).join('')}<rect x="${cx-170}" y="${cy-42}" width="340" height="84" rx="14" fill="var(--bg2)" stroke="var(--line2)"/><text x="${cx}" y="${cy-12}" text-anchor="middle" font-weight="800" font-size="15" fill="var(--ink)">Pregunta de oro del equipo</text><text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="13" fill="var(--ink2)">¿Qué evidencia nos haría cambiar de opinión?</text></svg>${detailPanel('cyD')}`;
  el.querySelectorAll('.node').forEach(n=>n.addEventListener('click',()=>{const c=CYC[+n.dataset.i];setDetail('cyD',c[0],c[2]);}));},
 reto(el){orderReto(el,{id:'ciclo',intro:'Ordena el ciclo de aprendizaje empezando por la hipótesis.',items:CYC.map(c=>c[0])});}
};

/* ---- Plan de sprint ---- */
const SPRINTPLAN=[[0,5,'Elegir el supuesto más riesgoso y formular la pregunta de oro.','Riesgo y evidencia que cambiaría la opinión.'],[5,12,'Refinar la hipótesis con REFTA.','Hipótesis final y criterio de refutación.'],[12,20,'Construir Goal, Questions y Metrics.','Árbol GQM con umbrales.'],[20,32,'Crear el prototipo de menor fidelidad útil.','Prototipo ejecutable.'],[32,39,'Probar con otro equipo.','Registro de conductas, errores y citas.'],[39,43,'Interpretar contra el umbral.','Resultado: favorable, desfavorable o inconcluso.'],[43,45,'Preparar pitch.','Decisión y siguiente prueba.']];
INFO.sprintplan={name:'Sprint de 45 minutos',desc:'Toca cada bloque para ver acción y entregable. Desde “Hoja de evidencia” puedes correr el cronómetro real.',
 explore(el){el.innerHTML=`<svg class="svgbox" viewBox="0 0 1000 110">${SPRINTPLAN.map((s,i)=>{const x=20+s[0]/45*960,w=(s[1]-s[0])/45*960;return `<g class="node" data-i="${i}"><rect class="nb" x="${x+1}" y="20" width="${w-2}" height="44" rx="8" fill="${i%2?'var(--gold-soft)':'var(--teal-soft)'}" stroke="var(--teal)"/><text x="${x+w/2}" y="47" text-anchor="middle" font-size="12" font-weight="700" fill="var(--ink)">${s[0]}–${s[1]}</text></g>`;}).join('')}<text x="20" y="90" font-size="11" fill="var(--ink3)">0 min</text><text x="980" y="90" text-anchor="end" font-size="11" fill="var(--ink3)">45 min</text></svg>${detailPanel('spD')}<div class="row"><button class="btn sec sm" onclick="go('sprint')">🚀 Abrir mi hoja de evidencia</button></div>`;
  el.querySelectorAll('.node').forEach(n=>n.addEventListener('click',()=>{const s=SPRINTPLAN[+n.dataset.i];setDetail('spD','Minutos '+s[0]+'–'+s[1]+' · '+s[2],'<b style="display:inline">Entregable:</b> '+s[3]);}));}
};

/* ---- Rúbrica interactiva ---- */
INFO.rubrica={name:'Calculadora de la rúbrica',desc:'Elige un nivel por criterio y observa el puntaje ponderado.',
 explore(el){const crit=[['Comprensión del reto',20],['Hipótesis',20],['GQM',20],['Prototipo y prueba',25],['Aprendizaje y decisión',15]];const lv=[['Excelente',100],['Adecuado',60],['Insuficiente',20]];const S={};
  const draw=()=>{const sc=crit.reduce((a,[c,w])=>a+(S[c]||0)*w/100,0);const n=Object.keys(S).length;el.innerHTML=`<div class="tablewrap"><table class="t rubric"><thead><tr><th>Criterio</th><th>Peso</th><th>Nivel</th></tr></thead><tbody>${crit.map(([c,w])=>`<tr><td><b>${c}</b></td><td>${w}%</td><td>${lv.map(([l,v])=>`<button class="btn ghost sm ${S[c]===v?'on':''}" data-c="${c}" data-v="${v}">${l}</button>`).join('')}</td></tr>`).join('')}</tbody></table></div><div class="row"><div class="stat"><b>${n===5?Math.round(sc):'—'}</b><span>puntaje ponderado /100</span></div><div class="stat"><b>${n===5?(sc>=80?'Excelente':sc>=55?'Adecuado':'Insuficiente'):n+'/5'}</b><span>${n===5?'nivel global':'criterios valorados'}</span></div></div>`;el.querySelectorAll('[data-c]').forEach(b=>b.addEventListener('click',()=>{S[b.dataset.c]=+b.dataset.v;draw();}));};draw();}
};

/* ---- Lista de verificación ---- */
INFO.checklist={name:'Lista de verificación del equipo',desc:'Marca cada ítem. Se guarda en tu progreso.',
 explore(el){const draw=()=>{const all=[...CHECKLIST.before.map((t,i)=>['b'+i,t,'Antes de probar']),...CHECKLIST.after.map((t,i)=>['a'+i,t,'Después de probar'])];const n=all.filter(x=>P.diag['ck_'+x[0]]).length;el.innerHTML=`<div class="progressbar"><i style="width:${n/all.length*100}%"></i></div><div class="tiny muted" style="margin:4px 0 10px">${n}/${all.length} verificados</div><div class="grid g2">${['Antes de probar','Después de probar'].map(sec=>`<div class="card soft"><h4 style="margin:0 0 6px">${sec}</h4>${all.filter(x=>x[2]===sec).map(x=>`<label style="display:flex;gap:8px;align-items:flex-start;margin:6px 0;font-size:.9rem"><input type="checkbox" data-k="${x[0]}" ${P.diag['ck_'+x[0]]?'checked':''}> <span>${x[1]}</span></label>`).join('')}</div>`).join('')}</div>`;el.querySelectorAll('input').forEach(i=>i.addEventListener('change',()=>{P.diag['ck_'+i.dataset.k]=i.checked;save();draw();}));};draw();}
};
</script>
