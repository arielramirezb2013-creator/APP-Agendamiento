<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidencia Lab · Design Thinking, hipótesis, GQM y prototipado</title>
<style>
:root{
  color-scheme:light;
  --bg:#f6f4ef; --bg2:#ffffff; --bg3:#eeebe3; --line:#dcd8cd; --line2:#c9c4b6;
  --ink:#1c1c1a; --ink2:#4f4e49; --ink3:#7a786f;
  --teal:#0d6e78; --teal2:#0a5960; --teal-soft:#d9ecee; --teal-soft2:#bfdde0;
  --gold:#c9950c; --gold-soft:#f7ecc8; --gold2:#a87a06;
  --blue:#2a78d6; --orange:#eb6834; --aqua:#1baf7a; --yellow:#eda100; --violet:#4a3aa7; --magenta:#e87ba4;
  --good:#0ca30c; --good-soft:#e3f5e3; --warn:#fab219; --warn-soft:#fff3d6; --bad:#d03b3b; --bad-soft:#fbe4e4;
  --shadow:0 1px 2px rgba(20,20,10,.06),0 6px 18px rgba(20,20,10,.06);
  --r:14px; --r2:10px;
  --font:"Segoe UI",Inter,system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#171716; --bg2:#212120; --bg3:#2a2a28; --line:#3a3a37; --line2:#4a4a46;
    --ink:#f2f1ec; --ink2:#c3c2b7; --ink3:#8f8e85;
    --teal:#3aa7b3; --teal2:#63c1cb; --teal-soft:#123a3f; --teal-soft2:#1a4f55;
    --gold:#e2b33a; --gold-soft:#3c3110; --gold2:#f0c65a;
    --blue:#3987e5; --orange:#d95926; --aqua:#199e70; --yellow:#c98500; --violet:#9085e9; --magenta:#d55181;
    --good:#2fbf2f; --good-soft:#153a15; --warn:#fab219; --warn-soft:#3d3010; --bad:#e66767; --bad-soft:#3e1b1b;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#171716; --bg2:#212120; --bg3:#2a2a28; --line:#3a3a37; --line2:#4a4a46;
  --ink:#f2f1ec; --ink2:#c3c2b7; --ink3:#8f8e85;
  --teal:#3aa7b3; --teal2:#63c1cb; --teal-soft:#123a3f; --teal-soft2:#1a4f55;
  --gold:#e2b33a; --gold-soft:#3c3110; --gold2:#f0c65a;
  --blue:#3987e5; --orange:#d95926; --aqua:#199e70; --yellow:#c98500; --violet:#9085e9; --magenta:#d55181;
  --good:#2fbf2f; --good-soft:#153a15; --warn:#fab219; --warn-soft:#3d3010; --bad:#e66767; --bad-soft:#3e1b1b;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.5;font-size:15.5px;-webkit-font-smoothing:antialiased}
a{color:var(--teal)}
h1,h2,h3,h4{line-height:1.2;margin:0 0 .4em}
h1{font-size:1.9rem;letter-spacing:-.01em}
h2{font-size:1.35rem}
h3{font-size:1.1rem}
p{margin:.35em 0 .8em}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:var(--ink);background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal)}
textarea{width:100%;min-height:64px;resize:vertical}
.hidden{display:none!important}
.sr{position:absolute;left:-9999px}

/* ---- layout ---- */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg2) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.brand .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--teal),var(--gold));display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;box-shadow:var(--shadow)}
.brand b{font-size:1.05rem}
.brand small{display:block;color:var(--ink3);font-size:.72rem;margin-top:-3px}
.navchips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;flex-basis:100%;padding-bottom:2px;scrollbar-width:thin}
.navchips .chip{white-space:nowrap;flex:none}
.topbar .actions{margin-left:auto;display:flex;gap:6px}
.chip{border:1px solid var(--line2);background:var(--bg2);color:var(--ink2);border-radius:999px;padding:5px 11px;font-size:.82rem;display:inline-flex;align-items:center;gap:6px;transition:.15s}
.chip:hover{border-color:var(--teal);color:var(--teal)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.chip .dot.s1{background:var(--warn)} .chip .dot.s2{background:var(--aqua)} .chip .dot.s3{background:var(--good)}
.iconbtn{border:1px solid var(--line2);background:var(--bg2);border-radius:9px;width:36px;height:36px;display:grid;place-items:center;color:var(--ink2)}
.iconbtn:hover{border-color:var(--teal)}
main{max-width:1180px;margin:0 auto;padding:22px 16px 80px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.card.soft{background:var(--bg3);box-shadow:none}
.card.clicky{cursor:pointer;transition:.18s}
.card.clicky:hover{transform:translateY(-2px);border-color:var(--teal);box-shadow:0 10px 26px rgba(13,110,120,.14)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.muted{color:var(--ink3)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.kicker{text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;color:var(--teal);font-weight:700}
.kicker.gold{color:var(--gold2)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600;background:var(--teal-soft);color:var(--teal2)}
.pill.gold{background:var(--gold-soft);color:var(--gold2)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:#8a5a00}
.pill.gray{background:var(--bg3);color:var(--ink2)}
.btn{border:1px solid var(--teal);background:var(--teal);color:#fff;border-radius:10px;padding:9px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:.15s;text-decoration:none}
.btn:hover{background:var(--teal2);border-color:var(--teal2)}
.btn.sec{background:var(--bg2);color:var(--teal);border-color:var(--teal)}
.btn.sec:hover{background:var(--teal-soft)}
.btn.ghost{background:transparent;color:var(--ink2);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--teal);color:var(--teal)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1c1c1a}
.btn.gold:hover{background:var(--gold2);border-color:var(--gold2)}
.btn.sm{padding:6px 11px;font-size:.85rem;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stars{color:var(--gold);letter-spacing:1px;font-size:1rem}
.progressbar{height:8px;background:var(--bg3);border-radius:999px;overflow:hidden}
.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--aqua));border-radius:999px;transition:width .5s ease}
.hero{background:linear-gradient(135deg,var(--teal-soft) 0%,var(--bg2) 60%,var(--gold-soft) 100%);border:1px solid var(--line);border-radius:20px;padding:28px 28px;position:relative;overflow:hidden}
.hero h1{margin-bottom:6px}
.hero .idea{font-size:1.06rem;max-width:760px;color:var(--ink2)}
.callout{border-left:4px solid var(--teal);background:var(--teal-soft);border-radius:8px;padding:10px 14px;margin:12px 0;font-size:.95rem}
.callout.gold{border-color:var(--gold);background:var(--gold-soft)}
.callout.bad{border-color:var(--bad);background:var(--bad-soft)}
.callout.good{border-color:var(--good);background:var(--good-soft)}
.callout b:first-child{display:block;margin-bottom:2px}
table.t{width:100%;border-collapse:collapse;font-size:.9rem;margin:8px 0 14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:8px 9px;text-align:left;vertical-align:top}
table.t th{background:var(--bg3);font-weight:700;font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
table.t tr:hover td{background:color-mix(in srgb,var(--teal-soft) 40%,transparent)}
.tablewrap{overflow-x:auto}
ul.clean{list-style:none;padding:0;margin:0}
ul.nice{padding-left:20px;margin:.3em 0 .8em} ul.nice li{margin:.25em 0}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:12px;background:var(--bg3)}
.stat b{font-size:1.5rem;line-height:1.1}
.stat span{font-size:.78rem;color:var(--ink3)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;box-shadow:var(--shadow);transition:.25s;z-index:100;font-weight:600;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.floatpts{position:fixed;pointer-events:none;font-weight:800;color:var(--gold);z-index:99;animation:floatUp 1s ease-out forwards}
@keyframes floatUp{from{opacity:1;transform:translateY(0)}to{opacity:0;transform:translateY(-60px)}}
@keyframes pop{0%{transform:scale(.92);opacity:.4}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .25s ease-out}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .3s}
.fade{animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:98}

/* ---- module & lesson ---- */
.modhead{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap}
.modnum{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:1.3rem;color:#fff;flex:none}
.lesson-list{display:grid;gap:10px}
.lesson-item{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);cursor:pointer;transition:.15s}
.lesson-item:hover{border-color:var(--teal);transform:translateX(3px)}
.lesson-item .ico{width:38px;height:38px;border-radius:10px;background:var(--teal-soft);display:grid;place-items:center;font-size:1.1rem;flex:none}
.lesson-item .ico.done{background:var(--good-soft)}
.lesson-item .t{flex:1}
.lesson-item .t b{display:block}
.lesson-item .t span{font-size:.8rem;color:var(--ink3)}
.lessonnav{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.figure{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:14px 0}
.figure .cap{font-size:.8rem;color:var(--ink3);margin-top:8px;text-align:center}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:12px}
.tabs button{border:0;background:transparent;padding:8px 14px;border-bottom:2px solid transparent;color:var(--ink2);font-weight:600;border-radius:8px 8px 0 0}
.tabs button.on{color:var(--teal);border-bottom-color:var(--teal)}
.tabs button .badge{margin-left:6px}
.badge{display:inline-block;min-width:18px;padding:0 6px;border-radius:999px;font-size:.7rem;background:var(--gold);color:#1c1c1a;font-weight:800;text-align:center}
.badge.ok{background:var(--good);color:#fff}
.reto-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.reto-msg{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:.92rem}
.reto-msg.ok{background:var(--good-soft);border:1px solid var(--good)}
.reto-msg.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.reto-msg.info{background:var(--teal-soft);border:1px solid var(--teal)}

/* ---- interactive pieces ---- */
svg text{font-family:var(--font)}
.svgbox{width:100%;height:auto;display:block}
.node{cursor:pointer;transition:.15s}
.node:hover .nb{filter:brightness(1.08)}
.node.sel .nb{stroke:var(--gold);stroke-width:3}
.buckets{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:10px}
.bucket{border:2px dashed var(--line2);border-radius:12px;padding:10px;min-height:96px;background:var(--bg3);transition:.15s}
.bucket.over{border-color:var(--teal);background:var(--teal-soft)}
.bucket h4{margin:0 0 6px;font-size:.9rem;display:flex;align-items:center;gap:6px}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;padding:8px;border-radius:12px;background:var(--bg3);border:1px solid var(--line)}
.dragchip{background:var(--bg2);border:1px solid var(--line2);border-radius:10px;padding:7px 10px;font-size:.88rem;cursor:grab;user-select:none;box-shadow:var(--shadow);transition:.15s;display:inline-flex;align-items:center;gap:6px;max-width:100%}
.dragchip:hover{border-color:var(--teal)}
.dragchip.sel{outline:2px solid var(--gold);border-color:var(--gold)}
.dragchip.ok{border-color:var(--good);background:var(--good-soft)}
.dragchip.bad{border-color:var(--bad);background:var(--bad-soft)}
.dragchip.ghost{opacity:.4}
.slotrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;line-height:2.2}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:130px;min-height:38px;border:2px dashed var(--line2);border-radius:10px;padding:4px 10px;background:var(--bg3);font-weight:600;font-size:.9rem;cursor:pointer;transition:.15s}
.slot.over{border-color:var(--teal);background:var(--teal-soft)}
.slot.filled{border-style:solid;border-color:var(--teal);background:var(--teal-soft)}
.slot.ok{border-color:var(--good);background:var(--good-soft)}
.slot.bad{border-color:var(--bad);background:var(--bad-soft)}
.optlist{display:grid;gap:8px;margin-top:10px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border:1px solid var(--line2);border-radius:12px;background:var(--bg2);cursor:pointer;text-align:left;transition:.15s;width:100%}
.opt:hover{border-color:var(--teal);background:var(--teal-soft)}
.opt .k{width:26px;height:26px;border-radius:8px;background:var(--bg3);display:grid;place-items:center;font-weight:700;font-size:.8rem;flex:none}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.dim{opacity:.55}
.opt.sel{border-color:var(--gold);outline:2px solid var(--gold)}
.orderlist{display:grid;gap:6px}
.orderlist .oi{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--bg2)}
.orderlist .oi .n{width:24px;height:24px;border-radius:50%;background:var(--teal-soft);display:grid;place-items:center;font-size:.78rem;font-weight:700;flex:none}
.orderlist .oi .mv{margin-left:auto;display:flex;gap:4px}
.orderlist .oi.ok{border-color:var(--good);background:var(--good-soft)}
.orderlist .oi.bad{border-color:var(--bad);background:var(--bad-soft)}
.sliderrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:8px 0}
.sliderrow label{font-size:.88rem;font-weight:600}
.sliderrow output{font-variant-numeric:tabular-nums;font-weight:700;min-width:64px;text-align:right}
input[type=range]{width:100%;accent-color:var(--teal)}
.flip{perspective:900px;cursor:pointer;min-height:130px}
.flip .inner{position:relative;width:100%;height:100%;min-height:130px;transition:transform .5s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;padding:12px 14px;border:1px solid var(--line)}
.flip .f{background:var(--bg2)}
.flip .b{background:var(--gold-soft);transform:rotateY(180deg)}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:640px){.matchgrid{grid-template-columns:1fr}}
.mrow{display:flex;gap:8px;align-items:center}
.mrow select{flex:1}
.qcard{max-width:860px;margin:0 auto}
.qnum{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.qnum i{width:10px;height:10px;border-radius:50%;background:var(--line2);display:block}
.qnum i.ok{background:var(--good)} .qnum i.bad{background:var(--bad)} .qnum i.cur{background:var(--teal);transform:scale(1.3)}
.explain{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--bg3);border-left:4px solid var(--teal);font-size:.94rem}
.explain ol{margin:.3em 0 0 1.1em;padding:0}
.scorebig{font-size:3rem;font-weight:800;line-height:1;color:var(--teal)}
.mastery{display:grid;gap:6px}
.mastery .mrow2{display:grid;grid-template-columns:150px 1fr auto;gap:8px;align-items:center;font-size:.86rem}
.mastery .bar{height:9px;border-radius:999px;background:var(--bg3);overflow:hidden}
.mastery .bar i{display:block;height:100%;border-radius:999px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.78rem;padding:6px 9px;border-radius:8px;transform:translate(-50%,-115%);white-space:nowrap;z-index:10;opacity:0;transition:.12s}
.tip.show{opacity:1}
.rel{position:relative}
.sprint-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin:10px 0 16px}
.sprint-steps button{border:1px solid var(--line2);background:var(--bg2);border-radius:10px;padding:8px 6px;font-size:.78rem;font-weight:600;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px}
.sprint-steps button.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.sprint-steps button.done{border-color:var(--good)}
.sprint-steps button small{font-weight:400;opacity:.8}
.field{display:grid;gap:4px;margin:10px 0}
.field label{font-weight:600;font-size:.88rem}
.field .hint{font-size:.78rem;color:var(--ink3)}
.card input,.callout input{min-width:0;max-width:100%}
.grid input{width:100%}
.timerbox{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.3rem;color:var(--teal)}
.rubric td button{margin:2px}
.rubric td button.on{background:var(--gold);color:#1c1c1a;border-color:var(--gold)}
.keybar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--ink2)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media print{
  .topbar,.lessonnav,.btn,.iconbtn,.navchips{display:none!important}
  body{background:#fff;color:#000} main{max-width:none;padding:0} .card{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<canvas id="confetti"></canvas>
<div class="topbar"><div class="in">
  <div class="brand" onclick="go('home')"><div class="mark">EL</div><div><b>Evidencia Lab</b><small>Design Thinking · Hipótesis · GQM · Prototipado</small></div></div>
  <div class="actions"><button class="iconbtn" id="soundBtn" title="Sonido" onclick="toggleSound()">🔊</button>
  <button class="iconbtn" title="Tema claro/oscuro" onclick="toggleTheme()">◐</button></div>
  <div class="navchips" id="navchips"></div>
</div></div>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
/* ============================================================
   CONTENIDO DEL CURSO · derivado del manual
   "Curso práctico de Design Thinking, hipótesis, GQM y prototipado"
   ============================================================ */
function T(h,rows){return '<div class="tablewrap"><table class="t"><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+c+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';}
function CO(title,body,kind){return `<div class="callout ${kind||''}"><b>${title}</b>${body}</div>`;}
function UL(items){return '<ul class="nice">'+items.map(i=>'<li>'+i+'</li>').join('')+'</ul>';}

const CASE={
  name:'TurnoFácil',
  hmw:'¿Cómo podríamos ayudar a las personas a llegar preparadas y con menor incertidumbre, sin aumentar la carga del personal ni excluir a quienes tienen baja habilidad digital?',
  signals:[
    {s:'12 comentarios recientes mencionan espera e información contradictoria.',sug:'Existe fricción percibida.',no:'La frecuencia real ni la causa principal.'},

   body:()=>`<p><b>Idea central.</b> Innovar no es defender una idea; es reducir incertidumbre mediante evidencia. El curso conecta comprensión humana, hipótesis refutables, medición útil y prototipos diseñados para aprender.</p>

  {id:'m1l3',title:'El caso TurnoFácil: señales, reto y restricciones',minutes:8,info:'caso',
   body:()=>`<p><b>TurnoFácil</b> es un caso ficticio diseñado para el curso. Una red de centros de servicios profesionales recibe usuarios con cita y sin cita. Las personas reportan incertidumbre sobre tiempos de espera, repetición de datos y dificultad para saber qué documentos llevar. El equipo directivo propone una experiencia digital previa a la visita, pero <b>aún no sabe si ese es el problema prioritario</b> ni qué comportamiento debería cambiar.</p>

{id:'m2',num:2,short:'Design Thinking',title:'Design Thinking: qué es y cómo se trabaja',emoji:'💡',color:'#2a78d6',
 intro:'Una práctica centrada en las personas que alterna divergencia y convergencia mientras equilibra deseabilidad, factibilidad y viabilidad.',
 lessons:[
  {id:'m2l1',title:'Qué es Design Thinking: modos, no receta',minutes:7,info:'zigzag',
   body:()=>`<p>Design Thinking es una práctica de innovación centrada en las personas que combina mentalidades y métodos para explorar desafíos, generar alternativas, hacer tangibles ideas y aprender mediante iteraciones. Su valor no reside en seguir cinco cajas de forma rígida, sino en <b>alternar divergencia y convergencia</b> mientras se equilibran deseabilidad humana, factibilidad técnica y viabilidad organizacional.</p>
   <p>IDEO describe el enfoque como una forma de crear productos, servicios y estrategias equilibrando necesidades humanas, factibilidad y viabilidad. Stanford d.school presenta cinco modos de trabajo (empatizar, definir, idear, prototipar y probar) y aclara que sus herramientas pueden emplearse de forma flexible.</p>
   ${CO('Mensaje clave','“Las fases son modos iterativos, no una receta lineal.” La evidencia de una prueba puede cambiar la definición del problema, las ideas y el prototipo.')}`},
  {id:'m2l2',title:'Las cinco prácticas y su evidencia de salida',minutes:8,info:'zigzag',
   body:()=>T(['Modo','Pregunta guía','Técnicas rápidas','Evidencia de salida'],[
     ['Empatizar','¿Qué intenta lograr la persona y qué obstaculiza su avance?','Entrevista, observación, recorrido, caso extremo.','Hechos, citas, comportamientos y tensiones; no opiniones del equipo.'],
     ['Definir','¿Qué necesidad merece atención ahora?','Agrupación temática, insight, punto de vista, HMW.','Necesidad específica vinculada a un usuario y contexto.'],
     ['Idear','¿Qué alternativas podrían producir el cambio?','Brainwriting, “peor idea”, analogías, matriz impacto-esfuerzo.','Varias opciones y criterio explícito de selección.'],
     ['Prototipar','¿Qué debe hacerse tangible para aprender?','Storyboard, papel, role-play, Wizard of Oz, clickable.','Representación suficiente para ejecutar una tarea o provocar una reacción.'],
     ['Probar','¿Qué ocurre cuando el usuario intenta usarla?','Tarea, observación, think-aloud moderado, entrevista posterior.','Comportamientos, errores, comprensión y decisión de iteración.']])+'<p class="small muted">Usa la infografía: en <b>Explorar</b> toca cada modo; en <b>Reto</b> asigna cada técnica al modo correcto.</p>'},
  {id:'m2l3',title:'Tres lentes de una innovación',minutes:6,info:'lentes',
   body:()=>T(['Lente','Pregunta','Error frecuente'],[

  {id:'m2l4',title:'Actividad 1 · Del insight a la pregunta HMW',minutes:10,info:'hmw',
   body:()=>`<p>En equipos, separen hechos, interpretaciones y vacíos del caso TurnoFácil. Elijan un <b>usuario prioritario</b> y describan una situación concreta, no un segmento demográfico genérico.</p>

   ${CO('Criterio de calidad','Una buena pregunta HMW es suficientemente amplia para admitir alternativas y suficientemente delimitada para orientar acción. <b>No debe contener una solución encubierta.</b>','gold')}`}
 ],

/* ---------------- M3 ---------------- */
{id:'m3',num:3,short:'Hipótesis',title:'Hipótesis para investigación e innovación',emoji:'🔬',color:'#4a3aa7',
 intro:'Una hipótesis convierte supuestos en afirmaciones específicas, refutables y decidibles. Aquí aprenderás a distinguirla de preguntas y supuestos, a tipificarla y a priorizarla por riesgo.',
 lessons:[
  {id:'m3l1',title:'Qué es una hipótesis y su anatomía',minutes:8,info:'anatomia',
   body:()=>`<p>Una hipótesis es una <b>afirmación provisional, específica y comprobable</b> que predice una relación, un comportamiento o un resultado. En investigación formal suele relacionar variables y orientar el diseño del estudio; en innovación convierte supuestos sobre problema, valor, uso, factibilidad o viabilidad en decisiones que pueden contrastarse con evidencia.</p>
   <p>La literatura metodológica enfatiza que una hipótesis útil debe apoyarse en evidencia previa, poder probarse con un diseño pertinente y <b>admitir resultados que la respalden o la refuten</b>.</p>
   ${CO('Plantilla','Creemos que <b>[segmento + problema]</b>, y que si <b>[acción / solución]</b> entonces <b>[resultado]</b>. Lo sabremos cuando <b>[métrica operacional]</b> alcance <b>[umbral]</b> en <b>[plazo / muestra]</b>.')}`},
  {id:'m3l2',title:'Pregunta, supuesto, hipótesis, predicción y decisión',minutes:7,info:'clasif',
   body:()=>T(['Elemento','Ejemplo','Tratamiento'],[
     ['Pregunta','¿Las personas llegan con documentación incompleta por falta de claridad?','Abre una indagación.'],
     ['Supuesto','Los usuarios no leen las instrucciones actuales.','Debe hacerse explícito y priorizarse por riesgo.'],
     ['Hipótesis','Si los usuarios reciben una lista personalizada 24 horas antes, la proporción que llega con documentos completos aumentará del nivel base a por lo menos 80%.','Se prueba con medida, umbral, plazo y criterio de decisión.'],
     ['Predicción','El grupo expuesto completará más trámites en el primer intento.','Es el resultado esperado de la hipótesis.'],
     ['Decisión','Si no se alcanza 80% o aparecen barreras de acceso, se revisará el contenido y el canal antes de desarrollar.','Define qué ocurre después.']])},
  {id:'m3l3',title:'Tipos de hipótesis en innovación',minutes:7,info:'tipos',
   body:()=>T(['Tipo','Pregunta central','Ejemplo TurnoFácil'],[
     ['Problema','¿El problema existe, importa y tiene la causa supuesta?','La incertidumbre sobre requisitos explica una parte material de la documentación incompleta.'],
     ['Valor','¿La propuesta produce un beneficio que el usuario reconoce?','Una lista personalizada reduce esfuerzo percibido y aumenta preparación.'],
     ['Usabilidad','¿La persona comprende y completa la tarea?','Al menos 8 de 10 participantes identifican documentos y confirman lectura sin ayuda.'],
     ['Factibilidad','¿La organización puede entregarla de forma fiable?','El personal puede generar la lista con datos ya disponibles en menos de dos minutos.'],
     ['Viabilidad','¿El beneficio justifica costo, riesgo y operación?','La reducción de reprocesos compensa el costo operativo mensual sin excluir canales alternos.'],
     ['Adopción','¿La persona incorpora la solución en su comportamiento?','Al menos 60% de usuarios abre la lista antes de su cita.']])},
  {id:'m3l4',title:'Criterios de calidad: REFTA',minutes:7,info:'refta',
   body:()=>T(['Criterio','Pregunta de control'],[
     ['<b>R</b>elevante','¿La respuesta cambiará una decisión importante?'],
     ['<b>E</b>specífica','¿Identifica usuario, contexto, intervención o relación y resultado?'],
     ['<b>F</b>alsable','¿Existe un resultado posible que obligaría a rechazarla o revisarla?'],
     ['<b>T</b>razable','¿Se conecta con evidencia previa, una pregunta y una métrica?'],
     ['<b>A</b>ccionable','¿Se definió qué hacer si se confirma, contradice o queda inconclusa?']])+CO('Pregunta de oro','¿Qué evidencia nos haría cambiar de opinión? Si no puedes escribir un resultado que contradiga la hipótesis, todavía no es refutable.','gold')},
  {id:'m3l5',title:'Actividad 2 · Priorizar supuestos por riesgo',minutes:10,info:'matriz',
   body:()=>`${UL(['Liste cinco supuestos del reto y clasifíquelos por <b>impacto si son falsos</b> e <b>incertidumbre actual</b>.','Seleccione el supuesto de mayor riesgo, <b>no el más fácil de medir</b>.','Redacte la hipótesis con segmento, cambio esperado, métrica, umbral y plazo.','Escriba un resultado que la contradiga. Si no puede hacerlo, todavía no es refutable.','Responda la pregunta de oro: ¿qué evidencia nos haría cambiar de opinión?'])}
   <p><b>Prioridad = impacto × incertidumbre</b> (cada uno de 1 a 5). El supuesto con mayor prioridad es el que merece la primera prueba.</p>`}
 ],
 quiz:[
  {topic:'Anatomía',type:'mc',q:'¿Qué componente falta en esta hipótesis? “Si enviamos una lista personalizada, más personas llegarán con documentos completos.”',opts:['Segmento y acción','Métrica, umbral y plazo','Resultado esperado','Ninguno, está completa'],a:1,why:'Tiene acción y resultado, pero no dice cómo se medirá, qué umbral activa la decisión ni en qué plazo o muestra.',steps:['Lo sabremos cuando… (métrica) → falta.','Alcance… (umbral) → falta.','En… (plazo/muestra) → falta.']},
  {topic:'Clasificación',type:'mc',q:'“El grupo expuesto completará más trámites en el primer intento” es…',opts:['Una pregunta','Un supuesto','Una predicción','Una decisión'],a:2,why:'Es el resultado esperado de la hipótesis: una predicción.'},
  {topic:'Clasificación',type:'mc',q:'“Si no se alcanza 80% o aparecen barreras de acceso, se revisará el contenido y el canal antes de desarrollar” es…',opts:['Una hipótesis','Una decisión','Una predicción','Un supuesto'],a:1,why:'Define qué ocurre después según el resultado: es la decisión asociada.'},
  {topic:'Tipos',type:'mc',q:'“Al menos 60% de usuarios abre la lista antes de su cita” es una hipótesis de…',opts:['Problema','Usabilidad','Adopción','Factibilidad'],a:2,why:'Pregunta si la persona incorpora la solución en su comportamiento: adopción.'},
  {topic:'Tipos',type:'mc',q:'“El personal puede generar la lista con datos ya disponibles en menos de dos minutos” es una hipótesis de…',opts:['Valor','Factibilidad','Viabilidad','Adopción'],a:1,why:'Pregunta si la organización puede entregarla de forma fiable: factibilidad.'},
  {topic:'REFTA',type:'mc',q:'Una hipótesis que no admite ningún resultado capaz de contradecirla falla el criterio…',opts:['Relevante','Específica','Falsable','Accionable'],a:2,why:'Falsable: debe existir un resultado posible que obligue a rechazarla o revisarla.'},
  {topic:'REFTA',type:'mc',q:'¿Qué criterio REFTA pregunta si se definió qué hacer si la hipótesis se confirma, se contradice o queda inconclusa?',opts:['Trazable','Accionable','Relevante','Específica'],a:1,why:'Accionable: la hipótesis debe conducir a una decisión en cada escenario.'},
  {topic:'Priorización',type:'mc',q:'Un supuesto tiene impacto 5 si es falso e incertidumbre 4. Otro tiene impacto 3 e incertidumbre 5. ¿Cuál se prueba primero?',opts:['El primero (prioridad 20)','El segundo (prioridad 15)','Cualquiera, son iguales','El más fácil de medir'],a:0,why:'Prioridad = impacto × incertidumbre. 5×4 = 20 > 3×5 = 15. Se elige el de mayor riesgo, no el más fácil de medir.',steps:['Supuesto A: 5 × 4 = 20.','Supuesto B: 3 × 5 = 15.','20 > 15 → probar A primero.']},
  {topic:'Pregunta de oro',type:'tf',q:'La “pregunta de oro” (¿qué evidencia nos haría cambiar de opinión?) sustituye al marco GQM.',a:false,why:'Falso. Es un recurso didáctico adicional que no sustituye el marco Goal–Question–Metric.'},
  {topic:'Actividad 2',type:'mc',q:'Al elegir qué supuesto probar primero, el curso recomienda…',opts:['El más fácil de medir','El de mayor riesgo','El que propuso la dirección','El que ya tiene datos'],a:1,why:'Seleccione el supuesto de mayor riesgo, no el más fácil de medir.'}
 ]},

/* ---------------- M4 ---------------- */
{id:'m4',num:4,short:'GQM',title:'Goal–Question–Metric (GQM)',emoji:'🎯',color:'#1baf7a',
 intro:'Medir con propósito: primero el objetivo, luego las preguntas y solo al final las métricas. El orden evita elegir indicadores por disponibilidad o moda.',
 lessons:[
  {id:'m4l1',title:'La jerarquía Goal → Question → Metric',minutes:7,info:'arbol',
   body:()=>`<p>GQM es un enfoque jerárquico para diseñar medición con propósito. Primero declara el <b>objetivo</b>; luego formula <b>preguntas</b> que caracterizan y evalúan ese objetivo; finalmente asigna <b>métricas</b> objetivas o subjetivas capaces de responder cada pregunta. El orden evita seleccionar indicadores por disponibilidad o moda.</p>
   <p>El artículo original de Basili, Caldiera y Rombach define los niveles conceptual (Goal), operacional (Question) y cuantitativo (Metric), e indica que los datos deben interpretarse respecto de objetivos explícitos.</p>
   ${CO('Mensaje clave','“No empiecen por la métrica.” Una métrica solo es útil si responde una pregunta y permite una decisión previamente acordada.')}`},
  {id:'m4l2',title:'Cómo formular el Goal',minutes:6,info:'goal',
   body:()=>`<p><b>Plantilla:</b> Analizar <b>[objeto]</b> con el propósito de <b>[comprender/evaluar/mejorar]</b> respecto de <b>[asunto de calidad o resultado]</b>, desde el punto de vista de <b>[stakeholder]</b>, en el contexto de <b>[entorno y periodo]</b>.</p>
   ${CO('Ejemplo TurnoFácil','Analizar la experiencia de preparación previa a la cita con el propósito de mejorar la completitud documental y reducir incertidumbre, desde el punto de vista de usuarios y personal de atención, durante un piloto de dos semanas en un centro.','gold')}`},
  {id:'m4l3',title:'Cómo derivar Questions',minutes:5,info:'arbol',
   body:()=>UL(['<b>Caracterización:</b> ¿qué ocurre hoy y con qué variación? (línea base)','<b>Efecto:</b> ¿qué cambia después de exponer a la persona al prototipo?','<b>Experiencia:</b> ¿la solución es comprensible, accesible y aceptable?','<b>Riesgo o efecto no deseado:</b> ¿qué podría empeorar o excluir? (salvaguarda)'])+'<p>Redacta de tres a cuatro preguntas: línea base, efecto, experiencia y salvaguarda.</p>'},
  {id:'m4l4',title:'Cómo especificar Metrics: la ficha de métrica',minutes:8,info:'metrica',
   body:()=>T(['Campo','Definición','Ejemplo'],[
     ['Nombre','Etiqueta inequívoca.','Tasa de preparación completa.'],
     ['Definición operacional','Qué cuenta y qué no cuenta.','Cita con todos los documentos obligatorios al inicio de la atención.'],
     ['Fórmula','Numerador, denominador y unidad.','Citas completas / citas observadas × 100.'],
     ['Fuente','Origen y responsable.','Lista de verificación del orientador.'],
     ['Frecuencia','Momento de captura.','Cada cita durante dos semanas.'],
     ['Segmentación','Grupos que deben compararse.','Canal digital/no digital; primera visita/recurrente.'],
     ['Umbral','Valor que activa una decisión.','≥80% y sin brecha mayor de 10 puntos entre canales.'],
     ['Salvaguarda','Condición que no debe deteriorarse.','Tiempo adicional del personal ≤2 minutos por usuario.']])},
  {id:'m4l5',title:'Métricas de vanidad y ejemplo GQM completo',minutes:8,info:'vanidad',
   body:()=>T(['Pregunta','Métrica principal','Regla de interpretación'],[
     ['¿Cuál es la línea base de preparación completa?','Porcentaje de citas con documentación completa.','Sirve de comparación; no se atribuye causalidad.'],
     ['¿El prototipo mejora la preparación?','Cambio absoluto frente a línea base o comparación equivalente.','Señal favorable si alcanza ≥80% y mejora de forma material.'],
     ['¿Las personas comprenden qué deben llevar?','Éxito de tarea sin ayuda + errores críticos.','Avanzar si ≥8/10 completan y no hay error crítico repetido.'],
     ['¿La solución aumenta carga operativa?','Minutos de personal por cita.','No avanzar si supera dos minutos sostenidos.'],
     ['¿Existen brechas de acceso?','Resultados desagregados por canal y necesidad de apoyo.','Rediseñar si la brecha supera 10 puntos porcentuales.']])+CO('Prueba rápida','Si el equipo mejora la métrica, ¿puede afirmar razonablemente que creó valor? Si la respuesta es no, probablemente se trata de una <b>métrica de actividad o vanidad</b>.','gold')},
  {id:'m4l6',title:'Simulador: umbrales, brechas y salvaguardas',minutes:8,info:'umbral',
   body:()=>`<p>Las reglas de interpretación deben acordarse <b>antes</b> de ver los datos. Con el simulador puedes mover la línea base, el resultado por canal y la carga del personal, y ver qué decisión activan las reglas del ejemplo TurnoFácil.</p>${UL(['Señal favorable si la preparación completa alcanza <b>≥80%</b> y mejora de forma material frente a la línea base.','Rediseñar si la <b>brecha entre canales</b> supera 10 puntos porcentuales.','No avanzar si el tiempo adicional del personal supera <b>2 minutos</b> por usuario.'])}`}
 ],
 quiz:[
  {topic:'Jerarquía',type:'order',q:'Ordena los niveles del marco GQM según el orden en que deben definirse.',opts:['Goal (objetivo)','Question (pregunta)','Metric (métrica)'],a:[0,1,2],why:'Primero el objetivo, luego las preguntas que lo caracterizan y por último las métricas que las responden. Empezar por la métrica es el error a evitar.'},
  {topic:'Goal',type:'multi',q:'¿Qué elementos debe incluir el Goal según la plantilla? (selecciona todos)',opts:['Objeto y propósito','Asunto de calidad o resultado','Punto de vista (stakeholder)','Fórmula de la métrica'],a:[0,1,2],why:'El Goal incluye objeto, propósito, asunto, punto de vista y contexto. La fórmula pertenece a la ficha de métrica.'},
  {topic:'Questions',type:'mc',q:'“¿Qué podría empeorar o excluir?” corresponde a la pregunta de tipo…',opts:['Caracterización','Efecto','Experiencia','Riesgo o efecto no deseado'],a:3,why:'Es la pregunta de salvaguarda: riesgo o efecto no deseado.'},
  {topic:'Métricas',type:'mc',q:'En la ficha de métrica, “qué cuenta y qué no cuenta” corresponde al campo…',opts:['Fórmula','Definición operacional','Fuente','Umbral'],a:1,why:'La definición operacional delimita qué cuenta y qué no. La fórmula es numerador, denominador y unidad.'},
  {topic:'Métricas',type:'mc',q:'Se observaron 50 citas y 41 llegaron con todos los documentos obligatorios. ¿Cuál es la tasa de preparación completa?',opts:['41%','82%','50%','9%'],a:1,why:'Citas completas / citas observadas × 100 = 41 / 50 × 100 = 82%.',steps:['Numerador: 41 citas completas.','Denominador: 50 citas observadas.','41 ÷ 50 = 0,82 → 82%.']},
  {topic:'Umbral',type:'mc',q:'Canal digital: 85% de preparación completa. Canal no digital: 70%. Umbral ≥80% y brecha máxima de 10 puntos. ¿Qué decisión sugiere la regla?',opts:['Avanzar: el digital superó el umbral','Rediseñar: la brecha entre canales es de 15 puntos','Detener el piloto','Cambiar el umbral a 70%'],a:1,why:'La brecha 85 − 70 = 15 puntos supera los 10 permitidos: la regla indica rediseñar por brecha de acceso.',steps:['Brecha = 85 − 70 = 15 puntos.','15 > 10 → se vulnera la regla de equidad entre canales.','La decisión previa era rediseñar si la brecha supera 10 puntos.']},
  {topic:'Salvaguarda',type:'mc',q:'¿Qué es una salvaguarda en GQM?',opts:['La métrica principal del objetivo','Una condición que no debe deteriorarse mientras se busca el resultado principal','Un indicador de vanidad','El plazo de la prueba'],a:1,why:'La salvaguarda es una métrica o condición que no debe deteriorarse (por ejemplo, tiempo adicional del personal ≤2 minutos).'},
  {topic:'Vanidad',type:'mc',q:'¿Cuál de estas métricas es más probablemente de vanidad para TurnoFácil?',opts:['Porcentaje de citas con documentación completa','Número de descargas de la app','Minutos de personal por cita','Éxito de tarea sin ayuda'],a:1,why:'Las descargas no representan valor para el usuario ni una decisión: pueden crecer sin que nadie llegue mejor preparado.',steps:['Prueba rápida: si suben las descargas, ¿creamos valor? No necesariamente.','Las otras tres responden preguntas de efecto, salvaguarda y experiencia.']},
  {topic:'Interpretación',type:'tf',q:'La línea base sirve de comparación y no permite atribuir causalidad por sí sola.',a:true,why:'Verdadero. La línea base caracteriza qué ocurre hoy; la causalidad requiere una comparación equivalente.'},
  {topic:'Depuración',type:'mc',q:'¿Qué debe hacerse con una métrica que no permite responder una pregunta ni tomar una decisión?',opts:['Conservarla por si acaso','Eliminarla','Convertirla en Goal','Asignarle un umbral'],a:1,why:'Elimine toda métrica que no permita responder una pregunta o tomar una decisión.'}
 ]},

/* ---------------- M5 ---------------- */
{id:'m5',num:5,short:'Prototipos',title:'Prototipos: propósito, estructura y expectativas',emoji:'🧩',color:'#eb6834',
 intro:'Un prototipo es una representación deliberadamente incompleta creada para responder una pregunta de aprendizaje antes de asumir el costo de construir.',
 lessons:[
  {id:'m5l1',title:'Qué es un prototipo y la escalera de fidelidad',minutes:8,info:'escalera',
   body:()=>`<p>Un prototipo es una representación deliberadamente incompleta de una solución, creada para responder una <b>pregunta de aprendizaje</b> antes de asumir el costo de construir el producto, servicio o proceso completo. No tiene que parecer final; debe permitir que una persona realice una tarea, reaccione ante una propuesta o revele una limitación.</p>
   <p>Nielsen Norman Group define el prototipo de interfaz como una hipótesis de solución y recomienda probarlo observando a usuarios; la fidelidad puede variar en interacción, apariencia y contenido según la pregunta y los recursos.</p>
   ${CO('Principio','No existe una fidelidad “correcta” en abstracto: existe la fidelidad adecuada para la pregunta de aprendizaje. Invierte detalle solo para responder la siguiente pregunta.','gold')}`},
  {id:'m5l2',title:'Qué se espera de cada nivel',minutes:8,info:'escalera',
   body:()=>T(['Nivel','Qué se construye','Qué se espera aprender','Criterio para avanzar','No se espera'],[
     ['Baja fidelidad','Boceto, storyboard, mapa de servicio, guion o maqueta de papel.','Comprensión de propuesta, secuencia, necesidades faltantes y primeras reacciones.','La propuesta se entiende; los riesgos conceptuales principales están identificados.','Estética final, integración o rendimiento real.'],
     ['Media fidelidad','Wireframe, flujo navegable simple, role-play o Wizard of Oz.','Arquitectura, pasos, lenguaje, puntos de error y operación de soporte.','La mayoría completa tareas críticas; no persisten fallas estructurales.','Código de producción ni contenido exhaustivo.'],
     ['Alta fidelidad','Prototipo clickable, maqueta física detallada o simulación cercana.','Usabilidad fina, jerarquía, contenido, interacción, tiempos y confianza.','Se alcanzan umbrales de tarea y las fallas restantes son corregibles.','Escalabilidad, rentabilidad o valor sostenido por sí solos.'],
     ['MVP / piloto','Entrega limitada con valor real y operación controlada.','Uso real, disposición a adoptar, factibilidad operacional y señales de viabilidad.','Valor y salvaguardas alcanzan umbrales; existe plan de escalamiento.','Producto completo ni prueba definitiva de mercado.']])},
  {id:'m5l3',title:'Tipos según lo que se quiere probar',minutes:7,info:'tipoproto',
   body:()=>T(['Pregunta de aprendizaje','Prototipo recomendado','Evidencia esperada'],[
     ['¿El problema y la propuesta se comprenden?','Storyboard, concept card, landing page falsa claramente ética.','Paráfrasis, relevancia, objeciones y prioridades.'],
     ['¿El flujo de servicio funciona?','Role-play, service walkthrough, blueprint simplificado.','Handoffs, esperas, roles, excepciones y carga.'],
     ['¿La interacción es comprensible?','Papel, wireframe o clickable.','Éxito de tarea, errores, tiempo, ayuda y comentarios.'],
     ['¿Una automatización o IA sería útil?','Wizard of Oz con intervención humana detrás.','Calidad percibida, confianza, casos límite y necesidades de supervisión.'],
     ['¿Puede construirse técnicamente?','Prueba de concepto técnica.','Rendimiento, integración, seguridad y limitaciones.'],
     ['¿Genera valor en contexto real?','MVP o piloto acotado.','Uso repetido, resultado real, costo y efectos no deseados.']])},
  {id:'m5l4',title:'Ficha de prototipo y fidelidad por dimensión',minutes:7,info:'fidelidad',
   body:()=>`<p><b>Estructura mínima de una ficha de prototipo:</b></p>${UL(['<b>Nombre y versión:</b> identifica la iteración.','<b>Hipótesis y pregunta GQM:</b> explica por qué existe.','<b>Usuarios, contexto y tarea:</b> define quién hará qué y dónde.','<b>Alcance simulado y real:</b> evita engañar a participantes y stakeholders.','<b>Fidelidad por dimensión:</b> visual, contenido, interacción y operación.','<b>Guion de prueba:</b> instrucción neutral, sin enseñar cómo resolver.','<b>Captura de evidencia:</b> observaciones, métricas, citas y fallas.','<b>Umbral y decisión:</b> perseverar, iterar, pivotar, detener o investigar más.'])}<p>Usa los deslizadores para ver cómo cada dimensión de fidelidad cambia el costo y qué preguntas puede responder el prototipo.</p>`},
  {id:'m5l5',title:'Errores frecuentes',minutes:6,info:'errores',
   body:()=>T(['Error','Consecuencia','Corrección'],[
     ['Construir demasiado pronto','Apego, costo hundido y resistencia al cambio.','Prototipar la incertidumbre de mayor riesgo.'],
     ['Preguntar “¿le gusta?”','Opinión cortés con poca capacidad predictiva.','Observar tarea y pedir ejemplos de conducta pasada.'],
     ['Probar varias hipótesis a la vez','Resultado ambiguo.','Aislar la variable o declarar límites de atribución.'],
     ['Cambiar el umbral después de ver datos','Sesgo de confirmación.','Registrar criterio antes de probar.'],
     ['Confundir prototipo con MVP','Exposición prematura y mala medición.','Escalar fidelidad solo cuando la pregunta lo exige.']])}
 ],
 quiz:[
  {topic:'Definición',type:'mc',q:'¿Para qué existe un prototipo, según el curso?',opts:['Para impresionar a la dirección','Para responder una pregunta de aprendizaje antes de asumir el costo de construir','Para demostrar que la idea es buena','Para reemplazar la investigación con usuarios'],a:1,why:'Es una representación deliberadamente incompleta creada para responder una pregunta de aprendizaje antes de construir.'},
  {topic:'Niveles',type:'mc',q:'¿Qué se espera aprender con un prototipo de baja fidelidad?',opts:['Usabilidad fina, tiempos y confianza','Uso real y disposición a adoptar','Comprensión de la propuesta, secuencia y primeras reacciones','Rendimiento e integración técnica'],a:2,why:'Baja fidelidad: comprensión de propuesta, secuencia, necesidades faltantes y primeras reacciones. Usabilidad fina es de alta fidelidad; uso real, del MVP.'},
  {topic:'Niveles',type:'mc',q:'“Wireframe, flujo navegable simple, role-play o Wizard of Oz” corresponden a…',opts:['Baja fidelidad','Media fidelidad','Alta fidelidad','MVP / piloto'],a:1,why:'Son construcciones de media fidelidad, útiles para aprender arquitectura, pasos, lenguaje y puntos de error.'},
  {topic:'Tipos',type:'mc',q:'Quieres saber si una automatización o IA sería útil antes de construirla. ¿Qué prototipo recomienda el curso?',opts:['Prueba de concepto técnica','Landing page falsa','Wizard of Oz con intervención humana detrás','MVP'],a:2,why:'Wizard of Oz: una persona ejecuta detrás de escena la función que parece automatizada, para evaluar calidad percibida, confianza y casos límite.'},
  {topic:'Tipos',type:'mc',q:'¿Qué evidencia esperas de un role-play o service walkthrough?',opts:['Handoffs, esperas, roles, excepciones y carga','Rendimiento, integración y seguridad','Uso repetido y costo real','Paráfrasis y objeciones'],a:0,why:'Los prototipos de flujo de servicio revelan handoffs, esperas, roles, excepciones y carga.'},
  {topic:'Ficha',type:'mc',q:'¿Por qué la ficha de prototipo exige declarar el “alcance simulado y real”?',opts:['Para reducir el costo','Para evitar engañar a participantes y stakeholders','Para elegir la fidelidad visual','Para calcular el umbral'],a:1,why:'Declarar qué es real y qué se simula evita engañar a participantes y stakeholders.'},
  {topic:'Errores',type:'mc',q:'Un equipo cambia el umbral de éxito después de ver los datos. ¿Qué consecuencia señala el curso?',opts:['Resultado ambiguo','Sesgo de confirmación','Apego y costo hundido','Exposición prematura'],a:1,why:'Cambiar el umbral tras ver los datos produce sesgo de confirmación; el criterio debe registrarse antes de probar.'},
  {topic:'Errores',type:'mc',q:'Preguntar “¿le gusta?” produce…',opts:['Evidencia conductual sólida','Opinión cortés con poca capacidad predictiva','Datos de adopción','Una hipótesis refutable'],a:1,why:'La corrección es observar la tarea y pedir ejemplos de conducta pasada.'},
  {topic:'Decisión',type:'multi',q:'¿Cuáles son decisiones posibles tras una prueba de prototipo? (selecciona todas)',opts:['Perseverar','Iterar','Pivotar','Declarar éxito sin datos'],a:[0,1,2],why:'Las decisiones son perseverar, iterar, pivotar, detener o investigar más. Declarar éxito sin datos no es una decisión basada en evidencia.'},
  {topic:'Fidelidad',type:'tf',q:'Un resultado favorable de usabilidad demuestra por sí solo deseabilidad sostenida y viabilidad económica.',a:false,why:'Falso. Un resultado de usabilidad no demuestra por sí solo deseabilidad sostenida, factibilidad operacional ni viabilidad económica.'}
 ]},

/* ---------------- M6 ---------------- */
{id:'m6',num:6,short:'Experimento',title:'Del prototipo al experimento',emoji:'🧪',color:'#c9950c',
 intro:'Probar no es presentar. Un protocolo neutral, evidencia de calidad y una matriz de decisión previa convierten el prototipo en aprendizaje.',
 lessons:[
  {id:'m6l1',title:'El ciclo de aprendizaje basado en evidencia',minutes:6,info:'ciclo',
   body:()=>`<p>La hipótesis orienta el prototipo; el prototipo produce evidencia; la evidencia activa una decisión; la decisión abre una nueva pregunta GQM que refina la siguiente hipótesis. En el centro está la <b>pregunta de oro del equipo</b>: ¿qué evidencia nos haría cambiar de opinión?</p>
   ${CO('Principio de decisión','El objetivo de una prueba temprana no es demostrar que la idea es buena. Es reducir una incertidumbre suficientemente importante como para decidir el siguiente uso responsable de tiempo y recursos.','gold')}`},
  {id:'m6l2',title:'Protocolo de prueba de 15 minutos',minutes:8,info:'protocolo',
   body:()=>T(['Momento','Acción del facilitador','Qué registrar'],[
     ['0–2 min','Explicar propósito, consentimiento, confidencialidad y que se evalúa el diseño, no a la persona.','Aceptación y preguntas iniciales.'],
     ['2–3 min','Presentar contexto y una tarea neutral. No describir la solución.','Comprensión de la tarea.'],
     ['3–10 min','Observar en silencio; preguntar “¿qué esperaba que ocurriera?” solo cuando sea necesario.','Ruta, tiempo, ayuda, errores, pausas, comentarios.'],
     ['10–13 min','Preguntar por interpretación, confianza, utilidad y alternativa actual.','Razones, comparaciones y objeciones.'],
     ['13–15 min','Cerrar, agradecer y verificar si existe malestar o dato que deba retirarse.','Consentimiento final y notas.']])},
  {id:'m6l3',title:'Reglas para obtener evidencia de mejor calidad',minutes:7,info:'obsint',
   body:()=>UL(['<b>Separar observación de interpretación:</b> “leyó tres veces” no es igual a “estaba confundido”.','No defender ni explicar el diseño durante la tarea.','Registrar casos negativos y resultados que contradicen la hipótesis.','Evitar recolectar datos personales que no sean necesarios.','Desagregar resultados cuando una solución pueda crear barreras de acceso.','No generalizar una prueba cualitativa pequeña como estimación poblacional.','Combinar conducta, percepción y datos operativos cuando la decisión lo requiera.'])},
  {id:'m6l4',title:'Matriz de decisión previa',minutes:8,info:'decision',
   body:()=>T(['Resultado','Interpretación','Decisión sugerida'],[
     ['Supera umbral y respeta salvaguardas','Evidencia favorable dentro del alcance de la prueba.','Avanzar a una prueba más exigente o mayor fidelidad.'],
     ['Mejora parcial, con fallas identificables','Hipótesis aún plausible, diseño insuficiente.','Iterar el prototipo y repetir.'],
     ['No mejora o contradice mecanismo clave','Evidencia desfavorable.','Pivotar problema, solución o segmento; considerar detener.'],
     ['Datos ambiguos o prueba defectuosa','No permite inferir.','Corregir diseño de prueba; no declarar éxito ni fracaso.'],
     ['Genera daño, exclusión o riesgo no aceptable','Salvaguarda vulnerada.','Detener y rediseñar antes de continuar.']])+CO('Manejo de situación frecuente','Si el resultado es ambiguo: clasifíquelo como inconcluso y mejore la prueba; <b>no negocie el umbral</b>.')}
 ],
 quiz:[
  {topic:'Protocolo',type:'order',q:'Ordena los momentos del protocolo de prueba de 15 minutos.',opts:['Explicar propósito y consentimiento','Presentar contexto y tarea neutral','Observar en silencio','Preguntar por interpretación y confianza','Cerrar, agradecer y verificar malestar'],a:[0,1,2,3,4],why:'0–2 consentimiento → 2–3 tarea neutral → 3–10 observación silenciosa → 10–13 preguntas de interpretación → 13–15 cierre.'},
  {topic:'Protocolo',type:'mc',q:'Durante los minutos 3–10 el facilitador debe…',opts:['Explicar cómo funciona la solución','Observar en silencio y preguntar “¿qué esperaba que ocurriera?” solo si es necesario','Pedir una calificación de 1 a 10','Defender el diseño ante objeciones'],a:1,why:'La observación silenciosa registra ruta, tiempo, ayuda, errores, pausas y comentarios sin inducir al usuario.'},
  {topic:'Evidencia',type:'mc',q:'¿Cuál es una observación (no una interpretación)?',opts:['Estaba confundido','No le gustó la pantalla','Leyó tres veces la instrucción','Le pareció difícil'],a:2,why:'“Leyó tres veces” es conducta observable. Confusión, gusto y dificultad son interpretaciones.',steps:['Pregunta: ¿pude verlo o grabarlo? Si sí, es observación.','Si implica un estado mental inferido, es interpretación.']},

/* ---------- Glosario ---------- */
const GLOSSARY=[
 ['Design Thinking','Práctica iterativa y centrada en personas para comprender, crear alternativas, hacerlas tangibles y aprender.'],
 ['Insight','Interpretación breve y accionable que conecta una observación con una necesidad o tensión.'],
 ['HMW','Pregunta “¿Cómo podríamos…?” que transforma un insight en oportunidad de diseño.'],
 ['Supuesto','Creencia aceptada temporalmente sin evidencia suficiente.'],
 ['Hipótesis','Afirmación provisional, específica y comprobable que puede recibir evidencia favorable o contradictoria.'],
 ['GQM','Goal–Question–Metric: jerarquía que conecta objetivos, preguntas y métricas.'],
 ['Métrica de vanidad','Indicador que parece favorable pero no representa valor, causalidad ni una decisión útil.'],
 ['Prototipo','Representación incompleta de una solución construida para responder una pregunta de aprendizaje.'],
 ['Fidelidad','Grado de semejanza con la solución final en interacción, apariencia, contenido u operación.'],
 ['Prueba de concepto','Experimento centrado en factibilidad técnica.'],
 ['MVP','Entrega mínima que produce valor real y permite observar uso en contexto.'],
 ['Wizard of Oz','Simulación en la que una persona ejecuta detrás de escena una función que parece automatizada.'],
 ['Salvaguarda','Métrica o condición que no debe deteriorarse mientras se busca el resultado principal.'],
 ['REFTA','Criterios de calidad de una hipótesis: Relevante, Específica, Falsable, Trazable, Accionable.'],
 ['Pregunta de oro','¿Qué evidencia nos haría cambiar de opinión? Recurso didáctico que no sustituye el GQM.']
];
const SOURCES=[
 ['IDEO · Human-Centered Innovation','definición, tres lentes y enfoque centrado en personas.'],
 ['IDEO · Design Thinking Process','fases flexibles, divergencia, convergencia e iteración.'],
 ['Stanford d.school · Design Thinking Bootleg','herramientas y cinco modos de trabajo.'],
 ['Basili, Caldiera y Rombach · The Goal Question Metric Approach','niveles Goal, Question y Metric; estructura de objetivos y medición.'],
 ['Gasparyan et al. · Formulating Hypotheses for Different Study Designs','fundamento, testabilidad, diseño, ética y prueba de hipótesis.'],
 ['Nielsen Norman Group · UX Prototypes: Low Fidelity vs. High Fidelity','prototipo como hipótesis, dimensiones de fidelidad y pruebas con usuarios.'],
 ['Rösch, Tiberius y Kraus · Design thinking for innovation','revisión sistemática de contexto, proceso y resultados.'],
 ['Chen, Skywark y Jagannathan · Co-creating a Design Thinking Course','aprendizaje aplicado, reflexión, trabajo grupal y andamiaje.']
];

};

<script>
/* ============================================================
   MOTOR · estado, persistencia, navegación, evaluación, sprint
   ============================================================ */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const SAVE_KEY='evidencialab.save.v1';
let mem={};
function load(){try{return JSON.parse(localStorage.getItem(SAVE_KEY))||{};}catch(e){return mem;}}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(P));}catch(e){mem=P;}}
const P=Object.assign({player:'',sound:true,theme:null,lessons:{},retos:{},quiz:{},topics:{},exam:null,history:[],sprint:{},rubric:{},exit:{},diag:{}},load());
let state={view:'home',mid:null,li:0,quiz:null,tab:'explore',sprintStep:0};
const MOD=id=>MODULES.find(m=>m.id===id);

/* ---- utilidades UI ---- */
function toast(msg,ms){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),ms||2200);}
function floatPoints(txt,x,y){const d=document.createElement('div');d.className='floatpts';d.textContent=txt;d.style.left=(x||window.innerWidth/2)+'px';d.style.top=(y||window.innerHeight/2)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1000);}
function shake(el){if(!el)return;el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');}
let actx=null;
function beep(kind){
  if(!P.sound) return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);
    const t=actx.currentTime;
    if(kind==='ok'){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+.09);}
    else if(kind==='bad'){o.frequency.setValueAtTime(300,t);o.frequency.setValueAtTime(200,t+.12);}
    else if(kind==='win'){[523,659,784,1046].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*.1));}
    else{o.frequency.setValueAtTime(520,t);}
    o.type='sine';g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.2,t+.02);
    g.gain.exponentialRampToValueAtTime(.001,t+(kind==='win'?.5:.22));o.start(t);o.stop(t+(kind==='win'?.55:.25));
  }catch(e){}
}
function confetti(){
  const c=$('#confetti'),ctx=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#0d6e78','#c9950c','#2a78d6','#eb6834','#1baf7a','#e87ba4'];
  const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*200,r:4+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)],v:2+Math.random()*4,a:Math.random()*Math.PI,w:Math.random()*2-1}));
  let f=0;(function draw(){ctx.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.v;p.x+=Math.sin(p.a+f/12)*1.2;p.a+=.05;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6);ctx.restore();});if(++f<110)requestAnimationFrame(draw);else ctx.clearRect(0,0,c.width,c.height);})();
}
function toggleSound(){P.sound=!P.sound;save();$('#soundBtn').textContent=P.sound?'🔊':'🔇';}
function toggleTheme(){const cur=document.documentElement.getAttribute('data-theme');const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme: dark)').matches;P.theme=dark?'light':'dark';document.documentElement.setAttribute('data-theme',P.theme);save();}
function starStr(n){return '★'.repeat(n)+'☆'.repeat(3-n);}
function starsFor(acc){return acc>=90?3:acc>=75?2:acc>=60?1:0;}
function today(){const d=new Date();return d.toLocaleDateString('es-CO',{year:'numeric',month:'short',day:'numeric'})+' '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'});}

/* ---- progreso ---- */
function lessonDone(id){return !!P.lessons[id];}
function markLesson(id){if(!P.lessons[id]){P.lessons[id]=true;save();}}
function modProgress(m){
  const total=m.lessons.length, done=m.lessons.filter(l=>lessonDone(l.id)).length;
  const infos=[...new Set(m.lessons.map(l=>l.info).filter(i=>INFO[i]&&INFO[i].reto))];
  const rdone=infos.filter(i=>P.retos[i]&&P.retos[i].done).length;
  const q=P.quiz[m.id];
  const pct=Math.round(((done/total)*0.4+(infos.length?rdone/infos.length:1)*0.3+((q?q.best.accuracy:0)/100)*0.3)*100);
  return {done,total,infos:infos.length,rdone,q,pct,stars:q?q.best.stars:0};
}
function retoDone(id,pct,silent){
  pct=Math.round(pct);const r=P.retos[id]||{best:0,done:false,tries:0};
  r.tries++;r.best=Math.max(r.best,pct);if(pct>=80)r.done=true;P.retos[id]=r;save();
  if(!silent){if(pct>=80){beep('win');toast('¡Reto superado! '+pct+'%');floatPoints('+'+pct);if(pct===100)confetti();}else{beep('bad');toast('Reto al '+pct+'%. Revisa y vuelve a intentar.');}}
  updateNav();
}
function topicHit(topic,ok){const t=P.topics[topic]||{ok:0,n:0};t.n++;if(ok)t.ok++;P.topics[topic]=t;}

/* ---- navegación ---- */
function go(v,extra){Object.assign(state,extra||{});state.view=v;render();window.scrollTo({top:0,behavior:'smooth'});}
function openModule(id){go('module',{mid:id});}
function openLesson(mid,i){go('lesson',{mid:mid,li:i,tab:'explore'});}
function updateNav(){
  $('#navchips').innerHTML=MODULES.map(m=>{const p=modProgress(m);const s=p.pct>=100?'s3':p.pct>=50?'s2':p.pct>0?'s1':'';return `<button class="chip ${state.mid===m.id&&state.view!=='home'?'on':''}" onclick="openModule('${m.id}')" title="${esc(m.title)}"><span class="dot ${s}"></span>${m.num} · ${m.short}</button>`;}).join('')
  +`<button class="chip ${state.view==='sprint'?'on':''}" onclick="go('sprint')">🚀 Hoja de evidencia</button><button class="chip ${state.view==='exam'||state.view==='examres'?'on':''}" onclick="go('examintro')">🏁 Examen</button><button class="chip ${state.view==='ficha'?'on':''}" onclick="go('ficha')">📊 Mi dominio</button>`;
}
function render(){
  updateNav();
  const app=$('#app');app.className='fade';
  const V={home:viewHome,module:viewModule,lesson:viewLesson,quiz:viewQuiz,results:viewResults,sprint:viewSprint,examintro:viewExamIntro,exam:viewQuiz,examres:viewResults,ficha:viewFicha,glosario:viewGlosario};
  app.innerHTML=(V[state.view]||viewHome)();
  if(state.view==='home'){mountInfo('ruta','explore','#homeRuta');}
  if(state.view==='lesson'){mountLessonInfo();}
  if(state.view==='sprint'){sprintAfterRender();}
  if(state.view==='results'||state.view==='examres'){const el=$('#scoreNum');const r=state.lastRes||(state.view==='examres'?P.exam:(P.quiz[state.mid]&&P.quiz[state.mid].last));if(el&&r)animateCount(el,r.score);}
}

/* ---------- HOME ---------- */
function viewHome(){
  const totalL=MODULES.reduce((a,m)=>a+m.lessons.length,0), doneL=Object.keys(P.lessons).length;
  const retos=Object.values(P.retos).filter(r=>r.done).length, totalR=Object.keys(INFO).filter(k=>INFO[k].reto).length;
  const quizzes=MODULES.filter(m=>P.quiz[m.id]).length;
  const avg=quizzes?Math.round(MODULES.reduce((a,m)=>a+(P.quiz[m.id]?P.quiz[m.id].best.accuracy:0),0)/quizzes):0;
  return `<div class="hero">
    <div class="kicker gold">Curso práctico · 4 horas · autoformación interactiva</div>
    <h1>Design Thinking, hipótesis, GQM y prototipado</h1>
    <p class="idea"><b>Idea central:</b> innovar no es defender una idea; es reducir incertidumbre mediante evidencia. Este laboratorio conecta comprensión humana, hipótesis refutables, medición útil y prototipos diseñados para aprender.</p>
    <div class="row" style="margin-top:10px">
      <input id="playerName" placeholder="Tu nombre (para tu ficha y exportaciones)" value="${esc(P.player)}" onchange="P.player=this.value.trim();save();toast('¡Hola, '+(P.player||'participante')+'!')" style="min-width:260px">
      <button class="btn" onclick="startNext()">▶ ${doneL?'Continuar donde iba':'Empezar el curso'}</button>
      <button class="btn sec" onclick="go('sprint')">🚀 Mi hoja de evidencia</button>
    </div>
  </div>
  <div class="grid g3" style="margin:16px 0">
    <div class="stat"><b>${doneL}/${totalL}</b><span>lecciones completadas</span></div>
    <div class="stat"><b>${retos}/${totalR}</b><span>retos interactivos superados</span></div>
    <div class="stat"><b>${quizzes}/${MODULES.length}</b><span>evaluaciones realizadas · precisión media ${avg}%</span></div>
    <div class="stat"><b>${P.exam?P.exam.accuracy+'%':'—'}</b><span>examen final ${P.exam?starStr(P.exam.stars):'(pendiente)'}</span></div>
  </div>
  <div class="card"><div class="row spread"><div><div class="kicker">Figura 1 · interactiva</div><h2>Ruta de aprendizaje: de la incertidumbre a la evidencia</h2></div><span class="pill gray">Toca cada etapa</span></div><div id="homeRuta"></div></div>
  <h2 style="margin-top:22px">Módulos del curso</h2>
  <div class="grid g3">${MODULES.map(m=>{const p=modProgress(m);return `<div class="card clicky" onclick="openModule('${m.id}')">

/* ---------- MÓDULO ---------- */
function viewModule(){
  const m=MOD(state.mid),p=modProgress(m),q=P.quiz[m.id];
  const idx=MODULES.indexOf(m),next=MODULES[idx+1];
  return `<div class="modhead"><div class="modnum" style="background:${m.color}">${m.num}</div><div style="flex:1"><div class="kicker">Módulo ${m.num} de ${MODULES.length}</div><h1>${m.emoji} ${esc(m.title)}</h1><p class="muted">${esc(m.intro)}</p><div class="progressbar" style="max-width:420px"><i style="width:${p.pct}%"></i></div><div class="tiny muted" style="margin-top:4px">${p.pct}% · ${p.done}/${p.total} lecciones · ${p.rdone}/${p.infos} retos · evaluación ${q?q.best.accuracy+'% '+starStr(q.best.stars):'pendiente'}</div></div></div>
  <div class="grid g2" style="margin-top:18px;grid-template-columns:1.4fr 1fr">
    <div><h2>Lecciones e infografías</h2><div class="lesson-list">${m.lessons.map((l,i)=>{const inf=INFO[l.info];const r=inf&&inf.reto?(P.retos[l.info]||{}):null;return `<div class="lesson-item" onclick="openLesson('${m.id}',${i})"><div class="ico ${lessonDone(l.id)?'done':''}">${lessonDone(l.id)?'✅':(i+1)}</div><div class="t"><b>${esc(l.title)}</b><span>${l.minutes} min · ${inf?(inf.reto?'infografía + reto':'infografía interactiva'):'lectura'}${r&&r.done?' · reto ✔ '+r.best+'%':''}</span></div>${inf?'<span class="pill">'+esc(inf.name)+'</span>':''}</div>`;}).join('')}</div></div>
    <div class="grid" style="align-content:start">
      <div class="card"><div class="kicker gold">Evaluación del módulo</div><h3>${m.quiz.length} preguntas con corrección paso a paso</h3>${q?`<p class="small">Mejor resultado: <b>${q.best.score} pts</b> · ${q.best.correct}/${q.best.total} · ${q.best.accuracy}% <span class="stars">${starStr(q.best.stars)}</span><br><span class="muted tiny">${q.attempts} intento(s) · último ${esc(q.best.date)}</span></p>`:'<p class="small muted">Aún no has presentado esta evaluación. Recomendado: completa primero las lecciones y retos.</p>'}<div class="row"><button class="btn gold" onclick="startQuiz('${m.id}')">${q?'Volver a evaluar':'Iniciar evaluación'}</button>${q?`<button class="btn ghost sm" onclick="go('results',{mid:'${m.id}'})">Ver último detalle</button>`:''}</div></div>
      <div class="card soft"><div class="kicker">Recomendación</div><p class="small">${p.done<p.total?'Continúa con la siguiente lección pendiente.':(p.rdone<p.infos?'Tienes retos pendientes: vuelve a las infografías y supera el modo Reto.':(q?'Módulo dominado. Sigue al siguiente módulo o consolida en tu hoja de evidencia.':'Presenta la evaluación para medir tu dominio.'))}</p><div class="row">${p.done<p.total?`<button class="btn sm" onclick="openLesson('${m.id}',${m.lessons.findIndex(l=>!lessonDone(l.id))})">Lección pendiente →</button>`:''}${next?`<button class="btn sec sm" onclick="openModule('${next.id}')">Módulo ${next.num}: ${esc(next.short)} →</button>`:`<button class="btn sec sm" onclick="go('sprint')">Hoja de evidencia →</button>`}</div></div>
    </div></div>`;
}

function viewLesson(){
  const m=MOD(state.mid),l=m.lessons[state.li],inf=INFO[l.info];
  const hasReto=inf&&inf.reto, r=P.retos[l.info];
