<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ludatos · Rehavid — Juego de Estadística</title>
<style>
/* ============================================================
   LUDATOS — Juego de Estadística  ·  Tema "cuaderno"
   100% autocontenido, sin dependencias externas.
   ============================================================ */
:root{
  --paper:#fbf9f1;
  --paper2:#fffdf6;
  --ink:#1f2a3a;
  --navy:#173257;
  --navy2:#22447a;
  --rule:#d7e7f2;
  --margin:#e9a7a7;
  --blue:#2f7cc0;
  --sky:#7cc5e8;
  --skyd:#2b6fb0;
  --deep:#1f5aa8;
  --pink:#ec6a9c;
  --pink2:#f6b6cd;
  --yellow:#f3c53f;
  --yellow2:#fbe6a0;
  --green:#77b06a;
  --green2:#bfe0ac;
  --purple:#a487d6;
  --purple2:#d8c8f0;
  --red:#e0587a;
  --ok:#2f9e63;
  --okbg:#e5f6ec;
  --bad:#d6455f;
  --badbg:#fdeaee;
  --shadow:0 10px 30px rgba(23,50,87,.14);
  --shadow-s:0 4px 14px rgba(23,50,87,.12);
  --radius:18px;
  --font:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --hand:"Comic Sans MS","Trebuchet MS","Segoe Print",var(--font);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:var(--font);
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 50% -200px, #eaf3fb 0%, rgba(234,243,251,0) 60%),
    var(--paper);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:9999}
.wrap{max-width:960px;margin:0 auto;padding:18px 16px 60px}
.hidden{display:none!important}

/* Paper card look */
.paper{
  position:relative;
  background:
    repeating-linear-gradient(180deg,transparent 0 31px,var(--rule) 31px 32px),
    var(--paper2);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  border:1px solid #e7e2d4;
  overflow:hidden;
}
.paper::before{content:"";position:absolute;top:0;bottom:0;left:34px;width:2px;background:var(--margin);opacity:.55}
.paper .pad{padding:26px 26px 26px 52px}
@media(max-width:560px){.paper .pad{padding:20px 16px 20px 42px}.paper::before{left:26px}}

.card{background:var(--paper2);border:1px solid #e8e3d5;border-radius:var(--radius);box-shadow:var(--shadow-s)}

h1,h2,h3{font-family:var(--hand);color:var(--navy);margin:0}
.title{
  font-family:var(--hand);
  color:var(--navy);
  font-weight:800;
  line-height:1.02;
  letter-spacing:.3px;
  text-shadow:1px 1px 0 #cddff0;
}
.badge{display:inline-block;padding:3px 12px;border-radius:999px;font-weight:700;font-size:13px}

/* Buttons */
.btn{
  font-family:var(--font);
  font-weight:700;font-size:16px;
  border:none;border-radius:14px;cursor:pointer;
  padding:14px 22px;color:#fff;background:linear-gradient(180deg,var(--blue),var(--deep));
  box-shadow:0 6px 0 #164a86, var(--shadow-s);
  transition:transform .08s ease, box-shadow .08s ease, filter .15s;
  user-select:none;
}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #164a86}
.btn:disabled{filter:grayscale(.6) brightness(.95);cursor:not-allowed;opacity:.7}
.btn.secondary{background:linear-gradient(180deg,#8aa0b8,#5f7590);box-shadow:0 6px 0 #47596e,var(--shadow-s)}
.btn.green{background:linear-gradient(180deg,#7fc06e,#4f9a48);box-shadow:0 6px 0 #3c7a38,var(--shadow-s)}
.btn.pink{background:linear-gradient(180deg,#f37fab,#d64d84);box-shadow:0 6px 0 #ad3c6a,var(--shadow-s)}
.btn.yellow{background:linear-gradient(180deg,#f6cf55,#e0a91f);color:#5a4400;box-shadow:0 6px 0 #b98a12,var(--shadow-s)}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid #cfe0ee;box-shadow:0 4px 0 #cfe0ee}
.btn.sm{padding:9px 15px;font-size:14px;border-radius:11px;box-shadow:0 4px 0 #164a86,var(--shadow-s)}
.btn.sm:active{box-shadow:0 1px 0 #164a86}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* Chips / labels */
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #d9e6f2;border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;color:var(--navy)}
.pill-yellow{background:var(--yellow2);border-color:var(--yellow)}
.pill-pink{background:var(--pink2);border-color:var(--pink)}
.pill-green{background:var(--green2);border-color:var(--green)}
.pill-purple{background:var(--purple2);border-color:var(--purple)}
.pill-sky{background:#d5eefb;border-color:var(--sky)}
.pill-orange{background:#fde3cf;border-color:#e0662f}
.chip.timer{background:#e9f6ff;border-color:#7cc5e8;color:#1f5aa8}
.chip.timer.danger{background:#fdeaee;border-color:var(--red);color:var(--bad);animation:pulse .6s infinite alternate}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.14)}}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;font-weight:700;color:var(--navy2);font-size:13.5px;user-select:none}
.switch input{display:none}
.switch .track{width:44px;height:24px;border-radius:999px;background:#cfdcea;position:relative;transition:background .2s;flex:0 0 44px}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.switch input:checked + .track{background:var(--green)}
.switch input:checked + .track::after{left:22px}
.board{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
.board th,.board td{padding:9px 8px;text-align:center;border-bottom:1px solid #e6eef6}
.board th{background:var(--navy);color:#fff;position:sticky;top:0}
.board tr:nth-child(even) td{background:#f6fafd}
.board .rank{font-weight:800;font-family:var(--hand);font-size:16px}
.board-wrap{max-height:460px;overflow:auto;border:1px solid #e6eef6;border-radius:14px}
/* Interactividad de gráficos */
.chartbox svg rect:hover,.chartbox svg circle:hover{filter:brightness(1.1);cursor:pointer}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.svg-barx{transform-box:fill-box;transform-origin:left;animation:growx .7s cubic-bezier(.2,.8,.2,1) both}
/* Avatar / rango */
.avatar{display:flex;align-items:center;gap:14px;background:var(--paper2);border:1px solid #e8e3d5;border-radius:16px;padding:12px 16px;box-shadow:var(--shadow-s)}
.avatar .face{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:30px;flex:0 0 56px;box-shadow:inset 0 0 0 3px #fff,0 0 0 3px currentColor;background:#fff}
.avatar .rt{font-family:var(--hand);font-size:19px;color:var(--navy)}
.avatar .rankbar{height:9px;background:#e6eef6;border-radius:999px;overflow:hidden;margin-top:5px}
.avatar .rankbar > i{display:block;height:100%;border-radius:999px;transition:width .5s}
/* Filtros y podio */
.filterchips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px;justify-content:center}
.fchip{padding:6px 13px;border-radius:999px;border:1.5px solid #d9e6f2;background:#fff;font-weight:700;font-size:13px;color:var(--navy2);cursor:pointer}
.fchip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:14px 0 6px}
.pod{border-radius:14px 14px 0 0;padding:10px 10px 10px;text-align:center;color:#fff;width:98px;box-shadow:var(--shadow-s)}
.pod .em{font-size:26px;line-height:1}
.pod .nm{font-weight:800;font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .sc{font-size:12.5px;opacity:.97;font-weight:700}

/* Top bar */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer}
.brand .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--sky),var(--deep));display:grid;place-items:center;box-shadow:var(--shadow-s)}
.brand .logo svg{width:26px;height:26px}
.brand b{font-family:var(--hand);color:var(--navy);font-size:22px}
.brandlogo{height:30px;width:auto;display:block}
.stats-mini{display:flex;gap:8px;flex-wrap:wrap}

/* Level map */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:20px}
@media(max-width:720px){.levels{grid-template-columns:1fr}}
.level-card{position:relative;padding:20px;border-radius:20px;color:#fff;cursor:pointer;overflow:hidden;box-shadow:var(--shadow);transition:transform .12s}
.level-card:hover{transform:translateY(-4px)}
.level-card.locked{cursor:not-allowed;filter:grayscale(.5) brightness(.9)}
.level-card .n{font-size:52px;font-family:var(--hand);opacity:.35;position:absolute;right:14px;top:-2px}
.level-card h3{color:#fff;font-size:21px}
.level-card p{margin:6px 0 12px;font-size:14px;opacity:.95;line-height:1.35}
.lc1{background:linear-gradient(140deg,#5cb0e6,#2b6fb0)}
.lc2{background:linear-gradient(140deg,#8bd07a,#4f9a48)}
.lc3{background:linear-gradient(140deg,#b79be6,#7a54c0)}
.lc4{background:linear-gradient(140deg,#f6a75c,#e0662f)}
.stars{font-size:20px;letter-spacing:2px}
.lockicon{position:absolute;right:16px;bottom:14px;opacity:.9}

/* Charts */
.chartbox{background:#fff;border:1px solid #e6eef6;border-radius:16px;padding:14px;margin:14px 0;box-shadow:inset 0 0 0 100px #fff}
.chartbox svg{width:100%;height:auto;display:block;overflow:visible}
.chart-cap{text-align:center;font-size:13px;color:#5b6b7d;margin-top:6px;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th,.tbl td{border:1px solid #dbe6f0;padding:8px 10px;text-align:center}
.tbl th{background:var(--navy);color:#fff;font-weight:700}
.tbl tr:nth-child(even) td{background:#f4f9fd}

/* Learning */
.deckwrap{margin-top:14px}
.progress-dots{display:flex;gap:8px;justify-content:center;margin:14px 0}
.dot{width:10px;height:10px;border-radius:50%;background:#cfdcea;transition:all .2s}
.dot.on{background:var(--blue);transform:scale(1.3)}
.dot.done{background:var(--green)}
.learn h2{font-size:24px;margin-bottom:8px}
.learn p{line-height:1.6;font-size:16px;margin:8px 0}
.learn ul{margin:8px 0 8px 4px;padding-left:20px;line-height:1.6}
.learn li{margin:4px 0}
.formula{font-family:"Cambria Math","Georgia",serif;background:#eef5fb;border:1px solid #d5e6f4;border-radius:8px;padding:1px 8px;font-style:italic;color:var(--navy2);white-space:nowrap}
.tip{margin-top:14px;background:var(--yellow2);border:1.5px dashed var(--yellow);border-radius:14px;padding:12px 14px;font-size:14.5px}
.tip b{color:#8a6d00}

/* Quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.qbar{height:12px;background:#e6eef6;border-radius:999px;overflow:hidden;margin:10px 0 4px}
.qbar > i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--deep));border-radius:999px;transition:width .4s}
.qprompt{font-size:19px;font-weight:700;color:var(--ink);line-height:1.45;margin:10px 0}
.opts{display:grid;gap:10px;margin-top:8px}
.opt{
  text-align:left;background:#fff;border:2px solid #d9e6f2;border-radius:14px;padding:14px 16px;font-size:16px;font-weight:600;color:var(--ink);
  cursor:pointer;transition:all .12s;display:flex;align-items:center;gap:12px
}
.opt:hover{border-color:var(--blue);background:#f2f9ff;transform:translateX(2px)}
.opt .key{width:28px;height:28px;flex:0 0 28px;border-radius:8px;background:#eef4fa;display:grid;place-items:center;font-weight:800;color:var(--navy2)}
.opt.correct{border-color:var(--ok);background:var(--okbg)}
.opt.correct .key{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.opt.wrong .key{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.num-input{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.num-input input{font-size:20px;font-weight:700;padding:12px 14px;border:2px solid #d9e6f2;border-radius:12px;width:180px;text-align:center;color:var(--navy2)}
.num-input input:focus{outline:none;border-color:var(--blue)}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.tf .opt{justify-content:center;font-size:18px}

/* Feedback */
.feedback{margin-top:16px;border-radius:16px;padding:16px 18px;animation:pop .3s ease}
.feedback.ok{background:var(--okbg);border:2px solid var(--green)}
.feedback.bad{background:var(--badbg);border:2px solid var(--red)}
.feedback h4{margin:0 0 6px;font-family:var(--hand);font-size:20px}
.feedback.ok h4{color:var(--ok)}
.feedback.bad h4{color:var(--bad)}
.feedback .corr{margin-top:8px;background:#fff;border-radius:12px;padding:10px 12px;font-size:15px;line-height:1.55}
.feedback .corr b{color:var(--navy2)}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}

.floatpts{position:fixed;font-family:var(--hand);font-weight:800;font-size:34px;color:var(--ok);pointer-events:none;z-index:9998;animation:floatup 1s ease forwards;text-shadow:0 2px 0 #fff}
@keyframes floatup{from{transform:translateY(0);opacity:1}to{transform:translateY(-90px);opacity:0}}

/* Results */
.result-hero{text-align:center;padding:10px}
.big-score{font-family:var(--hand);font-size:64px;color:var(--navy);line-height:1}
.stars-big{font-size:44px;letter-spacing:6px;margin:6px 0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:16px 0}
.kpi{background:#fff;border:1px solid #e6eef6;border-radius:14px;padding:12px;text-align:center}
.kpi .v{font-size:26px;font-weight:800;color:var(--navy2);font-family:var(--hand)}
.kpi .l{font-size:12.5px;color:#5b6b7d;font-weight:600;margin-top:2px}
.review{margin-top:10px;display:grid;gap:10px}
.rev{border-radius:14px;padding:12px 14px;border:1.5px solid #e6eef6;background:#fff}
.rev.ok{border-color:var(--green2)}
.rev.bad{border-color:var(--pink2)}
.rev .qh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.rev .qh .st{font-weight:800}
.rev.ok .st{color:var(--ok)}
.rev.bad .st{color:var(--bad)}
.rev .ans{font-size:14px;margin-top:6px}
.rev .ans .mine{color:var(--bad);font-weight:700}
.rev .ans .good{color:var(--ok);font-weight:700}
.rev .corr{margin-top:6px;font-size:14px;color:#3a4a5c;background:#f6fafd;border-radius:10px;padding:8px 10px;line-height:1.5}

/* Interactive playground */
.play{background:#fff;border:1.5px solid #dbe9f5;border-radius:16px;padding:16px;margin-top:10px}
.play h4{font-family:var(--hand);color:var(--navy);margin:0 0 8px;font-size:19px}
.slider-row{display:flex;align-items:center;gap:12px;margin:8px 0}
.slider-row label{font-weight:700;color:var(--navy2);width:60px}
.slider-row input[type=range]{flex:1;accent-color:var(--blue)}
.slider-row .val{width:64px;text-align:right;font-weight:800;color:var(--navy2)}
.numlist{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.numlist .n{background:#eef5fb;border:1.5px solid #cfe0ee;border-radius:10px;padding:6px 12px;font-weight:700;color:var(--navy2);display:flex;align-items:center;gap:8px}
.numlist .n button{border:none;background:transparent;color:var(--bad);font-weight:900;cursor:pointer;font-size:16px;line-height:1}
.miniresult{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.miniresult .mr{background:#f4f9fd;border:1px solid #dbe9f5;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:700;color:var(--navy2)}

.foot{margin-top:34px;text-align:center;color:#8493a5;font-size:13px}
.foot b{color:var(--navy2)}
a.link{color:var(--blue);font-weight:700;text-decoration:none;cursor:pointer}

.iconbtn{width:40px;height:40px;border-radius:12px;border:1.5px solid #d9e6f2;background:#fff;cursor:pointer;display:grid;place-items:center;color:var(--navy2)}
.iconbtn:hover{background:#f2f9ff}

/* SVG animations */
.svg-bar{transform-box:fill-box;transform-origin:bottom;animation:grow .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.svg-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 1.1s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.svg-fade{opacity:0;animation:fadein .5s ease forwards}
@keyframes fadein{to{opacity:1}}
.svg-pop{transform-box:fill-box;transform-origin:center;animation:popin .5s cubic-bezier(.2,1.3,.4,1) both}
@keyframes popin{from{transform:scale(0)}to{transform:scale(1)}}
</style>
</head>

<script id="game-data">
window.GAME_DATA = {"levels":[{"level":1,"title":"Fundamentos","subtitle":"Distingue población de muestra, clasifica variables, arma tablas de frecuencia y aprende a leer gráficos de barras y de pastel.","learning":[{"title":"Población, muestra e individuo","body":"La **estadística** estudia datos para tomar decisiones. Conceptos clave:\n- **Población**: TODO el conjunto que queremos estudiar (ej. los 800 alumnos de un colegio).\n- **Muestra**: una parte de la población que sí observamos (ej. 50 alumnos encuestados).\n- **Individuo**: cada elemento (un alumno).\n- **Variable**: la característica que medimos (su deporte favorito).\n- **Dato**: el valor observado en un individuo (\"fútbol\").\n\nAdemás: un **parámetro** describe a la POBLACIÓN (suele ser desconocido) y un **estadístico** se calcula desde la MUESTRA (lo usamos para estimar el parámetro).","tip":"Truco: Parámetro y Población empiezan con P; eStadístico viene de la mueStra (Sample). Si el número sale de una parte, es estadístico.","chart":{"type":"bar","data":{"labels":["Población (800)","Muestra (50)"],"values":[800,50],"xlabel":"","ylabel":"N.º de alumnos","title":"La muestra es una parte de la población"}}},{"title":"Tipos de variable","body":"Toda variable es de uno de dos grandes tipos:\n\n**Cualitativa** (describe cualidades o categorías):\n- **Nominal**: categorías SIN orden (color de ojos, sexo, marca).\n- **Ordinal**: categorías CON orden (nivel educativo, satisfacción: bajo/medio/alto).\n\n**Cuantitativa** (se expresa con números que tienen sentido aritmético):\n- **Discreta**: valores que se CUENTAN, normalmente enteros (n.º de hermanos: 0, 1, 2…).\n- **Continua**: valores que se MIDEN y admiten decimales (estatura 1.72 m, peso, tiempo).","tip":"Pregúntate: ¿lo cuento uno a uno? → discreta. ¿lo mido con un instrumento y puede llevar decimales? → continua. ¿son etiquetas o categorías? → cualitativa."},{"title":"Escalas de medición (NOIR)","body":"Las variables se miden en cuatro escalas, de MENOR a MAYOR información:\n- **Nominal**: solo etiquetas, sin orden (tipo de sangre A, B, O).\n- **Ordinal**: hay orden, pero las distancias no son comparables (1.º, 2.º, 3.º lugar).\n- **Intervalo**: orden y distancias iguales, pero el cero es arbitrario (temperatura en °C: 0° no significa \"nada de calor\").\n- **Razón**: como intervalo pero con **cero absoluto**, así que se pueden hacer razones (peso, altura, edad: 0 kg sí significa ausencia).","tip":"Mnemotecnia: NOIR = Nominal, Ordinal, Intervalo, Razón. Escala más alta = puedes hacer más operaciones con los datos."},{"title":"Tablas de frecuencia","body":"Resumen cuántas veces aparece cada categoría o valor:\n- **Frecuencia absoluta (fi)**: cuántos individuos hay en la categoría.\n- **Frecuencia relativa (hi)**: la proporción, $h_i = f_i / n$ (n = total). Va entre 0 y 1.\n- **Porcentaje**: $h_i \\times 100$.\n- **Frecuencia acumulada (Fi)**: se van SUMANDO las fi de arriba hacia abajo.\n\nEn el ejemplo (n = 20): Fútbol 8, Básquet 5, Vóley 4, Natación 3. La hi de Fútbol es 8/20 = 0.40 (40%).","tip":"Verificación: la suma de todas las hi debe dar 1 (o 100%) y la ÚLTIMA frecuencia acumulada Fi debe ser igual a n. Si no cuadra, hay un error.","chart":{"type":"freqtable","data":{"headers":["Deporte","fi","hi","Fi"],"rows":[["Fútbol",8,"0.40",8],["Básquet",5,"0.25",13],["Vóley",4,"0.20",17],["Natación",3,"0.15",20]]}}},{"title":"Barras vs. circular (pastel)","body":"Ambos sirven para variables **cualitativas**, pero se usan distinto:\n- **Diagrama de barras**: ideal para **comparar** la frecuencia de cada categoría. Las alturas se comparan fácil y admite muchas categorías.\n- **Diagrama circular (pastel)**: muestra cómo se **reparte el 100%** entre las partes. Funciona bien con **pocas** categorías (5-6 como máximo); con muchas se vuelve ilegible.","tip":"Regla rápida: ¿comparar cantidades? → BARRAS. ¿ver la parte de un todo (proporciones)? → PASTEL. Muchas categorías = evita el pastel.","chart":{"type":"bar","data":{"labels":["Fútbol","Básquet","Vóley","Natación"],"values":[8,5,4,3],"xlabel":"Deporte","ylabel":"Frecuencia (fi)","title":"Deporte favorito (n = 20)"}}},{"title":"Cómo leer un gráfico cualitativo","body":"Pasos para interpretar barras o pastel:\n1. Lee el **título** y las **categorías** (ejes o leyenda).\n2. Identifica la frecuencia o porcentaje de cada categoría.\n3. Localiza la **más frecuente** (la porción/barra más grande = la **moda**) y la menos frecuente.\n4. Compara y saca conclusiones.\n\nEn el pastel del ejemplo, Fútbol ocupa 40%, Básquet 25%, Vóley 20% y Natación 15%. Todo suma 100%.","tip":"En un pastel todas las porciones suman 100%. Si te dan porcentajes que no suman 100, ¡algo está mal medido o falta una categoría!","chart":{"type":"pie","data":{"labels":["Fútbol (40%)","Básquet (25%)","Vóley (20%)","Natación (15%)"],"values":[8,5,4,3]}}}],"questions":[{"id":"n1q1","type":"mc","prompt":"En un colegio con 800 estudiantes se encuesta a 50 de ellos para conocer su deporte favorito. ¿Qué representa la MUESTRA?","options":["Los 800 estudiantes del colegio","Los 50 estudiantes encuestados","El deporte favorito","El colegio completo"],"correctIndex":1,"correction":"La población es TODO lo que queremos estudiar: los 800 estudiantes. La muestra es la parte que realmente observamos: los 50 encuestados. El 'deporte favorito' es la variable, no la muestra. Respuesta: los 50 estudiantes encuestados.","topic":"Población y muestra","points":10},{"id":"n1q2","type":"mc","prompt":"En ese mismo estudio, ¿qué es 'el deporte favorito'?","options":["La población","La variable","Un individuo","Un parámetro"],"correctIndex":1,"correction":"La variable es la característica que medimos en cada individuo: 'el deporte favorito'. Cada estudiante sería un individuo, y su respuesta concreta (ej. 'fútbol') sería un dato. Respuesta: la variable.","topic":"Variable, individuo y dato","points":10},{"id":"n1q3","type":"truefalse","prompt":"La proporción de aprobados calculada a partir de una MUESTRA de 50 estudiantes es un estadístico (no un parámetro).","options":["Verdadero","Falso"],"correctIndex":0,"correction":"Correcto: un estadístico se calcula a partir de una muestra y se usa para estimar el valor real de la población. El parámetro es el valor verdadero de TODA la población (normalmente desconocido). Como el 50 es una muestra, lo que calculamos con él es un estadístico. Respuesta: Verdadero.","topic":"Parámetro vs estadístico","points":15},{"id":"n1q4","type":"mc","prompt":"Se registró el color de ojos de 40 personas (ver gráfico). ¿De qué tipo es la variable 'color de ojos'?","options":["Cualitativa nominal","Cualitativa ordinal","Cuantitativa discreta","Cuantitativa continua"],"correctIndex":0,"correction":"El color de ojos son categorías (café, negro, verde, azul) que NO tienen un orden natural ni se expresan con números con sentido aritmético. Por eso es cualitativa nominal. Respuesta: Cualitativa nominal.","topic":"Tipos de variable (cualitativa)","points":10,"chart":{"type":"bar","data":{"labels":["Café","Negro","Verde","Azul"],"values":[22,10,5,3],"xlabel":"Color de ojos","ylabel":"Frecuencia","title":"Color de ojos (n = 40)"}}},{"id":"n1q5","type":"mc","prompt":"Se preguntó a 10 estudiantes cuántos hermanos tienen (ver gráfico de puntos). ¿De qué tipo es la variable 'número de hermanos'?","options":["Cualitativa nominal","Cuantitativa discreta","Cuantitativa continua","Cualitativa ordinal"],"correctIndex":1,"correction":"El número de hermanos se cuenta con valores enteros (0, 1, 2, 3…) y no admite decimales (nadie tiene 2.5 hermanos). Al contarse en valores separados, es cuantitativa discreta. Respuesta: Cuantitativa discreta.","topic":"Tipos de variable (cuantitativa)","points":15,"chart":{"type":"dotplot","data":{"values":[0,0,1,1,1,1,2,2,2,3],"xlabel":"Número de hermanos"}}},{"id":"n1q6","type":"truefalse","prompt":"La estatura de una persona medida en metros (por ejemplo, 1.72 m) es una variable cuantitativa continua.","options":["Verdadero","Falso"],"correctIndex":0,"correction":"La estatura se MIDE con un instrumento y admite decimales (1.72 m, 1.725 m…), tomando infinitos valores dentro de un rango. Por eso es cuantitativa continua. Respuesta: Verdadero.","topic":"Variable continua","points":15},{"id":"n1q7","type":"mc","prompt":"Se clasificó a 45 personas por su nivel educativo alcanzado (ver gráfico). ¿Qué escala de medición corresponde a 'nivel educativo' (Primaria, Secundaria, Universidad)?","options":["Nominal","Ordinal","Intervalo","Razón"],"correctIndex":1,"correction":"Las categorías tienen un ORDEN claro (Primaria < Secundaria < Universidad), pero no podemos decir que la 'distancia' entre ellas sea igual o medible. Orden sin distancias comparables = escala ordinal. Respuesta: Ordinal.","topic":"Escalas de medición","points":15,"chart":{"type":"bar","data":{"labels":["Primaria","Secundaria","Universidad"],"values":[15,20,10],"xlabel":"Nivel educativo","ylabel":"Frecuencia","title":"Nivel educativo alcanzado (n = 45)"}}},{"id":"n1q8","type":"numeric","prompt":"El gráfico muestra el color favorito de 40 personas: Rojo 10, Azul 16, Verde 8, Amarillo 6. ¿Cuál es la frecuencia relativa (hi) del color Azul? (Escribe el valor como proporción, entre 0 y 1.)","answer":0.4,"tolerance":0.01,"unit":"","correction":"La frecuencia relativa es hi = fi / n. Aquí fi(Azul) = 16 y el total n = 10 + 16 + 8 + 6 = 40. Entonces hi = 16 / 40 = 0.40. Respuesta: 0.40.","topic":"Tabla de frecuencia (frecuencia relativa)","points":20,"chart":{"type":"bar","data":{"labels":["Rojo","Azul","Verde","Amarillo"],"values":[10,16,8,6],"xlabel":"Color favorito","ylabel":"Frecuencia (fi)","title":"Color favorito (n = 40)"}}},{"id":"n1q9","type":"numeric","prompt":"En una encuesta a 40 personas sobre su mascota favorita: Perro 20, Gato 14, Pez 4, Ave 2 (ver gráfico circular). ¿Qué PORCENTAJE de personas prefiere el Gato?","answer":35,"tolerance":0.5,"unit":"%","correction":"El porcentaje es (fi / n) × 100. Aquí fi(Gato) = 14 y n = 20 + 14 + 4 + 2 = 40. Entonces (14 / 40) × 100 = 0.35 × 100 = 35%. Respuesta: 35%.","topic":"Tabla de frecuencia (porcentaje)","points":20,"chart":{"type":"pie","data":{"labels":["Perro","Gato","Pez","Ave"],"values":[20,14,4,2]}}},{"id":"n1q10","type":"numeric","prompt":"La tabla muestra la calificación del servicio de 40 clientes con sus frecuencias absolutas (fi). ¿Cuál es la frecuencia acumulada (Fi) hasta la categoría 'Bueno'?","answer":32,"tolerance":0.01,"unit":"","correction":"La frecuencia acumulada suma las fi desde arriba hasta la categoría indicada. Fi(Bueno) = Deficiente + Regular + Bueno = 5 + 12 + 15 = 32. (Comprobación: al llegar a 'Excelente', 32 + 8 = 40 = n.) Respuesta: 32.","topic":"Tabla de frecuencia (frecuencia acumulada)","points":25,"chart":{"type":"freqtable","data":{"headers":["Calificación","fi"],"rows":[["Deficiente",5],["Regular",12],["Bueno",15],["Excelente",8]]}}},{"id":"n1q11","type":"mc","prompt":"El gráfico muestra el medio de pago preferido de 100 clientes. ¿En cuál situación es MÁS apropiado usar un diagrama circular (de pastel)?","options":["Para mostrar cómo se reparte el 100% de una variable cualitativa en pocas categorías","Para mostrar la evolución de la temperatura a lo largo de 30 días","Para comparar con precisión 15 categorías con valores muy parecidos","Para representar una variable cuantitativa continua como el peso"],"correctIndex":0,"correction":"El diagrama circular sirve para mostrar la PROPORCIÓN de cada parte respecto al total (el 100%) y funciona bien con pocas categorías. La evolución en el tiempo se ve mejor con una línea; con muchas categorías parecidas conviene un gráfico de barras; y una variable continua se representa con un histograma. Respuesta: la primera opción.","topic":"Gráficos cualitativos: cuándo usar cada uno","points":25,"chart":{"type":"pie","data":{"labels":["Efectivo (40%)","Tarjeta (30%)","App móvil (20%)","Transferencia (10%)"],"values":[40,30,20,10]}}}]},{"level":2,"title":"Medidas y Distribuciones","subtitle":"Tendencia central, posicion, dispersion y forma de los datos","learning":[{"title":"Tendencia central: media, mediana y moda","body":"Estas tres medidas resumen un conjunto de datos en un solo numero 'representativo':\n\n- **Media** ($\\bar{x}$): suma de todos los valores dividida entre la cantidad de datos. $\\bar{x} = \\frac{\\sum x_i}{n}$. Usa TODOS los datos.\n- **Mediana**: el valor que queda justo en el centro cuando **ordenas** los datos. Si $n$ es impar es el del medio; si es par, el promedio de los dos centrales.\n- **Moda**: el valor que MAS se repite. Puede haber una, varias o ninguna.\n\n**Ejemplo cotidiano:** notas de 5 examenes $[5, 6, 7, 7, 10]$. Media $=\\frac{35}{5}=7$, mediana $=7$, moda $=7$. Cuando los datos son simetricos, las tres casi coinciden.","tip":"MOda = lo que esta de 'MOda' (lo que mas se repite). MEDiana = el del MEDio (ordena primero!).","chart":{"type":"dotplot","data":{"values":[5,6,7,7,10],"xlabel":"Nota del examen"}}},{"title":"Media vs. mediana: el efecto de los atipicos","body":"La **media** es sensible a valores extremos: un solo dato muy grande o muy pequeno la 'arrastra'. La **mediana** es **resistente** (robusta): apenas cambia.\n\n**Ejemplo:** sueldos (en miles) de un equipo $[8, 9, 10, 11, 60]$. La media es $\\frac{98}{5}=19.6$, pero casi todos ganan alrededor de 10. La mediana $=10$ describe mucho mejor al trabajador tipico.\n\n**Regla practica:** si la distribucion tiene atipicos o esta muy sesgada, reporta la **mediana**. Si es simetrica y sin extremos, la **media** es ideal.","tip":"Con valores atipicos o sesgo fuerte -> confia en la MEDIANA, no en la media.","chart":{"type":"dotplot","data":{"values":[8,9,10,11,60],"xlabel":"Sueldo (miles)"}}},{"title":"Medidas de posicion: cuartiles, percentiles y RIC","body":"Dividen los datos ordenados en partes iguales:\n\n- **Cuartiles**: parten los datos en 4 partes. **Q1** deja abajo el 25%, **Q2** = mediana (50%), **Q3** deja abajo el 75%.\n- **Percentiles**: parten en 100 partes. El percentil 90 ($P_{90}$) deja abajo al 90% de los datos (ej. estar en el $P_{90}$ de estatura = mas alto que el 90%).\n- **Rango intercuartilico (RIC o IQR)**: $IQR = Q3 - Q1$. Mide la amplitud del **50% central** de los datos, ignorando los extremos.\n\n**Como hallar cuartiles (metodo de mitades):** ordena, encuentra la mediana, y calcula Q1 = mediana de la mitad inferior y Q3 = mediana de la mitad superior.","tip":"RIC = Q3 - Q1 = 'ancho del 50% del medio'. Es robusto: los atipicos no lo afectan.","chart":{"type":"boxplot","data":{"min":4,"q1":8,"median":12,"q3":16,"max":22}}},{"title":"Dispersion: rango, varianza, desviacion estandar y CV","body":"Miden que tan **separados** o dispersos estan los datos:\n\n- **Rango** $= \\text{maximo} - \\text{minimo}$. Simple, pero solo mira los extremos.\n- **Varianza** ($\\sigma^2$): promedio de las distancias al cuadrado respecto a la media. $\\sigma^2 = \\frac{\\sum (x_i-\\bar{x})^2}{n}$.\n- **Desviacion estandar** ($\\sigma$): raiz de la varianza, $\\sigma=\\sqrt{\\sigma^2}$. Vuelve a las **unidades originales**; dice cuanto se alejan tipicamente los datos de la media.\n- **Coeficiente de variacion** ($CV$): $CV = \\frac{\\sigma}{\\bar{x}}\\times 100\\%$. Es **relativo** y sin unidades; sirve para comparar dispersiones entre grupos con medias distintas.\n\nEn una curva normal, cerca del **68%** de los datos cae dentro de $\\bar{x}\\pm\\sigma$.","tip":"Sigma pequena = datos apretados; sigma grande = muy dispersos. Para COMPARAR grupos distintos usa el CV (%).","chart":{"type":"normal","data":{"mean":100,"sd":15,"regions":true,"markers":[70,85,100,115,130]}}},{"title":"Histograma, forma y asimetria (sesgo)","body":"El **histograma** agrupa los datos en intervalos (clases) y dibuja barras cuya altura es la frecuencia. Su **forma** revela mucho:\n\n- **Simetrica**: media $\\approx$ mediana $\\approx$ moda.\n- **Sesgo a la derecha (positivo)**: cola larga hacia valores altos. La media es 'jalada' por la cola: **media > mediana > moda**.\n- **Sesgo a la izquierda (negativo)**: cola larga hacia valores bajos: **media < mediana < moda**.\n\n**Ejemplo:** el ingreso de una poblacion suele tener sesgo positivo (pocos ganan muchisimo), por eso se reporta la mediana.","tip":"La media SIGUE a la cola. Cola a la derecha -> media a la derecha (mayor que la mediana).","chart":{"type":"histogram","data":{"bins":[{"range":"0-10","freq":12},{"range":"10-20","freq":9},{"range":"20-30","freq":5},{"range":"30-40","freq":2},{"range":"40-50","freq":1}],"xlabel":"Valor","ylabel":"Frecuencia"}}},{"title":"Diagrama de cajas y regla 1.5 x IQR","body":"El **boxplot** resume 5 numeros: **minimo, Q1, mediana, Q3 y maximo**. La caja abarca el 50% central (de Q1 a Q3) y los 'bigotes' se estiran hasta los datos no atipicos.\n\n**Detectar valores atipicos (regla 1.5 x IQR):**\n$IQR = Q3 - Q1$.\n- Limite inferior (cerca) $= Q1 - 1.5\\times IQR$.\n- Limite superior (cerca) $= Q3 + 1.5\\times IQR$.\n\nCualquier dato **fuera** de esos limites es un **valor atipico** (outlier) y se dibuja como punto suelto.\n\n**Ejemplo:** si $Q1=10$ y $Q3=18$, entonces $IQR=8$; limite superior $=18+1.5(8)=30$. Un dato de 40 seria atipico.","tip":"Multiplica el IQR por 1.5 y ponlo como 'cercas' a ambos lados de la caja: lo que se sale, es atipico.","chart":{"type":"boxplot","data":{"min":5,"q1":10,"median":13,"q3":18,"max":26,"outliers":[40]}}}],"questions":[{"id":"q1","type":"numeric","topic":"Media aritmetica","points":10,"prompt":"Calcula la MEDIA de estos datos: 4, 6, 8, 10, 12.","answer":8,"tolerance":0.01,"correction":"Suma todos los valores: 4+6+8+10+12 = 40. Divide entre la cantidad de datos (n = 5): 40 / 5 = 8. La media es 8.","chart":{"type":"dotplot","data":{"values":[4,6,8,10,12],"xlabel":"Valor"}}},{"id":"q2","type":"mc","topic":"Mediana","points":12,"prompt":"Cual es la MEDIANA del conjunto: 3, 7, 8, 5, 12?","options":["7","8","6","5"],"correctIndex":0,"correction":"Primero ORDENA los datos: 3, 5, 7, 8, 12. Con n = 5 (impar), la mediana es el valor central (posicion 3): 7. Error comun: tomar el del medio SIN ordenar, que daria 8 (incorrecto).","chart":{"type":"dotplot","data":{"values":[3,5,7,8,12],"xlabel":"Valor"}}},{"id":"q3","type":"numeric","topic":"Moda","points":10,"prompt":"Cual es la MODA de: 2, 3, 3, 5, 7, 3, 8?","answer":3,"tolerance":0.01,"correction":"La moda es el valor que MAS se repite. Contando: el 3 aparece 3 veces y los demas solo 1 vez. Por tanto, la moda = 3.","chart":{"type":"bar","data":{"labels":["2","3","5","7","8"],"values":[1,3,1,1,1],"xlabel":"Valor","ylabel":"Frecuencia","title":"Frecuencia de cada dato"}}},{"id":"q4","type":"numeric","topic":"Rango","points":10,"prompt":"Calcula el RANGO de: 5, 9, 2, 14, 7.","answer":12,"tolerance":0.01,"correction":"Rango = valor maximo - valor minimo. El maximo es 14 y el minimo es 2. Rango = 14 - 2 = 12.","chart":{"type":"dotplot","data":{"values":[2,5,7,9,14],"xlabel":"Valor"}}},{"id":"q5","type":"mc","topic":"Media vs mediana y atipicos","points":15,"prompt":"Los ingresos mensuales (en miles) de 5 personas son: 10, 12, 14, 16, 100. Cual medida representa MEJOR el ingreso tipico del grupo?","options":["La mediana (14), porque el dato atipico 100 infla la media","La media (30.4), porque usa todos los datos","La moda, porque es la mas facil de calcular","El rango, porque mide la separacion de los datos"],"correctIndex":0,"correction":"Media = (10+12+14+16+100)/5 = 152/5 = 30.4. Mediana (datos ordenados) = 14. El valor 100 es atipico y 'arrastra' la media hasta 30.4, lejos de casi todos. La mediana (14) resiste al atipico y describe mejor el ingreso tipico.","chart":{"type":"dotplot","data":{"values":[10,12,14,16,100],"xlabel":"Ingreso (miles)"}}},{"id":"q6","type":"truefalse","topic":"Asimetria (sesgo positivo)","points":15,"prompt":"En una distribucion con sesgo positivo (cola hacia la derecha), la media es MENOR que la mediana.","options":["Verdadero","Falso"],"correctIndex":1,"correction":"En un sesgo positivo la cola de valores altos empuja la media POR ENCIMA de la mediana: media > mediana. La afirmacion dice lo contrario, asi que es FALSA.","chart":{"type":"histogram","data":{"bins":[{"range":"0-10","freq":12},{"range":"10-20","freq":9},{"range":"20-30","freq":5},{"range":"30-40","freq":2},{"range":"40-50","freq":1}],"xlabel":"Valor","ylabel":"Frecuencia"}}},{"id":"q7","type":"numeric","topic":"Coeficiente de variacion","points":18,"prompt":"Un grupo de datos tiene media = 20 y desviacion estandar = 4. Calcula el COEFICIENTE DE VARIACION (en %).","answer":20,"tolerance":0.5,"unit":"%","correction":"CV = (desviacion estandar / media) x 100 = (4 / 20) x 100 = 0.2 x 100 = 20%. El CV expresa la dispersion RELATIVA y no tiene unidades, por eso sirve para comparar grupos con medias distintas.","chart":{"type":"bar","data":{"labels":["Media","Desv. estandar"],"values":[20,4],"ylabel":"Valor","title":"Datos del grupo"}}},{"id":"q8","type":"numeric","topic":"Cuartiles y RIC (IQR)","points":18,"prompt":"Para los datos 1, 3, 5, 7, 9, 11, 13, 15, calcula el RANGO INTERCUARTILICO (RIC = Q3 - Q1). Pista: divide en dos mitades y saca la mediana de cada una.","answer":8,"tolerance":0.01,"correction":"Datos ordenados (n = 8): 1,3,5,7,9,11,13,15. Mediana = (7+9)/2 = 8. Mitad inferior {1,3,5,7} -> Q1 = (3+5)/2 = 4. Mitad superior {9,11,13,15} -> Q3 = (11+13)/2 = 12. RIC = Q3 - Q1 = 12 - 4 = 8.","chart":{"type":"dotplot","data":{"values":[1,3,5,7,9,11,13,15],"xlabel":"Valor"}}},{"id":"q9","type":"mc","topic":"Forma de la distribucion (sesgo negativo)","points":20,"prompt":"El histograma muestra una distribucion con la cola hacia la IZQUIERDA (sesgo negativo). Que orden esperas entre media, mediana y moda?","options":["media < mediana < moda","moda < mediana < media","media = mediana = moda","media > moda > mediana"],"correctIndex":0,"correction":"Con cola hacia la izquierda (sesgo negativo), los valores bajos jalan la media hacia abajo, mientras la moda queda en el pico (valores altos). Por eso: media < mediana < moda.","chart":{"type":"histogram","data":{"bins":[{"range":"0-10","freq":1},{"range":"10-20","freq":3},{"range":"20-30","freq":6},{"range":"30-40","freq":14},{"range":"40-50","freq":10}],"xlabel":"Valor","ylabel":"Frecuencia"}}},{"id":"q10","type":"numeric","topic":"Boxplot y regla 1.5 x IQR","points":22,"prompt":"En este diagrama de cajas, Q1 = 10 y Q3 = 20. A partir de que valor (limite superior) un dato se considera ATIPICO por arriba?","answer":35,"tolerance":0.01,"correction":"IQR = Q3 - Q1 = 20 - 10 = 10. Limite superior = Q3 + 1.5 x IQR = 20 + 1.5 x 10 = 20 + 15 = 35. Todo dato mayor a 35 es atipico; por eso el 42 aparece como punto suelto.","chart":{"type":"boxplot","data":{"min":6,"q1":10,"median":14,"q3":20,"max":30,"outliers":[42]}}},{"id":"q11","type":"numeric","topic":"Desviacion estandar","points":25,"prompt":"Calcula la DESVIACION ESTANDAR POBLACIONAL de: 2, 4, 4, 4, 5, 5, 7, 9. (Divide la suma de las desviaciones al cuadrado entre n = 8.)","answer":2,"tolerance":0.01,"correction":"Media = 40/8 = 5. Desviaciones al cuadrado: (2-5)^2=9; (4-5)^2=1 (tres veces = 3); (5-5)^2=0 (dos veces = 0); (7-5)^2=4; (9-5)^2=16. Suma = 9+3+0+4+16 = 32. Varianza poblacional = 32/8 = 4. Desviacion estandar = raiz(4) = 2.","chart":{"type":"dotplot","data":{"values":[2,4,4,4,5,5,7,9],"xlabel":"Valor"}}}]},{"level":3,"title":"Estadística Intermedia","subtitle":"Curva de campana, probabilidad, correlación e hipótesis: da el salto a la estadística que se usa de verdad.","learning":[{"title":"La curva de campana (distribución normal)","body":"Muchos datos naturales (estaturas, notas, peso) se agrupan en el centro y se hacen raros en los extremos, formando una **curva de campana** simétrica.\n\nEn una normal perfecta la **media = mediana = moda** y caen justo en el pico del centro. La dispersión se mide con la **desviación estándar (σ)**: cuanto mayor es σ, más ancha y aplanada es la campana.\n\n- Es **simétrica**: la mitad de los datos está a cada lado del centro.\n- El ancho lo marca σ, no la altura.","tip":"Media = Mediana = Moda solo coinciden si la curva es simétrica. Si se 'inclina', dejan de coincidir.","chart":{"type":"normal","data":{"mean":100,"sd":15,"regions":true,"markers":[55,70,85,100,115,130,145],"title":"Distribución normal simétrica"}}},{"title":"La regla empírica 68–95–99.7","body":"En cualquier distribución normal, los datos se reparten de forma fija alrededor de la media según cuántas σ te alejes:\n\n- **±1σ → 68%** de los datos.\n- **±2σ → 95%** de los datos.\n- **±3σ → 99.7%** (casi todo).\n\nComo la curva es simétrica, cada 'mitad' de una franja vale la mitad. Ejemplo: fuera de ±2σ queda 5%, y por ser simétrica solo **2.5%** está por encima de +2σ.","tip":"Mnemotecnia: '1, 2, 3 → 68, 95, 99.7'. Uno, dos, tres desviaciones.","chart":{"type":"normal","data":{"mean":170,"sd":10,"shade":[160,180],"markers":[140,150,160,170,180,190,200],"title":"±1σ contiene 68%"}}},{"title":"Probabilidad: eventos, complemento y árbol","body":"El **espacio muestral** son todos los resultados posibles (al lanzar un dado: {1,2,3,4,5,6}). La probabilidad de un evento es:\n\n$P(A) = \\dfrac{\\text{casos favorables}}{\\text{casos posibles}}$\n\n- **Complemento:** $P(\\text{no } A) = 1 - P(A)$.\n- **Eventos independientes** (uno no afecta al otro): se multiplican → $P(A \\text{ y } B) = P(A)\\times P(B)$.\n\nUn **árbol de probabilidad** dibuja las etapas: multiplicas a lo largo de las ramas para obtener la probabilidad de un camino completo.","tip":"Por caminos: MULTIPLICA a lo largo de las ramas. Entre caminos distintos: SUMA.","chart":{"type":"tree","data":{"branches":[{"label":"Línea A","p":0.6,"children":[{"label":"OK","p":0.7},{"label":"Falla","p":0.3}]},{"label":"Línea B","p":0.4,"children":[{"label":"OK","p":0.9},{"label":"Falla","p":0.1}]}]}}},{"title":"Correlación y diagrama de dispersión","body":"Un **diagrama de dispersión** coloca cada individuo como un punto (x, y) para ver si dos variables se relacionan:\n\n- **Correlación positiva:** cuando una sube, la otra sube (nube ascendente).\n- **Correlación negativa:** cuando una sube, la otra baja (nube descendente).\n- **Correlación nula:** puntos dispersos sin patrón.\n\n**¡Ojo!** Correlación **NO** significa causalidad. Que las ventas de helado y los ahogamientos suban juntos no significa que el helado cause ahogamientos: los une el calor (una tercera variable).","tip":"Correlación ≠ Causalidad. Antes de decir 'X causa Y', busca una tercera variable escondida.","chart":{"type":"scatter","data":{"points":[[1,2],[2,2.5],[3,3.2],[4,3.5],[5,4.4],[6,4.8],[7,5.6]],"showTrend":true,"xlabel":"Horas de estudio","ylabel":"Nota"}}},{"title":"Intervalo de confianza del 95%","body":"Cuando estimamos algo con una muestra (ej. 60% votará 'sí'), damos un rango realista en vez de un solo número:\n\n$\\text{IC} = \\text{estimación} \\pm \\text{margen de error}$\n\nCon margen de 3%: el IC 95% va de **57% a 63%**. El **límite inferior** es 57 y el **superior** es 63.\n\nInterpretación correcta: si repitiéramos el muestreo muchas veces, el 95% de esos intervalos contendría el valor real. **No** es 'hay 95% de probabilidad de que el valor esté aquí'.","tip":"Límite inferior = estimación − margen. Límite superior = estimación + margen.","chart":{"type":"ci","data":{"estimate":60,"lower":57,"upper":63,"level":95,"unit":"%"}}},{"title":"Introducción a la prueba de hipótesis y chi-cuadrado","body":"Una prueba de hipótesis decide entre dos afirmaciones:\n\n- **Hipótesis nula (H₀):** 'no hay efecto / no hay diferencia'.\n- **Hipótesis alternativa (H₁):** 'sí hay efecto'.\n\nFijamos un **nivel de significancia** (α, típico 0.05) que define la **región de rechazo**. Calculamos un estadístico de prueba (por ejemplo **χ² chi-cuadrado**) y lo comparamos con el **valor crítico**:\n\n- Si el estadístico **cae en la región de rechazo** (χ² calculado > χ² crítico) → **rechazamos H₀**.\n- Si no → no hay evidencia suficiente contra H₀.\n\nLos **valores atípicos** (outliers) son datos muy alejados que pueden distorsionar el análisis.","tip":"'Grande rechaza': si tu estadístico supera el valor crítico, cae en la zona roja y rechazas H₀.","chart":{"type":"chisquare","data":{"df":3,"critical":7.81,"statistic":9.2}}}],"questions":[{"id":"n3q1","type":"mc","topic":"Distribución normal","points":10,"prompt":"En una distribución normal perfecta (curva de campana simétrica), ¿qué ocurre con la media, la mediana y la moda?","options":["Coinciden en el mismo valor central","La media es mayor que la mediana","La moda está en el extremo derecho","La mediana vale el doble de la media"],"correctIndex":0,"correction":"En una normal perfecta la curva es simétrica, así que el centro es a la vez el punto más frecuente (moda), el que deja 50% a cada lado (mediana) y el promedio (media). Por eso las tres medidas coinciden justo en el pico central.","chart":{"type":"normal","data":{"mean":100,"sd":15,"regions":true,"markers":[55,70,85,100,115,130,145]}}},{"id":"n3q2","type":"numeric","topic":"Regla empírica","points":12,"prompt":"Según la regla empírica, ¿qué porcentaje aproximado de los datos cae dentro de ±1 desviación estándar (±1σ) de la media? (responde el número del porcentaje)","answer":68,"tolerance":0.5,"unit":"%","correction":"La regla empírica dice: ±1σ → 68%, ±2σ → 95%, ±3σ → 99.7%. Por lo tanto, dentro de ±1σ cae aproximadamente el 68% de los datos.","chart":{"type":"normal","data":{"mean":100,"sd":15,"shade":[85,115],"markers":[55,70,85,100,115,130,145]}}},{"id":"n3q3","type":"numeric","topic":"Probabilidad básica","points":12,"prompt":"Se lanza un dado justo de 6 caras. ¿Cuál es la probabilidad de obtener un número par? (responde como decimal, ej. 0.5)","answer":0.5,"tolerance":0.01,"correction":"Los números pares del dado son {2, 4, 6}, es decir 3 casos favorables de 6 posibles. P(par) = 3/6 = 0.5.","chart":{"type":"bar","data":{"labels":["1","2","3","4","5","6"],"values":[1,1,1,1,1,1],"xlabel":"Cara del dado","ylabel":"Casos","title":"Espacio muestral del dado"}}},{"id":"n3q4","type":"numeric","topic":"Complemento","points":15,"prompt":"La probabilidad de que llueva mañana es P(lluvia) = 0.3. ¿Cuál es la probabilidad de que NO llueva? (responde como decimal)","answer":0.7,"tolerance":0.01,"correction":"El evento 'no llueva' es el complemento de 'llueva'. P(no A) = 1 − P(A) = 1 − 0.3 = 0.7.","chart":{"type":"pie","data":{"labels":["Llueve (0.3)","No llueve (?)"],"values":[30,70]}}},{"id":"n3q5","type":"numeric","topic":"Árbol de probabilidad","points":25,"prompt":"En una fábrica, el 60% de los productos vienen de la Línea A y el 40% de la Línea B. En la Línea A, el 70% pasa el control de calidad (OK). ¿Cuál es la probabilidad de que un producto sea de la Línea A Y pase el control? (responde como decimal)","answer":0.42,"tolerance":0.01,"correction":"Sigues el camino 'Línea A' y luego 'OK' multiplicando las ramas: P(A y OK) = P(A) × P(OK|A) = 0.60 × 0.70 = 0.42.","chart":{"type":"tree","data":{"branches":[{"label":"Línea A","p":0.6,"children":[{"label":"OK","p":0.7},{"label":"Falla","p":0.3}]},{"label":"Línea B","p":0.4,"children":[{"label":"OK","p":0.9},{"label":"Falla","p":0.1}]}]}}},{"id":"n3q6","type":"numeric","topic":"Regla empírica aplicada","points":20,"prompt":"Las estaturas de un grupo siguen una distribución normal con media 170 cm y σ = 10 cm. ¿Qué porcentaje aproximado de personas mide entre 150 cm y 190 cm? (responde el número del porcentaje)","answer":95,"tolerance":0.5,"unit":"%","correction":"150 cm = 170 − 2(10) es la media menos 2σ, y 190 cm = 170 + 2(10) es la media más 2σ. El intervalo va de −2σ a +2σ, que por la regla empírica contiene el 95% de los datos.","chart":{"type":"normal","data":{"mean":170,"sd":10,"shade":[150,190],"markers":[140,150,160,170,180,190,200]}}},{"id":"n3q7","type":"numeric","topic":"Regla empírica (colas)","points":28,"prompt":"Los puntajes de CI siguen una normal con media 100 y σ = 15. ¿Qué porcentaje aproximado de personas obtiene un puntaje MAYOR a 130? (responde el número del porcentaje)","answer":2.5,"tolerance":0.1,"unit":"%","correction":"130 = 100 + 2(15), es decir +2σ. Dentro de ±2σ está el 95%, así que fuera queda 5%. Como la curva es simétrica, ese 5% se reparte en dos colas iguales: la cola por encima de +2σ vale 5% ÷ 2 = 2.5%.","chart":{"type":"normal","data":{"mean":100,"sd":15,"shade":[130,160],"markers":[55,70,85,100,115,130,145]}}},{"id":"n3q8","type":"mc","topic":"Correlación","points":18,"prompt":"Observa el diagrama de dispersión. ¿Qué tipo de correlación muestran las dos variables?","options":["Correlación positiva","Correlación negativa","Correlación nula (sin relación)","No se puede determinar"],"correctIndex":1,"correction":"A medida que X aumenta, Y disminuye de forma clara (la nube de puntos y la línea de tendencia bajan de izquierda a derecha). Ese patrón descendente es una correlación negativa.","chart":{"type":"scatter","data":{"points":[[1,9],[2,8.4],[3,7],[4,6.1],[5,4.6],[6,3.2],[7,2]],"showTrend":true,"xlabel":"Horas de videojuego","ylabel":"Horas de sueño"}}},{"id":"n3q9","type":"truefalse","topic":"Correlación vs causalidad","points":15,"prompt":"Verdadero o Falso: si dos variables tienen una correlación positiva fuerte, entonces queda demostrado que una de ellas CAUSA la otra.","options":["Verdadero","Falso"],"correctIndex":1,"correction":"Falso. La correlación NO implica causalidad. Dos variables pueden moverse juntas por casualidad o porque una tercera variable oculta las afecta a ambas (ej. el calor sube tanto las ventas de helado como los ahogamientos). Correlación no prueba causa.","chart":{"type":"scatter","data":{"points":[[1,2],[2,2.6],[3,3.1],[4,3.9],[5,4.3],[6,5.2]],"showTrend":true,"xlabel":"Ventas de helado","ylabel":"Ahogamientos"}}},{"id":"n3q10","type":"numeric","topic":"Intervalo de confianza","points":22,"prompt":"Una encuesta estima que el 60% de las personas votará 'sí', con un margen de error de 3% (IC del 95%). ¿Cuál es el LÍMITE INFERIOR del intervalo de confianza? (responde el número del porcentaje)","answer":57,"tolerance":0.5,"unit":"%","correction":"El intervalo es estimación ± margen = 60% ± 3%. El límite inferior es 60 − 3 = 57% y el superior es 60 + 3 = 63%. Por eso el IC 95% va de 57% a 63%.","chart":{"type":"ci","data":{"estimate":60,"lower":57,"upper":63,"level":95,"unit":"%"}}},{"id":"n3q11","type":"mc","topic":"Prueba de hipótesis (chi-cuadrado)","points":25,"prompt":"En una prueba chi-cuadrado con α = 0.05, el estadístico calculado es χ² = 9.2 y el valor crítico es 7.81. ¿Qué decisión corresponde tomar?","options":["Rechazar H₀: el estadístico cae en la región de rechazo","No rechazar H₀: el estadístico es demasiado pequeño","Aceptar H₀ con total certeza","No se puede decidir sin conocer la media"],"correctIndex":0,"correction":"Comparamos el estadístico con el valor crítico: 9.2 > 7.81. Como el χ² calculado SUPERA al crítico, cae dentro de la región de rechazo, así que se rechaza la hipótesis nula H₀. Regla: 'grande rechaza'.","chart":{"type":"chisquare","data":{"df":3,"critical":7.81,"statistic":9.2}}}]},{"level":4,"title":"Estadística Aplicada","subtitle":"Correlación, regresión lineal, prueba t y ANOVA: el salto a la estadística que se usa en investigación.","learning":[{"title":"Correlación: ¿se mueven juntas?","body":"La **correlación** mide si dos variables numéricas tienden a moverse juntas. Se resume con el **coeficiente de Pearson (r)**, que va de **−1 a +1**:\n- **r > 0**: correlación **positiva** (cuando una sube, la otra tiende a subir).\n- **r < 0**: correlación **negativa** (cuando una sube, la otra tiende a bajar).\n- **r ≈ 0**: no hay relación lineal.\n\nEn el gráfico, más horas de estudio se asocian con mejores notas: nube de puntos ascendente → r positivo.","tip":"El SIGNO de r te dice la dirección (sube/baja) y su VALOR ABSOLUTO te dice la fuerza (qué tan pegados están los puntos a una línea).","chart":{"type":"scatter","data":{"points":[[1,2],[2,2.5],[3,4],[4,4],[5,5.5],[6,6]],"showTrend":true,"xlabel":"Horas de estudio","ylabel":"Nota"}}},{"title":"Interpretar la fuerza de r","body":"El valor absoluto de r indica la **fuerza**:\n- **0.0 a 0.3**: correlación **débil**.\n- **0.3 a 0.7**: correlación **moderada**.\n- **0.7 a 1.0**: correlación **fuerte**.\n\nUna r cercana a −1 (como en el gráfico) es una correlación **negativa fuerte**: los puntos casi forman una línea descendente.","tip":"r = −0.9 y r = +0.9 son igual de FUERTES; solo cambian de dirección.","chart":{"type":"scatter","data":{"points":[[1,9],[2,8],[3,7.5],[4,5.5],[5,4],[6,3]],"showTrend":true,"xlabel":"Horas de TV","ylabel":"Nota"}}},{"title":"⚠️ Correlación NO es causalidad","body":"Que dos cosas estén correlacionadas **no** significa que una **cause** la otra. Ejemplo clásico: en verano se venden más helados **y** hay más ahogamientos. ¿El helado causa ahogamientos? No: hay una **tercera variable** (el calor) que hace subir ambas.\n\nAntes de afirmar causa-efecto necesitas más que correlación: un experimento controlado o descartar variables ocultas.","tip":"Frase para recordar: «Correlación no implica causalidad». Busca siempre una posible variable escondida (de confusión)."},{"title":"Regresión lineal: la recta que predice","body":"La **regresión lineal simple** encuentra la mejor recta que resume la relación, la **recta de mínimos cuadrados**:\n\n$ŷ = a + b·x$\n\n- **a** (intercepto): valor de ŷ cuando x = 0.\n- **b** (pendiente): cuánto cambia ŷ por cada unidad que aumenta x.\n\nPara **predecir**, sustituyes un valor de x. Si $ŷ = 1.5 + 1.5·x$, para x = 4 → ŷ = 1.5 + 1.5·4 = **7.5**.","tip":"La pendiente b es la «velocidad»: b positiva = recta sube, b negativa = recta baja.","chart":{"type":"scatter","data":{"points":[[1,3],[2,5],[3,6],[4,8],[5,9]],"showTrend":true,"xlabel":"x","ylabel":"ŷ"}}},{"title":"R²: ¿qué tan buena es la recta?","body":"El **coeficiente de determinación R²** mide qué proporción de la variación de Y explica el modelo. Va de **0 a 1** (o 0% a 100%):\n- **R² = 1**: la recta explica TODA la variación (ajuste perfecto).\n- **R² = 0**: la recta no explica nada.\n\nAdemás, en regresión simple **R² = r²**. Si r = 0.8 → R² = 0.64 → el modelo explica el **64%** de la variación.","tip":"Truco: R² es literalmente r al cuadrado. Por eso R² nunca es negativo, aunque r sí pueda serlo."},{"title":"Prueba t: ¿la diferencia es real o azar?","body":"La **prueba t de Student** decide si una diferencia observada es **estadísticamente significativa** o pudo salir por azar. Pasos:\n1. **H₀ (hipótesis nula)**: no hay diferencia. **H₁ (alternativa)**: sí la hay.\n2. Se calcula el **estadístico t** y su **valor p**.\n3. Se compara p con el **nivel de significancia α** (normalmente 0.05):\n- Si **p < α** → se **rechaza H₀** (la diferencia es significativa).\n- Si **p ≥ α** → **no** se rechaza H₀.\n\nSi t cae en la **zona roja** (más allá del valor crítico), se rechaza H₀.","tip":"Regla de oro: «p pequeño (menor que α), rechazo H₀». p bajo = evidencia fuerte contra la nula.","chart":{"type":"tdist","data":{"df":12,"critical":2.18,"statistic":2.6,"tails":2}}},{"title":"ANOVA: comparar muchos grupos","body":"Cuando quieres comparar las medias de **3 o más grupos**, no se hacen muchas pruebas t (eso infla el error). Se usa el **ANOVA (análisis de varianza)**:\n- **H₀**: todas las medias poblacionales son iguales.\n- **H₁**: al menos una media es diferente.\n- Se calcula el estadístico **F** = variabilidad **entre** grupos / variabilidad **dentro** de los grupos.\n- Un **F grande** (y un **p < α**) indica que al menos un grupo difiere.\n\nEn el gráfico, el grupo C se ve claramente más alto: probablemente hay diferencias.","tip":"F compara «qué tan separados están los grupos» contra «qué tanto varían por dentro». Mucho entre / poco dentro = F grande.","chart":{"type":"multibox","data":{"ylabel":"Puntaje","groups":[{"label":"Método A","min":4,"q1":6,"median":7,"q3":8,"max":10},{"label":"Método B","min":5,"q1":6,"median":7,"q3":9,"max":11},{"label":"Método C","min":9,"q1":11,"median":12,"q3":14,"max":16}]}}}],"questions":[{"id":"l4q1","type":"mc","topic":"Correlación","points":15,"prompt":"Observa la nube de puntos: a más horas de estudio, mayor es la nota, y los puntos están muy cerca de una línea ascendente. ¿Cómo describes esta correlación?","chart":{"type":"scatter","data":{"points":[[1,2],[2,3],[3,3.5],[4,5],[5,5.5],[6,7],[7,7.5]],"showTrend":true,"xlabel":"Horas de estudio","ylabel":"Nota"}},"options":["Correlación positiva fuerte","Correlación negativa fuerte","No hay correlación","Correlación positiva débil"],"correctIndex":0,"correction":"Los puntos suben de izquierda a derecha (cuando x sube, y sube) → correlación POSITIVA. Y como están muy pegados a una línea, es FUERTE (r cercano a +1). Respuesta: correlación positiva fuerte."},{"id":"l4q2","type":"mc","topic":"Correlación","points":15,"prompt":"En este gráfico, a más horas de TV, menor es la nota, y los puntos casi forman una línea descendente. ¿Qué correlación hay?","chart":{"type":"scatter","data":{"points":[[1,9],[2,8],[3,8],[4,6],[5,5],[6,4],[7,2]],"showTrend":true,"xlabel":"Horas de TV","ylabel":"Nota"}},"options":["Positiva moderada","Nula","Negativa fuerte","Negativa débil"],"correctIndex":2,"correction":"Cuando x sube, y baja → correlación NEGATIVA (r < 0). Como los puntos están muy alineados, es FUERTE (r cercano a −1). Respuesta: negativa fuerte."},{"id":"l4q3","type":"truefalse","topic":"Causalidad","points":18,"prompt":"Se observa una correlación fuerte entre el número de bomberos enviados a un incendio y los daños causados. Por lo tanto, enviar más bomberos CAUSA más daños.","options":["Verdadero","Falso"],"correctIndex":1,"correction":"Falso. Correlación NO implica causalidad. Hay una tercera variable (el tamaño del incendio) que hace subir ambas cosas: incendios grandes provocan más daños y requieren más bomberos. Respuesta: Falso."},{"id":"l4q4","type":"numeric","topic":"Regresión (predicción)","points":20,"prompt":"La recta de regresión que ajusta estos datos es ŷ = 5 + 2·x. ¿Qué valor de ŷ predice el modelo para x = 10?","chart":{"type":"scatter","data":{"points":[[1,7],[2,9],[3,11],[4,13],[5,15]],"showTrend":true,"xlabel":"x","ylabel":"ŷ"}},"answer":25,"tolerance":0.01,"correction":"Sustituye x = 10 en la ecuación: ŷ = 5 + 2·(10) = 5 + 20 = 25. Respuesta: 25."},{"id":"l4q5","type":"mc","topic":"Regresión (pendiente)","points":20,"prompt":"En la recta de regresión ŷ = 20 − 3·x, ¿qué significa la pendiente −3?","options":["Por cada unidad que aumenta x, ŷ disminuye 3","Por cada unidad que aumenta x, ŷ aumenta 3","ŷ siempre vale 3","x vale −3 cuando ŷ = 0"],"correctIndex":0,"correction":"La pendiente b es el cambio en ŷ por cada unidad que sube x. Como b = −3 (negativa), cada aumento de 1 en x hace que ŷ BAJE 3 unidades. Respuesta: por cada unidad que aumenta x, ŷ disminuye 3."},{"id":"l4q6","type":"numeric","topic":"R² (determinación)","points":20,"unit":"%","prompt":"Un modelo de regresión tiene R² = 0.64. ¿Qué PORCENTAJE de la variación de Y explica el modelo?","answer":64,"tolerance":0.5,"correction":"R² es una proporción; para pasarla a porcentaje se multiplica por 100: 0.64 × 100 = 64%. El modelo explica el 64% de la variación de Y. Respuesta: 64%."},{"id":"l4q7","type":"mc","topic":"R² (determinación)","points":20,"prompt":"Un estudio informa R² = 0.49 para la relación entre ejercicio (x) y colesterol (y). ¿Cuál es la interpretación correcta?","options":["El 49% de la variación del colesterol se explica por el modelo","El 49% de los datos son incorrectos","La correlación es exactamente 0.49","El colesterol baja 49% con ejercicio"],"correctIndex":0,"correction":"R² = proporción de la variación de Y explicada por el modelo. R² = 0.49 significa que el 49% de la variación del colesterol queda explicada por la recta (el 51% restante se debe a otros factores). Respuesta: el 49% de la variación se explica por el modelo."},{"id":"l4q8","type":"numeric","topic":"R² = r²","points":22,"unit":"%","prompt":"En una regresión lineal simple, el coeficiente de correlación es r = 0.6. ¿Cuánto vale R² expresado en PORCENTAJE? (Pista: R² = r².)","answer":36,"tolerance":0.5,"correction":"En regresión simple, R² = r². Entonces R² = (0.6)² = 0.36, que en porcentaje es 0.36 × 100 = 36%. Respuesta: 36%."},{"id":"l4q9","type":"mc","topic":"Prueba t","points":24,"prompt":"En una prueba t con α = 0.05 se obtiene un valor p = 0.02 (y el estadístico cae en la zona de rechazo, como muestra el gráfico). ¿Qué decisión corresponde?","chart":{"type":"tdist","data":{"df":20,"critical":2.09,"statistic":2.6,"tails":2}},"options":["Se rechaza H₀: la diferencia es estadísticamente significativa","No se rechaza H₀: no hay diferencia","No se puede decidir sin conocer la media","Se acepta H₀ con total certeza"],"correctIndex":0,"correction":"Regla: si p < α se rechaza H₀. Aquí p = 0.02 < 0.05 = α, y el estadístico t cae en la región roja de rechazo. Por lo tanto se rechaza H₀: la diferencia es significativa. Respuesta: se rechaza H₀."},{"id":"l4q10","type":"truefalse","topic":"Prueba de hipótesis","points":22,"prompt":"En una prueba de hipótesis, si el valor p es MAYOR que el nivel de significancia α, entonces se rechaza la hipótesis nula H₀.","chart":{"type":"tdist","data":{"df":15,"critical":2.13,"statistic":1.1,"tails":2}},"options":["Verdadero","Falso"],"correctIndex":1,"correction":"Falso. Se rechaza H₀ solo cuando p < α. Si p ≥ α (como aquí, con el estadístico dentro de la zona central sin sombrear) NO se rechaza H₀. Respuesta: Falso."},{"id":"l4q11","type":"mc","topic":"ANOVA","points":24,"prompt":"¿Para qué sirve principalmente el análisis de varianza (ANOVA)?","chart":{"type":"multibox","data":{"ylabel":"Puntaje","groups":[{"label":"Grupo A","min":4,"q1":6,"median":7,"q3":8,"max":10},{"label":"Grupo B","min":5,"q1":6,"median":7.5,"q3":9,"max":11},{"label":"Grupo C","min":4,"q1":5,"median":6.5,"q3":8,"max":10}]}},"options":["Comparar las medias de 3 o más grupos","Medir la correlación entre dos variables","Calcular la mediana de un grupo","Comparar solo dos proporciones"],"correctIndex":0,"correction":"El ANOVA se usa para comparar las medias de TRES o más grupos a la vez, evitando hacer muchas pruebas t (que inflarían el error). Respuesta: comparar las medias de 3 o más grupos."},{"id":"l4q12","type":"mc","topic":"ANOVA (decisión)","points":25,"prompt":"Un ANOVA que compara tres métodos de enseñanza da un valor p = 0.01 con α = 0.05 (el Grupo C se ve más alto en el gráfico). ¿Qué se concluye?","chart":{"type":"multibox","data":{"ylabel":"Puntaje","groups":[{"label":"Método A","min":4,"q1":6,"median":7,"q3":8,"max":10},{"label":"Método B","min":5,"q1":6,"median":7,"q3":8,"max":11},{"label":"Método C","min":9,"q1":11,"median":12,"q3":14,"max":16}]}},"options":["Todas las medias son iguales","Al menos una media es diferente (se rechaza H₀)","No hay datos suficientes para decidir","La correlación entre grupos es alta"],"correctIndex":1,"correction":"Como p = 0.01 < 0.05 = α, se rechaza H₀ (que decía «todas las medias son iguales»). Se concluye que AL MENOS una media difiere; el Método C parece ser el distinto. Respuesta: al menos una media es diferente."}]}]};

/* ---- Rango / Avatar según progreso ---- */
const RANKS=[
  {min:0, emoji:'🐣', title:'Aprendiz curioso', color:'#77b06a'},
  {min:2, emoji:'🐤', title:'Explorador de datos', color:'#2f7cc0'},
  {min:5, emoji:'🦉', title:'Analista', color:'#e0a91f'},
  {min:8, emoji:'🧠', title:'Estadístico', color:'#a487d6'},
  {min:11,emoji:'🎓', title:'Experto en datos', color:'#ec6a9c'},
  {min:99,emoji:'👑', title:'Maestro de la Estadística', color:'#c99a12'}
];
function currentRank(){
  const s=progress.stars.reduce((a,b)=>a+b,0), maxS=NL*3;
  let idx=0;
  for(let k=0;k<RANKS.length-1;k++){ if(s>=RANKS[k].min) idx=k; }
  if(s>=maxS) idx=RANKS.length-1; // "Maestro" solo con todas las estrellas
  const rank=RANKS[idx];
  const next=idx<RANKS.length-1?RANKS[idx+1]:null;
  const nextMin=next?(next.min===99?maxS:next.min):maxS;
  const prevMin=(rank.min===99)?maxS:rank.min;
  const frac=next?clamp((s-prevMin)/Math.max(1,nextMin-prevMin),0,1):1;
  return {rank,next,stars:s,maxStars:maxS,frac,nextMin};
}
function avatarHtml(){
  const r=currentRank();
  return `<div class="avatar">
    <div class="face" style="color:${r.rank.color}">${r.rank.emoji}</div>

  </div>`;
}

/* ---- Sonido (WebAudio, sin archivos) ---- */
let actx=null;
function beep(kind){
  if(!progress.sound) return;
  try{
    actx = actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.connect(g);g.connect(actx.destination);
    const t=actx.currentTime;
    if(kind==='ok'){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+.09);}
    else if(kind==='bad'){o.frequency.setValueAtTime(300,t);o.frequency.setValueAtTime(200,t+.12);}
    else if(kind==='win'){[523,659,784,1046].forEach((f,i)=>o.frequency.setValueAtTime(f,t+i*.1));}
    else {o.frequency.setValueAtTime(520,t);}
    o.type='sine';
    g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.22,t+.02);
    g.gain.exponentialRampToValueAtTime(.001,t+(kind==='win'?.5:.22));
    o.start(t);o.stop(t+(kind==='win'?.55:.25));
  }catch(e){}
}

/* ---- Markdown ligero ---- */
function md(s){
  if(!s) return '';
  s = esc(s);
  s = s.replace(/\$([^$]+)\$/g,'<span class="formula">$1</span>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  const lines=s.split(/\n/); let out='',inList=false;
  for(let ln of lines){
    if(/^\s*[-•]\s+/.test(ln)){ if(!inList){out+='<ul>';inList=true;} out+='<li>'+ln.replace(/^\s*[-•]\s+/,'')+'</li>'; }
    else { if(inList){out+='</ul>';inList=false;} if(ln.trim()==='') out+=''; else out+='<p>'+ln+'</p>'; }
  }
  if(inList) out+='</ul>';
  return out;
}

const PAL=['#2f7cc0','#77b06a','#ec6a9c','#f3c53f','#a487d6','#7cc5e8','#e0587a','#4f9a48'];
function svgWrap(inner,w=460,h=260,cap){
  return `<div class="chartbox"><svg viewBox="0 0 ${w} ${h}" role="img">${inner}</svg>${cap?`<div class="chart-cap">${esc(cap)}</div>`:''}</div>`;
}
function axis(x0,y0,x1,y1){return `<line x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}" stroke="#9fb3c6" stroke-width="1.5"/>`;}
/* Reparte etiquetas para que no se solapen: recibe puntos ordenados por x y devuelve lx separados >=minGap dentro de [xmin,xmax] */
function placeLabels(items,minGap,xmin,xmax){
  const a=items.map(o=>Object.assign({},o,{lx:o.x}));
  for(let i=1;i<a.length;i++){ if(a[i].lx-a[i-1].lx<minGap) a[i].lx=a[i-1].lx+minGap; }
  if(a.length){ a[a.length-1].lx=Math.min(a[a.length-1].lx,xmax); for(let i=a.length-2;i>=0;i--){ if(a[i+1].lx-a[i].lx<minGap) a[i].lx=a[i+1].lx-minGap; } if(a[0].lx<xmin){a[0].lx=xmin; for(let i=1;i<a.length;i++){ if(a[i].lx-a[i-1].lx<minGap) a[i].lx=a[i-1].lx+minGap; }} }
  return a;
}

function renderChart(c){
  if(!c||!c.type) return '';
  const d=c.data||{};
  try{
    switch(c.type){
      case 'bar': return chartBar(d);
      case 'pie': return chartPie(d);
      case 'histogram': return chartHist(d);
      case 'boxplot': return chartBox(d);
      case 'scatter': return chartScatter(d);
      case 'normal': return chartNormal(d);
      case 'tree': return chartTree(d);
      case 'ci': return chartCI(d);
      case 'chisquare': return chartChi(d);
      case 'tdist': return chartTdist(d);
      case 'multibox': return chartMultibox(d);
      case 'dotplot': return chartDot(d);
      case 'freqtable': return chartTable(d);
      default: return '';
    }
  }catch(e){return '';}
}

function chartBar(d){
  const labels=d.labels||[], vals=(d.values||[]).map(Number);
  const W=460,H=250,L=44,B=44,R=16,T=18;
  const max=Math.max(1,...vals);
  const iw=W-L-R, ih=H-T-B, n=vals.length||1;
  const bw=Math.min(70, iw/n*0.62), gap=iw/n;
  let bars='',labs='';
  vals.forEach((v,i)=>{
    const bh=ih*(v/max), x=L+gap*i+(gap-bw)/2, y=T+ih-bh;
    bars+=`<rect class="svg-bar" style="animation-delay:${i*.08}s" x="${x}" y="${y}" width="${bw}" height="${Math.max(0,bh)}" rx="6" fill="${PAL[i%PAL.length]}"><title>${esc(labels[i]??'')}: ${esc(v)}</title></rect>`;
    bars+=`<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="13" font-weight="700" fill="#2b3b4d">${esc(v)}</text>`;
    labs+=`<text x="${x+bw/2}" y="${T+ih+18}" text-anchor="middle" font-size="12" fill="#4b5b6d">${esc(labels[i]??'')}</text>`;
  });
  let grid='';
  for(let g=0;g<=4;g++){const y=T+ih-ih*g/4;grid+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#eef3f8"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#9aabbc">${round(max*g/4,0)}</text>`;}
  const yl=d.ylabel?`<text x="14" y="${T+ih/2}" transform="rotate(-90 14 ${T+ih/2})" text-anchor="middle" font-size="11" fill="#6b7b8d">${esc(d.ylabel)}</text>`:'';
  return svgWrap(grid+axis(L,T,L,T+ih)+axis(L,T+ih,W-R,T+ih)+bars+labs+yl,W,H,d.title);
}

function chartHist(d){
  const bins=d.bins||[]; const W=460,H=250,L=44,B=48,R=16,T=18;
  const vals=bins.map(b=>Number(b.freq)); const max=Math.max(1,...vals);
  const iw=W-L-R, ih=H-T-B, n=bins.length||1, bw=iw/n;
  let bars='',labs='',curve='';
  const pts=[];
  bins.forEach((b,i)=>{
    const bh=ih*(Number(b.freq)/max),x=L+bw*i,y=T+ih-bh;
    bars+=`<rect class="svg-bar" style="animation-delay:${i*.06}s" x="${x+1}" y="${y}" width="${bw-2}" height="${Math.max(0,bh)}" fill="#2f7cc0" opacity="${.55+.35*(Number(b.freq)/max)}" stroke="#1f5aa8"><title>${esc(b.range??'')}: ${esc(b.freq)}</title></rect>`;
    bars+=`<text x="${x+bw/2}" y="${y-5}" text-anchor="middle" font-size="11" font-weight="700" fill="#2b3b4d">${esc(b.freq)}</text>`;
    labs+=`<text x="${x+bw/2}" y="${T+ih+16}" text-anchor="middle" font-size="10.5" fill="#4b5b6d">${esc(b.range??'')}</text>`;
    pts.push([x+bw/2,y]);
  });
  if(pts.length>1){curve='<polyline class="svg-draw" points="'+pts.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="#ec6a9c" stroke-width="2.5"/>';}
  const yl=`<text x="14" y="${T+ih/2}" transform="rotate(-90 14 ${T+ih/2})" text-anchor="middle" font-size="11" fill="#6b7b8d">${esc(d.ylabel||'Frecuencia')}</text>`;
  const xl=d.xlabel?`<text x="${L+iw/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="#6b7b8d">${esc(d.xlabel)}</text>`:'';
  return svgWrap(axis(L,T,L,T+ih)+axis(L,T+ih,W-R,T+ih)+bars+curve+labs+yl+xl,W,H);
}

function chartPie(d){
  const labels=d.labels||[],vals=(d.values||[]).map(Number),total=vals.reduce((a,b)=>a+b,0)||1;
  const W=460,H=250,cx=140,cy=125,r=95; let a=-Math.PI/2,seg='',leg='';
  vals.forEach((v,i)=>{
    const ang=v/total*2*Math.PI,a2=a+ang;
    const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    const large=ang>Math.PI?1:0;
    seg+=`<path class="svg-pop" style="animation-delay:${i*.1}s" d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large} 1 ${x2},${y2} Z" fill="${PAL[i%PAL.length]}" stroke="#fff" stroke-width="2"><title>${esc(labels[i]??'')}: ${esc(v)} (${Math.round(v/total*100)}%)</title></path>`;
    const mid=(a+a2)/2, lx=cx+r*.62*Math.cos(mid), ly=cy+r*.62*Math.sin(mid);
    const pct=Math.round(v/total*100);
    if(pct>=6) seg+=`<text x="${lx}" y="${ly+4}" text-anchor="middle" font-size="12" font-weight="800" fill="#fff">${pct}%</text>`;
    leg+=`<g transform="translate(285,${44+i*26})"><rect width="16" height="16" rx="4" fill="${PAL[i%PAL.length]}"/><text x="24" y="13" font-size="13" fill="#3a4a5c">${esc(labels[i]??'')} (${esc(v)})</text></g>`;
    a=a2;
  });
  return svgWrap(seg+leg,W,H,d.title);
}

function chartBox(d){
  const W=460,H=170,L=40,R=30,T=40,axisY=110;
  const min=+d.min,q1=+d.q1,med=+d.median,q3=+d.q3,max=+d.max;
  const outs=(d.outliers||[]).map(Number);
  const all=[min,q1,med,q3,max,...outs];
  let lo=Math.min(...all),hi=Math.max(...all); const pad=(hi-lo)*.08||1; lo-=pad;hi+=pad;
  const sx=v=>L+(W-L-R)*((v-lo)/(hi-lo));
  const bh=44,by=axisY-bh/2;
  let ticks='';
  for(let i=0;i<=5;i++){const v=lo+(hi-lo)*i/5;const x=sx(v);ticks+=`<line x1="${x}" y1="${axisY+34}" x2="${x}" y2="${axisY+40}" stroke="#9fb3c6"/><text x="${x}" y="${axisY+54}" text-anchor="middle" font-size="10" fill="#9aabbc">${round(v,1)}</text>`;}
  let o='';outs.forEach(v=>{o+=`<circle class="svg-fade" cx="${sx(v)}" cy="${axisY}" r="5" fill="#e0587a" stroke="#fff"><title>Atípico: ${round(v,2)}</title></circle>`;});
  // Etiquetas anti-solape con línea guía
  const pts5=placeLabels([{x:sx(min),v:min,t:'Mín'},{x:sx(q1),v:q1,t:'Q1'},{x:sx(med),v:med,t:'Md'},{x:sx(q3),v:q3,t:'Q3'},{x:sx(max),v:max,t:'Máx'}],38,L+8,W-R-8);
  let labels='';
  pts5.forEach(pp=>{
    if(Math.abs(pp.lx-pp.x)>0.6) labels+=`<line x1="${pp.x}" y1="${by}" x2="${pp.lx}" y2="${by-12}" stroke="#cdd9e6" stroke-width="1"/>`;
    labels+=`<text x="${pp.lx}" y="${by-14}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#2b3b4d">${pp.t}</text><text x="${pp.lx}" y="${by-26}" text-anchor="middle" font-size="10" fill="#6b7b8d">${round(pp.v,1)}</text>`;
  });
  const svg=`
    <line x1="${sx(min)}" y1="${axisY}" x2="${sx(q1)}" y2="${axisY}" stroke="#4f9a48" stroke-width="2"/>
    <line x1="${sx(q3)}" y1="${axisY}" x2="${sx(max)}" y2="${axisY}" stroke="#4f9a48" stroke-width="2"/>
    <line x1="${sx(min)}" y1="${by+8}" x2="${sx(min)}" y2="${by+bh-8}" stroke="#4f9a48" stroke-width="2"/>
    <line x1="${sx(max)}" y1="${by+8}" x2="${sx(max)}" y2="${by+bh-8}" stroke="#4f9a48" stroke-width="2"/>
    <rect class="svg-pop" x="${sx(q1)}" y="${by}" width="${Math.max(1,sx(q3)-sx(q1))}" height="${bh}" rx="6" fill="#bfe0ac" stroke="#4f9a48" stroke-width="2"><title>Q1=${round(q1,2)} · Mediana=${round(med,2)} · Q3=${round(q3,2)}</title></rect>
    <line x1="${sx(med)}" y1="${by}" x2="${sx(med)}" y2="${by+bh}" stroke="#256b1f" stroke-width="3"/>
    ${labels}
    ${ticks}${o}`;
  return svgWrap(svg,W,H,d.title);
}

function chartScatter(d){
  const pts=(d.points||[]).map(p=>[Number(p[0]),Number(p[1])]);
  const W=460,H=250,L=44,B=40,R=16,T=16;
  const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);
  let xlo=Math.min(...xs),xhi=Math.max(...xs),ylo=Math.min(...ys),yhi=Math.max(...ys);
  const px=(xhi-xlo)*.08||1,py=(yhi-ylo)*.08||1; xlo-=px;xhi+=px;ylo-=py;yhi+=py;
  const sx=v=>L+(W-L-R)*((v-xlo)/(xhi-xlo)), sy=v=>T+(H-T-B)*(1-(v-ylo)/(yhi-ylo));
  let dots='';pts.forEach((p,i)=>{dots+=`<circle class="svg-fade" style="animation-delay:${i*.03}s" cx="${sx(p[0])}" cy="${sy(p[1])}" r="5" fill="#2f7cc0" opacity=".8" stroke="#1f5aa8"><title>(${round(p[0],2)}, ${round(p[1],2)})</title></circle>`;});
  let trend='';
  if(d.showTrend&&pts.length>1){
    const n=pts.length,sX=xs.reduce((a,b)=>a+b,0),sY=ys.reduce((a,b)=>a+b,0),sXY=pts.reduce((a,p)=>a+p[0]*p[1],0),sXX=pts.reduce((a,p)=>a+p[0]*p[0],0);
    const b=(n*sXY-sX*sY)/(n*sXX-sX*sX||1),a=(sY-b*sX)/n;
    trend=`<line class="svg-draw" x1="${sx(xlo)}" y1="${sy(a+b*xlo)}" x2="${sx(xhi)}" y2="${sy(a+b*xhi)}" stroke="#ec6a9c" stroke-width="2.5" stroke-dasharray="7 5"/>`;
  }
  const xl=d.xlabel?`<text x="${L+(W-L-R)/2}" y="${H-6}" text-anchor="middle" font-size="11" fill="#6b7b8d">${esc(d.xlabel)}</text>`:'';
  const yl=d.ylabel?`<text x="14" y="${T+(H-T-B)/2}" transform="rotate(-90 14 ${T+(H-T-B)/2})" text-anchor="middle" font-size="11" fill="#6b7b8d">${esc(d.ylabel)}</text>`:'';
  return svgWrap(axis(L,T,L,H-B)+axis(L,H-B,W-R,H-B)+trend+dots+xl+yl,W,H,d.title);
