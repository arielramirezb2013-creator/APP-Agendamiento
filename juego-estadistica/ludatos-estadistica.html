function normalPath(mean,sd,sx,sy,peakY,baseY){
  const N=80,pts=[];
  for(let i=0;i<=N;i++){
    const x=mean-4*sd+(8*sd)*i/N;
    const y=Math.exp(-0.5*Math.pow((x-mean)/sd,2));
    pts.push([sx(x),baseY-(baseY-peakY)*y]);
  }
  return pts;
}
function chartNormal(d){
  const mean=d.mean??0,sd=d.sd??1;
  const W=470,H=260,L=20,R=20,T=18,baseY=190,peakY=36;
  const sx=v=>L+(W-L-R)*((v-(mean-4*sd))/(8*sd));
  const pts=normalPath(mean,sd,sx,null,peakY,baseY);
  const curve='M'+pts.map(p=>p.join(',')).join(' L');
  let shade='',marks='',labels='',shadeLo=null,shadeHi=null;
  const regions=d.shade==='regions';
  if(regions){
    const cols=['#e0587a','#f6b6cd','#7cc5e8','#2b6fb0','#2b6fb0','#7cc5e8','#f6b6cd','#e0587a'];
    const pcts=['0.1%','2.1%','13.6%','34.1%','34.1%','13.6%','2.1%','0.1%'];
    for(let k=0;k<8;k++){
      const a=mean+(k-4)*sd,b=mean+(k-3)*sd;
      const seg=pts.filter(p=>p[0]>=sx(a)-1&&p[0]<=sx(b)+1);
      if(seg.length){
        const path=`M${sx(a)},${baseY} L`+seg.map(p=>p.join(',')).join(' L')+` L${sx(b)},${baseY} Z`;
        shade+=`<path class="svg-fade" style="animation-delay:${k*.05}s" d="${path}" fill="${cols[k]}" opacity=".8"/>`;
        const mx=sx(mean+(k-3.5)*sd);
        labels+=`<text x="${mx}" y="${baseY-6}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${k>=2&&k<=5?'#123':'#7a2340'}">${pcts[k]}</text>`;
      }
    }
    for(let k=-3;k<=3;k++){const x=sx(mean+k*sd);marks+=`<line x1="${x}" y1="${baseY}" x2="${x}" y2="${baseY+6}" stroke="#7a8a9a"/><text x="${x}" y="${baseY+20}" text-anchor="middle" font-size="11" fill="#5b6b7d">${k===0?'μ':(k>0?'+':'')+k+'σ'}</text>`;}
  } else if(Array.isArray(d.shade)){
    const [lo,hi]=d.shade; shadeLo=lo; shadeHi=hi;
    const seg=pts.filter(p=>p[0]>=sx(lo)-1&&p[0]<=sx(hi)+1);
    if(seg.length){const path=`M${sx(lo)},${baseY} L`+seg.map(p=>p.join(',')).join(' L')+` L${sx(hi)},${baseY} Z`;shade+=`<path class="svg-fade" d="${path}" fill="#7cc5e8" opacity=".7"/>`;}
    marks+=`<line x1="${sx(lo)}" y1="${peakY-6}" x2="${sx(lo)}" y2="${baseY}" stroke="#2b6fb0" stroke-dasharray="4 3"/><line x1="${sx(hi)}" y1="${peakY-6}" x2="${sx(hi)}" y2="${baseY}" stroke="#2b6fb0" stroke-dasharray="4 3"/>`;
    // Solo etiquetar los límites aquí si NO hay marcadores (evita números duplicados)
    if(!Array.isArray(d.markers)) marks+=`<text x="${sx(lo)}" y="${baseY+16}" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6fb0">${round(lo,1)}</text><text x="${sx(hi)}" y="${baseY+16}" text-anchor="middle" font-size="11" font-weight="700" fill="#2b6fb0">${round(hi,1)}</text>`;
  }
  if(Array.isArray(d.markers)){const eps=(sd||1)*0.01;d.markers.forEach(m=>{const x=sx(m);const isB=(shadeLo!=null&&Math.abs(m-shadeLo)<=eps)||(shadeHi!=null&&Math.abs(m-shadeHi)<=eps);marks+=`<line x1="${x}" y1="${baseY}" x2="${x}" y2="${baseY+5}" stroke="${isB?'#2b6fb0':'#7a8a9a'}"/><text x="${x}" y="${baseY+18}" text-anchor="middle" font-size="10.5" font-weight="${isB?'700':'400'}" fill="${isB?'#2b6fb0':'#5b6b7d'}">${round(m,1)}</text>`;});}
  const meanLine=`<line x1="${sx(mean)}" y1="${peakY-2}" x2="${sx(mean)}" y2="${baseY}" stroke="#17325c" stroke-width="1.5" stroke-dasharray="3 3"/>`;
  return svgWrap(`${shade}<path class="svg-draw" d="${curve}" fill="none" stroke="#17325c" stroke-width="3"/>${meanLine}<line x1="${L}" y1="${baseY}" x2="${W-R}" y2="${baseY}" stroke="#9fb3c6" stroke-width="1.5"/>${marks}${labels}`,W,H,d.title);
}

function chartTree(d){
  const br=d.branches||[]; const nB=br.length;
  const W=500,H=70+nB*90,rootX=42,rootY=H/2,midX=220,leafX=388;
  const pill=(cx,cy,label,fill,stroke,txt)=>{
    const w=Math.max(30,String(label).length*7.3+16),h=26;
    return {w,svg:`<rect class="svg-pop" x="${cx-w/2}" y="${cy-h/2}" width="${w}" height="${h}" rx="13" fill="${fill}" stroke="${stroke}" stroke-width="2"/><text x="${cx}" y="${cy+4.5}" text-anchor="middle" font-size="12.5" font-weight="800" fill="${txt}">${esc(label)}</text>`};
  };
  let s=`<circle cx="${rootX}" cy="${rootY}" r="12" fill="#77b06a" stroke="#4f9a48" stroke-width="2"/><text x="${rootX}" y="${rootY-18}" text-anchor="middle" font-size="10" fill="#4f9a48" font-weight="700">Inicio</text>`;
  br.forEach((b,i)=>{
    const y=(H/(nB+1))*(i+1);
    const mid=pill(midX,y,b.label,'#7cc5e8','#2b6fb0','#123');
    s+=`<line class="svg-draw" x1="${rootX+12}" y1="${rootY}" x2="${midX-mid.w/2}" y2="${y}" stroke="#8aa0b8" stroke-width="2"/>`;
    s+=`<text x="${(rootX+midX-mid.w/2)/2}" y="${(rootY+y)/2-6}" text-anchor="middle" font-size="12" font-weight="800" fill="#2b6fb0">${esc(b.p)}</text>`;
    s+=mid.svg;
    const ch=b.children||[]; const nC=ch.length;
    ch.forEach((c,j)=>{
      const cyy=y+(j-(nC-1)/2)*34;
      const leaf=pill(leafX,cyy,c.label,'#f3c53f','#c99a12','#5a4400');
      s+=`<line class="svg-draw" x1="${midX+mid.w/2}" y1="${y}" x2="${leafX-leaf.w/2}" y2="${cyy}" stroke="#c3b0e0" stroke-width="2"/>`;
      s+=`<text x="${(midX+mid.w/2+leafX-leaf.w/2)/2}" y="${(y+cyy)/2-4}" text-anchor="middle" font-size="11" font-weight="800" fill="#7a54c0">${esc(c.p)}</text>`;
      s+=leaf.svg;
      const joint=round((Number(b.p)*Number(c.p)),3);
      if(!isNaN(joint)) s+=`<text x="${leafX+leaf.w/2+6}" y="${cyy+4}" font-size="11" font-weight="700" fill="#5b6b7d">= ${joint}</text>`;
    });
  });
  return svgWrap(s,W,H,d.title);
}

function chartChi(d){
  const df=+d.df||3,crit=+d.critical,stat=d.statistic!=null?+d.statistic:null;
  const W=460,H=240,L=30,R=20,baseY=180,T=20;
  const xmax=Math.max(crit*1.6, (stat||0)*1.2, df*3);
  const sx=v=>L+(W-L-R)*(v/xmax);
  function chipdf(x){if(x<=0)return 0;const k=df/2;return Math.pow(x,k-1)*Math.exp(-x/2);}
  let peak=0;for(let x=0;x<=xmax;x+=xmax/120)peak=Math.max(peak,chipdf(x));
  const pts=[];for(let i=0;i<=120;i++){const x=xmax*i/120;pts.push([sx(x),baseY-(baseY-T)*(chipdf(x)/peak)]);}
  const curve='M'+pts.map(p=>p.join(',')).join(' L');
  const seg=pts.filter(p=>p[0]>=sx(crit));
  let rej='';
  if(seg.length){rej=`<path class="svg-fade" d="M${sx(crit)},${baseY} L`+seg.map(p=>p.join(',')).join(' L')+` L${sx(xmax)},${baseY} Z" fill="#f6b6cd" opacity=".85"/>`;}
  let statLine='';
  if(stat!=null){statLine=`<line x1="${sx(stat)}" y1="${T}" x2="${sx(stat)}" y2="${baseY}" stroke="#17325c" stroke-width="2" stroke-dasharray="4 3"/><text x="${sx(stat)}" y="${T-4}" text-anchor="middle" font-size="11" font-weight="700" fill="#17325c">χ²=${round(stat,2)}</text>`;}
  const s=`${rej}<path class="svg-draw" d="${curve}" fill="none" stroke="#7a54c0" stroke-width="3"/><line x1="${L}" y1="${baseY}" x2="${W-R}" y2="${baseY}" stroke="#9fb3c6"/>
    <line x1="${sx(crit)}" y1="${T}" x2="${sx(crit)}" y2="${baseY}" stroke="#d6455f" stroke-width="2"/>
    <text x="${sx(crit)}" y="${baseY+16}" text-anchor="middle" font-size="11" fill="#d6455f" font-weight="700">crít=${round(crit,2)}</text>
    <text x="${(sx(crit)+sx(xmax))/2}" y="${baseY-70}" text-anchor="middle" font-size="11" fill="#a03a55" font-weight="700">Región de rechazo</text>
    ${statLine}<text x="${W-R}" y="${baseY+16}" text-anchor="end" font-size="10" fill="#9aabbc">χ² (gl=${df})</text>`;
  return svgWrap(s,W,H,d.title);
}

function chartTdist(d){
  const df=d.df||10, crit=Math.abs(+d.critical||2), stat=(d.statistic!=null?+d.statistic:null), tails=d.tails||2;
  const W=470,H=250,L=20,R=20,baseY=185,peakY=42;
  const xmax=Math.max(3.6, crit+1.4, stat!=null?Math.abs(stat)+1:0);
  const sx=v=>L+(W-L-R)*((v+xmax)/(2*xmax));
  const pts=[];for(let i=0;i<=100;i++){const x=-xmax+2*xmax*i/100;const y=Math.exp(-0.5*x*x);pts.push([sx(x),baseY-(baseY-peakY)*y]);}
  const curve='M'+pts.map(p=>p.join(',')).join(' L');
  const tail=(lo,hi)=>{const seg=pts.filter(p=>p[0]>=sx(lo)-1&&p[0]<=sx(hi)+1);if(!seg.length)return '';return `<path class="svg-fade" d="M${sx(lo)},${baseY} L`+seg.map(p=>p.join(',')).join(' L')+` L${sx(hi)},${baseY} Z" fill="#f6b6cd" opacity=".85"/>`;};
  let shade=tail(crit,xmax); if(tails===2) shade+=tail(-xmax,-crit);
  let crits=`<line x1="${sx(crit)}" y1="${peakY-4}" x2="${sx(crit)}" y2="${baseY}" stroke="#d6455f" stroke-width="2"/><text x="${sx(crit)}" y="${baseY+16}" text-anchor="middle" font-size="11" fill="#d6455f" font-weight="700">+${round(crit,2)}</text>`;
  if(tails===2) crits+=`<line x1="${sx(-crit)}" y1="${peakY-4}" x2="${sx(-crit)}" y2="${baseY}" stroke="#d6455f" stroke-width="2"/><text x="${sx(-crit)}" y="${baseY+16}" text-anchor="middle" font-size="11" fill="#d6455f" font-weight="700">−${round(crit,2)}</text>`;
  let statLine='';
  if(stat!=null){statLine=`<line x1="${sx(stat)}" y1="${peakY-10}" x2="${sx(stat)}" y2="${baseY}" stroke="#17325c" stroke-width="2" stroke-dasharray="4 3"/><text x="${sx(stat)}" y="${peakY-12}" text-anchor="middle" font-size="11" font-weight="800" fill="#17325c">t=${round(stat,2)}</text>`;}
  const rej=`<text x="${(sx(crit)+sx(xmax))/2}" y="${baseY-56}" text-anchor="middle" font-size="10.5" fill="#a03a55" font-weight="700">Rechazo</text>`+(tails===2?`<text x="${(sx(-xmax)+sx(-crit))/2}" y="${baseY-56}" text-anchor="middle" font-size="10.5" fill="#a03a55" font-weight="700">Rechazo</text>`:'');
  return svgWrap(`${shade}<path class="svg-draw" d="${curve}" fill="none" stroke="#7a54c0" stroke-width="3"/><line x1="${L}" y1="${baseY}" x2="${W-R}" y2="${baseY}" stroke="#9fb3c6"/><line x1="${sx(0)}" y1="${peakY-6}" x2="${sx(0)}" y2="${baseY}" stroke="#17325c" stroke-width="1" stroke-dasharray="2 3"/><text x="${sx(0)}" y="${baseY+16}" text-anchor="middle" font-size="10" fill="#9aabbc">0</text>${crits}${statLine}${rej}<text x="${W-R}" y="${baseY+30}" text-anchor="end" font-size="10" fill="#9aabbc">t (gl=${df})</text>`,W,H,d.title);
}

function chartMultibox(d){
  const groups=d.groups||[]; const W=480,H=280,L=44,R=16,T=16,B=46;
  const all=groups.flatMap(g=>[+g.min,+g.max]); let lo=Math.min(...all),hi=Math.max(...all);
  const pad=(hi-lo)*.1||1; lo-=pad; hi+=pad;
  const ih=H-T-B; const sy=v=>T+ih*(1-(v-lo)/(hi-lo));
  const n=groups.length||1; const slot=(W-L-R)/n; const bw=Math.min(58,slot*0.5);
  let grid='';for(let g=0;g<=4;g++){const v=lo+(hi-lo)*g/4;const y=sy(v);grid+=`<line x1="${L}" y1="${y}" x2="${W-R}" y2="${y}" stroke="#eef3f8"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#9aabbc">${round(v,1)}</text>`;}
  let boxes='';
  groups.forEach((g,i)=>{
    const cx=L+slot*i+slot/2, col=PAL[i%PAL.length];
    boxes+=`<line x1="${cx}" y1="${sy(+g.min)}" x2="${cx}" y2="${sy(+g.max)}" stroke="${col}" stroke-width="2"/>`;
    boxes+=`<line x1="${cx-bw/2}" y1="${sy(+g.min)}" x2="${cx+bw/2}" y2="${sy(+g.min)}" stroke="${col}" stroke-width="2"/>`;
    boxes+=`<line x1="${cx-bw/2}" y1="${sy(+g.max)}" x2="${cx+bw/2}" y2="${sy(+g.max)}" stroke="${col}" stroke-width="2"/>`;
    boxes+=`<rect class="svg-pop" style="animation-delay:${i*.08}s" x="${cx-bw/2}" y="${sy(+g.q3)}" width="${bw}" height="${Math.max(1,sy(+g.q1)-sy(+g.q3))}" rx="5" fill="${col}" opacity=".32" stroke="${col}" stroke-width="2"><title>${esc(g.label)} · Q1=${round(+g.q1,1)} Md=${round(+g.median,1)} Q3=${round(+g.q3,1)}</title></rect>`;
    boxes+=`<line x1="${cx-bw/2}" y1="${sy(+g.median)}" x2="${cx+bw/2}" y2="${sy(+g.median)}" stroke="${col}" stroke-width="3"/>`;
    boxes+=`<text x="${cx}" y="${H-B+18}" text-anchor="middle" font-size="11" font-weight="700" fill="#4b5b6d">${esc(g.label)}</text>`;
  });
  const yl=d.ylabel?`<text x="14" y="${T+ih/2}" transform="rotate(-90 14 ${T+ih/2})" text-anchor="middle" font-size="11" fill="#6b7b8d">${esc(d.ylabel)}</text>`:'';
  return svgWrap(grid+axis(L,T,L,T+ih)+axis(L,T+ih,W-R,T+ih)+boxes+yl,W,H,d.title);
}

function chartDot(d){
  const vals=(d.values||[]).map(Number).sort((a,b)=>a-b);
  const W=460,H=180,L=30,R=20,baseY=140;
  const lo=Math.min(...vals),hi=Math.max(...vals);
  const uniq=[...new Set(vals)];
  const sx=v=>L+(W-L-R)*((v-lo)/((hi-lo)||1));
  let s='',counts={};
  vals.forEach(v=>{counts[v]=(counts[v]||0)+1;});
  let seen={};
  let dots='';
  vals.forEach((v,i)=>{seen[v]=(seen[v]||0)+1;const cy=baseY-8-(seen[v]-1)*16;dots+=`<circle class="svg-pop" style="animation-delay:${i*.03}s" cx="${sx(v)}" cy="${cy}" r="6" fill="#2f7cc0" stroke="#1f5aa8"/>`;});
  let labs='';uniq.forEach(v=>{labs+=`<line x1="${sx(v)}" y1="${baseY}" x2="${sx(v)}" y2="${baseY+5}" stroke="#9fb3c6"/><text x="${sx(v)}" y="${baseY+20}" text-anchor="middle" font-size="11" fill="#5b6b7d">${esc(v)}</text>`;});
  return svgWrap(`<line x1="${L}" y1="${baseY}" x2="${W-R}" y2="${baseY}" stroke="#9fb3c6"/>${dots}${labs}<text x="${L+(W-L-R)/2}" y="${H-4}" text-anchor="middle" font-size="11" fill="#6b7b8d">${esc(d.xlabel||'')}</text>`,W,H,d.title);
}

function chartTable(d){

  s+='</tbody></table></div>';

}
/* Barras horizontales (p.ej. dominio por tema): items=[{label,value,max}] con value/max en 0..1 */
function chartHBars(items,cap){
  if(!items||!items.length) return '';
  const W=480,rowH=32,pad=12,labelW=184,valW=50;
  const H=pad*2+items.length*rowH;
  const barX=labelW,barW=W-labelW-valW;
  let s='';
  items.forEach((it,i)=>{
    const y=pad+i*rowH, frac=it.max?clamp(it.value/it.max,0,1):0;
    const col=frac>=0.75?'#4f9a48':frac>=0.5?'#e0a91f':'#e0587a';
    s+=`<text x="${labelW-10}" y="${y+rowH/2+4}" text-anchor="end" font-size="11.5" fill="#3a4a5c">${esc(it.label.length>28?it.label.slice(0,27)+'…':it.label)}</text>`;
    s+=`<rect x="${barX}" y="${y+6}" width="${barW}" height="${rowH-16}" rx="6" fill="#eef3f8"/>`;
    s+=`<rect class="svg-barx" style="animation-delay:${i*.06}s" x="${barX}" y="${y+6}" width="${Math.max(3,barW*frac)}" height="${rowH-16}" rx="6" fill="${col}"><title>${esc(it.label)}: ${it.value}/${it.max} (${Math.round(frac*100)}%)</title></rect>`;
    s+=`<text x="${barX+barW+8}" y="${y+rowH/2+4}" font-size="12.5" font-weight="800" fill="#2b3b4d">${Math.round(frac*100)}%</text>`;
  });
  return svgWrap(s,W,H,cap);
}

      <div class="slider-row"><label>μ</label><input id="pgMu" type="range" min="40" max="160" value="100"><span class="val" id="pgMuV">100</span></div>
      <div class="slider-row"><label>σ</label><input id="pgSd" type="range" min="5" max="35" value="15"><span class="val" id="pgSdV">15</span></div>

const VAR_ITEMS=[
  {t:"Color de ojos",a:"Cualitativa nominal"},{t:"Número de hermanos",a:"Cuantitativa discreta"},
  {t:"Estatura (cm)",a:"Cuantitativa continua"},{t:"Nivel educativo (primaria/secundaria/universidad)",a:"Cualitativa ordinal"},
  {t:"Temperatura del día",a:"Cuantitativa continua"},{t:"Marca de celular",a:"Cualitativa nominal"},
  {t:"Cantidad de goles",a:"Cuantitativa discreta"},{t:"Nivel de satisfacción (bajo/medio/alto)",a:"Cualitativa ordinal"}
];
const VAR_OPTS=["Cualitativa nominal","Cualitativa ordinal","Cuantitativa discreta","Cuantitativa continua"];
let pgVarState={i:0,score:0};
let pgMean=[6,7,7,8,10];
function initPlayground(kind){
  if(kind==='varType'){ pgVarState={i:Math.floor(0),score:0}; pgVarRender(); }
  if(kind==='meanCalc'){ pgMean=[6,7,7,8,10]; pgMeanRender(); }
  if(kind==='normalPlay'){
    const mu=$('#pgMu'),sd=$('#pgSd');
    const upd=()=>{$('#pgMuV').textContent=mu.value;$('#pgSdV').textContent=sd.value;pgNormalRender(+mu.value,+sd.value);};
    mu.oninput=upd;sd.oninput=upd;upd();
  }
  if(kind==='regressionPlay'){ pgReg=[[1,2],[2,3.5],[3,3],[4,5],[5,6]]; pgRegRender(); }
}
let pgReg=[[1,2],[2,3.5],[3,3],[4,5],[5,6]];
function pgRegAdd(){
  const x=parseFloat($('#pgRx').value), y=parseFloat($('#pgRy').value);
  if(!isNaN(x)&&!isNaN(y)){ pgReg.push([x,y]); $('#pgRx').value='';$('#pgRy').value=''; pgRegRender(); }
}
function pgRegReset(){ pgReg=[[1,2],[2,3.5],[3,3],[4,5],[5,6]]; pgRegRender(); }
function pgRegRender(){
  $('#pgRegChart').innerHTML=renderChart({type:'scatter',data:{points:pgReg,showTrend:pgReg.length>1,xlabel:'x',ylabel:'y'}});
  const n=pgReg.length;
  if(n<2){ $('#pgRegInfo').innerHTML='<span class="mr">Agrega al menos 2 puntos</span>'; return; }
  const sx=pgReg.reduce((a,p)=>a+p[0],0), sy=pgReg.reduce((a,p)=>a+p[1],0);
  const mx=sx/n, my=sy/n;
  const sxy=pgReg.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0);
  const sxx=pgReg.reduce((a,p)=>a+Math.pow(p[0]-mx,2),0);
  const syy=pgReg.reduce((a,p)=>a+Math.pow(p[1]-my,2),0);
  const b= sxx? sxy/sxx : 0;
  const a= my-b*mx;
  const r= (sxx&&syy)? sxy/Math.sqrt(sxx*syy) : 0;
  const strength=Math.abs(r)<0.3?'débil':Math.abs(r)<0.7?'moderada':'fuerte';
  const dir=r>0.02?'positiva':r<-0.02?'negativa':'nula';
  $('#pgRegInfo').innerHTML=`
    <span class="mr">Recta: ŷ = ${round(a,2)} ${b>=0?'+':'−'} ${round(Math.abs(b),2)}·x</span>
    <span class="mr">r = ${round(r,3)} (${dir} ${strength})</span>
    <span class="mr">R² = ${round(r*r,3)} (${Math.round(r*r*100)}% explicado)</span>`;
}
function pgVarRender(){
  const it=VAR_ITEMS[pgVarState.i%VAR_ITEMS.length];
  $('#pgVar').textContent=it.t;
  $('#pgVarScore').textContent=pgVarState.score;
  $('#pgVarFb').textContent='';
  $('#pgVarOpts').innerHTML=VAR_OPTS.map((o,k)=>`<button class="opt" onclick="pgVarPick(this,'${o}')"><span class="key">${String.fromCharCode(65+k)}</span>${o}</button>`).join('');
}
function pgVarPick(el,opt){
  const it=VAR_ITEMS[pgVarState.i%VAR_ITEMS.length];
  const ok=opt===it.a;
  document.querySelectorAll('#pgVarOpts .opt').forEach(b=>{b.disabled=true;if(b.textContent.includes(it.a))b.classList.add('correct');});
  if(ok){el.classList.add('correct');pgVarState.score++;beep('ok');$('#pgVarFb').innerHTML='<span style="color:var(--ok)">✔ ¡Correcto!</span>';}
  else{el.classList.add('wrong');beep('bad');$('#pgVarFb').innerHTML='<span style="color:var(--bad)">✘ Es: '+it.a+'</span>';}
  $('#pgVarScore').textContent=pgVarState.score;
  setTimeout(()=>{pgVarState.i++;pgVarRender();},1100);
}
function stats(arr){
  const a=arr.slice().sort((x,y)=>x-y),n=a.length;
  if(!n) return null;
  const sum=a.reduce((x,y)=>x+y,0),mean=sum/n;
  const median=n%2?a[(n-1)/2]:(a[n/2-1]+a[n/2])/2;
  const freq={};let mode=[],mx=0;a.forEach(v=>{freq[v]=(freq[v]||0)+1;if(freq[v]>mx)mx=freq[v];});
  Object.keys(freq).forEach(k=>{if(freq[k]===mx)mode.push(+k);});
  const variance=a.reduce((s,v)=>s+Math.pow(v-mean,2),0)/n;
  const sd=Math.sqrt(variance);
  const q=p=>{const idx=(n-1)*p,lo=Math.floor(idx),hi=Math.ceil(idx);return a[lo]+(a[hi]-a[lo])*(idx-lo);};
  return {n,mean,median,mode:mx>1?mode:[],sd,min:a[0],max:a[n-1],q1:q(.25),q3:q(.75),range:a[n-1]-a[0]};
}
function pgMeanRender(){
  $('#pgList').innerHTML=pgMean.map((v,i)=>`<span class="n">${v}<button onclick="pgMeanDel(${i})">×</button></span>`).join('')||'<span style="color:#8493a5">Sin datos</span>';
  const s=stats(pgMean);
  if(s){
    $('#pgStats').innerHTML=`
      <span class="mr">Media: ${round(s.mean,2)}</span>
      <span class="mr">Mediana: ${round(s.median,2)}</span>
      <span class="mr">Moda: ${s.mode.length?s.mode.join(', '):'—'}</span>
      <span class="mr">Rango: ${round(s.range,2)}</span>
      <span class="mr">σ: ${round(s.sd,2)}</span>`;
    $('#pgBox').innerHTML=renderChart({type:'boxplot',data:{min:s.min,q1:round(s.q1,2),median:round(s.median,2),q3:round(s.q3,2),max:s.max}});
  } else {$('#pgStats').innerHTML='';$('#pgBox').innerHTML='';}
}
function pgMeanAdd(){const v=parseFloat($('#pgAdd').value);if(!isNaN(v)){pgMean.push(v);$('#pgAdd').value='';pgMeanRender();}}
function pgMeanDel(i){pgMean.splice(i,1);pgMeanRender();}
function pgMeanReset(){pgMean=[6,7,7,8,10];pgMeanRender();}
function pgNormalRender(mu,sd){
  $('#pgNormal').innerHTML=renderChart({type:'normal',data:{mean:mu,sd:sd,shade:[mu-sd,mu+sd],markers:[mu-2*sd,mu-sd,mu,mu+sd,mu+2*sd]}});
  $('#pgNormalInfo').innerHTML=`
    <span class="mr">68% entre ${round(mu-sd,1)} y ${round(mu+sd,1)}</span>
    <span class="mr">95% entre ${round(mu-2*sd,1)} y ${round(mu+2*sd,1)}</span>
    <span class="mr">99.7% entre ${round(mu-3*sd,1)} y ${round(mu+3*sd,1)}</span>`;
}

function startQuiz(){

function stopTimer(){ if(state.quiz&&state.quiz.timerId){clearInterval(state.quiz.timerId);state.quiz.timerId=null;} }
function updateTimerUI(){ const el=$('#timerChip'); if(el){ el.textContent='⏱️ '+state.quiz.timeLeft+'s'; el.className='chip timer'+(state.quiz.timeLeft<=5?' danger':''); } }

function timeoutAnswer(){

function displayAns(q,val){
  if(q.type==='numeric') return String(val)+(q.unit?' '+q.unit:'');
  const opts=q.type==='truefalse'?(q.options||['Verdadero','Falso']):(q.options||[]);
  return opts[val]!=null?opts[val]:String(val);
}
function correctAnsText(q){
  if(q.type==='numeric') return String(q.answer)+(q.unit?' '+q.unit:'');
  const opts=q.type==='truefalse'?(q.options||['Verdadero','Falso']):(q.options||[]);
  return opts[q.correctIndex]!=null?opts[q.correctIndex]:'';
}
function answerMC(k){
  if(state.quiz.answered) return;
  const q=DATA[state.li].questions[state.quiz.qi];
  const ok=k===q.correctIndex;
  document.querySelectorAll('#optbox .opt').forEach(b=>{
    const bk=+b.dataset.k; b.disabled=true;
    if(bk===q.correctIndex) b.classList.add('correct');
    else if(bk===k) b.classList.add('wrong');
    else b.classList.add('dim');
  });
  finishAnswer(q,ok,displayAns(q,k));
}
function answerNum(){
  if(state.quiz.answered) return;
  const q=DATA[state.li].questions[state.quiz.qi];
  const raw=$('#numAns').value;
  if(raw==='') return;
  const val=parseFloat(raw.replace(',','.'));
  const tol=q.tolerance!=null?q.tolerance:0.01;
  const ok=!isNaN(val)&&Math.abs(val-q.answer)<=tol;
  $('#numAns').disabled=true;
  finishAnswer(q,ok,displayAns(q,isNaN(val)?raw:val));
}
function finishAnswer(q,ok,givenText){
  stopTimer();
  state.quiz.answered=true;
  let earned=0, tbonus=0;
  if(ok){
    state.quiz.streak++; state.quiz.bestStreak=Math.max(state.quiz.bestStreak,state.quiz.streak);
    const bonus=Math.min(15,(state.quiz.streak-1)*3);
    if(state.quiz.challenge) tbonus=Math.max(0,state.quiz.timeLeft*2);
    earned=(q.points||10)+bonus+tbonus;
    state.quiz.score+=earned;
    beep('ok'); floatPoints('+'+earned);
  } else { state.quiz.streak=0; beep('bad'); }
  state.quiz.answers.push({
    id:q.id,topic:q.topic||'',prompt:q.prompt,type:q.type,
    given:givenText,correct:correctAnsText(q),isCorrect:ok,
    points:q.points||10,earned,correction:q.correction||''
  });
  const last=state.quiz.qi===DATA[state.li].questions.length-1;
  $('#fb').innerHTML=`
    <div class="feedback ${ok?'ok':'bad'}">
      <h4>${ok?'✔ ¡Correcto! +'+earned+' pts'+(tbonus>0?' ⚡ (incluye +'+tbonus+' por rapidez)':''):'✘ Incorrecto'}</h4>
      ${ok?'':`<div>Respuesta correcta: <b>${esc(correctAnsText(q))}</b></div>`}
      <div class="corr"><b>${ok?'💡 Explicación:':'✏️ Corrección:'}</b> ${md(q.correction).replace(/^<p>|<\/p>$/g,'')}</div>
    </div>
    <div class="btnrow" style="justify-content:flex-end;margin-top:14px">
      <button class="btn ${last?'green':''}" onclick="nextQ()">${last?'Ver resultados 🎉':'Siguiente →'}</button>
    </div>`;
  $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function nextQ(){
  if(state.quiz.qi<DATA[state.li].questions.length-1){ state.quiz.qi++; state.quiz.answered=false; viewQuiz(); }
  else finishQuiz();
}
function finishQuiz(){
  stopTimer();
  const i=state.li, lv=DATA[i], qz=state.quiz;
  const max=lv.questions.reduce((a,q)=>a+(q.points||10),0);
  const correct=qz.answers.filter(a=>a.isCorrect).length;
  const total=lv.questions.length;
  const acc=Math.round(correct/total*100);
  const stars=acc>=90?3:acc>=75?2:acc>=60?1:0;
  const passed=acc>=60;
  const res={level:i+1,player:progress.player,date:new Date().toLocaleString('es'),challenge:!!qz.challenge,
    score:qz.score,max,correct,total,accuracy:acc,stars,bestStreak:qz.bestStreak,answers:qz.answers};
  progress.results[i]=res;
  progress.best[i]=Math.max(progress.best[i],qz.score);
  progress.stars[i]=Math.max(progress.stars[i],stars);
  if(passed&&i+1<DATA.length) progress.unlocked[i+1]=true;
  progress.leaderboard.push({player:progress.player||'Anónimo',level:i+1,levelTitle:DATA[i].title,score:qz.score,accuracy:acc,stars,challenge:!!qz.challenge,date:res.date});
  progress.leaderboard.sort((a,b)=>b.score-a.score);
  if(progress.leaderboard.length>50) progress.leaderboard=progress.leaderboard.slice(0,50);
  // Historial acumulado por intento (para la ficha del nivel)
  const topics={};
  qz.answers.forEach(a=>{const t=a.topic||'General';(topics[t]=topics[t]||{c:0,n:0});topics[t].n++;if(a.isCorrect)topics[t].c++;});
  progress.history.push({level:i+1,date:res.date,score:qz.score,max,accuracy:acc,correct,total,stars,challenge:!!qz.challenge,topics});
  if(progress.history.length>300) progress.history=progress.history.slice(-300);
  save(progress);
  state.lastRes=res;
  if(passed){beep('win');confetti();}
  go('results');
}

function animateCount(el,target,dur){
  if(!el) return; const start=performance.now();

}

   EXPORTACIÓN A EXCEL (.xlsx real, sin librerías)
   ============================================================ */
function crc32(buf){
  let table=crc32.t;
  if(!table){table=crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?(0xEDB88320^(c>>>1)):(c>>>1);table[n]=c>>>0;}}
  let crc=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++)crc=(crc>>>8)^table[(crc^buf[i])&0xFF];
  return (crc^0xFFFFFFFF)>>>0;
}
function strBytes(s){return new TextEncoder().encode(s);}
function zipStore(files){
  // files: [{name, bytes}]
  const chunks=[],central=[];let offset=0;
  const now=new Date();
  const dosTime=((now.getHours()&31)<<11)|((now.getMinutes()&63)<<5)|((now.getSeconds()/2)&31);
  const dosDate=(((now.getFullYear()-1980)&127)<<9)|(((now.getMonth()+1)&15)<<5)|(now.getDate()&31);
  function u16(n){return [n&255,(n>>8)&255];}
  function u32(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];}
  files.forEach(f=>{
    const name=strBytes(f.name),data=f.bytes,crc=crc32(data);
    const local=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(dosTime),u16(dosDate),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0));
    const localBuf=new Uint8Array(local.length+name.length+data.length);
    localBuf.set(local,0);localBuf.set(name,local.length);localBuf.set(data,local.length+name.length);
    chunks.push(localBuf);
    const cen=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(dosTime),u16(dosDate),u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
    const cenBuf=new Uint8Array(cen.length+name.length);cenBuf.set(cen,0);cenBuf.set(name,cen.length);
    central.push(cenBuf);
    offset+=localBuf.length;
  });
  const cenSize=central.reduce((a,b)=>a+b.length,0),cenOffset=offset;
  const end=[].concat(u32(0x06054b50),u16(0),u16(0),u16(files.length),u16(files.length),u32(cenSize),u32(cenOffset),u16(0));
  const total=offset+cenSize+end.length;
  const out=new Uint8Array(total);let p=0;
  chunks.forEach(c=>{out.set(c,p);p+=c.length;});
  central.forEach(c=>{out.set(c,p);p+=c.length;});
  out.set(new Uint8Array(end),p);
  return out;
}
function xesc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));}
function colLetter(n){let s='';n++;while(n>0){const m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=Math.floor((n-1)/26);}return s;}
function sheetXml(rows,cols){
  // rows: array of arrays; cell = {v, t:'s'|'n', s:styleIdx}
  let colsXml='';
  if(cols){colsXml='<cols>'+cols.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>';}
  let body='';
  rows.forEach((row,r)=>{
    body+=`<row r="${r+1}">`;
    row.forEach((cell,c)=>{
      if(cell==null||cell.v===''&&cell.v!==0){ if(cell&&cell.s){body+=`<c r="${colLetter(c)}${r+1}" s="${cell.s}"/>`;} return; }
      const ref=colLetter(c)+(r+1);
      const s=cell.s?` s="${cell.s}"`:'';
      if(cell.t==='n'){body+=`<c r="${ref}"${s}><v>${cell.v}</v></c>`;}
      else{body+=`<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xesc(cell.v)}</t></is></c>`;}
    });
    body+=`</row>`;
  });
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${colsXml}<sheetData>${body}</sheetData></worksheet>`;
}

</Relationships>`)});
  files.push({name:'xl/workbook.xml',bytes:strBytes(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets>${sheets.map((s,i)=>`<sheet name="${xesc(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets>
</workbook>`)});
  files.push({name:'xl/_rels/workbook.xml.rels',bytes:strBytes(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')}
<Relationship Id="rId${sheets.length+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`)});
  files.push({name:'xl/styles.xml',bytes:strBytes(STYLES_XML)});
  sheets.forEach((s,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`,bytes:strBytes(sheetXml(s.rows,s.cols))}));
  return zipStore(files);
}
function S(v,s){return {v:v,t:'s',s:s};}
function Nc(v,s){return {v:v,t:'n',s:s||0};}
function download(bytes,filename,mime){
  try{
    const blob=new Blob([bytes],{type:mime});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1200);
  }catch(e){alert('No se pudo descargar: '+e.message);}
}
function resultsToSheets(list){
  // Resumen sheet
  const H=1; // header style
  const resumen=[
    [S('LUDATOS · Informe de resultados de estadística',5)],
    [S('Jugador:',0),S(progress.player||'—',0),S('',0),S('Fecha:',0),S(new Date().toLocaleString('es'),0)],
    [],
    [S('Nivel',H),S('Tema',H),S('Puntaje',H),S('Máx',H),S('Aciertos',H),S('Preguntas',H),S('Precisión %',H),S('Estrellas',H)]
  ];
  let tScore=0,tMax=0,tCorr=0,tTot=0;
  list.forEach(r=>{
    resumen.push([S('Nivel '+r.level,2),S(DATA[r.level-1]?DATA[r.level-1].title:'',2),Nc(r.score,6),Nc(r.max,6),Nc(r.correct,6),Nc(r.total,6),Nc(r.accuracy,6),S('★'.repeat(r.stars)+'☆'.repeat(3-r.stars),6)]);
    tScore+=r.score;tMax+=r.max;tCorr+=r.correct;tTot+=r.total;
  });
  resumen.push([S('TOTAL',1),S('',1),Nc(tScore,1),Nc(tMax,1),Nc(tCorr,1),Nc(tTot,1),Nc(tTot?Math.round(tCorr/tTot*100):0,1),S('',1)]);
  // Detalle sheet
  const detalle=[[S('Nivel',H),S('Nº',H),S('Tema',H),S('Pregunta',H),S('Tu respuesta',H),S('Respuesta correcta',H),S('¿Correcto?',H),S('Pts obtenidos',H),S('Pts posibles',H),S('Corrección / Explicación',H)]];
  list.forEach(r=>{
    r.answers.forEach((a,k)=>{
      const st=a.isCorrect?3:4;
      detalle.push([
        S('N'+r.level,st),Nc(k+1,st),S(a.topic,st),S(a.prompt,st),S(a.given,st),S(a.correct,st),
        S(a.isCorrect?'Sí':'No',st),Nc(a.earned,st),Nc(a.points,st),S(a.correction,st)
      ]);
    });
  });
  return [
    {name:'Resumen',rows:resumen,cols:[12,22,10,8,10,11,12,10]},
    {name:'Detalle',rows:detalle,cols:[7,5,16,44,18,20,11,12,12,60]}
  ];
}
function doExcel(list,fname){
  if(!list.length){alert('Aún no hay resultados. ¡Completa una evaluación primero!');return;}
  try{
    const sheets=resultsToSheets(list);
    const bytes=buildXlsx(sheets);
    download(bytes,fname,'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  }catch(e){
    // Fallback CSV
    let csv='﻿Nivel,Nº,Tema,Pregunta,Tu respuesta,Respuesta correcta,Correcto,Pts obtenidos,Pts posibles,Corrección\n';
    list.forEach(r=>r.answers.forEach((a,k)=>{
      const q=x=>'"'+String(x==null?'':x).replace(/"/g,'""')+'"';
      csv+=[q('N'+r.level),k+1,q(a.topic),q(a.prompt),q(a.given),q(a.correct),a.isCorrect?'Sí':'No',a.earned,a.points,q(a.correction)].join(',')+'\n';
    }));
    download(strBytes(csv),fname.replace(/\.xlsx$/,'.csv'),'text/csv');
  }
}
function downloadExcelLevel(i){const r=progress.results[i];doExcel(r?[r]:[],`Ludatos_Nivel${i+1}_resultados.xlsx`);}
function downloadExcelAll(){doExcel(progress.results.filter(Boolean),'Ludatos_resultados_completos.xlsx');}

/* ============================================================
   EFECTOS: confetti + puntos flotantes + shake
   ============================================================ */
function floatPoints(txt){
  const el=document.createElement('div');el.className='floatpts';el.textContent=txt;
  el.style.left=(window.innerWidth/2-20)+'px';el.style.top=(window.innerHeight/2)+'px';
  document.body.appendChild(el);setTimeout(()=>el.remove(),1000);
}
function shake(el){el.animate([{transform:'translateX(0)'},{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:300});beep('bad');}
function confetti(){
  const cv=document.getElementById('confetti'),ctx=cv.getContext('2d');
  cv.width=innerWidth;cv.height=innerHeight;
  const cols=['#2f7cc0','#77b06a','#ec6a9c','#f3c53f','#a487d6','#7cc5e8'];
  const P=[];for(let i=0;i<140;i++)P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,s:5+Math.random()*7,c:cols[i%cols.length],r:Math.random()*6,vr:(Math.random()-.5)*.3});
  let t=0;
  (function anim(){
    t++;ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);ctx.restore();});
    if(t<160)requestAnimationFrame(anim);else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* ============================================================
   NAVEGACIÓN
   ============================================================ */
function go(v){if(v!=='quiz')stopTimer();state.view=v;render();window.scrollTo({top:0,behavior:'smooth'});}
function openLevel(i){state.li=i;go('level');}
function render(){
  switch(state.view){
    case 'home':viewHome();break;
    case 'level':viewLevel();break;
    case 'form':viewForm();break;
    case 'quiz':viewQuiz();break;
    case 'results':viewResults();break;
    case 'board':viewBoard();break;
    case 'ficha':viewFicha();break;
    default:viewHome();
  }
}
function savePlayer(){const el=$('#playerName');if(el){progress.player=el.value.trim();save(progress);const b=event.target;b.textContent='✔';setTimeout(()=>b.textContent='Guardar',1000);}}
function toggleSound(){progress.sound=!progress.sound;save(progress);render();}
function toggleChallenge(v){progress.challenge=!!v;save(progress);}
function resetProgress(){
  if(confirm('¿Reiniciar todo el progreso y resultados?')){
    progress={player:progress.player,unlocked:padArr([],NL,i=>i===0),best:padArr([],NL,0),stars:padArr([],NL,0),formDone:padArr([],NL,false),results:padArr([],NL,null),sound:progress.sound,challenge:progress.challenge,leaderboard:[],history:[]};
    save(progress);go('home');
  }
}

/* Init */
render();
