<script>/* ============================================================
   MOTOR FINANCIERO · fórmulas del §8 del documento
   F1 saldo · F2 servicio · F3 CFADS · F4 DSCR · F5 capacidad
   F6 caja final · F7 brecha · F11/F12 desviaciones
   ============================================================ */

const PERIODICIDAD = { 1:'Anual', 2:'Semestral', 4:'Trimestral', 12:'Mensual' };
const METODOS = { frances:'Cuota fija (francés)', aleman:'Abono constante (alemán)', bullet:'Pago único al vencimiento' };
const MONEDAS = ['COP', 'USD', 'EUR'];

/* --- Calendario de un tramo · F1 y F2 --- */
function calendarioTramo(tr, horizonte, m) {
  const i = (tr.tasa / 100) / m;
  const filas = [];
  let saldo = 0;
  const amortizables = Math.max(tr.plazo - tr.gracia, 1);
  const cuota = i > 0 ? tr.monto * i / (1 - Math.pow(1 + i, -amortizables)) : tr.monto / amortizables;

  for (let t = 1; t <= horizonte; t++) {
    const vivo = t >= tr.desde && t < tr.desde + tr.plazo;
    if (t === tr.desde) saldo = tr.monto;
    if (!vivo) { filas.push({ t, saldoIni:0, interes:0, principal:0, servicio:0, saldoFin:0, vivo:false }); continue; }

    const saldoIni = saldo;
    const interes = saldoIni * i;
    const k = t - tr.desde + 1;               // periodo dentro del tramo
    let principal = 0;
    if (k > tr.gracia) {
      if (tr.metodo === 'frances')     principal = Math.max(0, cuota - interes);
      else if (tr.metodo === 'aleman') principal = tr.monto / amortizables;
      else if (tr.metodo === 'bullet') principal = (k === tr.plazo) ? saldoIni : 0;
    }
    principal = Math.min(principal, saldoIni);
    const saldoFin = saldoIni - principal;
    filas.push({ t, saldoIni, interes, principal, servicio: principal + interes, saldoFin, vivo:true });
    saldo = saldoFin;
  }
  return filas;
}

/* --- CFADS · F3 --- */
function cfadsPeriodo(lineas, t) {
  let v = 0;
  lineas.forEach(l => {
    if (!l.elegible) return;
    const valor = l.valor * Math.pow(1 + (l.crec || 0) / 100, t - 1);
    if (l.tipo === 'ingreso') v += valor;
    else v -= valor;                       // egreso e inversión restan
  });
  return v;
}

/* --- Modelo completo --- */
function calcular(mod) {
  const H = Math.max(1, Math.min(60, mod.proyecto.horizonte));
  const m = mod.proyecto.periodicidad;
  const porTramo = mod.tramos.map(tr => calendarioTramo(tr, H, m));
  const filas = [];
  let caja = mod.liquidez.caja0;

  for (let t = 1; t <= H; t++) {
    const agg = porTramo.reduce((a, ft) => {
      const f = ft[t - 1];
      a.saldoIni += f.saldoIni; a.interes += f.interes;
      a.principal += f.principal; a.servicio += f.servicio; a.saldoFin += f.saldoFin;
      return a;
    }, { saldoIni:0, interes:0, principal:0, servicio:0, saldoFin:0 });

    const cfads = cfadsPeriodo(mod.flujo, t);
    // RN-FIN-02: con servicio cero el DSCR no se calcula, no es infinito
    const dscr = agg.servicio > 0 ? cfads / agg.servicio : null;
    const cajaIni = caja;
    const cajaFin = cajaIni + cfads - agg.servicio;
    const brecha = cajaFin - mod.liquidez.cajaMin;

    const rotos = mod.covenants.filter(c => covenantActivo(c, t) && dscr !== null && dscr < c.umbral);
    filas.push({ t, ...agg, cfads, dscr, cajaIni, cajaFin, brecha,
                 rompeCov: rotos.length > 0, covRotos: rotos,
                 rompeLiq: brecha < 0 });
    caja = cajaFin;
  }
  return { filas, porTramo, H, m };
}

function covenantActivo(c, t) {
  if (c.desde && t < c.desde) return false;
  if (c.hasta && c.hasta > 0 && t > c.hasta) return false;
  return true;
}

function resumen(r, mod) {
  const dscrs = r.filas.map(f => f.dscr).filter(v => v !== null);
  const fCov = r.filas.filter(f => f.rompeCov);
  const fLiq = r.filas.filter(f => f.rompeLiq);
  return {
    dscrMin: dscrs.length ? Math.min(...dscrs) : null,
    brechaMin: Math.min(...r.filas.map(f => f.brecha)),
    cajaMinAlcanzada: Math.min(...r.filas.map(f => f.cajaFin)),
    servicioTotal: r.filas.reduce((a, f) => a + f.servicio, 0),
    interesTotal: r.filas.reduce((a, f) => a + f.interes, 0),
    deudaTotal: mod.tramos.reduce((a, t) => a + t.monto, 0),
    noCalculables: r.filas.filter(f => f.dscr === null).length,
    fCov, fLiq,
    factible: !fCov.length && !fLiq.length
  };
}

/* --- Capacidad máxima · F5 -------------------------------------------------
   Se escala proporcionalmente el conjunto de tramos y se busca el factor
   máximo factible por bisección. El documento admite búsqueda iterativa,
   optimización o Goal Seek y no fija tolerancia (§8.3): la bisección con 60
   iteraciones es una decisión de esta implementación, declarada en pantalla.
   -------------------------------------------------------------------------- */
function capacidad(mod) {
  const base = mod.tramos.reduce((a, t) => a + t.monto, 0);
  if (base <= 0) return { monto:0, factor:0, vinculante:'no hay tramos configurados' };

  const factible = k => {
    const copia = JSON.parse(JSON.stringify(mod));
    copia.tramos.forEach(t => t.monto *= k);
    return resumen(calcular(copia), copia).factible;
  };

  if (!factible(0.001)) return { monto:0, factor:0, vinculante:'ninguna estructura es factible' };
  let lo = 0.001, hi = 8;
  if (factible(hi)) return { monto: base * hi, factor: hi, vinculante:'sin restricción activa en el rango explorado' };
  for (let n = 0; n < 60; n++) {
    const mid = (lo + hi) / 2;
    if (factible(mid)) lo = mid; else hi = mid;
  }
  // Qué restricción falla justo por encima del máximo
  const copia = JSON.parse(JSON.stringify(mod));
  copia.tramos.forEach(t => t.monto *= lo * 1.02);
  const rr = resumen(calcular(copia), copia);
  let vinc = 'ninguna';
  if (rr.fCov.length && rr.fLiq.length) vinc = 'cobertura y liquidez a la vez';
  else if (rr.fCov.length) vinc = `cobertura · DSCR bajo el umbral en el periodo ${rr.fCov[0].t}`;
  else if (rr.fLiq.length) vinc = `liquidez · caja bajo el mínimo en el periodo ${rr.fLiq[0].t}`;
  return { monto: base * lo, factor: lo, vinculante: vinc,
           periodosCriticos: (rr.fCov.concat(rr.fLiq)).map(f => f.t).slice(0, 6) };
}

/* --- Desviaciones · F11 y F12 --- */
function desviacion(observado, proyectado) {
  const abs = observado - proyectado;
  // §8.6: con base cero, negativa o no comparable, no se muestra porcentaje
  const rel = (proyectado === 0 || proyectado === null || !isFinite(proyectado) || proyectado < 0)
    ? null : abs / proyectado * 100;
  return { abs, rel };
}

/* ============================================================
   VALIDACIONES · RF-022 y las reglas RN-FIN
   Este es el motor de análisis aplicado al modelo del usuario:
   reglas explícitas, sin IA, con la regla visible en cada hallazgo.
   ============================================================ */
const REGLAS_VALIDACION = [
  { cod:'VAL-01', sev:'critico', donde:'proyecto', regla:'RF-009 · el proyecto debe declarar propósito, responsable, horizonte, periodicidad, moneda y alcance antes de calcular.',
    check: m => {
      const faltan = [];
      if (!m.proyecto.nombre.trim())      faltan.push('nombre');
      if (!m.proyecto.proposito.trim())   faltan.push('propósito');
      if (!m.proyecto.responsable.trim() || m.proyecto.responsable === 'Sin asignar') faltan.push('responsable');
      if (!m.proyecto.alcance.trim())     faltan.push('alcance');
      return faltan.length ? { titulo:'El proyecto está incompleto',
        detalle:`Faltan: ${faltan.join(', ')}. Mientras falte alguno, el modelo no puede aprobarse.` } : null;
    } },
  { cod:'VAL-02', sev:'critico', donde:'supuestos', regla:'RF-010 y RN-FIN-05 · todo supuesto debe identificar fuente, racional, responsable y fecha. Un supuesto sin fuente queda en borrador.',
    check: m => {
      const sin = m.supuestos.filter(s => !String(s.fuente || '').trim());
      return sin.length ? { titulo:`${sin.length} supuesto(s) sin fuente`,
        detalle:`Sin fuente identificada: ${sin.map(s => s.variable).join(', ')}. El modelo permanece en borrador.` } : null;
    } },
  { cod:'VAL-03', sev:'medio', donde:'supuestos', regla:'RN-FIN-05 · el racional y el responsable son obligatorios además de la fuente.',
    check: m => {
      const sin = m.supuestos.filter(s => String(s.fuente || '').trim() &&
                 (!String(s.racional || '').trim() || !String(s.responsable || '').trim()));
      return sin.length ? { titulo:`${sin.length} supuesto(s) sin racional o responsable`,
        detalle:'Tienen fuente pero no dicen por qué se eligió ese valor ni quién responde por él.' } : null;
    } },
  { cod:'VAL-04', sev:'critico', donde:'covenants', regla:'RF-014, RN-FIN-03 y CP-008 · el covenant debe tener tipo, umbral, periodo, fuente y vigencia. Sin fuente se permite borrador, pero no aprobar ni calcular capacidad definitiva.',
    check: m => {
      const sin = m.covenants.filter(c => !String(c.fuente || '').trim());
      return sin.length ? { titulo:`${sin.length} covenant(s) sin fuente contractual`,
        detalle:'La app no debe inventar el umbral: proviene del contrato o de una política identificada. Sin fuente no puede aprobarse el modelo.' } : null;
    } },
  { cod:'VAL-05', sev:'medio', donde:'covenants', regla:'RN-FIN-03 · el covenant necesita periodo de cura y consecuencia declarados; un incumplimiento con 90 días de cura no equivale a uno con aceleración inmediata.',
    check: m => {
      const sin = m.covenants.filter(c => !String(c.cura || '').trim() || !String(c.consecuencia || '').trim());
      return sin.length ? { titulo:`${sin.length} covenant(s) sin cura o consecuencia`,
        detalle:'Falta lo que determina el efecto real del incumplimiento.' } : null;
    } },
  { cod:'VAL-06', sev:'critico', donde:'deuda', regla:'CP-006 · el saldo debe conciliar en cada periodo: saldo final = saldo inicial + desembolsos − principal ± ajustes.',
    check: m => {
      const r = calcular(m);
      const malos = r.filas.filter(f => Math.abs(f.saldoFin - (f.saldoIni - f.principal)) > 0.01);
      return malos.length ? { titulo:'El saldo de deuda no concilia',
        detalle:`Periodos con diferencia: ${malos.map(f => 'P' + f.t).join(', ')}.` } : null;
    } },
  { cod:'VAL-07', sev:'critico', donde:'deuda', regla:'RF-011 · debe existir al menos una obligación configurada para poder calcular.',
    check: m => m.tramos.length ? null :
      { titulo:'No hay obligaciones de deuda', detalle:'Sin tramos no hay servicio de deuda, ni cobertura, ni capacidad.' } },
  { cod:'VAL-08', sev:'medio', donde:'deuda', regla:'RN-FIN-02 · con servicio de deuda cero el DSCR se muestra como «No calculable», nunca como infinito.',
    check: m => {
      const r = calcular(m);
      const n = r.filas.filter(f => f.dscr === null).length;
      return n ? { titulo:`${n} periodo(s) con DSCR no calculable`,
        detalle:'El servicio de deuda es cero en esos periodos. No es un error: es la regla aplicada. No hay medición de cobertura ahí.' } : null;
    } },
  { cod:'VAL-09', sev:'critico', donde:'liquidez', regla:'CP-010 · un escenario que cumple el covenant pero deja la caja bajo el mínimo queda no factible por liquidez.',
    check: m => {
      const r = calcular(m); const s = resumen(r, m);
      if (!s.fLiq.length) return null;
      const soloLiq = !s.fCov.length;
      return { titulo:`Incumplimiento de liquidez en ${s.fLiq.length} periodo(s)`,
        detalle:`Periodos: ${s.fLiq.map(f => 'P' + f.t).join(', ')}. ` +
          (soloLiq ? 'La cobertura se cumple en todo el horizonte y aun así el escenario no es viable: es exactamente el caso CP-010.' : '') };
    } },
  { cod:'VAL-10', sev:'critico', donde:'liquidez', regla:'RF-016 · el covenant de cobertura debe cumplirse en todos los periodos activos.',
    check: m => {
      const r = calcular(m); const s = resumen(r, m);
      return s.fCov.length ? { titulo:`Incumplimiento de cobertura en ${s.fCov.length} periodo(s)`,
        detalle:`Periodos: ${s.fCov.map(f => 'P' + f.t).join(', ')}. Restricción vinculante en el cálculo de capacidad.` } : null;
    } },
  { cod:'VAL-11', sev:'medio', donde:'flujo', regla:'RF-013 · el mapeo del CFADS debe aprobarse: mezclar utilidad contable, EBITDA o caja libre sin definición sobreestima la capacidad.',
    check: m => {
      const noElegibles = m.flujo.filter(l => !l.elegible);
      if (!m.flujo.some(l => l.elegible)) return { titulo:'No hay líneas elegibles en el CFADS',
        detalle:'Sin líneas elegibles el flujo disponible es cero y el DSCR carece de sentido.' };
      return noElegibles.length ? null : { titulo:'Todas las líneas están marcadas como elegibles',
        detalle:'Conviene revisar si alguna partida no recurrente o restringida debería quedar fuera del CFADS.' };
    } },
  { cod:'VAL-12', sev:'medio', donde:'simulacion', regla:'CP-012 · una distribución sin justificación deja la simulación en borrador; no puede publicarse como análisis aprobado.',
    check: m => {
      if (!m.simulacion) return null;
      const sin = (m.simulacion.entradas || []).filter(e => !String(e.justificacion || '').trim());
      return sin.length ? { titulo:`${sin.length} distribución(es) sin justificación`,
        detalle:'La simulación queda en borrador hasta que cada distribución explique en qué evidencia se apoya.' } : null;
    } },
  { cod:'VAL-13', sev:'critico', donde:'decision', regla:'RN-FIN-10 y RF-028 · la decisión debe registrar responsable, fecha, comentario y riesgo residual.',
    check: m => {
      const d = m.decision;
      if (!d.responsable && !d.comentario && !d.residual) return null;   // aún no se ha empezado
      const faltan = [];
      if (!String(d.responsable || '').trim()) faltan.push('responsable');
      if (!String(d.comentario  || '').trim()) faltan.push('comentario');
      if (!String(d.residual    || '').trim()) faltan.push('riesgo residual');
      return faltan.length ? { titulo:'La decisión está incompleta',
        detalle:`Faltan: ${faltan.join(', ')}. No se puede cerrar sin responsable.` } : null;
    } },
  { cod:'VAL-14', sev:'leve', donde:'supuestos', regla:'RN-FIN-06 · históricos, presupuestos y proyecciones no pueden mezclarse sin etiqueta.',
    check: m => {
      const sinTipo = m.supuestos.filter(s => !s.tipo);
      return sinTipo.length ? { titulo:`${sinTipo.length} supuesto(s) sin clasificar`,
        detalle:'Cada entrada debe declarar si es dato histórico, presupuesto o proyección.' } : null;
    } }
];

function validar(mod) {
  const m = mod || estado.m;
  const out = [];
  REGLAS_VALIDACION.forEach(r => {
    let res = null;
    try { res = r.check(m); } catch (e) { res = null; }
    if (res) out.push({ ...r, ...res });
  });
  return out;
}

/* ¿Se puede aprobar el modelo? Solo si no hay hallazgos críticos. */
function puedeAprobar(mod) {
  return validar(mod).filter(h => h.sev === 'critico').length === 0;
}

<script>/* ============================================================
   MÓDULO 1 · FORMACIÓN
   Ruta completa de §4 y §5, más el contenido obligatorio de §9.1.

function despuesDePintar(sec) {
  if (sec === 'f-evaluacion') pintarExamen();
}

function iniciarExamen() {
  if (!estado.perfil.nombre.trim() || !estado.perfil.cargo.trim()) {
    toast('Registra nombre y cargo antes de iniciar (§6.2)', 'mal'); return;
  }
  const base = [], pool = {};
  UNIDADES.forEach(u => {
    const items = PREGUNTAS.filter(p => p.u === u.codigo).slice();
    barajar(items);
    base.push(...items.slice(0, BASE_POR_UNIDAD));
    pool[u.codigo] = items.slice(BASE_POR_UNIDAD);
  });
  barajar(base);
  estado.examen = { base, pool, i:0, aciertosPrimera:0, respuestas:[], repregunta:null,
                    dominados:{}, fallados:{}, inicio: Date.now() };
  pintarExamen();
}
function barajar(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } }

function pintarExamen() {
  const z = $('#examen-zona'); if (!z) return;
  const e = estado.examen;
  if (!e) {
    z.innerHTML = `<h2>Comenzar</h2>
      <div class="tarjeta">
        <p>El examen toma <strong>${BASE_POR_UNIDAD} ítems por unidad</strong> (${BASE_POR_UNIDAD * UNIDADES.length} en total),
        en orden aleatorio y balanceado, como pide §5.1. Ante un error verás la corrección, la explicación y una repregunta
        distinta de la misma unidad; esa repregunta <strong>no puntúa</strong>, pero sí registra dominio.</p>
        <p style="margin-bottom:14px">Se aprueba con <strong>80 % o más</strong> sobre los ítems base.</p>
        <button onclick="iniciarExamen()">${ico('play',15)} Iniciar evaluación</button>
      </div>`;
    return;
  }
  const total = e.base.length;
  const preg = e.repregunta || e.base[e.i];
  const esRe = !!e.repregunta;
  z.innerHTML = `<h2>Evaluación en curso</h2>
    <div class="tarjeta no-imprimir" style="margin-bottom:12px">
      <div class="progreso" style="margin-bottom:7px"><i style="width:${e.i / total * 100}%"></i></div>
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)">
        <span>Ítem ${Math.min(e.i + 1, total)} de ${total}${esRe ? ' · <strong style="color:var(--warn)">repregunta de refuerzo</strong>' : ''}</span>
        <span>Aciertos en primera: <strong>${e.aciertosPrimera}</strong></span>
      </div>
    </div>
    <div class="pregunta">
      <div style="display:flex;gap:7px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
        <span class="eti">${preg.u}</span>
        <span class="eti ${preg.origen === 'doc' ? 'verde' : 'ambar'}">${preg.origen === 'doc' ? 'Del documento' : 'Ítem añadido'}</span>
        <span style="font-size:10.5px;color:var(--ink-4)">Objetivo: ${esc(preg.objetivo)}</span>
      </div>
      <div class="enunciado">${esc(preg.enunciado)}</div>
      <div class="opciones" id="opciones">
        ${preg.opciones.map((o, k) => `<button class="opcion" data-k="${k}" onclick="responder(${k})">
          <span class="letra">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}
      </div>
      <div id="retro"></div>
    </div>`;
}

function responder(k) {
  const e = estado.examen;
  if (!e) return;
  const preg = e.repregunta || e.base[e.i];
  const esRe = !!e.repregunta;
  if (!esRe && e.respuestas[e.i]) return;      // un ítem base solo puntúa una vez
  const ok = k === preg.correcta;

  $$('#opciones .opcion').forEach(o => {
    o.classList.add('bloqueada');
    const kk = +o.dataset.k;
    if (kk === preg.correcta) o.classList.add('correcta');
    else if (kk === k) o.classList.add('incorrecta');
  });

  if (!esRe) {
    e.respuestas[e.i] = { id:preg.id, ok, u:preg.u };
    if (ok) { e.aciertosPrimera++; e.dominados[preg.objetivo] = true; }
    else e.fallados[preg.objetivo] = true;
  } else if (ok) e.dominados[preg.objetivo] = true;

  const hayEq = e.pool[preg.u] && e.pool[preg.u].length > 0;
  $('#retro').innerHTML = `
    ${avisoHTML(ok ? 'ok' : 'mal', ok ? 'Respuesta correcta' : 'Respuesta incorrecta',
      `<p style="margin-bottom:5px">${esc(ok ? preg.bien : preg.mal)}</p>
       ${!ok ? `<p style="margin-bottom:5px"><strong>Respuesta correcta:</strong> ${esc(preg.opciones[preg.correcta])}</p>` : ''}
       <p style="margin:0;font-size:12px"><strong>Riesgo de aplicar mal el concepto:</strong> ${esc(preg.riesgo)}</p>`)}
    ${!ok && !esRe && hayEq
      ? avisoHTML('aten', 'Repregunta · §5.2',
          `<p style="margin:0">Esta respuesta queda como incorrecta para el intento. A continuación verás
           <strong>otro ítem de ${preg.u}</strong>, con enunciado y opciones distintos. Esa pregunta no modifica el resultado.</p>`) +
        `<button class="no-imprimir" onclick="lanzarRepregunta('${preg.u}')">${ico('flecha',15)} Ver la repregunta</button>`
      : `<button class="no-imprimir" onclick="siguiente()">${e.i >= e.base.length - 1 ? 'Ver resultado' : 'Siguiente'} ${ico('flecha',15)}</button>`}`;
}
function lanzarRepregunta(u) { estado.examen.repregunta = estado.examen.pool[u].shift(); pintarExamen(); }
function siguiente() {
  const e = estado.examen;
  e.repregunta = null; e.i++;
  if (e.i >= e.base.length) cerrarIntento(); else pintarExamen();
}

function cerrarIntento() {
  const e = estado.examen, total = e.base.length;
  const resultado = e.aciertosPrimera / total * 100;
  const objetivos = new Set([...Object.keys(e.dominados), ...Object.keys(e.fallados)]).size;
  const dominio = objetivos ? Object.keys(e.dominados).length / objetivos * 100 : 0;
  const porUnidad = {};
  e.respuestas.forEach(r => {
    if (!porUnidad[r.u]) porUnidad[r.u] = { ok:0, n:0 };
    porUnidad[r.u].n++; if (r.ok) porUnidad[r.u].ok++;
  });
  const it = {
    n: estado.intentos.length + 1, nombre: estado.perfil.nombre, cargo: estado.perfil.cargo,
    resultado: Math.round(resultado * 10) / 10, dominio: Math.round(dominio * 10) / 10,
    aprobado: resultado >= 80, aciertos: e.aciertosPrimera, total,
    fecha: new Date().toISOString(), porUnidad,
    codigo: codigoCertificado(estado.perfil.nombre, estado.intentos.length + 1, Math.round(resultado))
  };
  estado.intentos.push(it);
  estado.examen = null;
  guardar();

  const flojas = Object.entries(porUnidad).filter(([, v]) => v.ok < v.n).map(([u]) => u);
  $('#examen-zona').innerHTML = `<h2>Resultado del intento ${it.n}</h2>
    <div class="rejilla c4">
      ${tile('Resultado del intento', fmtN(it.resultado, 1) + '<small>%</small>', 'sobre ítems base', it.aprobado ? 'ok' : 'mal', 'ok')}
      ${tile('Aciertos en primera', `${it.aciertos}<small>/${total}</small>`, '', '', 'libro')}
      ${tile('Dominio posterior', fmtN(it.dominio, 1) + '<small>%</small>', 'tras el refuerzo', '', 'bombilla')}
      ${tile('Criterio ≥ 80 %', it.aprobado ? 'Aprobado' : 'No aprobado', '', it.aprobado ? 'ok' : 'mal', 'certificado')}
    </div>
    ${figura('Aciertos por unidad', 'Sobre los ítems base del intento',
      barrasH(UNIDADES.map(u => [u.codigo + ' · ' + u.titulo.slice(0, 26), (porUnidad[u.codigo] || {ok:0}).ok]),
              { anchoEtq: 230, color: (d, i) => (porUnidad[UNIDADES[i].codigo] || {ok:0}).ok === BASE_POR_UNIDAD ? PAL[1] : PAL[0] }))}
    ${flojas.length ? avisoHTML('aten', 'Ruta de refuerzo',
      `<p style="margin:0">Repasa ${esc(flojas.join(', '))} antes del siguiente intento. §5.1 habilita el reintento después del refuerzo, con ítems nuevos o variantes equivalentes.</p>`) : ''}
    ${it.aprobado
      ? avisoHTML('ok', 'Certificado disponible', `<p style="margin:0">Ve a la sección Certificado para verlo e imprimirlo.
          <button class="mini sec no-imprimir" style="margin-left:8px" onclick="irSeccion('f-certificado')">Abrir certificado</button></p>`)
      : avisoHTML('mal', 'Sin certificado · CP-001',
          '<p style="margin:0">Un resultado inferior al 80 % no emite certificado. El intento queda conservado en el historial.</p>')}
    <button class="sec no-imprimir" onclick="estado.examen=null;pintarExamen()">Volver</button>`;
}

function codigoCertificado(nombre, intento, resultado) {
  return 'RHV-MF-' + huella((nombre || '') + '|' + intento + '|' + resultado + '|' +
    new Date().toISOString().slice(0, 10)).replace(/(.{4})/, '$1-');
}

/* Reglas sobre el documento (versión compacta del motor documental) */
const REGLAS_DOC = [
  { cod:'D-01', sev:'critico', titulo:'El denominador del resultado del intento no está definido',
    regla:'Buscar «preguntas válidas» en el texto y comprobar si existe una oración definitoria.',
    ej: t => {
      const usos = (t.match(/preguntas válidas/gi) || []).length;
      const def = /(se entiende por|se define como|es el conjunto de)[^.]{0,60}preguntas válidas/i.test(t);
      return usos && !def ? { dato:`Término hallado ${usos} vez(ces), ninguna definitoria.`,
        cuerpo:'§5.4 lo usa en la fórmula del resultado y §5.1 introduce repreguntas dentro del examen. Si contaran en el denominador, cada error penalizaría dos veces. Con 20 ítems y 3 errores el resultado es 85 % o 74 % según la lectura: cambia quién se certifica.' } : null; } },
  { cod:'D-02', sev:'critico', titulo:'La evaluación certificable no tiene tamaño definido',
    regla:'Buscar expresiones que fijen el número de ítems del examen o el mínimo por unidad.',
    ej: t => {
      const p = [/\d+\s+preguntas\b/i, /número de preguntas/i, /ítems por unidad/i, /tamaño del banco/i];
      return !p.some(x => x.test(t)) ? { dato:'Ninguna de las 4 expresiones buscadas aparece.',
        cuerpo:'Con 10 preguntas el 80 % admite 2 errores; con 40 admite 8. Es el mismo criterio nominal y una exigencia real distinta. Además la Tabla 16 aporta una sola pregunta por unidad, insuficiente para construir la repregunta que exige §5.2.' } : null; } },
  { cod:'D-03', sev:'critico', titulo:'«Ruptura» se usa en una fórmula sin estar definida',
    regla:'Comprobar si el término «ruptura», presente en la fórmula de §8.5, tiene definición en el texto.',
    ej: t => {
      const usos = (t.match(/ruptura/gi) || []).length;
      const def = /(ruptura se (entiende|define)|se considera ruptura|una ruptura es)/i.test(t);
      return usos && !def ? { dato:`Aparece ${usos} veces; ninguna define qué la constituye.`,
        cuerpo:'¿Incumplir el covenant, quedar bajo la caja mínima, cualquiera de las dos o ambas? ¿«Al menos una» se refiere a periodos o a restricciones? El número reportado cambia con la elección, y es el que mira quien decide. Esta app no calcula el indicador hasta que Rehavid lo defina.' } : null; } },
  { cod:'D-04', sev:'medio', titulo:'Cuatro requisitos no funcionales sin criterio verificable',
    regla:'Marcar los RNF cuyo texto aplaza la definición del criterio.',
    ej: () => {
      const malos = RNF.filter(r => /por definir|queda por validar|^Definir /i.test(r[2]));
      return malos.length ? { dato:`${malos.length} de ${RNF.length}: ${malos.map(m => m[0]).join(', ')}.`,
        cuerpo:'Un requisito sin criterio de aceptación no es un requisito: es una nota. El documento es transparente al respecto, pero los numera igual que a los demás, lo que infla la sensación de cobertura.' } : null; } },
  { cod:'D-05', sev:'critico', titulo:'El proyecto no está dimensionado',

function ejecutarMotorDocumento() {
  const t = DOC_TEXTO_PLANO;
  const out = [];
  REGLAS_DOC.forEach(r => {
    let res = null;
    try { res = r.ej(t); } catch (e) { res = null; }
    if (res) out.push({ ...r, ...res });
  });
  return out.sort((a, b) => ({critico:0,medio:1,leve:2}[a.sev] - {critico:0,medio:1,leve:2}[b.sev]));
}

function buscarDoc(q) {
  const cuerpo = $('#doc-cuerpo'), info = $('#doc-resultado');
  if (!cuerpo) return;
  if (!cuerpo._original) cuerpo._original = cuerpo.innerHTML;
  cuerpo.innerHTML = cuerpo._original;
  if (!q || q.length < 3) { info.textContent = ''; return; }

  const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  const andar = document.createTreeWalker(cuerpo, NodeFilter.SHOW_TEXT);
  const nodos = [];
  let nodo;
  while ((nodo = andar.nextNode())) { re.lastIndex = 0; if (re.test(nodo.nodeValue)) nodos.push(nodo); }

  let n = 0;
  nodos.forEach(t => {
    const texto = t.nodeValue, frag = document.createDocumentFragment();
    let ultimo = 0, m;
    re.lastIndex = 0;
    while ((m = re.exec(texto)) !== null) {
      if (m.index > ultimo) frag.appendChild(document.createTextNode(texto.slice(ultimo, m.index)));
      const mk = document.createElement('mark'); mk.textContent = m[0];
      frag.appendChild(mk);
      ultimo = m.index + m[0].length; n++;
      if (m[0].length === 0) re.lastIndex++;
    }
    if (ultimo < texto.length) frag.appendChild(document.createTextNode(texto.slice(ultimo)));
    t.parentNode.replaceChild(frag, t);
  });
  info.textContent = n ? n + ' coincidencia(s)' : 'sin coincidencias';
}

function sel(col, i, campo, valor, opciones) {

    opciones.map(([v, t]) => `<option value="${esc(v)}" ${v === valor ? 'selected' : ''}>${esc(t)}</option>`).join('')

}
function huella(txt) {
  let a = 0x811c9dc5;
  for (let i = 0; i < txt.length; i++) { a ^= txt.charCodeAt(i); a = Math.imul(a, 0x01000193) >>> 0; }
  return a.toString(16).toUpperCase().padStart(8, '0');
}
function hashModelo(m) {

VISTAS['h-capacidad'] = () => cabecera('capacidad', 'Capacidad máxima de deuda',

  `<button onclick="correrCapacidad()">${ico('calcular',15)} Calcular capacidad</button>`) + `
  ${avisoHTML('', 'Cómo se resuelve',

function correrCapacidad() {
  const m = estado.m;
  const cap = capacidad(m);
  const base = m.tramos.reduce((a, t) => a + t.monto, 0);
  const dura = JSON.parse(JSON.stringify(m));
  dura.covenants.forEach(c => c.umbral *= 1.15);
  const capDura = capacidad(dura);
  const monotonia = capDura.monto <= cap.monto + 1;

  $('#cap-salida').innerHTML = `
    <div class="rejilla c3">
      ${tile('Monto máximo factible', fmt(cap.monto), `configurado ahora: ${fmt(base)}`, '', 'capacidad')}
      ${tile('Restricción vinculante', `<span style="font-size:14px;line-height:1.35">${esc(cap.vinculante)}</span>`,
             'RF-015 exige identificarla', '', 'covenant')}
      ${tile('Factor sobre lo configurado', fmtN(cap.factor) + '×',
             cap.factor >= 1 ? 'hay margen' : 'la estructura actual excede el máximo',
             cap.factor >= 1 ? 'ok' : 'mal', 'flujo')}
    </div>
    ${avisoHTML(monotonia ? 'ok' : 'mal', 'Comprobación de monotonía · CP-009',
      `<p style="margin:0">Con los covenants endurecidos un 15 %, la capacidad pasa de ${fmt(cap.monto)} a ${fmt(capDura.monto)}.
       ${monotonia ? 'No aumenta, como exige el caso de prueba: una restricción más exigente reduce o mantiene el conjunto factible.'
                   : '<strong>Aumenta, lo que indica un error en el motor.</strong>'}</p>`)}
    ${cap.periodosCriticos && cap.periodosCriticos.length
      ? `<p class="ayuda">Periodos críticos justo por encima del máximo: ${cap.periodosCriticos.map(t => 'P' + t).join(', ')}.</p>` : ''}
    ${avisoHTML('aten', 'Capacidad matemática no es monto recomendado',
      '<p style="margin:0">En el máximo la holgura es cero: cualquier desviación del CFADS produce incumplimiento. El documento separa capacidad matemática de decisión prudencial (§4.2 U4) y excluye de su alcance las recomendaciones financieras automáticas (§1.4).</p>')}`;
}

function exportarEspec() {
  const m = estado.m, h = hashModelo(m);
  const l = [];
  l.push('REHAVID_SIMULACION_SPEC');
  l.push('modelo,' + (m.proyecto.nombre || 'sin nombre'));
  l.push('version,' + m.proyecto.version);
  l.push('huella,' + h);
  l.push('generado,' + new Date().toISOString());
  l.push('');
  l.push('---ENTRADAS---');
  l.push('variable,distribucion,parametro1,parametro2,justificacion');
  (m.simEntradas || []).forEach(e =>
    l.push([e.variable, e.distribucion, e.p1, e.p2, String(e.justificacion || '').replace(/,/g, ';')].join(',')));
  l.push('');
  l.push('---SALIDAS_SOLICITADAS---');
  l.push('variable');
  ['DSCR minimo', 'Brecha minima de caja', 'Servicio total'].forEach(s => l.push(s));
  l.push('');
  l.push('---RESULTADOS--- (rellenar en Excel tras ejecutar Risk Simulator)');
  l.push('variable,media,mediana,desviacion,p5,p50,p95');
  ['DSCR minimo', 'Brecha minima de caja', 'Servicio total'].forEach(s => l.push(s + ',,,,,,'));
  descargarTexto('Rehavid_simulacion_spec_' + h + '.csv', l.join('\n'));
  toast('Especificación exportada. Ábrela en Excel y ejecuta Risk Simulator.', 'ok');
}

function importarResultados(inputEl) {
  const f = inputEl.files[0];
  if (!f) return;
  const lector = new FileReader();
  lector.onload = () => {
    try {
      const lineas = String(lector.result).split(/\r?\n/).map(x => x.trim());
      const valor = k => { const l = lineas.find(x => x.toLowerCase().startsWith(k + ',')); return l ? l.slice(k.length + 1) : ''; };
      const hArchivo = valor('huella');
      const hActual = hashModelo(estado.m);
      // RF-019 y CP-011: se rechaza si no corresponde al modelo y versión exportados
      if (!lineas[0] || !/REHAVID_SIMULACION/.test(lineas[0])) {
        toast('El archivo no tiene el formato de plantilla de Rehavid', 'mal'); return;
      }
      if (hArchivo !== hActual) {
        toast('Importación rechazada: la huella no corresponde a este modelo (CP-011)', 'mal');
        estado.m.revision.hallazgos.push({ fecha: new Date().toLocaleString('es-CO'),
          texto: `Importación rechazada. Huella del archivo ${hArchivo}, huella del modelo ${hActual}.` });
        guardar(); return;
      }
      const i0 = lineas.findIndex(x => x.startsWith('---RESULTADOS---'));
      if (i0 < 0) { toast('El archivo no trae bloque de resultados', 'mal'); return; }
      const salidas = [];
      for (let i = i0 + 2; i < lineas.length; i++) {
        if (!lineas[i] || lineas[i].startsWith('---')) break;
        const c = lineas[i].split(',');
        if (c.length < 7 || c.slice(1).every(x => !x)) continue;
        salidas.push({ variable:c[0], media:c[1], mediana:c[2], desv:c[3], p5:c[4], p50:c[5], p95:c[6] });
      }
      if (!salidas.length) { toast('El bloque de resultados está vacío: rellénalo en Excel', 'mal'); return; }
      estado.m.simulacion = {
        archivo: f.name, modelo: valor('modelo'), version: valor('version') || estado.m.proyecto.version,
        hash: hArchivo, fecha: new Date().toLocaleString('es-CO'), salidas,
        entradas: (estado.m.simEntradas || [])
      };
      guardar(); pintar();
      toast('Resultados importados y marcados como ejecución externa', 'ok');
    } catch (e) {
      toast('No se pudo leer el archivo: ' + e.message, 'mal');
    }
  };
  lector.readAsText(f);
  inputEl.value = '';
}

function addBacktest() {
  const r = calcular(estado.m);

  estado.m.backtest.push({ periodo:t, variable:'CFADS', proyectado: Math.round(f.cfads),
    observado: Math.round(f.cfads), causa:'', fecha: new Date().toISOString().slice(0, 10) });
  guardar(); pintar();
}

function descargarExcel() {
  try {
    const bin = atob(XLSM_B64);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    const blob = new Blob([buf], { type: 'application/vnd.ms-excel.sheet.macroEnabled.12' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'Rehavid_Herramienta_Financiera.xlsm';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Libro Excel descargado. Recuerda desbloquearlo para las macros.', 'ok');
  } catch (e) {
    toast('No se pudo generar la descarga: ' + e.message, 'mal');
  }
}
