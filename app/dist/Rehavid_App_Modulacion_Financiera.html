:root {
  /* Papel y superficies */
  --paper:      #FFFFFF;
  --paper-2:    #FBFAFE;
  --paper-3:    #F4F0FB;

  /* Tinta · tintada en morado, sin grises neutros */
  --ink:        #1F1042;
  --ink-2:      #3A2880;
  --ink-3:      #5A4A95;
  --ink-4:      #8478B2;
  --ink-5:      #A89ECD;
  --ink-6:      #C5BFDE;

  /* Líneas */
  --line:       #E5DFF6;
  --line-2:     #D5CCEC;
  --line-3:     #F0EBFA;

  /* Marca */
  --brand:       #4025CE;
  --brand-dark:  #2A1788;
  --brand-light: #6952DA;
  --brand-soft:  #EBE7FB;
  --green:       #02E577;
  --green-dark:  #00A055;
  --green-soft:  #DCF9E9;

  /* Semáforo */
  --good:     #00A055;  --good-bg:  #DCF9E9;
  --warn:     #B8770F;  --warn-bg:  #FBF3E0;
  --bad:      #B23B5C;  --bad-bg:   #FAE7EC;
  --info:     #4025CE;  --info-bg:  #EBE7FB;

  --sh-1: 0 1px 0 rgba(64,37,206,.05);
  --sh-2: 0 4px 16px rgba(64,37,206,.08);
  --sh-3: 0 8px 32px rgba(64,37,206,.12);
  --radius: 2px;
  --nav-w: 252px;
  --medida: 74ch;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  font-family: 'Outfit', -apple-system, 'Segoe UI', Arial, sans-serif;
  font-size: 14px;
  line-height: 1.62;
  color: var(--ink);
  background: var(--paper);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

/* ============================================================
   ESTRUCTURA
   ============================================================ */
.app { display: flex; min-height: 100vh; }

.nav {
  width: var(--nav-w);
  flex: 0 0 var(--nav-w);
  background: var(--paper-2);
  border-right: 1px solid var(--line);
  position: sticky; top: 0;
  height: 100vh;
  overflow-y: auto;
  padding: 0 0 28px;
}

.marca {
  padding: 22px 20px 18px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 14px;
}
.marca .logo {
  display: flex; align-items: center; gap: 9px;
  font-weight: 800; font-size: 17px; letter-spacing: -0.02em;
  color: var(--brand);
}
.marca .logo .punto {
  width: 9px; height: 9px; background: var(--green);
  border-radius: 50%; flex: 0 0 9px;
}
.marca .sub {
  font-size: 11px; color: var(--ink-4); margin-top: 5px;
  letter-spacing: 0.01em; line-height: 1.4;
}

.nav-grupo { margin-bottom: 18px; }
.nav-grupo > .titulo {
  font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.11em;
  color: var(--ink-5); font-weight: 600;
  padding: 0 20px 7px;
}
.nav a {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 20px; font-size: 13px;
  color: var(--ink-2); text-decoration: none;
  border-left: 2px solid transparent;
  transition: background .12s, color .12s;
}
.nav a .num {
  font-size: 10px; color: var(--ink-5); font-weight: 600;
  min-width: 15px;
}
.nav a:hover { background: var(--brand-soft); color: var(--brand); }
.nav a.activo {
  background: var(--brand-soft); color: var(--brand);
  border-left-color: var(--brand); font-weight: 600;
}
.nav a.activo .num { color: var(--brand); }

.lienzo { flex: 1; min-width: 0; display: flex; flex-direction: column; }

.cabecera {
  position: sticky; top: 0; z-index: 60;
  background: rgba(255,255,255,.94);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding: 13px 34px;
  display: flex; align-items: center; justify-content: space-between;
  gap: 18px;
}
.cabecera .ruta { font-size: 12px; color: var(--ink-4); }
.cabecera .ruta strong { color: var(--ink); font-weight: 600; }
.acciones { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.contenido { padding: 34px; max-width: 1180px; width: 100%; margin: 0 auto; }
.seccion { display: none; }
.seccion.activa { display: block; animation: entra .22s ease; }
@keyframes entra { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

/* ============================================================
   TIPOGRAFÍA
   ============================================================ */
h1 {
  font-size: 30px; font-weight: 800; letter-spacing: -0.03em;
  line-height: 1.16; margin-bottom: 10px; color: var(--ink);
}
h2 {
  font-size: 20px; font-weight: 700; letter-spacing: -0.02em;
  margin: 38px 0 13px; color: var(--ink);
  padding-bottom: 8px; border-bottom: 1px solid var(--line);
}
h3 {
  font-size: 15.5px; font-weight: 650; margin: 26px 0 9px; color: var(--ink-2);
}
h4 {
  font-size: 13px; font-weight: 650; margin: 18px 0 6px; color: var(--ink-2);
  text-transform: uppercase; letter-spacing: 0.05em;
}

p, li { text-align: justify; hyphens: auto; -webkit-hyphens: auto; }
p { margin-bottom: 12px; max-width: var(--medida); }
.entradilla {
  font-size: 15.5px; color: var(--ink-3); line-height: 1.6;
  max-width: var(--medida); margin-bottom: 22px; font-weight: 350;
}
ul, ol { margin: 0 0 14px 20px; max-width: var(--medida); }
li { margin-bottom: 5px; }
strong { font-weight: 650; color: var(--ink); }
code, .mono {
  font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;
  font-size: 0.9em; background: var(--paper-3);
  padding: 1px 5px; border-radius: var(--radius); color: var(--brand-dark);
}
a { color: var(--brand); }

.centrado { text-align: center; }

/* ============================================================
   COMPONENTES
   ============================================================ */
.tarjeta {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 16px;
  box-shadow: var(--sh-1);
}
.tarjeta.suave { background: var(--paper-2); }
.tarjeta > h3:first-child, .tarjeta > h4:first-child { margin-top: 0; }

.rejilla { display: grid; gap: 16px; margin-bottom: 18px; }
.rejilla.c2 { grid-template-columns: repeat(2, 1fr); }
.rejilla.c3 { grid-template-columns: repeat(3, 1fr); }
.rejilla.c4 { grid-template-columns: repeat(4, 1fr); }

.kpi {
  background: var(--paper-2); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 15px 17px;
}
.kpi .valor {
  font-size: 27px; font-weight: 800; color: var(--brand);
  letter-spacing: -0.03em; line-height: 1.1;
}
.kpi .valor small { font-size: 14px; font-weight: 600; color: var(--ink-4); }
.kpi .rotulo {
  font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.07em;
  color: var(--ink-4); font-weight: 600; margin-top: 4px;
}
.kpi .nota { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; text-align: left; }

.aviso {
  border-left: 3px solid var(--brand);
  background: var(--info-bg);
  padding: 13px 16px; margin: 16px 0;
  border-radius: 0 var(--radius) var(--radius) 0;
  font-size: 13px;
}
.aviso.ok   { border-left-color: var(--good); background: var(--good-bg); }
.aviso.aten { border-left-color: var(--warn); background: var(--warn-bg); }
.aviso.mal  { border-left-color: var(--bad);  background: var(--bad-bg); }
.aviso .rotulo {

<p>La aplicación debe transformar la modelación financiera en un proceso guiado y verificable: enseñar los conceptos, permitir construir y revisar modelos de deuda y liquidez, analizar restricciones financieras, incorporar incertidumbre mediante Risk Simulator, comparar resultados con la realidad y conservar evidencia de decisiones y aprendizaje. [T-01][T-02][T-03][R-05]</p>
<div class="aviso"><p>Propósito del producto
Formar, evaluar y certificar a usuarios de Rehavid; guiarlos en la construcción, simulación, auditoría e interpretación de modelos financieros; y apoyar decisiones de deuda y liquidez sin reemplazar el juicio profesional ni las condiciones contractuales del financiador.</p></div>
<h3>1.1 Nombre y precisión terminológica</h3>
<p>Rehavid ha denominado el producto “app de modulación financiera”. La transcripción utiliza “modelación financiera”, que es el término técnico para representar mediante variables, relaciones y supuestos el comportamiento financiero de una empresa o proyecto. El nombre comercial puede conservar “modulación”; la documentación técnica debe usar “modelación” cuando se refiera al método.</p>
<h3>1.2 Problema que resuelve</h3>
<ul><li>La construcción de modelos de deuda puede quedar dispersa en hojas de cálculo, con supuestos poco trazables y sin control explícito de restricciones.</li>
<li>El cumplimiento de una cuota no garantiza por sí solo una posición de liquidez sostenible.</li>
<li>Las decisiones pueden basarse en un único escenario determinístico, ignorando incertidumbre y exposición a variables externas.</li>
<li>La práctica y la auditoría de errores no suelen quedar integradas al proceso de aprendizaje.</li>
<li>El conocimiento del modelo y su operación pueden depender excesivamente de una sola persona.</li>
</ul><h3>1.3 Resultado esperado</h3>

<h3>4.2 Desarrollo mínimo de cada unidad</h3>
<h4>U1. Modelo financiero y decisión</h4>
<p>Competencia: Comprender el modelo como representación de una empresa o proyecto; distinguir dato, supuesto, variable, regla, fórmula y salida; reconocer límites y entorno externo.</p>
<ul><li>Propósito, alcance y usuario de la decisión.</li>
<li>Diferencia entre hechos históricos, supuestos prospectivos y resultados calculados.</li>
<li>Dependencia entre variables y necesidad de coherencia de unidades y periodos.</li>
<li>Modelo como apoyo a una conversación estratégica, no como sustituto del contexto.</li>
<li>Riesgo de falsa precisión y obligación de revelar límites.</li>
</ul><p>Aplicación en la app: La app exige propósito, alcance, supuestos, responsable y advertencia de uso antes de calcular.</p>
<h4>U2. Modelación de deuda</h4>
<p>Competencia: Construir el comportamiento de la deuda por periodos: saldo, desembolso, interés, principal, servicio y cierre.</p>
<ul><li>Identificación de cada obligación o tramo de financiación.</li>
<li>Fecha de desembolso, tasa, periodicidad, plazo contractual y método de amortización como parámetros.</li>
<li>Separación de principal, interés y otros componentes contractuales.</li>
<li>Conciliación del saldo inicial, movimientos y saldo final.</li>
<li>Lectura del perfil de pagos y de la evolución de la exposición.</li>
</ul><p>Aplicación en la app: Calendario de deuda trazable y parametrizable.</p>
<h4>U3. Flujo disponible y cobertura</h4>
<p>Competencia: Definir el flujo disponible para servicio de deuda y calcular el DSCR con consistencia temporal.</p>
<ul><li>Definición corporativa de flujo de caja disponible para servicio de deuda (CFADS).</li>
<li>Servicio de deuda como principal más interés pagadero en el periodo [F-01].</li>
<li>DSCR como relación entre flujo disponible y servicio de deuda [F-01].</li>
<li>Consistencia de periodicidad y prevención de doble conteo.</li>
<li>Interpretación de cumplimiento, holgura, vulnerabilidad y ruptura.</li>
</ul><p>Aplicación en la app: Indicador, semáforo y explicación por periodo.</p>
<h4>U4. Restricciones y capacidad</h4>
<p>Competencia: Interpretar covenants y determinar el máximo nivel de deuda compatible con las restricciones activas.</p>
<ul><li>Covenant financiero como condición contractual o interna verificable.</li>
<li>Umbral, frecuencia, periodo de cura y consecuencia como campos configurables.</li>
<li>Capacidad de deuda como máximo monto factible bajo todas las restricciones activas.</li>
<li>Pruebas de estrés ante condiciones más exigentes.</li>
<li>Separación entre capacidad matemática y decisión prudencial.</li>
</ul><p>Aplicación en la app: Motor de factibilidad y búsqueda de capacidad.</p>
<h4>U5. Liquidez y alerta temprana</h4>
<p>Competencia: Evaluar caja inicial, entradas, salidas, servicio de deuda, caja final y mínimo de liquidez.</p>
<ul><li>Caja inicial, flujos de operación, inversión, financiación y caja final.</li>
<li>Política de caja mínima definida por Rehavid o por el usuario autorizado.</li>
<li>Periodos de déficit, necesidades de fondeo y alertas antes de la crisis.</li>
<li>Diferencia entre indicador de cobertura y disponibilidad real de caja.</li>
<li>Trazabilidad de la causa principal de cada brecha.</li>
</ul><p>Aplicación en la app: Alertas por periodos críticos y causas de la brecha.</p>
<h4>U6. Incertidumbre y Risk Simulator</h4>
<p>Competencia: Distinguir modelo determinístico y probabilístico; configurar supuestos, distribuciones, correlaciones, pronósticos e iteraciones.</p>
<ul><li>Variable incierta, distribución, parámetros, correlación y variable de salida.</li>
<li>Monte Carlo como muestreo repetido del modelo a partir de distribuciones de entrada [MC-01].</li>
<li>Definición de pronósticos, iteraciones, semilla cuando esté disponible y control de convergencia.</li>
<li>Percentiles, probabilidad de ruptura, dispersión y sensibilidad.</li>
<li>Limitaciones por calidad del dato, selección de distribución y correlaciones.</li>
</ul><p>Aplicación en la app: Asistente de preparación, exportación e importación de simulación.</p>
<h4>U7. Auditoría, backtesting y práctica</h4>
<p>Competencia: Revisar errores, comparar proyección con realidad, documentar desviaciones y practicar con información pública autorizada.</p>
<ul><li>Revisión estructural y lógica del modelo.</li>
<li>Inventario de errores, causa, impacto y acción correctiva.</li>
<li>Comparación retrospectiva entre supuestos, proyección y resultados observados.</li>
<li>Revisión por pares en modelos críticos [MQ-01].</li>
<li>Práctica deliberada y repetición con modelos de empresas o proyectos cuya información sea lícita y verificable.</li>
</ul><p>Aplicación en la app: Bitácora, revisión por pares y tablero de error.</p>
<h4>U8. Estrategia, criterio y riesgo calculado</h4>
<p>Competencia: Discutir resultados, contrastar disciplinas, leer críticamente y experimentar con límites definidos.</p>
<ul><li>Discusión de supuestos, contraargumentos y alternativas.</li>
<li>Lectura interdisciplinaria para ampliar la capacidad crítica.</li>
<li>Riesgo calculado como experimento con propósito, límite y aprendizaje esperado.</li>
<li>Reconocimiento de variables externas no controlables.</li>
<li>Registro de la decisión, responsable, incertidumbre residual y condición de revisión.</li>
</ul><p>Aplicación en la app: Comentarios, justificación, decisión, responsable y aprendizaje registrado.</p>

d>La modelación es técnica y también social.</td></tr><tr><td>Riesgo calculado</td><td>¿Qué distingue una prueba responsable de una apuesta sin criterio?</td><td>Un objetivo, límites, evidencia, monitoreo y aprendizaje esperado.</td><td>El riesgo debe estar diseñado para aprender y proteger la decisión.</td></tr></tbody></table></div>
<h2>5. Evaluación adaptativa, aprobación y certificado</h2>
<div class="aviso"><p>Regla de aprobación
El participante aprueba cuando obtiene un resultado igual o superior al 80 % en una evaluación certificable. Las actividades formativas pueden repetirse hasta alcanzar dominio, pero la exigencia del 80 % debe conservar significado y trazabilidad.</p></div>
<h3>5.1 Diseño de la evaluación</h3>
<div class="tabla-caja"><table><caption>Tabla 18</caption><thead><tr><th>Etapa</th><th>Comportamiento de la app</th><th>Efecto en el resultado</th></tr></thead><tbody><tr><td>Práctica formativa</td><td>Pregunta; respuesta; corrección inmediata; explicación; repregunta diferente sobre el mismo objetivo.</td><td>No certifica. Registra dominio y errores.</td></tr><tr><td>Evaluación certificable</td><td>Banco nuevo, selección aleatoria y balanceada por unidades. Cada primera respuesta cuenta para el resultado del intento.</td><td>Genera el porcentaje del intento.</td></tr><tr><td>Error en evaluación</td><td>La app corrige de inmediato, explica y presenta una pregunta equivalente distinta. La respuesta original permanece incorrecta para ese intento.</td><td>Preserva la validez del 80 % y garantiza aprendizaje.</td></tr><tr><td>Cierre del intento</td><td>La app muestra resultado, unidades dominadas y temas por reforzar.</td><td>Aprueba si el resultado es ≥ 80 %.</td></tr><tr><td>Reintento</td><td>Se habilita después de la ruta de refuerzo; usa ítems nuevos o variantes equivalentes.</td><td>Genera un nuevo resultado y conserva los anteriores.</td></tr></tbody></table></div>
<h3>5.2 Lógica de corrección y repregunta</h3>
<p>1. Registrar la respuesta, el tiempo, la versión de la pregunta y el objetivo de aprendizaje.</p>
<p>2. Indicar inmediatamente que la respuesta es incorrecta, sin mensajes ambiguos.</p>
<p>3. Mostrar la respuesta correcta y explicar el fundamento técnico, la causa del error y el riesgo de aplicar el criterio equivocado.</p>
<p>4. Vincular el fragmento formativo pertinente.</p>
<p>5. Seleccionar otra pregunta del mismo objetivo, con redacción, contexto, orden y distractores diferentes.</p>
<p>6. Evitar que la repregunta dependa de memorizar la opción mostrada.</p>
<p>7. Cerrar el objetivo como dominado cuando el participante responda correctamente una variante equivalente.</p>
<p>8. Conservar por separado el resultado del intento certificable y el dominio alcanzado después del refuerzo.</p>
<h3>5.3 Modelo de datos de la pregunta</h3>
<div class="tabla-caja"><table><caption>Tabla 19</caption><thead><tr><th>Campo</th><th>Uso</th></tr></thead><tbody><tr><td>question_id / version</td><td>Identificación y control de cambios.</td></tr><tr><td>learning_objective_id</td><td>Concepto que se evalúa.</td></tr><tr><td>equivalence_group</td><td>Conjunto de preguntas que prueban el mismo objetivo de manera diferente.</td></tr><tr><td>difficulty / format</td><td>Balance del examen y selección adaptativa.</td></tr><tr><td>stem / options / answer</td><td>Enunciado, opciones y clave.</td></tr><tr><td>feedback_correct / feedback_incorrect</td><td>Retroalimentación específica.</td></tr><tr><td>risk_of_error</td><td>Consecuencia de interpretar o aplicar mal el concepto.</td></tr><tr><td>source_reference</td><td>Origen en transcripción, requisito o fuente validada.</td></tr><tr><td>status / valid_from</td><td>Vigencia y publicación.</td></tr></tbody></table></div>
<h3>5.4 Reglas de puntuación</h3>
<div class="tabla-caja"><table><caption>Tabla 20</caption><thead><tr><th>Resultado del intento</th><th>respuestas correctas en primera respuesta ÷ preguntas válidas × 100</th></tr></thead><tbody></tbody></table></div>
<div class="tabla-caja"><table><caption>Tabla 21</caption><thead><tr><th>Criterio de aprobación</th><th>resultado del intento ≥ 80 %</th></tr></thead><tbody></tbody></table></div>
<div class="tabla-caja"><table><caption>Tabla 22</caption><thead><tr><th>Dominio posterior</th><th>objetivos resueltos correctamente después del refuerzo ÷ objetivos evaluados × 100</th></tr></thead><tbody></tbody></table></div>
<p>El certificado debe mostrar el resultado del intento aprobatorio. El historial puede mostrar, además, resultado inicial, dominio posterior, intentos y temas reforzados. No se recomienda recalcular retroactivamente un intento cuando el participante acierta una repregunta, porque volvería irrelevante el umbral de aprobación.</p>
<h3>5.5 Certificado automático</h3>
<div class="tabla-caja"><table><caption>Tabla 23</caption><thead><tr><th>Grupo</th><th>Contenido del certificado</th></tr></thead><tbody><tr><td>Identidad</td><td>Nombre completo del participante.</td></tr><tr><td>Vinculación</td><td>Cargo registrado y validado en Rehavid.</td></tr><tr><td>Formación</td><td>Nombre y versión de la ruta aprobada.</td></tr><tr><td>Resultado</td><td>Porcentaje del intento aprobatorio y estado “Aprobado”.</td></tr><tr><td>Trazabilidad</td><td>Fecha y hora, número de intento, código único y versión del contenido.</td></tr><tr><td>Verificación</td><td>Código QR o URL interna de consulta; estado vigente, revocado o reemplazado.</td></tr><tr><td>Emisor</td><td>Rehavid S.A.S. y responsable autorizado, si la organización lo define.</td></tr><tr><td>Alcance</td><td>Certificación interna de formación; no certificación del fabricante de Risk Simulator.</td></tr></tbody></table></div>
<div class="aviso"><p>Texto funcional del certificado
“Rehavid S.A.S. certifica que [nombre completo], quien se desempeña como [cargo], aprobó la ruta de formación en modelación financiera y uso aplicado de Risk Simulator, con un resultado de [resultado] %, conforme al criterio mínimo de aprobación del 80 %.”</p></div>
<h3>5.6 Control de expedición</h3>
<ul><li>No generar certificado cuando el resultado sea inferior al 80 %.</li>
<li>No permitir edición manual del resultado o de la fecha después de emitido.</li>
<li>Corregir datos de identidad mediante revocación y reexpedición, conservando trazabilidad.</li>
<li>No usar una imagen de firma como equivalente automático de firma electrónica.</li>
<li>Aplicar el régimen de protección de datos al nombre, cargo, resultados e historial. [COL-02][COL-03]</li>
<li>Cuando se requiera autenticidad jurídica reforzada, evaluar firma electrónica confiable conforme a la Ley 527 de 1999 y su reglamentación. [COL-05]</li>
</ul><h2>6. Módulo 2: manual de operación</h2>
<p>El manual define cómo debe operar la aplicación desde cuatro perspectivas: participante, modelador, revisor y administrador. Los roles son una necesidad técnica de operación; no se atribuyen al segmento transcrito.</p>
<h3>6.1 Perfiles y permisos</h3>
<div class="tabla-caja"><table><caption>Tabla 25</caption><thead><tr><th>Rol</th><th>Permisos principales</th></tr></thead><tbody><tr><td>Participante / modelador</td><td>Cursar formación, presentar evaluación, crear modelos, ejecutar escenarios, exportar/importar simulaciones y consultar sus resultados.</td></tr><tr><td>Revisor</td><td>Consultar modelos asignados, revisar supuestos, fórmulas, evidencias y emitir observaciones o aprobación.</td></tr><tr><td>Gestor de contenido</td><td>Crear unidades, preguntas, equivalencias, retroalimentaciones, versiones y reglas de publicación.</td></tr><tr><td>Administrador</td><td>Gestionar usuarios, cargos, permisos, parámetros, plantillas, integraciones y certificados.</td></tr><tr><td>Auditor</td><td>Consultar historial, cambios, aprobaciones, certificados, importaciones y eventos, sin modificar el cálculo.</td></tr></tbody></table></div>
<h3>6.2 Ruta del participante</h3>
<p>1. Ingresar con una cuenta autorizada.</p>
<p>2. Confirmar nombre completo y cargo en Rehavid; reportar cualquier inconsistencia antes del examen.</p>
<p>3. Revisar la ruta y completar las unidades obligatorias.</p>
<p>4. Responder actividades formativas; ante error, leer la explicación y resolver la repregunta diferente.</p>
<p>5. Completar el laboratorio de Risk Simulator o la evidencia definida para esa unidad.</p>
<p>6. Presentar la evaluación certificable.</p>
<p>7. Consultar el resultado y el plan de refuerzo, si aplica.</p>
<p>8. Descargar o verificar el certificado cuando el resultado sea igual o superior al 80 %.</p>
<h3>6.3 Ruta del modelador</h3>
<p>1. Crear un proyecto y declarar su propósito, responsable, horizonte, periodicidad, moneda y alcance.</p>
<p>2. Registrar fuentes, supuestos y escenarios; separar histórico, presupuesto y proyección.</p>
<p>3. Configurar una o varias obligaciones de deuda.</p>
<p>4. Definir el mapeo del flujo disponible para servicio de deuda.</p>
<p>5. Registrar covenants y condiciones de liquidez con su fuente contractual o política.</p>
<p>6. Ejecutar validaciones de integridad y corregir inconsistencias.</p>
<p>7. Calcular calendario, servicio de deuda, cobertura, caja y capacidad máxima factible.</p>
<p>8. Comparar escenarios determinísticos.</p>
<p>9. Preparar y exportar el modelo para Risk Simulator.</p>
<p>10. Ejecutar la simulación en Excel, exportar los resultados e importarlos a la app.</p>
<p>11. Interpretar dispersión, sensibilidad y probabilidad de ruptura.</p>
<p>12. Solicitar revisión y cerrar la versión aprobada.</p>
<p>13. Cuando existan datos reales posteriores, ejecutar backtesting y registrar aprendizaje.</p>
<h3>6.4 Ruta del revisor</h3>
<p>1. Verificar propósito, alcance, fuentes y versión.</p>
<p>2. Comprobar consistencia de periodos, monedas y unidades.</p>
<p>3. Revisar la conciliación de saldos de deuda.</p>
<p>4. Validar el mapeo del CFADS y del servicio de deuda.</p>
<p>5. Confirmar que el covenant corresponde a una fuente identificada.</p>
<p>6. Revisar alertas de liquidez y supuestos críticos.</p>
<p>7. Evaluar la configuración e interpretación de la simulación.</p>
<p>8. Registrar hallazgos, severidad, responsable y acción.</p>
<p>9. Aprobar, devolver o rechazar la versión sin sobrescribir el historial.</p>
<h3>6.5 Operaciones críticas y mensajes de error</h3>
<div class="tabla-caja"><table><caption>Tabla 26</caption><thead><tr><th>Situación</th><th>Respuesta del sistema</th></tr></thead><tbody><tr><td>Periodo inconsistente</td><td>La app bloquea el cálculo y señala las variables con periodicidad incompatible.</td></tr><tr><td>Servicio de deuda igual a cero</td><td>El DSCR se muestra como “No calculable”; no como infinito.</td></tr><tr><td>Covenant sin fuente</td><td>La app permite guardar borrador, pero no aprobar ni calcular capacidad máxima definitiva.</td></tr><tr><td>Saldo de deuda no concilia</td><td>La app muestra apertura, movimientos y cierre que causan la diferencia.</td></tr><tr><td>Caja por debajo del mínimo</td><td>La app identifica periodo, magnitud y principales impulsores.</td></tr><tr><td>Archivo de simulación no corresponde</td><td>La importación se rechaza si no coincide modelo, versión o plantilla.</td></tr><tr><td>Distribución sin justificación</td><td>La simulación puede quedar en borrador, pero no publicarse como análisis aprobado.</td></tr><tr><td>Certificado con datos erróneos</td><td>Se revoca y reexpide; no se edita el documento emitido.</td></tr></tbody></table></div>
<h2>7. Módulo 3: especificación funcional de la app</h2>
<h3>7.1 Objetivo general</h3>
<p>Diseñar una aplicación capaz de formar y certificar usuarios, administrar modelos financieros de deuda y liquidez, evaluar restricciones, interoperar con Risk Simulator, auditar el modelo y conservar la trazabilidad necesaria para revisar decisiones y mejorar proyecciones futuras.</p>
<h3>7.2 Componentes funcionales</h3>

<h3>7.3 Flujo de estados del modelo</h3>

<h2>8. Motor financiero, reglas y fórmulas</h2>
<div class="aviso"><p>Criterio de diseño financiero
La app debe mostrar qué se calculó, con qué datos, bajo qué periodicidad y con qué versión. Los valores contractuales no pueden ser sustituidos por umbrales genéricos.</p></div>
<h3>8.1 Calendario de deuda</h3>
<div class="tabla-caja"><table><caption>Tabla 31</caption><thead><tr><th>Saldo final</th><th>saldo inicial + desembolsos + capitalizaciones − pago de principal ± ajustes autorizados</th></tr></thead><tbody></tbody></table></div>
<p>La naturaleza de cada ajuste debe estar configurada y documentada.</p>
<div class="tabla-caja"><table><caption>Tabla 32</caption><thead><tr><th>Servicio de deuda</th><th>principal pagadero + interés pagadero</th></tr></thead><tbody></tbody></table></div>
<p>El Banco Mundial utiliza principal más interés como servicio de deuda para el DSCR. Otros componentes se muestran por separado, salvo definición contractual expresa. [F-01]</p>
<p>La tasa, base de días, periodo de gracia, método de amortización, pagos extraordinarios y capitalización de intereses son parámetros de cada obligación. La transcripción no define un método único; la app debe evitar fijarlo por defecto sin confirmación.</p>
<h3>8.2 Flujo disponible y DSCR</h3>
<div class="tabla-caja"><table><caption>Tabla 33</caption><thead><tr><th>CFADS</th><th>ingresos de caja elegibles − egresos operativos elegibles − inversión elegible ± ajustes definidos</th></tr></thead><tbody></tbody></table></div>
<p>El mapeo exacto debe aprobarse por organización y proyecto para evitar mezclar utilidad contable, EBITDA o caja libre sin definición.</p>
<div class="tabla-caja"><table><caption>Tabla 34</caption><thead><tr><th>DSCR por periodo</th><th>CFADS del periodo ÷ servicio de deuda del mismo periodo</th></tr></thead><tbody></tbody></table></div>
<p>El Banco Mundial define el indicador como CFADS sobre servicio de deuda y explica que un valor inferior a 1,0 implica que los flujos propios no cubren el servicio del periodo. El covenant operativo de la app no debe asumir 1,0 ni ningún otro nivel: se toma del contrato o política configurada. [F-01]</p>
<h3>8.3 Capacidad máxima de deuda</h3>
<div class="tabla-caja"><table><caption>Tabla 35</caption><thead><tr><th>Problema de capacidad</th><th>maximizar monto de deuda sujeto a: DSCRₜ ≥ covenantₜ, caja finalₜ ≥ caja mínimaₜ y demás restricciones activas</th></tr></thead><tbody></tbody></table></div>
<p>El cálculo puede resolverse mediante búsqueda iterativa, optimización o Goal Seek controlado. La salida debe indicar el monto factible, la restricción vinculante, la holgura y los periodos críticos. Una condición contractual más exigente no debe ampliar artificialmente la capacidad.</p>
<h3>8.4 Liquidez</h3>
<div class="tabla-caja"><table><caption>Tabla 36</caption><thead><tr><th>Caja final</th><th>caja inicial + entradas de caja − salidas de caja − servicio de deuda ± financiación del periodo</th></tr></thead><tbody></tbody></table></div>
<div class="tabla-caja"><table><caption>Tabla 37</caption><thead><tr><th>Brecha de liquidez</th><th>caja final − caja mínima configurada</th></tr></thead><tbody></tbody></table></div>
<p>La caja mínima es una política o condición del caso, no un valor universal. La app debe permitir reglas por periodo, moneda y escenario. Un escenario con brecha negativa se presenta como incumplimiento de liquidez aunque el DSCR cumpla.</p>
<h3>8.5 Simulación y riesgo</h3>
<div class="tabla-caja"><table><caption>Tabla 38</caption><thead><tr><th>Probabilidad de ruptura</th><th>corridas válidas con al menos una ruptura ÷ corridas válidas totales × 100</th></tr></thead><tbody></tbody></table></div>
<div class="tabla-caja"><table><caption>Tabla 39</caption><thead><tr><th>Percentil</th><th>valor de la distribución de salida correspondiente a la probabilidad acumulada seleccionada</th></tr></thead><tbody></tbody></table></div>
<div class="tabla-caja"><table><caption>Tabla 40</caption><thead><tr><th>Sensibilidad</th><th>medida de asociación entre variaciones de entradas y variación de la salida, según el método exportado por la herramienta</th></tr></thead><tbody></tbody></table></div>
<p>La app no debe convertir un percentil en “resultado esperado” sin explicar qué representa. La simulación requiere variables, distribuciones e iteraciones; Risk Simulator declara funciones de simulación, pronóstico, análisis estadístico y optimización sobre Excel. [RS-01][MC-01]</p>
<h3>8.6 Backtesting</h3>
<div class="tabla-caja"><table><caption>Tabla 41</caption><thead><tr><th>Desviación absoluta</th><th>valor observado − valor proyectado</th></tr></thead><tbody></tbody></table></div>
<div class="tabla-caja"><table><caption>Tabla 42</caption><thead><tr><th>Desviación relativa</th><th>(valor observado − valor proyectado) ÷ base válida de comparación</th></tr></thead><tbody></tbody></table></div>
<p>Cuando la base sea cero, negativa o no comparable, la app debe mostrar “No aplicable” y evitar porcentajes engañosos. El backtesting debe conservar la proyección original; nunca reescribirla con información posterior.</p>
<h3>8.7 Reglas de negocio financieras</h3>

<h2>9. Uso e interoperabilidad con Risk Simulator</h2>
<p>Risk Simulator es un complemento de Excel ofrecido por Real Options Valuation para simulación, pronóstico, análisis estadístico y optimización. Su incorporación proviene de una instrucción directa de Rehavid y se conecta con la orientación de la transcripción sobre riesgo calculado y entorno externo. [R-05][RS-01][T-03]</p>
<h3>9.1 Contenido formativo obligatorio</h3>
<ul><li>Verificar el modelo determinístico antes de simular.</li>
<li>Seleccionar variables inciertas y justificar por qué son inciertas.</li>
<li>Elegir distribuciones y parámetros a partir de evidencia, no por conveniencia.</li>
<li>Definir correlaciones cuando las variables no sean independientes.</li>
<li>Identificar celdas de pronóstico y métricas de decisión.</li>
<li>Configurar número de iteraciones y criterios de estabilidad.</li>
<li>Ejecutar y revisar errores de cálculo.</li>
<li>Interpretar distribución, percentiles, probabilidad de ruptura y sensibilidad.</li>
<li>Documentar versión, archivo, usuario, fecha, supuestos y limitaciones.</li>
<li>Diferenciar resultado importado de Risk Simulator y cálculo nativo de la app.</li>
</ul><h3>9.2 Flujo recomendado para el producto mínimo viable</h3>
<p>1. La app valida el modelo determinístico y genera una especificación de simulación.</p>
<p>2. La app exporta una plantilla de Excel con identificadores del modelo, versión, variables y salidas.</p>
<p>3. El usuario abre el archivo en Excel y configura o confirma la simulación en Risk Simulator.</p>
<p>4. Risk Simulator ejecuta la simulación.</p>
<p>5. El usuario exporta resultados mediante una plantilla estructurada controlada por Rehavid.</p>
<p>6. La app valida la identidad del modelo, importa resultados y registra la ejecución como “externa importada”.</p>
<p>7. La app muestra resultados, advertencias y trazabilidad sin afirmar que ejecutó internamente el motor de Risk Simulator.</p>
<h3>9.3 Integración directa: condición para una fase posterior</h3>
<p>El fabricante informa que dispone de opciones SDK/OEM para integrar sus capacidades en software propietario. La integración directa solo debe incluirse después de validar licencia, alcance técnico, formatos, seguridad, soporte y autorización contractual. [RS-02]</p>
<div class="aviso"><p>Decisión de arquitectura
MVP: interoperabilidad asistida por archivos estructurados. Fase posterior: integración directa únicamente mediante mecanismo autorizado por el fabricante. Esta separación evita prometer una conexión no confirmada.</p></div>

1.1 Nombre y precisión terminológica
Rehavid ha denominado el producto “app de modulación financiera”. La transcripción utiliza “modelación financiera”, que es el término técnico para representar mediante variables, relaciones y supuestos el comportamiento financiero de una empresa o proyecto. El nombre comercial puede conservar “modulación”; la documentación técnica debe usar “modelación” cuando se refiera al método.
1.2 Problema que resuelve
La construcción de modelos de deuda puede quedar dispersa en hojas de cálculo, con supuestos poco trazables y sin control explícito de restricciones.
El cumplimiento de una cuota no garantiza por sí solo una posición de liquidez sostenible.
Las decisiones pueden basarse en un único escenario determinístico, ignorando incertidumbre y exposición a variables externas.
La práctica y la auditoría de errores no suelen quedar integradas al proceso de aprendizaje.
El conocimiento del modelo y su operación pueden depender excesivamente de una sola persona.

El producto se organiza alrededor de un ciclo único: aprender → modelar → validar → simular → interpretar → revisar → decidir → comparar con la realidad → mejorar. Ese ciclo refleja la combinación de deuda, liquidez, incertidumbre, práctica, auditoría y discusión estratégica presente en la transcripción.
3.1 Principios rectores del producto
Principio | Implicación
Trazabilidad antes que sofisticación | Un resultado sin fuente, versión, responsable o fórmula visible no es confiable.
Liquidez además de solvencia | Pagar una obligación no basta si la caja remanente vulnera el mínimo definido.
Restricciones parametrizables | El covenant proviene del contrato o política; la app no debe inventar el umbral.
Incertidumbre explícita | La simulación complementa, no reemplaza, el escenario determinístico.
Corrección que enseña | El error en la formación debe producir explicación inmediata y una nueva oportunidad equivalente.
Revisión independiente | La auditoría y la discusión reducen la dependencia del modelador original.
Juicio humano | La app apoya la decisión; no la presenta como verdad automática.
Aprendizaje continuo | Las desviaciones entre proyección y realidad alimentan mejores supuestos futuros.
3.2 Arquitectura funcional de alto nivel
Capa | Módulos
Aprendizaje | Contenido básico; laboratorio de Risk Simulator; evaluación adaptativa; certificado.
Modelación | Proyectos; supuestos; escenarios; flujo de caja; deuda; cobertura; liquidez.
Riesgo | Preparación de simulación; importación; distribución de resultados; sensibilidad; probabilidad de ruptura.
Calidad | Validaciones; auditoría de fórmulas; revisión; backtesting; bitácora de errores.
Decisión | Tableros; comparación; comentarios; aprobaciones; reportes.
Gobierno | Usuarios; permisos; versiones; fuentes; seguridad; trazabilidad; administración de contenido.
4. Módulo 1: formación en conceptos básicos
Objetivo del módulo
Lograr que el participante comprenda, construya, cuestione e interprete un modelo financiero de deuda y liquidez, y que pueda utilizar Risk Simulator con criterio técnico. La formación cubre todos los temas identificables en la transcripción, sin convertirla en un simple glosario.
4.1 Ruta de aprendizaje
Unidad | Competencia | Traducción a la app
U1. Modelo financiero y decisión | Comprender el modelo como representación de una empresa o proyecto; distinguir dato, supuesto, variable, regla, fórmula y salida; reconocer límites y entorno externo. | La app exige propósito, alcance, supuestos, responsable y advertencia de uso antes de calcular.
U2. Modelación de deuda | Construir el comportamiento de la deuda por periodos: saldo, desembolso, interés, principal, servicio y cierre. | Calendario de deuda trazable y parametrizable.
U3. Flujo disponible y cobertura | Definir el flujo disponible para servicio de deuda y calcular el DSCR con consistencia temporal. | Indicador, semáforo y explicación por periodo.
U4. Restricciones y capacidad | Interpretar covenants y determinar el máximo nivel de deuda compatible con las restricciones activas. | Motor de factibilidad y búsqueda de capacidad.
U5. Liquidez y alerta temprana | Evaluar caja inicial, entradas, salidas, servicio de deuda, caja final y mínimo de liquidez. | Alertas por periodos críticos y causas de la brecha.
U6. Incertidumbre y Risk Simulator | Distinguir modelo determinístico y probabilístico; configurar supuestos, distribuciones, correlaciones, pronósticos e iteraciones. | Asistente de preparación, exportación e importación de simulación.
U7. Auditoría, backtesting y práctica | Revisar errores, comparar proyección con realidad, documentar desviaciones y practicar con información pública autorizada. | Bitácora, revisión por pares y tablero de error.
U8. Estrategia, criterio y riesgo calculado | Discutir resultados, contrastar disciplinas, leer críticamente y experimentar con límites definidos. | Comentarios, justificación, decisión, responsable y aprendizaje registrado.
4.2 Desarrollo mínimo de cada unidad
U1. Modelo financiero y decisión
Competencia: Comprender el modelo como representación de una empresa o proyecto; distinguir dato, supuesto, variable, regla, fórmula y salida; reconocer límites y entorno externo.
Propósito, alcance y usuario de la decisión.
Diferencia entre hechos históricos, supuestos prospectivos y resultados calculados.
Dependencia entre variables y necesidad de coherencia de unidades y periodos.
Modelo como apoyo a una conversación estratégica, no como sustituto del contexto.
Riesgo de falsa precisión y obligación de revelar límites.
Aplicación en la app: La app exige propósito, alcance, supuestos, responsable y advertencia de uso antes de calcular.
U2. Modelación de deuda
Competencia: Construir el comportamiento de la deuda por periodos: saldo, desembolso, interés, principal, servicio y cierre.
Identificación de cada obligación o tramo de financiación.
Fecha de desembolso, tasa, periodicidad, plazo contractual y método de amortización como parámetros.
Separación de principal, interés y otros componentes contractuales.
Conciliación del saldo inicial, movimientos y saldo final.
Lectura del perfil de pagos y de la evolución de la exposición.
Aplicación en la app: Calendario de deuda trazable y parametrizable.
U3. Flujo disponible y cobertura
Competencia: Definir el flujo disponible para servicio de deuda y calcular el DSCR con consistencia temporal.
Definición corporativa de flujo de caja disponible para servicio de deuda (CFADS).
Servicio de deuda como principal más interés pagadero en el periodo [F-01].
DSCR como relación entre flujo disponible y servicio de deuda [F-01].
Consistencia de periodicidad y prevención de doble conteo.
Interpretación de cumplimiento, holgura, vulnerabilidad y ruptura.
Aplicación en la app: Indicador, semáforo y explicación por periodo.
U4. Restricciones y capacidad
Competencia: Interpretar covenants y determinar el máximo nivel de deuda compatible con las restricciones activas.
Covenant financiero como condición contractual o interna verificable.
Umbral, frecuencia, periodo de cura y consecuencia como campos configurables.
Capacidad de deuda como máximo monto factible bajo todas las restricciones activas.
Pruebas de estrés ante condiciones más exigentes.
Separación entre capacidad matemática y decisión prudencial.
Aplicación en la app: Motor de factibilidad y búsqueda de capacidad.
U5. Liquidez y alerta temprana
Competencia: Evaluar caja inicial, entradas, salidas, servicio de deuda, caja final y mínimo de liquidez.
Caja inicial, flujos de operación, inversión, financiación y caja final.
Política de caja mínima definida por Rehavid o por el usuario autorizado.
Periodos de déficit, necesidades de fondeo y alertas antes de la crisis.
Diferencia entre indicador de cobertura y disponibilidad real de caja.
Trazabilidad de la causa principal de cada brecha.
Aplicación en la app: Alertas por periodos críticos y causas de la brecha.
U6. Incertidumbre y Risk Simulator
Competencia: Distinguir modelo determinístico y probabilístico; configurar supuestos, distribuciones, correlaciones, pronósticos e iteraciones.
Variable incierta, distribución, parámetros, correlación y variable de salida.
Monte Carlo como muestreo repetido del modelo a partir de distribuciones de entrada [MC-01].
Definición de pronósticos, iteraciones, semilla cuando esté disponible y control de convergencia.
Percentiles, probabilidad de ruptura, dispersión y sensibilidad.
Limitaciones por calidad del dato, selección de distribución y correlaciones.
Aplicación en la app: Asistente de preparación, exportación e importación de simulación.
U7. Auditoría, backtesting y práctica
Competencia: Revisar errores, comparar proyección con realidad, documentar desviaciones y practicar con información pública autorizada.
Revisión estructural y lógica del modelo.
Inventario de errores, causa, impacto y acción correctiva.
Comparación retrospectiva entre supuestos, proyección y resultados observados.
Revisión por pares en modelos críticos [MQ-01].
Práctica deliberada y repetición con modelos de empresas o proyectos cuya información sea lícita y verificable.
Aplicación en la app: Bitácora, revisión por pares y tablero de error.
U8. Estrategia, criterio y riesgo calculado
Competencia: Discutir resultados, contrastar disciplinas, leer críticamente y experimentar con límites definidos.
Discusión de supuestos, contraargumentos y alternativas.
Lectura interdisciplinaria para ampliar la capacidad crítica.
Riesgo calculado como experimento con propósito, límite y aprendizaje esperado.
Reconocimiento de variables externas no controlables.
Registro de la decisión, responsable, incertidumbre residual y condición de revisión.
Aplicación en la app: Comentarios, justificación, decisión, responsable y aprendizaje registrado.
4.3 Referentes y cursos
El segmento transcrito no nombra autores, obras, instituciones ni cursos específicos. Para respetar la fuente, el módulo no atribuye contenidos a nombres inexistentes. La base de validación se construye con referentes institucionales: Banco Mundial para cobertura de deuda, NIST para simulación Monte Carlo, documentación oficial de Risk Simulator para uso del software, ICAEW para control de hojas de cálculo, OWASP para seguridad y fuentes oficiales colombianas para datos, contabilidad y mensajes electrónicos. [F-01][MC-01][RS-01][MQ-01][SEC-01][COL-01][COL-02]
Regla para futuras transcripciones
Cuando aparezca un autor, curso, libro o institución, debe registrarse el nombre exacto, el concepto atribuido, la fuente verificable y la parte de la formación donde se aplica. Una mención incompleta queda “pendiente de confirmación”; no se completa por intuición.
4.4 Actividades formativas
Actividad | Producto de aprendizaje
Mapa del modelo | Clasificar entradas, supuestos, cálculos, restricciones y salidas.
Construcción guiada | Completar una estructura neutra de deuda y flujo sin datos de los casos de la transcripción.
Diagnóstico de error | Identificar una inconsistencia de periodo, saldo o fórmula y explicar su efecto.
Discusión de covenant | Analizar por qué una alternativa puede pagar la cuota y aun así no ser aceptable.
Laboratorio Risk Simulator | Definir supuestos, salidas y una simulación sobre un modelo didáctico.
Lectura de sensibilidad | Explicar qué variables dominan la dispersión y qué decisión requiere revisión.
Backtesting | Comparar una proyección archivada con el resultado observado y ajustar el razonamiento.
Comité de decisión | Defender y cuestionar un escenario con evidencia, límites y riesgo residual.
4.5 Preguntas arquetipo para el banco de evaluación
Tema | Pregunta base | Respuesta correcta | Retroalimentación inmediata
CFADS | ¿Qué representa el numerador del indicador de cobertura del servicio de deuda? | El flujo de caja disponible para atender el servicio de deuda. | Confundir utilidad con caja puede sobreestimar la capacidad real.
Liquidez | Un escenario cumple el covenant, pero vulnera la caja mínima. ¿Debe quedar como factible? | No. Debe marcarse como no factible o condicionado según la política configurada. | Cobertura y liquidez son restricciones distintas.
Covenant | ¿Qué efecto esperado tiene endurecer una restricción de cobertura? | Reduce o mantiene, pero no aumenta, el conjunto de montos factibles bajo las demás condiciones constantes. | La restricción más exigente reduce el espacio de solución.
Monte Carlo | ¿Cuál es el propósito central de definir distribuciones en una simulación? | Representar la incertidumbre de las entradas y propagarla a las salidas. | No se trata de reemplazar datos por azar, sino de modelar incertidumbre justificable.
Backtesting | ¿Qué permite la comparación entre proyección y resultado observado? | Identificar desviaciones, sesgos y oportunidades de mejora en supuestos y fórmulas. | El modelo aprende cuando el error se registra y analiza.
Auditoría | ¿Por qué es insuficiente revisar únicamente el resultado final? | Porque un resultado plausible puede provenir de una fórmula, vínculo o supuesto incorrecto. | La revisión debe cubrir estructura, lógica, datos y salidas.
Estrategia | ¿Por qué debe discutirse un modelo con otras personas? | Porque los supuestos incorporan juicio y el entorno puede requerir perspectivas distintas. | La modelación es técnica y también social.
Riesgo calculado | ¿Qué distingue una prueba responsable de una apuesta sin criterio? | Un objetivo, límites, evidencia, monitoreo y aprendizaje esperado. | El riesgo debe estar diseñado para aprender y proteger la decisión.
5. Evaluación adaptativa, aprobación y certificado
Regla de aprobación
El participante aprueba cuando obtiene un resultado igual o superior al 80 % en una evaluación certificable. Las actividades formativas pueden repetirse hasta alcanzar dominio, pero la exigencia del 80 % debe conservar significado y trazabilidad.
5.1 Diseño de la evaluación
Etapa | Comportamiento de la app | Efecto en el resultado
Práctica formativa | Pregunta; respuesta; corrección inmediata; explicación; repregunta diferente sobre el mismo objetivo. | No certifica. Registra dominio y errores.
Evaluación certificable | Banco nuevo, selección aleatoria y balanceada por unidades. Cada primera respuesta cuenta para el resultado del intento. | Genera el porcentaje del intento.
Error en evaluación | La app corrige de inmediato, explica y presenta una pregunta equivalente distinta. La respuesta original permanece incorrecta para ese intento. | Preserva la validez del 80 % y garantiza aprendizaje.
Cierre del intento | La app muestra resultado, unidades dominadas y temas por reforzar. | Aprueba si el resultado es ≥ 80 %.
Reintento | Se habilita después de la ruta de refuerzo; usa ítems nuevos o variantes equivalentes. | Genera un nuevo resultado y conserva los anteriores.
5.2 Lógica de corrección y repregunta
1. Registrar la respuesta, el tiempo, la versión de la pregunta y el objetivo de aprendizaje.
2. Indicar inmediatamente que la respuesta es incorrecta, sin mensajes ambiguos.
3. Mostrar la respuesta correcta y explicar el fundamento técnico, la causa del error y el riesgo de aplicar el criterio equivocado.
4. Vincular el fragmento formativo pertinente.
5. Seleccionar otra pregunta del mismo objetivo, con redacción, contexto, orden y distractores diferentes.
6. Evitar que la repregunta dependa de memorizar la opción mostrada.
7. Cerrar el objetivo como dominado cuando el participante responda correctamente una variante equivalente.
8. Conservar por separado el resultado del intento certificable y el dominio alcanzado después del refuerzo.
5.3 Modelo de datos de la pregunta
Campo | Uso
question_id / version | Identificación y control de cambios.
learning_objective_id | Concepto que se evalúa.
equivalence_group | Conjunto de preguntas que prueban el mismo objetivo de manera diferente.
difficulty / format | Balance del examen y selección adaptativa.
stem / options / answer | Enunciado, opciones y clave.
feedback_correct / feedback_incorrect | Retroalimentación específica.
risk_of_error | Consecuencia de interpretar o aplicar mal el concepto.
source_reference | Origen en transcripción, requisito o fuente validada.
status / valid_from | Vigencia y publicación.
5.4 Reglas de puntuación
Resultado del intento | respuestas correctas en primera respuesta ÷ preguntas válidas × 100
Criterio de aprobación | resultado del intento ≥ 80 %
Dominio posterior | objetivos resueltos correctamente después del refuerzo ÷ objetivos evaluados × 100
El certificado debe mostrar el resultado del intento aprobatorio. El historial puede mostrar, además, resultado inicial, dominio posterior, intentos y temas reforzados. No se recomienda recalcular retroactivamente un intento cuando el participante acierta una repregunta, porque volvería irrelevante el umbral de aprobación.
5.5 Certificado automático
Grupo | Contenido del certificado
Identidad | Nombre completo del participante.
Vinculación | Cargo registrado y validado en Rehavid.
Formación | Nombre y versión de la ruta aprobada.
Resultado | Porcentaje del intento aprobatorio y estado “Aprobado”.
Trazabilidad | Fecha y hora, número de intento, código único y versión del contenido.
Verificación | Código QR o URL interna de consulta; estado vigente, revocado o reemplazado.
Emisor | Rehavid S.A.S. y responsable autorizado, si la organización lo define.
Alcance | Certificación interna de formación; no certificación del fabricante de Risk Simulator.
Texto funcional del certificado
“Rehavid S.A.S. certifica que [nombre completo], quien se desempeña como [cargo], aprobó la ruta de formación en modelación financiera y uso aplicado de Risk Simulator, con un resultado de [resultado] %, conforme al criterio mínimo de aprobación del 80 %.”
5.6 Control de expedición
No generar certificado cuando el resultado sea inferior al 80 %.
No permitir edición manual del resultado o de la fecha después de emitido.
Corregir datos de identidad mediante revocación y reexpedición, conservando trazabilidad.
No usar una imagen de firma como equivalente automático de firma electrónica.
Aplicar el régimen de protección de datos al nombre, cargo, resultados e historial. [COL-02][COL-03]
Cuando se requiera autenticidad jurídica reforzada, evaluar firma electrónica confiable conforme a la Ley 527 de 1999 y su reglamentación. [COL-05]
6. Módulo 2: manual de operación
El manual define cómo debe operar la aplicación desde cuatro perspectivas: participante, modelador, revisor y administrador. Los roles son una necesidad técnica de operación; no se atribuyen al segmento transcrito.
6.1 Perfiles y permisos
Rol | Permisos principales
Participante / modelador | Cursar formación, presentar evaluación, crear modelos, ejecutar escenarios, exportar/importar simulaciones y consultar sus resultados.
Revisor | Consultar modelos asignados, revisar supuestos, fórmulas, evidencias y emitir observaciones o aprobación.
Gestor de contenido | Crear unidades, preguntas, equivalencias, retroalimentaciones, versiones y reglas de publicación.
Administrador | Gestionar usuarios, cargos, permisos, parámetros, plantillas, integraciones y certificados.
Auditor | Consultar historial, cambios, aprobaciones, certificados, importaciones y eventos, sin modificar el cálculo.
6.2 Ruta del participante
1. Ingresar con una cuenta autorizada.
2. Confirmar nombre completo y cargo en Rehavid; reportar cualquier inconsistencia antes del examen.
3. Revisar la ruta y completar las unidades obligatorias.
4. Responder actividades formativas; ante error, leer la explicación y resolver la repregunta diferente.
5. Completar el laboratorio de Risk Simulator o la evidencia definida para esa unidad.
6. Presentar la evaluación certificable.
7. Consultar el resultado y el plan de refuerzo, si aplica.
8. Descargar o verificar el certificado cuando el resultado sea igual o superior al 80 %.
6.3 Ruta del modelador
1. Crear un proyecto y declarar su propósito, responsable, horizonte, periodicidad, moneda y alcance.
2. Registrar fuentes, supuestos y escenarios; separar histórico, presupuesto y proyección.
3. Configurar una o varias obligaciones de deuda.
4. Definir el mapeo del flujo disponible para servicio de deuda.
5. Registrar covenants y condiciones de liquidez con su fuente contractual o política.
6. Ejecutar validaciones de integridad y corregir inconsistencias.
7. Calcular calendario, servicio de deuda, cobertura, caja y capacidad máxima factible.
8. Comparar escenarios determinísticos.
9. Preparar y exportar el modelo para Risk Simulator.
10. Ejecutar la simulación en Excel, exportar los resultados e importarlos a la app.
11. Interpretar dispersión, sensibilidad y probabilidad de ruptura.
12. Solicitar revisión y cerrar la versión aprobada.
13. Cuando existan datos reales posteriores, ejecutar backtesting y registrar aprendizaje.
6.4 Ruta del revisor
1. Verificar propósito, alcance, fuentes y versión.
2. Comprobar consistencia de periodos, monedas y unidades.
3. Revisar la conciliación de saldos de deuda.
4. Validar el mapeo del CFADS y del servicio de deuda.
5. Confirmar que el covenant corresponde a una fuente identificada.
6. Revisar alertas de liquidez y supuestos críticos.
7. Evaluar la configuración e interpretación de la simulación.
8. Registrar hallazgos, severidad, responsable y acción.
9. Aprobar, devolver o rechazar la versión sin sobrescribir el historial.
6.5 Operaciones críticas y mensajes de error
Situación | Respuesta del sistema
Periodo inconsistente | La app bloquea el cálculo y señala las variables con periodicidad incompatible.
Servicio de deuda igual a cero | El DSCR se muestra como “No calculable”; no como infinito.
Covenant sin fuente | La app permite guardar borrador, pero no aprobar ni calcular capacidad máxima definitiva.
Saldo de deuda no concilia | La app muestra apertura, movimientos y cierre que causan la diferencia.
Caja por debajo del mínimo | La app identifica periodo, magnitud y principales impulsores.
Archivo de simulación no corresponde | La importación se rechaza si no coincide modelo, versión o plantilla.
Distribución sin justificación | La simulación puede quedar en borrador, pero no publicarse como análisis aprobado.
Certificado con datos erróneos | Se revoca y reexpide; no se edita el documento emitido.

8. Motor financiero, reglas y fórmulas
Criterio de diseño financiero
La app debe mostrar qué se calculó, con qué datos, bajo qué periodicidad y con qué versión. Los valores contractuales no pueden ser sustituidos por umbrales genéricos.
8.1 Calendario de deuda
Saldo final | saldo inicial + desembolsos + capitalizaciones − pago de principal ± ajustes autorizados
La naturaleza de cada ajuste debe estar configurada y documentada.
Servicio de deuda | principal pagadero + interés pagadero
El Banco Mundial utiliza principal más interés como servicio de deuda para el DSCR. Otros componentes se muestran por separado, salvo definición contractual expresa. [F-01]
La tasa, base de días, periodo de gracia, método de amortización, pagos extraordinarios y capitalización de intereses son parámetros de cada obligación. La transcripción no define un método único; la app debe evitar fijarlo por defecto sin confirmación.
8.2 Flujo disponible y DSCR
CFADS | ingresos de caja elegibles − egresos operativos elegibles − inversión elegible ± ajustes definidos
El mapeo exacto debe aprobarse por organización y proyecto para evitar mezclar utilidad contable, EBITDA o caja libre sin definición.
DSCR por periodo | CFADS del periodo ÷ servicio de deuda del mismo periodo
El Banco Mundial define el indicador como CFADS sobre servicio de deuda y explica que un valor inferior a 1,0 implica que los flujos propios no cubren el servicio del periodo. El covenant operativo de la app no debe asumir 1,0 ni ningún otro nivel: se toma del contrato o política configurada. [F-01]
8.3 Capacidad máxima de deuda
Problema de capacidad | maximizar monto de deuda sujeto a: DSCRₜ ≥ covenantₜ, caja finalₜ ≥ caja mínimaₜ y demás restricciones activas
El cálculo puede resolverse mediante búsqueda iterativa, optimización o Goal Seek controlado. La salida debe indicar el monto factible, la restricción vinculante, la holgura y los periodos críticos. Una condición contractual más exigente no debe ampliar artificialmente la capacidad.
8.4 Liquidez
Caja final | caja inicial + entradas de caja − salidas de caja − servicio de deuda ± financiación del periodo
Brecha de liquidez | caja final − caja mínima configurada
La caja mínima es una política o condición del caso, no un valor universal. La app debe permitir reglas por periodo, moneda y escenario. Un escenario con brecha negativa se presenta como incumplimiento de liquidez aunque el DSCR cumpla.
8.5 Simulación y riesgo
Probabilidad de ruptura | corridas válidas con al menos una ruptura ÷ corridas válidas totales × 100
Percentil | valor de la distribución de salida correspondiente a la probabilidad acumulada seleccionada
Sensibilidad | medida de asociación entre variaciones de entradas y variación de la salida, según el método exportado por la herramienta
La app no debe convertir un percentil en “resultado esperado” sin explicar qué representa. La simulación requiere variables, distribuciones e iteraciones; Risk Simulator declara funciones de simulación, pronóstico, análisis estadístico y optimización sobre Excel. [RS-01][MC-01]
8.6 Backtesting
Desviación absoluta | valor observado − valor proyectado
Desviación relativa | (valor observado − valor proyectado) ÷ base válida de comparación
Cuando la base sea cero, negativa o no comparable, la app debe mostrar “No aplicable” y evitar porcentajes engañosos. El backtesting debe conservar la proyección original; nunca reescribirla con información posterior.
8.7 Reglas de negocio financieras
Código | Regla
RN-FIN-01 | No calcular con periodos o monedas incompatibles sin conversión y fuente.
RN-FIN-02 | No mostrar DSCR cuando el servicio de deuda sea cero; indicar “No calculable”.
RN-FIN-03 | El covenant debe tener tipo, umbral, periodo, fuente y vigencia.
RN-FIN-04 | El máximo de deuda debe cumplir simultáneamente todas las restricciones activas.
RN-FIN-05 | Toda variable de entrada debe identificar fuente, responsable, fecha y racional.
RN-FIN-06 | Históricos, presupuestos y proyecciones no pueden mezclarse sin etiqueta.
RN-FIN-07 | Una versión aprobada es inmutable; cualquier cambio genera una nueva versión.
RN-FIN-08 | La salida determinística y la probabilística deben visualizarse por separado.
RN-FIN-09 | Una importación de Risk Simulator debe coincidir con el modelo y la versión exportada.
RN-FIN-10 | La decisión final debe registrar responsable, fecha, comentario y riesgo residual.
9. Uso e interoperabilidad con Risk Simulator
Risk Simulator es un complemento de Excel ofrecido por Real Options Valuation para simulación, pronóstico, análisis estadístico y optimización. Su incorporación proviene de una instrucción directa de Rehavid y se conecta con la orientación de la transcripción sobre riesgo calculado y entorno externo. [R-05][RS-01][T-03]
9.1 Contenido formativo obligatorio
Verificar el modelo determinístico antes de simular.
Seleccionar variables inciertas y justificar por qué son inciertas.
Elegir distribuciones y parámetros a partir de evidencia, no por conveniencia.
Definir correlaciones cuando las variables no sean independientes.
Identificar celdas de pronóstico y métricas de decisión.
Configurar número de iteraciones y criterios de estabilidad.
Ejecutar y revisar errores de cálculo.
Interpretar distribución, percentiles, probabilidad de ruptura y sensibilidad.
Documentar versión, archivo, usuario, fecha, supuestos y limitaciones.
Diferenciar resultado importado de Risk Simulator y cálculo nativo de la app.
9.2 Flujo recomendado para el producto mínimo viable
1. La app valida el modelo determinístico y genera una especificación de simulación.
2. La app exporta una plantilla de Excel con identificadores del modelo, versión, variables y salidas.
3. El usuario abre el archivo en Excel y configura o confirma la simulación en Risk Simulator.
4. Risk Simulator ejecuta la simulación.
5. El usuario exporta resultados mediante una plantilla estructurada controlada por Rehavid.
6. La app valida la identidad del modelo, importa resultados y registra la ejecución como “externa importada”.
7. La app muestra resultados, advertencias y trazabilidad sin afirmar que ejecutó internamente el motor de Risk Simulator.
9.3 Integración directa: condición para una fase posterior
El fabricante informa que dispone de opciones SDK/OEM para integrar sus capacidades en software propietario. La integración directa solo debe incluirse después de validar licencia, alcance técnico, formatos, seguridad, soporte y autorización contractual. [RS-02]
Decisión de arquitectura
MVP: interoperabilidad asistida por archivos estructurados. Fase posterior: integración directa únicamente mediante mecanismo autorizado por el fabricante. Esta separación evita prometer una conexión no confirmada.

10.3 Seguridad y privacidad
La app tratará, como mínimo, nombre, cargo, resultados de formación y actividad de usuario; estos son datos personales y requieren finalidad, autorización o base válida, acceso restringido, calidad, seguridad y confidencialidad conforme al régimen colombiano. [COL-02][COL-03]
Dominio | Control mínimo
Identidad | Autenticación robusta; recuperación segura; cierre de sesiones; bloqueo por riesgo.
Autorización | Mínimo privilegio; separación de funciones; permisos por modelo y organización.
Datos | Cifrado en tránsito y reposo; secretos fuera del código; copias protegidas.
Trazabilidad | Logs inmutables o protegidos frente a alteración; sincronización de tiempo.
Archivos | Validación de tipo, tamaño, contenido, malware y correspondencia de versión.
Desarrollo | Revisión de código, dependencias, pruebas y gestión de vulnerabilidades.
Verificación | Usar OWASP ASVS 5.0.0 como línea base de requisitos verificables. [SEC-01]
Límite jurídico. La matriz orienta el diseño y no reemplaza la revisión de un abogado, contador o responsable de protección de datos; su aplicabilidad depende del usuario, los datos, las integraciones y la finalidad real del despliegue.

Riesgo | Efecto | Control
Falsa precisión | Usuarios interpretan una proyección como certeza. | Advertencias, rangos, supuestos y revisión humana.

Sobreajuste retrospectivo | Se ajusta el modelo para explicar el pasado sin robustez futura. | Conservar versiones y separar aprendizaje de reescritura.
Uso no autorizado | Acceso a información financiera o resultados personales. | Roles, mínimo privilegio, logs y cifrado.
Fraude de certificado | Alteración o reutilización indebida. | Código verificable, estado y revocación.
Licencia insuficiente | Integración o uso no cubierto por el fabricante. | Validación contractual previa [RS-02].
Dependencia del experto | Solo una persona entiende el modelo. | Metodología común, documentación, formación y revisión.

Cierre
Este documento define una app fiel a las ideas identificables en la transcripción: modelar deuda, verificar cobertura y restricciones, proteger liquidez, practicar, auditar errores, contrastar proyecciones con resultados y tomar riesgos de manera calculada. Los requisitos de evaluación, certificación y Risk Simulator se integran porque fueron establecidos expresamente por Rehavid.
Criterio para pasar a diseño visual y desarrollo
El equipo funcional debe validar las decisiones pendientes de la sección 12.4. Después de esa validación, el documento puede convertirse en backlog, prototipo navegable, arquitectura de solución, diseño de base de datos y plan de pruebas sin reinterpretar el propósito.`;</script>
