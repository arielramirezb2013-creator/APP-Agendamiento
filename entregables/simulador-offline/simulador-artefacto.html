<title>Simulación de la ruta de incapacidad</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<style>
  /* ===== Sistema visual tomado del video de referencia: azul marino profundo, blanco, grises fríos, verde de avance ===== */
  :root { color-scheme: light;
    --navy:#162546; --navy-deep:#142543; --navy-ink:#0F1B33; --navy-2:#1F3159; --on-navy:#FFFFFF;
    --canvas:#FDFDFD; --surface:#FFFFFF; --surface-2:#F3F4F6; --bar:#EAECF0; --band:#E5E6EA; --node:#F0F1F2; --code-bg:#E6EBF1; --tint:#E1EAF3; --tint-border:#4B82B8;
    --slate:#5A5F66; --slate-2:#4E545C; --on-slate:#FFFFFF;
    --text:#2D313F; --text-2:#4E5563; --muted:#5F6470; --muted-deco:#868789; --line:#DCDFE5; --line-2:#C9CED6; --grid:#D7D7D7; --connector:#8FA6C8;
    --green:#3E9167; --green-ink:#2E7A52; --green-dark:#26663F; --green-soft:#EAF5EE; --link:#2F6DB5; --red:#B22F29; --red-soft:#FBE4E2; --gold:#B7791F; --gold-soft:#F8ECD6; --gold-ink:#7A4E0E; --grey:#5F6470; --grey-soft:#EEEFF2;
    /* alias conservados para el informe exportado y las reglas heredadas */
    --ui-primary:#162546; --ui-primary-hover:#0F1B33; --ui-canvas:var(--canvas); --ui-surface:var(--surface); --ui-surface-subtle:var(--surface-2); --ui-hover:#E9EBEF; --ui-pressed:#DADDE3; --ui-text:var(--text); --ui-text-secondary:var(--text-2); --ui-text-muted:var(--muted); --ui-border:var(--line); --ui-border-strong:var(--line-2); --ui-selected:var(--tint); --ui-selected-text:var(--navy); --ui-focus:#4B82B8; --ui-on-primary:#FFFFFF; --ui-shadow:0 10px 30px rgba(20,37,67,.22);
    --teal:var(--green-ink); --teal-soft:var(--green-soft); --on-teal:#FFFFFF; --on-red:#FFFFFF; --on-gold:#1A1A1A; }

  /* ===== Base ===== */
  * { box-sizing:border-box; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  body { margin:0; min-height:100vh; background:var(--canvas); color:var(--text); font:15px/22px "Roboto","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }
  body:is([data-rol="participante"],[data-rol="elegir"]) { background:var(--navy-deep); }
  h1,h2,h3,h4 { margin:0; font-weight:700; text-wrap:balance; color:var(--text); } h1 { font-size:26px; line-height:32px; } h2 { font-size:18px; line-height:24px; } h3 { font-size:16px; line-height:22px; }
  p { margin:0 0 8px; } button { font:inherit; cursor:pointer; } button:disabled { cursor:default; }
  input,select,textarea { font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--line-2); border-radius:6px; padding:8px 12px; min-height:42px; line-height:22px; }
  input[type="checkbox"], input[type="radio"] { min-height:0; width:17px; height:17px; margin:0 6px 0 0; vertical-align:-3px; accent-color:var(--navy); }
  input:hover, select:hover, textarea:hover { border-color:#AEB6C2; } input:focus, select:focus, textarea:focus { border-color:var(--tint-border); box-shadow:0 0 0 3px rgba(75,130,184,.18); outline:none; }
  input:disabled, select:disabled, textarea:disabled { color:var(--muted); background:var(--surface-2); border-color:var(--line); }
  select { max-width:100%; } .actividad fieldset select { max-width:100%; }
  textarea { width:100%; min-height:96px; resize:vertical; font-family:"Roboto Mono",Consolas,monospace; font-size:14px; }
  :is(button,a,[tabindex]):focus-visible { outline:2px solid var(--tint-border); outline-offset:2px; }
  a { color:var(--link); font-weight:500; } a:hover { color:var(--navy); }
  .mono { font-family:"Roboto Mono",Consolas,monospace; font-size:13px; }
  .wrap { width:100%; max-width:1320px; margin:0 auto; padding:0 24px 32px; flex:1; } @media (max-width:900px) { .wrap { padding:0 16px 24px; } } @media (max-width:600px) { .wrap { padding:0 12px 20px; } }
  .hide { display:none !important; } .sp { flex:1; }

  /* ===== Cabecera de aplicación: marca | título / subtítulo · lado derecho contextual ===== */
  .appbar { display:flex; align-items:center; gap:18px; min-height:64px; padding:10px 32px; background:var(--surface); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:12px; padding-right:18px; border-right:1px solid var(--line); flex:none; }
  .brand-mark { width:36px; height:36px; border-radius:8px; background:var(--navy); color:#fff; display:inline-flex; align-items:center; justify-content:center; } .brand-mark .bp-icon { width:20px; height:20px; }
  .brand-text { display:flex; flex-direction:column; line-height:18px; } .brand-text b { font-size:15px; color:var(--text); } .brand-text small { font-size:12px; color:var(--muted); }
  .appbar-title { font-size:17px; line-height:22px; font-weight:700; color:var(--text); flex:1; min-width:0; } body:not([data-rol="entrada"]) .appbar-title { display:none; }
  .appbar-right { display:flex; align-items:center; gap:14px; margin-left:auto; flex:none; font-size:13px; color:var(--text-2); }
  .appbar-right .who { display:flex; align-items:center; gap:10px; } .appbar-right .who b { display:block; font-size:13px; color:var(--text); line-height:16px; } .appbar-right .who small { display:block; font-size:12px; color:var(--muted); line-height:16px; }
  .avatar { width:40px; height:40px; border-radius:50%; background:#DADBD9; color:#5A5F66; display:inline-flex; align-items:center; justify-content:center; flex:none; } .avatar .bp-icon { width:22px; height:22px; } .avatar.xl { width:88px; height:88px; } .avatar.xl .bp-icon { width:44px; height:44px; }
  body:is([data-rol="participante"],[data-rol="elegir"]) .appbar { background:var(--navy-deep); border-bottom-color:rgba(255,255,255,.12); } body:is([data-rol="participante"],[data-rol="elegir"]) .brand { border-right-color:rgba(255,255,255,.18); }
  body:is([data-rol="participante"],[data-rol="elegir"]) .brand-text b, body:is([data-rol="participante"],[data-rol="elegir"]) .appbar-right, body:is([data-rol="participante"],[data-rol="elegir"]) .who b { color:#fff; } body:is([data-rol="participante"],[data-rol="elegir"]) .brand-text small, body:is([data-rol="participante"],[data-rol="elegir"]) .who small { color:rgba(255,255,255,.7); } body:is([data-rol="participante"],[data-rol="elegir"]) .brand-mark { background:#fff; color:var(--navy); }
  .appbar-right { flex:0 1 auto; min-width:0; } .who, .who > span:last-child { min-width:0; } .who b, .who small { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:42vw; }
  body:is([data-rol="participante"],[data-rol="elegir"]) .appbar-right .btn.outline { background:transparent; color:#fff; border-color:rgba(255,255,255,.55); } body:is([data-rol="participante"],[data-rol="elegir"]) .appbar-right .btn.outline:hover { background:rgba(255,255,255,.12); }
  @media (max-width:900px) { .appbar { padding:10px 16px; gap:12px; } .appbar-title { font-size:15px; line-height:20px; } } @media (max-width:600px) { .appbar { padding:8px 12px; } .appbar-title { display:none; } .brand-text small { display:none; } .appbar-right .who small { display:none; } .appbar-right .who .avatar { display:none; } }

  /* ===== Barra de página (título del rol + estado de la sesión) ===== */
  .top { position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; min-height:56px; padding:10px 0; font-size:13px; line-height:18px; color:var(--text-2); background:var(--canvas); }
  .top:empty { display:none; } body:not([data-rol="participante"]):not([data-rol="elegir"]) .top { border-bottom:1px solid var(--line); }
  .top .pagetitle { font-size:24px; line-height:30px; font-weight:700; color:var(--text); margin:0 6px 0 0; } .top b { font-weight:700; color:var(--text); } .top .msg { font-weight:500; }
  body:is([data-rol="participante"],[data-rol="elegir"]) .top { background:var(--navy-deep); color:rgba(255,255,255,.85); } body:is([data-rol="participante"],[data-rol="elegir"]) .top .pagetitle, body:is([data-rol="participante"],[data-rol="elegir"]) .top b { color:#fff; }
  body:is([data-rol="participante"],[data-rol="elegir"]) .top .badge { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.25); color:#fff; } body:is([data-rol="participante"],[data-rol="elegir"]) .top .btn.sec { background:transparent; color:#fff; border-color:rgba(255,255,255,.5); } body:is([data-rol="participante"],[data-rol="elegir"]) .top .btn.sec:hover { background:rgba(255,255,255,.12); }
  body:is([data-rol="participante"],[data-rol="elegir"]) .top .chip.ch-navy { background:rgba(255,255,255,.14); color:#fff; } body:is([data-rol="participante"],[data-rol="elegir"]) .top .msg { color:#9FE0BD; } body:is([data-rol="participante"],[data-rol="elegir"]) .top .msg.err { color:#FFB4AE; }
  .badge { font-family:"Roboto Mono",Consolas,monospace; font-size:12px; line-height:16px; background:var(--code-bg); border:1px solid var(--line); border-radius:4px; padding:3px 8px; color:var(--text); overflow-wrap:anywhere; display:inline-flex; align-items:center; gap:6px; }
  @media (max-width:600px) { .top { position:static; } .top .hm { display:none; } .top .pagetitle { font-size:20px; line-height:26px; }
    .top .msg:not(:empty) { position:fixed; left:12px; right:12px; bottom:12px; z-index:30; padding:10px 14px; border-radius:8px; background:var(--navy-ink); color:#9FE0BD; box-shadow:var(--ui-shadow); font-size:14px; } .top .msg.err:not(:empty) { color:#FFB4AE; } }

  /* ===== Lozenges (chips) y puntos ===== */
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:11px; line-height:16px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; border-radius:4px; padding:2px 7px; white-space:nowrap; border:1px solid transparent; vertical-align:middle; }
  .ch-red { background:var(--red-soft); color:var(--red); } .ch-teal { background:var(--green-soft); color:var(--green-ink); } .ch-gold { background:var(--gold-soft); color:var(--gold-ink); } .ch-grey { background:var(--grey-soft); color:var(--grey); } .ch-navy { background:var(--tint); color:var(--navy); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--grey); margin-right:6px; vertical-align:middle; } .dot.on { background:var(--green); }
  .lbl { font-size:12px; line-height:16px; letter-spacing:.04em; text-transform:uppercase; font-weight:700; color:var(--muted); }
  .mini { font-size:13px; line-height:18px; color:var(--muted); } .msg { font-size:13px; color:var(--green-ink); font-weight:700; } .err, .msg.err { color:var(--red); }

  /* ===== Superficies ===== */
  .card { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px 22px; margin-top:16px; } .card h2 { margin-bottom:8px; } .card h3 { margin:12px 0 4px; }
  .card > .row:first-child:has(> h2) { padding-bottom:10px; border-bottom:1px solid var(--line); margin-bottom:12px; } .card > .row:first-child h2 { margin-bottom:0; }
  body:is([data-rol="participante"],[data-rol="elegir"]) .card { border-color:transparent; box-shadow:0 12px 32px rgba(0,0,0,.28); }
  .grid2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; } @media (max-width:900px) { .grid2 { grid-template-columns:1fr; } } .grid2 > .card { margin-top:16px; }
  .row { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; } .row > label { display:flex; flex-direction:column; gap:4px; font-size:13px; line-height:18px; color:var(--text-2); font-weight:500; } .row input, .row select { min-width:160px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:14px; line-height:20px; } .kv b { font-weight:700; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; align-self:start; padding-top:2px; }
  details > summary { cursor:pointer; font-weight:500; font-size:14px; color:var(--link); list-style:none; padding:6px 0; } details > summary::-webkit-details-marker { display:none; } details > summary::before { content:"▸"; display:inline-block; width:14px; color:var(--muted); } details[open] > summary::before { content:"▾"; }
  details.card > summary { padding:0; } details.card[open] > summary { margin-bottom:8px; }
  .foot { margin-top:auto; background:var(--bar); color:var(--text-2); font-size:13px; line-height:18px; padding:14px 24px; text-align:center; } .foot .sep { margin:0 12px; color:var(--muted-deco); }
  body:is([data-rol="participante"],[data-rol="elegir"]) .foot { background:var(--navy-deep); color:rgba(255,255,255,.85); border-top:1px solid rgba(255,255,255,.12); }

  /* ===== Botones ===== */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 18px; border:1px solid var(--navy); background:var(--navy); color:#fff; border-radius:6px; font-weight:700; font-size:15px; line-height:20px; white-space:nowrap; letter-spacing:.01em; }
  .btn:hover { background:var(--navy-ink); border-color:var(--navy-ink); } .btn:active { filter:brightness(.9); } .btn .bp-icon { color:inherit; }
  .btn.sec { background:var(--bar); color:var(--navy); border-color:var(--bar); font-weight:500; } .btn.sec:hover { background:#DDE1E7; border-color:#DDE1E7; }
  .btn.outline { background:var(--surface); color:var(--text); border-color:var(--line-2); font-weight:500; } .btn.outline:hover { background:var(--surface-2); }
  .btn.green { background:var(--green-ink); border-color:var(--green-ink); color:#fff; border-radius:999px; padding:0 20px; } .btn.green:hover { background:var(--green-dark); border-color:var(--green-dark); }
  .btn.danger { background:var(--surface); color:var(--red); border-color:var(--red); font-weight:500; } .btn.danger:hover { background:var(--red-soft); }
  .btn.big { width:100%; height:50px; font-size:17px; border-radius:6px; } .btn.sm { height:32px; padding:0 12px; font-size:13px; }
  .btn:disabled, .btn:disabled:hover { background:#C4C7CE; color:#fff; border-color:#C4C7CE; filter:none; }
  .optrow { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 10px; }
  .optrow button { min-height:36px; border:1px solid var(--line-2); background:var(--surface); color:var(--text); border-radius:6px; padding:6px 14px; font-size:14px; font-weight:500; text-align:left; }
  .optrow button:hover { background:var(--surface-2); } .optrow button[aria-pressed="true"] { background:var(--tint); color:var(--navy); border-color:var(--tint-border); box-shadow:inset 0 0 0 1px var(--tint-border); font-weight:700; }
  fieldset { border:0; padding:0; margin:14px 0 0; min-width:0; } legend { font-weight:700; font-size:15px; line-height:20px; padding:0; margin-bottom:6px; color:var(--text); }
  .campos label { display:inline-flex; gap:4px; align-items:center; font-size:14px; line-height:20px; margin:3px 14px 3px 0; }

  /* ===== Entrada: tarjetas de acceso centradas ===== */
  .auth-wrap { display:flex; flex-wrap:wrap; justify-content:center; gap:24px; padding:48px 0 24px; }
  .auth { width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 24px rgba(20,37,67,.08); display:flex; flex-direction:column; }
  .auth-body { padding:24px 24px 20px; display:flex; flex-direction:column; gap:12px; flex:1; } .auth-body h2 { font-size:18px; font-weight:500; color:var(--text); margin:0; } .auth-body h2 .bp-icon { color:var(--navy); }
  .auth-body label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--text-2); font-weight:500; } .auth-body input, .auth-body select { width:100%; min-width:0; }
  .auth-body .btn { width:100%; height:46px; margin-top:4px; }
  .auth-foot { border-top:1px solid var(--line); background:var(--surface-2); padding:14px 24px; text-align:center; font-size:14px; border-radius:0 0 8px 8px; } .auth-foot .mini { margin:0; }
  .auth .avatar { margin:0 auto 4px; } .auth .actor-lbl { text-align:center; font-weight:700; font-size:18px; color:var(--text); }
  .auth-divider { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; margin:6px 0 2px; } .auth-divider::before, .auth-divider::after { content:""; flex:1; border-top:1px solid var(--line); }
  .intro { max-width:820px; margin:8px auto 0; text-align:center; color:var(--text-2); font-size:15px; }
  .code-box { background:var(--code-bg); border-radius:8px; padding:16px 20px; text-align:center; margin:8px auto; max-width:480px; } .code-lbl { font-size:13px; color:var(--text-2); font-weight:500; } .code-big { font-size:56px; line-height:64px; font-weight:900; letter-spacing:.08em; color:var(--navy); font-family:"Roboto","Segoe UI",Arial,sans-serif; }

  /* ===== Participante: tarjeta grande con barra lateral y contenido principal ===== */
  .pcard { display:grid; grid-template-columns:260px minmax(0,1fr); gap:28px; background:var(--surface); border-radius:12px; padding:28px; margin-top:8px; box-shadow:0 14px 40px rgba(0,0,0,.3); }
  @media (max-width:900px) { .pcard { grid-template-columns:1fr; gap:20px; padding:20px 16px; } .pmain { order:1; } .pside { order:2; } }
  .pside { display:flex; flex-direction:column; align-items:center; gap:10px; } .pside .pside-actor { font-size:20px; font-weight:700; color:var(--text); text-align:center; } .pside .pside-name { font-size:14px; color:var(--text-2); text-align:center; margin-top:-6px; }
  .callouts { display:flex; flex-direction:column; gap:12px; width:100%; margin-top:10px; }
  .callout { position:relative; background:var(--slate); color:var(--on-slate); border-radius:6px; padding:12px 26px 12px 14px; font-size:14px; line-height:20px; clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%); }
  .callout b { display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:rgba(255,255,255,.88); margin-bottom:2px; } .callout .bp-icon { color:#fff; }
  .pmain { min-width:0; }
  .pmain-head { display:flex; flex-wrap:wrap; align-items:flex-start; gap:12px 16px; margin-bottom:16px; } .pmain-head .eyebrow { font-size:14px; line-height:18px; color:var(--muted); font-weight:400; margin:0 0 2px; } .pmain-head .h1 { font-size:26px; line-height:32px; margin:0; } .pmain-head .h1 > .bp-icon { vertical-align:-5px; margin-right:8px; } .pmain-head .head-right { margin-left:auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .step-banner { display:flex; align-items:center; gap:0; background:var(--bar); border-radius:6px; overflow:hidden; min-height:52px; margin-bottom:16px; }
  .step-tag { display:inline-flex; align-items:center; justify-content:center; background:var(--navy); color:#fff; font-weight:900; font-size:22px; letter-spacing:.02em; height:52px; min-width:70px; padding:0 22px 0 18px; clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%); flex:none; }
  .step-tag.sm { height:26px; min-width:44px; font-size:13px; padding:0 14px 0 10px; clip-path:polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%); border-radius:3px 0 0 3px; }
  .step-name { font-weight:700; font-size:18px; color:var(--text); padding:0 16px; flex:1 1 160px; min-width:0; } .step-day { font-size:13px; color:var(--muted); padding-right:12px; flex:0 1 auto; min-width:0; text-align:right; } .step-banner .chev { color:var(--text-2); font-size:22px; padding:0 16px; }
  .qpanel { background:var(--tint); border-left:4px solid var(--tint-border); border-radius:6px; padding:12px 16px; font-size:15px; line-height:22px; font-weight:500; color:var(--text); margin-bottom:12px; } .qpanel .mini { margin:4px 0 0; color:var(--text-2); font-weight:400; }
  .panel { border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:12px; } .panel-title { font-size:15px; color:var(--text-2); border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:8px; }
  .actividad fieldset { border:1px solid var(--line); border-radius:8px; padding:10px 16px 12px; margin-top:12px; } .actividad legend { padding:0 6px; }
  .done-kv { margin:8px 0; }

  /* ===== Facilitador: stepper de momentos en flecha ===== */
  .stepper { display:flex; gap:4px; margin:16px 0 4px; overflow-x:auto; padding-bottom:2px; }
  .stepper button { flex:1 1 auto; min-width:150px; height:48px; border:0; background:var(--bar); color:var(--navy); font-weight:700; font-size:15px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 26px 0 30px; clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%, 16px 50%); white-space:nowrap; }
  .stepper button:first-child { clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%); border-radius:6px 0 0 6px; padding-left:22px; }
  .stepper button:last-child { clip-path:polygon(0 0, 100% 0, 100% 100%, 0 100%, 16px 50%); border-radius:0 6px 6px 0; }
  .stepper button:hover { background:#DDE1E7; } .stepper button[aria-pressed="true"] { background:var(--navy); color:#fff; } .stepper button:focus-visible { outline:0; box-shadow:inset 0 0 0 3px var(--tint-border); }
  @media (max-width:900px) { .stepper { flex-wrap:wrap; } .stepper button { min-width:calc(33.33% - 4px); padding:0 18px 0 24px; font-size:14px; } }

function claveFoco(el) {
  if (!el || !el.getAttribute) return null;
  const k = { act:el.getAttribute("data-act"), inp:el.getAttribute("data-in"), arg:el.getAttribute("data-arg"), v:el.getAttribute("data-v") };
  return k.act || k.inp ? k : null;
}
function buscarFoco(raiz, k) {
  const attr = k.inp ? "data-in" : "data-act", val = k.inp || k.act;
  return [...raiz.querySelectorAll("[" + attr + "]")].filter(x => x.getAttribute(attr) === val && x.getAttribute("data-arg") === k.arg && x.getAttribute("data-v") === k.v)[0] || null;
}
// Reemplaza el contenido solo si cambió. Con `conservar` mantiene desplazamientos, paneles abiertos, foco y cursor.
function setHtml(el, h, conservar) {
  if (el.__last === h) return false;
  el.__last = h;
  const ae = document.activeElement;
  const foco = ae && el.contains(ae) ? claveFoco(ae) : null;
  let cursor = null;
  if (foco && foco.inp) { try { if (typeof ae.selectionStart === "number") cursor = [ae.selectionStart, ae.selectionEnd]; } catch (e) {} }
  const desliz = conservar ? [...el.querySelectorAll(".sb-wrap,.twrap")].map(x => [x.scrollLeft, x.scrollTop]) : [];
  const abiertos = {};
  if (conservar) el.querySelectorAll("details[data-det]").forEach(d => { abiertos[d.getAttribute("data-det")] = d.open; });
  el.innerHTML = h;
  el.querySelectorAll(".sb-wrap,.twrap").forEach((x, i) => { if (desliz[i]) { x.scrollLeft = desliz[i][0]; x.scrollTop = desliz[i][1]; } });
  el.querySelectorAll("details[data-det]").forEach(d => { const k = d.getAttribute("data-det"); if (k in abiertos) d.open = abiertos[k]; });
  if (foco) {
    const x = buscarFoco(el, foco);
    if (x && x !== document.activeElement) { try { x.focus({ preventScroll:true }); if (cursor && x.setSelectionRange) x.setSelectionRange(cursor[0], cursor[1]); } catch (e) {} }
  }
  return true;
}

  const cuenta = { u:q.u, a:q.a, p:!!q.p, r:reanudar || (previo && previo.cuenta.r) || "" };

    aplicarGuardado(previo); S.cuenta = cuenta;

    if (S.envio && S.envio.estado === "enviando") S.envio = { estado:"pendiente" };
    if (S.consent) S.retomar = { origen:"local", t:previo.t };

    S.cuenta = cuenta; S.yo = { id:"p" + hex(azar(8)), nombre:q.u, actor:q.a }; S.etapa = "orientacion"; S.abierto = ahora();

}
function entrar() {
  const u = normUsuario(S.acc.u), c = S.acc.c;
  if (!u || !normClave(c)) return aviso("Escriba su usuario y su contraseña.", true);
  const q = CFG.cuentas.filter(x => x.u === u)[0];
  const h = huellaClave(u, c, q ? q.s : "00000000", CFG.kdf.iter);   // se calcula siempre: el tiempo no revela si el usuario existe
  if (!q || !igualSeguro(h, q.h)) return aviso("El usuario o la contraseña no coinciden. Revise los datos que le envió el investigador.", true);
  // Llave de reanudación: solo quien conoce la contraseña puede pedir al servidor el avance guardado.
  const habia = abrirCuenta(q, huellaClave(u, c, q.s + ":reanudar", CFG.kdf.iter));

  const s = doc.sesion;

/* ---------- Sesión individual ---------- */

}
const vigentes = () => vigentesDe(S.regs);

}

/* ---------- Bitácora ---------- */
function registrar(tipo, payload, extra) {

/* ---------- Conductor automático ---------- */
/* Al llegar a una actividad de custodia el sistema hace de quien decide en el paso:
   hoy le pide la evidencia; con el módulo, la consulta con la vista mínima de su contrato. */
function prepararBloque(b) {

  const r = S.ses.rondaActual, modo = modoDe(r), p = PASOS[PIDX[b.pasos[0]]], yo = S.yo.actor, pide = b.act.pide, piezas = b.act.piezas, fin = finalidadDe(pide);
  if (regsDe({ ronda:r, paso:p.id }).some(x => (x.tipo === "solicitud" || x.tipo === "consulta") && x.payload.guion && x.payload.a === yo)) return;
  const en = { paso:p.id };
  if (modo === "actual") { registrarSimulado("solicitud", { de:pide, a:yo, piezas, finalidad:fin, autorizada:true, guion:true }, en); return; }
  if (!piezas.length) { registrarSimulado("consulta", { de:pide, a:yo, pieza:null, campos:[], denegada:false, metadatos:true, finalidad:fin, guion:true }, en); return; }

function iniciarRonda() {

function validarForm(act) {

  if (act.tipo === "focal") { if (!f.sabe) falta.push("qué sabe de su caso"); if (!f.responde) falta.push("quién le responde"); if (!(f.hizo || []).length) falta.push("qué tuvo que hacer"); }

function guardarActividad() {

function validarValoracion() {

  CONS.datos.forEach(d => { const v = String(S.cons.datos[d.id] == null ? "" : S.cons.datos[d.id]).trim(); if (v) out[d.id] = v.slice(0, 200); });

let enviando = null;

async function enviar(silencioso) {
  if (!CFG.envio || !S.consent || !S.ses) return false;
  if (enviando) { await enviando.catch(() => {}); }
  const cuenta = S.cuenta.u, doc = documentoRespuesta();
  if (!silencioso) { S.envio = { estado:"enviando", t:ahora() }; render(); }
  enviando = llamarServidor({ accion:"guardar", documento:doc, reanudar:S.cuenta.r || "" });
  try {
    await enviando;
    if (!S.cuenta || S.cuenta.u !== cuenta) return true;
    S.envio = { estado:"enviado", t:ahora(), registros:doc.registros.length, completa:doc.estado === "completa" };
  } catch (e) {
    if (!S.cuenta || S.cuenta.u !== cuenta) return false;
    S.envio = { estado:"error", t:ahora(), error:String((e && e.message) || e) };
  } finally { enviando = null; }
  guardarLocal(); render();
  return S.envio.estado === "enviado";
}
const envioProgresivo = () => { if (CFG.envio && CFG.envio.modo === "progresivo") enviar(true); };
// Hay algo por enviar: nunca se envió, falló, o hay registros posteriores al último envío.
const envioPendiente = () => !!(CFG.envio && S.cuenta && S.consent && S.ses && (S.envio.estado !== "enviado" || S.envio.registros !== S.regs.length));
// Reintento automático: al volver la conexión y cada minuto mientras quede algo por enviar.

async function retirar() {

const EXCLUYE = { hizo:"nada", P3:"ninguna" };

  else if (ex && v === ex) { a.length = 0; a.push(v); }

document.addEventListener("click", async ev => {

  catch (e) { aviso("Ocurrió un error: " + ((e && e.message) || e), true); }
