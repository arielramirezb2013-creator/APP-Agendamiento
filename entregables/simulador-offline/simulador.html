<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simulación de la ruta de incapacidad</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<style>
  /* ===== Sistema visual tomado del video de referencia: azul marino profundo, blanco, grises fríos, verde de avance ===== */
  :root { color-scheme: light;
    --navy:#162546; --navy-deep:#142543; --navy-ink:#0F1B33; --navy-2:#1F3159; --on-navy:#FFFFFF;
    --canvas:#FDFDFD; --surface:#FFFFFF; --surface-2:#F3F4F6; --bar:#EAECF0; --band:#E5E6EA; --node:#F0F1F2; --code-bg:#E6EBF1; --tint:#E1EAF3; --tint-border:#4B82B8;
    --slate:#5A5F66; --slate-2:#4E545C; --on-slate:#FFFFFF;
    --text:#2D313F; --text-2:#4E5563; --muted:#5F6470; --muted-deco:#868789; --line:#DCDFE5; --line-2:#C9CED6; --grid:#D7D7D7; --connector:#8FA6C8;
    --green:#3E9167; --green-ink:#2E7A52; --green-dark:#26663F; --green-soft:#EAF5EE; --link:#2F6DB5; --red:#B22F29; --red-soft:#FBE4E2; --gold:#B7791F; --gold-soft:#F8ECD6; --gold-ink:#7A4E0E; --grey:#5F6470; --grey-soft:#EEEFF2;
    /* alias conservados para el informe exportado y las reglas heredadas */
    --ui-primary:#162546; --ui-primary-hover:#0F1B33; --ui-canvas:var(--canvas); --ui-surface:var(--surface); --ui-surface-subtle:var(--surface-2); --ui-hover:#E9EBEF; --ui-pressed:#DADDE3; --ui-text:var(--text); --ui-text-secondary:var(--text-2); --ui-text-muted:var(--muted); --ui-border:var(--line); --ui-border-strong:var(--line-2); --ui-selected:var(--tint); --ui-selected-text:var(--navy); --ui-focus:#4B82B8; --ui-on-primary:#FFFFFF; --ui-shadow:0 10px 30px rgba(20,37,67,.22);
    --teal:var(--green-ink); --teal-soft:var(--green-soft); --on-teal:#FFFFFF; --on-red:#FFFFFF; --on-gold:#1A1A1A; }

  /* ===== Base ===== */
  * { box-sizing:border-box; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  body { margin:0; min-height:100vh; background:var(--canvas); color:var(--text); font:15px/22px "Roboto","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }
  body:is([data-rol="participante"],[data-rol="elegir"]) { background:var(--navy-deep); }
  h1,h2,h3,h4 { margin:0; font-weight:700; text-wrap:balance; color:var(--text); } h1 { font-size:26px; line-height:32px; } h2 { font-size:18px; line-height:24px; } h3 { font-size:16px; line-height:22px; }
  p { margin:0 0 8px; } button { font:inherit; cursor:pointer; } button:disabled { cursor:default; }
  input,select,textarea { font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--line-2); border-radius:6px; padding:8px 12px; min-height:42px; line-height:22px; }
  input[type="checkbox"], input[type="radio"] { min-height:0; width:17px; height:17px; margin:0 6px 0 0; vertical-align:-3px; accent-color:var(--navy); }
  input:hover, select:hover, textarea:hover { border-color:#AEB6C2; } input:focus, select:focus, textarea:focus { border-color:var(--tint-border); box-shadow:0 0 0 3px rgba(75,130,184,.18); outline:none; }
  input:disabled, select:disabled, textarea:disabled { color:var(--muted); background:var(--surface-2); border-color:var(--line); }
  select { max-width:100%; } .actividad fieldset select { max-width:100%; }
  textarea { width:100%; min-height:96px; resize:vertical; font-family:"Roboto Mono",Consolas,monospace; font-size:14px; }
  :is(button,a,[tabindex]):focus-visible { outline:2px solid var(--tint-border); outline-offset:2px; }
  a { color:var(--link); font-weight:500; } a:hover { color:var(--navy); }
  .mono { font-family:"Roboto Mono",Consolas,monospace; font-size:13px; }
  .wrap { width:100%; max-width:1320px; margin:0 auto; padding:0 24px 32px; flex:1; } @media (max-width:900px) { .wrap { padding:0 16px 24px; } } @media (max-width:600px) { .wrap { padding:0 12px 20px; } }
  .hide { display:none !important; } .sp { flex:1; }

  /* ===== Cabecera de aplicación: marca | título / subtítulo · lado derecho contextual ===== */
  .appbar { display:flex; align-items:center; gap:18px; min-height:64px; padding:10px 32px; background:var(--surface); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:12px; padding-right:18px; border-right:1px solid var(--line); flex:none; }
  .brand-mark { width:36px; height:36px; border-radius:8px; background:var(--navy); color:#fff; display:inline-flex; align-items:center; justify-content:center; } .brand-mark .bp-icon { width:20px; height:20px; }
  .brand-text { display:flex; flex-direction:column; line-height:18px; } .brand-text b { font-size:15px; color:var(--text); } .brand-text small { font-size:12px; color:var(--muted); }
  .appbar-title { font-size:17px; line-height:22px; font-weight:700; color:var(--text); flex:1; min-width:0; } body:not([data-rol="entrada"]) .appbar-title { display:none; }
  .appbar-right { display:flex; align-items:center; gap:14px; margin-left:auto; flex:none; font-size:13px; color:var(--text-2); }
  .appbar-right .who { display:flex; align-items:center; gap:10px; } .appbar-right .who b { display:block; font-size:13px; color:var(--text); line-height:16px; } .appbar-right .who small { display:block; font-size:12px; color:var(--muted); line-height:16px; }
  .avatar { width:40px; height:40px; border-radius:50%; background:#DADBD9; color:#5A5F66; display:inline-flex; align-items:center; justify-content:center; flex:none; } .avatar .bp-icon { width:22px; height:22px; } .avatar.xl { width:88px; height:88px; } .avatar.xl .bp-icon { width:44px; height:44px; }
  body:is([data-rol="participante"],[data-rol="elegir"]) .appbar { background:var(--navy-deep); border-bottom-color:rgba(255,255,255,.12); } body:is([data-rol="participante"],[data-rol="elegir"]) .brand { border-right-color:rgba(255,255,255,.18); }
  body:is([data-rol="participante"],[data-rol="elegir"]) .brand-text b, body:is([data-rol="participante"],[data-rol="elegir"]) .appbar-right, body:is([data-rol="participante"],[data-rol="elegir"]) .who b { color:#fff; } body:is([data-rol="participante"],[data-rol="elegir"]) .brand-text small, body:is([data-rol="participante"],[data-rol="elegir"]) .who small { color:rgba(255,255,255,.7); } body:is([data-rol="participante"],[data-rol="elegir"]) .brand-mark { background:#fff; color:var(--navy); }
  .appbar-right { flex:0 1 auto; min-width:0; } .who, .who > span:last-child { min-width:0; } .who b, .who small { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:42vw; }
  body:is([data-rol="participante"],[data-rol="elegir"]) .appbar-right .btn.outline { background:transparent; color:#fff; border-color:rgba(255,255,255,.55); } body:is([data-rol="participante"],[data-rol="elegir"]) .appbar-right .btn.outline:hover { background:rgba(255,255,255,.12); }
  @media (max-width:900px) { .appbar { padding:10px 16px; gap:12px; } .appbar-title { font-size:15px; line-height:20px; } } @media (max-width:600px) { .appbar { padding:8px 12px; } .appbar-title { display:none; } .brand-text small { display:none; } .appbar-right .who small { display:none; } .appbar-right .who .avatar { display:none; } }

  /* ===== Barra de página (título del rol + estado de la sesión) ===== */
  .top { position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; min-height:56px; padding:10px 0; font-size:13px; line-height:18px; color:var(--text-2); background:var(--canvas); }
  .top:empty { display:none; } body:not([data-rol="participante"]):not([data-rol="elegir"]) .top { border-bottom:1px solid var(--line); }
  .top .pagetitle { font-size:24px; line-height:30px; font-weight:700; color:var(--text); margin:0 6px 0 0; } .top b { font-weight:700; color:var(--text); } .top .msg { font-weight:500; }
  body:is([data-rol="participante"],[data-rol="elegir"]) .top { background:var(--navy-deep); color:rgba(255,255,255,.85); } body:is([data-rol="participante"],[data-rol="elegir"]) .top .pagetitle, body:is([data-rol="participante"],[data-rol="elegir"]) .top b { color:#fff; }
  body:is([data-rol="participante"],[data-rol="elegir"]) .top .badge { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.25); color:#fff; } body:is([data-rol="participante"],[data-rol="elegir"]) .top .btn.sec { background:transparent; color:#fff; border-color:rgba(255,255,255,.5); } body:is([data-rol="participante"],[data-rol="elegir"]) .top .btn.sec:hover { background:rgba(255,255,255,.12); }
  body:is([data-rol="participante"],[data-rol="elegir"]) .top .chip.ch-navy { background:rgba(255,255,255,.14); color:#fff; } body:is([data-rol="participante"],[data-rol="elegir"]) .top .msg { color:#9FE0BD; } body:is([data-rol="participante"],[data-rol="elegir"]) .top .msg.err { color:#FFB4AE; }
  .badge { font-family:"Roboto Mono",Consolas,monospace; font-size:12px; line-height:16px; background:var(--code-bg); border:1px solid var(--line); border-radius:4px; padding:3px 8px; color:var(--text); overflow-wrap:anywhere; display:inline-flex; align-items:center; gap:6px; }
  @media (max-width:600px) { .top { position:static; } .top .hm { display:none; } .top .pagetitle { font-size:20px; line-height:26px; }
    .top .msg:not(:empty) { position:fixed; left:12px; right:12px; bottom:12px; z-index:30; padding:10px 14px; border-radius:8px; background:var(--navy-ink); color:#9FE0BD; box-shadow:var(--ui-shadow); font-size:14px; } .top .msg.err:not(:empty) { color:#FFB4AE; } }

  /* ===== Lozenges (chips) y puntos ===== */
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:11px; line-height:16px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; border-radius:4px; padding:2px 7px; white-space:nowrap; border:1px solid transparent; vertical-align:middle; }
  .ch-red { background:var(--red-soft); color:var(--red); } .ch-teal { background:var(--green-soft); color:var(--green-ink); } .ch-gold { background:var(--gold-soft); color:var(--gold-ink); } .ch-grey { background:var(--grey-soft); color:var(--grey); } .ch-navy { background:var(--tint); color:var(--navy); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--grey); margin-right:6px; vertical-align:middle; } .dot.on { background:var(--green); }
  .lbl { font-size:12px; line-height:16px; letter-spacing:.04em; text-transform:uppercase; font-weight:700; color:var(--muted); }
  .mini { font-size:13px; line-height:18px; color:var(--muted); } .msg { font-size:13px; color:var(--green-ink); font-weight:700; } .err, .msg.err { color:var(--red); }

  /* ===== Superficies ===== */
  .card { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px 22px; margin-top:16px; } .card h2 { margin-bottom:8px; } .card h3 { margin:12px 0 4px; }
  .card > .row:first-child:has(> h2) { padding-bottom:10px; border-bottom:1px solid var(--line); margin-bottom:12px; } .card > .row:first-child h2 { margin-bottom:0; }
  body:is([data-rol="participante"],[data-rol="elegir"]) .card { border-color:transparent; box-shadow:0 12px 32px rgba(0,0,0,.28); }
  .grid2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; } @media (max-width:900px) { .grid2 { grid-template-columns:1fr; } } .grid2 > .card { margin-top:16px; }
  .row { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; } .row > label { display:flex; flex-direction:column; gap:4px; font-size:13px; line-height:18px; color:var(--text-2); font-weight:500; } .row input, .row select { min-width:160px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:14px; line-height:20px; } .kv b { font-weight:700; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; align-self:start; padding-top:2px; }
  details > summary { cursor:pointer; font-weight:500; font-size:14px; color:var(--link); list-style:none; padding:6px 0; } details > summary::-webkit-details-marker { display:none; } details > summary::before { content:"▸"; display:inline-block; width:14px; color:var(--muted); } details[open] > summary::before { content:"▾"; }
  details.card > summary { padding:0; } details.card[open] > summary { margin-bottom:8px; }
  .foot { margin-top:auto; background:var(--bar); color:var(--text-2); font-size:13px; line-height:18px; padding:14px 24px; text-align:center; } .foot .sep { margin:0 12px; color:var(--muted-deco); }
  body:is([data-rol="participante"],[data-rol="elegir"]) .foot { background:var(--navy-deep); color:rgba(255,255,255,.85); border-top:1px solid rgba(255,255,255,.12); }

  /* ===== Botones ===== */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 18px; border:1px solid var(--navy); background:var(--navy); color:#fff; border-radius:6px; font-weight:700; font-size:15px; line-height:20px; white-space:nowrap; letter-spacing:.01em; }
  .btn:hover { background:var(--navy-ink); border-color:var(--navy-ink); } .btn:active { filter:brightness(.9); } .btn .bp-icon { color:inherit; }
  .btn.sec { background:var(--bar); color:var(--navy); border-color:var(--bar); font-weight:500; } .btn.sec:hover { background:#DDE1E7; border-color:#DDE1E7; }
  .btn.outline { background:var(--surface); color:var(--text); border-color:var(--line-2); font-weight:500; } .btn.outline:hover { background:var(--surface-2); }
  .btn.green { background:var(--green-ink); border-color:var(--green-ink); color:#fff; border-radius:999px; padding:0 20px; } .btn.green:hover { background:var(--green-dark); border-color:var(--green-dark); }
  .btn.danger { background:var(--surface); color:var(--red); border-color:var(--red); font-weight:500; } .btn.danger:hover { background:var(--red-soft); }
  .btn.big { width:100%; height:50px; font-size:17px; border-radius:6px; } .btn.sm { height:32px; padding:0 12px; font-size:13px; }
  .btn:disabled, .btn:disabled:hover { background:#C4C7CE; color:#fff; border-color:#C4C7CE; filter:none; }
  .optrow { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 10px; }
  .optrow button { min-height:36px; border:1px solid var(--line-2); background:var(--surface); color:var(--text); border-radius:6px; padding:6px 14px; font-size:14px; font-weight:500; text-align:left; }
  .optrow button:hover { background:var(--surface-2); } .optrow button[aria-pressed="true"] { background:var(--tint); color:var(--navy); border-color:var(--tint-border); box-shadow:inset 0 0 0 1px var(--tint-border); font-weight:700; }
  fieldset { border:0; padding:0; margin:14px 0 0; min-width:0; } legend { font-weight:700; font-size:15px; line-height:20px; padding:0; margin-bottom:6px; color:var(--text); }
  .campos label { display:inline-flex; gap:4px; align-items:center; font-size:14px; line-height:20px; margin:3px 14px 3px 0; }

  /* ===== Entrada: tarjetas de acceso centradas ===== */
  .auth-wrap { display:flex; flex-wrap:wrap; justify-content:center; gap:24px; padding:48px 0 24px; }
  .auth { width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 24px rgba(20,37,67,.08); display:flex; flex-direction:column; }
  .auth-body { padding:24px 24px 20px; display:flex; flex-direction:column; gap:12px; flex:1; } .auth-body h2 { font-size:18px; font-weight:500; color:var(--text); margin:0; } .auth-body h2 .bp-icon { color:var(--navy); }
  .auth-body label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--text-2); font-weight:500; } .auth-body input, .auth-body select { width:100%; min-width:0; }
  .auth-body .btn { width:100%; height:46px; margin-top:4px; }
  .auth-foot { border-top:1px solid var(--line); background:var(--surface-2); padding:14px 24px; text-align:center; font-size:14px; border-radius:0 0 8px 8px; } .auth-foot .mini { margin:0; }
  .auth .avatar { margin:0 auto 4px; } .auth .actor-lbl { text-align:center; font-weight:700; font-size:18px; color:var(--text); }
  .auth-divider { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; margin:6px 0 2px; } .auth-divider::before, .auth-divider::after { content:""; flex:1; border-top:1px solid var(--line); }
  .intro { max-width:820px; margin:8px auto 0; text-align:center; color:var(--text-2); font-size:15px; }
  .code-box { background:var(--code-bg); border-radius:8px; padding:16px 20px; text-align:center; margin:8px auto; max-width:480px; } .code-lbl { font-size:13px; color:var(--text-2); font-weight:500; } .code-big { font-size:56px; line-height:64px; font-weight:900; letter-spacing:.08em; color:var(--navy); font-family:"Roboto","Segoe UI",Arial,sans-serif; }

  /* ===== Participante: tarjeta grande con barra lateral y contenido principal ===== */
  .pcard { display:grid; grid-template-columns:260px minmax(0,1fr); gap:28px; background:var(--surface); border-radius:12px; padding:28px; margin-top:8px; box-shadow:0 14px 40px rgba(0,0,0,.3); }
  @media (max-width:900px) { .pcard { grid-template-columns:1fr; gap:20px; padding:20px 16px; } .pmain { order:1; } .pside { order:2; } }
  .pside { display:flex; flex-direction:column; align-items:center; gap:10px; } .pside .pside-actor { font-size:20px; font-weight:700; color:var(--text); text-align:center; } .pside .pside-name { font-size:14px; color:var(--text-2); text-align:center; margin-top:-6px; }
  .callouts { display:flex; flex-direction:column; gap:12px; width:100%; margin-top:10px; }
  .callout { position:relative; background:var(--slate); color:var(--on-slate); border-radius:6px; padding:12px 26px 12px 14px; font-size:14px; line-height:20px; clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%); }
  .callout b { display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:rgba(255,255,255,.88); margin-bottom:2px; } .callout .bp-icon { color:#fff; }
  .pmain { min-width:0; }
  .pmain-head { display:flex; flex-wrap:wrap; align-items:flex-start; gap:12px 16px; margin-bottom:16px; } .pmain-head .eyebrow { font-size:14px; line-height:18px; color:var(--muted); font-weight:400; margin:0 0 2px; } .pmain-head .h1 { font-size:26px; line-height:32px; margin:0; } .pmain-head .h1 > .bp-icon { vertical-align:-5px; margin-right:8px; } .pmain-head .head-right { margin-left:auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .step-banner { display:flex; align-items:center; gap:0; background:var(--bar); border-radius:6px; overflow:hidden; min-height:52px; margin-bottom:16px; }
  .step-tag { display:inline-flex; align-items:center; justify-content:center; background:var(--navy); color:#fff; font-weight:900; font-size:22px; letter-spacing:.02em; height:52px; min-width:70px; padding:0 22px 0 18px; clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%); flex:none; }
  .step-tag.sm { height:26px; min-width:44px; font-size:13px; padding:0 14px 0 10px; clip-path:polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%); border-radius:3px 0 0 3px; }
  .step-name { font-weight:700; font-size:18px; color:var(--text); padding:0 16px; flex:1 1 160px; min-width:0; } .step-day { font-size:13px; color:var(--muted); padding-right:12px; flex:0 1 auto; min-width:0; text-align:right; } .step-banner .chev { color:var(--text-2); font-size:22px; padding:0 16px; }
  .qpanel { background:var(--tint); border-left:4px solid var(--tint-border); border-radius:6px; padding:12px 16px; font-size:15px; line-height:22px; font-weight:500; color:var(--text); margin-bottom:12px; } .qpanel .mini { margin:4px 0 0; color:var(--text-2); font-weight:400; }
  .panel { border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:12px; } .panel-title { font-size:15px; color:var(--text-2); border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:8px; }
  .actividad fieldset { border:1px solid var(--line); border-radius:8px; padding:10px 16px 12px; margin-top:12px; } .actividad legend { padding:0 6px; }
  .done-kv { margin:8px 0; }

  /* ===== Facilitador: stepper de momentos en flecha ===== */
  .stepper { display:flex; gap:4px; margin:16px 0 4px; overflow-x:auto; padding-bottom:2px; }
  .stepper button { flex:1 1 auto; min-width:150px; height:48px; border:0; background:var(--bar); color:var(--navy); font-weight:700; font-size:15px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 26px 0 30px; clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%, 16px 50%); white-space:nowrap; }
  .stepper button:first-child { clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%); border-radius:6px 0 0 6px; padding-left:22px; }

  .stepper button:hover { background:#DDE1E7; } .stepper button[aria-pressed="true"] { background:var(--navy); color:#fff; } .stepper button:focus-visible { outline:0; box-shadow:inset 0 0 0 3px var(--tint-border); }

  decidirSistema: function (pasoId, E, yo, perfil) {

  mantenerViva: function (pasoId, valor, yo) {

/* ============ Motor del expediente de pensión de invalidez ============
   Instrumento del marco DGIT-PENSION-R1. El participante recorre UN expediente sintético en DOS
   condiciones —los canales del flujo actual y el módulo con acceso por finalidad— y al cierre
   responde las seis responsabilidades de H2 y reconstruye los cuatro accesos de H3.

   Reglas que vienen del documento y no se inventan aquí:
     · el estado inicial de cada soporte, su versión de referencia y su criterio de conformidad;
     · los puntos de decisión de cada caso y la evidencia que requieren;
     · «si el participante pide un soporte, el estado solo cambia cuando este llega, se verifica y
       se acepta»;
     · el corte de 48 horas virtuales y la instantánea antes de la decisión que resuelve (P2);
     · H1 se calcula en P2: requeridos disponibles y conformes ÷ total de requeridos.

   Lo que esta capa añade, como supuesto de simulación declarado en pantalla, son las horas
   virtuales que cuesta cada actuación en cada condición. */

const EXPM = {

  /* Horas virtuales por actuación. Supuesto de simulación: en el flujo actual una solicitud viaja
     por oficio o correo entre entidades; con el módulo la consulta por finalidad es inmediata y la
     solicitud queda enlazada al índice. El corte del piloto son 48 horas. */
  horas: {
    actual: { consultar:2, solicitar:20, devolver:20, verificar:1, decidir:1 },
    modulo: { consultar:1, solicitar:6,  devolver:6,  verificar:0.5, decidir:0.5 }
  },

  // Lo que cuesta una actuación: «Verificar y aceptar» y «Verificar y rechazar» cuestan lo que verificar.
  costo: function (cond, que) { const H = EXPM.horas[cond] || EXPM.horas.actual; return H[que === "aceptar" || que === "rechazar" ? "verificar" : que] || 0; },
  // Verificar y decidir se permiten aun con el corte agotado, pero las horas no pasan del corte.
  sumarHoras: function (E, h) { E.horas = Math.min(EXP.protocolo.corteHoras, E.horas + h); },
  casoDe: function (id) { return EXP.casos.filter(c => c.id === id)[0] || EXP.casos[0] || null; },
  // Igual, pero sin caer al primero: null si el id no está en el catálogo.
  casoExacto: function (id) { return EXP.casos.filter(c => c.id === id)[0] || null; },
  puntoDe: function (caso, id) { return caso.puntos.filter(p => p.id === id)[0] || null; },
  soporteDe: function (caso, k) { return caso.soportes.filter(s => s.k === k)[0] || null; },
  actorDe: function (caso, a) { return caso.actores.filter(x => x.a === a)[0] || null; },
  condDe: function (id) { return EXP.protocolo.condiciones.filter(c => c.id === id)[0] || EXP.protocolo.condiciones[0]; },

  /* ---------- Estado del expediente en una condición ----------
     Se reinicia al empezar cada condición, como pide el protocolo. */
  // «a la IPS», «al empleador», «a ARL SURA»: el custodio tal como entra en una frase.
  aCustodio: function (n) {
    const art = { "Junta Nacional":"la", "Junta Regional":"la", "Empleador":"el", "IPS":"la", "Solicitante":"el" }[n];
    return art === "el" ? "al " + n.toLowerCase() : art === "la" ? "a la " + n : "a " + n;
  },
  inicial: function (caso) {
    const E = { soportes:{}, puntos:{}, accesos:[], horas:0, historia:[], instantanea:null };
    caso.soportes.forEach(s => {
      E.soportes[s.k] = {
        estado:s.estado,            // conforme | no_conforme | ausente
        ver:s.ver || "",
        visto:false,                // el participante lo consultó
        solicitado:false,
        llegado:s.estado !== "ausente",   // lo que ya está en el expediente al radicar
        verificado:null,            // true | false: contrastado con el criterio de conformidad
        aceptado:s.estado === "conforme"  // solo lo conforme cuenta para la completitud
      };
    });
    caso.puntos.forEach(p => { E.puntos[p.id] = { cerrado:false, decision:null, cual:"", completitud:null }; });
    return E;
  },

  /* ---------- Completitud, la medida de H1 ----------
     «Elementos requeridos disponibles y conformes ÷ total de elementos requeridos». */
  completitud: function (E, caso, puntoId) {
    const p = EXPM.puntoDe(caso, puntoId); if (!p) return null;
    const req = p.requiere || [];
    const ok = req.filter(k => { const x = E.soportes[k]; return !!(x && x.llegado && x.aceptado && x.estado === "conforme"); });
    return { ok:ok.length, total:req.length, conformes:ok, faltan:req.filter(k => ok.indexOf(k) < 0),
      pct:req.length ? Math.round(ok.length * 1000 / req.length) / 10 : 0 };
  },
  // Lo que el documento imprime como «Inicio n/m», recalculado desde la tabla de soportes.
  inicioDe: function (caso, puntoId) {
    const p = EXPM.puntoDe(caso, puntoId); if (!p) return "";
    const ok = (p.requiere || []).filter(k => { const s = EXPM.soporteDe(caso, k); return s && s.estado === "conforme"; });
    return ok.length + "/" + (p.requiere || []).length;
  },

  /* ---------- Qué ve cada rol ----------
     El decisor del punto ve el estado de todos los soportes que el punto requiere. Quien custodia
     una pieza ve la suya y la solicitud que le llega. Nadie ve el contenido de una pieza ajena si
     su finalidad no lo autoriza: esa denegación es parte de lo que H3 mide. */
  piezasDelPunto: function (caso, puntoId) { const p = EXPM.puntoDe(caso, puntoId); return p ? (p.requiere || []).slice() : []; },
  custodiaDe: function (caso, actor) { return caso.soportes.filter(s => s.cust === actor).map(s => s.k); },
  /* Piezas clínicas: una finalidad administrativa no las abre, aunque quien consulte tenga un
     papel en el expediente. Es la regla que el documento deja expresamente denegada en H3. */
  clinicas: ["HC", "AUD", "FUN"],
  // ¿Puede este actor ver el contenido de esta pieza, con la finalidad que declaró?
  puedeVer: function (caso, actor, k, puntoId, finalidad) {
    const s = EXPM.soporteDe(caso, k); if (!s) return false;
    if (finalidad === "control_admin" && EXPM.clinicas.indexOf(k) >= 0) return false;
    if (s.cust === actor) return true;                      // su propia evidencia, en origen
    const p = EXPM.puntoDe(caso, puntoId);
    if (p && p.decide === actor && (p.requiere || []).indexOf(k) >= 0) return true;  // la necesita para decidir
    return false;
  },

  /* ---------- Actuaciones sobre un soporte ----------
     Devuelve { texto, horas } y deja el estado como queda. No cambia el estado a conforme por el
     solo hecho de pedirlo: tiene que llegar, verificarse y aceptarse. */
  actuar: function (E, caso, cond, actor, puntoId, k, que, finalidad) {
    const s = EXPM.soporteDe(caso, k), x = E.soportes[k], H = EXPM.horas[cond] || EXPM.horas.actual;
    const aCust = EXPM.aCustodio(s ? s.custN : "");
    if (!s || !x) return null;
    const esMod = cond === "modulo", r = { pieza:k, que:que, horas:EXPM.costo(cond, que), denegado:false };

    if (que === "consultar") {
      const puede = EXPM.puedeVer(caso, actor, k, puntoId, finalidad);
      x.visto = x.visto || puede;
      r.denegado = !puede;
      r.texto = puede
        ? (x.llegado
          ? "Consulta atendida. " + (x.estado === "conforme" ? "El soporte está en el expediente: " + s.contenido : "Lo que hay en el expediente no cumple el criterio. " + s.notaEstado)
          : (esMod
            ? "El índice registra que el soporte existe y quién lo custodia (" + s.custN + "), pero todavía no está en el expediente: hay que solicitarlo."
            : "No está en el expediente y no hay forma de verlo desde aquí: hay que pedirlo " + aCust + "."))
        : "Consulta denegada: la finalidad declarada no autoriza esta pieza. La denegación queda registrada.";
      if (esMod && puede && x.llegado && x.estado !== "conforme") r.texto += " El índice muestra además qué versión es la de referencia: " + s.verRef + ".";
    } else if (que === "solicitar") {
      x.solicitado = true; x.llegado = true; x.ver = s.verRef; x.verificado = null; x.aceptado = false; x.estado = "pendiente";
      r.texto = "Se envió la solicitud " + aCust + ". Llega la versión de referencia " + s.verRef + ". " + s.contenido + " Falta verificarla contra el criterio de conformidad y aceptarla.";
      if (esMod) r.texto += " La solicitud queda enlazada al índice, con su finalidad y su responsable.";
    } else if (que === "devolver") {
      x.solicitado = true; x.llegado = false; x.aceptado = false; x.verificado = false; x.estado = "ausente";
      r.texto = "Se devolvió " + aCust + " porque no cumple el criterio. Mientras no llegue la versión correcta, el soporte no está en el expediente.";
    } else if (que === "aceptar") {
      if (!x.llegado) { r.texto = "No se puede aceptar un soporte que no ha llegado."; r.horas = 0; return r; }
      x.verificado = true; x.aceptado = true; x.estado = "conforme";
      r.texto = "Se verificó contra el criterio («" + String(s.criterio || "").replace(/\.$/, "") + "») y se aceptó como conforme.";
    } else if (que === "rechazar") {
      x.verificado = false; x.aceptado = false;
      if (x.estado === "pendiente") x.estado = "no_conforme";
      r.texto = "Se verificó y se rechazó: no cumple el criterio. Queda la constancia y hay que pedir la versión que corresponde.";
    } else return null;

    const antes = E.horas; EXPM.sumarHoras(E, r.horas); r.horas = Math.round((E.horas - antes) * 10) / 10;
    E.accesos.push({ h:E.horas, actor:actor, pieza:k, finalidad:finalidad || "", accion:que, denegado:!!r.denegado, cond:cond });
    E.historia.push({ punto:puntoId, pieza:k, que:que, texto:r.texto, horas:r.horas });
    return r;
  },

  /* ---------- Cierre de un punto ---------- */
  opcionesPunto: function (caso, punto) {
    if (punto.resuelve) return [
      ["reconocer", "Reconocer la pensión"],
      ["negar", "Negar con decisión motivada"],
      ["pendiente", "Dejar pendiente de verificación y requerir lo que falta"]
    ];
    return [
      ["cerrado", "Cerrar el punto: tengo lo que necesito"],
      ["requerir", "Requerir lo que falta antes de cerrar"],
      ["sin_soporte", "No puedo cerrarlo con lo que hay"]
    ];
  },
  cerrarPunto: function (E, caso, cond, puntoId, decision, cual) {
    const p = EXPM.puntoDe(caso, puntoId), H = EXPM.horas[cond] || EXPM.horas.actual;
    if (!p) return null;
    const c = EXPM.completitud(E, caso, puntoId);
    const antes = E.horas; EXPM.sumarHoras(E, H.decidir); const hDec = Math.round((E.horas - antes) * 10) / 10;
    if (p.resuelve && !E.instantanea) E.instantanea = { h:E.horas, completitud:c, soportes:clone(E.soportes) };
    E.puntos[puntoId] = { cerrado:true, decision:decision, cual:textoLimpio(cual, 600) || "", completitud:c, horas:E.horas };
    E.historia.push({ punto:puntoId, que:"decidir", texto:"Decisión registrada", horas:hDec });
    return { completitud:c, horas:E.horas };
  },

  /* ---------- H2: identificación de responsabilidades ---------- */
  opcionesH2: function (caso) {
    return caso.actores.map(a => [a.a, a.n]).concat([["nadie", "Ninguno de los anteriores"], ["no_se", "No lo sé"]]);
  },
  calificarH2: function (caso, respuestas) {
    const r = (respuestas || {}), det = caso.h2.map(h => ({ id:h.id, dada:r[h.id] || null, ref:h.ref, correcta:r[h.id] === h.ref }));
    const ok = det.filter(x => x.correcta).length;
    return { ok:ok, total:caso.h2.length, pct:caso.h2.length ? Math.round(ok * 1000 / caso.h2.length) / 10 : 0, detalle:det };
  },

  /* ---------- H3: reconstrucción de accesos ----------
     Se le pide reconstruir, de cada intento de referencia, los cinco elementos que el marco exige:
     actor, finalidad, momento, acción y resultado. */
  camposH3: ["actor", "pieza", "momento", "accion", "resultado"],
  opcionesH3: function (caso) {
    const momentos = [["0-8", "En las primeras 8 horas"], ["8-24", "Entre 8 y 24 horas"], ["24-48", "Entre 24 y 48 horas"], ["no_se", "No lo sé"]];
    return {
      actor:caso.actores.map(a => [a.a, a.n]).concat([["no_se", "No lo sé"]]),
      pieza:caso.soportes.map(s => [s.k, s.n]).concat([["no_se", "No lo sé"]]),
      momento:momentos,
      accion:[["consultar", "Consultar"], ["solicitar", "Solicitar"], ["entregar", "Entregar"], ["no_se", "No lo sé"]],
      resultado:[["entregado", "Se entregó lo pedido"], ["parcial", "Se entregó solo una parte"], ["denegado", "Se denegó"], ["no_se", "No lo sé"]]
    };
  },
  // El momento de referencia, en el tramo que se le ofrece al participante.
  tramoDe: function (momento) {
    const h = parseFloat(String(momento).replace(/[^0-9.]/g, "")) || 0;
    return h <= 8 ? "0-8" : h <= 24 ? "8-24" : "24-48";
  },
  calificarH3: function (caso, respuestas) {
    const r = (respuestas || {}), det = caso.h3.map((h, i) => {
      const d = r["A" + (i + 1)] || {};
      const esperado = { actor:h.actor, pieza:h.pieza, momento:EXPM.tramoDe(h.momento), accion:String(h.accion || "").toLowerCase(), resultado:h.denegado ? "denegado" : "entregado" };
      const campos = EXPM.camposH3.map(k => ({ k:k, dada:d[k] || null, ref:esperado[k], correcta:d[k] === esperado[k] }));
      return { id:"A" + (i + 1), ref:h, campos:campos, correcta:campos.every(c => c.correcta) };
    });
    const ok = det.filter(x => x.correcta).length;
    const campos = det.reduce((n, x) => n + x.campos.filter(c => c.correcta).length, 0);
    return { ok:ok, total:caso.h3.length, pct:caso.h3.length ? Math.round(ok * 1000 / caso.h3.length) / 10 : 0,
      campos:campos, camposTotal:caso.h3.length * EXPM.camposH3.length, detalle:det };
  },

  /* ---------- El recorrido del participante ----------
     Dos condiciones del mismo expediente, en el orden que le toque, y al cierre H2 y H3.
     En cada condición entran los puntos donde su rol actúa: decide, o custodia algo que el punto
     requiere. Los demás puntos se resumen en un tramo de contexto. */
  participa: function (caso, actor, punto) {
    if (punto.decide === actor) return "decide";
    const mios = (punto.requiere || []).filter(k => { const s = EXPM.soporteDe(caso, k); return s && s.cust === actor; });
    return mios.length ? "aporta" : null;
  },
  ordenCondiciones: function (usuario) {
    // El protocolo pide alternar el orden entre participantes: se deriva del usuario, de forma estable.
    const C = EXP.protocolo.condiciones.map(c => c.id);
    let n = 0; String(usuario || "").split("").forEach(ch => { n = (n + ch.charCodeAt(0)) % 997; });
    return n % 2 ? [C[1], C[0]] : [C[0], C[1]];
  },
  bloques: function (caso, actor, usuario) {
    const out = [{ tipo:"caso" }], orden = EXPM.ordenCondiciones(usuario);
    // Los puntos posteriores al que resuelve el derecho son ilustrativos: se leen y se comentan, con
    // el expediente tal como lo deja el participante, pero no se vuelven a decidir en cada condición.
    // Así el recorrido completo cabe en los 45 minutos que fija el estudio.
    let iRes = -1; caso.puntos.forEach((p, j) => { if (p.resuelve) iRes = j; });
    orden.forEach((cond, i) => {
      out.push({ tipo:"cond-intro", cond:cond, ronda:i + 1 });
      let ctx = null;
      caso.puntos.forEach((p, j) => {
        const despues = iRes >= 0 && j > iRes, como = despues ? null : EXPM.participa(caso, actor, p);
        if (como) { ctx = null; out.push({ tipo:"punto", cond:cond, punto:p.id, como:como }); }
        else {
          if (!ctx || !!ctx.despues !== despues) { ctx = { tipo:"punto-contexto", cond:cond, puntos:[], despues:despues }; out.push(ctx); }
          ctx.puntos.push(p.id);
        }
      });
      out.push({ tipo:"cond-cierre", cond:cond, ronda:i + 1 });
    });
    out.push({ tipo:"h2" });
    out.push({ tipo:"h3" });
    return out;
  },
  // Minutos estimados del recorrido completo, para informar al participante.
  minutos: function (caso, actor, usuario) {
    const T = GUION.tiemposExp, bs = EXPM.bloques(caso, actor, usuario);
    let m = T.inicio + T.cierre + T.h2 + T.h3;
    bs.forEach(b => { m += b.tipo === "punto" ? T[b.como] : b.tipo === "punto-contexto" ? T.contexto * b.puntos.length : b.tipo === "cond-intro" ? T.condIntro : 0; });
    return Math.max(10, Math.round(m / 5) * 5);
  }
};
/* ============ Núcleo común del simulador asíncrono y del panel del investigador ============ */
const INSTRUMENTO = "simulador_blueprint_asincrono";
const FORMATO = 1;
const VERSION = "1.0";

/* ---------- DOM: repintado estable ---------- */
function claveFoco(el) {
  if (!el || !el.getAttribute) return null;
  const k = { act:el.getAttribute("data-act"), inp:el.getAttribute("data-in"), arg:el.getAttribute("data-arg"), v:el.getAttribute("data-v") };
  return k.act || k.inp ? k : null;
}
function buscarFoco(raiz, k) {
  const attr = k.inp ? "data-in" : "data-act", val = k.inp || k.act;
  return [...raiz.querySelectorAll("[" + attr + "]")].filter(x => x.getAttribute(attr) === val && x.getAttribute("data-arg") === k.arg && x.getAttribute("data-v") === k.v)[0] || null;
}
// Reemplaza el contenido solo si cambió. Con `conservar` mantiene desplazamientos, paneles abiertos, foco y cursor.
function setHtml(el, h, conservar) {
  if (el.__last === h) return false;
  el.__last = h;

let GUION_ORIG = null;
function resolverGuion(perfil) {
  if (!GUION_ORIG) GUION_ORIG = clone(GUION);
  const p = (perfil && perfil.persona) || {}, c = (perfil && perfil.caso) || {};
  const ac = p.acompanaCorto || "quien la acompaña";
  const M = { persona:p.nombre || "la trabajadora", acompana:ac, acompanaMayus:ac.charAt(0).toUpperCase() + ac.slice(1),
    edad:p.edad == null ? "—" : String(p.edad), cargo:p.cargo ? String(p.cargo).charAt(0).toLowerCase() + String(p.cargo).slice(1) : "—", empresa:p.empresa || "—",
    dia:c.diaRuta == null ? "—" : String(c.diaRuta), diagnostico:c.diagnostico || "—" };
  const sub = t => t.replace(/\{(persona|acompanaMayus|acompana|edad|cargo|empresa|dia|diagnostico)\}/g, (m, k) => M[k]);
  const walk = (dst, src) => { Object.keys(src).forEach(k => { const v = src[k]; dst[k] = typeof v === "string" ? sub(v) : (v && typeof v === "object") ? walk(Array.isArray(v) ? [] : {}, v) : v; }); return dst; };
  walk(GUION, GUION_ORIG);
  return GUION;
}
// La ficha de la persona del caso, con los rótulos del guion y los datos del perfil.
function fichaPerfil(perfil) {
  const p = (perfil && perfil.persona) || {}, c = (perfil && perfil.caso) || {}, out = [];
  GUION.fichaPersona.forEach(f => { if (p[f[0]] != null && p[f[0]] !== "") out.push([f[1], String(p[f[0]])]); });
  if (c.diagnostico) out.push(["Diagnóstico", c.diagnostico]);
  if (c.diaRuta != null) out.push(["Dónde va el caso", "Día " + c.diaRuta + " de incapacidad" + (c.origenEnDisputa ? "; el origen sigue sin definirse" : "")]);
  const af = p.afiliaciones || {};
  if (af.eps || af.arl || af.pensiones) out.push(["Afiliaciones", [af.eps, af.arl, af.pensiones].filter(Boolean).join(", ")]);
  return out;
}
// El contenido de un campo: el del perfil si lo trae, y si no el nombre del campo del blueprint.
function campoPerfil(perfil, pieza, i) {
  const e = ((perfil || {}).evidencia || {})[pieza];
  const v = e && e.campos ? e.campos[i] : null;
  return v == null || v === "" ? null : String(v);
}
/* Lo que de verdad llega de cada pieza en la ruta de hoy, según el estado del caso:
   si la pieza llegó, con qué campos, y qué campos el perfil declara que hoy no llegan. */
function expedienteHoy(E, perfil, pasoId) {
  return RAMAS.piezasDe(pasoId).map(k => {
    const st = (E.piezas || {})[k] || {}, ev = ((perfil || {}).evidencia || {})[k] || {}, falta = ev.faltaHoy || [];
    return { k:k, llego:!!st.llego, conVersion:!!st.conVersion, propia:false,
      campos:EV[k].campos.map((n, i) => ({ n:n, i:i,
        v:st.llego && (st.campos == null || st.campos.indexOf(i) >= 0) && falta.indexOf(i) < 0 ? campoPerfil(perfil, k, i) : null })) };
  });
}
// Lo que el módulo le abriría al actor en ese paso: su vista mínima por contrato.
function expedienteModulo(perfil, actor, pasoId) {
  return RAMAS.piezasDe(pasoId).map(k => {
    const propia = EV[k].cust === actor;
    const v = propia ? EV[k].campos.map((c, i) => i) : vistaDe(actor, k, pasoId);
    return { k:k, abierta:!!v, propia:propia,
      campos:EV[k].campos.map((n, i) => ({ n:n, i:i, v:v && v.indexOf(i) >= 0 ? campoPerfil(perfil, k, i) : null })) };
  });
}
// Campos que el módulo añadiría a lo que hoy llega: es la diferencia que el participante compara.
function camposQueAnade(E, perfil, actor, pasoId) {
  const hoy = expedienteHoy(E, perfil, pasoId), mod = expedienteModulo(perfil, actor, pasoId), out = [];
  mod.forEach((m, j) => m.campos.forEach(c => { if (c.v && !hoy[j].campos[c.i].v) out.push({ pieza:m.k, n:c.n, v:c.v }); }));
  return out;
}
const camposTxt = (pz, idx) => idx.map(i => EV[pz].campos[i]).join(", ");
const retenidosTxt = (pz, idx) => EV[pz].campos.filter((c, i) => idx.indexOf(i) < 0).join(", ");

/* ---------- Registros (bitácora de solo anexar) ---------- */
function vigentesDe(regs) { const r = {}; regs.forEach(x => { if (x.reemplaza) r[x.reemplaza] = 1; }); return regs.filter(x => !r[x.id]); }

// Qué respondió un participante en una actividad, en una frase corta.
function resumenActividad(pl) {
  if (!pl) return "";
  if (pl.tipo === "decide") return (pl.decisionTxt || pl.decision || "") + " · información " + (pl.suficiencia || "—");
  if (pl.tipo === "custodia") return etiqueta(ESC.respCustodia, pl.respuesta) + " · " + plural(num(pl.dias), "día", "días");
  if (pl.tipo === "focal") return etiqueta(ESC.focal.sabe, pl.sabe);
  if (pl.tipo === "soporte") return etiqueta(ESC.soporte.ve, pl.ve) + " · " + etiqueta(ESC.soporte.accion, pl.accion);

/* ---------- Validación de documentos ---------- */
const RE_ID = /^[a-z0-9][a-z0-9._-]{0,39}$/;
function validarConfig(c) {
  const e = [];
  if (!c || typeof c !== "object") return ["no hay configuración"];
  if (c.formato !== FORMATO) e.push("formato de configuración no reconocido");
  if (!c.estudio || !RE_ID.test(String(c.estudio.id || ""))) e.push("falta el identificador del estudio");
  if (!Array.isArray(c.cuentas) || !c.cuentas.length) e.push("no hay cuentas de participantes");
  (c.cuentas || []).forEach((q, i) => {
    if (!q || !RE_ID.test(String(q.u || "")) || !A[q.a] || !/^[0-9a-f]{8,64}$/.test(String(q.s || "")) || !/^[0-9a-f]{64}$/.test(String(q.h || ""))) e.push("la cuenta " + (i + 1) + " está incompleta");
  });
  const us = (c.cuentas || []).map(q => q && q.u); if (us.some((u, i) => us.indexOf(u) !== i)) e.push("hay usuarios repetidos");

}

  const e = [];
  if (!d || typeof d !== "object") return ["el archivo no contiene un documento"];
  if (d.instrumento !== INSTRUMENTO) e.push("no es un archivo de respuestas de este simulador");
  if (d.formato !== FORMATO) e.push("formato no reconocido");
  if (!d.cuenta || !A[d.cuenta.actor] || !RE_ID.test(String(d.cuenta.usuario || ""))) e.push("falta la cuenta o el rol");
  if (!d.participante || !/^[a-z0-9]{6,40}$/.test(String(d.participante.id || ""))) e.push("falta el identificador del participante");
  if (!d.consentimiento || d.consentimiento.aceptado !== true) e.push("no consta la declaración de participación voluntaria");
  if (!Array.isArray(d.registros)) e.push("no trae registros");
  if (!e.length && d.huella !== huellaDoc(d)) e.push("la huella de integridad no coincide: el archivo fue modificado o está incompleto");
  return e;
}

/* ---------- Descarga de archivos ----------
   Dentro de un visor que bloquea los enlaces de descarga (un artefacto publicado) se usa la capacidad de
   descargas del visor: la persona confirma el guardado y puede rechazarlo. Fuera de él, un enlace de descarga. */
let DL = null, enVisor = false;
async function initDescargas() {
  enVisor = !!(window.claude && typeof window.claude.use === "function");
  if (enVisor) { try { DL = await window.claude.use("downloads"); } catch (e) { DL = null; } }
}
// Devuelve true solo si el archivo se entregó a la persona.
async function descargarArchivo(nombre, datos, mime) {
  if (DL) { try { await DL.save({ filename:nombre, data:datos }); return true; } catch (e) { return false; } }
  if (enVisor) return false;
  try {
    const a = document.createElement("a"), url = URL.createObjectURL(new Blob([datos], { type:mime || "application/octet-stream" }));
    a.href = url; a.download = nombre; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);

  } catch (e) { return false; }

// CSV para hojas de cálculo: separador «;», comillas dobladas y neutralización de fórmulas.

}
const csvTabla = (cols, rows) => [cols.map(csvCelda).join(";")].concat(rows.map(r => r.map(csvCelda).join(";"))).join("\r\n");
/* ============ Simulador: configuración, estado, almacenamiento local y conductor automático ============ */

/* ---------- Configuración: cuentas y datos del estudio ----------
   Una configuración incluida en el propio archivo manda sobre configuracion.js: así un simulador entregado
   como archivo único funciona sin nada más. */
const CFG = (() => {
  const c = window.SIM_CONFIG_INCLUIDA || window.SIM_CONFIG || null;
  // Sin configuración hay tres situaciones: el sitio todavía tiene la plantilla sin cuentas del paquete, al
  // sitio le falta configuracion.js, o es el archivo único de uso real, que no trae cuentas a propósito.

    : ["este archivo es la versión para uso real y no trae el estudio ni cuentas"];

  Object.keys((c && c.estudio) || {}).forEach(k => { if (c.estudio[k] != null && c.estudio[k] !== "") estudio[k] = String(c.estudio[k]); });
  const envio = c && c.envio && typeof c.envio.url === "string" && c.envio.url.trim() ? { url:c.envio.url.trim(), clave:String(c.envio.clave || ""), modo:c.envio.modo === "final" ? "final" : "progresivo" } : null;

    ok:!errores.length, errores, origen:window.SIM_CONFIG_INCLUIDA ? "incluida" : c ? "externa" : null, enSitio, plantilla,

})();

  consent:null,                    // declaración aceptada

   Cada cambio se guarda de inmediato. Se conserva además la versión anterior como respaldo, por si el navegador

  GUION.encuesta.campos.forEach(c => {
    if (!c.req) return;
    if (c.id === "formacionCual" && S.enc.formacion !== "otra") return;
    const v = S.enc[c.id];
    if (v == null || String(v).trim() === "") falta.push(c.n.toLowerCase().replace(/^¿|\?$/g, ""));
  });
  return falta;
}
function guardarEncuesta() {

  const pl = {};

function celdaDe(p, actor, modo) {
  if (p.fase !== "durante") return null;
  const k = ["F1", "F2", "F3", "F5"].filter(f => { const c = BP.celdas[p.id + f]; return c && (c.a === actor || (c.t || []).indexOf(actor) >= 0); })[0];
  return k ? BP.celdas[p.id + k][vModo(modo)] : null;
}
// Qué está pasando con el caso en este paso, en el modo de la ronda.
function relatoPaso(p, modo, conTitulo) {
  const g = GUION.pasos[p.id]; if (!g) return "";
  const t = g[vModo(modo)];
  const sup = modo === "propuesto" && g.supuesto ? `<p class="mini"><b>Supuesto de esta simulación.</b> ${esc(llanoRuta(g.supuesto))}</p>` : "";
  return `<div class="relato">${conTitulo ? `<div class="lbl">${ico(ICO.paso[p.id], "sm")}Paso ${numPaso(p.id)} · ${esc(nomPaso(p))}</div>` : ""}<p>${esc(llanoRuta(t))}</p>${g.enJuego ? `<p class="mini en-juego">${ico("capitulos-decision-avance", "sm")}<b>Qué se juega aquí.</b> ${esc(llanoRuta(g.enJuego))}</p>` : ""}${sup}</div>`;
}
/* Lo que le compete al rol en este paso y la base legal de esa competencia, a la vista y no plegada:
   el encargo del catálogo doctoral (SIM.retos), el responsable y el plazo que supone el proyecto
   (BP.celdas), las normas que lo sustentan (SIM.normas) y los precedentes del actor (BP.actores). */
function competenciaHtml(p, actor, modo) {
  const C = GUION.competencia, ac = A[actor] || {};
  const reto = SIM.retos.filter(x => x.actor === actor && (x.etapa === p.id || x.etapa === "*") && GUION.retosOmitidos.indexOf(x.id) < 0)[0], c = celdaDe(p, actor, modo);
  if (!reto && !c) return "";
  return `<div class="situacion"><div class="lbl">${ico("navegacion-escenario", "sm")}${esc(C.titulo)}</div>
    ${reto ? `<p><b>${esc(llanoRuta(reto.titulo))}${/[.?!]$/.test(reto.titulo) ? "" : "."}</b> ${esc(llanoRuta(reto[vModo(modo)]))}</p>` : ""}
    ${c ? `<div class="kv"><b>${esc(C.plazoTitulo)}</b><span>${esc(llanoRuta(c.r).replace(/^responde —\s*(·\s*)?/, "Nadie responde con claridad" + (/^responde —\s*·/.test(c.r) ? " · " : "")))}</span><b>Registro que debería quedar</b><span>${esc(llanoRuta(c.tz))}</span></div>` : ""}
    ${reto && reto.base && reto.base.length ? `<div class="normas"><div class="lbl mini">${ico("gobernanza-etica", "sm")}${esc(C.normasTitulo)}</div><ul class="lista">${reto.base.map(k => `<li>${esc(SIM.normas[k] || k)}</li>`).join("")}</ul></div>` : ""}
    ${(ac.prec || []).length ? `<p class="mini">${esc(C.precedentesTitulo)}: ${esc(ac.prec.join(" · "))}.</p>` : ""}
    <p class="mini">${esc(C.nota)}</p></div>`;
}

/* El expediente como le llega al actor en este paso: cada pieza, campo por campo, con el contenido
   del perfil del caso, y los vacíos dichos como vacíos. Es «la información que viaja». */
function expedienteHtml(p, actor, modo) {
  const X = GUION.expediente, perfil = perfilActual(), E = casoActual(), piezas = RAMAS.piezasDe(p.id);
  const cab = `<div class="lbl">${ico("documentos-evidencia", "sm")}${esc(X.tituloHoy)}</div>`;
  if (!piezas.length) return `<div class="expediente">${cab}<p class="mini">${esc(X.nada)}</p></div>`;
  const hoy = expedienteHoy(E, perfil, p.id);
  return `<div class="expediente">${cab}<p class="mini">${esc(X.introHoy)}</p>
    ${hoy.map(x => {
      const propia = EV[x.k].cust === actor, llego = x.llego || propia;
      const estado = propia ? X.propia : llego ? (x.conVersion ? X.conVersion : X.sinVersion) : X.noLlego;
      return `<details data-det="exp-${esc(p.id)}-${esc(x.k)}"${llego ? " open" : ""}><summary>${ico(ICO.ev[x.k], "sm")}<b>${esc(EV[x.k].n)}</b> <span class="mini">${esc(estado)}</span></summary>
        ${llego
          ? `<dl class="info">${x.campos.map(c => { const v = propia ? campoPerfil(perfil, x.k, c.i) : c.v; return `<dt>${esc(c.n)}</dt><dd${v ? "" : ' class="regla-no"'}>${esc(llanoRuta(v) || X.vacio)}</dd>`; }).join("")}</dl>`
          : `<p class="mini">Esta pieza la custodia ${esc(nomF(EV[x.k].cust))} y en este punto del caso no llegó a su entidad.</p>`}
      </details>`;
    }).join("")}</div>`;
}

function simuladosHtml(regs, titulo) {

function formActividad(p, act, modo) {

    const conEnt = (ESC.entradas[p.id] || []).length > 0;

    const ay2 = conEnt
      ? (modo === "actual"

    h += `<fieldset><legend>${ico("acciones-decidir", "sm")}3. ¿Qué decide?</legend><p class="mini ayuda">La decisión que usted tomaría en este punto de la ruta, con lo que tiene sobre la mesa.</p>${opt("f", "decision", act.ops, f.decision)}</fieldset>`;
    h += `<fieldset><legend>${ico("gobernanza-responsable-plazo", "sm")}4. ¿Quién responde por esta decisión y en cuántos días?</legend><p class="mini ayuda">Los días son los que le tomaría en la práctica, contando lo que implica reunir, revisar y notificar.</p><div class="row"><label>Responde<select data-in="f-responde"><option value="">Elija…</option><option value="yo" ${f.responde === "yo" ? "selected" : ""}>Mi entidad (${esc(nom(yo))})</option>${BP.actores.filter(a => a.id !== yo).map(a => `<option value="${a.id}" ${f.responde === a.id ? "selected" : ""}>${esc(a.n)}</option>`).join("")}<option value="nadie" ${f.responde === "nadie" ? "selected" : ""}>Nadie claramente</option></select></label><label>Días${dias}</label></div>${modo === "propuesto" ? `<div class="campos" style="margin-top:8px"><span class="mini">¿A quién notifica? El módulo registra el acuse de cada uno.</span><br>${BP.actores.filter(a => a.id !== yo).map(a => `<label><input type="checkbox" data-in="f-notifica" data-arg="${a.id}" ${(f.notifica || []).indexOf(a.id) >= 0 ? "checked" : ""}>${esc(a.corto)}</label>`).join("")}</div>` : ""}</fieldset>`;
  } else if (act.tipo === "custodia") {

  } else if (act.tipo === "focal") {
    h += `<fieldset><legend>${ico("acciones-ver-detalle", "sm")}1. En este momento, ¿sabe qué está pasando con su caso?</legend><p class="mini ayuda">Responda como M.P.: qué entiende ella de lo que ocurre, no lo que usted sabe por su oficio.</p>${opt("f", "sabe", ESC.focal.sabe, f.sabe)}</fieldset>`;
    h += `<fieldset><legend>${ico("gobernanza-responsable-plazo", "sm")}2. ¿A quién le corresponde responderle, y en cuántos días?</legend><p class="mini ayuda">Si desde el lugar de M.P. no está claro quién debe responderle, puede decir que no lo sabe.</p><div class="row"><label>Le responde<select data-in="f-responde"><option value="">Elija…</option>${BP.actores.filter(a => a.id !== "tra").map(a => `<option value="${a.id}" ${f.responde === a.id ? "selected" : ""}>${esc(a.n)}</option>`).join("")}<option value="nadie" ${f.responde === "nadie" ? "selected" : ""}>No sé</option></select></label><label>Días (si lo sabe)${dias}</label></div></fieldset>`;
    h += `<fieldset><legend>${ico("investigacion-reprocesos", "sm")}3. ¿Qué le tocó hacer por su cuenta para que esto avanzara?</legend><p class="mini ayuda">Las gestiones que M.P. o su hermana L.P. tuvieron que hacer ellas mismas en este paso. Puede marcar varias; si en este paso no tuvieron que hacer ninguna, marque «Nada».</p>${opt("fm", "hizo", ESC.focal.hizo, f.hizo, true)}</fieldset>`;
  } else if (act.tipo === "soporte") {
    h += `<fieldset><legend>${ico("acciones-ver-detalle", "sm")}1. ¿Qué alcanza a ver del caso desde su entidad?</legend>${opt("f", "ve", ESC.soporte.ve, f.ve)}</fieldset><fieldset><legend>${ico("acciones-vigilar", "sm")}2. ¿Qué haría con lo que ve?</legend><p class="mini ayuda">Lo que haría de verdad en este punto, con las competencias y los recursos que tiene.</p>${opt("f", "accion", ESC.soporte.accion, f.accion)}</fieldset>`;
  }
  // La comparación con el módulo aparece cuando ya respondió lo suyo, para no contaminar su decisión.
  const listo = act.tipo === "decide" ? !!f.decision : act.tipo === "custodia" ? !!f.respuesta
    : act.tipo === "focal" ? !!(f.sabe && f.responde && (f.hizo || []).length) : !!(f.ve && f.accion);
  h += listo
    ? comparacionHtml(p, yo)
    : `<p class="mini ayuda" style="margin-top:14px">${ico("actores-modulo", "sm")}Cuando responda lo anterior, aquí aparecerá qué le habría llegado con el módulo propuesto y la pregunta de comparación.</p>`;
  const O = GUION.observacion;
  h += `<fieldset><legend>${ico("acciones-observar", "sm")}${esc(O.titulo)} <span class="mini">(${esc(O.marca)})</span></legend><p class="mini ayuda">${esc(O.ayuda)}</p><textarea data-in="f-obs" aria-label="${esc(O.titulo)}" maxlength="2000" rows="4">${esc(f.obs || "")}</textarea></fieldset>`;
  return h;
}
const ETQ = { suficiencia:"Información", falta:"Faltó", finalidad:"Finalidad", decisionTxt:"Decisión", responde:"Responde", dias:"Días", notifica:"Notifica a", respuesta:"Respuesta", sabe:"Qué sabe", hizo:"Qué tuvo que hacer", ve:"Qué ve", accion:"Acción", comparacion:"Con el módulo", obs:"Lo que añadió" };
function valorTxt(k, v, yo) {
  if (k === "comparacion") {
    const C = GUION.comparacion;
    if (!v || !v.decision) return "";
    return etiqueta(C.ops, v.decision) + (v.cual ? " · «" + v.cual + "»" : "") + (v.dias != null ? " · " + plural(v.dias, "día", "días") : "") + (v.seguridad ? " · " + etiqueta(C.seguridadOps, v.seguridad).toLowerCase() : "");
  }
  if (k === "suficiencia") return etiqueta(ESC.suficiencia, v);
  if (k === "finalidad") return finTxt(v);
  if (k === "responde") return v === "yo" ? "Mi entidad (" + nom(yo) + ")" : v === "nadie" ? (yo === "tra" ? "No sé" : "Nadie claramente") : nomL(v);
  if (k === "notifica") return v.map(nom).join(", ");
  if (k === "falta") return v.map(x => EV[x] ? pzN(x) : x).join(", ");
  if (k === "respuesta") return etiqueta(ESC.respCustodia, v);
  if (k === "sabe") return etiqueta(ESC.focal.sabe, v);
  if (k === "hizo") return v.map(x => etiqueta(ESC.focal.hizo, x)).join(", ");
  if (k === "ve") return etiqueta(ESC.soporte.ve, v);
  if (k === "accion") return etiqueta(ESC.soporte.accion, v);
  return Array.isArray(v) ? v.join(", ") : String(v);
}
function respuestaKv(pl, yo) {
  const hay = k => pl[k] != null && pl[k] !== "" && !(Array.isArray(pl[k]) && !pl[k].length) && !(k === "comparacion" && !pl[k].decision);
  return `<div class="kv done-kv">${Object.keys(ETQ).filter(hay).map(k => `<b>${esc(ETQ[k])}</b><span>${esc(valorTxt(k, pl[k], yo))}</span>`).join("")}</div>`;
}

/* Qué pasó en el caso con esa respuesta: la consecuencia de lo que el participante decidió, lo que
   hicieron los actores que no están conectados, y cómo queda el caso para los pasos que siguen. */
function consecuenciaHtml(p, reg, efectos) {
  const K = GUION.consecuencia, G = GUION.guardado, E = casoActual(), pl = reg.payload;
  const cual = pl.tipo === "decide" ? (pl.extra ? "extra" : "main") : pl.tipo;
  const valor = pl.tipo === "decide" ? pl.decision : pl.tipo === "custodia" ? pl.respuesta : pl.tipo === "soporte" ? pl.accion : null;
  const mia = valor ? textoOpcion(p.id, cual, valor, E) : "";
  const dec = vigentes().filter(x => x.tipo === "decision" && x.paso === p.id && x.payload.origenActividad === reg.id);
  const otros = dec.map(x => {
    const t = textoOpcion(p.id, x.payload.cual, x.payload.valor, E);
    const lab = mayus(nomF(x.payload.de));
    return `<li>${ico("actores-modulo", "sm")}<span>${t.indexOf(lab) === 0 ? "" : `<b>${esc(lab)}.</b> `}${esc(t)}${x.payload.forzado ? ` <span class="mini">${esc(K.forzado)}</span>` : ""}</span> ${chipSim}</li>`;
  }).join("");
  const est = RAMAS.resumenEstado(E);
  return `<div class="consecuencia"><div class="lbl">${ico("capitulos-decision-avance", "sm")}${esc(K.titulo)}</div>
    ${mia ? `<p>${esc(mia)}</p>` : ""}
    ${otros ? `<div class="lbl mini">${esc(K.sistema)}</div><ul class="lista limpia">${otros}</ul>` : ""}
    ${efectos.length ? simuladosHtml(efectos, G.efectos) + `<p class="mini">${esc(G.efectosNota)}</p>` : ""}
    <div class="lbl mini">${esc(K.estado)}</div><div class="kv">${est.map(x => `<b>${esc(x[0])}</b><span>${esc(x[1])}</span>`).join("")}</div></div>`;
}
// Una línea con el caso: quién es y dónde va, para la barra lateral.
function resumenCaso(perfil) {
  const p = (perfil && perfil.persona) || {}, c = (perfil && perfil.caso) || {};
  return [p.nombre, p.cargo ? String(p.cargo).toLowerCase() : null, c.diaRuta != null ? "día " + c.diaRuta : null].filter(Boolean).join(" · ");
}
const sigTxt = sig => sig ? "Continuar al paso " + numPaso(sig.pasos[0]) : "Continuar al cierre del recorrido";
function contratoHtml(a) {

/* ---------- Continuar en otro dispositivo ----------

/* ============ Expediente: pantallas ============ */

/* ---------- Piezas comunes ---------- */
const CHIP_ESTADO = { conforme:"ch-teal", no_conforme:"ch-red", ausente:"ch-grey", pendiente:"ch-gold" };
function chipSoporte(est) {

}
const horasTxt = h => decimalCo(h) + " h";

/* Dónde interviene el rol en el expediente, para la pantalla de orientación. */
function intervencionExpHtml(actor) {
  const caso = casoVista(), a = EXPM.actorDe(caso, actor);
  if (!a) return `<p class="mini">${esc(GUION.exp.sinPapel)}</p>`;
  // Misma regla que EXPM.bloques: lo que viene después de la decisión que resuelve es tramo ilustrativo.
  let iRes = -1; caso.puntos.forEach((p, j) => { if (p.resuelve) iRes = j; });
  const filas = caso.puntos.map((p, j) => {
    const como = iRes >= 0 && j > iRes ? "ilustra" : EXPM.participa(caso, actor, p);
    return `<tr><td class="nw"><b>${j + 1}</b></td><td>${esc(p.n)}</td><td>${esc(como === "decide" ? "Decide" : como === "aporta" ? "Aporta la evidencia que custodia" : como === "ilustra" ? "Lo lee como tramo ilustrativo" : "No interviene")}</td></tr>`;
  }).join("");
  return `<div class="twrap"><table class="t apila"><thead><tr><th scope="col">Punto</th><th scope="col">Decisión</th><th scope="col">Qué hace usted</th></tr></thead><tbody>${filas}</tbody></table></div>
    <p class="mini">${esc(papelTxt(caso, a))}</p>`;
}

function expSoporteHtml(caso, E, cond, k, puedeActuar, puntoId) {
  const s = EXPM.soporteDe(caso, k), x = E.soportes[k], X = GUION.punto;

  const acciones = [];
  if (puedeActuar) {
    acciones.push(["consultar", "Consultar"]);
    if (!x.llegado || x.estado === "no_conforme") acciones.push(["solicitar", x.llegado ? "Solicitar la versión correcta" : "Solicitar el soporte"]);
    if (x.llegado && x.verificado === null && x.estado !== "conforme") { acciones.push(["aceptar", "Verificar y aceptar"]); acciones.push(["rechazar", "Verificar y rechazar"]); }
    if (x.llegado && x.estado === "no_conforme") acciones.push(["devolver", "Devolver al custodio"]);

  return `<details data-det="sop-${esc(cond)}-${esc(puntoId)}-${esc(k)}"${x.estado !== "conforme" ? " open" : ""}>

      : x.estado === "ausente" && x.solicitado ? "Se devolvió al custodio: mientras no llegue la versión correcta, no está en el expediente."

    <div class="kv"><b>${esc(X.criterioTitulo)}</b><span>${esc(s.criterio)}</span>${visible || x.estado === "conforme" ? `<b>Contenido</b><span>${esc(s.contenido)}</span>` : ""}</div>

  </details>`;

  const m = /[#&]u=([^&]+)/.exec(location.hash || ""); if (m) { try { S.acc.u = decodeURIComponent(m[1]); } catch (e) {} }
  // Recarga de la página o cierre inesperado del navegador con la pestaña restaurada: se retoma sin pedir la contraseña.
  const u = CFG.ok ? sesionRecordada() : "";
  if (u) { const q = CFG.cuentas.filter(x => x.u === u)[0]; if (q && cargarLocal(u)) { abrirCuenta(q); S.retomar = null; } }
  render();
  reintentarEnvio();
  // En el sitio web, un service worker deja abrir la página sin conexión después de la primera visita.
  if (CFG.origen === "externa" && "serviceWorker" in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register("sw.js").catch(() => {});
  revisarConfiguracion();
  await initDescargas();
})();
})();
</script>
