<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel del investigador · Simulación de la ruta de incapacidad</title>
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<style>
  /* ===== Sistema visual tomado del video de referencia: azul marino profundo, blanco, grises fríos, verde de avance ===== */
  :root { color-scheme: light;
    --navy:#162546; --navy-deep:#142543; --navy-ink:#0F1B33; --navy-2:#1F3159; --on-navy:#FFFFFF;
    --canvas:#FDFDFD; --surface:#FFFFFF; --surface-2:#F3F4F6; --bar:#EAECF0; --band:#E5E6EA; --node:#F0F1F2; --code-bg:#E6EBF1; --tint:#E1EAF3; --tint-border:#4B82B8;
    --slate:#5A5F66; --slate-2:#4E545C; --on-slate:#FFFFFF;
    --text:#2D313F; --text-2:#4E5563; --muted:#5F6470; --muted-deco:#868789; --line:#DCDFE5; --line-2:#C9CED6; --grid:#D7D7D7; --connector:#8FA6C8;
    --green:#3E9167; --green-ink:#2E7A52; --green-dark:#26663F; --green-soft:#EAF5EE; --link:#2F6DB5; --red:#B22F29; --red-soft:#FBE4E2; --gold:#B7791F; --gold-soft:#F8ECD6; --gold-ink:#7A4E0E; --grey:#5F6470; --grey-soft:#EEEFF2;
    /* alias conservados para el informe exportado y las reglas heredadas */
    --ui-primary:#162546; --ui-primary-hover:#0F1B33; --ui-canvas:var(--canvas); --ui-surface:var(--surface); --ui-surface-subtle:var(--surface-2); --ui-hover:#E9EBEF; --ui-pressed:#DADDE3; --ui-text:var(--text); --ui-text-secondary:var(--text-2); --ui-text-muted:var(--muted); --ui-border:var(--line); --ui-border-strong:var(--line-2); --ui-selected:var(--tint); --ui-selected-text:var(--navy); --ui-focus:#4B82B8; --ui-on-primary:#FFFFFF; --ui-shadow:0 10px 30px rgba(20,37,67,.22);
    --teal:var(--green-ink); --teal-soft:var(--green-soft); --on-teal:#FFFFFF; --on-red:#FFFFFF; --on-gold:#1A1A1A; }

  /* ===== Base ===== */
  * { box-sizing:border-box; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  body { margin:0; min-height:100vh; background:var(--canvas); color:var(--text); font:15px/22px "Roboto","Segoe UI",Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; }
  body:is([data-rol="participante"],[data-rol="elegir"]) { background:var(--navy-deep); }
  h1,h2,h3,h4 { margin:0; font-weight:700; text-wrap:balance; color:var(--text); } h1 { font-size:26px; line-height:32px; } h2 { font-size:18px; line-height:24px; } h3 { font-size:16px; line-height:22px; }
  p { margin:0 0 8px; } button { font:inherit; cursor:pointer; } button:disabled { cursor:default; }
  input,select,textarea { font:inherit; color:var(--text); background:var(--surface); border:1px solid var(--line-2); border-radius:6px; padding:8px 12px; min-height:42px; line-height:22px; }
  input[type="checkbox"], input[type="radio"] { min-height:0; width:17px; height:17px; margin:0 6px 0 0; vertical-align:-3px; accent-color:var(--navy); }
  input:hover, select:hover, textarea:hover { border-color:#AEB6C2; } input:focus, select:focus, textarea:focus { border-color:var(--tint-border); box-shadow:0 0 0 3px rgba(75,130,184,.18); outline:none; }
  input:disabled, select:disabled, textarea:disabled { color:var(--muted); background:var(--surface-2); border-color:var(--line); }
  select { max-width:100%; } .actividad fieldset select { max-width:100%; }
  textarea { width:100%; min-height:96px; resize:vertical; font-family:"Roboto Mono",Consolas,monospace; font-size:14px; }
  :is(button,a,[tabindex]):focus-visible { outline:2px solid var(--tint-border); outline-offset:2px; }
  a { color:var(--link); font-weight:500; } a:hover { color:var(--navy); }
  .mono { font-family:"Roboto Mono",Consolas,monospace; font-size:13px; }
  .wrap { width:100%; max-width:1320px; margin:0 auto; padding:0 24px 32px; flex:1; } @media (max-width:900px) { .wrap { padding:0 16px 24px; } } @media (max-width:600px) { .wrap { padding:0 12px 20px; } }
  .hide { display:none !important; } .sp { flex:1; }

  /* ===== Cabecera de aplicación: marca | título / subtítulo · lado derecho contextual ===== */
  .appbar { display:flex; align-items:center; gap:18px; min-height:64px; padding:10px 32px; background:var(--surface); border-bottom:1px solid var(--line); }
  .brand { display:flex; align-items:center; gap:12px; padding-right:18px; border-right:1px solid var(--line); flex:none; }
  .brand-mark { width:36px; height:36px; border-radius:8px; background:var(--navy); color:#fff; display:inline-flex; align-items:center; justify-content:center; } .brand-mark .bp-icon { width:20px; height:20px; }
  .brand-text { display:flex; flex-direction:column; line-height:18px; } .brand-text b { font-size:15px; color:var(--text); } .brand-text small { font-size:12px; color:var(--muted); }
  .appbar-title { font-size:17px; line-height:22px; font-weight:700; color:var(--text); flex:1; min-width:0; } body:not([data-rol="entrada"]) .appbar-title { display:none; }
  .appbar-right { display:flex; align-items:center; gap:14px; margin-left:auto; flex:none; font-size:13px; color:var(--text-2); }
  .appbar-right .who { display:flex; align-items:center; gap:10px; } .appbar-right .who b { display:block; font-size:13px; color:var(--text); line-height:16px; } .appbar-right .who small { display:block; font-size:12px; color:var(--muted); line-height:16px; }
  .avatar { width:40px; height:40px; border-radius:50%; background:#DADBD9; color:#5A5F66; display:inline-flex; align-items:center; justify-content:center; flex:none; } .avatar .bp-icon { width:22px; height:22px; } .avatar.xl { width:88px; height:88px; } .avatar.xl .bp-icon { width:44px; height:44px; }
  body:is([data-rol="participante"],[data-rol="elegir"]) .appbar { background:var(--navy-deep); border-bottom-color:rgba(255,255,255,.12); } body:is([data-rol="participante"],[data-rol="elegir"]) .brand { border-right-color:rgba(255,255,255,.18); }
  body:is([data-rol="participante"],[data-rol="elegir"]) .brand-text b, body:is([data-rol="participante"],[data-rol="elegir"]) .appbar-right, body:is([data-rol="participante"],[data-rol="elegir"]) .who b { color:#fff; } body:is([data-rol="participante"],[data-rol="elegir"]) .brand-text small, body:is([data-rol="participante"],[data-rol="elegir"]) .who small { color:rgba(255,255,255,.7); } body:is([data-rol="participante"],[data-rol="elegir"]) .brand-mark { background:#fff; color:var(--navy); }
  .appbar-right { flex:0 1 auto; min-width:0; } .who, .who > span:last-child { min-width:0; } .who b, .who small { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:42vw; }
  body:is([data-rol="participante"],[data-rol="elegir"]) .appbar-right .btn.outline { background:transparent; color:#fff; border-color:rgba(255,255,255,.55); } body:is([data-rol="participante"],[data-rol="elegir"]) .appbar-right .btn.outline:hover { background:rgba(255,255,255,.12); }
  @media (max-width:900px) { .appbar { padding:10px 16px; gap:12px; } .appbar-title { font-size:15px; line-height:20px; } } @media (max-width:600px) { .appbar { padding:8px 12px; } .appbar-title { display:none; } .brand-text small { display:none; } .appbar-right .who small { display:none; } .appbar-right .who .avatar { display:none; } }

  /* ===== Barra de página (título del rol + estado de la sesión) ===== */
  .top { position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; min-height:56px; padding:10px 0; font-size:13px; line-height:18px; color:var(--text-2); background:var(--canvas); }
  .top:empty { display:none; } body:not([data-rol="participante"]):not([data-rol="elegir"]) .top { border-bottom:1px solid var(--line); }
  .top .pagetitle { font-size:24px; line-height:30px; font-weight:700; color:var(--text); margin:0 6px 0 0; } .top b { font-weight:700; color:var(--text); } .top .msg { font-weight:500; }
  body:is([data-rol="participante"],[data-rol="elegir"]) .top { background:var(--navy-deep); color:rgba(255,255,255,.85); } body:is([data-rol="participante"],[data-rol="elegir"]) .top .pagetitle, body:is([data-rol="participante"],[data-rol="elegir"]) .top b { color:#fff; }
  body:is([data-rol="participante"],[data-rol="elegir"]) .top .badge { background:rgba(255,255,255,.12); border-color:rgba(255,255,255,.25); color:#fff; } body:is([data-rol="participante"],[data-rol="elegir"]) .top .btn.sec { background:transparent; color:#fff; border-color:rgba(255,255,255,.5); } body:is([data-rol="participante"],[data-rol="elegir"]) .top .btn.sec:hover { background:rgba(255,255,255,.12); }
  body:is([data-rol="participante"],[data-rol="elegir"]) .top .chip.ch-navy { background:rgba(255,255,255,.14); color:#fff; } body:is([data-rol="participante"],[data-rol="elegir"]) .top .msg { color:#9FE0BD; } body:is([data-rol="participante"],[data-rol="elegir"]) .top .msg.err { color:#FFB4AE; }
  .badge { font-family:"Roboto Mono",Consolas,monospace; font-size:12px; line-height:16px; background:var(--code-bg); border:1px solid var(--line); border-radius:4px; padding:3px 8px; color:var(--text); overflow-wrap:anywhere; display:inline-flex; align-items:center; gap:6px; }
  @media (max-width:600px) { .top { position:static; } .top .hm { display:none; } .top .pagetitle { font-size:20px; line-height:26px; }
    .top .msg:not(:empty) { position:fixed; left:12px; right:12px; bottom:12px; z-index:30; padding:10px 14px; border-radius:8px; background:var(--navy-ink); color:#9FE0BD; box-shadow:var(--ui-shadow); font-size:14px; } .top .msg.err:not(:empty) { color:#FFB4AE; } }

  /* ===== Lozenges (chips) y puntos ===== */
  .chip { display:inline-flex; align-items:center; gap:4px; font-size:11px; line-height:16px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; border-radius:4px; padding:2px 7px; white-space:nowrap; border:1px solid transparent; vertical-align:middle; }
  .ch-red { background:var(--red-soft); color:var(--red); } .ch-teal { background:var(--green-soft); color:var(--green-ink); } .ch-gold { background:var(--gold-soft); color:var(--gold-ink); } .ch-grey { background:var(--grey-soft); color:var(--grey); } .ch-navy { background:var(--tint); color:var(--navy); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--grey); margin-right:6px; vertical-align:middle; } .dot.on { background:var(--green); }
  .lbl { font-size:12px; line-height:16px; letter-spacing:.04em; text-transform:uppercase; font-weight:700; color:var(--muted); }
  .mini { font-size:13px; line-height:18px; color:var(--muted); } .msg { font-size:13px; color:var(--green-ink); font-weight:700; } .err, .msg.err { color:var(--red); }

  /* ===== Superficies ===== */
  .card { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:18px 22px; margin-top:16px; } .card h2 { margin-bottom:8px; } .card h3 { margin:12px 0 4px; }
  .card > .row:first-child:has(> h2) { padding-bottom:10px; border-bottom:1px solid var(--line); margin-bottom:12px; } .card > .row:first-child h2 { margin-bottom:0; }
  body:is([data-rol="participante"],[data-rol="elegir"]) .card { border-color:transparent; box-shadow:0 12px 32px rgba(0,0,0,.28); }
  .grid2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px; } @media (max-width:900px) { .grid2 { grid-template-columns:1fr; } } .grid2 > .card { margin-top:16px; }
  .row { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; } .row > label { display:flex; flex-direction:column; gap:4px; font-size:13px; line-height:18px; color:var(--text-2); font-weight:500; } .row input, .row select { min-width:160px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:14px; line-height:20px; } .kv b { font-weight:700; color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.04em; align-self:start; padding-top:2px; }
  details > summary { cursor:pointer; font-weight:500; font-size:14px; color:var(--link); list-style:none; padding:6px 0; } details > summary::-webkit-details-marker { display:none; } details > summary::before { content:"▸"; display:inline-block; width:14px; color:var(--muted); } details[open] > summary::before { content:"▾"; }
  details.card > summary { padding:0; } details.card[open] > summary { margin-bottom:8px; }
  .foot { margin-top:auto; background:var(--bar); color:var(--text-2); font-size:13px; line-height:18px; padding:14px 24px; text-align:center; } .foot .sep { margin:0 12px; color:var(--muted-deco); }
  body:is([data-rol="participante"],[data-rol="elegir"]) .foot { background:var(--navy-deep); color:rgba(255,255,255,.85); border-top:1px solid rgba(255,255,255,.12); }

  /* ===== Botones ===== */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 18px; border:1px solid var(--navy); background:var(--navy); color:#fff; border-radius:6px; font-weight:700; font-size:15px; line-height:20px; white-space:nowrap; letter-spacing:.01em; }
  .btn:hover { background:var(--navy-ink); border-color:var(--navy-ink); } .btn:active { filter:brightness(.9); } .btn .bp-icon { color:inherit; }
  .btn.sec { background:var(--bar); color:var(--navy); border-color:var(--bar); font-weight:500; } .btn.sec:hover { background:#DDE1E7; border-color:#DDE1E7; }
  .btn.outline { background:var(--surface); color:var(--text); border-color:var(--line-2); font-weight:500; } .btn.outline:hover { background:var(--surface-2); }
  .btn.green { background:var(--green-ink); border-color:var(--green-ink); color:#fff; border-radius:999px; padding:0 20px; } .btn.green:hover { background:var(--green-dark); border-color:var(--green-dark); }
  .btn.danger { background:var(--surface); color:var(--red); border-color:var(--red); font-weight:500; } .btn.danger:hover { background:var(--red-soft); }
  .btn.big { width:100%; height:50px; font-size:17px; border-radius:6px; } .btn.sm { height:32px; padding:0 12px; font-size:13px; }
  .btn:disabled, .btn:disabled:hover { background:#C4C7CE; color:#fff; border-color:#C4C7CE; filter:none; }
  .optrow { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 10px; }
  .optrow button { min-height:36px; border:1px solid var(--line-2); background:var(--surface); color:var(--text); border-radius:6px; padding:6px 14px; font-size:14px; font-weight:500; text-align:left; }
  .optrow button:hover { background:var(--surface-2); } .optrow button[aria-pressed="true"] { background:var(--tint); color:var(--navy); border-color:var(--tint-border); box-shadow:inset 0 0 0 1px var(--tint-border); font-weight:700; }
  fieldset { border:0; padding:0; margin:14px 0 0; min-width:0; } legend { font-weight:700; font-size:15px; line-height:20px; padding:0; margin-bottom:6px; color:var(--text); }
  .campos label { display:inline-flex; gap:4px; align-items:center; font-size:14px; line-height:20px; margin:3px 14px 3px 0; }

  /* ===== Entrada: tarjetas de acceso centradas ===== */
  .auth-wrap { display:flex; flex-wrap:wrap; justify-content:center; gap:24px; padding:48px 0 24px; }
  .auth { width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:8px; box-shadow:0 6px 24px rgba(20,37,67,.08); display:flex; flex-direction:column; }
  .auth-body { padding:24px 24px 20px; display:flex; flex-direction:column; gap:12px; flex:1; } .auth-body h2 { font-size:18px; font-weight:500; color:var(--text); margin:0; } .auth-body h2 .bp-icon { color:var(--navy); }
  .auth-body label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--text-2); font-weight:500; } .auth-body input, .auth-body select { width:100%; min-width:0; }
  .auth-body .btn { width:100%; height:46px; margin-top:4px; }
  .auth-foot { border-top:1px solid var(--line); background:var(--surface-2); padding:14px 24px; text-align:center; font-size:14px; border-radius:0 0 8px 8px; } .auth-foot .mini { margin:0; }
  .auth .avatar { margin:0 auto 4px; } .auth .actor-lbl { text-align:center; font-weight:700; font-size:18px; color:var(--text); }
  .auth-divider { display:flex; align-items:center; gap:10px; color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.06em; margin:6px 0 2px; } .auth-divider::before, .auth-divider::after { content:""; flex:1; border-top:1px solid var(--line); }
  .intro { max-width:820px; margin:8px auto 0; text-align:center; color:var(--text-2); font-size:15px; }
  .code-box { background:var(--code-bg); border-radius:8px; padding:16px 20px; text-align:center; margin:8px auto; max-width:480px; } .code-lbl { font-size:13px; color:var(--text-2); font-weight:500; } .code-big { font-size:56px; line-height:64px; font-weight:900; letter-spacing:.08em; color:var(--navy); font-family:"Roboto","Segoe UI",Arial,sans-serif; }

  /* ===== Participante: tarjeta grande con barra lateral y contenido principal ===== */
  .pcard { display:grid; grid-template-columns:260px minmax(0,1fr); gap:28px; background:var(--surface); border-radius:12px; padding:28px; margin-top:8px; box-shadow:0 14px 40px rgba(0,0,0,.3); }
  @media (max-width:900px) { .pcard { grid-template-columns:1fr; gap:20px; padding:20px 16px; } .pmain { order:1; } .pside { order:2; } }
  .pside { display:flex; flex-direction:column; align-items:center; gap:10px; } .pside .pside-actor { font-size:20px; font-weight:700; color:var(--text); text-align:center; } .pside .pside-name { font-size:14px; color:var(--text-2); text-align:center; margin-top:-6px; }
  .callouts { display:flex; flex-direction:column; gap:12px; width:100%; margin-top:10px; }
  .callout { position:relative; background:var(--slate); color:var(--on-slate); border-radius:6px; padding:12px 26px 12px 14px; font-size:14px; line-height:20px; clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 50%, calc(100% - 12px) 100%, 0 100%); }
  .callout b { display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:rgba(255,255,255,.88); margin-bottom:2px; } .callout .bp-icon { color:#fff; }
  .pmain { min-width:0; }
  .pmain-head { display:flex; flex-wrap:wrap; align-items:flex-start; gap:12px 16px; margin-bottom:16px; } .pmain-head .eyebrow { font-size:14px; line-height:18px; color:var(--muted); font-weight:400; margin:0 0 2px; } .pmain-head .h1 { font-size:26px; line-height:32px; margin:0; } .pmain-head .h1 > .bp-icon { vertical-align:-5px; margin-right:8px; } .pmain-head .head-right { margin-left:auto; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .step-banner { display:flex; align-items:center; gap:0; background:var(--bar); border-radius:6px; overflow:hidden; min-height:52px; margin-bottom:16px; }
  .step-tag { display:inline-flex; align-items:center; justify-content:center; background:var(--navy); color:#fff; font-weight:900; font-size:22px; letter-spacing:.02em; height:52px; min-width:70px; padding:0 22px 0 18px; clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%); flex:none; }
  .step-tag.sm { height:26px; min-width:44px; font-size:13px; padding:0 14px 0 10px; clip-path:polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%); border-radius:3px 0 0 3px; }
  .step-name { font-weight:700; font-size:18px; color:var(--text); padding:0 16px; flex:1 1 160px; min-width:0; } .step-day { font-size:13px; color:var(--muted); padding-right:12px; flex:0 1 auto; min-width:0; text-align:right; } .step-banner .chev { color:var(--text-2); font-size:22px; padding:0 16px; }
  .qpanel { background:var(--tint); border-left:4px solid var(--tint-border); border-radius:6px; padding:12px 16px; font-size:15px; line-height:22px; font-weight:500; color:var(--text); margin-bottom:12px; } .qpanel .mini { margin:4px 0 0; color:var(--text-2); font-weight:400; }
  .panel { border:1px solid var(--line); border-radius:8px; padding:16px 18px; margin-top:12px; } .panel-title { font-size:15px; color:var(--text-2); border-bottom:1px solid var(--line); padding-bottom:8px; margin-bottom:8px; }
  .actividad fieldset { border:1px solid var(--line); border-radius:8px; padding:10px 16px 12px; margin-top:12px; } .actividad legend { padding:0 6px; }
  .done-kv { margin:8px 0; }

  /* ===== Facilitador: stepper de momentos en flecha ===== */
  .stepper { display:flex; gap:4px; margin:16px 0 4px; overflow-x:auto; padding-bottom:2px; }
  .stepper button { flex:1 1 auto; min-width:150px; height:48px; border:0; background:var(--bar); color:var(--navy); font-weight:700; font-size:15px; display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:0 26px 0 30px; clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%, 16px 50%); white-space:nowrap; }
  .stepper button:first-child { clip-path:polygon(0 0, calc(100% - 16px) 0, 100% 50%, calc(100% - 16px) 100%, 0 100%); border-radius:6px 0 0 6px; padding-left:22px; }

function claveFoco(el) {
  if (!el || !el.getAttribute) return null;
  const k = { act:el.getAttribute("data-act"), inp:el.getAttribute("data-in"), arg:el.getAttribute("data-arg"), v:el.getAttribute("data-v") };
  return k.act || k.inp ? k : null;
}
function buscarFoco(raiz, k) {
  const attr = k.inp ? "data-in" : "data-act", val = k.inp || k.act;
  return [...raiz.querySelectorAll("[" + attr + "]")].filter(x => x.getAttribute(attr) === val && x.getAttribute("data-arg") === k.arg && x.getAttribute("data-v") === k.v)[0] || null;
}
// Reemplaza el contenido solo si cambió. Con `conservar` mantiene desplazamientos, paneles abiertos, foco y cursor.
function setHtml(el, h, conservar) {
  if (el.__last === h) return false;
  el.__last = h;
  const ae = document.activeElement;
  const foco = ae && el.contains(ae) ? claveFoco(ae) : null;
  let cursor = null;
  if (foco && foco.inp) { try { if (typeof ae.selectionStart === "number") cursor = [ae.selectionStart, ae.selectionEnd]; } catch (e) {} }
  const desliz = conservar ? [...el.querySelectorAll(".sb-wrap,.twrap")].map(x => [x.scrollLeft, x.scrollTop]) : [];
  const abiertos = {};
  if (conservar) el.querySelectorAll("details[data-det]").forEach(d => { abiertos[d.getAttribute("data-det")] = d.open; });
  el.innerHTML = h;
  el.querySelectorAll(".sb-wrap,.twrap").forEach((x, i) => { if (desliz[i]) { x.scrollLeft = desliz[i][0]; x.scrollTop = desliz[i][1]; } });
  el.querySelectorAll("details[data-det]").forEach(d => { const k = d.getAttribute("data-det"); if (k in abiertos) d.open = abiertos[k]; });
  if (foco) {
    const x = buscarFoco(el, foco);
    if (x && x !== document.activeElement) { try { x.focus({ preventScroll:true }); if (cursor && x.setSelectionRange) x.setSelectionRange(cursor[0], cursor[1]); } catch (e) {} }
  }
  return true;
}

function leerAlmacen() {

  const admin = { sal:a.sal, huella:a.huella, iter:parseInt(a.iter, 10) > 0 ? parseInt(a.iter, 10) : KDF.iter, sesion:/^[0-9a-f]{64}$/.test(String(a.sesion || "")) ? a.sesion : "" };
  // Formato anterior: un único proyecto dentro del índice.

  const fichas = (Array.isArray(j.estudios) ? j.estudios : []).map(x => esObjeto(x) && RE_CLAVE_EST.test(String(x.clave || "")) ? { clave:x.clave, id:textoLimpio(x.id, 40), titulo:textoLimpio(x.titulo, 160), creado:+x.creado || 0, modificado:+x.modificado || 0, cuentas:+x.cuentas || 0, respuestas:+x.respuestas || 0, completas:+x.completas || 0 } : null).filter(Boolean);

// Entradas guardadas o de una copia de seguridad: cada documento se valida otra vez antes de aceptarlo.
function leerEntradas(lista) {
  const entradas = [], porId = mapaVacio(); let descartadas = 0;
  lista.forEach(x => {
    const doc = esObjeto(x) ? (x.doc || x.documento) : null;
    if (!esObjeto(doc) || validarRespuesta(doc).length || estructuraRespuesta(doc).length) { descartadas++; return; }
    const e = { doc, importado:typeof x.importado === "number" ? x.importado : ahora(), origen:x.origen === "servidor" ? "servidor" : "archivo", archivo:textoLimpio(x.archivo, 160), recibido:typeof x.recibido === "string" ? textoLimpio(x.recibido, 40) : null, excluida:x.excluida === true, ausente:typeof x.ausente === "number" ? x.ausente : null };
    const previo = porId[doc.participante.id];
    if (previo && fechaIso(previo.doc.generado) >= fechaIso(doc.generado)) return;
    if (previo) entradas.splice(entradas.indexOf(previo), 1);
    porId[doc.participante.id] = e; entradas.push(e);
  });
  return { entradas, descartadas };
}
function normalizarCuenta(q, deConfianza) {
  if (!esObjeto(q)) return null;
  const u = normUsuario(q.u), clave = textoLimpio(q.clave, 60).trim();
  if (!RE_ID.test(u) || !esRol(q.a) || normClave(clave).length < 4) return null;
  const c = { u, a:q.a, etiqueta:textoLimpio(q.etiqueta, 160), clave, s:/^[0-9a-f]{8,64}$/.test(String(q.s || "")) ? q.s : hex(azar(8)), p:q.p === true, creada:typeof q.creada === "number" ? q.creada : ahora() };
  if (deConfianza && /^[0-9a-f]{64}$/.test(String(q.h || "")) && typeof q.hd === "string") { c.h = q.h; c.hd = q.hd; }
  return c;
}
// Completa y limpia un proyecto leído del almacenamiento o de una copia de seguridad (que es un archivo no confiable).
function normalizarProyecto(p, deConfianza) {
  const base = proyectoNuevo(), avisos = [];
  if (!esObjeto(p)) return { proyecto:base, avisos:["no trae los datos del proyecto"] };
  const e = esObjeto(p.estudio) ? p.estudio : {};
  CAMPOS_ESTUDIO.forEach(k => { if (e[k] != null) base.estudio[k] = textoLimpio(e[k], LARGO_ESTUDIO[k]); });
  if (esObjeto(p.consentimiento)) { base.consentimiento.version = textoLimpio(p.consentimiento.version, 20) || base.consentimiento.version; base.consentimiento.adicional = textoLimpio(p.consentimiento.adicional, 2000); }
  base.url = textoLimpio(p.url, 300);
  const en = esObjeto(p.entrega) ? p.entrega : {};
  base.entrega = { forma:en.forma === "servidor" ? "servidor" : "archivo", url:textoLimpio(en.url, 300) || "recibir.php", modo:en.modo === "final" ? "final" : "progresivo", clave:RE_CLAVE_SERVIDOR.test(String(en.clave || "")) ? en.clave : "", claveAdmin:RE_CLAVE_SERVIDOR.test(String(en.claveAdmin || "")) ? en.claveAdmin : "" };
  const vistos = mapaVacio(); let malas = 0;
  (Array.isArray(p.cuentas) ? p.cuentas : []).forEach(q => { const c = normalizarCuenta(q, deConfianza); if (!c || vistos[c.u]) { malas++; return; } vistos[c.u] = 1; base.cuentas.push(c); });
  if (malas) avisos.push(plural(malas, "cuenta no se pudo leer y se omitió", "cuentas no se pudieron leer y se omitieron"));
  if (typeof p.invitacion === "string" && p.invitacion.trim()) base.invitacion = textoLimpio(p.invitacion, 4000);
  base.incluirPruebas = p.incluirPruebas === true;
  if (typeof p.creado === "number") base.creado = p.creado;
  if (typeof p.modificado === "number") base.modificado = p.modificado;
  const firma = x => esObjeto(x) && /^[0-9a-f]{64}$/.test(String(x.firma || ""));
  if (firma(p.config) && fechaIso(p.config.generado)) base.config = { firma:p.config.firma, generado:String(p.config.generado) };
  if (firma(p.publicado) && fechaIso(p.publicado.generado)) base.publicado = { firma:p.publicado.firma, generado:String(p.publicado.generado), id:textoLimpio(p.publicado.id, 40), config:+p.publicado.config || 0, unico:+p.publicado.unico || 0 };
  if (deConfianza && firma(p.receptorPublicado)) base.receptorPublicado = { firma:p.receptorPublicado.firma, t:+p.receptorPublicado.t || 0 };
  ordenarCuentas(base.cuentas);
  return { proyecto:base, avisos };
}

/* ---------- Clave de administración ----------
   Protege la entrada al panel en este navegador. No cifra lo guardado: quien tenga acceso al equipo puede leerlo. */
function definirClaveAdmin(c1, c2) {
  if (normClave(c1).length < 8) return "La clave debe tener al menos 8 caracteres, sin contar espacios ni guiones.";
  if (normClave(c1) !== normClave(c2)) return "Las dos claves no coinciden.";
  const sal = hex(azar(8));
  // La ficha de sesión se deriva de la clave: con solo leer lo guardado no se puede fabricar un desbloqueo.
  ADMIN = { sal, huella:huellaClave("admin", c1, sal, KDF.iter), iter:KDF.iter, sesion:SHA.hex(fichaSesion(c1, sal, KDF.iter)) };
  return "";
}
const fichaSesion = (clave, sal, iter) => huellaClave("admin", clave, sal + ":sesion", iter);
const claveAdminCorrecta = c => !!ADMIN && igualSeguro(huellaClave("admin", c, ADMIN.sal, ADMIN.iter), ADMIN.huella);

}
function desbloqueoRecordado() {
  try { const f = ADM_ALM.sesion.getItem(ADM_LLAVE_ABIERTO); return !!(ADMIN && ADMIN.sesion && f && igualSeguro(SHA.hex(f), ADMIN.sesion)); } catch (e) { return false; }

// Borra todo lo del panel en este navegador: el índice y todos los estudios.

/* ---------- Varios estudios (sesiones de simulación) ----------
   Cada estudio guarda sus cuentas y las respuestas de sus participantes por separado. El identificador público
   del estudio (estudio.id) es el que viaja en la configuración y en cada respuesta: por él se sabe a qué estudio
   pertenece un archivo que llega. */
const estudiosGuardados = () => IDX.estudios.slice().sort((a, b) => (b.modificado || b.creado || 0) - (a.modificado || a.creado || 0));
const fichaDeClave = c => IDX.estudios.filter(x => x.clave === c)[0] || null;
// Estudio guardado cuyo identificador público coincide con el de un documento que llega.
const estudioConId = id => IDX.estudios.filter(x => x.id && x.id === id)[0] || null;
function abrirEstudio(clave) {
  if (clave === PROY.clave) return true;
  const est = leerEstudio(clave);
  if (!est) return false;
  guardarProyecto(); guardarRespuestas();
  PROY = est.proyecto; RESP = est.respuestas; IDX.actual = clave;
  memoSeguimiento.clear(); guardarIndice();
  if (PROY.entrega.forma === "servidor") prepararEntrega();
  return true;
}
// Crea un estudio nuevo. Con `desde` copia el estudio indicado: sus datos y sus cuentas, nunca sus respuestas.
function crearEstudio(titulo, desde) {
  guardarProyecto(); guardarRespuestas();
  const copia = desde ? leerEstudio(desde) : null;
  const p = copia ? copia.proyecto : proyectoNuevo();
  p.clave = claveEstudioNueva(); p.creado = ahora(); p.modificado = 0;
  p.config = null; p.publicado = null; p.receptorPublicado = null;
  if (copia) {
    p.estudio.id = idLibre(p.estudio.id || "estudio");
    p.cuentas.forEach(q => { q.clave = claveNueva(); q.s = hex(azar(8)); delete q.h; delete q.hd; q.creada = ahora(); });
    if (p.entrega.forma === "servidor") { p.entrega.clave = claveServidorNueva(); p.entrega.claveAdmin = claveServidorNueva(); }
  } else p.estudio.id = idLibre(GUION.estudio.id || "estudio");
  if (String(titulo || "").trim()) p.estudio.titulo = textoLimpio(titulo, 160);
  PROY = p; RESP = []; memoSeguimiento.clear();
  guardarProyecto(); guardarRespuestas();
  return p;
}
// Identificador público libre: si ya hay un estudio con ese id, se numera.
function idLibre(base) {
  const raiz = String(base || "estudio").replace(/-\d+$/, "") || "estudio";
  if (!estudioConId(raiz)) return raiz;
  for (let i = 2; i < 100; i++) { const c = raiz + "-" + i; if (!estudioConId(c)) return c; }
  return raiz + "-" + hex(azar(2));
}
function eliminarEstudio(clave) {
  const f = fichaDeClave(clave); if (!f) return false;
  if (clave === PROY.clave) {
    borrarEstudioGuardado(clave);
    const otra = (estudiosGuardados()[0] || {}).clave;
    if (otra && abrirEstudioForzado(otra)) { guardarIndice(); return true; }
    PROY = proyectoNuevo(); RESP = []; memoSeguimiento.clear(); guardarProyecto(); guardarRespuestas();
    return true;
  }
  borrarEstudioGuardado(clave); guardarIndice();
  return true;
}
function abrirEstudioForzado(clave) {
  const est = leerEstudio(clave); if (!est) return false;
  PROY = est.proyecto; RESP = est.respuestas; IDX.actual = clave; memoSeguimiento.clear();
  return true;
}

/* ---------- Estudio ---------- */
// Datos del estudio como los verá el participante: lo que quede vacío toma el valor del guion.
function estudioEfectivo() {
  const e = Object.assign({}, GUION.estudio);
  CAMPOS_ESTUDIO.forEach(k => { const v = String(PROY.estudio[k] == null ? "" : PROY.estudio[k]).trim(); if (v) e[k] = v; });
  return e;
}
const idEstudioValido = () => RE_ID.test(String(PROY.estudio.id || ""));
// Dirección pública del simulador: solo se acepta http o https.
function urlPublica() {
  const t = String(PROY.url || "").trim(); if (!t) return "";

/* ---------- Receptor del servidor ---------- */
async function llamarReceptor(cuerpo) {
  const url = urlReceptor();
  if (!url) throw new Error("falta la dirección completa del receptor: escriba la dirección pública del simulador en «Estudio»");
  const r = await fetch(url, { method:"POST", headers:{ "Content-Type":"text/plain;charset=UTF-8" }, body:JSON.stringify(cuerpo), cache:"no-store", credentials:"same-origin" });
  const j = await r.json().catch(() => null);
  if (!r.ok || !j || j.ok !== true) throw new Error(j && typeof j.error === "string" ? j.error.slice(0, 300) : r.ok ? "el servidor dio una respuesta que el panel no reconoce" : "el servidor respondió " + r.status);
  return j;
}
async function traerDelServidor() {
  const cuerpo = { accion:"listar", claveAdmin:PROY.entrega.claveAdmin }; if (idEstudioValido()) cuerpo.estudio = PROY.estudio.id;
  const j = await llamarReceptor(cuerpo);
  if (!Array.isArray(j.documentos)) throw new Error("el servidor no devolvió la lista de documentos");
  const filas = j.documentos.map(x => importarDocumento(esObjeto(x) ? x.documento : null, { archivo:"servidor", origen:"servidor", recibido:esObjeto(x) && typeof x.recibido === "string" ? x.recibido : null }));
  // Lo que antes vino del servidor y ya no está allí: la persona pudo haberse retirado.
  const presentes = mapaVacio(); j.documentos.forEach(x => { const d = esObjeto(x) && esObjeto(x.documento) ? x.documento : null; if (d && esObjeto(d.participante) && typeof d.participante.id === "string") presentes[d.participante.id] = 1; });
  let ausentes = 0;
  RESP.forEach(e => { if (e.origen !== "servidor" || e.doc.estudio.id !== PROY.estudio.id) return; if (presentes[e.doc.participante.id]) e.ausente = null; else { if (!e.ausente) e.ausente = ahora(); ausentes++; } });
  const imp = anotarImportacion(filas, j.documentos.length ? "" : "El servidor todavía no tiene documentos de este estudio.");
  imp.ausentes = ausentes; guardarRespuestas();
  return imp;
}
function borrarEnServidor(e) { const d = e.doc; return llamarReceptor({ accion:"borrar", claveAdmin:PROY.entrega.claveAdmin, estudio:d.estudio.id, usuario:d.cuenta.usuario, participante:d.participante.id }); }
const probarReceptor = () => llamarReceptor({ accion:"probar", clave:PROY.entrega.clave, claveAdmin:PROY.entrega.claveAdmin });

/* ---------- Seguimiento: en qué va cada participante ---------- */
// Registros que cuentan: sin los reemplazados ni los efectos del sistema que nacieron de un registro reemplazado.
function vigentesDoc(d) {
  const fuera = mapaVacio(); d.registros.forEach(x => { if (x.reemplaza) fuera[x.reemplaza] = 1; });
  return vigentesDe(d.registros).filter(x => !(x.payload && typeof x.payload.origenActividad === "string" && fuera[x.payload.origenActividad]));
}
const memoSeguimiento = new Map();   // por huella del documento
function seguimientoDe(d) {
  if (memoSeguimiento.has(d.huella)) return memoSeguimiento.get(d.huella);
  const actor = d.cuenta.actor, s = d.sesion, regs = vigentesDoc(d), mios = regs.filter(r => r.origen === "participante");
  const acts = mios.filter(r => r.tipo === "actividad" && r.payload), completa = d.estado === "completa";
  const ids = ESC.rondas.map(r => r.id), iR = ids.indexOf(s.rondaActual), rondasSes = s.rondas || {};
  const estadoRonda = id => (esPropia(rondasSes, id) && rondasSes[id].estado) || "pendiente";
  const est = iR >= 0 ? estadoRonda(s.rondaActual) : "";
  let donde;
  if (completa) donde = { etapa:"Entrega", texto:"Terminó las dos rondas" };
  else if (iR < 0) donde = { etapa:"Simulación", texto:"Aceptó la declaración" };
  else if (est === "pendiente") donde = { etapa:"Simulación", texto:"Ronda " + (iR + 1) + " · por iniciar" };
  else if (est === "valoracion") donde = { etapa:"Simulación", texto:"Ronda " + (iR + 1) + " · cierre de la ronda" };
  else donde = { etapa:"Simulación", texto:"Ronda " + (iR + 1) + " · paso " + (s.pasoActual || "—") + (esPaso(s.pasoActual) ? " · " + PASOS[PIDX[s.pasoActual]].n : "") };
  const rondas = ESC.rondas.map((r, i) => {
    const porPaso = mapaVacio(); acts.forEach(x => { if (x.ronda === r.id && esPaso(x.paso)) porPaso[x.paso] = x; });
    const actual = !completa && s.rondaActual === r.id && est === "en_curso" ? s.pasoActual : null;
    const pasos = PASOS.map(p => { const act = actividadDe(p, actor, r.modo), reg = porPaso[p.id] || null; return { p, act, reg, estado:reg ? (num(reg.version) > 1 ? "rect" : "ok") : actual === p.id ? "cur" : act ? "" : "na" }; });
    const de = t => mios.filter(x => x.ronda === r.id && x.tipo === t && x.payload)[0] || null;
    return { r, i, pasos, esperadas:pasos.filter(x => x.act).length, hechas:pasos.filter(x => x.act && x.reg).length, val:de("valoracion"), pre:de("preguntas"), estado:estadoRonda(r.id) };
  });
  const total = rondas.reduce((n, x) => n + x.esperadas + 1, 0), hechas = rondas.reduce((n, x) => n + x.hechas + (x.pre ? 1 : 0), 0);
  // Problemas: lectura directa de lo que la persona respondió. No se comparan los días con ningún umbral.
  const problemas = [];
  acts.forEach(x => {
    const pl = x.payload, c = esObjeto(pl.comprobacion) ? pl.comprobacion : null, en = t => problemas.push(Object.assign({ ronda:x.ronda, paso:x.paso }, t));
    if (pl.tipo === "decide" && (pl.suficiencia === "parcial" || pl.suficiencia === "insuficiente")) en({ k:pl.suficiencia, n:"información " + pl.suficiencia, t:"decidió con información " + pl.suficiencia + ((pl.falta || []).length ? ": faltó " + pl.falta.map(evSigla).join(", ") : ", sin señalar qué faltó") });
    if (c && c.finalidadAutorizada === false) en({ k:"finalidad", n:"finalidad no autorizada", t:"declaró una finalidad que su contrato no autoriza: «" + finNombre(pl.finalidad) + "»" });
    if (c && (c.piezasDenegadas || []).length) en({ k:"denegadas", n:"piezas denegadas", t:"piezas denegadas frente a su contrato: " + c.piezasDenegadas.map(evSigla).join(", ") });
    if (pl.responde === "nadie") en({ k:"responsable", n:actor === "tra" ? "no sabe quién le responde" : "sin responsable claro", t:actor === "tra" ? "no sabe quién le responde" : "nadie responde claramente por la decisión" });
    if (pl.sabe === "no") en({ k:"sabe", n:"no sabe qué pasa con su caso", t:"no sabe qué pasa con su caso" });
    if (pl.respuesta === "denegar") en({ k:"denego", n:"denegó la entrega", t:"denegó la entrega de la evidencia que custodia" });
  });
  const observaciones = [];
  mios.forEach(x => {
    const pl = x.payload || {};
    if (x.tipo === "actividad" && pl.obs) observaciones.push({ ronda:x.ronda, paso:x.paso, texto:pl.obs, t:x.t });
    if (x.tipo === "observacion" && pl.texto) observaciones.push({ ronda:x.ronda, paso:pl.final ? "cierre" : (pl.pasos || []).length ? pl.pasos.join(", ") : x.paso, texto:pl.texto, final:!!pl.final, t:x.t });
  });
  const g = { completa, donde, rondas, total, hechas, pct:total ? Math.round(hechas * 100 / total) : 0, problemas, observaciones, regs, mios, ultAct:acts[acts.length - 1] || null, ult:mios[mios.length - 1] || null,
    nParticipante:mios.length, nSistema:regs.length - mios.length, nSimulados:regs.filter(r => r.payload && r.payload.simulado === true).length, corregidas:d.registros.length - vigentesDe(d.registros).length };

/* ---------- Copia de seguridad del proyecto ----------
   Lleva el estudio, las cuentas con sus contraseñas, la invitación y las respuestas. No lleva ninguna credencial de
   administración: ni la huella de la clave del panel ni la clave de administración del servidor. */
function copiaSeguridad() {
  const p = clone(PROY);
  delete p.clave;
  delete p.entrega.claveAdmin; delete p.receptorPublicado;
  p.cuentas.forEach(q => { delete q.h; delete q.hd; });
  return { instrumento:INSTRUMENTO, tipo:TIPO_COPIA, formato:FORMATO, version:VERSION, generado:new Date().toISOString(), proyecto:p, respuestas:respuestasOrdenadas().map(e => ({ importado:e.importado, origen:e.origen, archivo:e.archivo, recibido:e.recibido || null, excluida:!!e.excluida, documento:e.doc })) };
}
// Lee una copia de seguridad. Devuelve { error } o { proyecto, respuestas, avisos, generado }.
function leerCopia(texto) {
  let j; try { j = JSON.parse(texto); } catch (e) { return { error:"El archivo no es un JSON legible." }; }
  if (!esObjeto(j) || j.instrumento !== INSTRUMENTO || j.tipo !== TIPO_COPIA) return { error:"El archivo no es una copia de seguridad de este panel." };
  if (j.formato !== FORMATO) return { error:"La copia es de un formato que este panel no reconoce." };
  const n = normalizarProyecto(j.proyecto, false), r = leerEntradas(Array.isArray(j.respuestas) ? j.respuestas : []);
  if (r.descartadas) n.avisos.push(plural(r.descartadas, "documento de respuestas no pasó la validación y se omitió", "documentos de respuestas no pasaron la validación y se omitieron"));
  if (n.proyecto.entrega.forma === "servidor") n.avisos.push("la copia no trae la clave de administración del servidor: escríbala o genere una nueva en «Estudio»");
  return { proyecto:n.proyecto, respuestas:r.entradas, avisos:n.avisos, generado:typeof j.generado === "string" ? fechaIso(j.generado) : 0 };
}
// Restaurar una copia: si ya hay un estudio con el mismo identificador público, se reemplaza; si no, se añade uno.
function aplicarCopia(c) {
  guardarProyecto(); guardarRespuestas();
  const mismo = estudioConId(c.proyecto.estudio.id);
  c.proyecto.clave = mismo ? mismo.clave : claveEstudioNueva();
  PROY = c.proyecto; RESP = c.respuestas; memoSeguimiento.clear();

}

/* ============ Panel del investigador: análisis consolidado de las respuestas ============
   Análisis puro. Recibe documentos de respuestas ya validados y sin duplicados (apartado 6 del contrato) y
   devuelve capítulos y tablas. No lee el estado del panel ni del navegador; solo informeHtml() toma la hoja
   de estilos de la página para armar el documento imprimible.

   Reglas de este módulo:
   · Cada documento es una participación (participante.id) de un rol (cuenta.actor). Siempre se trabaja sobre
     los registros vigentes.
   · Lo que simuló el sistema se cuenta y se rotula aparte de lo que respondieron los participantes.
   · Los días son los que declaró cada persona: se resumen con mínimo, mediana y máximo, y nunca se suman.
   · El informe no muestra nombres ni correos: cada persona aparece con el usuario de su cuenta. La etiqueta
     privada de las cuentas no se usa.
   · Los archivos importados son datos no confiables: nada de lo que traen se usa como llave de un catálogo
     sin comprobarlo y todo texto pasa por esc() al llegar al HTML.
   · Las hipótesis se copian de ESC.hipotesis sin renombrarlas ni interpretarlas. */
const { analizar, vistaResultados, informeHtml, csvDeTabla, csvDeTodas, datosConsolidados } = (() => {

  /* ---------- Datos no confiables, texto y cifras ---------- */
  const lst = x => Array.isArray(x) ? x : [];
  const obj = x => x && typeof x === "object" && !Array.isArray(x) ? x : {};
  // Lectura de un catálogo con una llave que viene de un archivo: solo propiedades propias.
  const own = (o, k) => typeof k === "string" && Object.prototype.hasOwnProperty.call(o, k) ? o[k] : undefined;
  // Texto libre: una sola línea, sin caracteres de control y con un tope de longitud.
  function txt(x, max) {
    const m = max || 2000, s = (typeof x === "string" ? x : typeof x === "number" || typeof x === "boolean" ? String(x) : "").replace(/[\u0000-\u001f\u007f\s]+/g, " ").trim();
    return s.length > m ? s.slice(0, m) + "…" : s;
  }
  const fmtN = x => { const r = Math.round(x * 10) / 10; return Number.isInteger(r) ? String(r) : r.toFixed(1).replace(".", ","); };
  const celN = x => { const r = Math.round(x * 10) / 10; return Number.isInteger(r) ? r : fmtN(r); };   // celda: el entero va como número; el decimal, con coma
  const deN = (k, n) => n ? k + " de " + n + " (" + Math.round(k * 100 / n) + " %)" : "sin datos";
  const cuantos = (k, n) => n ? k + " de " + n : "—";
  // Días declarados: un número mayor o igual a cero, o nada.
  function diasDe(v) {
    const n = typeof v === "number" ? v : typeof v === "string" && v.trim() !== "" ? parseFloat(v.replace(",", ".")) : NaN;
    return isFinite(n) && n >= 0 ? n : null;
  }
  function estad(xs) {
    const v = xs.filter(x => typeof x === "number" && isFinite(x)).sort((a, b) => a - b), n = v.length;
    return n ? { n, min:v[0], med:n % 2 ? v[(n - 1) / 2] : (v[n / 2 - 1] + v[n / 2]) / 2, max:v[n - 1] } : null;
  }
  const diasTxt = xs => { const e = estad(xs); return e ? "mediana " + fmtN(e.med) + " · rango " + fmtN(e.min) + " a " + fmtN(e.max) + " · n " + e.n : "sin datos"; };
  const diasCeldas = xs => { const e = estad(xs); return e ? [e.n, celN(e.min), celN(e.med), celN(e.max)] : [0, "—", "—", "—"]; };
  const COLS_DIAS = ["Días: respuestas", "Días: mínimo", "Días: mediana", "Días: máximo"];
  function contar(xs) { const c = Object.create(null); xs.forEach(x => { const k = typeof x === "string" ? x : ""; c[k] = (c[k] || 0) + 1; }); return c; }
  // «Etiqueta: n · Etiqueta: n» en el orden del catálogo y sin los ceros; lo que no está en el catálogo va al final.
  function distTxt(ops, c, etq) {
    const ks = ops.map(o => o[0]), partes = ops.filter(o => c[o[0]]).map(o => (etq ? etq(o) : o[1]) + ": " + c[o[0]]);
    const otras = Object.keys(c).filter(k => ks.indexOf(k) < 0).reduce((n, k) => n + c[k], 0);

    aviso(plural(n, "cuenta creada", "cuentas creadas") + " para " + nomL(rol) + ".");
  },
  "cuenta-roles":() => { const n = crearPorRol(false); guardarProyecto(); render(); aviso(plural(n, "cuenta creada", "cuentas creadas") + ", una por rol."); },
  "cuenta-faltantes":() => { const n = crearPorRol(true); guardarProyecto(); render(); aviso(n ? plural(n, "cuenta creada", "cuentas creadas") + " para los roles que faltaban." : "Ya hay una cuenta por cada rol."); },
  "cuenta-clave":arg => { if (regenerarClave(arg)) { UI.verClave[arg] = true; guardarProyecto(); render(); aviso("Contraseña nueva. Envíela a esa persona y descargue de nuevo la configuración en «Publicar»."); } },
  "cuenta-eliminar":arg => { UI.dialogo = { id:"cuenta-eliminar", arg, error:"" }; render(); },
  "cuenta-invitacion":async arg => { const q = cuentaDe(arg); if (!q) return; aviso(await copiarTexto(textoInvitacion(q)) ? "Invitación copiada. Péguela en su correo." : "No se pudo copiar: use «Ver cómo queda».", false); },
  "invitacion-ver":arg => { const q = cuentaDe(arg); if (!q) return; UI.dialogo = { id:"invitacion-ver", arg, texto:textoInvitacion(q) }; render(); },
  "invitacion-restablecer":() => { PROY.invitacion = INVITACION_BASE; guardarProyecto(); render(); aviso("Texto restablecido."); },
  "cuentas-csv":() => bajar(nombreArchivoAdm("cuentas", "csv"), "﻿" + cuentasCsv(), "text/csv", "Hoja de cuentas descargada. Lleva las contraseñas: trátela como confidencial."),
  "invitaciones-imprimir":() => { imprimirDocumento(invitacionesHtml()); },
  /* publicar */
  "bajar-config":async () => {
    const imp = impedimentosPublicar(); if (imp.length) return aviso(imp[0], true);
    aviso("Calculando las huellas de las contraseñas…");
    const cfg = await configPublicable(false, (i, n) => { UI.msg = "Preparando la cuenta " + i + " de " + n + "…"; renderTop(); });
    anotarPublicado("config"); guardarProyecto();
    await bajar("configuracion.js", textoConfiguracion(cfg), "text/javascript", "configuracion.js descargado. Entréguelo a quien publica el sitio.");
    render();
  },
  "bajar-receptor":async () => {
    if (!RE_CLAVE_SERVIDOR.test(PROY.entrega.clave) || !PROY.entrega.claveAdmin) return aviso("Genere antes las dos claves del receptor en «Estudio».", true);
    PROY.receptorPublicado = { firma:firmaReceptor(), t:ahora() }; guardarProyecto();
    await bajar("recibir-config.php", textoReceptor(), "text/plain", "recibir-config.php descargado. Va junto a recibir.php en el sitio.");
    render();
  },
  "unico-elegir":() => { const imp = impedimentosPublicar(); if (imp.length) return aviso(imp[0], true); abrirArchivo("unico-archivo"); },
  /* respuestas */
  "resp-elegir":() => abrirArchivo("resp-archivo"),
  "resp-servidor":async () => {
    UI.servidor = { estado:"cargando", texto:"Pidiendo las respuestas al servidor…" }; render();
    try { const imp = await traerDelServidor(); analisisMemo = null; UI.servidor = { estado:"ok", texto:plural(imp.filas.length, "documento recibido", "documentos recibidos") + "." }; }
    catch (e) { UI.servidor = { estado:"mal", texto:"No se pudo: " + String((e && e.message) || e), formulario:true }; }
    render();
  },
  "resp-ficha":arg => { UI.ficha = arg; UI.fichaDesde = "respuestas"; UI.vista = "seguimiento"; render(); },
  "seg-ficha":arg => { UI.ficha = arg; UI.fichaDesde = "seguimiento"; render(); },
  "ficha-cerrar":() => { UI.vista = UI.fichaDesde === "respuestas" ? "respuestas" : "seguimiento"; UI.ficha = null; render(); },
  "resp-eliminar":arg => { UI.dialogo = { id:"resp-eliminar", arg, error:"" }; render(); },
  "resp-borrar-servidor":arg => { UI.dialogo = { id:"resp-borrar-servidor", arg, error:"" }; render(); },
  "resp-json":() => bajar(nombreArchivoAdm("respuestas", "json"), JSON.stringify(paqueteRespuestas(), null, 1), "application/json"),
  "resp-datos-csv":() => bajar(nombreArchivoAdm("datos-personales", "csv"), "﻿" + datosPersonalesCsv(), "text/csv", "Archivo descargado. Contiene datos personales: trátelo como confidencial."),
  "resp-ficha-json":arg => { const e = entradaDe(arg); if (e) bajar("respuesta-" + e.doc.cuenta.usuario + "-" + fechaArchivo() + ".json", JSON.stringify(e.doc, null, 1), "application/json"); },
  /* resultados */
  "csv":arg => bajar(nombreArchivoAdm("tabla-" + arg, "csv"), "﻿" + csvDeTabla(analisisActual(), arg), "text/csv"),
  "csv-todo":() => bajar(nombreArchivoAdm("tablas", "csv"), "﻿" + csvDeTodas(analisisActual()), "text/csv"),
  "informe-html":() => bajar(nombreArchivoAdm("informe", "html"), informeHtml(analisisActual(), estudioEfectivo()), "text/html"),
  "informe-imprimir":() => { imprimirDocumento(informeHtml(analisisActual(), estudioEfectivo())); },
  "datos-json":() => bajar(nombreArchivoAdm("datos-consolidados", "json"), JSON.stringify(datosConsolidados(docsIncluidos(), { cuentas:PROY.cuentas, estudio:estudioEfectivo() }), null, 1), "application/json"),
  /* diálogos */
  "dlg-no":() => { UI.dialogo = null; render(); },
  "dlg-si":async () => {
    const dl = UI.dialogo; if (!dl) return;
    if (dl.id === "proyecto-borrar") {
      if (normClave(dl.texto) !== "BORRAR") { dl.error = "Escriba BORRAR para confirmar."; return render(); }
      borrarProyecto(); analisisMemo = null; vkAdm = null; render(); aviso("El proyecto se borró de este navegador.");
      return;
    }
    if (dl.id === "clave-cambiar") {
      const c = UI.cambio;
      if (!claveAdminCorrecta(c.actual)) { dl.error = "La clave actual no coincide."; return render(); }
      const err = definirClaveAdmin(c.c1, c.c2); if (err) { dl.error = err; return render(); }
      guardarProyecto(); recordarDesbloqueo(c.c1); UI.cambio = { actual:"", c1:"", c2:"" }; UI.dialogo = null; render(); aviso("Clave cambiada.");
      return;
    }
    if (dl.id === "est-eliminar") {
      if (normClave(dl.texto) !== "ELIMINAR") { dl.error = "Escriba ELIMINAR para confirmar."; return render(); }
      eliminarEstudio(dl.arg); analisisMemo = null; UI.ficha = null; UI.importe = null; UI.dialogo = null; render(); aviso("Sesión eliminada.");
      return;
    }
    if (dl.id === "cuenta-eliminar") { eliminarCuenta(dl.arg); guardarProyecto(); UI.dialogo = null; render(); aviso("Cuenta quitada."); return; }
    if (dl.id === "resp-eliminar") { eliminarRespuesta(dl.arg); analisisMemo = null; UI.dialogo = null; render(); aviso("Respuesta quitada del panel."); return; }
    if (dl.id === "resp-borrar-servidor") {
      const e = entradaDe(dl.arg); if (!e) { UI.dialogo = null; return render(); }
      try { await borrarEnServidor(e); } catch (err) { dl.error = "El servidor no la borró: " + String((err && err.message) || err); return render(); }
      eliminarRespuesta(dl.arg); analisisMemo = null; UI.dialogo = null; render(); aviso("Respuesta borrada del servidor y del panel.");
      return;
    }
    UI.dialogo = null; render();
  }
};

/* ---------- Eventos ---------- */
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b || b.disabled) return;
  const fn = ACC[b.getAttribute("data-act")]; if (!fn) return;
  const esBtn = b.classList.contains("btn");
  if (esBtn) { b.classList.add("is-busy"); b.setAttribute("aria-busy", "true"); }
  try { await fn(b.getAttribute("data-arg") || "", b.getAttribute("data-v") || ""); }
  catch (e) { aviso("Ocurrió un error: " + String((e && e.message) || e), true); }
  finally { if (esBtn && b.isConnected) { b.classList.remove("is-busy"); b.removeAttribute("aria-busy"); } }
});
let guardarT = null;
// Al escribir se guarda y se repinta: mientras el campo tenga el foco, render() aplaza el repintado hasta soltarlo.
const guardarLuego = () => { clearTimeout(guardarT); guardarT = setTimeout(() => { guardarProyecto(); render(); }, 600); };
document.addEventListener("input", ev => {
  const i = ev.target.closest("[data-in]"); if (!i || i.type === "checkbox" || i.type === "file") return;
  const k = i.getAttribute("data-in"), arg = i.getAttribute("data-arg") || "", v = i.value;
  if (k === "ac-c1") { UI.acceso.c1 = v; return; }
  if (k === "ac-c2") { UI.acceso.c2 = v; return; }
  if (k === "dlg-texto") { if (UI.dialogo) UI.dialogo.texto = v; return; }
  if (k === "dlg-actual" || k === "dlg-c1" || k === "dlg-c2") { UI.cambio[k.slice(4)] = v; return; }
  if (k === "alta-n") { UI.alta.n = v; return; }
  if (k === "est-titulo") { UI.nuevoEstudio = textoLimpio(v, 160); return; }
  if (k.indexOf("e-") === 0) {
    const campo = k.slice(2);
    if (campo === "url") PROY.url = textoLimpio(v, 300);
    else if (CAMPOS_ESTUDIO.indexOf(campo) >= 0) PROY.estudio[campo] = textoLimpio(v, LARGO_ESTUDIO[campo] || 160);
    else return;
  }
  else if (k === "en-url") PROY.entrega.url = textoLimpio(v, 200);
  else if (k === "c-version") PROY.consentimiento.version = textoLimpio(v, 20);
  else if (k === "c-adicional") PROY.consentimiento.adicional = textoLimpio(v, 2000);
  else if (k === "inv-texto") PROY.invitacion = String(v).slice(0, 4000);
  else if (k === "q-etiqueta") { const q = cuentaDe(arg); if (q) q.etiqueta = textoLimpio(v, 120); else return; }
  else if (k === "q-usuario") return;   // se aplica al salir del campo
  else return;
  guardarLuego();
});
document.addEventListener("change", async ev => {
  const i = ev.target.closest("[data-in]"); if (!i) return;
  const k = i.getAttribute("data-in"), arg = i.getAttribute("data-arg") || "";
  if (k === "ac-ver") { UI.acceso.ver = i.checked; return render(); }
  if (k === "alta-rol") { UI.alta.rol = i.value; return; }
  if (k === "ver-todas") { UI.verTodas = i.checked; return render(); }
  if (k === "q-prueba") { const q = cuentaDe(arg); if (q) { q.p = i.checked; guardarProyecto(); analisisMemo = null; render(); } return; }
  if (k === "q-usuario") {
    const r = renombrarCuenta(arg, i.value);
    if (r === true) { guardarProyecto(); analisisMemo = null; render(); aviso("Usuario cambiado. Descargue de nuevo la configuración en «Publicar»."); }
    else { render(); aviso(typeof r === "string" ? r : "No se pudo cambiar el usuario.", true); }
    return;
  }
  if (k === "incluir-pruebas") { PROY.incluirPruebas = i.checked; guardarProyecto(); analisisMemo = null; render(); return; }
  if (k === "resp-incluir") { const e = entradaDe(arg); if (e) { e.excluida = !i.checked; guardarRespuestas(); analisisMemo = null; render(); } return; }
  if (k === "copia-archivo") { const fs0 = [].slice.call(i.files); i.value = ""; leerArchivos(fs0, out => { const c = leerCopia(out[0] && out[0].texto || ""); if (c.error) return aviso(c.error, true); UI.acceso.pendiente = c; render(); }); return; }
  if (k === "copia-archivo-panel") { const fs0 = [].slice.call(i.files); i.value = ""; leerArchivos(fs0, out => { const c = leerCopia(out[0] && out[0].texto || ""); if (c.error) return aviso(c.error, true); const reemplazo = aplicarCopia(c); analisisMemo = null; UI.ficha = null; UI.importe = null; UI.vista = "estudio"; render(); aviso(reemplazo ? "Copia restaurada sobre la sesión «" + estudioEfectivo().titulo + "»." : "Copia restaurada como una sesión nueva."); }); return; }
  if (k === "resp-archivo") { const fs = [].slice.call(i.files); i.value = ""; leerArchivos(fs, out => { importarTextos(out, "archivo"); analisisMemo = null; render(); aviso("Importación terminada."); }); return; }
  if (k === "unico-archivo") {
    const fs = [].slice.call(i.files); i.value = "";
    UI.unico = { estado:"cargando", texto:"Preparando el archivo…" }; render();
    leerArchivos(fs, async out => {
      try {
        if (!out[0] || out[0].error) throw new Error(out[0] && out[0].error || "no se pudo leer el archivo");
        const cfg = await configPublicable(true, (a, b) => { UI.unico = { estado:"cargando", texto:"Preparando la cuenta " + a + " de " + b + "…" }; render(); });
        const html = simuladorUnico(out[0].texto, cfg);
        if (!html) throw new Error("ese archivo no es el simulador: elija simulador.html o el index.html del paquete");
        anotarPublicado("unico"); guardarProyecto();
        const ok = await descargarArchivo("simulador-" + (PROY.estudio.id || "estudio") + ".html", html, "text/html");
        UI.unico = ok ? { estado:"ok", texto:"Listo: el archivo trae sus " + plural(PROY.cuentas.length, "cuenta", "cuentas") + "." } : { estado:"mal", texto:"No se descargó el archivo." };
      } catch (e) { UI.unico = { estado:"mal", texto:String((e && e.message) || e) }; }
      render();
    });
    return;
  }
});
document.addEventListener("submit", ev => { ev.preventDefault(); if (ev.target.getAttribute("data-form") === "admin") accederPanel(); });
document.addEventListener("keydown", ev => {
  if (!UI.dialogo) return;
  if (ev.key === "Escape") { UI.dialogo = null; render(); return; }
  if (ev.key === "Tab") { const bs = [...document.querySelectorAll(".modal-caja button, .modal-caja input")]; if (!bs.length) return; const i = bs.indexOf(document.activeElement), n = ev.shiftKey ? (i <= 0 ? bs.length - 1 : i - 1) : (i === bs.length - 1 ? 0 : i + 1); ev.preventDefault(); bs[n].focus(); }
});
// Arrastrar archivos de respuestas sobre su zona.
document.addEventListener("dragover", ev => { const z = ev.target.closest("#zona-soltar"); if (!z) return; ev.preventDefault(); z.classList.add("sobre"); });
document.addEventListener("dragleave", ev => { const z = ev.target.closest("#zona-soltar"); if (z) z.classList.remove("sobre"); });
document.addEventListener("drop", ev => {
  const z = ev.target.closest("#zona-soltar"); if (!z) return;
  ev.preventDefault(); z.classList.remove("sobre");
  leerArchivos(ev.dataTransfer && ev.dataTransfer.files, out => { importarTextos(out, "archivo"); analisisMemo = null; render(); aviso("Importación terminada."); });
});
window.addEventListener("pagehide", () => { clearTimeout(guardarT); guardarProyecto(); });
document.addEventListener("visibilitychange", () => { if (document.hidden) { clearTimeout(guardarT); guardarProyecto(); } });

(async function init() {
  if (!document.documentElement.lang) document.documentElement.lang = "es";
  cargarDeAlmacen();
  if (ADMIN && desbloqueoRecordado()) { UI.abierto = true; if (PROY.entrega.forma === "servidor") prepararEntrega(); }
  render();
  await initDescargas();
})();
})();
</script>
