# ===============================================================
# Rehavid Operaciones · stack local de desarrollo
# Levantar con: docker-compose up
# ===============================================================
version: "3.9"

services:
  cosmos-emulator:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:latest
    container_name: rehavid-cosmos
    ports:
      - "8081:8081"
      - "10251-10254:10251-10254"
    environment:
      AZURE_COSMOS_EMULATOR_PARTITION_COUNT: "5"
      AZURE_COSMOS_EMULATOR_ENABLE_DATA_PERSISTENCE: "true"
    volumes:
      - cosmos-data:/data/db
    mem_limit: 4g
    cpus: 2

  api:
    build: .
    container_name: rehavid-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - cosmos-emulator
    environment:
      COSMOS_ENDPOINT: "https://cosmos-emulator:8081"
      # El emulador usa certificado self-signed; sin esto el SDK rechaza el TLS.
      # NO llevar a producción (el arranque lo bloquea si ENVIRONMENT=production).
      COSMOS_CONNECTION_VERIFY: "false"
    volumes:
      - ./app:/app/app  # hot reload en dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  cosmos-data:
