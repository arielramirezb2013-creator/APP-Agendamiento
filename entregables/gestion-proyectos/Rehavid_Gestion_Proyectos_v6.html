<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rehavid · Gestión de proyectos: venta, activación, asignación, programación confirmada, ejecución, alertas y cierre por producto." />
  <title>Rehavid | Gestión de proyectos</title>
  <style>
    /* =========================================================================
       Sistema visual "blueprint": rejilla técnica, líneas de 1px, sin sombras,
       cifras monoespaciadas tabulares y alineación estricta a una retícula.
       ========================================================================= */
    :root{
      --bg:#ffffff;
      --grid-line:#eef2f7;
      --panel:#ffffff;
      --panel-alt:#f8fafc;
      --line:#cfd8e3;
      --line-soft:#e3e9f0;
      --line-strong:#9fb0c4;
      --ink:#0f1b2d;
      --muted:#5b6b7f;
      --faint:#8a99ab;
      --accent:#0b5cab;
      --accent-2:#08447f;
      --accent-soft:#e7f0fa;
      --amber:#a86a00;
      --amber-soft:#fdf4e3;
      --red:#b3262f;
      --red-soft:#fdeced;
      --green:#0f7a52;
      --green-soft:#e8f5ef;
      --violet:#4b3b96;
      --violet-soft:#eeebfa;
      --mono:ui-monospace,"SFMono-Regular","JetBrains Mono",Menlo,Consolas,"Liberation Mono",monospace;
      --sans:Inter,"Segoe UI",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      --rail:212px;
      --r:2px;
    }
    *{box-sizing:border-box}
    html{font-size:14px}
    body{
      margin:0;color:var(--ink);font-family:var(--sans);
      background-color:var(--bg);
      background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);
      background-size:24px 24px;
    }
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    a{color:var(--accent)}
    .hidden{display:none!important}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    :focus-visible{outline:2px solid var(--accent);outline-offset:1px}
    .num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
    .mono{font-family:var(--mono)}

    /* ---------------- Estructura ---------------- */
    .app{min-height:100vh;display:grid;grid-template-columns:var(--rail) minmax(0,1fr)}
    .rail{position:sticky;top:0;height:100vh;background:var(--panel-alt);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
    .rail-brand{padding:16px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
    .rail-mark{width:32px;height:32px;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:12px;font-family:var(--mono);flex:none}
    .rail-brand strong{display:block;font-size:12px;letter-spacing:.16em;font-weight:800}
    .rail-brand span{display:block;font-size:9px;color:var(--muted);letter-spacing:.06em;margin-top:2px;text-transform:uppercase}
    .rail-section{padding:14px 14px 6px;font-size:8px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
    .nav{display:grid}
    .nav button{border:0;border-left:3px solid transparent;background:transparent;color:var(--ink);padding:8px 14px;text-align:left;font-size:12px;font-weight:600;display:flex;align-items:center;gap:9px;width:100%}
    .nav button:hover{background:#eef3f9}
    .nav button.active{background:var(--accent-soft);border-left-color:var(--accent);color:var(--accent-2);font-weight:750}
    .nav-key{font-family:var(--mono);font-size:9px;color:var(--faint);width:16px;flex:none}
    .nav button.active .nav-key{color:var(--accent)}
    .nav-badge{margin-left:auto;font-family:var(--mono);font-size:9px;font-weight:800;background:var(--red);color:#fff;padding:1px 5px;min-width:18px;text-align:center}
    .nav-badge.zero{display:none}
    .rail-foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 14px;font-size:9px;color:var(--muted);line-height:1.6}
    .rail-foot code{font-family:var(--mono);font-size:9px}
    .sig{display:flex;align-items:center;gap:6px;margin-top:8px;font-family:var(--mono);font-size:9px}
    .sig i{width:6px;height:6px;background:var(--green);display:block;flex:none}

    .work{min-width:0;display:flex;flex-direction:column;min-height:100vh}
    .topbar{background:rgba(255,255,255,.98);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 20px;position:sticky;top:0;z-index:15;flex-wrap:wrap}
    .menu-btn{display:none}
    .crumb{min-width:180px}
    .crumb h1{font-size:15px;margin:0;letter-spacing:.01em;font-weight:750}
    .crumb p{font-size:10px;color:var(--muted);margin:2px 0 0}
    .search{flex:1;min-width:200px;max-width:520px;position:relative}
    .search input{width:100%;height:32px;border:1px solid var(--line);border-radius:var(--r);padding:0 10px 0 30px;background:var(--panel-alt);outline:none;font-size:12px}
    .search input:focus{border-color:var(--accent);background:#fff}
    .search .ic{position:absolute;left:10px;top:7px;color:var(--faint);font-family:var(--mono);font-size:12px}
    .top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .who{display:flex;align-items:center;gap:7px;border:1px solid var(--line);padding:3px 8px;background:#fff;height:32px}
    .who label{font-size:8px;color:var(--faint);font-weight:800;letter-spacing:.1em;text-transform:uppercase}
    .who select{border:0;outline:none;font-size:11px;font-weight:700;background:transparent;max-width:140px}
    .who .role{font-family:var(--mono);font-size:8px;color:var(--accent);border:1px solid var(--line);padding:1px 4px}

    .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:var(--r);padding:7px 11px;font-weight:650;font-size:11px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap;height:32px}
    .btn:hover{border-color:var(--line-strong);background:var(--panel-alt)}
    .btn:disabled{opacity:.45;cursor:not-allowed}
    .btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn-primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
    .btn-ok{background:var(--green);border-color:var(--green);color:#fff}
    .btn-ok:hover{background:#0b6041;border-color:#0b6041}
    .btn-danger{color:var(--red);border-color:#e5b9bc}
    .btn-danger:hover{background:var(--red-soft)}
    .btn-ghost{border-color:transparent;background:transparent}
    .btn-xs{height:26px;padding:4px 8px;font-size:10px}
    .btn-icon{width:32px;padding:0}

    .canvas{padding:16px 20px 40px;max-width:1780px;width:100%;margin:0 auto;flex:1}

    /* ---------------- Panel base ---------------- */
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
    .panel+.panel{margin-top:14px}
    .phead{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel-alt);flex-wrap:wrap}
    .phead h2{font-size:10px;margin:0;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--ink)}
    .phead h2::before{content:"";display:inline-block;width:8px;height:8px;background:var(--accent);margin-right:8px;vertical-align:middle}
    .phead p{font-size:10px;color:var(--muted);margin:0;flex:1;min-width:160px}
    .pactions{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .pbody{padding:12px}
    .note{font-size:10px;color:var(--muted);line-height:1.6}
    .note b{color:var(--ink)}
    .hint-line{font-size:9px;color:var(--faint);font-family:var(--mono);letter-spacing:.02em}

    /* ---------------- Barra de filtros ---------------- */
    .filters{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;border:1px solid var(--line);background:#fff;margin-bottom:12px}
    .filters .fx{display:flex;flex-direction:column;border-right:1px solid var(--line);padding:6px 9px;min-width:150px;flex:1}
    .filters .fx:last-of-type{border-right:0}
    .filters .fx label{font-size:8px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin-bottom:2px}
    .filters .fx select{border:0;outline:none;font-size:11px;font-weight:650;background:transparent;padding:1px 0}
    .filters .fend{display:flex;align-items:center;gap:6px;padding:6px 9px;border-left:1px solid var(--line)}
    .chips{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 12px}
    .chip{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-2);border-radius:var(--r);padding:3px 7px;font-size:10px;font-weight:700;font-family:var(--mono)}
    .chip:hover{background:#d8e7f7}

    /* ---------------- KPI / instrumentos ---------------- */
    .kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));border:1px solid var(--line);background:#fff;margin-bottom:12px}
    .kpi{border:0;border-right:1px solid var(--line);background:#fff;text-align:left;padding:11px 12px}
    .kpi:last-child{border-right:0}
    .kpi:hover{background:var(--panel-alt)}
    .kpi[aria-pressed="true"]{background:var(--accent-soft)}
    .kpi>span{display:block;color:var(--faint);font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.11em;line-height:1.4;min-height:22px}
    .kpi strong{display:block;font-size:26px;line-height:1;margin-top:6px;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.04em;font-weight:700}
    .kpi small{display:block;color:var(--muted);font-size:9px;margin-top:5px}
    .kpi.danger strong{color:var(--red)}
    .kpi.warn strong{color:var(--amber)}
    .kpi.ok strong{color:var(--green)}
    .kpi.acc strong{color:var(--accent)}

    .gauges{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);background:#fff;margin-bottom:12px}
    .gauge{padding:11px 12px;border-right:1px solid var(--line);display:flex;gap:11px;align-items:center}
    .gauge:last-child{border-right:0}
    .gauge .dial{width:52px;height:52px;flex:none;position:relative}
    .gauge .dial svg{transform:rotate(-90deg)}
    .gauge .dial b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:700}
    .gauge .g-txt>span{display:block;font-size:8px;color:var(--faint);font-weight:800;text-transform:uppercase;letter-spacing:.11em}
    .gauge .g-txt b{display:block;font-size:17px;margin-top:3px;font-family:var(--mono);font-variant-numeric:tabular-nums}
    .gauge .g-txt small{display:block;font-size:9px;color:var(--muted);margin-top:2px}

    /* ---------------- Tablas ---------------- */
    .tbl-wrap{overflow:auto}
    table.tbl{width:100%;border-collapse:collapse}
    table.tbl th{position:sticky;top:0;background:var(--panel-alt);color:var(--muted);font-size:8px;text-transform:uppercase;letter-spacing:.11em;text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1;font-weight:800}
    table.tbl td{padding:8px 9px;border-bottom:1px solid var(--line-soft);font-size:11px;vertical-align:middle}
    table.tbl tbody tr:hover{background:#f6f9fc}
    table.tbl tfoot td{background:var(--panel-alt);font-weight:800;border-top:1px solid var(--line);border-bottom:0;font-size:11px}
    .t-right{text-align:right}
    .t-num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
    .lnk{border:0;background:transparent;padding:0;text-align:left;color:var(--ink);font-weight:750;font-family:var(--mono);font-size:11px}
    .lnk:hover{color:var(--accent);text-decoration:underline}
    .muted{color:var(--muted)}
    .faint{color:var(--faint)}
    .xs{font-size:9px}
    .nowrap{white-space:nowrap}
    .fv{border:0;background:transparent;padding:0;font:inherit;color:inherit;text-align:left;border-bottom:1px dotted var(--line-strong);cursor:pointer}
    .fv:hover{color:var(--accent);border-bottom-color:var(--accent)}

    /* ---------------- Marcas de estado ---------------- */
    .tag{display:inline-flex;max-width:100%;align-items:center;gap:4px;border-radius:var(--r);padding:2px 6px;font-size:9px;font-weight:750;white-space:nowrap;border:1px solid transparent;font-family:var(--mono);letter-spacing:.02em}
    .tag.acc{background:var(--accent-soft);color:var(--accent-2);border-color:#bcd6ef}
    .tag.ok{background:var(--green-soft);color:var(--green);border-color:#bfe0d0}
    .tag.warn{background:var(--amber-soft);color:var(--amber);border-color:#ecd7a8}
    .tag.bad{background:var(--red-soft);color:var(--red);border-color:#eec2c5}
    .tag.gray{background:#eef2f6;color:var(--muted);border-color:var(--line)}
    .tag.vio{background:var(--violet-soft);color:var(--violet);border-color:#cfc7ee}
    .sq{width:8px;height:8px;display:inline-block;flex:none}
    .sq.ok{background:var(--green)}.sq.warn{background:var(--amber)}.sq.bad{background:var(--red)}.sq.gray{background:var(--line-strong)}.sq.acc{background:var(--accent)}

    .bar{height:7px;background:#edf1f6;border:1px solid var(--line-soft);position:relative;min-width:60px;flex:1}
    .bar>i{display:block;height:100%;background:var(--accent)}
    .bar.bad>i{background:var(--red)}.bar.warn>i{background:var(--amber)}.bar.ok>i{background:var(--green)}
    .bar .mark{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--ink);opacity:.55}
    .barline{display:flex;align-items:center;gap:7px;min-width:110px}
    .barline b{font-family:var(--mono);font-size:10px;min-width:32px;text-align:right;font-variant-numeric:tabular-nums}
    .stack{display:flex;height:9px;border:1px solid var(--line-soft);min-width:90px;overflow:hidden}
    .stack i{display:block;height:100%}

    /* ---------------- Módulo empresas ---------------- */
    .co{border:1px solid var(--line);background:#fff;margin-bottom:12px;min-width:0}
    .co-head{display:grid;grid-template-columns:26px minmax(190px,2fr) repeat(4,minmax(84px,1fr)) 124px;gap:10px;align-items:center;padding:10px 12px;background:var(--panel-alt);border-bottom:1px solid var(--line)}
    .co-head:hover{background:#eef3f9}
    .co-id{width:26px;height:26px;border:1px solid var(--line-strong);display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:800;background:#fff;flex:none}
    .co-name h3{font-size:13px;margin:0;font-weight:750}
    .co-name p{font-size:9px;color:var(--muted);margin:2px 0 0;font-family:var(--mono)}
    .co-metric>span{display:block;font-size:8px;color:var(--faint);text-transform:uppercase;letter-spacing:.11em;font-weight:800}
    .co-metric b{display:block;font-size:13px;font-family:var(--mono);font-variant-numeric:tabular-nums;margin-top:2px}
    .co-body{padding:0}
    .prj{border-bottom:1px solid var(--line)}
    .prj:last-child{border-bottom:0}
    .prj-head{display:grid;grid-template-columns:24px minmax(170px,1.5fr) 142px 112px minmax(110px,1fr) 104px 124px;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line-soft);background:#fff}
    .prj-head:hover{background:#f6f9fc}
    .tw{width:22px;height:22px;border:1px solid var(--line);background:#fff;font-family:var(--mono);font-size:11px;line-height:1;flex:none}
    .prod-list{background:#fbfcfe;border-top:1px solid var(--line-soft);padding:10px 12px 12px 34px}
    .prod{border:1px solid var(--line);background:#fff;margin-bottom:8px}
    .prod.bad{border-left:3px solid var(--red)}
    .prod.warn{border-left:3px solid var(--amber)}
    .prod.ok{border-left:3px solid var(--green)}
    .prod.gray{border-left:3px solid var(--line-strong)}
    .prod-head{display:grid;grid-template-columns:minmax(180px,1.6fr) 142px 128px minmax(115px,1fr) 112px;gap:10px;align-items:center;padding:9px 11px}
    .prod-head strong{font-size:12px;display:block;font-weight:700}
    .prod-head small{display:block;color:var(--muted);font-size:9px;margin-top:2px;font-family:var(--mono)}
    .prod-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;padding:0 11px 9px;border-top:1px dashed var(--line-soft);padding-top:9px}
    .prod-meta div>span{display:block;font-size:8px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;font-weight:800}
    .prod-meta div b{display:block;font-size:11px;margin-top:2px;font-family:var(--mono)}
    .prod-acts{display:flex;gap:5px;flex-wrap:wrap;padding:8px 11px;border-top:1px solid var(--line-soft);background:var(--panel-alt)}
    .lockmsg{font-size:9px;color:var(--muted);font-family:var(--mono);display:flex;align-items:center;gap:5px}

    /* ---------------- Plan de trabajo / Gantt ---------------- */
    .plan{border:1px solid var(--line);background:#fff;margin:0 11px 10px}
    .plan-head{display:flex;align-items:center;gap:10px;padding:7px 10px;border-bottom:1px solid var(--line);background:var(--panel-alt);flex-wrap:wrap}
    .plan-head strong{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    .plan-legend{margin-left:auto;display:flex;gap:10px;font-size:8px;color:var(--muted);font-family:var(--mono);flex-wrap:wrap}
    .plan-legend i{display:inline-block;width:14px;height:6px;vertical-align:middle;margin-right:3px}
    .gantt{overflow-x:auto}
    .gantt-grid{min-width:640px}
    .g-row{display:grid;grid-template-columns:200px 1fr;border-bottom:1px solid var(--line-soft);align-items:stretch}
    .g-row:last-child{border-bottom:0}
    .g-row.head{background:var(--panel-alt);border-bottom:1px solid var(--line)}
    .g-label{padding:6px 9px;border-right:1px solid var(--line);font-size:10px;display:flex;align-items:center;gap:6px;min-width:0}
    .g-label span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .g-label.sub{padding-left:20px;color:var(--muted);font-size:9px}
    .g-track{position:relative;min-height:26px;--cols:6;background-image:repeating-linear-gradient(90deg,transparent,transparent calc(100%/var(--cols) - 1px),var(--grid-line) calc(100%/var(--cols) - 1px),var(--grid-line) calc(100%/var(--cols)))}
    .g-scale{display:flex;font-family:var(--mono);font-size:8px;color:var(--muted)}
    .g-scale div{flex:1;padding:5px 3px;border-right:1px solid var(--line-soft);text-align:center;white-space:nowrap;overflow:hidden}
    .g-bar{position:absolute;top:7px;height:12px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:1px;overflow:hidden}
    .g-bar>i{display:block;height:100%;background:var(--accent);opacity:.85}
    .g-bar.bad{background:var(--red-soft);border-color:var(--red)}
    .g-bar.bad>i{background:var(--red)}
    .g-bar.warn{background:var(--amber-soft);border-color:var(--amber)}
    .g-bar.warn>i{background:var(--amber)}
    .g-bar.ok{background:var(--green-soft);border-color:var(--green)}
    .g-bar.ok>i{background:var(--green)}
    .g-base{position:absolute;top:23px;height:3px;background:repeating-linear-gradient(90deg,var(--line-strong),var(--line-strong) 3px,transparent 3px,transparent 6px)}
    .g-mile{position:absolute;top:8px;width:9px;height:9px;background:#fff;border:1.5px solid var(--ink);transform:rotate(45deg)}
    .g-mile.done{background:var(--green);border-color:var(--green)}
    .g-mile.late{background:var(--red);border-color:var(--red)}
    .g-today{position:absolute;top:0;bottom:0;width:1px;background:var(--accent);opacity:.8}
    .g-today::after{content:""}
    .g-row.head .g-today::after{content:"HOY";position:absolute;top:1px;left:3px;font-family:var(--mono);font-size:7px;color:var(--accent);letter-spacing:.08em;font-weight:800}
    .g-scale{position:relative}
    .g-empty{position:absolute;left:6px;top:7px;font-size:8px;color:var(--faint);font-family:var(--mono)}

    /* ---------------- Alertas ---------------- */
    .al-co{border:1px solid var(--line);background:#fff;margin-bottom:10px}
    .al-co-head{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--panel-alt);border-bottom:1px solid var(--line);flex-wrap:wrap}
    .al-co-head h3{font-size:12px;margin:0;font-weight:750}
    .al-co-head .counts{margin-left:auto;display:flex;gap:6px;font-family:var(--mono);font-size:9px}
    .al-prod{border-bottom:1px solid var(--line-soft)}
    .al-prod:last-child{border-bottom:0}
    .al-prod-head{display:grid;grid-template-columns:minmax(180px,1.4fr) 142px 126px 106px 116px;gap:10px;align-items:center;padding:8px 12px;background:#fdfefe}
    .al-list{padding:0 12px 9px 12px}
    .al-item{display:grid;grid-template-columns:150px 1fr 90px;gap:10px;padding:6px 0;border-top:1px dashed var(--line-soft);font-size:10px;align-items:center}

    /* ---------------- Formularios ---------------- */
    .grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:9px}
    .f{grid-column:span 4;min-width:0}
    .s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}
    .s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s9{grid-column:span 9}.s12{grid-column:span 12}
    .f label{display:block;font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
    .f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:6px 8px;font-size:11px;outline:none}
    .f input,.f select{height:31px}
    .f input[type=number]{font-family:var(--mono);text-align:right}
    .f textarea{min-height:62px;resize:vertical;font-size:11px;line-height:1.5}
    .f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-soft)}
    .f input[readonly]{background:var(--panel-alt);color:var(--muted)}
    .f .hint{display:block;font-size:8px;color:var(--faint);margin-top:3px;line-height:1.5}
    .f .ck{display:flex;gap:7px;align-items:flex-start;border:1px solid var(--line);padding:7px 8px;font-size:10px;cursor:pointer;background:#fff}
    .f .ck strong{display:block;font-size:10px}
    .f .ck span{display:block;color:var(--muted);font-size:9px;margin-top:2px;line-height:1.45}
    .row{display:flex;gap:7px;flex-wrap:wrap}

    /* ---------------- Parametrización ---------------- */
    .cfg-grid,.dash-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start}
    .cfg-grid>*,.dash-cols>*{min-width:0}
    .crud-row{display:grid;gap:7px;align-items:end;border-bottom:1px solid var(--line-soft);padding:7px 0}
    .crud-row:last-of-type{border-bottom:0}
    .crud-row .f label{display:none}
    .crud-row>.f,.rule-row>.f{grid-column:auto;min-width:0}
    .crud-head{display:grid;gap:7px;padding:0 0 5px;font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line)}
    .del{border:0;background:transparent;color:var(--red);font-family:var(--mono);font-size:14px;line-height:1;padding:0;width:24px;height:28px}
    .del:hover{background:var(--red-soft)}

    /* ---------------- Cajón lateral ---------------- */
    .veil{position:fixed;inset:0;background:rgba(15,27,45,.32);z-index:50;opacity:0;pointer-events:none;transition:opacity .15s}
    .veil.open{opacity:1;pointer-events:auto}
    .drawer{position:fixed;top:0;right:0;height:100vh;width:min(980px,97vw);background:#fff;z-index:55;transform:translateX(101%);transition:transform .18s;display:flex;flex-direction:column;border-left:1px solid var(--line-strong)}
    .drawer.open{transform:translateX(0)}
    .drawer-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px;background:var(--panel-alt)}
    .drawer-head .t{flex:1;min-width:0}
    .drawer-head .t span{display:block;color:var(--accent);font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    .drawer-head .t h2{font-size:16px;margin:3px 0 0;font-family:var(--mono);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .drawer-head .t p{font-size:9px;color:var(--muted);margin:3px 0 0;font-family:var(--mono)}
    .drawer-body{overflow:auto;flex:1;padding:12px 16px 24px;background:#fbfcfe}
    .drawer-foot{padding:9px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:7px;background:#fff;flex-wrap:wrap}
    .drawer-foot .sp{flex:1}
    .strip{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);background:#fff;margin-bottom:10px}
    .strip div{padding:8px 10px;border-right:1px solid var(--line)}
    .strip div:last-child{border-right:0}
    .strip div>span{display:block;font-size:8px;color:var(--faint);text-transform:uppercase;letter-spacing:.1em;font-weight:800}
    .strip b{display:block;font-size:12px;margin-top:3px;font-family:var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .acc{background:#fff;border:1px solid var(--line);margin-top:9px}
    .acc>summary{list-style:none;cursor:pointer;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;background:var(--panel-alt)}
    .acc>summary::-webkit-details-marker{display:none}
    .acc>summary::after{content:"[+]";font-family:var(--mono);color:var(--muted);font-size:10px}
    .acc[open]>summary::after{content:"[-]"}
    .acc-body{border-top:1px solid var(--line);padding:12px}
    .sub{border:1px solid var(--line);margin-top:10px;background:#fff}
    .sub>summary{padding:7px 10px;font-size:10px;font-weight:700;cursor:pointer;background:var(--panel-alt)}
    .sub-body{border-top:1px solid var(--line);padding:10px}
    .card{border:1px solid var(--line);background:#fff;padding:10px;margin-bottom:8px}
    .card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line-soft)}
    .card-head strong{font-size:11px}
    .card-head span{font-size:9px;color:var(--muted);font-family:var(--mono)}
    .logs{display:grid}
    .log{display:grid;grid-template-columns:120px 1fr;gap:10px;font-size:10px;padding:6px 0;border-bottom:1px solid var(--line-soft)}
    .log:last-child{border-bottom:0}
    .log time{color:var(--muted);font-family:var(--mono);font-size:9px}
    .log strong{display:block;font-size:10px}
    .log div>span{display:block;color:var(--muted);margin-top:2px;line-height:1.5}
    .diff{font-family:var(--mono);font-size:9px;background:var(--panel-alt);border:1px solid var(--line-soft);padding:1px 4px;display:inline-block;margin-top:3px}

    /* ---------------- Asistente de venta ---------------- */
    .steps{display:flex;border:1px solid var(--line);background:#fff;margin-bottom:12px}
    .steps button{flex:1;border:0;border-right:1px solid var(--line);background:#fff;padding:8px 10px;text-align:left;min-width:120px}
    .steps button:last-child{border-right:0}
    .steps button b{display:block;font-size:10px;font-family:var(--mono)}
    .steps button span{display:block;font-size:8px;color:var(--muted);margin-top:2px}
    .steps button.on{background:var(--accent-soft);color:var(--accent-2);box-shadow:inset 0 2px 0 var(--accent)}
    .steps button.done{background:var(--green-soft);box-shadow:inset 0 2px 0 var(--green)}
    .checks{display:grid;gap:5px}
    .check{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);padding:7px 9px;font-size:10px;background:#fff}
    .check.pass{border-color:#bfe0d0;background:var(--green-soft)}
    .check.fail{border-color:#eec2c5;background:var(--red-soft)}
    .check .m{font-family:var(--mono);font-weight:800;font-size:11px;flex:none;width:14px}
    .check.pass .m{color:var(--green)}
    .check.fail .m{color:var(--red)}
    .check strong{display:block;font-size:10px}
    .check div>span{display:block;color:var(--muted);font-size:9px;margin-top:2px;line-height:1.5}
    .check.fail span{color:#8d2027}

    /* ---------------- Calendario ---------------- */
    .cal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--panel-alt)}
    .cal-title strong{display:block;font-size:14px;text-transform:uppercase;letter-spacing:.08em;font-family:var(--mono)}
    .cal-title span{font-size:9px;color:var(--muted)}
    .cal-ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
    .cal-ctl select{height:28px;border:1px solid var(--line);background:#fff;font-size:10px;padding:0 6px;border-radius:var(--r)}
    .cal-grid{display:grid;grid-template-columns:repeat(7,minmax(112px,1fr));overflow:auto}
    .wd{background:var(--panel-alt);color:var(--muted);font-size:8px;font-weight:800;text-transform:uppercase;letter-spacing:.11em;padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
    .day{min-height:112px;padding:5px 6px;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);background:#fff}
    .day.out{background:#fafbfc;color:var(--faint)}
    .day.today{box-shadow:inset 0 0 0 2px var(--accent-soft);border-left:2px solid var(--accent)}
    .day.hol{background:#fffdf6}
    .day-n{display:flex;justify-content:space-between;gap:5px;font-size:10px;font-family:var(--mono);font-weight:700;margin-bottom:4px}
    .hol-n{font-size:7px;color:var(--amber);text-align:right;max-width:74px}
    .ev{display:block;width:100%;border:0;border-left:2px solid var(--accent);background:var(--accent-soft);color:var(--accent-2);text-align:left;padding:3px 5px;margin-top:3px;border-radius:1px}
    .ev.bad{border-left-color:var(--red);background:var(--red-soft);color:var(--red)}
    .ev.warn{border-left-color:var(--amber);background:var(--amber-soft);color:var(--amber)}
    .ev.ok{border-left-color:var(--green);background:var(--green-soft);color:var(--green)}
    .ev b{display:block;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ev span{display:block;font-size:7px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--mono)}
    .more{border:0;background:transparent;color:var(--accent);font-size:8px;font-weight:800;padding:2px 0;font-family:var(--mono)}
    .hol-strip{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:7px 12px;border-bottom:1px solid var(--line);background:#fffdf6}
    .hol-strip strong{font-size:8px;color:var(--amber);letter-spacing:.11em;text-transform:uppercase}
    .hol-chip{font-size:9px;border:1px solid #ecd7a8;background:var(--amber-soft);color:var(--amber);padding:2px 6px;font-family:var(--mono)}
    .agenda{display:grid;grid-template-columns:90px minmax(200px,1fr) 140px 120px;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line-soft);font-size:10px;align-items:center}

    /* ---------------- Modal, avisos ---------------- */
    .mveil{position:fixed;inset:0;background:rgba(15,27,45,.38);z-index:70;display:none;place-items:center;padding:16px}
    .mveil.open{display:grid}
    .modal{width:min(820px,97vw);max-height:88vh;overflow:auto;background:#fff;border:1px solid var(--line-strong);border-radius:var(--r)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-bottom:1px solid var(--line);background:var(--panel-alt);gap:10px}
    .modal-head h2{font-size:12px;margin:0;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .modal-body{padding:14px}
    .modal-foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap;background:var(--panel-alt)}
    .pre{border:1px solid var(--line);padding:10px;background:var(--panel-alt);font-size:10px;line-height:1.65;white-space:pre-wrap;font-family:var(--mono);max-height:300px;overflow:auto}
    .toasts{position:fixed;right:16px;bottom:16px;z-index:90;display:grid;gap:7px}
    .toast{background:var(--ink);color:#fff;padding:9px 11px;font-size:10px;min-width:250px;max-width:340px;line-height:1.5;border-left:3px solid var(--accent)}
    .toast strong{display:block;font-size:11px;margin-bottom:2px}
    .toast.error{border-left-color:#ff7b85}
    .toast.warning{border-left-color:#f5c26b}
    .empty{padding:38px 18px;text-align:center;color:var(--muted)}
    .empty strong{display:block;color:var(--ink);font-size:13px;margin-bottom:5px}
    .empty p{font-size:10px;margin:0 auto 12px;max-width:520px;line-height:1.6}

    /* ---------------- Adaptación ---------------- */
    @media(max-width:1400px){
      .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
      .kpi:nth-child(3){border-right:0}
      .kpi:nth-child(-n+3){border-bottom:1px solid var(--line)}
      .gauges{grid-template-columns:repeat(2,minmax(0,1fr))}
      .gauge:nth-child(2){border-right:0}
      .gauge:nth-child(-n+2){border-bottom:1px solid var(--line)}
    }
    @media(max-width:1200px){
      .co-head{grid-template-columns:26px minmax(180px,2fr) repeat(2,minmax(80px,1fr)) 120px}
      .co-head>.co-metric:nth-of-type(n+3){display:none}
      .prj-head{grid-template-columns:24px minmax(160px,1.4fr) 110px minmax(110px,1fr) 120px}
      .prj-head>div:nth-child(4),.prj-head>div:nth-child(7){display:none}
      .prod-head{grid-template-columns:minmax(160px,1.5fr) 120px minmax(110px,1fr) 110px}
      .prod-head>div:nth-child(3){display:none}
      .cfg-grid,.dash-cols{grid-template-columns:minmax(0,1fr)}
      .al-prod-head{grid-template-columns:minmax(150px,1.3fr) 142px 106px 116px}
      .al-prod-head>div:nth-child(5){display:none}
    }
    @media(max-width:900px){
      .app{grid-template-columns:1fr}
      .rail{position:fixed;left:0;transform:translateX(-104%);transition:transform .18s;width:250px}
      .rail.open{transform:translateX(0)}
      .menu-btn{display:inline-flex}
      .topbar{padding:9px 12px}
      .crumb p{display:none}
      .search{order:5;flex-basis:100%;max-width:none}
      .canvas{padding:12px 10px 32px}
      .kpis{grid-template-columns:1fr 1fr}
      .kpi{border-right:1px solid var(--line)!important;border-bottom:1px solid var(--line)}
      .kpi:nth-child(2n){border-right:0!important}
      .gauges{grid-template-columns:1fr}
      .gauge{border-right:0;border-bottom:1px solid var(--line)}
      .filters .fx{min-width:calc(50% - 1px);flex:none}
      .co-head{grid-template-columns:26px 1fr 110px}
      .co-head>.co-metric{display:none}
      .prj-head{grid-template-columns:24px 1fr 110px}
      .prj-head>div:nth-child(4),.prj-head>div:nth-child(5),.prj-head>div:nth-child(6),.prj-head>div:nth-child(7){display:none}
      .prod-list{padding-left:12px}
      .prod-head{grid-template-columns:1fr 110px}
      .prod-head>div:nth-child(3),.prod-head>div:nth-child(4),.prod-head>div:nth-child(5){display:none}
      .al-prod-head{grid-template-columns:1fr 110px}
      .al-prod-head>div:nth-child(3),.al-prod-head>div:nth-child(4),.al-prod-head>div:nth-child(5){display:none}
      .al-item{grid-template-columns:1fr}
      .strip{grid-template-columns:1fr 1fr}
      .grid12{grid-template-columns:repeat(2,1fr)}
      .f,.s2,.s3,.s4,.s5,.s6,.s7,.s8,.s9,.s12{grid-column:span 1}
      .f.s12,.f.s9,.f.s8,.f.s7,.f.s6{grid-column:1/-1}
      .drawer{width:100vw}
      .g-row{grid-template-columns:130px 1fr}
      .agenda{grid-template-columns:80px 1fr}
      .agenda>div:nth-child(3),.agenda>div:nth-child(4){display:none}
      .crud-row{grid-template-columns:1fr!important}
      .crud-head{display:none}
    }
    @media(max-width:520px){
      .kpis{grid-template-columns:1fr}
      .kpi{border-right:0!important}
      .strip{grid-template-columns:1fr}
      .grid12{grid-template-columns:1fr}
      .f,.f.s12,.f.s9,.f.s8,.f.s7,.f.s6{grid-column:1}
      .cal-grid{grid-template-columns:repeat(7,102px)}
      .steps{flex-direction:column}
      .steps button{border-right:0;border-bottom:1px solid var(--line)}
    }
    @media print{
      body{background:#fff}
      .rail,.topbar,.filters,.chips,.pactions,.drawer,.veil,.prod-acts{display:none!important}
      .app{display:block}
      .canvas{padding:0}
      .panel,.co,.kpis,.gauges{break-inside:avoid}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
<div class="app">
  <aside class="rail" id="rail">
    <div class="rail-brand">
      <div class="rail-mark" aria-hidden="true">RH</div>
      <div><strong>REHAVID</strong><span>Gestión de proyectos</span></div>
    </div>
    <div class="rail-section">Operación</div>
    <nav class="nav" id="navMain" aria-label="Navegación principal"></nav>
    <div class="rail-section">Configuración</div>
    <nav class="nav" id="navConfig" aria-label="Configuración"></nav>
    <div class="rail-foot">
      <code>venta → activación → asignación → contacto → programación → ejecución → cierre</code>
      <div class="sig"><i aria-hidden="true"></i><span id="saveState">datos guardados</span></div>
    </div>
  </aside>

  <main class="work">
    <header class="topbar">
      <button class="btn btn-icon menu-btn" id="menuBtn" aria-label="Abrir menú" aria-expanded="false">≡</button>
      <div class="crumb"><h1 id="pageTitle">Dashboard</h1><p id="pageSubtitle"></p></div>
      <div class="search">
        <span class="ic" aria-hidden="true">/</span>
        <label class="sr-only" for="globalSearch">Buscar</label>
        <input id="globalSearch" type="search" placeholder="Buscar empresa, proyecto, PPR, producto o responsable…" />
      </div>
      <div class="top-actions">
        <div class="who">
          <label for="sessionUser">Sesión</label>
          <select id="sessionUser" title="Usuario que queda registrado en la bitácora y define los permisos"></select>
          <span class="role" id="sessionRole">—</span>
        </div>
        <button class="btn btn-primary" data-action="new-sale">+ Venta realizada</button>
      </div>
    </header>

    <div class="canvas">
      <div id="demoBanner"></div>
      <div id="filterBar"></div>
      <div class="chips" id="activeFilters"></div>
      <div id="viewRoot"></div>
    </div>
  </main>
</div>

<div class="veil" id="drawerVeil"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="drawerHeading">
  <div class="drawer-head" id="drawerHead"></div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFooter"></div>
</aside>

<div class="mveil" id="modalVeil"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<input type="file" id="importFile" accept=".json,.csv,application/json,text/csv" hidden />
<div id="dataLists"></div>
<div class="toasts" id="toastZone" role="status" aria-live="polite"></div>

<script>
"use strict";
/* =============================================================================
   REHAVID · Gestión de proyectos · v5
   Implementa la "Especificación funcional y flujograma del proceso de gestión
   de proyectos" v1.0 (11/08/2026).

   Estructura del archivo
     1. Catálogos y parámetros            5. Motor de asignación y notificaciones
     2. Utilidades                         6. Persistencia y migración
     3. Modelo de datos                    7. Vistas
     4. Lógica derivada (estado,           8. Detalle, registro de venta y acciones
        condición, alertas)                9. Eventos e inicialización
   ============================================================================= */

/* ------------------------------ 1. CATÁLOGOS ------------------------------ */

const APP_VERSION = "5.0.0";
const STORAGE_KEY = "rehavid_gestion_proyectos_v5";
const LEGACY_STORAGE_KEY = "rehavid_project_hub_v1";   // base de la versión 4

const PROJECT_TYPES   = ["Tipo 1", "Tipo 2"];
const PROJECT_STATES  = ["Borrador", "Activo", "Cerrado"];                                   // ciclo del proyecto maestro
const PRODUCT_STATES  = ["Pendiente de contacto", "Programado", "En ejecución",
                         "Suspendido", "Finalizado", "Cerrado"];                             // §7.1 estado operativo
const CONDITIONS      = ["En tiempo", "En riesgo", "Retrasado"];                             // §7.1 condición de gestión
const ROUTINGS        = ["Tipo 1", "Tipo 2", "Medición objetiva", "Tablero BI", "Diseño", "Otra"];
const TECHNOLOGIES    = ["Xsens", "TuMeke", "BVB", "Tobii 3",
                         "Electromiografía de superficie", "Biofeedback"];
const COMPLEXITIES    = ["Baja", "Media", "Alta"];
const NOVELTY_TYPES   = ["Retraso", "Suspensión", "Reanudación"];
const EVENT_TYPES     = ["Creado", "Activado", "Asignado", "Aceptado", "Reasignado", "Contactado",
                         "Programado", "Reprogramado", "Actualizado", "Suspendido", "Reanudado",
                         "Entregable cargado", "Finalizado", "Cerrado", "Editado", "Importado"];

// El estado operativo menos avanzado define el estado global del proyecto (RN-13).
const STATE_RANK = { "Pendiente de contacto": 0, "Suspendido": 1, "Programado": 2,
                     "En ejecución": 3, "Finalizado": 4, "Cerrado": 5 };
const CONDITION_RANK = { "Retrasado": 0, "En riesgo": 1, "En tiempo": 2 };
const OPEN_STATES = ["Pendiente de contacto", "Programado", "En ejecución", "Suspendido"];

// §7.3 · Alertas de gestión. `test` recibe (producto, proyecto, sla) y devuelve
// false o el texto de detalle que se muestra en el centro de alertas.
const ALERT_DEFS = [
  { code: "not_accepted", label: "Asignación no aceptada", severity: "Alta",
    desc: "El responsable no ha confirmado la tarea dentro del acuerdo de servicio configurado.",
    test: (pr, p, sla) => {
      if (p.state !== "Activo" || !isOpenProduct(pr) || pr.acceptedAt || !pr.assignedAt) return false;
      const h = hoursSince(pr.assignedAt);
      return h > sla.acceptHours ? `Asignado hace ${fmtNum(h / 24)} día(s); el acuerdo es de ${sla.acceptHours} h.` : false;
    } },
  { code: "not_contacted", label: "Cliente no contactado", severity: "Alta",
    desc: "Existe asignación, pero no hay registro de contacto.",
    test: (pr, p, sla) => {
      if (p.state !== "Activo" || !isOpenProduct(pr) || pr.contactedAt) return false;
      const base = pr.acceptedAt || pr.assignedAt;
      if (!base) return false;
      const d = Math.floor(hoursSince(base) / 24);
      return d > sla.contactDays ? `Sin registro de contacto ${d} día(s) después de la asignación.` : false;
    } },
  { code: "not_scheduled", label: "Sin programación", severity: "Alta",
    desc: "El producto fue vendido, pero no tiene fecha confirmada con el cliente.",
    test: (pr, p, sla) => {
      if (p.state !== "Activo" || !isOpenProduct(pr)) return false;
      if (pr.startDate && pr.endDate && pr.scheduleConfirmed) return false;
      const base = p.activatedAt || p.createdAt;
      const d = base ? Math.floor(hoursSince(base) / 24) : 0;
      return d > sla.scheduleDays
        ? `Sin programación confirmada ${d} día(s) después de activar el proyecto.`
        : (!pr.startDate && !pr.endDate ? "Sin fechas confirmadas con el cliente." : false);
    } },
  { code: "due_soon", label: "Próximo a vencer", severity: "Media",
    desc: "La fecha objetivo se aproxima y el avance no es suficiente.",
    test: (pr, p, sla) => {
      if (!isOpenProduct(pr) || !pr.endDate) return false;
      const left = daysUntil(pr.endDate);
      if (left === null || left < 0 || left > sla.dueSoonDays) return false;
      const expected = expectedProgress(pr);
      const real = productProgress(pr);
      return real + sla.progressTolerance < expected
        ? `Faltan ${left} día(s) y el avance es ${fmtPct(real)} frente a ${fmtPct(expected)} esperado.`
        : false;
    } },
  { code: "overdue", label: "Retrasado", severity: "Crítica",
    desc: "La fecha programada venció sin cierre.",
    test: (pr) => {
      if (!isOpenProduct(pr) || !pr.endDate) return false;
      const left = daysUntil(pr.endDate);
      return left !== null && left < 0 ? `Venció el ${formatDate(pr.endDate, true)} (${Math.abs(left)} día(s)).` : false;
    } },
  { code: "suspended", label: "Suspendido", severity: "Alta",
    desc: "La actividad está detenida y debe existir causa, responsable y fecha de revisión.",
    test: (pr) => {
      if (pr.status !== "Suspendido") return false;
      const n = lastNovelty(pr, "Suspensión");
      if (!n || !n.cause || !n.owner || !n.newDate) return "Suspendido sin causa, responsable o fecha de revisión completa (RN-08).";
      return `Causa: ${n.cause} · revisión ${formatDate(n.newDate, true)}.`;
    } },
  { code: "stale", label: "Sin actualización", severity: "Media",
    desc: "No se han registrado novedades durante el periodo de control configurado.",
    test: (pr, p, sla) => {
      if (p.state !== "Activo" || !["Programado", "En ejecución"].includes(pr.status)) return false;
      const base = pr.lastUpdateAt || pr.assignedAt || p.activatedAt;
      if (!base) return false;
      const d = Math.floor(hoursSince(base) / 24);
      return d > sla.updateDays ? `Última actualización hace ${d} día(s).` : false;
    } },
  { code: "hours_deviation", label: "Desviación de horas", severity: "Alta",
    desc: "Las horas ejecutadas superan o se aproximan al límite vendido.",
    test: (pr, p, sla) => {
      const sold = Number(pr.hoursSold) || 0, used = Number(pr.hoursExecuted) || 0;
      if (pr.status === "Cerrado" || sold <= 0) return false;
      const pct = used / sold * 100;
      if (pct > 100) return `${fmtNum(used)} h ejecutadas sobre ${fmtNum(sold)} h vendidas (${fmtPct(pct)}).`;
      if (!isOpenProduct(pr)) return false;   // ya finalizado y dentro de lo vendido: no hay nada que gestionar
      return pct >= sla.hoursWarnPct ? `${fmtPct(pct)} de las horas vendidas consumidas (saldo ${fmtNum(sold - used)} h).` : false;
    } }
];

/* ------------------------------ 2. UTILIDADES ------------------------------ */

function clone(v) { return JSON.parse(JSON.stringify(v)); }
function uid(prefix = "id") { return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`; }
function esc(v) {
  return String(v ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
                        .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}
function norm(v) { return String(v ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim(); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, Number(v) || 0)); }
function sum(list, getter = x => x) { return (list || []).reduce((a, x) => a + (Number(getter(x)) || 0), 0); }
function avg(list, getter = x => x) { return (list || []).length ? sum(list, getter) / list.length : 0; }
function unique(list) {
  return [...new Set((list || []).map(x => String(x ?? "").trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, "es"));
}
function groupBy(list, getter) {
  const m = new Map();
  (list || []).forEach(x => { const k = getter(x) || "Sin definir"; if (!m.has(k)) m.set(k, []); m.get(k).push(x); });
  return m;
}
function initials(v) {
  return String(v || "NA").split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join("").toUpperCase();
}
function dateISO(d = new Date()) {
  const x = new Date(d);
  if (Number.isNaN(x.getTime())) return "";
  return new Date(x.getTime() - x.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function dateOffset(days) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + days); return dateISO(d); }
function toDate(v) { if (!v) return null; const d = new Date(`${String(v).slice(0, 10)}T12:00:00`); return Number.isNaN(d.getTime()) ? null : d; }
function formatDate(v, short = false) { const d = toDate(v); return d ? (short ? DATE_SHORT : DATE_LONG).format(d) : "Sin fecha"; }
function formatStamp(v) {
  if (!v) return "Sin fecha";
  const d = new Date(v);
  return Number.isNaN(d.getTime()) ? "Sin fecha"
    : `${DATE_SHORT.format(d)} ${d.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" })}`;
}
function daysUntil(v) { const d = toDate(v), t = toDate(dateISO()); return d && t ? Math.round((d - t) / 86400000) : null; }
function hoursSince(stamp) {
  const d = new Date(stamp);
  return Number.isNaN(d.getTime()) ? 0 : Math.max(0, (Date.now() - d.getTime()) / 3600000);
}
function fmtMoney(v) { return MONEY.format(Number(v) || 0); }
/** Cifra compacta para tablas: $ 29,4 M / $ 850 k. */
function fmtMoneyShort(v) {
  const n = Number(v) || 0, abs = Math.abs(n);
  if (abs >= 1e6) return `$ ${NUM.format(n / 1e6)} M`;
  if (abs >= 1e3) return `$ ${NUM.format(Math.round(n / 1e3))} k`;
  return MONEY.format(n);
}
function fmtNum(v) { return NUM.format(Number(v) || 0); }
function fmtPct(v) { return `${Math.round(Number(v) || 0)}%`; }
function isEmail(v) { return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(String(v || "").trim()); }
function isPhone(v) { return String(v || "").replace(/[^\d]/g, "").length >= 7; }
function setPath(obj, path, value) {
  const parts = String(path).split(".");
  let t = obj;
  parts.slice(0, -1).forEach(k => { if (!t[k] || typeof t[k] !== "object") t[k] = {}; t = t[k]; });
  t[parts.at(-1)] = value;
}
function getPath(obj, path) { return String(path).split(".").reduce((v, k) => v?.[k], obj); }
function mergeDeep(target, source) {
  Object.entries(source || {}).forEach(([k, v]) => {
    if (v && typeof v === "object" && !Array.isArray(v) && target[k] && typeof target[k] === "object") mergeDeep(target[k], v);
    else target[k] = v;
  });
  return target;
}

  if (!p.code) p.code = nextProjectCode();
  if (p.contacts.length && p.contacts.every(c => !c.primary)) p.contacts[0].primary = true;

}
function nextProjectCode() {
  const year = new Date().getFullYear();
  const used = new Set((state.projects || []).map(p => String(p.code || "").toUpperCase()));
  let n = (state.projects || []).reduce((max, p) => {
    const m = /^PRY-(\d{4})-(\d+)$/i.exec(String(p.code || ""));
    return m && Number(m[1]) === year ? Math.max(max, Number(m[2])) : max;
  }, 0);

}
function duplicateCandidates(p) {
  return state.projects.filter(x =>
    x.id !== p.id && x.state !== "Cerrado" && norm(x.company) === norm(p.company) &&
    ((String(p.commercialRef || "").trim() && norm(x.commercialRef) === norm(p.commercialRef)) ||
     (norm(x.ppr) === norm(p.ppr) && norm(x.ppr) !== "")));
}
function logEvent(p, { type = "Editado", entity = "", field = "", before = "", after = "", reason = "" }) {
  p.log = p.log || [];
  p.log.unshift({ id: uid("log"), date: new Date().toISOString(), user: currentUser(),
                  type, entity, field, before: String(before ?? ""), after: String(after ?? ""), reason });
  if (p.log.length > 500) p.log.length = 500;

/* --------------------- 4. LÓGICA DERIVADA (RN-13, §7.1) --------------------- */

function isOpenProduct(pr) { return OPEN_STATES.includes(pr.status); }
function lastNovelty(pr, type) {
  return (pr.novelties || []).filter(n => !type || n.type === type)
    .sort((a, b) => String(b.date).localeCompare(String(a.date)))[0] || null;
}
function productProgress(pr) {
  if (["Finalizado", "Cerrado"].includes(pr.status)) return 100;
  const ms = pr.milestones || [];
  if (ms.length) {
    const weight = sum(ms, m => Math.max(0, m.hoursAssigned));
    return weight ? clamp(sum(ms, m => clamp(m.progress, 0, 100) * Math.max(0, m.hoursAssigned)) / weight, 0, 100)
                  : clamp(avg(ms, m => m.progress), 0, 100);
  }
  return clamp(pr.progress, 0, 100);
}
function usesMilestoneProgress(pr) { return (pr.milestones || []).length > 0 && !["Finalizado", "Cerrado"].includes(pr.status); }
function expectedProgress(pr) {
  const start = toDate(pr.startDate), end = toDate(pr.endDate), today = toDate(dateISO());
  if (!start || !end || !today || end <= start) return 0;
  return clamp((today - start) / (end - start) * 100, 0, 100);
}
function productHoursBalance(pr) { return (Number(pr.hoursSold) || 0) - (Number(pr.hoursExecuted) || 0); }
function productValue(pr) { return (Number(pr.hoursSold) || 0) * (Number(pr.hourRate) || 0); }
function projectValue(p) { return sum(p.products, productValue); }
function projectHoursSold(p) { return sum(p.products, x => x.hoursSold); }              // RN-03 · suma automática
function projectHoursExecuted(p) { return sum(p.products, x => x.hoursExecuted); }
function projectProgress(p) {
  const list = p.products || [];
  if (!list.length) return 0;
  const weight = sum(list, x => Math.max(0, x.hoursSold));
  return weight ? clamp(sum(list, x => productProgress(x) * Math.max(0, x.hoursSold)) / weight, 0, 100)
                : clamp(avg(list, productProgress), 0, 100);
}
function projectGlobalState(p) {
  if (p.state === "Borrador") return "Borrador";
  const list = p.products || [];
  if (!list.length) return "Sin productos";
  if (list.every(x => x.status === "Cerrado")) return "Cerrado";
  return list.slice().sort((a, b) => STATE_RANK[a.status] - STATE_RANK[b.status])[0].status;
}
function productAlerts(pr, p) {
  const sla = state.settings.sla;
  const out = [];
  ALERT_DEFS.forEach(def => {
    let detail = false;
    try { detail = def.test(pr, p, sla); } catch (e) { console.error("Alerta", def.code, e); }
    if (detail) out.push({ code: def.code, label: def.label, severity: def.severity,
                           detail: typeof detail === "string" ? detail : def.desc,
                           projectId: p.id, productId: pr.id, productName: pr.name, owner: pr.owner });
  });
  return out.sort((a, b) => SEVERITY_RANK[a.severity] - SEVERITY_RANK[b.severity]);
}
function projectAlerts(p) { return (p.products || []).flatMap(pr => productAlerts(pr, p)); }
function productCondition(pr, p) {
  if (!isOpenProduct(pr)) return "En tiempo";
  const alerts = productAlerts(pr, p).map(a => a.code);
  if (alerts.includes("overdue")) return "Retrasado";
  if (pr.status === "Suspendido") {
    const n = lastNovelty(pr, "Suspensión");
    const left = n && n.newDate ? daysUntil(n.newDate) : null;
    return left !== null && left < 0 ? "Retrasado" : "En riesgo";
  }
  return alerts.length ? "En riesgo" : "En tiempo";
}
function projectCondition(p) {
  if (p.state === "Borrador") return "En tiempo";
  const list = (p.products || []).filter(isOpenProduct);
  if (!list.length) return "En tiempo";
  return list.map(pr => productCondition(pr, p))
    .sort((a, b) => CONDITION_RANK[a] - CONDITION_RANK[b])[0];
}
function conditionColor(c) { return c === "Retrasado" ? "red" : c === "En riesgo" ? "amber" : "green"; }
function stateColor(s) {
  if (s === "Cerrado") return "gray";
  if (s === "Finalizado") return "green";
  if (s === "En ejecución") return "blue";
  if (s === "Suspendido") return "red";
  if (s === "Programado") return "violet";
  if (s === "Borrador" || s === "Sin productos") return "gray";
  return "amber";                                   // Pendiente de contacto
}
function topAlert(p) {
  const list = projectAlerts(p);
  if (!list.length) {
    if (p.state === "Borrador") return { label: "Borrador sin activar", detail: "Complete las validaciones para activar.", severity: "Media", color: "amber" };
    if (p.state === "Cerrado") return { label: "Proyecto cerrado", detail: "Todos los productos están cerrados.", severity: "", color: "green" };
    return { label: "Sin alertas", detail: "Dentro de control.", severity: "", color: "green" };
  }
  const a = list[0];
  return { ...a, color: a.severity === "Crítica" ? "red" : a.severity === "Alta" ? "red" : "amber",
           detail: `${a.productName}: ${a.detail}`, extra: list.length - 1 };
}
function nextCommitment(p) {
  // Próximo compromiso = la fecha más cercana entre programación e hitos confirmados.
  const items = [];
  (p.products || []).filter(isOpenProduct).forEach(pr => {
    if (pr.endDate) items.push({ date: pr.endDate, label: `Cierre de ${pr.name}`, owner: pr.owner, productId: pr.id });
    (pr.milestones || []).filter(m => m.date && m.progress < 100)
      .forEach(m => items.push({ date: m.date, label: `${pr.name} · ${m.name}`, owner: m.owner || pr.owner, productId: pr.id }));
    const n = lastNovelty(pr, "Suspensión");
    if (pr.status === "Suspendido" && n?.newDate) items.push({ date: n.newDate, label: `Revisión de suspensión · ${pr.name}`, owner: n.owner || pr.owner, productId: pr.id });
  });
  return items.sort((a, b) => a.date.localeCompare(b.date))[0] || null;
}
function lastProjectUpdate(p) {
  return [p.updatedAt, ...(p.products || []).map(x => x.lastUpdateAt)]
    .filter(Boolean).sort().at(-1) || p.updatedAt;
}
function canCloseProduct(pr) {
  // RN-10 · no se finaliza sin entregable o evidencia de cumplimiento.
  return Boolean(String(pr.deliverable?.description || "").trim() || String(pr.deliverable?.url || "").trim());
}
function canCloseProject(p) {
  // RN-11 · el proyecto maestro solo se cierra cuando todos sus productos están cerrados.
  return (p.products || []).length > 0 && p.products.every(x => x.status === "Cerrado");
}

/* ------------------- 4.b PERMISOS POR ROL Y POR RESPONSABLE -------------------
   Requisito operativo: solo el responsable de un producto puede editar sus
   avances y retrasos. La coordinación del proyecto gestiona la asignación y la
   programación; la administración puede intervenir en todo y queda registrada
   en la bitácora igual que cualquier otro usuario.
   --------------------------------------------------------------------------- */

function peopleList() { return (state.settings.catalogs.people || []).map(x => x.name); }
function roleOf(name) {
  const p = (state.settings.catalogs.people || []).find(x => norm(x.name) === norm(name));
  return p ? (ROLES.includes(p.role) ? p.role : "Responsable") : "Responsable";
}
function myRole() { return roleOf(currentUser()); }
function isAdmin() { return myRole() === "Administrador"; }
function isCoordinatorOf(p) { return isAdmin() || norm(p.coordinator) === norm(currentUser()); }
function isOwnerOf(pr) { return norm(pr.owner) === norm(currentUser()); }

/** Avance, retraso, suspensión, reanudación y finalización: solo el responsable. */
function canEditProgress(p, pr) { return isAdmin() || isOwnerOf(pr); }
/** Aceptación de la tarea: la acepta quien la tiene asignada. */
function canAccept(p, pr) { return isAdmin() || isOwnerOf(pr); }
/** Contacto y programación: el responsable o la coordinación del proyecto. */
function canSchedule(p, pr) { return isAdmin() || isOwnerOf(pr) || isCoordinatorOf(p); }
/** Reasignar y cerrar producto o proyecto: coordinación o administración. */
function canCoordinate(p) { return isAdmin() || isCoordinatorOf(p) || myRole() === "Coordinación"; }
/** Parametrización y manejo de bases. */
function canConfigure() { return isAdmin() || myRole() === "Coordinación"; }
function denyReason(kind, p, pr) {
  if (kind === "progress") return `Solo ${pr.owner || "el responsable asignado"} puede registrar avances o retrasos de este producto.`;
  if (kind === "accept") return `La asignación la acepta ${pr.owner || "el responsable asignado"}.`;
  if (kind === "schedule") return `Programar requiere ser el responsable del producto o la coordinación (${p.coordinator || "sin definir"}).`;
  if (kind === "coordinate") return `Esta acción es de la coordinación (${p.coordinator || "sin definir"}) o de administración.`;
  return "No tiene permisos para esta acción con el usuario en sesión.";
}
function permissionFor(kind, p, pr) {
  const ok = kind === "progress" ? canEditProgress(p, pr)
           : kind === "accept" ? canAccept(p, pr)
           : kind === "schedule" ? canSchedule(p, pr)
           : kind === "coordinate" ? canCoordinate(p)
           : true;
  return { ok, reason: ok ? "" : denyReason(kind, p, pr) };
}

/* ------------- 5. MOTOR DE ASIGNACIÓN Y NOTIFICACIONES (§5.5, §6) ------------- */

function activeRules() { return (state.settings.assignmentRules || []).filter(r => r.active !== false); }
function matchRuleValue(rule, p, pr) {
  const value = rule.scope === "project" ? p[rule.field] : (pr ? pr[rule.field] : "");
  return norm(value) === norm(rule.value);
}
function resolveCoordinator(p) {
  const rule = activeRules().find(r => r.scope === "project" && matchRuleValue(r, p, null));
  return rule ? rule.assignTo : "";
}
function resolveProductOwner(p, pr) {
  const rule = activeRules().find(r => r.scope === "product" && matchRuleValue(r, p, pr));
  return rule ? rule.assignTo : resolveCoordinator(p);
}
/**
 * Evalúa todas las reglas en paralelo (RN-05). Devuelve la lista de asignaciones
 * previstas: una para el coordinador del proyecto y una por cada producto.
 */
function planAssignments(p) {
  const out = [];
  const coordinator = resolveCoordinator(p);
  if (coordinator) out.push({ scope: "project", to: coordinator, productId: "", productName: "",
                              reason: `Tipo de proyecto = ${p.type}` });
  (p.products || []).forEach(pr => {
    const rule = activeRules().find(r => r.scope === "product" && matchRuleValue(r, p, pr));
    const to = pr.owner || (rule ? rule.assignTo : coordinator);
    if (!to) return;
    out.push({ scope: "product", to, productId: pr.id, productName: pr.name,
               reason: rule ? `Producto = ${rule.value}` : `Tipo de proyecto = ${p.type}` });
  });
  return out;
}
function notificationBody(p, assignment) {
  const pr = (p.products || []).find(x => x.id === assignment.productId);
  const principal = (p.contacts || []).find(c => c.primary) || (p.contacts || [])[0];
  const lines = [
    `Proyecto: ${p.code} · ${p.company}`,
    `PPR: ${p.ppr} · Tipo: ${p.type} · Vendedor: ${p.seller || "Sin registrar"}`,
    ""
  ];
  if (pr) {
    lines.push(`Producto asignado: ${pr.name}`,
               `Horas vendidas: ${fmtNum(pr.hoursSold)} h · Categoría: ${pr.routing}`);
    if (pr.technology) lines.push(`Tecnología: ${pr.technology}`);
    if (pr.complexity) lines.push(`Complejidad de diseño: ${pr.complexity}`);
  } else {
    lines.push(`Coordinación del proyecto (${p.products.length} producto[s], ${fmtNum(projectHoursSold(p))} h vendidas)`);
  }
  lines.push("",
    `Plan estimado: ${p.estimatedPlan || "Sin registrar"}`,
    `Fecha objetivo inicial: ${pr && pr.endDate ? formatDate(pr.endDate) : "Por confirmar con el cliente"}`,
    "",
    "Contactos del cliente:");
  (p.contacts || []).forEach(c => lines.push(
    `  · ${c.name}${c.role ? ` (${c.role})` : ""} — ${c.email || "sin correo"} — ${c.phone || "sin teléfono"}${c.primary ? "  [PRINCIPAL]" : ""}`));
  if (!p.contacts?.length) lines.push("  · Sin contactos registrados");
  lines.push("",
    "Acción requerida: aceptar la asignación, contactar al cliente, confirmar la programación y actualizar el panel.",
    `Enlace directo: abrir la aplicación → Mis asignaciones → ${p.code}${pr ? ` → ${pr.name}` : ""}`,
    "",
    `Contacto principal: ${principal ? `${principal.name} · ${principal.email || "sin correo"} · ${principal.phone || "sin teléfono"}` : "sin definir"}`);
  return lines.join("\n");
}
function queueNotification(p, assignment) {
  const pr = (p.products || []).find(x => x.id === assignment.productId);
  state.outbox.unshift({
    id: uid("ntf"),
    date: new Date().toISOString(),
    to: assignment.to,
    scope: assignment.scope,
    projectId: p.id,
    projectCode: p.code,
    company: p.company,
    productId: assignment.productId,
    productName: assignment.productName,
    reason: assignment.reason,
    subject: `[${p.code}] ${pr ? `Producto asignado: ${pr.name}` : `Coordinación de proyecto ${p.type}`} · ${p.company}`,
    body: notificationBody(p, assignment),
    status: "Pendiente de envío"
  });
  if (state.outbox.length > 400) state.outbox.length = 400;
}
/** §5.4 y §5.5 · activa el proyecto, asigna responsables y genera las notificaciones. */
function runAssignmentEngine(p, { silent = false } = {}) {
  const coordinator = resolveCoordinator(p);
  if (coordinator && !p.coordinator) p.coordinator = coordinator;
  const stamp = new Date().toISOString();
  const plan = planAssignments(p);
  plan.forEach(a => {
    if (a.scope === "product") {
      const pr = p.products.find(x => x.id === a.productId);
      if (!pr) return;
      if (!pr.owner) pr.owner = a.to;
      if (!pr.assignedAt) pr.assignedAt = stamp;
      if (!pr.lastUpdateAt) pr.lastUpdateAt = stamp;
      logEvent(p, { type: "Asignado", entity: pr.name, field: "responsable", after: pr.owner, reason: a.reason });
    } else {
      logEvent(p, { type: "Asignado", entity: "Proyecto", field: "coordinación", after: a.to, reason: a.reason });
    }
    queueNotification(p, { ...a, to: a.scope === "product" ? (p.products.find(x => x.id === a.productId)?.owner || a.to) : a.to });
  });
  if (!silent) toast("Asignaciones generadas", `${plan.length} notificación(es) en la bandeja de envío.`);
  return plan;
}

/* ------------------- 6. PERSISTENCIA, MIGRACIÓN Y DEMOSTRACIÓN ------------------- */

/** Los catálogos guardan objetos; estas ayudas devuelven los nombres para listas y selectores. */
function catalogNames(key) {
  return (state.settings.catalogs[key] || []).map(x => (typeof x === "string" ? x : x.name)).filter(Boolean);
}
function catalogFind(key, name) {
  return (state.settings.catalogs[key] || []).find(x => norm(typeof x === "string" ? x : x.name) === norm(name)) || null;
}
/** Normaliza catálogos antiguos (listas de texto) al formato de objetos. */
function normalizeCatalogs(c) {
  const asObjects = (list, extra = {}) => (list || []).map(x =>
    typeof x === "string" ? { name: x, ...extra } : { ...extra, ...x, name: String(x.name || "").trim() })
    .filter(x => x.name);
  c.companies = asObjects(c.companies, { nit: "", notes: "" });
  c.pprs = asObjects(c.pprs, { notes: "" });
  c.products = asObjects(c.products, { hours: 0, rate: 0, routing: "Otra" })
    .map(x => ({ ...x, hours: Number(x.hours) || 0, rate: Number(x.rate) || 0,
                 routing: ROUTINGS.includes(x.routing) ? x.routing : "Otra" }));
  c.people = asObjects(c.people, { role: "Responsable" })
    .map(x => ({ ...x, role: ROLES.includes(x.role) ? x.role : "Responsable" }));
  c.serviceOrders = asObjects(c.serviceOrders, { company: "", date: "", notes: "" })
    .map(x => ({ ...x, code: x.code || x.name, name: x.name || x.code }));
  c.sellers = unique(catalogNamesFrom(c.sellers));
  c.technologies = unique(catalogNamesFrom(c.technologies));
  c.deliverables = unique(catalogNamesFrom(c.deliverables));
  return c;
}
function catalogNamesFrom(list) {
  return (list || []).map(x => (typeof x === "string" ? x : x.name)).filter(Boolean);
}

function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); }
  catch (e) { console.error(e); toast("Almacenamiento no disponible", "Los cambios no se conservarán al cerrar.", "error"); }

  if (raw) {
    try {
      const saved = JSON.parse(raw);
      state.projects = Array.isArray(saved.projects) ? saved.projects.map(makeProject) : [];
      state.outbox = Array.isArray(saved.outbox) ? saved.outbox : [];
      state.settings = mergeDeep(clone(DEFAULT_SETTINGS), saved.settings || {});
      if (saved.session?.user) state.session.user = saved.session.user;
      syncCatalogs();
      return;
    } catch (e) {
      console.error(e);
      toast("No se pudieron leer los datos guardados", "Se cargó una base demostrativa.", "warning");
    }
  }
  // Migración automática desde la versión 4 (mismo navegador).
  try {
    const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
    if (legacy) {
      const data = JSON.parse(legacy);
      if (Array.isArray(data.projects) && data.projects.length) {
        state.projects = data.projects.map(migrateLegacyProject).filter(Boolean);
        syncCatalogs();
        saveState(true);
        toast("Base de la versión 4 migrada", `${state.projects.length} proyecto(s) convertidos al modelo de productos.`);
        return;
      }
    }
  } catch (e) { console.error(e); }

  state.projects = demoProjects();
  syncCatalogs();
  saveState(true);
}
function saveState(silent = false) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      version: APP_VERSION, savedAt: new Date().toISOString(),
      projects: state.projects, outbox: state.outbox,
      settings: state.settings, session: state.session
    }));
    const el = document.getElementById("saveState");
    if (el) el.textContent = `guardado ${new Date().toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" })}`;
  } catch (e) {
    console.error(e);
    if (!silent) toast("No fue posible guardar", "Descargue un respaldo JSON antes de cerrar el navegador.", "error");
  }
}
/** Los catálogos se alimentan solos con lo que aparece en los proyectos, sin borrar lo parametrizado. */
function syncCatalogs() {
  const c = normalizeCatalogs(state.settings.catalogs || (state.settings.catalogs = clone(DEFAULT_SETTINGS.catalogs)));
  const addMissing = (key, names, extra = {}) => {
    names.filter(Boolean).forEach(n => {
      if (!catalogFind(key, n)) c[key].push({ name: String(n).trim(), ...extra });
    });
    c[key].sort((a, b) => a.name.localeCompare(b.name, "es"));
  };
  addMissing("companies", state.projects.map(p => p.company), { nit: "", notes: "" });
  addMissing("pprs", state.projects.map(p => p.ppr), { notes: "" });
  addMissing("products", state.projects.flatMap(p => (p.products || []).map(x => x.name)), { hours: 0, rate: 0, routing: "Otra" });
  addMissing("people", [
    ...(state.settings.assignmentRules || []).map(r => r.assignTo),
    ...state.projects.map(p => p.coordinator),
    ...state.projects.flatMap(p => (p.products || []).map(x => x.owner))
  ], { role: "Responsable" });
  state.projects.filter(p => p.commercialRef).forEach(p => {
    if (!catalogFind("serviceOrders", p.commercialRef)) {
      c.serviceOrders.push({ name: p.commercialRef, code: p.commercialRef, company: p.company, date: p.saleDate, notes: "" });
    }
  });
  c.sellers = unique([...c.sellers, ...state.projects.map(p => p.seller)]);
  if (!peopleList().includes(state.session.user)) state.session.user = peopleList()[0] || "Usuario";
}

/** Convierte un proyecto de la versión 4 (actividades con nombre de producto) al modelo v5. */
function migrateLegacyProject(old = {}) {
  const stageMap = {
    "Venta aprobada": "Pendiente de contacto", "Transferencia": "Pendiente de contacto",
    "Planeación": "Programado", "Ejecución": "En ejecución", "Validación técnica": "En ejecución",
    "Cierre integral": "Finalizado", "Cerrado": "Cerrado"
  };
  const status = stageMap[old.stage] || "Pendiente de contacto";
  const groups = groupBy(Array.isArray(old.workItems) ? old.workItems : [],
                         a => String(a.product || "").trim() || old.service || old.title || "Producto principal");
  const names = [...groups.keys()];
  const soldTotal = Number(old.hoursSold) || 0;
  const rate = soldTotal > 0 ? Math.round((Number(old.value) || 0) / soldTotal) : 0;
  const products = (names.length ? names : [old.service || old.title || "Producto principal"]).map((name, index) => {
    const items = groups.get(name) || [];
    const assigned = sum(items, a => a.hoursAssigned);
    return makeProduct({
      name,
      hoursSold: assigned > 0 ? assigned : (soldTotal / (names.length || 1)) || 0,
      hourRate: rate,
      hoursExecuted: items.length ? sum(items, a => a.hoursExecuted) : Number(old.hoursExecuted) || 0,
      routing: /bi|tablero/i.test(name) ? "Tablero BI" : /dise/i.test(name) ? "Diseño" : (old.type === "Tipo 2" ? "Tipo 2" : "Tipo 1"),
      complexity: /dise/i.test(name) ? "Media" : "",
      owner: old.projectLead || old.currentOwner || "",
      assignedAt: old.createdAt || new Date().toISOString(),
      startDate: old.startDate || "", endDate: old.dueDate || "",
      plannedStart: old.startDate || "", plannedEnd: old.dueDate || "",
      scheduleConfirmed: Boolean(old.startDate && old.dueDate),
      status: items.length && items.every(a => ["Completado", "Cancelado"].includes(a.status)) ? "Finalizado" : status,
      progress: clamp(old.stage === "Cerrado" ? 100 : 0, 0, 100),
      lastUpdateAt: old.updatedAt || old.createdAt || "",
      notes: [old.scope, old.deliverables].filter(Boolean).join(" · "),
      deliverable: { description: old.deliverables || "", url: "", validatedBy: "", validatedAt: "" },
      milestones: items.map(a => makeMilestone({
        name: a.activity, owner: a.owner, date: a.dueDate, baselineDate: a.dueDate,
        confirmed: Boolean(a.dueDate),
        progress: ["Completado"].includes(a.status) ? 100 : clamp(a.progress, 0, 100),
        hoursAssigned: a.hoursAssigned, hoursExecuted: a.hoursExecuted, notes: a.notes
      })),
      // Los bloqueos del proyecto v4 se adjuntan solo al primer producto para no duplicarlos.
      novelties: (index > 0 ? [] : (old.blockers || []).filter(b => !b.resolved)).map(b => makeNovelty({
        type: "Retraso", cause: b.description, action: "Migrado desde la versión 4",
        owner: b.owner || old.projectLead, newDate: b.dueDate, date: old.updatedAt
      }))
    });
  });
  const contacts = old.clientContact || old.clientEmail || old.clientPhone
    ? [makeContact({ name: old.clientContact || "Contacto del cliente", email: old.clientEmail, phone: old.clientPhone, primary: true })]
    : [];
  const p = makeProject({
    id: old.id, code: old.code, company: old.company, ppr: old.ppr, type: old.type,
    seller: old.portfolioOwner || "", saleDate: old.orderDate || dateISO(),
    commercialRef: old.code || "", estimatedPlan: old.scope || old.notes || "Plan migrado desde la versión 4",
    coordinator: old.portfolioOwner || "", contacts, products,
    state: old.stage === "Cerrado" || old.status === "Cerrado" ? "Cerrado" : "Activo",
    activatedAt: old.createdAt || new Date().toISOString(),
    invoicedValue: old.invoicedValue, notes: old.notes,
    createdAt: old.createdAt, updatedAt: old.updatedAt,
    demo: /demostraci|^DEM-/i.test(`${old.company} ${old.code}`)
  });
  if (p.state === "Cerrado") p.products.forEach(pr => { pr.status = "Cerrado"; pr.progress = 100; });
  logEvent(p, { type: "Importado", entity: "Proyecto", field: "modelo de datos",
                before: "v4 · actividades", after: `v5 · ${p.products.length} producto(s)`,
                reason: "Migración automática: las actividades se agruparon como productos e hitos." });
  return p;
}

const FILTER_DEFS = [
  { key: "company",     label: "Empresa",           get: p => [p.company] },
  { key: "ppr",         label: "PPR",               get: p => [p.ppr] },
  { key: "type",        label: "Tipo de proyecto",  get: p => [p.type] },
  { key: "projectState",label: "Estado del proyecto", get: p => [p.state] },
  { key: "globalState", label: "Estado operativo",  get: p => [projectGlobalState(p)] },
  { key: "coordinator", label: "Coordinación",      get: p => [p.coordinator] },
  { key: "owner",       label: "Responsable",       get: p => (p.products || []).map(x => x.owner) },
  { key: "routing",     label: "Categoría",         get: p => (p.products || []).map(x => x.routing) },
  { key: "condition",   label: "Condición",         get: p => (p.products || []).map(x => productCondition(x, p)) },
  { key: "alert",       label: "Alerta",            get: p => unique(projectAlerts(p).map(a => a.code)),
    optionLabel: v => ALERT_BY_CODE[v]?.label || v }
];
// Filtros que se muestran en cada vista (los demás siguen activos si vienen de un clic).
const VIEW_FILTERS = {
  dashboard:   ["company", "ppr", "type", "projectState", "globalState"],
  companies:   ["company", "ppr", "type", "globalState", "owner", "condition"],
  alerts:      ["company", "ppr", "type", "owner", "alert"],
  assignments: ["company", "ppr", "condition"],
  calendar:    ["company", "ppr", "type", "owner"]
};
const SPECIAL_FILTERS = {
  active:          { label: "Proyectos activos",     test: p => p.state === "Activo" },
  draft:           { label: "Borradores",            test: p => p.state === "Borrador" },
  pending_contact: { label: "Pendientes de contacto o programación",
                     test: p => (p.products || []).some(x => isOpenProduct(x) && (x.status === "Pendiente de contacto" || !x.scheduleConfirmed)) },
  running:         { label: "Productos en ejecución", test: p => (p.products || []).some(x => x.status === "En ejecución") },
  at_risk:         { label: "En riesgo o retrasados", test: p => ["En riesgo", "Retrasado"].includes(projectCondition(p)) && p.state === "Activo" },
  suspended:       { label: "Suspendidos",           test: p => (p.products || []).some(x => x.status === "Suspendido") },
  with_alerts:     { label: "Con alertas abiertas",  test: p => projectAlerts(p).length > 0 },
  mine:            { label: "A mi cargo",            test: p => (p.products || []).some(x => isOwnerOf(x)) || isCoordinatorOf(p) }
};
function filterOptions(key) {
  const def = FILTER_DEFS.find(d => d.key === key);
  return def ? unique(state.projects.flatMap(def.get)) : [];
}
function matchesFilters(p) {
  for (const def of FILTER_DEFS) {
    const selected = state.filters[def.key];
    if (!selected || !selected.length) continue;
    const values = def.get(p).map(String);
    if (!selected.some(v => values.includes(String(v)))) return false;
  }
  for (const key of state.filters.special) {
    const sf = SPECIAL_FILTERS[key];
    if (sf && !sf.test(p)) return false;
  }
  if (state.search) {
    const haystack = norm([
      p.code, p.company, p.ppr, p.type, p.seller, p.commercialRef, p.coordinator, p.estimatedPlan, p.notes,
      ...(p.tags || []),
      ...(p.contacts || []).flatMap(c => [c.name, c.role, c.email, c.phone]),
      ...(p.products || []).flatMap(x => [x.name, x.owner, x.routing, x.technology, x.complexity, x.notes,
                                          x.deliverable?.description,
                                          ...(x.milestones || []).map(m => m.name),
                                          ...(x.novelties || []).map(n => n.cause)])
    ].join(" "));
    if (!haystack.includes(norm(state.search))) return false;
  }
  return true;
}
function visibleProjects() {
  const list = state.projects.filter(matchesFilters);
  return list.slice().sort((a, b) => {
    if (state.sort === "company") return a.company.localeCompare(b.company, "es") || a.code.localeCompare(b.code, "es");
    if (state.sort === "due") {
      const da = nextCommitment(a)?.date || "9999-12-31", db = nextCommitment(b)?.date || "9999-12-31";
      return da.localeCompare(db);
    }
    if (state.sort === "value") return projectValue(b) - projectValue(a);
    if (state.sort === "updated") return String(lastProjectUpdate(b)).localeCompare(String(lastProjectUpdate(a)));
    const ca = CONDITION_RANK[projectCondition(a)], cb = CONDITION_RANK[projectCondition(b)];
    if (ca !== cb) return ca - cb;
    const aa = projectAlerts(a).length, ab = projectAlerts(b).length;
    if (aa !== ab) return ab - aa;
    return (nextCommitment(a)?.date || "9999").localeCompare(nextCommitment(b)?.date || "9999");
  });
}
function toggleFilter(key, value) {
  if (!value) return;
  const list = state.filters[key];
  if (!list) return;
  const i = list.indexOf(value);
  if (i >= 0) list.splice(i, 1); else list.push(value);
  renderApp();
}
function setSingleFilter(key, value) { state.filters[key] = value ? [value] : []; renderApp(); }
function clearFilters() {
  Object.keys(state.filters).forEach(k => state.filters[k] = []);
  state.search = "";
  const s = document.getElementById("globalSearch");
  if (s) s.value = "";
  renderApp();
}
function activeFilterCount() {
  return Object.values(state.filters).reduce((n, x) => n + x.length, 0) + (state.search ? 1 : 0);
}
function filterLabel(key, value) {
  const def = FILTER_DEFS.find(d => d.key === key);
  if (def?.optionLabel) return def.optionLabel(value);
  if (key === "special") return SPECIAL_FILTERS[value]?.label || value;
  return value;
}
