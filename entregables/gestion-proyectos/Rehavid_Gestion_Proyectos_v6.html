function tag(text, kind) { return `<span class="tag ${kind}">${esc(text)}</span>`; }
function condKind(c) { return c === "Retrasado" ? "bad" : c === "En riesgo" ? "warn" : "ok"; }
function stateKind(s) {
  if (s === "Cerrado") return "gray";
  if (s === "Finalizado") return "ok";

  if (s === "Suspendido") return "bad";

  return `<div class="barline"><div class="bar ${kind}"><i style="width:${clamp(value, 0, 100)}%"></i>
    ${markAt !== null ? `<span class="mark" style="left:${clamp(markAt, 0, 100)}%" title="Avance esperado ${fmtPct(markAt)}"></span>` : ""}</div>
    <b>${fmtPct(value)}</b></div>`;
}
function dial(pct, kind = "acc") {
  const r = 22, c = 2 * Math.PI * r, on = c * clamp(pct, 0, 100) / 100;
  const color = { acc: "var(--accent)", bad: "var(--red)", warn: "var(--amber)", ok: "var(--green)" }[kind] || "var(--accent)";
  return `<div class="dial"><svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true">
      <circle cx="26" cy="26" r="${r}" fill="none" stroke="#edf1f6" stroke-width="6"></circle>
      <circle cx="26" cy="26" r="${r}" fill="none" stroke="${color}" stroke-width="6"
              stroke-dasharray="${on.toFixed(1)} ${(c - on).toFixed(1)}"></circle>
    </svg><b>${fmtPct(pct)}</b></div>`;
}
function stackBar(parts) {
  const total = parts.reduce((n, x) => n + x.value, 0) || 1;
  return `<div class="stack" title="${esc(parts.map(x => `${x.label}: ${x.value}`).join(" · "))}">
    ${parts.filter(x => x.value > 0).map(x => `<i style="width:${x.value / total * 100}%;background:${x.color}"></i>`).join("")}</div>`;
}
const COND_COLORS = { "En tiempo": "var(--green)", "En riesgo": "var(--amber)", "Retrasado": "var(--red)" };

/* ============================ 8.1 DASHBOARD ============================ */

function renderDashboard(projects) {
  const rows = projects.flatMap(p => (p.products || []).map(pr => ({ pr, p })));
  const activos = projects.filter(p => p.state === "Activo").length;
  const borradores = projects.filter(p => p.state === "Borrador").length;
  const sold = sum(projects, projectHoursSold);
  const used = sum(projects, projectHoursExecuted);
  const value = sum(projects, projectValue);
  const invoiced = sum(projects, p => p.invoicedValue);
  const alerts = projects.reduce((n, p) => n + projectAlerts(p).length, 0);
  const late = rows.filter(({ pr, p }) => isOpenProduct(pr) && productCondition(pr, p) === "Retrasado").length;
  const risk = rows.filter(({ pr, p }) => isOpenProduct(pr) && productCondition(pr, p) === "En riesgo").length;
  const onTime = rows.filter(({ pr, p }) => isOpenProduct(pr) && productCondition(pr, p) === "En tiempo").length;
  const pend = rows.filter(({ pr }) => isOpenProduct(pr) && (pr.status === "Pendiente de contacto" || !pr.scheduleConfirmed)).length;
  const avance = projects.length ? sum(projects, p => projectProgress(p) * projectHoursSold(p)) / (sold || 1) : 0;

  return `
  <section class="kpis">

    ${kpi("Productos vendidos", rows.length, `${projects.length} proyecto(s)`, "", "")}
    ${kpi("Pendientes de programar", pend, "sin contacto o sin fecha", "pending_contact", pend ? "warn" : "")}
    ${kpi("Retrasados", late, "fecha objetivo vencida", "at_risk", late ? "danger" : "")}
    ${kpi("En riesgo", risk, "con alerta abierta", "with_alerts", risk ? "warn" : "")}
    ${kpi("Alertas abiertas", alerts, "ver centro de alertas", "with_alerts", alerts ? "danger" : "")}
  </section>

  <section class="gauges">
    <div class="gauge">${dial(sold ? used / sold * 100 : 0, used > sold ? "bad" : "acc")}

        <small>saldo ${fmtNum(sold - used)} h</small></div></div>
    <div class="gauge">${dial(avance, condKind(late ? "Retrasado" : risk ? "En riesgo" : "En tiempo"))}
      <div class="g-txt"><span>Avance ponderado</span><b>${fmtPct(avance)}</b>
        <small>ponderado por horas vendidas</small></div></div>
    <div class="gauge">${dial(value ? invoiced / value * 100 : 0, "ok")}
      <div class="g-txt"><span>Facturación</span><b>${fmtMoney(invoiced)}</b>
        <small>de ${fmtMoney(value)} contratados</small></div></div>
    <div class="gauge">
      <div style="flex:1">
        <span style="display:block;font-size:8px;color:var(--faint);font-weight:800;text-transform:uppercase;letter-spacing:.11em">Condición de los productos abiertos</span>
        <div style="margin-top:8px">${stackBar([

          { label: "Retrasado", value: late, color: "var(--red)" }
        ])}</div>
        <div class="hint-line" style="margin-top:6px">${onTime} en tiempo · ${risk} en riesgo · ${late} retrasados</div>
      </div>

  <div class="dash-cols">

function kpi(label, value, desc, special, kind) {

function aggPanel(title, filterKey, projects, getter) {

function planDrift(pr) {
  if (!pr.plannedEnd || !pr.endDate) return 0;
  const a = toDate(pr.plannedEnd), b = toDate(pr.endDate);
  return a && b ? Math.max(0, Math.round((b - a) / 86400000)) : 0;
}
function productActionButtons(p, pr) {
  const d = `data-project="${esc(p.id)}" data-product="${esc(pr.id)}"`;
  const btn = (kind, label, cls, permKind) => {
    const perm = permissionFor(permKind, p, pr);
    return `<button class="btn btn-xs ${cls}" data-product-action="${kind}" ${d} ${perm.ok ? "" : `disabled title="${esc(perm.reason)}"`}>${label}</button>`;
  };
  const out = [];
  if (isOpenProduct(pr) && !pr.acceptedAt) out.push(btn("accept", "Aceptar asignación", "btn-primary", "accept"));
  if (isOpenProduct(pr) && pr.acceptedAt) out.push(btn("contact", pr.contactedAt ? "Nuevo contacto" : "Registrar contacto", "", "schedule"));
  if (isOpenProduct(pr)) out.push(btn("schedule", pr.scheduleConfirmed ? "Reprogramar" : "Programar", "", "schedule"));
  if (["Programado", "En ejecución"].includes(pr.status)) out.push(btn("progress", "Registrar avance", "btn-primary", "progress"));
  if (["Programado", "En ejecución"].includes(pr.status)) out.push(btn("delay", "Registrar retraso", "", "progress"));
  if (["Programado", "En ejecución"].includes(pr.status)) out.push(btn("suspend", "Suspender", "btn-danger", "progress"));
  if (pr.status === "Suspendido") out.push(btn("resume", "Reanudar", "btn-ok", "progress"));
  if (["Programado", "En ejecución"].includes(pr.status)) out.push(btn("finish", "Finalizar", "btn-ok", "progress"));
  if (pr.status === "Finalizado") out.push(btn("close", "Cerrar producto", "btn-ok", "coordinate"));
  if (isOpenProduct(pr)) out.push(btn("reassign", "Reasignar", "", "coordinate"));
  out.push(`<button class="btn btn-xs" data-open-project="${esc(p.id)}" data-open-product="${esc(pr.id)}">Abrir ficha</button>`);
  return out.join("");
}

/* --------------------------- plan de trabajo --------------------------- */

function planRange(p) {
  const dates = [];
  (p.products || []).forEach(pr => {
    [pr.startDate, pr.endDate, pr.plannedStart, pr.plannedEnd].forEach(d => { if (d) dates.push(d); });
    (pr.milestones || []).forEach(m => { if (m.date) dates.push(m.date); if (m.baselineDate) dates.push(m.baselineDate); });
  });
  if (!dates.length) return null;
  dates.sort();
  const from = toDate(dates[0]), to = toDate(dates[dates.length - 1]);
  if (!from || !to) return null;
  const pad = 3 * 86400000;
  const start = new Date(Math.min(from.getTime(), Date.now()) - pad);
  const end = new Date(Math.max(to.getTime(), Date.now()) + pad);
  return { start, end, span: Math.max(1, end - start) };
}
function pctOf(range, dateStr) {
  const d = toDate(dateStr);
  if (!d) return null;
  return clamp((d - range.start) / range.span * 100, 0, 100);
}
function renderPlan(p) {
  const open = state.ui.openPlans.has(p.id);
  const range = planRange(p);
  const drift = sum(p.products, planDrift);
  return `<details class="plan" ${open ? "open" : ""} data-plan="${esc(p.id)}">
    <summary class="plan-head" style="cursor:pointer;list-style:none">
      <strong>Plan de trabajo · ${esc(p.code)}</strong>
      <span class="hint-line">${drift ? `desplazado ${drift} día(s) frente al plan original` : "sin desviación frente al plan original"}</span>
      <span class="plan-legend">
        <span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>vigente</span>
        <span><i style="background:repeating-linear-gradient(90deg,var(--line-strong),var(--line-strong) 3px,transparent 3px,transparent 6px)"></i>plan original</span>
        <span><i style="background:var(--ink);width:8px;height:8px;transform:rotate(45deg)"></i>hito</span>
      </span>
    </summary>
    ${range ? renderGantt(p, range) : `<div class="note" style="padding:10px">Sin fechas todavía. La programación se confirma al contactar al cliente (§5.7).</div>`}
  </details>`;
}
function renderGantt(p, range) {
  const months = [];
  let cur = new Date(range.start.getFullYear(), range.start.getMonth(), 1);
  while (cur <= range.end) {
    months.push(`${MONTHS[cur.getMonth()].slice(0, 3)} ${String(cur.getFullYear()).slice(2)}`);
    cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
  }
  const todayPct = clamp((Date.now() - range.start) / range.span * 100, 0, 100);
  const rows = (p.products || []).map(pr => {
    const cond = productCondition(pr, p);
    const s = pctOf(range, pr.startDate), e = pctOf(range, pr.endDate);
    const bs = pctOf(range, pr.plannedStart), be = pctOf(range, pr.plannedEnd);
    const progress = productProgress(pr);
    const milestones = (pr.milestones || []).filter(m => m.date).map(m => {
      const mp = pctOf(range, m.date);
      const late = m.progress < 100 && (daysUntil(m.date) ?? 0) < 0;
      return `<span class="g-mile ${m.progress >= 100 ? "done" : late ? "late" : ""}" style="left:calc(${mp}% - 4px)"
        title="${esc(m.name)} · ${formatDate(m.date, true)}${m.baselineDate && m.baselineDate !== m.date ? ` (plan original ${formatDate(m.baselineDate, true)})` : ""} · ${fmtPct(m.progress)}"></span>`;
    }).join("");
    return `<div class="g-row">
      <div class="g-label"><span class="sq ${condKind(cond)}"></span><span title="${esc(pr.name)}">${esc(pr.name)}</span></div>
      <div class="g-track" style="--cols:${months.length}">
        <div class="g-today" style="left:${todayPct}%"></div>
        ${s === null || e === null ? `<span class="g-empty">sin programación confirmada</span>` : ""}
        ${s !== null && e !== null ? `<div class="g-bar ${condKind(cond)}" style="left:${Math.min(s, e)}%;width:${Math.max(1.2, Math.abs(e - s))}%">
            <i style="width:${progress}%"></i></div>` : ""}
        ${bs !== null && be !== null && (bs !== s || be !== e) ? `<div class="g-base" style="left:${Math.min(bs, be)}%;width:${Math.max(1, Math.abs(be - bs))}%" title="Plan original"></div>` : ""}
        ${milestones}
      </div></div>`;
  }).join("");
  return `<div class="gantt"><div class="gantt-grid">
    <div class="g-row head"><div class="g-label">Producto</div>
      <div class="g-scale">${months.map(m => `<div>${esc(m)}</div>`).join("")}
        <div class="g-today" style="left:${todayPct}%"></div></div></div>
    ${rows}
  </div></div>`;
}

function renderAlerts(projects) {
  const withAlerts = projects.map(p => ({ p, alerts: projectAlerts(p) })).filter(x => x.alerts.length);
  const total = withAlerts.reduce((n, x) => n + x.alerts.length, 0);
  if (!total) {

      "Ninguna empresa visible tiene productos pendientes de aceptación, contacto, programación, retraso, suspensión o desviación de horas.", false)}</section>`;
  }
  const byCompany = groupBy(withAlerts, x => x.p.company || "Sin empresa");
  const ordered = [...byCompany.entries()].map(([company, list]) => {
    const alerts = list.flatMap(x => x.alerts);
    return { company, list, alerts, crit: alerts.filter(a => a.severity === "Crítica").length };
  }).sort((a, b) => b.crit - a.crit || b.alerts.length - a.alerts.length);

  return `<section class="panel" style="margin-bottom:12px"><div class="phead">
      <h2>${total} alerta(s) en ${ordered.length} empresa(s)</h2>

          <h3>${fv("company", company, company)}</h3>

          <span class="counts">
            ${crit ? tag(`${crit} crítica(s)`, "bad") : ""}

          const byProduct = groupBy(pa, a => a.productId);
          return [...byProduct.entries()].map(([productId, items]) => {
            const pr = (p.products || []).find(x => x.id === productId) || {};

            return `<div class="al-prod">

                <div>${tag(pr.status || "—", stateKind(pr.status))}<div style="margin-top:3px">${tag(cond, condKind(cond))}</div></div>
                <div><span class="xs muted">Responsable</span><div class="xs mono">${fv("owner", pr.owner, pr.owner || "sin asignar")}</div></div>
                <div class="xs">${pr.endDate ? `${formatDate(pr.endDate, true)}<div class="xs faint mono">${(daysUntil(pr.endDate) ?? 0) < 0 ? `${Math.abs(daysUntil(pr.endDate))} d de retraso` : `faltan ${daysUntil(pr.endDate)} d`}</div>` : `<span class="faint">sin fecha</span>`}</div>
                <div class="row">
                  <button class="btn btn-xs" data-open-project="${esc(p.id)}" data-open-product="${esc(pr.id)}">Abrir</button>
                  ${pr.id ? `<button class="btn btn-xs btn-primary" data-product-action="${pr.status === "Suspendido" ? "resume" : "progress"}"
                     data-project="${esc(p.id)}" data-product="${esc(pr.id)}" ${perm.ok ? "" : `disabled title="${esc(perm.reason)}"`}>Gestionar</button>` : ""}
                </div>
              </div>
              <div class="al-list">${items.map(a => `<div class="al-item">

/* ------------------------------ 8.5 CALENDARIO ------------------------------ */

function addDays(base, days) { const d = new Date(base); d.setDate(d.getDate() + days); return d; }
function easterDate(year) {
  const a = year % 19, b = Math.floor(year / 100), c = year % 100, d = Math.floor(b / 4), e = b % 4,
        f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
        i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7,
        m = Math.floor((a + 11 * h + 22 * l) / 451),
        month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(year, month - 1, day, 12);
}
function observedMonday(year, month, day) {
  const d = new Date(year, month - 1, day, 12);
  return addDays(d, d.getDay() === 1 ? 0 : (8 - d.getDay()) % 7);   // Ley Emiliani
}
function colombiaHolidays(year) {
  const out = [], add = (d, name) => out.push({ date: dateISO(d), name });
  add(new Date(year, 0, 1, 12), "Año Nuevo");
  add(observedMonday(year, 1, 6), "Reyes Magos");
  add(observedMonday(year, 3, 19), "San José");
  add(new Date(year, 4, 1, 12), "Día del Trabajo");
  const easter = easterDate(year);
  add(addDays(easter, -3), "Jueves Santo");
  add(addDays(easter, -2), "Viernes Santo");
  add(addDays(easter, 43), "Ascensión del Señor");
  add(addDays(easter, 64), "Corpus Christi");
  add(addDays(easter, 71), "Sagrado Corazón");
  add(observedMonday(year, 6, 29), "San Pedro y San Pablo");
  add(new Date(year, 6, 20, 12), "Independencia");
  add(new Date(year, 7, 7, 12), "Batalla de Boyacá");
  add(observedMonday(year, 8, 15), "Asunción de la Virgen");
  add(observedMonday(year, 10, 12), "Diversidad Étnica");
  add(observedMonday(year, 11, 1), "Todos los Santos");
  add(observedMonday(year, 11, 11), "Independencia de Cartagena");
  add(new Date(year, 11, 8, 12), "Inmaculada Concepción");
  add(new Date(year, 11, 25, 12), "Navidad");
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function calendarCells(year, month) {
  const first = new Date(year, month, 1, 12);
  const start = addDays(first, -((first.getDay() + 6) % 7));
  return Array.from({ length: 42 }, (_, i) => {
    const d = addDays(start, i);
    return { date: dateISO(d), day: d.getDate(), inMonth: d.getMonth() === month, today: dateISO(d) === dateISO() };
  });
}
function eventKind(date, done = false) {
  if (done) return "ok";
  const n = daysUntil(date);
  if (n === null) return "";
  if (n < 0) return "bad";
  return n <= state.settings.sla.dueSoonDays ? "warn" : "";
}
function calendarEvents(projects) {
  const map = new Map();
  const push = (date, e) => { if (!date) return; if (!map.has(date)) map.set(date, []); map.get(date).push({ ...e, date }); };
  projects.forEach(p => {
    (p.products || []).forEach(pr => {
      const done = !isOpenProduct(pr);
      if (pr.startDate) push(pr.startDate, { projectId: p.id, productId: pr.id, company: p.company,
        title: `Inicio · ${pr.name}`, subtitle: `${p.code} · ${pr.owner || "sin responsable"}`, kind: done ? "ok" : "" });
      if (pr.endDate) push(pr.endDate, { projectId: p.id, productId: pr.id, company: p.company,
        title: `Objetivo · ${pr.name}`, subtitle: `${p.code} · ${fmtPct(productProgress(pr))}`, kind: eventKind(pr.endDate, done) });
      (pr.milestones || []).filter(m => m.date).forEach(m => push(m.date, { projectId: p.id, productId: pr.id, company: p.company,
        title: m.name, subtitle: `${pr.name} · ${m.owner || pr.owner || "—"}${m.confirmed ? "" : " · sin confirmar"}`,
        kind: eventKind(m.date, m.progress >= 100) }));
      const n = lastNovelty(pr, "Suspensión");
      if (pr.status === "Suspendido" && n?.newDate) push(n.newDate, { projectId: p.id, productId: pr.id, company: p.company,
        title: `Revisión suspensión · ${pr.name}`, subtitle: `${p.code} · ${n.owner || "—"}`, kind: eventKind(n.newDate) });
    });
  });
  [...map.values()].forEach(list => list.sort((a, b) => a.company.localeCompare(b.company, "es") || a.title.localeCompare(b.title, "es")));
  return map;
}
function renderCalendar(projects) {
  const companyFilter = state.ui.calendarCompany;
  const scoped = companyFilter ? projects.filter(p => p.company === companyFilter) : projects;
  const { year, month } = state.calendar;
  const cells = calendarCells(year, month);
  const holidays = colombiaHolidays(year);
  const holidayMap = new Map(holidays.map(h => [h.date, h]));
  const events = calendarEvents(scoped);
  const monthDates = cells.filter(c => c.inMonth).map(c => c.date);
  const monthEvents = monthDates.flatMap(d => events.get(d) || []);
  const monthHolidays = holidays.filter(h => toDate(h.date)?.getMonth() === month);
  const companies = unique(projects.map(p => p.company));
  const overdue = scoped.flatMap(p => (p.products || []).filter(pr => isOpenProduct(pr) && pr.endDate && (daysUntil(pr.endDate) ?? 0) < 0)).length;
  const years = Array.from({ length: 9 }, (_, i) => year - 4 + i);

  return `<section class="panel">
    <div class="cal-top">
      <button class="btn btn-xs" data-calendar-shift="-1">← anterior</button>
      <div class="cal-title"><strong>${MONTHS[month]} ${year}</strong>
        <span>${companyFilter ? esc(companyFilter) : "Consolidado del portafolio"} · ${scoped.length} proyecto(s) · ${monthEvents.length} evento(s) · ${overdue} producto(s) vencido(s)</span></div>
      <div class="cal-ctl">
        <label class="sr-only" for="calendarCompany">Empresa</label>
        <select id="calendarCompany"><option value="">Todas las empresas</option>
          ${companies.map(c => `<option ${c === companyFilter ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
        <button class="btn btn-xs" data-calendar-today="1">Hoy</button>
        <label class="sr-only" for="calendarMonth">Mes</label>
        <select id="calendarMonth">${MONTHS.map((m, i) => `<option value="${i}" ${i === month ? "selected" : ""}>${m}</option>`).join("")}</select>
        <label class="sr-only" for="calendarYear">Año</label>
        <select id="calendarYear">${years.map(y => `<option ${y === year ? "selected" : ""}>${y}</option>`).join("")}</select>
        <button class="btn btn-xs" data-calendar-shift="1">siguiente →</button>
      </div>
    </div>
    <div class="hol-strip"><strong>Festivos</strong>
      ${monthHolidays.length ? monthHolidays.map(h => `<span class="hol-chip">${formatDate(h.date, true)} ${esc(h.name)}</span>`).join("")
                             : `<span class="hol-chip">sin festivos este mes</span>`}</div>
    <div class="cal-grid">
      ${WEEKDAYS.map(d => `<div class="wd">${d}</div>`).join("")}
      ${cells.map(c => renderDay(c, events.get(c.date) || [], holidayMap.get(c.date))).join("")}
    </div>
  </section>
  <section class="panel" style="margin-top:12px"><div class="phead"><h2>Agenda del mes por empresa</h2><p>${monthEvents.length} evento(s)</p></div>
    ${renderAgenda(monthEvents)}</section>`;
}
function renderDay(c, events, holiday) {
  return `<div class="day ${c.inMonth ? "" : "out"} ${c.today ? "today" : ""} ${holiday ? "hol" : ""}">
    <div class="day-n"><span>${String(c.day).padStart(2, "0")}</span>${holiday ? `<span class="hol-n">${esc(holiday.name)}</span>` : ""}</div>

    ${events.length > 3 ? `<button class="more" data-day-events="${esc(c.date)}">+${events.length - 3} más</button>` : ""}
  </div>`;
}
function renderAgenda(events) {
  if (!events.length) return `<div class="empty" style="padding:24px"><strong>Sin eventos en el mes</strong></div>`;

/* --- helpers de formulario: cada control lleva data-path (ruta dentro del borrador) --- */
function fld(o) {
  const { label, path, value, type = "text", span = "s4", list, min, max, step, hint, readonly, placeholder } = o;
  const attrs = [
    `type="${type}"`, `data-path="${esc(path)}"`, `data-fkey="${esc(path)}"`,
    `data-type="${type === "number" ? "number" : "text"}"`, `id="f_${esc(path)}"`,
    `value="${esc(value ?? "")}"`,
    list ? `list="${esc(list)}"` : "", min !== undefined ? `min="${min}"` : "",
    max !== undefined ? `max="${max}"` : "", step !== undefined ? `step="${step}"` : "",
    readonly ? "readonly" : "", placeholder ? `placeholder="${esc(placeholder)}"` : ""
  ].filter(Boolean).join(" ");
  return `<div class="f ${span}"><label for="f_${esc(path)}">${esc(label)}</label><input ${attrs}>
    ${hint ? `<span class="hint">${esc(hint)}</span>` : ""}</div>`;
}
function sel(o) {
  const { label, path, value, options, span = "s4", hint, allowEmpty, emptyLabel = "Sin definir" } = o;
  return `<div class="f ${span}"><label for="f_${esc(path)}">${esc(label)}</label>
    <select data-path="${esc(path)}" data-fkey="${esc(path)}" data-type="text" id="f_${esc(path)}">
      ${allowEmpty ? `<option value="" ${!value ? "selected" : ""}>${esc(emptyLabel)}</option>` : ""}
      ${options.map(x => `<option value="${esc(x)}" ${String(x) === String(value) ? "selected" : ""}>${esc(x)}</option>`).join("")}
    </select>${hint ? `<span class="hint">${esc(hint)}</span>` : ""}</div>`;
}
function txt(o) {
  const { label, path, value, span = "s12", hint, placeholder } = o;
  return `<div class="f ${span}"><label for="f_${esc(path)}">${esc(label)}</label>
    <textarea data-path="${esc(path)}" data-fkey="${esc(path)}" data-type="text" id="f_${esc(path)}" ${placeholder ? `placeholder="${esc(placeholder)}"` : ""}>${esc(value ?? "")}</textarea>
    ${hint ? `<span class="hint">${esc(hint)}</span>` : ""}</div>`;
}
function chk(o) {
  const { label, path, checked, hint, span = "s4" } = o;
  return `<div class="f ${span}"><label>&nbsp;</label>
    <label class="ck"><input type="checkbox" data-path="${esc(path)}" data-fkey="${esc(path)}" data-type="bool" ${checked ? "checked" : ""}>
      <span><strong>${esc(label)}</strong>${hint ? `<span>${esc(hint)}</span>` : ""}</span></label></div>`;
}
function section(id, title, body, extra = "") {
  const open = state.ui.openSections.has(id);
  return `<details class="acc" data-section="${esc(id)}" ${open ? "open" : ""}>
    <summary><span>${esc(title)}${extra ? ` <span class="xs muted" style="font-weight:600;letter-spacing:0;text-transform:none">· ${esc(extra)}</span>` : ""}</span></summary>
    <div class="acc-body">${body}</div></details>`;
}

/* ------------------------------- apertura ------------------------------- */
function openProject(id, productId = "") {
  const p = state.projects.find(x => x.id === id);
  if (!p) return;
  state.selectedId = id;
  state.draft = clone(p);
  state.draftBaseline = clone(p);
  state.drawerMode = p.state === "Borrador" ? "sale" : "detail";
  state.wizardStep = 1;
  if (productId) state.ui.openSections.add("sec-products");
  openDrawer();
  if (productId) {
    setTimeout(() => {
      const el = document.querySelector(`#drawerBody [data-product-anchor="${CSS.escape(productId)}"]`);
      if (el) el.scrollIntoView({ block: "center" });
    }, 60);
  }
}
function newSale() {
  state.selectedId = null;
  const p = makeProject({
    state: "Borrador", saleDate: dateISO(), seller: currentUser(),
    products: [makeProduct({ name: "", hoursSold: 0, routing: "Otra" })],
    contacts: [makeContact({ primary: true })]
  });
  p.coordinator = resolveCoordinator(p);
  state.draft = p;
  state.draftBaseline = clone(p);
  state.drawerMode = "sale";
  state.wizardStep = 1;
  openDrawer();
}
let lastFocusedBeforeDrawer = null;
function openDrawer() {
  lastFocusedBeforeDrawer = document.activeElement;
  renderDrawer();
  const drawer = document.getElementById("drawer");
  drawer.classList.add("open");
  drawer.setAttribute("aria-hidden", "false");
  document.getElementById("drawerVeil").classList.add("open");
  setTimeout(() => {
    const first = drawer.querySelector("input,select,textarea,button");
    if (first) first.focus();
  }, 40);
}
function isDirty() {
  return state.draft && state.draftBaseline && JSON.stringify(state.draft) !== JSON.stringify(state.draftBaseline);
}
function closeDrawer(force = false) {
  if (!force && isDirty()) {
    confirmModal("Cambios sin guardar",
      "Si cierra la ficha ahora, los cambios del formulario se descartan.",
      [{ label: "Seguir editando", kind: "" }, { label: "Descartar cambios", kind: "btn-danger", action: () => closeDrawer(true) }]);
    return;
  }
  const drawer = document.getElementById("drawer");
  drawer.classList.remove("open");
  drawer.setAttribute("aria-hidden", "true");
  document.getElementById("drawerVeil").classList.remove("open");
  state.draft = null; state.draftBaseline = null; state.selectedId = null; state.drawerMode = null;
  if (lastFocusedBeforeDrawer && document.contains(lastFocusedBeforeDrawer)) lastFocusedBeforeDrawer.focus();
}

/* ------------------------------- render ------------------------------- */
function renderDrawer() { renderDrawerHead(); renderDrawerBody(); renderDrawerFooter(); }
function renderDrawerHead() {
  const p = state.draft; if (!p) return;
  const isSale = state.drawerMode === "sale";
  const gState = projectGlobalState(p), cond = projectCondition(p);
  document.getElementById("drawerHead").innerHTML = `
    <div class="t">
      <span>${esc(isSale ? "Registro de venta realizada" : p.company || "Empresa sin definir")}</span>
      <h2 id="drawerHeading">${esc(p.code)}${isSale ? "" : ` · ${esc(p.company)}`}</h2>
      <p>${esc(p.type)} · ${esc(p.ppr || "sin PPR")} · ${(p.products || []).length} producto(s) · ${fmtNum(projectHoursSold(p))} h · ${fmtMoney(projectValue(p))}${p.demo ? " · demo" : ""}</p>
    </div>
    ${isSale ? tag("Borrador", "gray") : `${tag(gState, stateKind(gState))} ${tag(cond, condKind(cond))}`}
    <button class="btn btn-icon btn-ghost" data-action="close-drawer" aria-label="Cerrar ficha">✕</button>`;
}
function renderDrawerBody() {
  const p = state.draft; if (!p) return;
  document.getElementById("drawerBody").innerHTML =
    state.drawerMode === "sale" ? renderSaleWizard(p) : renderProjectDetail(p);
  syncLive();
}
function rerenderDrawerBody() {
  const body = document.getElementById("drawerBody");
  const active = document.activeElement;
  const key = active && body.contains(active) ? active.getAttribute("data-fkey") : null;
  const caret = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const scroll = body.scrollTop;
  renderDrawerBody();
  renderDrawerHead();
  renderDrawerFooter();
  body.scrollTop = scroll;
  if (key) {
    const el = body.querySelector(`[data-fkey="${CSS.escape(key)}"]`);
    if (el) {
      el.focus();
      if (caret !== null && typeof el.setSelectionRange === "function" && ["text", "search", "url", "tel", "password"].includes(el.type)) {
        try { el.setSelectionRange(caret, caret); } catch (e) { /* tipos que no lo soportan */ }
      }
    }
  }
}
function syncLive() {
  const p = state.draft; if (!p) return;
  document.querySelectorAll("[data-live]").forEach(el => {
    const fn = { hours: () => fmtNum(projectHoursSold(p)), value: () => fmtMoney(projectValue(p)) }[el.dataset.live];
    if (fn) el.textContent = fn();
  });
  document.querySelectorAll("[data-live-input]").forEach(el => {
    const fn = { hours: () => fmtNum(projectHoursSold(p)), value: () => fmtMoney(projectValue(p)) }[el.dataset.liveInput];
    if (fn) el.value = fn();
  });
}

/* ---------------- 10. MODALES, AVISOS Y ACCIONES SOBRE PRODUCTOS ---------------- */

let modalHandlers = {};
function openModal(html) {
  document.getElementById("modal").innerHTML = html;
  document.getElementById("modalVeil").classList.add("open");
  setTimeout(() => {
    const el = document.querySelector("#modal input,#modal select,#modal textarea,#modal button");
    if (el) el.focus();
  }, 30);
}
function closeModal() {
  document.getElementById("modalVeil").classList.remove("open");
  modalHandlers = {};
}
function confirmModal(title, text, buttons) {
  modalHandlers = {};
  const html = `<div class="modal-head"><h2>${esc(title)}</h2>
      <button class="btn btn-icon btn-ghost" data-action="close-modal" aria-label="Cerrar">×</button></div>
    <div class="modal-body"><p class="note" style="font-size:11px;margin:0">${esc(text)}</p></div>
    <div class="modal-foot">${buttons.map((b, i) => {
      if (b.action) modalHandlers[i] = b.action;
      return `<button class="btn ${b.kind || ""}" data-modal-action="${i}">${esc(b.label)}</button>`;
    }).join("")}</div>`;
  openModal(html);
}
function toast(title, message = "", type = "success") {
  const zone = document.getElementById("toastZone");
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.innerHTML = `<strong>${esc(title)}</strong>${message ? esc(message) : ""}`;
  zone.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

/* ------------------- 11. GUARDAR, ACTIVAR Y ELIMINAR ------------------- */

function collectDiffs(before, after, prefix = "") {
  const diffs = [];
  const walk = (a, b, path) => {
    if (Array.isArray(a) || Array.isArray(b)) {
      const la = Array.isArray(a) ? a : [], lb = Array.isArray(b) ? b : [];
      const max = Math.max(la.length, lb.length);
      for (let i = 0; i < max; i++) walk(la[i], lb[i], `${path}${path ? "." : ""}${i}`);
      return;
    }
    if (a && typeof a === "object" || b && typeof b === "object") {
      const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
      keys.forEach(k => walk(a?.[k], b?.[k], `${path}${path ? "." : ""}${k}`));
      return;
    }
    if (String(a ?? "") !== String(b ?? "")) diffs.push({ path, before: a, after: b });
  };
  walk(before, after, prefix);
  return diffs.filter(d => !/^log(\.|$)/.test(d.path))
              .filter(d => !/(^|\.)(updatedAt|lastUpdateAt|id)$/.test(d.path));
}
function describeDiff(d, project) {
  const m = /^products\.(\d+)\.(.+)$/.exec(d.path);
  if (m) {
    const pr = (project.products || [])[Number(m[1])];
    return { entity: pr ? pr.name : `Producto ${Number(m[1]) + 1}`, field: m[2] };
  }
  const c = /^contacts\.(\d+)\.(.+)$/.exec(d.path);
  if (c) {
    const ct = (project.contacts || [])[Number(c[1])];
    return { entity: ct ? `Contacto ${ct.name || Number(c[1]) + 1}` : `Contacto ${Number(c[1]) + 1}`, field: c[2] };
  }
  return { entity: "Proyecto", field: d.path };
}
function sensitiveDiffs(diffs) {
  return diffs.filter(d => SENSITIVE_FIELDS.some(s => s.path.test(d.path)));
}
function commitDraft({ reason = "", skipDiff = false } = {}) {
  const draft = state.draft;
  const baseline = state.draftBaseline;
  const diffs = skipDiff ? [] : collectDiffs(baseline, draft);
  diffs.forEach(d => {
    const info = describeDiff(d, draft);
    logEvent(draft, { type: "Editado", entity: info.entity, field: info.field,
                      before: d.before, after: d.after, reason });
  });
  draft.updatedAt = new Date().toISOString();
  const i = state.projects.findIndex(x => x.id === state.selectedId);
  if (i >= 0) state.projects[i] = clone(draft);
  else { state.projects.unshift(clone(draft)); state.selectedId = draft.id; }
  state.draftBaseline = clone(draft);
  syncCatalogs();
  saveState();
  renderApp();
  return diffs.length;
}
function saveProject() {
  const p = state.draft;
  if (!p) return;
  const problems = [];
  if (!String(p.company).trim()) problems.push("empresa");
  if (!String(p.ppr).trim()) problems.push("PPR");
  if ((p.products || []).some(x => !String(x.name).trim())) problems.push("nombre de todos los productos");
  if ((p.products || []).some(x => !(Number(x.hoursSold) > 0))) problems.push("horas mayores que cero en cada producto");
  if (problems.length) { toast("No se puede guardar", `Complete: ${problems.join(", ")}.`, "error"); return; }
  if ((p.contacts || []).length > 3) { toast("Demasiados contactos", "Máximo tres contactos por proyecto.", "error"); return; }

  const diffs = collectDiffs(state.draftBaseline, p);
  if (!diffs.length) { toast("Sin cambios", "No hay modificaciones para guardar."); return; }
  const sensitive = sensitiveDiffs(diffs);
  if (sensitive.length && p.state !== "Borrador") {
    askReason(sensitive, reason => {
      commitDraft({ reason });
      renderDrawer();
      toast("Cambios guardados", `${diffs.length} campo(s) actualizados con motivo registrado.`);
    });
    return;
  }
  const n = commitDraft();
  renderDrawer();
  toast("Cambios guardados", `${n} campo(s) actualizados en ${p.code}.`);
}

function toCSV(rows) {

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", quote = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], next = text[i + 1];
    if (ch === '"' && quote && next === '"') { cell += '"'; i++; }
    else if (ch === '"') quote = !quote;
    else if (ch === "," && !quote) { row.push(cell); cell = ""; }
    else if ((ch === "\n" || ch === "\r") && !quote) {
      if (ch === "\r" && next === "\n") i++;
      row.push(cell);
      if (row.some(x => x.trim())) rows.push(row);
      row = []; cell = "";
    } else cell += ch;
  }
  row.push(cell);
  if (row.some(x => x.trim())) rows.push(row);
  return rows;
}
/** Importación CSV no destructiva: solo se actualizan las columnas presentes en el archivo. */
const CSV_PROJECT_FIELDS = { empresa: "company", ppr: "ppr", tipo: "type", coordinacion: "coordinator",
                             vendedor: "seller", orden_servicio: "commercialRef", fecha_venta: "saleDate",
                             valor_facturado: "invoicedValue" };
const CSV_PRODUCT_FIELDS = { categoria: "routing", tecnologia: "technology", complejidad: "complexity",
                             responsable: "owner", estado_producto: "status", inicio: "startDate",
                             fecha_objetivo: "endDate", horas_vendidas: "hoursSold", valor_hora: "hourRate",
                             horas_ejecutadas: "hoursExecuted", avance: "progress" };
const CSV_NUMERIC = new Set(["invoicedValue", "hoursSold", "hourRate", "hoursExecuted", "progress"]);
function importCSVText(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) throw new Error("El archivo CSV no tiene datos.");
  const headers = rows[0].map(h => norm(h).replace(/\s+/g, "_"));
  let created = 0, updatedProjects = 0, updatedProducts = 0, skipped = 0;
  rows.slice(1).forEach(r => {
    const o = {};
    headers.forEach((h, i) => { if (h) o[h] = (r[i] ?? "").trim(); });
    const code = o.codigo || o.code;
    if (!code) { skipped++; return; }
    let p = state.projects.find(x => norm(x.code) === norm(code));
    if (!p) {
      p = makeProject({ code, company: o.empresa || "", state: "Borrador" });
      logEvent(p, { type: "Importado", entity: "Proyecto", after: code, reason: "Creado desde importación CSV como borrador (RN-04)." });
      state.projects.push(p);
      created++;
    } else updatedProjects++;
    Object.entries(CSV_PROJECT_FIELDS).forEach(([col, field]) => {
      if (!(col in o) || o[col] === "") return;
      const value = CSV_NUMERIC.has(field) ? Number(o[col]) || 0 : o[col];
      if (String(p[field] ?? "") === String(value)) return;
      logEvent(p, { type: "Importado", entity: "Proyecto", field, before: p[field], after: value, reason: "Importación CSV." });
      p[field] = value;
    });
    const productName = o.producto || o.product;
    if (productName && productName !== "(sin productos)") {
      let pr = (p.products || []).find(x => norm(x.name) === norm(productName));
      if (!pr) { pr = makeProduct({ name: productName }); p.products.push(pr); }
      Object.entries(CSV_PRODUCT_FIELDS).forEach(([col, field]) => {
        if (!(col in o) || o[col] === "") return;
        let value = CSV_NUMERIC.has(field) ? Number(o[col]) || 0 : o[col];
        if (field === "status" && !PRODUCT_STATES.includes(value)) return;
        if (field === "routing" && !ROUTINGS.includes(value)) return;
        if (String(pr[field] ?? "") === String(value)) return;
        logEvent(p, { type: "Importado", entity: pr.name, field, before: pr[field], after: value, reason: "Importación CSV." });
        pr[field] = value;
      });
      updatedProducts++;
    }
    p.updatedAt = new Date().toISOString();
  });
  state.projects = state.projects.map(makeProject);
  syncCatalogs();
  saveState();
  renderApp();
  toast("CSV importado", `${created} proyecto(s) creados · ${updatedProjects} actualizados · ${updatedProducts} producto(s) · ${skipped} fila(s) sin código.`);
}
function importFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const text = String(reader.result || "");
      if (file.name.toLowerCase().endsWith(".json")) {
        const data = JSON.parse(text);
        if (!Array.isArray(data.projects)) throw new Error("El archivo JSON no contiene proyectos.");
        confirmModal("Restaurar respaldo JSON",
          `Se reemplazarán los ${state.projects.length} proyecto(s) actuales por los ${data.projects.length} del archivo. Descargue un respaldo antes de continuar.`,
          [{ label: "Cancelar", kind: "" },
           { label: "Reemplazar la base", kind: "btn-danger", action: () => {
              state.projects = data.projects.map(makeProject);
              state.outbox = Array.isArray(data.outbox) ? data.outbox : [];
              state.settings = mergeDeep(clone(DEFAULT_SETTINGS), data.settings || {});
              syncCatalogs(); saveState(); closeModal(); renderApp();
              toast("Respaldo restaurado", `${state.projects.length} proyecto(s) cargados.`);
            } }]);
      } else importCSVText(text);
    } catch (e) {
      console.error(e);
      toast("No fue posible importar", e.message, "error");
    }
  };
  reader.readAsText(file, "UTF-8");
}

/** Un catálogo se usa como referencia: al quitar un valor en uso se avisa qué proyectos lo mencionan. */
function catalogUsage(key, name) {
  const n = norm(name);
  if (!n) return [];
  if (key === "companies") return state.projects.filter(p => norm(p.company) === n);
  if (key === "pprs") return state.projects.filter(p => norm(p.ppr) === n);
  if (key === "serviceOrders") return state.projects.filter(p => norm(p.commercialRef) === n);
  if (key === "products") return state.projects.filter(p => (p.products || []).some(x => norm(x.name) === n));
  if (key === "people") return state.projects.filter(p => norm(p.coordinator) === n || (p.products || []).some(x => norm(x.owner) === n));
  return [];
}
function removeCatalogRow(key, index) {

// Rutas que cambian la estructura del formulario y obligan a redibujar la ficha
// (conservando foco, posición del cursor y secciones abiertas).
const STRUCTURAL_PATHS = [/^products\.\d+\.routing$/, /^products\.\d+\.status$/, /^type$/];

function handleDraftInput(el) {
  if (!state.draft) return false;
  const path = el.dataset.path;
  if (!path) return false;
  let value;
  if (el.type === "checkbox") value = el.checked;
  else if (el.dataset.type === "number" || el.type === "number") value = Number(el.value) || 0;
  else value = el.value;

  if (/^products\.\d+\.progress$/.test(path) || /\.milestones\.\d+\.progress$/.test(path)) value = clamp(value, 0, 100);
  setPath(state.draft, path, value);

  const nameMatch = /^products\.(\d+)\.name$/.exec(path);
  if (nameMatch) {
    const pr = state.draft.products[Number(nameMatch[1])];
    const cat = catalogFind("products", value);
    if (cat) {
      if (!Number(pr.hoursSold)) pr.hoursSold = Number(cat.hours) || 0;
      if (!Number(pr.hourRate)) pr.hourRate = Number(cat.rate) || 0;
      if ((!pr.routing || pr.routing === "Otra") && ROUTINGS.includes(cat.routing)) {
        pr.routing = cat.routing;
        if (!pr.owner) pr.owner = resolveProductOwner(state.draft, pr);
      }
      return true;   // redibuja para mostrar horas, tarifa y campos condicionales
    }
  }
  const m = /^products\.(\d+)\.routing$/.exec(path);
  if (m) {
    const pr = state.draft.products[Number(m[1])];
    if (value !== "Medición objetiva") pr.technology = "";
    if (value !== "Diseño") pr.complexity = "";
    if (!pr.owner) pr.owner = resolveProductOwner(state.draft, pr);
  }
  if (path === "type") state.draft.coordinator = resolveCoordinator(state.draft) || state.draft.coordinator;
  if (/^products\.\d+\.status$/.test(path)) {
    const pr = state.draft.products[Number(/^products\.(\d+)\./.exec(path)[1])];
    if (["Finalizado", "Cerrado"].includes(pr.status)) pr.progress = 100;
  }
  return STRUCTURAL_PATHS.some(rx => rx.test(path));
}
function addRow(path) {
  if (!state.draft) return;
  if (path === "products") {
    const pr = makeProduct({ name: "", hoursSold: 0, routing: "Otra" });
    pr.owner = resolveProductOwner(state.draft, pr);
    if (state.draft.state === "Activo") { pr.assignedAt = new Date().toISOString(); }
    state.draft.products.push(pr);
  } else if (path === "contacts") {
    if ((state.draft.contacts || []).length >= 3) { toast("Máximo tres contactos", "La especificación permite entre uno y tres contactos.", "warning"); return; }
    state.draft.contacts.push(makeContact({ primary: !(state.draft.contacts || []).length }));
  } else {
    const list = getPath(state.draft, path);
    if (Array.isArray(list)) list.push(makeMilestone({ name: "", date: "" }));
  }
  rerenderDrawerBody();
}
function removeRow(path, index) {
  if (!state.draft) return;
  const list = path === "products" ? state.draft.products
             : path === "contacts" ? state.draft.contacts
             : getPath(state.draft, path);
  if (!Array.isArray(list)) return;
  const removed = list[index];
  const finish = () => {
    list.splice(index, 1);
    if (path === "contacts" && state.draft.contacts.length && state.draft.contacts.every(c => !c.primary)) state.draft.contacts[0].primary = true;
    rerenderDrawerBody();
  };
  if (path === "products" && removed && (removed.name || removed.hoursSold)) {
    confirmModal("Eliminar producto",
      `Se eliminará «${removed.name || "producto sin nombre"}» con sus hitos, novedades y entregable. El cambio queda en la bitácora al guardar.`,
      [{ label: "Cancelar", kind: "" }, { label: "Eliminar", kind: "btn-danger", action: () => { finish(); closeModal(); } }]);
    return;
  }
  finish();
}

  }
  const addCat = t.closest("[data-add-catalog]");
  if (addCat) { addCatalogRow(addCat.dataset.addCatalog); return; }
  const delCat = t.closest("[data-remove-catalog]");
  if (delCat) { removeCatalogRow(delCat.dataset.removeCatalog, Number(delCat.dataset.index)); return; }

  const expand = t.closest("[data-expand-project]");
  if (expand) {
    const id = expand.dataset.expandProject;
    state.ui.collapsedProjects.has(id) ? state.ui.collapsedProjects.delete(id) : state.ui.collapsedProjects.add(id);
    renderView();
    return;
  }
  const special = t.closest("[data-special]");
  if (special) { if (e.detail > 1) return; toggleFilter("special", special.dataset.special); return; }

  const fv = t.closest("[data-filter-key]");
  if (fv) { if (e.detail > 1) return; toggleFilter(fv.dataset.filterKey, fv.dataset.filterValue); return; }

  const rem = t.closest("[data-remove-filter]");
  if (rem) { if (e.detail > 1) return; toggleFilter(rem.dataset.removeFilter, rem.dataset.value); return; }

  const shift = t.closest("[data-calendar-shift]");
  if (shift) {
    const d = new Date(state.calendar.year, state.calendar.month + Number(shift.dataset.calendarShift), 1);
    state.calendar.year = d.getFullYear(); state.calendar.month = d.getMonth();
    renderView();
    return;
  }
  if (t.closest("[data-calendar-today]")) {
    const d = new Date();
    state.calendar.year = d.getFullYear(); state.calendar.month = d.getMonth();
    renderView();
    return;
  }
  const day = t.closest("[data-day-events]");
  if (day) { showDayEvents(day.dataset.dayEvents); return; }

  const step = t.closest("[data-wizard-step]");
  if (step) { state.wizardStep = clamp(Number(step.dataset.wizardStep), 1, 4); renderDrawer(); return; }

  const add = t.closest("[data-add-row]");
  if (add) { addRow(add.dataset.addRow); return; }
  const del = t.closest("[data-remove-row]");
  if (del) { removeRow(del.dataset.removeRow, Number(del.dataset.index)); return; }

  const pa = t.closest("[data-product-action]");
  if (pa) { openProductAction(pa.dataset.productAction, pa.dataset.project, pa.dataset.product); return; }

  const notif = t.closest("[data-show-notification]");
  if (notif) { showNotification(notif.dataset.showNotification); return; }

  const ruleDel = t.closest("[data-remove-rule]");
  if (ruleDel) {
    state.settings.assignmentRules = state.settings.assignmentRules.filter(r => r.id !== ruleDel.dataset.removeRule);
    saveState(); renderApp(); toast("Regla eliminada");
    return;
  }

  const action = t.closest("[data-action]")?.dataset.action;
  if (!action) return;
  const actions = {
    "new-sale": () => newSale(),
    "clear-filters": () => clearFilters(),
    "clear-search": () => { state.search = ""; document.getElementById("globalSearch").value = ""; renderApp(); },
    "close-modal": () => closeModal(),
    "close-drawer": () => closeDrawer(),
    "save-draft": () => saveDraft(),
    "save-project": () => saveProject(),
    "activate": () => activateProject(),
    "delete-project": () => deleteProject(),
    "close-project": () => closeMasterProject(state.selectedId),
    "preview-notification": () => previewNotificationFromDraft(),
    "preview-outbox": () => openOutbox(),
    "export-csv": () => exportCSV(),
    "export-alerts": () => exportAlerts(),
    "export-audit": () => exportAudit(),
    "backup-json": () => exportJSON(),
    "restore-json": () => document.getElementById("importFile").click(),
    "import-csv": () => document.getElementById("importFile").click(),
    "add-rule": () => {
      state.settings.assignmentRules.push({ id: uid("rule"), scope: "product", field: "routing", value: "", assignTo: "", active: true });
      saveState(); renderApp();
    },
    "add-log": () => {
      const el = document.getElementById("newLogText");
      const text = el ? el.value.trim() : "";
      if (!text) { toast("Registro vacío", "Escriba la novedad antes de guardar.", "warning"); return; }
      logEvent(state.draft, { type: "Actualizado", entity: "Proyecto", reason: text });
      state.draftBaseline.log = clone(state.draft.log);
      const i = state.projects.findIndex(x => x.id === state.selectedId);
      if (i >= 0) state.projects[i].log = clone(state.draft.log);
      saveState();
      rerenderDrawerBody();
      toast("Novedad registrada");
    },
    "remove-demo": () => confirmModal("Eliminar datos demostrativos",
      "Se eliminarán únicamente los proyectos marcados como demostrativos. Los proyectos reales no se tocan.",
      [{ label: "Cancelar", kind: "" }, { label: "Eliminar demos", kind: "btn-danger", action: () => {
        const ids = state.projects.filter(p => p.demo).map(p => p.id);
        state.projects = state.projects.filter(p => !p.demo);
        state.outbox = state.outbox.filter(n => !ids.includes(n.projectId));
        state.settings.demoMode = false;
        saveState(); closeModal(); renderApp();
        toast("Datos demostrativos eliminados", `${ids.length} proyecto(s) retirados.`);
      } }]),
    "load-demo": () => confirmModal("Cargar base demostrativa",
      "Se agregarán cuatro proyectos demostrativos marcados como «demo». Los proyectos existentes no se modifican.",
      [{ label: "Cancelar", kind: "" }, { label: "Cargar demostración", kind: "btn-primary", action: () => {
        demoProjects().forEach(p => { if (!state.projects.some(x => x.code === p.code)) state.projects.unshift(p); });
        syncCatalogs(); saveState(); closeModal(); renderApp();
        toast("Base demostrativa cargada");
      } }]),
    "clear-data": () => confirmModal("Vaciar todos los proyectos",
      "Se eliminarán todos los proyectos, productos, contactos y bitácoras. Descargue un respaldo JSON antes de continuar.",
      [{ label: "Cancelar", kind: "" }, { label: "Vaciar la base", kind: "btn-danger", action: () => {
        state.projects = []; state.outbox = []; state.settings.demoMode = false;
        saveState(); closeModal(); renderApp();
        toast("Base vaciada");
      } }])
  };
  if (actions[action]) actions[action]();
});

document.addEventListener("change", e => {
  const el = e.target;

  if (el.matches("[data-filter-select]")) { setSingleFilter(el.dataset.filterSelect, el.value); return; }
  if (el.id === "sortProjects") { state.sort = el.value; renderView(); return; }
  if (el.id === "assignmentOwner") { state.ui.assignmentOwner = el.value; renderApp(); return; }
  if (el.id === "sessionUser") { state.session.user = el.value; saveState(); renderApp(); return; }
  if (el.id === "calendarCompany") { state.ui.calendarCompany = el.value; renderView(); return; }
  if (el.id === "calendarMonth") { state.calendar.month = Number(el.value); renderView(); return; }
  if (el.id === "calendarYear") { state.calendar.year = Number(el.value); renderView(); return; }

  if (el.matches("[data-sla]")) {
    state.settings.sla[el.dataset.sla] = clamp(Number(el.value) || 0, 0, 1000);
    saveState(); renderApp();
    return;
  }
  if (el.matches("[data-setting]")) { state.settings[el.dataset.setting] = el.value; saveState(); return; }
  if (el.matches("[data-catalog]")) {
    state.settings.catalogs[el.dataset.catalog] = unique(el.value.split(",").map(x => x.trim()));
    saveState(); renderDataLists();
    return;
  }
  const ruleRow = el.closest("[data-rule]");
  if (ruleRow && el.matches("[data-rule-field]")) {
    const rule = state.settings.assignmentRules.find(r => r.id === ruleRow.dataset.rule);
    if (rule) {
      rule[el.dataset.ruleField] = el.value;
      if (el.dataset.ruleField === "scope") rule.field = rule.scope === "project" ? "type" : "routing";
      saveState(); renderApp();
    }
    return;
  }
  if (el.matches("[data-cat]")) {
    updateCatalogField(el.dataset.cat, Number(el.dataset.index), el.dataset.catField, el.value);
    return;
  }
  if (el.matches("[data-contact-primary]")) {
    const i = Number(el.dataset.contactPrimary);
    (state.draft.contacts || []).forEach((c, j) => c.primary = j === i);
    rerenderDrawerBody();
    return;
  }
  if (el.matches("[data-path]")) {
    const structural = handleDraftInput(el);
    if (structural) rerenderDrawerBody();
    else { renderDrawerHead(); renderDrawerFooter(); syncLive(); }
    return;
  }
});

// La escritura no redibuja la ficha: así no se pierde el foco ni se cierran las secciones.
document.addEventListener("input", e => {
  const el = e.target;
  if (el.matches("[data-path]")) { handleDraftInput(el); syncLive(); return; }
});

// Conserva qué secciones quedan abiertas entre redibujados.
document.addEventListener("toggle", e => {
  const el = e.target;
  if (!(el instanceof HTMLDetailsElement)) return;
  if (el.dataset.plan) {
    el.open ? state.ui.openPlans.add(el.dataset.plan) : state.ui.openPlans.delete(el.dataset.plan);
    return;
  }
  const id = el.dataset.section || (el.dataset.productDetails ? `prod-${el.dataset.productDetails}` : "");
  if (!id) return;
  if (el.dataset.productDetails) {
    el.open ? state.ui.openProducts.add(el.dataset.productDetails) : state.ui.openProducts.delete(el.dataset.productDetails);
  } else {
    el.open ? state.ui.openSections.add(id) : state.ui.openSections.delete(id);
  }
}, true);

document.getElementById("globalSearch").addEventListener("input", e => {
  clearTimeout(searchTimer);
  const value = e.target.value.trim();
  searchTimer = setTimeout(() => { state.search = value; renderApp(); }, 200);
});
document.getElementById("menuBtn").addEventListener("click", () => {
  const sb = document.getElementById("rail");
  sb.classList.toggle("open");
  document.getElementById("menuBtn").setAttribute("aria-expanded", String(sb.classList.contains("open")));
});
document.getElementById("drawerVeil").addEventListener("click", () => closeDrawer());
document.getElementById("modalVeil").addEventListener("click", e => {
  if (e.target === document.getElementById("modalVeil")) closeModal();
});
document.getElementById("importFile").addEventListener("change", e => {
  const file = e.target.files?.[0];
  if (file) importFile(file);
  e.target.value = "";
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (document.getElementById("modalVeil").classList.contains("open")) closeModal();
    else if (document.getElementById("drawer").classList.contains("open")) closeDrawer();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    document.getElementById("globalSearch").focus();
    return;
  }
  if (e.key === "Tab") trapFocus(e);
});
function trapFocus(e) {
  const modalOpen = document.getElementById("modalVeil").classList.contains("open");
  const drawerOpen = document.getElementById("drawer").classList.contains("open");
  const container = modalOpen ? document.getElementById("modal") : drawerOpen ? document.getElementById("drawer") : null;
  if (!container) return;
  const focusable = [...container.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')]
    .filter(el => el.offsetParent !== null);
  if (!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
window.addEventListener("beforeunload", e => {
  if (isDirty()) { e.preventDefault(); e.returnValue = ""; }
});

/* ------------------------------ 15. INICIO ------------------------------ */

loadState();
renderApp();
</script>
