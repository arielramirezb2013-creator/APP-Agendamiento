/* ------------------- 14. GUARDAR, ACTIVAR, ELIMINAR E IMPORTAR ------------------- */

function collectDiffs(before, after) {
  const diffs = [];
  const walk = (a, b, path) => {
    if (Array.isArray(a) || Array.isArray(b)) {
      const la = Array.isArray(a) ? a : [], lb = Array.isArray(b) ? b : [];
      for (let i = 0; i < Math.max(la.length, lb.length); i++) walk(la[i], lb[i], `${path}${path ? "." : ""}${i}`);
      return;
    }
    if ((a && typeof a === "object") || (b && typeof b === "object")) {
      new Set([...Object.keys(a || {}), ...Object.keys(b || {})]).forEach(k => walk(a?.[k], b?.[k], `${path}${path ? "." : ""}${k}`));
      return;
    }
    if (String(a ?? "") !== String(b ?? "")) diffs.push({ path, before: a, after: b });
  };
  walk(before, after, "");
  return diffs.filter(d => !/^(log|planHistory|clientRequests)(\.|$)/.test(d.path))
              .filter(d => !/(^|\.)(updatedAt|lastUpdateAt|id)$/.test(d.path));
}
function describeDiff(d, project) {
  const m = /^products\.(\d+)\.(.+)$/.exec(d.path);
  if (m) return { entity: (project.products || [])[Number(m[1])]?.name || `Producto ${Number(m[1]) + 1}`, field: m[2] };
  const c = /^contacts\.(\d+)\.(.+)$/.exec(d.path);
  if (c) return { entity: `Contacto ${(project.contacts || [])[Number(c[1])]?.name || Number(c[1]) + 1}`, field: c[2] };
  return { entity: "Proyecto", field: d.path };
}
function commitDraft({ reason = "", skipDiff = false } = {}) {
  const draft = state.draft, baseline = state.draftBaseline;
  const diffs = skipDiff ? [] : collectDiffs(baseline, draft);
  diffs.forEach(d => {
    const info = describeDiff(d, draft);
    logEvent(draft, { type: "Editado", entity: info.entity, field: info.field, before: d.before, after: d.after, reason });
  });
  draft.updatedAt = new Date().toISOString();
  const i = state.projects.findIndex(x => x.id === state.selectedId);
  if (i >= 0) state.projects[i] = clone(draft);
  else { state.projects.unshift(clone(draft)); state.selectedId = draft.id; }
  state.draftBaseline = clone(draft);
  syncCatalogs();
  saveState();
  return diffs.length;
}
function askReason(sensitive, cb) {
  modalHandlers = {};
  modalHandlers.submit = () => {

    if (!reason) { toast("Motivo obligatorio", "Los cambios sensibles exigen justificación (RN-18).", "error"); return false; }
    closeModal(); cb(reason); return true;
  };
  openModal(`<div class="m-h"><h2>Motivo del cambio</h2>

      dato anterior, dato nuevo y motivo (RN-18).</p>
      <div class="box">${sensitive.slice(0, 8).map(d => {
        const label = SENSITIVE_FIELDS.find(s => s.path.test(d.path))?.label || d.path;
        return `<div class="sm">${esc(label)}: <b>${esc(String(d.before ?? "—"))} → ${esc(String(d.after ?? "—"))}</b></div>`;
      }).join("")}${sensitive.length > 8 ? `<div class="xs muted">+${sensitive.length - 8} cambio(s) más</div>` : ""}</div>

}
function saveProject() {
  const p = state.draft;
  if (!p) return;
  const problems = [];
  if (!String(p.company).trim()) problems.push("empresa");
  if (!String(p.ppr).trim()) problems.push("PPR");
  if ((p.products || []).some(x => !String(x.name).trim())) problems.push("nombre de todos los productos");
  if (problems.length) { toast("No se puede guardar", `Complete: ${problems.join(", ")}.`, "error"); return; }
  const diffs = collectDiffs(state.draftBaseline, p);
  if (!diffs.length) { toast("Sin cambios", "No hay modificaciones para guardar."); return; }
  const sensitive = diffs.filter(d => SENSITIVE_FIELDS.some(s => s.path.test(d.path)));
  const done = reason => {
    commitDraft({ reason });
    const stored = state.projects.find(x => x.id === state.selectedId);
    if (stored) afterMutation(stored, "Cambios guardados", `${diffs.length} campo(s) actualizados.`);
  };
  if (sensitive.length && p.state !== "Borrador") { askReason(sensitive, done); return; }
  done("");
}

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", quote = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], next = text[i + 1];
    if (ch === '"' && quote && next === '"') { cell += '"'; i++; }
    else if (ch === '"') quote = !quote;
    else if (ch === "," && !quote) { row.push(cell); cell = ""; }
    else if ((ch === "\n" || ch === "\r") && !quote) {
      if (ch === "\r" && next === "\n") i++;
      row.push(cell);
      if (row.some(x => x.trim())) rows.push(row);
      row = []; cell = "";
    } else cell += ch;
  }
  row.push(cell);
  if (row.some(x => x.trim())) rows.push(row);
  return rows;
}
const CSV_PROJECT_FIELDS = { empresa: "company", ppr: "ppr", tipo: "type", coordinacion: "coordinatorRole",
                             vendedor: "seller", orden_servicio: "commercialRef", fecha_venta: "saleDate",
                             valor_facturado: "invoicedValue", observaciones_venta: "saleNotes", plan_estimado: "estimatedPlan" };
const CSV_PRODUCT_FIELDS = { categoria: "routing", tecnologia: "technology", complejidad: "complexity",
                             cargo_responsable: "role", persona: "owner", estado: "status", inicio: "startDate",
                             fecha_objetivo: "endDate", horas_vendidas: "hoursSold", valor_hora: "hourRate",
                             horas_ejecutadas: "hoursExecuted", avance: "progress" };
const CSV_NUMERIC = new Set(["invoicedValue", "hoursSold", "hourRate", "hoursExecuted", "progress"]);
function importCSVText(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) throw new Error("El archivo CSV no tiene datos.");
  const headers = rows[0].map(h => norm(h).replace(/\s+/g, "_"));
  let created = 0, updProjects = 0, updProducts = 0, skipped = 0;
  rows.slice(1).forEach(r => {
    const o = {};
    headers.forEach((h, i) => { if (h) o[h] = (r[i] ?? "").trim(); });
    const code = o.id || o.proyecto || o.codigo;
    if (!code) { skipped++; return; }
    let p = state.projects.find(x => norm(x.code) === norm(code));
    if (!p) {
      p = makeProject({ code, company: o.empresa || "", state: "Borrador" });
      logEvent(p, { type: "Importado", entity: "Proyecto", after: code, reason: "Creado desde CSV como borrador (RN-04)." });
      state.projects.push(p); created++;
    } else updProjects++;
    Object.entries(CSV_PROJECT_FIELDS).forEach(([col, f]) => {
      if (!(col in o) || o[col] === "") return;
      const value = CSV_NUMERIC.has(f) ? Number(o[col]) || 0 : o[col];
      if (String(p[f] ?? "") === String(value)) return;
      logEvent(p, { type: "Importado", entity: "Proyecto", field: f, before: p[f], after: value, reason: "Importación CSV." });
      p[f] = value;
    });
    const name = o.producto;
    if (name) {
      let pr = (p.products || []).find(x => norm(x.name) === norm(name));
      if (!pr) { pr = makeProduct({ name }); p.products.push(pr); }
      Object.entries(CSV_PRODUCT_FIELDS).forEach(([col, f]) => {
        if (!(col in o) || o[col] === "") return;
        const value = CSV_NUMERIC.has(f) ? Number(o[col]) || 0 : o[col];
        if (f === "status" && !PRODUCT_STATES.includes(value)) return;
        if (f === "routing" && !ROUTINGS.includes(value)) return;
        if (f === "role" && !CARGOS.includes(value)) return;
        if (String(pr[f] ?? "") === String(value)) return;
        logEvent(p, { type: "Importado", entity: pr.name, field: f, before: pr[f], after: value, reason: "Importación CSV." });
        pr[f] = value;
      });
      updProducts++;
    }
    p.updatedAt = new Date().toISOString();
  });
  state.projects = state.projects.map(makeProject);
  syncCatalogs(); saveState(); renderApp();
  toast("CSV importado", `${created} creados · ${updProjects} actualizados · ${updProducts} producto(s) · ${skipped} fila(s) sin identificador.`);
}
function importFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const text = String(reader.result || "");
      if (file.name.toLowerCase().endsWith(".json")) {
        const data = JSON.parse(text);
        if (!Array.isArray(data.projects)) throw new Error("El archivo JSON no contiene proyectos.");
        confirmModal("Restaurar base completa",
          `Se reemplazarán los ${state.projects.length} proyecto(s) actuales por los ${data.projects.length} del archivo.`,
          [{ label: "Cancelar" }, { label: "Reemplazar", kind: "btn-bad", action: () => {
            state.projects = data.projects.map(makeProject);
            state.outbox = Array.isArray(data.outbox) ? data.outbox : [];
            state.settings = mergeDeep(clone(DEFAULT_SETTINGS), data.settings || {});
            syncCatalogs(); saveState(); closeModal(); renderApp();
            toast("Base restaurada", `${state.projects.length} proyecto(s) cargados.`);
          } }]);
      } else importCSVText(text);
    } catch (e) { console.error(e); toast("No fue posible importar", e.message, "error"); }
  };
  reader.readAsText(file, "UTF-8");
}

const STRUCTURAL_PATHS = [/^products\.\d+\.routing$/, /^products\.\d+\.status$/, /^type$/, /^products\.\d+\.name$/];

function handleDraftInput(el) {
  if (!state.draft) return false;
  const path = el.dataset.path;
  if (!path) return false;
  let value;
  if (el.type === "checkbox") value = el.checked;
  else if (el.dataset.type === "number" || el.type === "number") value = Number(el.value) || 0;
  else value = el.value;
  if (/progress$/.test(path)) value = clamp(value, 0, 100);
  setPath(state.draft, path, value);

  const nameM = /^products\.(\d+)\.name$/.exec(path);
  if (nameM) {
    const pr = state.draft.products[Number(nameM[1])];
    const cat = catalogFind("products", value);
    if (cat) {
      if (!Number(pr.hoursSold)) pr.hoursSold = Number(cat.hours) || 0;
      if (!Number(pr.hourRate)) pr.hourRate = Number(cat.rate) || 0;
      if ((!pr.routing || pr.routing === "Otro") && ROUTINGS.includes(cat.routing)) pr.routing = cat.routing;
      pr.role = resolveProductRole(state.draft, pr);
      pr.owner = personForCargo(pr.role);
      return true;
    }
  }
  const routM = /^products\.(\d+)\.routing$/.exec(path);
  if (routM) {
    const pr = state.draft.products[Number(routM[1])];
    if (value !== "Medición objetiva") pr.technology = "";
    if (value !== "Diseño") pr.complexity = "";
    pr.role = resolveProductRole(state.draft, pr);
    pr.owner = personForCargo(pr.role);
  }
  if (path === "type") {
    state.draft.coordinatorRole = resolveCoordinatorRole(state.draft) || state.draft.coordinatorRole;
    state.draft.coordinator = personForCargo(state.draft.coordinatorRole);
    (state.draft.products || []).forEach(pr => {
      if (pr.routing === "Otro") { pr.role = resolveProductRole(state.draft, pr); pr.owner = personForCargo(pr.role); }
    });
  }
  if (/^products\.\d+\.status$/.test(path)) {
    const pr = state.draft.products[Number(/^products\.(\d+)\./.exec(path)[1])];
    if (["Completado", "Cerrado"].includes(pr.status)) pr.progress = 100;
  }
  return STRUCTURAL_PATHS.some(rx => rx.test(path));
}
function addRow(path) {
  if (!state.draft) return;
  if (path === "products") {
    const pr = makeProduct({ name: "", hoursSold: 0, routing: "Otro" });
    pr.role = resolveProductRole(state.draft, pr);
    pr.owner = personForCargo(pr.role);
    state.draft.products.push(pr);
  } else if (path === "contacts") {
    if ((state.draft.contacts || []).length >= 3) { toast("Máximo tres contactos", "La especificación permite de uno a tres.", "warning"); return; }
    state.draft.contacts.push(makeContact({ primary: !(state.draft.contacts || []).length, enabled: true }));
  } else {
    const list = getPath(state.draft, path);
    if (Array.isArray(list)) list.push(makeMilestone({ name: "", date: "" }));
  }
  rerenderDraftUI();
}
function removeRow(path, index) {
  if (!state.draft) return;
  const list = path === "products" ? state.draft.products : path === "contacts" ? state.draft.contacts : getPath(state.draft, path);
  if (!Array.isArray(list)) return;
  const removed = list[index];
  const finish = () => {
    list.splice(index, 1);
    if (path === "contacts") {
      const en = state.draft.contacts.filter(c => c.enabled !== false);
      if (en.length && en.every(c => !c.primary)) en[0].primary = true;
    }
    rerenderDraftUI();
  };
  if (path === "products" && removed && (removed.name || removed.hoursSold)) {
    confirmModal("Eliminar producto", `Se eliminará «${removed.name || "producto sin nombre"}» con sus hitos, requisitos y novedades.`,
      [{ label: "Cancelar" }, { label: "Eliminar", kind: "btn-bad", action: () => { finish(); closeModal(); } }]);
    return;
  }
  finish();
}

    el.open ? state.ui.openProducts.add(el.dataset.productDetails) : state.ui.openProducts.delete(el.dataset.productDetails);
    return;
  }
  if (el.dataset.section) {
    el.open ? state.ui.openSections.add(el.dataset.section) : state.ui.openSections.delete(el.dataset.section);
  }
}, true);

document.getElementById("globalSearch").addEventListener("input", e => {
  clearTimeout(searchTimer);
  const v = e.target.value.trim();
  searchTimer = setTimeout(() => { state.search = v; renderApp(); }, 220);
});
document.getElementById("drawerVeil").addEventListener("click", () => closeDrawer());
document.getElementById("modalVeil").addEventListener("click", e => {
  if (e.target === document.getElementById("modalVeil")) closeModal();
});
document.getElementById("importFile").addEventListener("change", e => {
  const f = e.target.files?.[0];
  if (f) importFile(f);
  e.target.value = "";
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (document.getElementById("modalVeil").classList.contains("open")) closeModal();
    else if (document.getElementById("drawer").classList.contains("open")) closeDrawer();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); document.getElementById("globalSearch").focus(); return; }
  if (e.key === "Enter" || e.key === " ") {
    const act = e.target.closest && e.target.closest('[role="button"][data-filter-key],[role="button"][data-special],[role="button"][data-open-project]');
    if (act) { e.preventDefault(); act.dispatchEvent(new MouseEvent("click", { bubbles: true, detail: 1 })); return; }
  }
  if (e.key === "Tab") trapFocus(e);
});
function trapFocus(e) {
  const modalOpen = document.getElementById("modalVeil").classList.contains("open");
  const drawerOpen = document.getElementById("drawer").classList.contains("open");
  const box = modalOpen ? document.getElementById("modal") : drawerOpen ? document.getElementById("drawer") : null;
  if (!box) return;
  const f = [...box.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')]
    .filter(el => el.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
window.addEventListener("beforeunload", e => {
  if (state.drawerMode === "detail" && isDirty()) { e.preventDefault(); e.returnValue = ""; }
});

/* ------------------------------ 19. INICIO ------------------------------ */

loadState();
// Al abrir, la aplicación revisa si hay cierres automáticos pendientes (RN-16, RN-17).
state.projects.forEach(p => runAutoClosure(p));
renderApp();
</script>
