<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rehavid · Gestión de proyectos v8 · venta, activación, asignación por cargos, negociación de capacidad, plan de trabajo final, ejecución y cierre automático." />
  <title>Rehavid | Gestión de proyectos</title>
  <style>
    /* =====================================================================
       Identidad Rehavid · hoja blanca centrada sobre fondo lila, cabecera
       morada con franja degradada a verde, pestañas con iconos de línea,
       tipografía compacta y títulos subrayados en verde.
       ===================================================================== */
    :root{
      /* marca */
      --rv:#4125CF; --rv2:#2e1a99; --rv3:#1e0f8a;
      --rvl:#ede9fc; --rvl2:#f4f2ff; --rvl3:#f9f8ff;
      --gr:#00C878; --grd:#007a4a; --grl:#e0faf2;

      /* superficies y texto */
      --bg:#f0eefa;
      --card:#ffffff;
      --card-2:#f9f8ff;
      --line:#dbd5f8;
      --line-2:#e5e0f5;
      --line-3:#c4bef5;
      --ink:#1a1a2e;
      --ink-2:#3b3b60;
      --muted:#55557a;
      --faint:#9990cc;

      /* semántica — nombres que ya usa la aplicación */
      --accent:#4125CF;
      --accent-2:#2e1a99;
      --accent-soft:#ede9fc;
      --indigo:#6350e0;
      --indigo-soft:#f0edff;
      --ok:#007a4a;
      --ok-soft:#e0faf2;
      --warn:#7a4200;
      --warn-soft:#fef3cc;
      --bad:#9b1010;
      --bad-soft:#fde8e8;
      --info:#0c447c;
      --info-soft:#e6f1fb;

      --r:10px;
      --r-sm:7px;
      --sh:0 1px 2px rgba(65,37,207,.05);
      --sh-2:0 4px 14px rgba(65,37,207,.13);
      --mono:ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
      --sans:'Segoe UI',Inter,Arial,ui-sans-serif,system-ui,-apple-system,sans-serif;
    }
    *{box-sizing:border-box}
    html{font-size:15px}
    body{margin:0;padding:20px;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
    button,input,select,textarea{font:inherit;color:inherit}
    button{cursor:pointer}
    a{color:var(--rv)}
    h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
    p{margin:0}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    :focus-visible{outline:2px solid var(--rv);outline-offset:2px}
    .num{font-variant-numeric:tabular-nums}
    .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
    svg.i{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

    /* ---------------- La hoja ---------------- */
    .shell{max-width:1500px;margin:0 auto;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 24px rgba(65,37,207,.15)}

    .hdr{background:var(--rv);display:flex;align-items:center;gap:16px;padding:0 22px;flex-wrap:wrap}
    .hdr-mark{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.13);border-radius:10px;padding:6px 13px;margin:11px 0}
    .hdr-mark .m{width:30px;height:30px;border-radius:7px;background:#fff;color:var(--rv);display:grid;place-items:center;font-weight:800;font-size:12px;letter-spacing:.5px;flex:none}
    .hdr-mark b{color:#fff;font-size:12px;font-weight:700;letter-spacing:.5px;display:block;line-height:1.2}
    .hdr-mark span{color:rgba(255,255,255,.55);font-size:9px;text-transform:uppercase;letter-spacing:.5px;display:block}
    .hdr-text{min-width:150px;flex:1;padding:13px 0}
    .hdr-text h1{font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:#fff;margin:0 0 3px}
    .hdr-text p{font-size:10px;color:rgba(255,255,255,.55);line-height:1.4}
    .hdr-right{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:9px 0}

    .accent{height:4px;background:linear-gradient(90deg,var(--rv) 0%,var(--gr) 100%)}

    /* ---------------- Pestañas ---------------- */
    .tabs{display:flex;background:var(--rv3);border-bottom:3px solid var(--rv);overflow-x:auto;scrollbar-width:thin}
    .tabs::-webkit-scrollbar{height:5px}
    .tabs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:3px}
    .tab{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:7px;padding:12px 13px;border:0;border-right:1px solid rgba(255,255,255,.1);background:transparent;
      font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:rgba(255,255,255,.55);white-space:nowrap;transition:background .18s,color .18s}
    .tab:last-child{border-right:0}
    .tab svg{width:17px;height:17px}
    .tab:hover{background:rgba(255,255,255,.08);color:rgba(255,255,255,.9)}
    .tab.active{background:#fff;color:var(--rv);box-shadow:inset 0 -3px 0 var(--gr)}
    .tab .badge{background:var(--bad);color:#fff;border-radius:20px;font-size:9px;font-weight:800;padding:1px 6px;min-width:18px;text-align:center;line-height:1.5}
    .tab.active .badge{background:var(--bad)}
    .tab .badge.zero{display:none}

    /* ---------------- Barra de herramientas ---------------- */
    .toolbar{display:flex;align-items:center;gap:10px;padding:8px 20px;background:var(--rvl3);border-bottom:1px solid var(--line);flex-wrap:wrap}
    .find{flex:1;min-width:200px;max-width:460px;position:relative;display:flex;align-items:center}
    .find input{width:100%;height:32px;border:1px solid var(--line-3);border-radius:7px;padding:0 11px 0 31px;background:#fff;outline:none;font-size:11.5px}
    .find input:focus{border-color:var(--rv);box-shadow:0 0 0 3px var(--rvl)}
    .find svg{position:absolute;left:10px;width:14px;height:14px;color:var(--faint);pointer-events:none}
    .saved{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--grd);font-weight:600;margin-left:auto;white-space:nowrap}
    .saved i{width:7px;height:7px;border-radius:50%;background:var(--gr);flex:none;font-style:normal}
    .flow{font-size:10px;color:var(--muted);background:var(--rvl);border-radius:6px;padding:3px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

    .whoami{display:flex;align-items:center;gap:8px;border-radius:8px;padding:3px 10px 3px 4px;background:rgba(255,255,255,.13);height:34px}
    .avatar{width:26px;height:26px;border-radius:50%;background:#fff;color:var(--rv);display:grid;place-items:center;font-size:10px;font-weight:800;flex:none}
    .whoami select{border:0;outline:none;font-size:11px;font-weight:700;background:transparent;color:#fff;max-width:132px;padding:0}
    .whoami select option{color:var(--ink)}
    .whoami small{display:block;font-size:9px;color:rgba(255,255,255,.6);text-transform:uppercase;letter-spacing:.3px;margin-top:-1px}

    /* ---------------- Botones ---------------- */
    .btn{border:1px solid var(--line-3);background:#fff;color:var(--rv);border-radius:7px;padding:0 12px;height:32px;font-weight:700;font-size:11px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
    .btn svg{width:14px;height:14px}
    .btn:hover{background:var(--rv);border-color:var(--rv);color:#fff}
    .btn:disabled{opacity:.45;cursor:not-allowed;background:#fff;color:var(--muted);border-color:var(--line)}
    .btn-pri{background:var(--rv);border-color:var(--rv);color:#fff}
    .btn-pri:hover{background:var(--rv2);border-color:var(--rv2)}
    .btn-ok{background:var(--gr);border-color:var(--gr);color:#004d2e}
    .btn-ok:hover{background:#00a862;border-color:#00a862;color:#fff}
    .btn-bad{color:var(--bad);border-color:#f0c9c9}
    .btn-bad:hover{background:var(--bad);border-color:var(--bad);color:#fff}
    .btn-plain{border-color:transparent;background:transparent;color:var(--muted)}
    .btn-plain:hover{background:var(--rvl);color:var(--rv);border-color:transparent}
    .btn-s{height:27px;padding:0 9px;font-size:10.5px;border-radius:6px}
    .btn-s svg{width:12px;height:12px}
    .btn-ico{width:32px;padding:0}
    .hdr-right .btn{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.13);color:#fff}
    .hdr-right .btn:hover{background:#fff;color:var(--rv);border-color:#fff}

    .page{padding:16px 20px 26px}

    /* ---------------- Tarjetas ---------------- */
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
    .card+.card{margin-top:14px}
    .card-h{display:flex;align-items:center;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;background:var(--rvl3)}
    .card-h h2{font-size:10px;font-weight:700;color:var(--rv);text-transform:uppercase;letter-spacing:.6px;display:inline-flex;align-items:center;gap:7px;padding-bottom:4px;border-bottom:2px solid var(--gr)}
    .card-h h2 svg{width:14px;height:14px}
    .card-h p{font-size:10.5px;color:var(--muted);margin:2px 0 0;text-transform:none;letter-spacing:0;font-weight:500}
    .card-h .sp{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    .card-b{padding:14px}
    .card-b.tight{padding:0}
    .muted{color:var(--muted)}
    .faint{color:var(--faint)}
    .xs{font-size:10px}
    .sm{font-size:11px}
    .note{font-size:11px;color:var(--muted);line-height:1.6}
    .note b{color:var(--ink-2)}
    .sec-title{font-size:10px;font-weight:700;color:var(--rv);text-transform:uppercase;letter-spacing:.6px;padding-bottom:5px;border-bottom:2px solid var(--gr);margin-bottom:10px;display:inline-block}

    /* ---------------- Filtros ---------------- */
    .filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px;align-items:flex-end;background:var(--rvl3);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px}
    .filt{display:flex;flex-direction:column;gap:3px;min-width:146px;flex:1;max-width:220px}
    .filt label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
    .filt select{height:30px;border:1px solid var(--line-3);border-radius:6px;background:#fff;padding:0 8px;font-size:11px;color:var(--ink)}
    .filt select:focus{outline:none;border-color:var(--rv);box-shadow:0 0 0 3px var(--rvl)}
    .filt select.set{border-color:var(--rv);background:var(--rvl2);font-weight:700;color:var(--rv2)}
    .filt label .cnt{display:inline-block;background:var(--rv);color:#fff;border-radius:20px;padding:0 6px;font-size:9px;margin-left:3px}
    .filters>.btn{margin-left:auto}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
    .chips:empty{margin:0}
    .chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;border:1.5px solid var(--line);background:#fff;font-size:10px;font-weight:700;color:var(--muted)}
    .chip:hover{border-color:var(--rv);color:var(--rv)}
    .chip.info{background:var(--rvl);border-color:var(--rvl);color:var(--rv2);cursor:default}
    .chip.clear{border-color:var(--rv);color:var(--rv);background:#fff}
    .chip.clear:hover{background:var(--rv);color:#fff}
    .chip.clear svg{width:11px;height:11px}

    /* ---------------- Indicadores ---------------- */
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-bottom:14px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
    .stat{background:#fff;border:0;border-right:1px solid var(--line);padding:0;text-align:center;display:block;transition:background .15s}
    .stat[role="button"]{cursor:pointer}
    .stat:last-child{border-right:0}
    .stat:hover{background:var(--rvl3)}
    .stat[aria-pressed="true"]{background:var(--rvl2);box-shadow:inset 0 -3px 0 var(--gr)}
    .stat .ico{display:flex;align-items:center;justify-content:center;gap:6px;font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:5px 6px;background:var(--rv);color:#fff}
    .stat .ico svg{width:13px;height:13px}
    .stat .ico.i{background:var(--gr);color:#004d2e}
    .stat .ico.w{background:#8a6000}
    .stat .ico.b{background:#8f1414}
    .stat .ico.o{background:var(--grd)}
    .stat .tx{display:block;padding:9px 8px 11px}
    .stat .tx span{display:none}
    .stat .tx strong{display:block;font-size:24px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--rv)}
    .stat .tx small{display:block;font-size:10px;color:var(--muted);margin-top:3px;line-height:1.4}
    .sublk{border:0;background:transparent;padding:0;font:inherit;color:var(--rv);font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
    .sublk:hover{color:var(--rv2)}
    .stat .ico.i~.tx strong{color:var(--grd)}
    .stat .ico.w~.tx strong{color:#b84500}
    .stat .ico.b~.tx strong{color:var(--bad)}
    .stat .ico.o~.tx strong{color:var(--grd)}

    /* ---------------- Gráficos ---------------- */
    .charts{display:grid;gap:14px;margin-bottom:14px}
    .chart-row-2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
    .donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
    .donut{position:relative;width:124px;height:124px;flex:none}
    .donut svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
    .donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15;pointer-events:none}
    .donut .mid b{display:block;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--rv)}
    .donut .mid span{display:block;font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:700;margin-top:2px}
    .legend{display:grid;gap:6px;flex:1;min-width:170px;max-width:460px}
    .leg{display:flex;align-items:center;gap:8px;font-size:11px;width:100%;border:0;background:transparent;padding:3px 6px;border-radius:6px;text-align:left}
    .leg:hover{background:var(--rvl)}
    .leg i{width:10px;height:10px;border-radius:2px;flex:none;font-style:normal}
    .leg .lgn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;text-align:left}
    .leg .vl{font-variant-numeric:tabular-nums;font-weight:800}
    .leg .pc{color:var(--muted);font-size:10px;min-width:36px;text-align:right;font-variant-numeric:tabular-nums}

    .hbars{display:grid;gap:10px}
    .hbar{display:grid;grid-template-columns:minmax(92px,148px) minmax(0,1fr) auto;gap:11px;align-items:center;font-size:11px}
    .hbar .lb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;border:0;background:transparent;padding:0;text-align:left;color:var(--rv)}
    .hbar .lb:hover{text-decoration:underline}
    .hbar .tr{height:18px;background:var(--line-2);border-radius:4px;overflow:hidden;display:flex;cursor:pointer}
    .hbar .tr i{display:block;height:100%;font-style:normal}
    .hbar .vv{font-variant-numeric:tabular-nums;font-weight:800;font-size:11px;min-width:60px;text-align:right;border:0;background:transparent;padding:0;color:inherit;cursor:pointer}
    .hbar .vv:hover{color:var(--rv);text-decoration:underline}
    .mini-legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:11px;padding-top:9px;border-top:1px solid var(--line-2)}
    .mini-legend span,.mleg,.mleg-off{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--muted);font-weight:600}
    .mini-legend i{width:9px;height:9px;border-radius:2px;font-style:normal;flex:none}
    .mleg{border:0;background:transparent;padding:3px 9px;border-radius:20px;transition:background .15s,color .15s,opacity .15s}
    .mleg:hover{background:var(--rvl);color:var(--rv)}
    .mleg.on{background:var(--rv);color:#fff}
    .mleg.dim{opacity:.45}
    .mleg-off{padding:3px 9px}

    /* --- piezas de gráfico accionables: clic para acotar, realce cruzado --- */
    .donut svg{animation:aro-entra .45s cubic-bezier(.2,.8,.2,1) both}
    @keyframes aro-entra{from{opacity:0;transform:rotate(-90deg) scale(.82)}to{opacity:1;transform:rotate(-90deg) scale(1)}}
    circle.arc{cursor:pointer;transition:opacity .2s,stroke-width .2s}
    circle.arc:hover,circle.arc:focus-visible{stroke-width:23;outline:none}
    circle.arc.on{stroke-width:23}
    circle.arc.dim{opacity:.25}
    .hbar .tr i.seg{cursor:pointer;transition:width .5s cubic-bezier(.2,.8,.2,1),opacity .2s,filter .2s}
    .hbar .tr i.seg:hover{filter:brightness(1.15) saturate(1.2)}
    .hbar .tr i.seg:focus-visible{outline:2px solid #fff;outline-offset:-2px}
    .hbar .tr i.seg.dim{opacity:.28}
    .hbar{transition:opacity .2s}
    .hbar.dim{opacity:.42}
    .hbar.on .lb{text-decoration:underline;text-underline-offset:3px}
    .leg{transition:background .15s,opacity .15s}
    .leg.on{background:var(--rvl);box-shadow:inset 3px 0 0 var(--rv)}
    .leg.dim{opacity:.42}
    .prog i{transition:width .5s cubic-bezier(.2,.8,.2,1)}

    /* ---------------- Tablas ---------------- */
    .tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
    .card-b.tight .tw{border:0;border-radius:0}
    table.t{width:100%;border-collapse:collapse;font-size:11px}
    table.t th{position:sticky;top:0;background:var(--rv);color:#fff;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;text-align:left;padding:7px 10px;white-space:nowrap;z-index:1;cursor:pointer;user-select:none}
    table.t th:empty{cursor:default}
    table.t th:hover:not(:empty){background:var(--rv2)}
    table.t th.s-asc::after{content:" ▲";font-size:8px;opacity:.9}
    table.t th.s-desc::after{content:" ▼";font-size:8px;opacity:.9}
    table.t td{padding:7px 10px;border-bottom:.5px solid var(--line-2);font-size:11px;vertical-align:middle;color:var(--ink)}
    table.t tbody tr:last-child td{border-bottom:0}
    table.t tbody tr:hover td{background:var(--rvl)}
    table.t tfoot td{background:var(--rvl);font-weight:800;color:var(--rv2);border-top:1px solid var(--line);border-bottom:0}
    .rt{text-align:right}
    .nm{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
    .lk{border:0;background:transparent;padding:0;text-align:left;color:var(--rv);font-weight:700;font-size:11px}
    .lk:hover{text-decoration:underline}
    .fv{border:0;background:transparent;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
    .fv:hover{color:var(--rv);text-decoration:underline}

    /* ---------------- Distintivos ---------------- */
    .pill{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;white-space:nowrap;max-width:100%}
    .pill.a{background:var(--rvl);color:var(--rv2)}
    .pill.i{background:var(--info-soft);color:var(--info)}
    .pill.o{background:var(--grl);color:var(--grd)}
    .pill.w{background:var(--warn-soft);color:var(--warn)}
    .pill.b{background:var(--bad-soft);color:var(--bad)}
    .pill.g{background:#f1f0f8;color:var(--muted)}
    .pill.pf{border:1px solid transparent;cursor:pointer;transition:filter .15s,box-shadow .15s}
    .pill.pf:hover{filter:brightness(.94);box-shadow:0 0 0 2px var(--rvl)}
    .pill.pf.on{box-shadow:0 0 0 2px var(--rv);border-color:var(--rv)}
    .pill.pf::after{content:"";width:0}
    .tags{display:flex;flex-wrap:wrap;gap:6px}
    .al-lk{border:0;background:transparent;padding:0;font:inherit;font-weight:800;color:inherit;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
    .al-lk:hover{opacity:.7}
    .dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
    .dot.o{background:var(--gr)}.dot.w{background:#e0a800}.dot.b{background:#d63333}.dot.g{background:var(--faint)}.dot.a{background:var(--rv)}

    .prog{height:6px;background:var(--line-2);border-radius:3px;overflow:hidden;position:relative;flex:1;min-width:66px}
    .prog i{display:block;height:100%;border-radius:3px;background:var(--rv);font-style:normal}
    .prog.b i{background:#d63333}.prog.w i{background:#e0a800}.prog.o i{background:var(--gr)}
    .prog .tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35;border-radius:2px}
    .progline{display:flex;align-items:center;gap:9px;min-width:110px}
    .progline b{font-variant-numeric:tabular-nums;font-size:11px;min-width:34px;text-align:right;font-weight:800}

    /* ---------------- Ficha de empresa ---------------- */
    .co-card{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
    .co-hero{display:flex;gap:14px;align-items:center;padding:13px 16px;background:var(--rv)}
    .co-mark{width:44px;height:44px;border-radius:9px;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
    .co-id{flex:1;min-width:170px}
    .co-id h2{font-size:14px;color:#fff;letter-spacing:.3px}
    .co-id p{font-size:10px;color:rgba(255,255,255,.6);margin:3px 0 0}
    .co-hero .sp{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
    .co-hero .btn{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.13);color:#fff}
    .co-hero .btn:hover{background:#fff;color:var(--rv);border-color:#fff}
    .co-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:0}
    .co-kpi{border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;padding:8px 6px}
    .co-kpi:last-child{border-right:0}
    .co-kpi span{display:block;font-size:8.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
    .co-kpi b{display:block;font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:3px;letter-spacing:-.02em;color:var(--rv)}
    .co-contacts{display:flex;gap:9px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line-2);background:var(--rvl3)}
    .ct{border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:11px;min-width:180px;background:#fff}
    .ct b{display:block;font-size:11px;color:var(--rv)}
    .ct span{display:block;color:var(--muted);font-size:10px;margin-top:2px}
    .ct a{color:var(--rv);text-decoration:none}
    .ct a:hover{text-decoration:underline}

    .prj{border-top:1px solid var(--line)}
    .prj-h{display:flex;gap:11px;align-items:center;padding:10px 16px;flex-wrap:wrap;background:var(--rvl2);border-bottom:1px solid var(--line-2)}
    .prj-h h3{font-size:11px;color:var(--rv2);text-transform:uppercase;letter-spacing:.4px}
    .prj-h .sp{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    .prods{padding:14px 16px 16px;display:grid;gap:12px}

    /* ---------------- Tarjeta de producto ---------------- */
    .pd{border:1px solid var(--line);border-radius:var(--r);background:#fff;overflow:hidden}
    .pd.b{border-left:4px solid #d63333}
    .pd.w{border-left:4px solid #e0a800}
    .pd.o{border-left:4px solid var(--gr)}
    .pd.g{border-left:4px solid var(--faint)}
    .pd.off{opacity:.4;filter:saturate(.45)}
    .pd.off:hover{opacity:1;filter:none}
    .pd.off .pd-acts,.pd.off .pd-alerts{display:none}
    .pd-off-tag{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);align-self:center}
    .pd-h{display:flex;gap:12px;align-items:flex-start;padding:11px 13px 9px;flex-wrap:wrap;border-bottom:1px solid var(--line-2)}
    .pd-h .ti{flex:1;min-width:180px}
    .pd-h .ti h4{font-size:12px;color:var(--rv);display:flex;align-items:center;gap:6px}
    .pd-h .ti h4 svg{width:14px;height:14px;flex:none}
    .pd-h .ti p{font-size:10.5px;color:var(--muted);margin:3px 0 0}
    .pd-h .st{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
    .pd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:0}
    .pd-grid>div{padding:8px 13px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);min-width:0}
    .pd-grid>div span{display:block;font-size:8.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
    .pd-grid>div b{display:block;font-size:11.5px;margin-top:3px;font-variant-numeric:tabular-nums;font-weight:700}
    .pd-grid>div small{display:block;font-size:10px;color:var(--faint);margin-top:1px}
    .pd-alerts{padding:10px 13px 0;display:grid;gap:5px}
    .pd-alert{display:flex;gap:8px;align-items:flex-start;font-size:10.5px;background:var(--bad-soft);border-radius:6px;padding:6px 10px;color:#7a0000;line-height:1.5}
    .pd-alert.w{background:var(--warn-soft);color:var(--warn)}
    .pd-alert svg{width:13px;height:13px;flex:none;margin-top:1px}
    .pd-alert b{font-weight:800;flex:none}
    .pd-acts{display:flex;gap:6px;flex-wrap:wrap;padding:10px 13px;background:var(--rvl3);border-top:1px solid var(--line-2);align-items:center}
    .lockmsg{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:5px}
    .lockmsg svg{width:12px;height:12px}
    .tl{padding:10px 13px 12px}
    .tl-item{display:grid;grid-template-columns:96px 1fr;gap:11px;font-size:10.5px;padding:7px 0;border-top:1px solid var(--line-2)}
    .tl-item time{color:var(--faint);font-size:10px;font-variant-numeric:tabular-nums}
    .tl-item b{display:block;font-size:11px;color:var(--rv)}
    .tl-item span{display:block;color:var(--muted);margin-top:2px;line-height:1.55}

    /* ---------------- Plan de trabajo ---------------- */
    .gantt{overflow-x:auto;padding:2px 0}
    .g-in{min-width:620px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
    .g-r{display:grid;grid-template-columns:180px 1fr;align-items:stretch;border-bottom:.5px solid var(--line-2)}
    .g-r:last-child{border-bottom:0}
    .g-r.hd{background:var(--rv);border-bottom:0}
    .g-r.hd .g-l{color:#fff;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;border-right-color:rgba(255,255,255,.2)}
    .g-l{padding:7px 11px;border-right:1px solid var(--line-2);font-size:10.5px;display:flex;align-items:center;gap:7px;min-width:0}
    .g-l span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .g-nm{border:0;background:transparent;padding:0;font:inherit;color:inherit;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;min-width:0}
    .g-nm:hover{color:var(--rv);text-decoration:underline}
    button.dot{border:0;padding:0;cursor:pointer;transition:transform .15s}
    button.dot:hover{transform:scale(1.4)}
    .g-r:hover{background:var(--rvl3)}
    .g-t{position:relative;min-height:30px;--c:6;background-image:repeating-linear-gradient(90deg,transparent,transparent calc(100%/var(--c) - 1px),var(--line-2) calc(100%/var(--c) - 1px),var(--line-2) calc(100%/var(--c)))}
    .g-s{display:flex;font-size:9.5px;color:rgba(255,255,255,.75);position:relative;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
    .g-s div{flex:1;padding:7px 4px;text-align:center;border-right:1px solid rgba(255,255,255,.15);white-space:nowrap;overflow:hidden}
    .g-b{position:absolute;top:8px;height:13px;border-radius:20px;background:var(--rvl);overflow:hidden}
    .g-b{cursor:pointer;transition:filter .15s}
    .g-b:hover{filter:brightness(1.1)}
    .g-b i{display:block;height:100%;background:var(--rv);font-style:normal}
    .g-b.b{background:var(--bad-soft)} .g-b.b i{background:#d63333}
    .g-b.w{background:var(--warn-soft)} .g-b.w i{background:#e0a800}
    .g-b.o{background:var(--grl)} .g-b.o i{background:var(--gr)}
    .g-base{position:absolute;top:24px;height:3px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--faint),var(--faint) 4px,transparent 4px,transparent 8px)}
    .g-m{position:absolute;top:9px;width:10px;height:10px;border-radius:2px;background:#fff;border:2px solid var(--rv2);transform:rotate(45deg)}
    .g-m.done{background:var(--gr);border-color:var(--grd)}
    .g-m.late{background:#d63333;border-color:var(--bad)}
    .g-now{position:absolute;top:0;bottom:0;width:2px;background:var(--gr);opacity:.8}
    .g-r.hd .g-now::after{content:"hoy";position:absolute;top:2px;left:4px;font-size:9px;color:var(--gr);font-weight:800}
    .g-empty{position:absolute;left:10px;top:9px;font-size:10px;color:var(--faint)}

    /* ---------------- Alertas por empresa ---------------- */
    .al-co{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
    .al-h{display:flex;gap:11px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;background:var(--rvl3)}
    .al-h h3{font-size:11px;color:var(--rv);text-transform:uppercase;letter-spacing:.5px;display:inline-flex;align-items:center;gap:7px;padding-bottom:4px;border-bottom:2px solid var(--gr)}
    .al-h .co-mark,.card-h .co-mark{background:var(--rvl);color:var(--rv)}
    .al-h h3 svg{width:15px;height:15px}
    .al-h .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}

    /* ---------------- Formularios ---------------- */
    .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:11px}
    .f{grid-column:span 4;min-width:0}
    .c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}
    .c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
    .f label{display:block;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
    .f input,.f select,.f textarea{width:100%;border:1px solid var(--line-3);border-radius:7px;background:#fff;padding:7px 10px;font-size:11.5px;outline:none;color:var(--ink)}
    .f input,.f select{height:34px}
    .f input[type=number]{font-variant-numeric:tabular-nums;text-align:right}
    .f textarea{min-height:70px;resize:vertical;line-height:1.55}
    .f input:focus,.f select:focus,.f textarea:focus{border-color:var(--rv);box-shadow:0 0 0 3px var(--rvl)}
    .f input[readonly]{background:var(--rvl3);color:var(--muted)}
    .f .hint{display:block;font-size:10px;color:var(--faint);margin-top:4px;line-height:1.5;text-transform:none;letter-spacing:0;font-weight:500}
    .f .ck{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:11px;cursor:pointer;background:#fff;text-transform:none;letter-spacing:0}
    .f .ck:hover{background:var(--rvl3);border-color:var(--line-3)}
    .f .ck strong{display:block;font-size:11px;color:var(--ink)}
    .f .ck span{display:block;color:var(--muted);font-size:10px;margin-top:2px;line-height:1.5;font-weight:500}
    .row{display:flex;gap:8px;flex-wrap:wrap}

    /* ---------------- Parametrización ---------------- */
    .cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
    .crud{display:grid;gap:7px}
    .crud-hd,.crud-r{display:grid;gap:7px;align-items:center}
    .crud-hd{font-size:9.5px;font-weight:700;color:var(--rv);text-transform:uppercase;letter-spacing:.4px;padding-bottom:6px;border-bottom:2px solid var(--gr)}
    .crud-r{padding:1px 0}
    .crud-r .f label{display:none}
    .crud-r>.f{grid-column:auto}
    .del{border:0;background:transparent;color:var(--bad);font-size:14px;line-height:1;width:28px;height:30px;border-radius:6px}
    .del:hover{background:var(--bad-soft)}

    /* ---------------- Cajón lateral ---------------- */
    .veil{position:fixed;inset:0;background:rgba(30,15,138,.35);z-index:60;opacity:0;pointer-events:none;transition:opacity .18s;backdrop-filter:blur(2px)}
    .veil.open{opacity:1;pointer-events:auto}
    .drawer{position:fixed;top:0;right:0;height:100vh;width:min(1020px,97vw);background:var(--bg);z-index:65;transform:translateX(101%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
    .drawer.open{transform:translateX(0)}
    .dr-h{padding:13px 18px;display:flex;align-items:flex-start;gap:12px;background:var(--rv);border-bottom:4px solid var(--gr)}
    .dr-h .t{flex:1;min-width:0}
    .dr-h .t span{display:block;color:rgba(255,255,255,.6);font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
    .dr-h .t h2{font-size:15px;color:#fff;margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .dr-h .t p{font-size:10.5px;color:rgba(255,255,255,.6);margin:3px 0 0}
    .dr-h .btn{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.13);color:#fff}
    .dr-h .btn:hover{background:#fff;color:var(--rv);border-color:#fff}
    .dr-b{overflow:auto;flex:1;padding:14px 18px 26px}
    .dr-f{padding:10px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;background:#fff;flex-wrap:wrap}
    .dr-f .sp{flex:1}
    .strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:0;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
    .strip>div{padding:8px 12px;border-right:1px solid var(--line-2);min-width:0}
    .strip>div:last-child{border-right:0}
    .strip>div span{display:block;font-size:8.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
    .strip>div b{display:block;font-size:13px;margin-top:3px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--rv)}
    .acc{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
    .acc>summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;justify-content:space-between;gap:11px;font-size:10.5px;font-weight:700;color:var(--rv);text-transform:uppercase;letter-spacing:.5px;background:var(--rvl3)}
    .acc>summary::-webkit-details-marker{display:none}
    .acc>summary::after{content:"⌄";color:var(--faint);font-size:14px;transition:transform .15s}
    .acc[open]>summary::after{transform:rotate(180deg)}
    .acc[open]>summary{border-bottom:2px solid var(--gr)}
    .acc-b{padding:14px}
    .sub{border:1px solid var(--line);border-radius:8px;margin-top:12px;background:#fff;overflow:hidden}
    .sub>summary{padding:9px 12px;font-size:10px;font-weight:700;cursor:pointer;color:var(--rv2);text-transform:uppercase;letter-spacing:.4px;background:var(--rvl3)}
    .sub-b{border-top:1px solid var(--line-2);padding:12px}
    .box{border:1px solid var(--line);border-radius:8px;background:#fff;padding:12px;margin-bottom:10px}
    .box-h{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:10px}
    .box-h strong{font-size:11px;color:var(--rv)}
    .box-h span{font-size:10px;color:var(--muted)}

    /* ---------------- Asistente ---------------- */
    .steps{display:flex;gap:0;margin-bottom:14px;flex-wrap:wrap;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
    .step{flex:1;min-width:126px;border:0;border-right:1px solid var(--line);background:#fff;padding:9px 12px;text-align:left}
    .step:last-child{border-right:0}
    .step b{display:block;font-size:10.5px;font-weight:700;color:var(--ink)}
    .step span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
    .step .n{width:20px;height:20px;border-radius:50%;background:var(--line-2);color:var(--muted);display:inline-grid;place-items:center;font-size:10px;font-weight:800;margin-bottom:6px}
    .step.on{background:var(--rvl2);box-shadow:inset 0 -3px 0 var(--gr)}
    .step.on b{color:var(--rv)}
    .step.on .n{background:var(--rv);color:#fff}
    .step.done .n{background:var(--gr);color:#004d2e}
    .checks{display:grid;gap:7px}
    .chk{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:11px;background:#fff}
    .chk.ok{border-color:#a8e6cd;background:var(--grl)}
    .chk.no{border-color:#f2c9c9;background:var(--bad-soft)}
    .chk .m{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:10px;font-weight:800;color:#fff}
    .chk.ok .m{background:var(--grd)}
    .chk.no .m{background:var(--bad)}
    .chk strong{display:block;font-size:11px}
    .chk span{display:block;color:var(--muted);font-size:10px;margin-top:3px;line-height:1.55}
    .chk.no span{color:#7a0000}

    /* ---------------- Calendario ---------------- */
    .cal-top{display:flex;align-items:center;justify-content:space-between;gap:11px;padding:11px 14px;border-bottom:1px solid var(--line-2);flex-wrap:wrap;background:var(--rvl3)}
    .cal-top h2{font-size:12px;text-transform:uppercase;color:var(--rv);letter-spacing:.5px}
    .cal-ctl{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    .cal-ctl select{height:30px;border:1px solid var(--line-3);border-radius:6px;background:#fff;font-size:11px;padding:0 8px}
    .cal{display:grid;grid-template-columns:repeat(7,minmax(112px,1fr));overflow:auto}
    .wd{background:var(--rv);color:#fff;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:7px 9px;border-right:1px solid rgba(255,255,255,.15)}
    .wd:last-child{border-right:0}
    .dy{min-height:104px;padding:6px 7px;border-right:.5px solid var(--line-2);border-bottom:.5px solid var(--line-2);background:#fff}
    .dy.out{background:var(--rvl3);color:var(--faint)}
    .dy.today{background:var(--grl)}
    .dy.hol{background:#fffdf3}
    .dy-n{display:flex;justify-content:space-between;gap:5px;font-size:11px;font-weight:800;margin-bottom:4px;color:var(--rv2)}
    .dy.out .dy-n{color:var(--faint)}
    .dy-h{font-size:9px;color:var(--warn);text-align:right;max-width:72px;font-weight:600}
    .ev{display:block;width:100%;border:0;background:var(--rvl);color:var(--rv2);text-align:left;padding:3px 6px;margin-top:3px;border-radius:5px;font-size:10px}
    .ev.b{background:var(--bad-soft);color:var(--bad)}
    .ev.w{background:var(--warn-soft);color:var(--warn)}
    .ev.o{background:var(--grl);color:var(--grd)}
    .ev b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .ev span{display:block;font-size:9px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .more{border:0;background:transparent;color:var(--rv);font-size:10px;font-weight:700;padding:3px 0}
    .hols{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 14px;border-bottom:1px solid var(--line-2);background:#fffdf3}
    .hol-c{font-size:10px;border:1px solid #f0dcae;background:#fdf6e3;color:var(--warn);padding:2px 8px;border-radius:20px;font-weight:600}

    /* ---------------- Modal y avisos ---------------- */
    .mveil{position:fixed;inset:0;background:rgba(30,15,138,.4);z-index:80;display:none;place-items:center;padding:18px;backdrop-filter:blur(2px)}
    .mveil.open{display:grid}
    .modal{width:min(860px,97vw);max-height:88vh;overflow:auto;background:#fff;border-radius:12px;box-shadow:0 20px 50px rgba(30,15,138,.28)}
    .m-h{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;gap:11px;background:var(--rv);border-bottom:4px solid var(--gr)}
    .m-h h2{font-size:12px;color:#fff;text-transform:uppercase;letter-spacing:.5px}
    .m-h .btn{border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.13);color:#fff}
    .m-h .btn:hover{background:#fff;color:var(--rv);border-color:#fff}
    .m-b{padding:16px 18px}
    .m-f{padding:11px 18px;border-top:1px solid var(--line-2);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;background:var(--rvl3)}
    .pre{border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--rvl3);font-size:11px;line-height:1.7;white-space:pre-wrap;font-family:var(--mono);max-height:320px;overflow:auto}
    .toasts{position:fixed;right:22px;bottom:22px;z-index:95;display:grid;gap:9px}
    .toast{background:#fff;border:1px solid var(--line);border-left:4px solid var(--rv);border-radius:9px;padding:10px 13px;font-size:11px;min-width:250px;max-width:340px;line-height:1.55;box-shadow:var(--sh-2);color:var(--muted)}
    .toast strong{display:block;font-size:11.5px;margin-bottom:2px;color:var(--rv)}
    .toast.error{border-left-color:var(--bad)}
    .toast.error strong{color:var(--bad)}
    .toast.warning{border-left-color:#e0a800}
    .toast.warning strong{color:var(--warn)}
    .empty{padding:44px 20px;text-align:center;color:var(--faint)}
    .empty svg{width:42px;height:42px;opacity:.4;margin-bottom:10px;color:var(--rv)}
    .empty strong{display:block;color:var(--muted);font-size:13px;font-weight:700;margin-bottom:5px}

    @media(max-width:960px){

      .f,.c2,.c3,.c4,.c5,.c6,.c7,.c8,.c9,.c12{grid-column:span 1}
      .f.c12,.f.c9,.f.c8,.f.c7,.f.c6{grid-column:1/-1}
      .drawer{width:100vw}

    @media(max-width:560px){
      .stats{grid-template-columns:1fr}
      .stat{border-right:0;border-bottom:1px solid var(--line)}
      .stat:last-child{border-bottom:0}
      .grid{grid-template-columns:1fr}
      .f,.f.c12,.f.c9,.f.c8,.f.c7,.f.c6{grid-column:1}

<script>
"use strict";
/* =============================================================================
   REHAVID · Gestión de proyectos · v7
   Implementa la "Especificación funcional y flujograma del proceso de gestión
   de proyectos" versión 1.1: registro obligatorio, asignación por cargos,
   negociación de capacidad, plan de trabajo final versionado, ejecución con
   novedades y cierre automático de producto y de proyecto maestro.
   ============================================================================= */

/* ----------------------- 1. CATÁLOGOS Y PARÁMETROS ----------------------- */

const APP_VERSION = "7.0.0";
const STORAGE_KEY = "rehavid_gestion_proyectos_v7";
const LEGACY_KEYS = ["rehavid_gestion_proyectos_v5", "rehavid_project_hub_v1"];

// RN-02 · las asignaciones se parametrizan por cargo, nunca por nombre de persona.
const CARGOS = ["CEO", "Gerente", "Director de Proyectos", "Jefe de Operaciones",
                "Gestor de Datos", "Analista de Proyectos", "Diseñador",
                "Supervisor de Proyectos Contactabilidad"];
// Cargos que venían de versiones anteriores y su denominación vigente.
const CARGO_RENAMES = { "Diseñador Ergónomo": "Diseñador",
                        "Supervisor de Proyectos Especiales": "Supervisor de Proyectos Contactabilidad",
                        "Analista de Datos": "Analista de Proyectos", "Vendedor": "Analista de Proyectos" };
function renameCargo(c) { return CARGO_RENAMES[c] || c; }
const CARGOS_VENTA = ["CEO", "Gerente", "Jefe de Operaciones", "Director de Proyectos"];   // RN-01
const CARGOS_ADMIN = ["CEO", "Gerente"];

const PROJECT_TYPES   = ["Tipo 1", "Tipo 2"];
const PROJECT_STATES  = ["Borrador", "Activo", "Cerrado"];                 // §11.1
const PRODUCT_STATES  = ["Pendiente de información", "Programado", "En ejecución",
                         "Suspendido", "Completado", "Cerrado"];           // §11.1
const ASSIGN_STATES   = ["Pendiente de aceptación", "En ajuste", "Aceptada"];
const CONDITIONS      = ["En tiempo", "En riesgo", "Retrasado"];
const ROUTINGS        = ["Medición objetiva", "Tablero BI", "Diseño", "Cápsulas", "Otro"];
const TECHNOLOGIES    = ["Xsens", "TuMeke", "BVB", "Tobii 3", "EMG de superficie", "Biofeedback"];
const COMPLEXITIES    = ["Baja", "Media", "Alta"];
const NOVELTY_TYPES   = ["Avance", "Retraso", "Suspensión", "Bloqueo", "Reanudación", "Reprogramación",
                         "Solicitud de información", "Nota"];
const REQ_STATES      = ["Definido", "Solicitado al cliente", "Recibido", "No recibido", "Exceptuado"];

const STATE_RANK = { "Pendiente de información": 0, "Suspendido": 1, "Programado": 2,
                     "En ejecución": 3, "Completado": 4, "Cerrado": 5 };
const CONDITION_RANK = { "Retrasado": 0, "En riesgo": 1, "En tiempo": 2 };
const OPEN_STATES = ["Pendiente de información", "Programado", "En ejecución", "Suspendido"];

const MONTHS   = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
                  "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
const WEEKDAYS = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];
const MONEY      = new Intl.NumberFormat("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 });
const NUM        = new Intl.NumberFormat("es-CO", { maximumFractionDigits: 1 });
const DATE_LONG  = new Intl.DateTimeFormat("es-CO", { day: "2-digit", month: "short", year: "numeric" });
const DATE_SHORT = new Intl.DateTimeFormat("es-CO", { day: "2-digit", month: "short" });

const VIEWS = [
  { id: "dashboard",   n: "01", group: "a", label: "Dashboard", title: "Dashboard",
    subtitle: "Portafolio por tipo de proyecto, empresa, PPR y estado operativo" },
  { id: "companies",   n: "02", group: "a", label: "Empresas y productos", title: "Empresas y productos",
    subtitle: "Ficha de la empresa, sus proyectos y la gestión de cada producto" },
  { id: "alerts",      n: "03", group: "a", label: "Alertas", title: "Alertas por empresa",
    subtitle: "Qué empresa y qué producto requieren acción, con gestión directa", badge: "alerts" },
  { id: "assignments", n: "04", group: "b", label: "Mis asignaciones", title: "Mis asignaciones",
    subtitle: "Aceptar la asignación o proponer un ajuste de fecha y capacidad", badge: "assignments" },
  { id: "plans",       n: "05", group: "b", label: "Planes de trabajo", title: "Planes de trabajo final",
    subtitle: "Plan final versionado por proyecto, contrastado con el plan de la venta" },
  { id: "calendar",    n: "06", group: "b", label: "Calendario", title: "Calendario",
    subtitle: "Programación consolidada o por empresa, con festivos de Colombia" },
  { id: "newproject",  n: "07", group: "b", label: "Nuevo proyecto", title: "Nuevo proyecto · venta realizada",
    subtitle: "Registro obligatorio, validación y activación automática" },
  { id: "params",      n: "08", group: "c", label: "Parametrización", title: "Parametrización",
    subtitle: "Productos y tarifas, PPR, empresas, órdenes, cargos y reglas de asignación" },
  { id: "data",        n: "09", group: "c", label: "Bases y auditoría", title: "Bases de datos y auditoría",
    subtitle: "Descarga de los ocho conjuntos de datos, completa o filtrada, e historial de cambios" }
];

/* §7.3 · alertas de gestión, ampliadas al flujo 1.1 */
const ALERT_DEFS = [
  { code: "assign_pending", label: "Asignación sin aceptar", sev: "Alta",
    desc: "El cargo responsable no ha aceptado ni ajustado la asignación dentro del acuerdo configurado.",
    test: (pr, p, sla) => {
      if (p.state !== "Activo" || !isOpenProduct(pr)) return false;
      if (pr.assignment.status !== "Pendiente de aceptación" || !pr.assignment.assignedAt) return false;
      const h = hoursSince(pr.assignment.assignedAt);
      return h > sla.acceptHours ? `Asignado hace ${fmtNum(h / 24)} día(s); el acuerdo es de ${sla.acceptHours} h.` : false;
    } },
  { code: "assign_adjust", label: "Ajuste de capacidad sin resolver", sev: "Alta",
    desc: "El responsable propuso un ajuste de fecha o capacidad y la coordinación no lo ha resuelto.",
    test: (pr, p, sla) => {
      if (pr.assignment.status !== "En ajuste") return false;
      const d = Math.floor(hoursSince(pr.assignment.proposedAt || pr.assignment.assignedAt) / 24);
      return `Ajuste propuesto hace ${d} día(s): ${pr.assignment.justification || "sin justificación"}.`;
    } },
  { code: "req_undefined", label: "Requisitos sin definir", sev: "Media",
    desc: "El líder del producto no ha definido qué información necesita del cliente.",
    test: (pr, p, sla) => {
      if (p.state !== "Activo" || !isOpenProduct(pr)) return false;
      if ((pr.requirements || []).length) return false;
      const d = Math.floor(hoursSince(pr.assignment.acceptedAt || p.activatedAt) / 24);
      return d > sla.requirementDays ? `Sin requisitos definidos ${d} día(s) después de la asignación.` : false;
    } },
  { code: "req_not_requested", label: "Información no solicitada al cliente", sev: "Alta",
    desc: "Hay requisitos definidos que la coordinación todavía no ha solicitado al cliente.",
    test: (pr, p, sla) => {
      const pend = (pr.requirements || []).filter(r => r.status === "Definido");
      if (!pend.length || !isOpenProduct(pr)) return false;
      return `${pend.length} requisito(s) definidos sin solicitar: ${pend.slice(0, 2).map(r => r.description).join("; ")}.`;
    } },
  { code: "req_missing", label: "Información pendiente del cliente", sev: "Media",
    desc: "La información fue solicitada al cliente y no ha sido recibida.",
    test: (pr, p, sla) => {
      const pend = (pr.requirements || []).filter(r => ["Solicitado al cliente", "No recibido"].includes(r.status));
      if (!pend.length || !isOpenProduct(pr)) return false;
      const vencidos = pend.filter(r => r.commitDate && (daysUntil(r.commitDate) ?? 0) < 0);
      if (vencidos.length) return `${vencidos.length} compromiso(s) del cliente vencido(s): ${vencidos.map(r => `${r.description} (${formatDate(r.commitDate, true)})`).slice(0, 2).join("; ")}.`;
      const old = pend.filter(r => !r.commitDate && r.requestedAt && hoursSince(r.requestedAt) / 24 > sla.clientAnswerDays);
      if (old.length) return `${old.length} solicitud(es) sin respuesta hace más de ${sla.clientAnswerDays} día(s).`;
      return false;
    } },
  { code: "no_plan", label: "Sin plan de trabajo final", sev: "Alta",
    desc: "El proyecto opera sin el plan final que exige la especificación (RN-13).",
    test: (pr, p, sla) => {
      if (p.state !== "Activo" || !isOpenProduct(pr) || p.finalPlan?.version) return false;
      const d = Math.floor(hoursSince(p.activatedAt || p.createdAt) / 24);
      return d > sla.planDays ? `Sin plan final ${d} día(s) después de activar el proyecto.` : false;
    } },
  { code: "not_scheduled", label: "Sin programación", sev: "Alta",
    desc: "El producto no tiene fechas definitivas de inicio y cierre.",
    test: (pr, p, sla) => {
      if (p.state !== "Activo" || !isOpenProduct(pr)) return false;
      if (pr.startDate && pr.endDate) return false;
      const d = Math.floor(hoursSince(p.activatedAt || p.createdAt) / 24);
      return d > sla.scheduleDays ? `Sin fechas definitivas ${d} día(s) después de la activación.` : "Sin fechas definitivas.";
    } },
  { code: "due_soon", label: "Próximo a vencer", sev: "Media",
    desc: "La fecha objetivo se aproxima y el avance no es suficiente.",
    test: (pr, p, sla) => {
      if (!isOpenProduct(pr) || !pr.endDate) return false;
      const left = daysUntil(pr.endDate);
      if (left === null || left < 0 || left > sla.dueSoonDays) return false;
      const exp = expectedProgress(pr), real = productProgress(pr);
      return real + sla.progressTolerance < exp
        ? `Faltan ${left} día(s) y el avance es ${fmtPct(real)} frente a ${fmtPct(exp)} esperado.` : false;
    } },
  { code: "overdue", label: "Retrasado", sev: "Crítica",
    desc: "La fecha objetivo del plan final venció sin completar el producto.",
    test: pr => {
      if (!isOpenProduct(pr) || !pr.endDate) return false;
      const left = daysUntil(pr.endDate);
      return left !== null && left < 0 ? `Venció el ${formatDate(pr.endDate, true)} (${Math.abs(left)} día(s)).` : false;
    } },
  { code: "suspended", label: "Suspendido", sev: "Alta",
    desc: "El producto está detenido; exige causa, responsable, acción y nueva fecha (RN-15).",
    test: pr => {
      if (pr.status !== "Suspendido") return false;
      const n = lastNovelty(pr, "Suspensión");
      if (!n || !n.cause || !n.owner || !n.newDate) return "Suspendido sin causa, responsable o nueva fecha completa (RN-15).";
      return `Causa: ${n.cause} · revisión ${formatDate(n.newDate, true)}.`;
    } },
  { code: "stale", label: "Sin actualización", sev: "Media",
    desc: "El líder no ha registrado novedades dentro del periodo de control.",
    test: (pr, p, sla) => {
      if (p.state !== "Activo" || !["Programado", "En ejecución"].includes(pr.status)) return false;
      const base = pr.lastUpdateAt || pr.assignment.acceptedAt || p.activatedAt;
      if (!base) return false;
      const d = Math.floor(hoursSince(base) / 24);
      return d > sla.updateDays ? `Última actualización hace ${d} día(s).` : false;
    } },
  { code: "hours_dev", label: "Desviación de horas", sev: "Alta",
    desc: "Las horas ejecutadas superan o se aproximan al límite vendido.",
    test: (pr, p, sla) => {
      const sold = Number(pr.hoursSold) || 0, used = Number(pr.hoursExecuted) || 0;
      if (pr.status === "Cerrado" || sold <= 0) return false;
      const pct = used / sold * 100;
      if (pct > 100) return `${fmtNum(used)} h ejecutadas sobre ${fmtNum(sold)} h vendidas (${fmtPct(pct)}).`;
      if (!isOpenProduct(pr)) return false;
      return pct >= sla.hoursWarnPct ? `${fmtPct(pct)} de las horas vendidas consumidas (saldo ${fmtNum(sold - used)} h).` : false;
    } },
  { code: "completed_blocked", label: "Completado sin poder cerrar", sev: "Alta",
    desc: "El líder declaró el producto completado pero la validación automática no pasa.",
    test: (pr, p) => {
      if (pr.status !== "Completado") return false;
      const v = validateClosure(pr, p);
      return v.ok ? false : `Falta para el cierre automático: ${v.missing.join(", ")}.`;
    } }
];
const ALERT_BY_CODE = Object.fromEntries(ALERT_DEFS.map(a => [a.code, a]));
/* La gestión directa desde el módulo de alertas: cada código sabe qué acción lo resuelve. */
const ALERT_ACTION = {
  assign_pending: { kind: "accept", label: "Aceptar asignación" },
  assign_adjust: { kind: "resolve", label: "Resolver ajuste" },
  req_undefined: { kind: "requirements", label: "Definir requisitos" },
  req_not_requested: { kind: "request", label: "Solicitar al cliente" },
  req_missing: { kind: "response", label: "Registrar respuesta" },
  no_plan: { plan: true, label: "Construir plan" },
  not_scheduled: { plan: true, label: "Programar en el plan" },
  due_soon: { kind: "novelty", label: "Registrar novedad" },
  overdue: { kind: "novelty", label: "Registrar novedad", type: "Retraso" },
  suspended: { kind: "novelty", label: "Reanudar", type: "Reanudación" },
  stale: { kind: "novelty", label: "Registrar avance", type: "Avance" },
  hours_dev: { kind: "novelty", label: "Registrar novedad" },
  completed_blocked: { kind: "complete", label: "Completar el cierre" }
};
function alertActionBtn(p, pr, code) {
  const a = ALERT_ACTION[code];
  if (!a) return "";
  if (a.plan) return `<button class="btn btn-s" data-plan-edit="${esc(p.id)}">${esc(a.label)}</button>`;
  return `<button class="btn btn-s" data-product-action="${esc(a.kind)}" data-project="${esc(p.id)}"
    data-product="${esc(pr.id)}" ${a.type ? `data-novelty-type="${esc(a.type)}"` : ""}>${esc(a.label)}</button>`;
}
const SEV_RANK = { "Crítica": 0, "Alta": 1, "Media": 2 };

/* §4.1 · validaciones previas a la activación */
const ACTIVATION_CHECKS = [
  { id: "identity", label: "Empresa, PPR y tipo de proyecto",
    hint: "Los tres son obligatorios y deben venir del catálogo.",
    run: p => {
      const miss = [];
      if (!String(p.company || "").trim()) miss.push("empresa");
      if (!String(p.ppr || "").trim()) miss.push("PPR");
      if (!PROJECT_TYPES.includes(p.type)) miss.push("tipo de proyecto");
      return miss.length ? { ok: false, detail: `Falta: ${miss.join(", ")}.` }
                         : { ok: true, detail: `${p.company} · ${p.ppr} · ${p.type}.` };
    } },
  { id: "catalogs", label: "Empresa y PPR del catálogo parametrizado",
    hint: "La activación exige valores parametrizados; las correcciones quedan en bitácora (RN-04).",
    run: p => {
      const miss = [];
      if (String(p.company || "").trim() && !catalogFind("companies", p.company)) miss.push(`la empresa «${p.company}»`);
      if (String(p.ppr || "").trim() && !catalogFind("pprs", p.ppr)) miss.push(`el PPR «${p.ppr}»`);
      return miss.length
        ? { ok: false, detail: `No está(n) en el catálogo: ${miss.join(" y ")}. Créelos en Parametrización o corrija el dato.` }
        : { ok: true, detail: "Empresa y PPR verificados contra el catálogo." };
    } },
  { id: "requestedDates", label: "Fecha solicitada por producto",
    hint: "Cada producto necesita una fecha o plazo preliminar antes de activar; es la base de la negociación de capacidad (RN-10).",
    run: p => {
      const bad = (p.products || []).filter(x => !x.assignment?.requestedDate);
      return bad.length
        ? { ok: false, detail: `Sin fecha solicitada: ${bad.map(x => x.name || "producto sin nombre").join(", ")}.` }
        : { ok: true, detail: "Todos los productos tienen fecha solicitada." };
    } },
  { id: "seller", label: "Vendedor autorizado",
    hint: "Solo CEO, Gerente, Jefe de Operaciones o Director de Proyectos pueden registrar la venta (RN-01).",
    run: p => CARGOS_VENTA.includes(p.sellerRole)
      ? { ok: true, detail: `${p.seller} · ${p.sellerRole}.` }
      : { ok: false, detail: `El cargo «${p.sellerRole || "sin definir"}» no está autorizado para registrar ventas.` } },
  { id: "products", label: "Al menos un producto vendido",
    hint: "Una venta crea un proyecto maestro y uno o más productos (RN-03).",
    run: p => (p.products || []).length
      ? { ok: true, detail: `${p.products.length} producto(s).` }
      : { ok: false, detail: "Agregue el primer producto vendido." } },
  { id: "productNames", label: "Nombre de cada producto",
    hint: "Cada frente de trabajo debe estar identificado.",
    run: p => {
      const bad = (p.products || []).filter(x => !String(x.name || "").trim());
      return bad.length ? { ok: false, detail: `${bad.length} producto(s) sin nombre.` }
                        : { ok: true, detail: "Todos identificados." };
    } },
  { id: "hours", label: "Horas por producto mayores que cero",

  { id: "otherContacts", label: "Contactos adicionales completos",

    run: p => {

      return bad.length ? { ok: false, detail: `Datos incompletos en: ${bad.map(c => c.name || "contacto sin nombre").join(", ")}.` }
                        : { ok: true, detail: `${list.length} contacto(s) habilitado(s).` };

    } }

/* ------------------------------ 2. UTILIDADES ------------------------------ */

function clone(v) { return JSON.parse(JSON.stringify(v)); }
function uid(prefix = "id") { return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`; }
function esc(v) {
  return String(v ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
                        .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}
function norm(v) { return String(v ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim(); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, Number(v) || 0)); }
function sum(list, getter = x => x) { return (list || []).reduce((a, x) => a + (Number(getter(x)) || 0), 0); }
function avg(list, getter = x => x) { return (list || []).length ? sum(list, getter) / list.length : 0; }
function unique(list) {
  return [...new Set((list || []).map(x => String(x ?? "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b, "es"));
}
function groupBy(list, getter) {
  const m = new Map();
  (list || []).forEach(x => { const k = getter(x) || "Sin definir"; if (!m.has(k)) m.set(k, []); m.get(k).push(x); });
  return m;
}
function initials(v) {
  return String(v || "NA").split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join("").toUpperCase();
}
function dateISO(d = new Date()) {
  const x = new Date(d);
  if (Number.isNaN(x.getTime())) return "";
  return new Date(x.getTime() - x.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function dateOffset(days) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + days); return dateISO(d); }
function toDate(v) { if (!v) return null; const d = new Date(`${String(v).slice(0, 10)}T12:00:00`); return Number.isNaN(d.getTime()) ? null : d; }
function formatDate(v, short = false) { const d = toDate(v); return d ? (short ? DATE_SHORT : DATE_LONG).format(d) : "sin fecha"; }
function formatStamp(v) {
  if (!v) return "sin fecha";
  const d = new Date(v);
  return Number.isNaN(d.getTime()) ? "sin fecha"
    : `${DATE_SHORT.format(d)} ${d.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" })}`;
}
function daysUntil(v) { const d = toDate(v), t = toDate(dateISO()); return d && t ? Math.round((d - t) / 86400000) : null; }
function hoursSince(stamp) {
  const d = new Date(stamp);
  return Number.isNaN(d.getTime()) ? 0 : Math.max(0, (Date.now() - d.getTime()) / 3600000);
}
function addDays(base, days) { const d = new Date(base); d.setDate(d.getDate() + days); return d; }
function fmtMoney(v) { return MONEY.format(Number(v) || 0); }
function fmtMoneyShort(v) {
  const n = Number(v) || 0, abs = Math.abs(n);
  if (abs >= 1e6) return `$ ${NUM.format(n / 1e6)} M`;
  if (abs >= 1e3) return `$ ${NUM.format(Math.round(n / 1e3))} k`;
  return MONEY.format(n);
}
function fmtNum(v) { return NUM.format(Number(v) || 0); }
function fmtPct(v) { return `${Math.round(Number(v) || 0)}%`; }
function isEmail(v) { return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(String(v || "").trim()); }
function isPhone(v) { return String(v || "").replace(/[^\d]/g, "").length >= 7; }
function setPath(obj, path, value) {
  const parts = String(path).split(".");
  let t = obj;
  parts.slice(0, -1).forEach(k => { if (!t[k] || typeof t[k] !== "object") t[k] = {}; t = t[k]; });
  t[parts.at(-1)] = value;
}
function getPath(obj, path) { return String(path).split(".").reduce((v, k) => v?.[k], obj); }
function mergeDeep(target, source) {
  Object.entries(source || {}).forEach(([k, v]) => {
    if (v && typeof v === "object" && !Array.isArray(v) && target[k] && typeof target[k] === "object") mergeDeep(target[k], v);
    else target[k] = v;
  });
  return target;
}

function pushAssignHistory(a, action, detail) {
  a.history.push({ date: new Date().toISOString(), by: currentUser(), role: myCargo(), action, detail: String(detail || "") });
  if (a.history.length > 30) a.history.length = 30;

function makeProduct(raw = {}) {

function makeFinalPlan(raw) {
  if (!raw) return { version: 0 };

function makeProject(raw = {}) {

}
function nextProjectCode() {
  const year = new Date().getFullYear();
  const used = new Set((state.projects || []).map(p => String(p.code || "").toUpperCase()));
  let n = (state.projects || []).reduce((max, p) => {
    const m = /^PRY-(\d{4})-(\d+)$/i.exec(String(p.code || ""));
    return m && Number(m[1]) === year ? Math.max(max, Number(m[2])) : max;
  }, 0);
  let code;
  do { n += 1; code = `PRY-${year}-${String(n).padStart(3, "0")}`; } while (used.has(code));
  return code;
}
function duplicateCandidates(p) {
  return state.projects.filter(x =>
    x.id !== p.id && x.state !== "Cerrado" && norm(x.company) === norm(p.company) &&
    ((String(p.commercialRef || "").trim() && norm(x.commercialRef) === norm(p.commercialRef)) ||
     (norm(x.ppr) === norm(p.ppr) && norm(x.ppr) !== "")));
}
/** RN-18 · toda modificación conserva usuario, fecha, valor anterior, valor nuevo y motivo. */
function logEvent(p, { type = "Editado", entity = "", field = "", before = "", after = "", reason = "" }) {

  p.log.unshift({ id: uid("log"), date: new Date().toISOString(), user: currentUser(), userRole: myCargo(),
