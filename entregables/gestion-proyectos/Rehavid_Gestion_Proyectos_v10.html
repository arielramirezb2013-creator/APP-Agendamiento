/* --------------- 4. LÓGICA DERIVADA: ESTADO, CONDICIÓN Y CIERRE --------------- */

function isOpenProduct(pr) { return OPEN_STATES.includes(pr.status); }
function lastNovelty(pr, type) {
  return (pr.novelties || []).filter(n => !type || n.type === type)
    .sort((a, b) => String(b.date).localeCompare(String(a.date)))[0] || null;
}
function productProgress(pr) {
  if (["Completado", "Cerrado"].includes(pr.status)) return 100;
  const ms = pr.milestones || [];
  if (ms.length) {
    const w = sum(ms, m => Math.max(0, m.hoursAssigned));
    return w ? clamp(sum(ms, m => clamp(m.progress, 0, 100) * Math.max(0, m.hoursAssigned)) / w, 0, 100)
             : clamp(avg(ms, m => m.progress), 0, 100);
  }
  return clamp(pr.progress, 0, 100);
}
function usesMilestoneProgress(pr) { return (pr.milestones || []).length > 0 && !["Completado", "Cerrado"].includes(pr.status); }
function expectedProgress(pr) {
  const s = toDate(pr.startDate), e = toDate(pr.endDate), t = toDate(dateISO());
  if (!s || !e || !t || e <= s) return 0;
  return clamp((t - s) / (e - s) * 100, 0, 100);
}
function productHoursBalance(pr) { return (Number(pr.hoursSold) || 0) - (Number(pr.hoursExecuted) || 0); }
function productValue(pr) { return (Number(pr.hoursSold) || 0) * (Number(pr.hourRate) || 0); }
function projectValue(p) { return sum(p.products, productValue); }
function projectHoursSold(p) { return sum(p.products, x => x.hoursSold); }        // RN-06 · suma automática
function projectHoursExecuted(p) { return sum(p.products, x => x.hoursExecuted); }
function projectProgress(p) {
  const list = p.products || [];
  if (!list.length) return 0;
  const w = sum(list, x => Math.max(0, x.hoursSold));
  return w ? clamp(sum(list, x => productProgress(x) * Math.max(0, x.hoursSold)) / w, 0, 100)
           : clamp(avg(list, productProgress), 0, 100);
}
function projectGlobalState(p) {
  if (p.state === "Borrador") return "Borrador";
  const list = p.products || [];
  if (!list.length) return "Sin productos";
  if (list.every(x => x.status === "Cerrado")) return "Cerrado";
  return list.slice().sort((a, b) => STATE_RANK[a.status] - STATE_RANK[b.status])[0].status;
}
function planDrift(pr) {
  if (!pr.plannedEnd || !pr.endDate) return 0;
  const a = toDate(pr.plannedEnd), b = toDate(pr.endDate);
  return a && b ? Math.round((b - a) / 86400000) : 0;
}
function productAlerts(pr, p) {
  const sla = state.settings.sla, out = [];
  ALERT_DEFS.forEach(def => {
    let detail = false;
    try { detail = def.test(pr, p, sla); } catch (e) { console.error("Alerta", def.code, e); }
    if (detail) out.push({ code: def.code, label: def.label, sev: def.sev,
                           detail: typeof detail === "string" ? detail : def.desc,
                           projectId: p.id, productId: pr.id, productName: pr.name, role: pr.role, owner: pr.owner });
  });
  return out.sort((a, b) => SEV_RANK[a.sev] - SEV_RANK[b.sev]);
}
function projectAlerts(p) { return (p.products || []).flatMap(pr => productAlerts(pr, p)); }
function productCondition(pr, p) {
  if (!isOpenProduct(pr)) return "En tiempo";
  const codes = productAlerts(pr, p).map(a => a.code);
  if (codes.includes("overdue")) return "Retrasado";
  if (pr.status === "Suspendido") {
    const n = lastNovelty(pr, "Suspensión");
    const left = n && n.newDate ? daysUntil(n.newDate) : null;
    return left !== null && left < 0 ? "Retrasado" : "En riesgo";
  }
  return codes.length ? "En riesgo" : "En tiempo";
}
function projectCondition(p) {
  if (p.state === "Borrador") return "En tiempo";
  const list = (p.products || []).filter(isOpenProduct);
  if (!list.length) return "En tiempo";
  return list.map(pr => productCondition(pr, p)).sort((a, b) => CONDITION_RANK[a] - CONDITION_RANK[b])[0];
}
function nextCommitment(p) {
  const items = [];
  (p.products || []).filter(isOpenProduct).forEach(pr => {
    if (pr.nextAction?.date && pr.nextAction.description)
      items.push({ date: pr.nextAction.date, label: pr.nextAction.description, owner: pr.nextAction.owner || pr.owner, productId: pr.id });
    if (pr.endDate) items.push({ date: pr.endDate, label: `Cierre de ${pr.name}`, owner: pr.owner, productId: pr.id });
    (pr.milestones || []).filter(m => m.date && m.progress < 100)
      .forEach(m => items.push({ date: m.date, label: `${pr.name} · ${m.name}`, owner: m.owner || pr.owner, productId: pr.id }));
    const n = lastNovelty(pr, "Suspensión");
    if (pr.status === "Suspendido" && n?.newDate)
      items.push({ date: n.newDate, label: `Revisión de suspensión · ${pr.name}`, owner: n.owner || pr.owner, productId: pr.id });
  });
  return items.sort((a, b) => a.date.localeCompare(b.date))[0] || null;
}
function lastProjectUpdate(p) {
  return [p.updatedAt, ...(p.products || []).map(x => x.lastUpdateAt)].filter(Boolean).sort().at(-1) || p.updatedAt;
}

/* §12 · lógica de cierre: el líder declara completado, la aplicación valida y cierra. */
function validateClosure(pr, p) {
  const missing = [];
  if (!pr.realEndDate) missing.push("fecha real de finalización");
  if (!(Number(pr.hoursExecuted) > 0)) missing.push("horas ejecutadas");
  if (!String(pr.deliverable?.description || "").trim() && !String(pr.deliverable?.url || "").trim())
    missing.push("entregable o evidencia");
  // Ajuste de la validación de usuarios: TODO requisito debe quedar resuelto —recibido o
  // exceptuado con justificación—; «Definido», «Solicitado» o «No recibido» bloquean el cierre.
  const pend = (pr.requirements || []).filter(r => !["Recibido", "Exceptuado"].includes(r.status));
  if (pend.length) missing.push(`${pend.length} requisito(s) sin resolver (${pend.map(r => `${r.description}: ${r.status}`).slice(0, 2).join("; ")})`);
  // Y el cierre exige un plan de trabajo final aprobado (RN-13).
  if (p && !p.finalPlan?.version) missing.push("plan de trabajo final aprobado");
  return { ok: missing.length === 0, missing };
}
/** Cierra automáticamente los productos completados que superan la validación y, si todos
    quedan cerrados, cierra el proyecto maestro (RN-16, RN-17). Devuelve lo que ocurrió. */
function runAutoClosure(p) {
  const closed = [];
  (p.products || []).forEach(pr => {
    if (pr.status !== "Completado") return;
    const v = validateClosure(pr, p);
    if (!v.ok) return;
    pr.status = "Cerrado";
    pr.closedAt = new Date().toISOString();
    pr.progress = 100;
    closed.push(pr.name);
    logEvent(p, { type: "Cierre automático", entity: pr.name, field: "estado",
                  before: "Completado", after: "Cerrado",
                  reason: `Validación automática superada: fecha real ${formatDate(pr.realEndDate, true)}, ${fmtNum(pr.hoursExecuted)} h, entregable registrado.` });
  });
  let projectClosed = false;
  if (p.state === "Activo" && (p.products || []).length && p.products.every(x => x.status === "Cerrado")) {
    p.state = "Cerrado";
    p.closedAt = new Date().toISOString();
    projectClosed = true;
    logEvent(p, { type: "Cierre automático", entity: "Proyecto maestro", field: "estado",
                  before: "Activo", after: "Cerrado",
                  reason: `Todos los productos cerrados. ${fmtNum(projectHoursExecuted(p))} h ejecutadas de ${fmtNum(projectHoursSold(p))} vendidas.` });
  }
  return { closed, projectClosed };
}

/* ------------------- 5. CARGOS, PERSONAS Y PERMISOS (RN-02) ------------------- */

function peopleList() { return (state.settings.catalogs.people || []).map(x => x.name); }
function cargoOf(name) {
  const p = (state.settings.catalogs.people || []).find(x => norm(x.name) === norm(name));
  return p ? p.cargo : "";
}
function personForCargo(cargo) {
  const p = (state.settings.catalogs.people || []).find(x => norm(x.cargo) === norm(cargo));
  return p ? p.name : "";
}
function myCargo() { return cargoOf(currentUser()) || "Sin cargo"; }
function isAdmin() { return CARGOS_ADMIN.includes(myCargo()); }
function canSell() { return isAdmin() || CARGOS_VENTA.includes(myCargo()); }                 // RN-01
function isCoordinatorOf(p) { return isAdmin() || norm(p.coordinatorRole) === norm(myCargo()); }
function isLeaderOf(pr) { return norm(pr.role) === norm(myCargo()); }
/** RN-12 · el líder del producto ejecuta, registra novedades y actualiza el panel. */
function canUpdateProduct(p, pr) { return isAdmin() || isLeaderOf(pr); }
/** RN-10 · la asignación la acepta o la ajusta quien la recibe. */
function canAnswerAssignment(p, pr) { return isAdmin() || isLeaderOf(pr); }
/** RN-11 · el coordinador por tipo centraliza requisitos y contacto con el cliente. */
function canCoordinate(p) { return isCoordinatorOf(p); }
function canConfigure() { return isAdmin() || ["Director de Proyectos", "Jefe de Operaciones"].includes(myCargo()); }
function permissionFor(kind, p, pr) {
  const map = {
    update: () => [canUpdateProduct(p, pr), `Solo el cargo ${pr?.role || "responsable"} (${pr?.owner || "sin asignar"}) puede actualizar este producto.`],
    assign: () => [canAnswerAssignment(p, pr), `La asignación la responde el cargo ${pr?.role || "responsable"}.`],
    coordinate: () => [canCoordinate(p), `Esta acción corresponde a la coordinación del proyecto (${p?.coordinatorRole || "sin definir"}).`],
    sell: () => [canSell(), `Solo ${CARGOS_VENTA.join(", ")} pueden registrar ventas (RN-01).`],
    configure: () => [canConfigure(), "La parametrización corresponde a dirección o coordinación."]
  };
  const [ok, reason] = (map[kind] || (() => [true, ""]))();
  return { ok, reason: ok ? "" : reason };
}

/* --------------- 6. MOTOR DE ASIGNACIÓN Y NOTIFICACIONES (§8) --------------- */

function activeRules() {
  return (state.settings.assignmentRules || [])
    .map(r => ({ ...r, role: renameCargo(r.role) }))
    .filter(r => r.active !== false);
}
function resolveCoordinatorRole(p) {
  const r = activeRules().find(x => x.scope === "project" && norm(p[x.field]) === norm(x.value));
  return r ? r.role : "";
}
function resolveProductRole(p, pr) {
  const r = activeRules().find(x => x.scope === "product" && norm(pr[x.field]) === norm(x.value));
  return r ? r.role : resolveCoordinatorRole(p);
}
/** §8 · primero clasifica el tipo, después evalúa los productos; las reglas corren en paralelo (RN-08). */
function planAssignments(p) {
  const out = [];
  const coordRole = resolveCoordinatorRole(p);
  if (coordRole) out.push({ scope: "project", role: coordRole, person: personForCargo(coordRole),
                            productId: "", productName: "", reason: `Tipo de proyecto = ${p.type}` });
  (p.products || []).forEach(pr => {
    const rule = activeRules().find(x => x.scope === "product" && norm(pr[x.field]) === norm(x.value));
    const role = pr.role || (rule ? rule.role : coordRole);
    if (!role) return;
    out.push({ scope: "product", role, person: personForCargo(role), productId: pr.id, productName: pr.name,
               reason: rule ? `Producto = ${rule.value}` : `Tipo de proyecto = ${p.type}` });
  });
  return out;
}
function notificationBody(p, a) {
  const pr = (p.products || []).find(x => x.id === a.productId);
  const main = (p.contacts || []).filter(c => c.enabled !== false).find(c => c.primary);
  const lines = [
    `Proyecto: ${p.code} · ${p.company}`,
    `PPR: ${p.ppr} · Tipo: ${p.type} · Vendedor: ${p.seller || "sin registrar"} (${p.sellerRole || "sin cargo"})`,
    `Cargo asignado: ${a.role}${a.person ? ` · ${a.person}` : ""}`, ""
  ];
  if (pr) {
    lines.push(`Producto: ${pr.name}`,
               `Horas vendidas: ${fmtNum(pr.hoursSold)} h · Categoría: ${pr.routing}`,
               `Fecha solicitada: ${pr.assignment.requestedDate ? formatDate(pr.assignment.requestedDate) : "por acordar"}`);
    if (pr.technology) lines.push(`Tecnología: ${pr.technology}`);
    if (pr.complexity) lines.push(`Complejidad: ${pr.complexity}`);
  } else {
    lines.push(`Coordinación del proyecto · ${(p.products || []).length} producto(s) · ${fmtNum(projectHoursSold(p))} h vendidas`);
  }
  lines.push("", `Plan estimado de la venta: ${p.estimatedPlan || "sin registrar"}`,
             `Observaciones de la reunión de venta: ${p.saleNotes || "sin registrar"}`, "", "Contactos del cliente:");
  (p.contacts || []).filter(c => c.enabled !== false).forEach(c =>
    lines.push(`  · ${c.name} (${c.role || "sin cargo"}) — ${c.email || "sin correo"} — ${c.phone || "sin teléfono"}${c.primary ? "  [PRINCIPAL]" : ""}`));
  if (!(p.contacts || []).length) lines.push("  · sin contactos registrados");
  lines.push("", "Acción requerida: aceptar la asignación o proponer un ajuste de fecha y capacidad con justificación.",
             `Enlace directo: abrir la aplicación → Mis asignaciones → ${p.code}${pr ? ` → ${pr.name}` : ""}`, "",
             `Contacto principal: ${main ? `${main.name} · ${main.email || "sin correo"} · ${main.phone || "sin teléfono"}` : "sin definir"}`);
  return lines.join("\n");
}
function queueNotification(p, a) {
  const pr = (p.products || []).find(x => x.id === a.productId);
  state.outbox.unshift({
    id: uid("ntf"), date: new Date().toISOString(),
    role: a.role, to: a.person || a.role, scope: a.scope,
    projectId: p.id, projectCode: p.code, company: p.company,
    productId: a.productId, productName: a.productName, reason: a.reason,
    subject: `[${p.code}] ${pr ? `Producto asignado: ${pr.name}` : `Coordinación ${p.type}`} · ${p.company}`,
    body: notificationBody(p, a), status: "Pendiente de envío"
  });
  if (state.outbox.length > 500) state.outbox.length = 500;
}
/** §5 y §8 · activa el proyecto, asigna por cargo y genera una tarea por rol y producto. */
function runAssignmentEngine(p) {
  const stamp = new Date().toISOString();
  const coordRole = resolveCoordinatorRole(p);
  if (coordRole) {
    p.coordinatorRole = coordRole;
    p.coordinator = personForCargo(coordRole);
  }
  // Asignación de coordinación con ciclo propio (ajuste de la validación de usuarios).
  const reqDates = (p.products || []).map(x => x.assignment.requestedDate).filter(Boolean).sort();
  p.coordination = makeAssignment({ status: "Pendiente de aceptación", assignedAt: stamp,
                                    requestedDate: reqDates.at(-1) || "" });
  const plan = planAssignments(p);
  plan.forEach(a => {
    if (a.scope === "product") {
      const pr = p.products.find(x => x.id === a.productId);
      if (!pr) return;
      pr.role = a.role;
      pr.owner = a.person || pr.owner;
      pr.assignment = makeAssignment({ ...pr.assignment, status: "Pendiente de aceptación",
                                       assignedAt: stamp, requestedDate: pr.assignment.requestedDate || pr.plannedEnd });
      pr.lastUpdateAt = pr.lastUpdateAt || stamp;
      logEvent(p, { type: "Asignado", entity: pr.name, field: "cargo responsable", after: a.role, reason: a.reason });
    } else {
      logEvent(p, { type: "Asignado", entity: "Coordinación", field: "cargo responsable", after: a.role, reason: a.reason });
    }
    queueNotification(p, a);
  });
  return plan;
}

/* ------------------- 7. PERSISTENCIA, CATÁLOGOS Y DEMOSTRACIÓN ------------------- */

function catalogNames(key) { return (state.settings.catalogs[key] || []).map(x => (typeof x === "string" ? x : x.name)).filter(Boolean); }
function catalogFind(key, name) {
  return (state.settings.catalogs[key] || []).find(x => norm(typeof x === "string" ? x : x.name) === norm(name)) || null;
}
function normalizeCatalogs(c) {
  const objs = (list, extra = {}) => (list || []).map(x =>
    typeof x === "string" ? { name: x, ...extra } : { ...extra, ...x, name: String(x.name || "").trim() }).filter(x => x.name);
  c.companies = objs(c.companies, { nit: "", notes: "" });
  c.pprs = objs(c.pprs, { notes: "" });
  c.products = objs(c.products, { hours: 0, rate: 0, routing: "Otro" })
    .map(x => ({ ...x, hours: Number(x.hours) || 0, rate: Number(x.rate) || 0,
                 routing: ROUTINGS.includes(x.routing) ? x.routing : "Otro" }));
  c.people = objs(c.people, { cargo: "Analista de Datos" })
    .map(x => ({ ...x, cargo: (c => CARGOS.includes(c) ? c : "Analista de Proyectos")(renameCargo(x.cargo || x.role)) }));
  c.serviceOrders = objs(c.serviceOrders, { company: "", date: "", notes: "" });
  c.technologies = unique((c.technologies || []).map(x => (typeof x === "string" ? x : x.name)));
  c.deliverables = unique((c.deliverables || []).map(x => (typeof x === "string" ? x : x.name)));
  return c;
}
function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); }
  catch (e) { console.error(e); toast("Almacenamiento no disponible", "Los cambios no se conservarán al cerrar.", "error"); }
  if (raw) {
    try {
      const saved = JSON.parse(raw);
      state.projects = Array.isArray(saved.projects) ? saved.projects.map(makeProject) : [];
      state.outbox = Array.isArray(saved.outbox) ? saved.outbox : [];
      state.settings = mergeDeep(clone(DEFAULT_SETTINGS), saved.settings || {});
      if (saved.session?.user) state.session.user = saved.session.user;
      syncCatalogs();
      return;
    } catch (e) { console.error(e); toast("No se pudieron leer los datos", "Se cargó una base demostrativa.", "warning"); }
  }
  for (const key of LEGACY_KEYS) {
    try {
      const legacy = localStorage.getItem(key);
      if (!legacy) continue;
      const data = JSON.parse(legacy);
      if (!Array.isArray(data.projects) || !data.projects.length) continue;
      state.projects = data.projects.map(x => migrateLegacy(x, key)).filter(Boolean);
      syncCatalogs();
      saveState(true);
      toast("Base anterior migrada", `${state.projects.length} proyecto(s) convertidos al modelo 1.1.`);
      return;
    } catch (e) { console.error(e); }
  }
  state.projects = demoProjects();
  syncCatalogs();
  saveState(true);
}
function saveState(silent = false) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      version: APP_VERSION, savedAt: new Date().toISOString(),
      projects: state.projects, outbox: state.outbox, settings: state.settings, session: state.session
    }));
    const el = document.getElementById("saveState");
    if (el) el.textContent = `guardado ${new Date().toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" })}`;
  } catch (e) {
    console.error(e);
    if (!silent) toast("No fue posible guardar", "Descargue un respaldo antes de cerrar el navegador.", "error");
  }
}
function syncCatalogs() {
  const c = normalizeCatalogs(state.settings.catalogs || (state.settings.catalogs = clone(DEFAULT_SETTINGS.catalogs)));
  const add = (key, names, extra = {}) => {
    names.filter(Boolean).forEach(n => { if (!catalogFind(key, n)) c[key].push({ name: String(n).trim(), ...extra }); });
    c[key].sort((a, b) => a.name.localeCompare(b.name, "es"));
  };
  add("companies", state.projects.map(p => p.company), { nit: "", notes: "" });
  add("pprs", state.projects.map(p => p.ppr), { notes: "" });
  add("products", state.projects.flatMap(p => (p.products || []).map(x => x.name)), { hours: 0, rate: 0, routing: "Otro" });
  add("people", state.projects.flatMap(p => [p.seller, p.coordinator, ...(p.products || []).map(x => x.owner)]),
      { cargo: "Analista de Proyectos" });
  state.projects.filter(p => p.commercialRef).forEach(p => {
    if (!catalogFind("serviceOrders", p.commercialRef))
      c.serviceOrders.push({ name: p.commercialRef, company: p.company, date: p.saleDate, notes: "" });
  });
  if (!peopleList().includes(state.session.user)) state.session.user = peopleList()[0] || "Usuario";
}

/** Convierte bases anteriores (v5 con nombres propios, o v4 con actividades) al modelo 1.1. */
function migrateLegacy(old = {}, key = "") {
  const cargoFromName = n => ({ "Kelly Segura": "Jefe de Operaciones", "Jhon Orrego": "Director de Proyectos",
                                "Gestor de datos": "Gestor de Datos", "Diseñador": "Diseñador" })[n] || "";
  const stateMap = { "Pendiente de contacto": "Pendiente de información", "Programado": "Programado",
                     "En ejecución": "En ejecución", "Suspendido": "Suspendido",
                     "Finalizado": "Completado", "Cerrado": "Cerrado" };
  const isV5 = Array.isArray(old.products);
  const products = (isV5 ? old.products : []).map(pr => makeProduct({
    ...pr,
    routing: ROUTINGS.includes(pr.routing) ? pr.routing : (/bi|tablero/i.test(pr.name) ? "Tablero BI"
             : /dise/i.test(pr.name) ? "Diseño" : /medici/i.test(pr.name) ? "Medición objetiva" : "Otro"),
    role: cargoFromName(pr.owner) || "",
    status: stateMap[pr.status] || "Pendiente de información",
    plannedStart: pr.plannedStart || pr.startDate, plannedEnd: pr.plannedEnd || pr.endDate,
    assignment: { status: pr.acceptedAt ? "Aceptada" : "Pendiente de aceptación",
                  assignedAt: pr.assignedAt, acceptedAt: pr.acceptedAt, acceptedBy: pr.acceptedBy,
                  requestedDate: pr.endDate },
    realEndDate: pr.finishedAt || ""
  }));
  const p = makeProject({
    ...old, products,
    sellerRole: CARGOS_VENTA.includes(cargoFromName(old.seller)) ? cargoFromName(old.seller) : "Director de Proyectos",
    saleNotes: old.saleNotes || old.notes || "Migrado desde una versión anterior; complete las observaciones de la venta.",
    coordinatorRole: cargoFromName(old.coordinator) || "",
    contacts: (old.contacts || []).map(c => makeContact({ ...c, enabled: true })),
    state: old.state === "Cerrado" ? "Cerrado" : old.state === "Borrador" ? "Borrador" : "Activo"
  });
  p.products.forEach(pr => { if (!pr.role) pr.role = resolveProductRole(p, pr); if (!pr.owner) pr.owner = personForCargo(pr.role); });
  if (!p.coordinatorRole) p.coordinatorRole = resolveCoordinatorRole(p);
  p.coordinator = personForCargo(p.coordinatorRole) || p.coordinator;
  logEvent(p, { type: "Importado", entity: "Proyecto", field: "modelo de datos",
                before: key, after: `v7 · ${p.products.length} producto(s)`,
                reason: "Migración automática: responsables convertidos a cargos y estados al modelo 1.1." });
  return p;
}

/* ------------------------------ 8. FILTROS ------------------------------ */

const FILTER_DEFS = [
  { key: "type",         label: "Tipo de proyecto",  get: p => [p.type] },
  { key: "company",      label: "Empresa",           get: p => [p.company] },
  { key: "ppr",          label: "PPR",               get: p => [p.ppr] },
  { key: "projectState", label: "Estado del proyecto", get: p => [p.state] },
  { key: "globalState",  label: "Estado operativo",  get: p => [projectGlobalState(p)] },
  { key: "productStatus", label: "Estado del producto", get: p => (p.products || []).map(x => x.status) },
  { key: "coordinatorRole", label: "Coordinación",   get: p => [p.coordinatorRole] },
  { key: "role",         label: "Cargo responsable", get: p => (p.products || []).map(x => x.role) },
  { key: "routing",      label: "Categoría",         get: p => (p.products || []).map(x => x.routing) },
  { key: "condition",    label: "Condición",         get: p => (p.products || []).map(x => productCondition(x, p)) },
  { key: "alert",        label: "Alerta",            get: p => unique(projectAlerts(p).map(a => a.code)),
    optionLabel: v => ALERT_BY_CODE[v]?.label || v }
];
const VIEW_FILTERS = {
  dashboard:   ["type", "company", "ppr", "projectState", "productStatus"],
  companies:   ["company", "type", "ppr", "role", "condition", "routing"],
  alerts:      ["company", "type", "role", "alert", "condition"],
  assignments: ["company", "type", "condition"],
  plans:       ["company", "type", "coordinatorRole"],
  calendar:    ["company", "type", "role"]
};
const SPECIAL_FILTERS = {
  active:        { label: "Proyectos activos",  test: p => p.state === "Activo" },
  draft:         { label: "Borradores",         test: p => p.state === "Borrador" },
  pending_assign:{ label: "Asignaciones sin resolver",
                   test: p => (p.products || []).some(x => isOpenProduct(x) && x.assignment.status !== "Aceptada") },
  no_plan:       { label: "Sin plan de trabajo final", test: p => p.state === "Activo" && !p.finalPlan?.version },
  running:       { label: "Productos en ejecución", test: p => (p.products || []).some(x => x.status === "En ejecución") },
  at_risk:       { label: "En riesgo o retrasados",
                   test: p => ["En riesgo", "Retrasado"].includes(projectCondition(p)) && p.state === "Activo" },
  suspended:     { label: "Suspendidos",        test: p => (p.products || []).some(x => x.status === "Suspendido") },
  with_alerts:   { label: "Con alertas abiertas", test: p => projectAlerts(p).length > 0 },
  mine:          { label: "A mi cargo",
                   test: p => (p.products || []).some(x => isLeaderOf(x)) || norm(p.coordinatorRole) === norm(myCargo()) }
};
function filterOptions(key) {
  const def = FILTER_DEFS.find(d => d.key === key);
  return def ? unique(state.projects.flatMap(def.get)) : [];
}
function matchesFilters(p, omitir) {
  for (const def of FILTER_DEFS) {
    if (omitir && def.key === omitir) continue;
    const sel = state.filters[def.key];
    if (!sel || !sel.length) continue;
    const values = def.get(p).map(String);
    if (!sel.some(v => values.includes(String(v)))) return false;
  }
  for (const key of state.filters.special) {
    const sf = SPECIAL_FILTERS[key];
    if (sf && !sf.test(p)) return false;
  }
  if (state.search) {
    const hay = norm([
      p.code, p.company, p.ppr, p.type, p.seller, p.sellerRole, p.commercialRef, p.coordinator, p.coordinatorRole,
      p.estimatedPlan, p.saleNotes, p.notes,
      ...(p.contacts || []).flatMap(c => [c.name, c.role, c.email, c.phone]),
      ...(p.products || []).flatMap(x => [x.name, x.role, x.owner, x.routing, x.technology, x.complexity, x.notes,
                                          x.deliverable?.description, x.nextAction?.description,
                                          ...(x.milestones || []).map(m => m.name),
                                          ...(x.requirements || []).map(r => r.description),
                                          ...(x.novelties || []).map(n => n.cause)])
    ].join(" "));
    if (!hay.includes(norm(state.search))) return false;
  }
  return true;
}
/* Proyectos que pasan todos los filtros menos uno. Sirve para que un gráfico no se
   borre a sí mismo: al acotar por "Tipo 1" el anillo de tipos sigue mostrando los
   demás tipos atenuados, para poder comparar y cambiar de selección. */
function projectsExcept(key) { return state.projects.filter(p => matchesFilters(p, key)); }
/* Los filtros de nivel producto (condición, cargo, categoría, estado del producto y
   alerta) dejan pasar el proyecto entero. Esto dice si un producto concreto los cumple,
   para atenuar —no esconder— los que no, y que se vea el efecto del filtro. */
const PRODUCT_FILTERS = {
  condition:     (pr, p) => [productCondition(pr, p)],
  role:          pr => [pr.role],
  routing:       pr => [pr.routing],
  productStatus: pr => [pr.status],
  alert:         (pr, p) => productAlerts(pr, p).map(a => a.code)
};
function productMatchesFilters(pr, p) {
  for (const [key, get] of Object.entries(PRODUCT_FILTERS)) {
    const sel = state.filters[key];
    if (!sel || !sel.length) continue;
    const vals = get(pr, p).filter(Boolean).map(String);
    if (!sel.some(v => vals.includes(String(v)))) return false;
  }
  return true;
}
function visibleProjects() {
  const list = state.projects.filter(matchesFilters);
  return list.slice().sort((a, b) => {
    if (state.sort === "company") return a.company.localeCompare(b.company, "es") || a.code.localeCompare(b.code, "es");
    if (state.sort === "due") return (nextCommitment(a)?.date || "9999").localeCompare(nextCommitment(b)?.date || "9999");
    if (state.sort === "value") return projectValue(b) - projectValue(a);
    if (state.sort === "updated") return String(lastProjectUpdate(b)).localeCompare(String(lastProjectUpdate(a)));
    const ca = CONDITION_RANK[projectCondition(a)], cb = CONDITION_RANK[projectCondition(b)];
    if (ca !== cb) return ca - cb;
    return projectAlerts(b).length - projectAlerts(a).length;
  });
}
function toggleFilter(key, value) {
  if (!value) return;
  const list = state.filters[key];
  if (!list) return;
  const i = list.indexOf(value);
  if (i >= 0) list.splice(i, 1); else list.push(value);
  renderApp();
}
function setSingleFilter(key, value) { state.filters[key] = value ? [value] : []; renderApp(); }
/* Acota por varias claves a la vez —empresa y condición, por ejemplo— reemplazando
   lo que hubiera. Si ya está puesto exactamente eso, el segundo clic lo deshace. */
/* Ctrl+clic (o Cmd) suma valores en vez de reemplazar: así se comparan dos empresas
   o dos condiciones a la vez. Un solo repintado al final. */
function multiToggle(pairs) {
  let cambio = false;
  pairs.forEach(([k, v]) => {
    const list = state.filters[k];
    if (!list || !v) return;
    const i = list.indexOf(String(v));
    if (i >= 0) list.splice(i, 1); else list.push(String(v));
    cambio = true;
  });
  if (cambio) renderApp();
}
function drillFilter(pairs) {
  const valid = pairs.filter(([k, v]) => state.filters[k] && v);
  if (!valid.length) return;
  const same = valid.every(([k, v]) => (state.filters[k] || []).length === 1 && state.filters[k][0] === String(v));
  valid.forEach(([k, v]) => { state.filters[k] = same ? [] : [String(v)]; });
  renderApp();
}
function clearFilters() {
  Object.keys(state.filters).forEach(k => state.filters[k] = []);
  state.search = "";
  const s = document.getElementById("globalSearch");
  if (s) s.value = "";
  renderApp();
}
function activeFilterCount() { return Object.values(state.filters).reduce((n, x) => n + x.length, 0) + (state.search ? 1 : 0); }
function filterLabel(key, value) {
  const def = FILTER_DEFS.find(d => d.key === key);
  if (def?.optionLabel) return def.optionLabel(value);
  if (key === "special") return SPECIAL_FILTERS[value]?.label || value;
  return value;
}
/** Empresa única seleccionada: activa la vista de ficha de empresa (ajuste 2.2). */
function selectedCompany() {
  return state.filters.company.length === 1 ? state.filters.company[0] : "";
}

/* Ordena cualquier tabla por la columna del encabezado pulsado. Reordena las filas
   en el sitio, sin volver a pintar la vista, para no perder el desplazamiento. */
function sortTable(th) {
  const tabla = th.closest("table"), cuerpo = tabla && tabla.tBodies[0];
  if (!cuerpo || cuerpo.rows.length < 2) return;
  const fila = th.parentNode, i = [...fila.children].indexOf(th);
  const dir = th.dataset.dir === "asc" ? "desc" : "asc";
  [...fila.children].forEach(x => { delete x.dataset.dir; x.classList.remove("s-asc", "s-desc"); });
  th.dataset.dir = dir;
  th.classList.add(dir === "asc" ? "s-asc" : "s-desc");
  const valor = tr => {
    const c = tr.children[i];
    if (!c) return "";
    const txt = c.textContent.trim();
    const num = Number(txt.replace(/[^\d,.-]/g, "").replace(/\./g, "").replace(",", "."));
    const esNum = /\d/.test(txt) && isFinite(num) && (c.classList.contains("nm") || c.classList.contains("rt") || /^[\s$+-]*[\d.,]+\s*\w{0,3}$/.test(txt));
    return esNum ? num : norm(txt);
  };
  const filas = [...cuerpo.rows];
  filas.sort((a, b) => {
    const x = valor(a), y = valor(b);
    const r = typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y), "es");
    return dir === "asc" ? r : -r;
  });
  filas.forEach(f => cuerpo.appendChild(f));
}

/* --------------------------- animación de entrada ---------------------------
   Los anillos crecen, las barras se extienden y las cifras cuentan. Nada de esto
   ocurre si el sistema pide movimiento reducido.                              */

function prefersStill() {
  return Boolean(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
}
function animateCharts() {
  const root = document.getElementById("viewRoot");
  if (!root) return;
  const bars = root.querySelectorAll("[data-w]");
  const nums = root.querySelectorAll("[data-count]");
  const pintar = () => { bars.forEach(b => { b.style.width = b.dataset.w; }); };
  if (prefersStill()) { pintar(); nums.forEach(n => { n.textContent = n.dataset.count; }); return; }
  requestAnimationFrame(() => requestAnimationFrame(pintar));
  nums.forEach(countUp);
}
function countUp(el) {
  const raw = String(el.dataset.count);
  const target = Number(raw.replace(/[^\d.-]/g, ""));
  if (!isFinite(target) || Math.abs(target) < 2) { el.textContent = raw; return; }
  const sufijo = raw.replace(/^[\d.,\s-]+/, "");
  const t0 = performance.now(), dur = 500;
  const paso = ahora => {
    const k = Math.min(1, (ahora - t0) / dur);
    el.textContent = Math.round(target * (1 - Math.pow(1 - k, 3))) + sufijo;
    if (k < 1) requestAnimationFrame(paso); else el.textContent = raw;
  };
  requestAnimationFrame(paso);
}

/* Todo elemento de un gráfico es accionable: `selOf` dice qué está filtrado hoy para
   poder resaltar lo elegido y atenuar el resto (realce cruzado). */
function selOf(key) { return key ? (state.filters[key] || []).map(String) : []; }
function markOf(sel, value) { return !sel.length ? "" : sel.includes(String(value)) ? " on" : " dim"; }
/* Atributos que hacen filtrar a un elemento. Con `pair` aplica dos claves a la vez
   (por ejemplo empresa + condición) reemplazando en vez de alternar: es un drill. */
function filterAttrs(key, value, pair) {
  if (!key) return "";
  let a = `data-filter-key="${esc(key)}" data-filter-value="${esc(value)}"`;
  if (pair && pair[0]) a += ` data-filter-key2="${esc(pair[0])}" data-filter-value2="${esc(pair[1])}" data-drill="1"`;
  return a;
}

function donut(slices, centerValue, centerLabel, filterKey) {
  const total = slices.reduce((n, s) => n + s.value, 0);
  const R = 52, C = 2 * Math.PI * R;
  const sel = selOf(filterKey);
  let off = 0;
  const arcs = total ? slices.filter(s => s.value > 0).map(s => {
    const len = C * s.value / total;
    const pct = fmtPct(s.value / total * 100);
    const el = `<circle class="arc${markOf(sel, s.label)}" cx="66" cy="66" r="${R}" fill="none" stroke="${s.color}" stroke-width="20"
      stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"
      ${filterKey ? `${filterAttrs(filterKey, s.label)} role="button" tabindex="0" aria-label="Filtrar por ${esc(s.label)}"` : ""}
      ><title>${esc(s.label)}: ${esc(s.display ?? s.value)} · ${pct}${filterKey ? " · clic para acotar, Ctrl+clic para sumar" : ""}</title></circle>`;
    off += len;
    return el;
  }).join("") : `<circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--line-2)" stroke-width="20"></circle>`;
  return `<div class="donut"><svg width="132" height="132" viewBox="0 0 132 132" ${filterKey ? `role="group" aria-label="${esc(centerLabel)}"` : 'aria-hidden="true"'}>
      <circle cx="66" cy="66" r="${R}" fill="none" stroke="var(--line-2)" stroke-width="20"></circle>${arcs}
    </svg><div class="mid"><b data-count="${esc(centerValue)}">${esc(centerValue)}</b><span>${esc(centerLabel)}</span></div></div>`;
}
function legend(items, filterKey) {
  const total = items.reduce((n, s) => n + s.value, 0) || 1;
  const sel = selOf(filterKey);
  return `<div class="legend">${items.map(s => `
    <button class="leg${markOf(sel, s.label)}" ${filterAttrs(filterKey, s.label)}
      ${filterKey ? `title="Clic para acotar por ${esc(s.label)} · Ctrl+clic para sumar"` : ""}>
      <i style="background:${s.color}"></i>
      <span class="lgn">${esc(s.label)}</span>
      <span class="vl">${esc(s.display ?? s.value)}</span>
      <span class="pc">${fmtPct(s.value / total * 100)}</span>
    </button>`).join("")}</div>`;
}
function hbars(rows, filterKey) {
  const max = Math.max(1, ...rows.map(r => r.total));
  const sel = selOf(filterKey);
  const condSel = selOf("condition");
  return `<div class="hbars">${rows.map(r => `<div class="hbar${markOf(sel, r.label)}">
      <button class="lb" ${filterAttrs(filterKey, r.label)} title="${esc(r.label)} · clic para acotar · Ctrl+clic para sumar">${esc(r.label)}</button>
      <div class="tr" style="width:${Math.max(6, r.total / max * 100)}%" ${filterAttrs(filterKey, r.label)}
        title="${esc(r.label)}: ${r.total} producto(s)">
        ${r.parts.filter(x => x.value > 0).map(x => {
          const w = x.value / (r.total || 1) * 100;
          const drill = x.fk ? [x.fk, x.fv] : null;
          const dim = condSel.length && x.fk && !condSel.includes(String(x.fv)) ? " dim" : "";
          return `<i class="seg${dim}" style="width:0;background:${x.color}" data-w="${w.toFixed(2)}%"
            ${filterAttrs(filterKey, r.label, drill)} role="button" tabindex="0"
            aria-label="${esc(r.label)}, ${esc(x.label)}: ${x.value}"
            title="${esc(r.label)} · ${esc(x.label)}: ${x.value} · clic para ver solo esto"></i>`;
        }).join("")}
      </div>
      <button class="vv" ${filterAttrs(filterKey, r.label)} title="${esc(r.label)} · clic para acotar">${esc(r.display)}</button>
    </div>`).join("")}
    <div class="mini-legend">
      ${["En tiempo", "En riesgo", "Retrasado"].map(c => `<button class="mleg${markOf(condSel, c)}" ${filterAttrs("condition", c)}
        title="Clic para acotar por ${esc(c)} · Ctrl+clic para sumar"><i style="background:${COND_COLOR[c]}"></i>${c}</button>`).join("")}

}

function renderDashboard(projects) {
  const rows = projects.flatMap(p => (p.products || []).map(pr => ({ pr, p })));
  const open = rows.filter(({ pr }) => isOpenProduct(pr));
  const sold = sum(projects, projectHoursSold), used = sum(projects, projectHoursExecuted);
  const late = open.filter(({ pr, p }) => productCondition(pr, p) === "Retrasado").length;
  const risk = open.filter(({ pr, p }) => productCondition(pr, p) === "En riesgo").length;
  const onT = open.filter(({ pr, p }) => productCondition(pr, p) === "En tiempo").length;
  const pendAssign = rows.filter(({ pr }) => isOpenProduct(pr) && pr.assignment.status !== "Aceptada").length;

  const condParts = list => {
    const o = list.filter(({ pr, p }) => isOpenProduct(pr) && productCondition(pr, p) === "En tiempo").length;
    const w = list.filter(({ pr, p }) => isOpenProduct(pr) && productCondition(pr, p) === "En riesgo").length;
    const b = list.filter(({ pr, p }) => isOpenProduct(pr) && productCondition(pr, p) === "Retrasado").length;
    const g = list.filter(({ pr }) => !isOpenProduct(pr)).length;
    return [{ label: "En tiempo", value: o, color: COND_COLOR["En tiempo"], fk: "condition", fv: "En tiempo" },
            { label: "En riesgo", value: w, color: COND_COLOR["En riesgo"], fk: "condition", fv: "En riesgo" },
            { label: "Retrasado", value: b, color: COND_COLOR["Retrasado"], fk: "condition", fv: "Retrasado" },
            { label: "Cerrado o completado", value: g, color: "var(--faint)" }];
  };

  /* Cada gráfico se calcula con todos los filtros MENOS el suyo. Así, al acotar por
     "Tipo 1", el anillo de tipos sigue mostrando los demás tipos —atenuados— y se
     puede comparar o cambiar de selección sin tener que limpiar antes. */
  const baseType    = projectsExcept("type");
  const baseCompany = projectsExcept("company");
  const basePpr     = projectsExcept("ppr");
  const baseStatus  = projectsExcept("productStatus");
  const centro = (key, propio, total) =>
    (state.filters[key] || []).length ? { v: String(propio), l: `de ${total}` } : { v: String(total), l: "" };

  // Por tipo de proyecto (va primero, ajuste 2.1)
  const byType = PROJECT_TYPES.map((t, i) => {
    const list = baseType.filter(p => p.type === t);
    return { label: t, value: list.length, color: PALETTE[i],
             display: `${list.length}`, hours: sum(list, projectHoursSold), value$: sum(list, projectValue),
             prods: list.flatMap(p => (p.products || []).length) .reduce((a, b) => a + b, 0) };
  }).filter(x => x.value > 0);
  const cTipo = centro("type", projects.length, baseType.length);

  // Por empresa
  const byCompany = [...groupBy(baseCompany, p => p.company || "Sin empresa").entries()].map(([label, list]) => {
    const prods = list.flatMap(p => (p.products || []).map(pr => ({ pr, p })));
    return { label, total: prods.length, parts: condParts(prods),
             display: `${prods.length} prod · ${fmtMoneyShort(sum(list, projectValue))}` };
  }).sort((a, b) => b.total - a.total);

  // Por PPR
  const byPpr = [...groupBy(basePpr, p => p.ppr || "Sin PPR").entries()].map(([label, list]) => {
    const prods = list.flatMap(p => (p.products || []).map(pr => ({ pr, p })));
    return { label, total: prods.length, parts: condParts(prods),
             display: `${list.length} proy · ${fmtNum(sum(list, projectHoursSold))} h` };
  }).sort((a, b) => b.total - a.total);

  // Por estado operativo (cuenta productos, por eso filtra por estado del producto)
  const rowsStatus = baseStatus.flatMap(p => (p.products || []).map(pr => ({ pr, p })));
  const byState = PRODUCT_STATES.map((s, i) => ({
    label: s, value: rowsStatus.filter(({ pr }) => pr.status === s).length, color: PALETTE[i]
  })).filter(x => x.value > 0);
  const cEstado = centro("productStatus", rows.length, rowsStatus.length);

  return `
  <section class="stats">
    ${stat("a", "briefcase", "Proyectos activos", projects.filter(p => p.state === "Activo").length,
           `<button class="sublk" data-special="draft">${projects.filter(p => p.state === "Borrador").length} en borrador</button>`, "active")}
    ${stat("i", "package", "Productos vendidos", rows.length,
           `<button class="sublk" data-special="running">${open.length} abiertos</button>`, "")}
    ${stat("w", "clock", "Asignaciones sin resolver", pendAssign, "pendientes o en ajuste", "pending_assign")}
    ${stat("b", "alert", "Productos retrasados", late,
           `<button class="sublk" ${filterAttrs("condition", "En riesgo")}>${risk} en riesgo</button>`, "at_risk")}
  </section>

  <section class="card">
    <div class="card-h"><div><h2>${ico("layers", 14)}Por tipo de proyecto</h2><p>Clasificación que gobierna la coordinación asignada</p></div></div>
    <div class="card-b">
      <div class="donut-wrap">
        ${donut(byType, cTipo.v, cTipo.l || "proyectos", "type")}
        <div style="flex:1;min-width:260px">
          ${legend(byType.map(t => ({ ...t, display: `${t.value} proy.` })), "type")}
          <div class="tw" style="margin-top:14px"><table class="t">
            <thead><tr><th>Tipo</th><th>Coordinación</th><th class="rt">Proyectos</th><th class="rt">Productos</th><th class="rt">Horas</th><th class="rt">Valor</th></tr></thead>
            <tbody>${PROJECT_TYPES.map(t => {
              const list = baseType.filter(p => p.type === t);
              const role = (state.settings.assignmentRules.find(r => r.scope === "project" && r.value === t) || {}).role || "—";
              return `<tr><td>${fv("type", t, t)}</td><td class="sm muted">${esc(role)}</td>
                <td class="nm">${list.length}</td><td class="nm">${sum(list, p => (p.products || []).length)}</td>
                <td class="nm">${fmtNum(sum(list, projectHoursSold))}</td><td class="nm">${fmtMoneyShort(sum(list, projectValue))}</td></tr>`;
            }).join("")}</tbody>
          </table></div>
        </div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-h"><div><h2>${ico("building", 14)}Por empresa</h2><p>Productos de cada empresa y su condición de gestión</p></div>
      <div class="sp"><span class="note">Clic en el nombre para abrir su ficha · clic en un tramo de la barra para acotar por condición</span></div></div>
    <div class="card-b">${byCompany.length ? hbars(byCompany, "company") : `<p class="note">Sin datos.</p>`}</div>
  </section>

  <div class="chart-row-2">
    <section class="card">
      <div class="card-h"><div><h2>${ico("trend", 14)}Por PPR</h2><p>Distribución de la venta por programa interno</p></div></div>
      <div class="card-b">${byPpr.length ? hbars(byPpr, "ppr") : `<p class="note">Sin datos.</p>`}</div>
    </section>
    <section class="card">
      <div class="card-h"><div><h2>${ico("clock", 14)}Por estado operativo</h2><p>Momento del proceso en que está cada producto</p></div></div>
      <div class="card-b"><div class="donut-wrap">
        ${donut(byState, cEstado.v, cEstado.l || "productos", "productStatus")}
        <div style="flex:1;min-width:190px">${legend(byState, "productStatus")}
          <div class="note" style="margin-top:12px">Horas vendidas <b>${fmtNum(sold)}</b> · ejecutadas <b>${fmtNum(used)}</b> · saldo <b>${fmtNum(sold - used)}</b></div>
        </div>
      </div></div>
    </section>
  </div>`;
}
function stat(k, icon, label, value, sub, special) {
  const on = special && state.filters.special.includes(special);
  const subHtml = String(sub).trimStart().startsWith("<") ? sub : esc(sub);
  return `<div class="stat" ${special ? `data-special="${esc(special)}" role="button" tabindex="0"` : ""} aria-pressed="${Boolean(on)}"
    ${special ? `title="Clic para ver solo: ${esc(SPECIAL_FILTERS[special]?.label || label)}"` : ""}>
    <span class="ico ${k}">${ico(icon, 13)}${esc(label)}</span>
    <span class="tx"><span>${esc(label)}</span><strong data-count="${esc(value)}">${value}</strong><small>${subHtml}</small></span></div>`;
}

function productActions(p, pr) {
  const d = `data-project="${esc(p.id)}" data-product="${esc(pr.id)}"`;
  const b = (kind, label, cls, permKind, extraAttr = "") => {
    const perm = permissionFor(permKind, p, pr);
    return `<button class="btn btn-s ${cls}" data-product-action="${kind}" ${d} ${extraAttr}
      ${perm.ok ? "" : `disabled title="${esc(perm.reason)}"`}>${label}</button>`;
  };
  const out = [];
  if (isOpenProduct(pr) && pr.assignment.status === "Pendiente de aceptación") {
    out.push(b("accept", "Aceptar asignación", "btn-pri", "assign"));
    out.push(b("adjust", "Proponer ajuste", "", "assign"));
  }
  if (isOpenProduct(pr) && pr.assignment.status === "En ajuste") {
    out.push(b("resolve", "Resolver ajuste", "btn-pri", "coordinate"));
  }
  if (isOpenProduct(pr) && pr.assignment.status === "Aceptada") {
    // Cada gesto tiene su botón, con el mismo formulario por debajo (obs. de los usuarios).
    out.push(b("novelty", "Registrar avance", "btn-pri", "update", 'data-novelty-type="Avance"'));
    out.push(b("novelty", "Registrar novedad", "", "update"));
    out.push(pr.status === "Suspendido"
      ? b("novelty", "Reanudar", "btn-ok", "update", 'data-novelty-type="Reanudación"')
      : b("novelty", "Suspender", "", "update", 'data-novelty-type="Suspensión"'));
    out.push(b("nextaction", "Próxima acción", "", "update"));
    if ((pr.milestones || []).length) out.push(b("milestones", "Actualizar hitos", "", "update"));
    out.push(b("requirements", "Requisitos de información", "", "update"));
  }
  if (isOpenProduct(pr) && (pr.requirements || []).some(r => r.status === "Definido"))
    out.push(b("request", "Solicitar al cliente", "", "coordinate"));
  if ((pr.requirements || []).some(r => r.status === "Solicitado al cliente"))
    out.push(b("response", "Registrar respuesta", "", "coordinate"));
  if (["Programado", "En ejecución"].includes(pr.status)) out.push(b("complete", "Declarar completado", "btn-ok", "update"));
  if (pr.status === "Completado") out.push(b("complete", "Corregir datos de cierre", "btn-ok", "update"));
  if (pr.status === "Cerrado") out.push(b("novelty", "Registrar observación", "", "update"));
  if (isOpenProduct(pr) && pr.assignment.status === "Aceptada") out.push(b("reassign", "Reasignar cargo", "", "coordinate"));
  out.push(`<button class="btn btn-s" data-open-project="${esc(p.id)}" data-open-product="${esc(pr.id)}">Abrir ficha</button>`);
  return out.join("");
}

/* ------------------------- plan de trabajo (Gantt) ------------------------- */

function planRange(p) {
  const d = [];
  (p.products || []).forEach(pr => {
    [pr.startDate, pr.endDate, pr.plannedStart, pr.plannedEnd].forEach(x => { if (x) d.push(x); });
    (pr.milestones || []).forEach(m => { if (m.date) d.push(m.date); if (m.baselineDate) d.push(m.baselineDate); });
  });
  if (!d.length) return null;
  d.sort();
  const from = toDate(d[0]), to = toDate(d[d.length - 1]);
  if (!from || !to) return null;
  const pad = 3 * 86400000;
  const start = new Date(Math.min(from.getTime(), Date.now()) - pad);
  const end = new Date(Math.max(to.getTime(), Date.now()) + pad);
  return { start, end, span: Math.max(1, end - start) };
}
function pctOf(range, d) { const x = toDate(d); return x ? clamp((x - range.start) / range.span * 100, 0, 100) : null; }
function renderPlanCard(p) {
  const open = state.ui.openPlans.has(p.id);
  const range = planRange(p);
  const fp = p.finalPlan || {};
  const drift = sum(p.products, planDrift);
  return `<details class="card" ${open ? "open" : ""} data-plan="${esc(p.id)}" style="margin:0 0 4px">
    <summary class="card-h" style="cursor:pointer;list-style:none">
      <div><h2>Plan de trabajo ${fp.version ? `final · versión ${fp.version}` : "· sin versión final"}</h2>

      <div class="sp">${fp.version ? pill(`v${fp.version}`, "a") : pillS("pendiente", "w", "no_plan", "Ver los proyectos sin plan final")}
        ${(p.planHistory || []).length ? `<button class="btn btn-s" data-plan-history="${esc(p.id)}">Historial</button>` : ""}
        <button class="btn btn-pri btn-s" data-plan-edit="${esc(p.id)}" style="font-weight:800">${fp.version ? "Plan de trabajo · nueva versión" : "Construir plan de trabajo"}</button></div>

        <div class="c6"><span class="note"><b>Compromisos de Rehavid</b><br>${esc(fp.rehavidCommitments || "—")}</span></div>

      </div>` : `<p class="note" style="margin-bottom:14px">Plan estimado de la venta: ${esc(p.estimatedPlan || "sin registrar")}</p>`}
      ${range ? renderGantt(p, range) : `<p class="note">Todavía no hay fechas. Se definen al construir el plan de trabajo final.</p>`}
    </div>
  </details>`;
}
function renderGantt(p, range) {
  const months = [];
  let cur = new Date(range.start.getFullYear(), range.start.getMonth(), 1);
  while (cur <= range.end) { months.push(`${MONTHS[cur.getMonth()].slice(0, 3)} ${String(cur.getFullYear()).slice(2)}`);
                             cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1); }
  const now = clamp((Date.now() - range.start) / range.span * 100, 0, 100);
  const rows = (p.products || []).map(pr => {
    const cond = productCondition(pr, p);
    const s = pctOf(range, pr.startDate), e = pctOf(range, pr.endDate);
    const bs = pctOf(range, pr.plannedStart), be = pctOf(range, pr.plannedEnd);
    const ms = (pr.milestones || []).filter(m => m.date).map(m => {
      const mp = pctOf(range, m.date);
      const late = m.progress < 100 && (daysUntil(m.date) ?? 0) < 0;
      return `<span class="g-m ${m.progress >= 100 ? "done" : late ? "late" : ""}" style="left:calc(${mp}% - 5px)"
        title="${esc(m.name)} · ${formatDate(m.date, true)}${m.baselineDate && m.baselineDate !== m.date ? ` (venta: ${formatDate(m.baselineDate, true)})` : ""} · ${fmtPct(m.progress)}"></span>`;
    }).join("");
    return `<div class="g-r">
      <div class="g-l"><button class="dot ${condK(cond)}" ${filterAttrs("condition", cond)}
          title="${esc(cond)} · clic para acotar"></button>
        <button class="g-nm" data-open-project="${esc(p.id)}" data-open-product="${esc(pr.id)}"
          title="${esc(pr.name)} · ${esc(pr.role || "sin cargo")} · ${esc(pr.status)} · clic para abrir">${esc(pr.name)}</button></div>
      <div class="g-t" style="--c:${months.length}">
        <div class="g-now" style="left:${now}%"></div>
        ${s !== null && e !== null ? `<div class="g-b ${condK(cond)}" style="left:${Math.min(s, e)}%;width:${Math.max(1.5, Math.abs(e - s))}%"
          role="button" tabindex="0" data-open-project="${esc(p.id)}" data-open-product="${esc(pr.id)}"
          title="${esc(pr.name)} · ${formatDate(pr.startDate, true)} → ${formatDate(pr.endDate, true)} · avance ${fmtPct(productProgress(pr))}${planDrift(pr) ? ` · ${planDrift(pr) > 0 ? "+" : ""}${planDrift(pr)} d frente al plan de venta` : ""} · clic para abrir"><i style="width:${productProgress(pr)}%"></i></div>` : ""}
        ${bs !== null && be !== null && (bs !== s || be !== e) ? `<div class="g-base" style="left:${Math.min(bs, be)}%;width:${Math.max(1, Math.abs(be - bs))}%" title="Plan estimado de la venta"></div>` : ""}
        ${s === null || e === null ? `<span class="g-empty">sin fechas definitivas</span>` : ""}
        ${ms}
      </div></div>`;
  }).join("");
  return `<div class="gantt"><div class="g-in">
    <div class="g-r hd"><div class="g-l">Producto</div>
      <div class="g-s">${months.map(m => `<div>${esc(m)}</div>`).join("")}<div class="g-now" style="left:${now}%"></div></div></div>
    ${rows}
  </div></div>
  <div class="mini-legend"><span><i style="background:var(--accent)"></i>plan final vigente</span>
    <span><i style="background:var(--faint)"></i>plan estimado de la venta</span>
    <span><i style="background:var(--ink-2);transform:rotate(45deg)"></i>hito</span></div>`;
}

/* ------------------------------ 10.6 CALENDARIO ------------------------------ */

function easterDate(year) {
  const a = year % 19, b = Math.floor(year / 100), c = year % 100, d = Math.floor(b / 4), e = b % 4,
        f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
        i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7,
        m = Math.floor((a + 11 * h + 22 * l) / 451),
        month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(year, month - 1, day, 12);
}
function observedMonday(year, month, day) {
  const d = new Date(year, month - 1, day, 12);
  return addDays(d, d.getDay() === 1 ? 0 : (8 - d.getDay()) % 7);
}
function colombiaHolidays(year) {
  const out = [], add = (d, name) => out.push({ date: dateISO(d), name });
  add(new Date(year, 0, 1, 12), "Año Nuevo");
  add(observedMonday(year, 1, 6), "Reyes Magos");
  add(observedMonday(year, 3, 19), "San José");
  add(new Date(year, 4, 1, 12), "Día del Trabajo");
  const e = easterDate(year);
  add(addDays(e, -3), "Jueves Santo"); add(addDays(e, -2), "Viernes Santo");
  add(addDays(e, 43), "Ascensión"); add(addDays(e, 64), "Corpus Christi"); add(addDays(e, 71), "Sagrado Corazón");
  add(observedMonday(year, 6, 29), "San Pedro y San Pablo");
  add(new Date(year, 6, 20, 12), "Independencia");
  add(new Date(year, 7, 7, 12), "Batalla de Boyacá");
  add(observedMonday(year, 8, 15), "Asunción");
  add(observedMonday(year, 10, 12), "Diversidad Étnica");
  add(observedMonday(year, 11, 1), "Todos los Santos");
  add(observedMonday(year, 11, 11), "Independencia de Cartagena");
  add(new Date(year, 11, 8, 12), "Inmaculada Concepción");
  add(new Date(year, 11, 25, 12), "Navidad");
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function calendarCells(year, month) {
  const first = new Date(year, month, 1, 12);
  const start = addDays(first, -((first.getDay() + 6) % 7));
  return Array.from({ length: 42 }, (_, i) => {
    const d = addDays(start, i);
    return { date: dateISO(d), day: d.getDate(), inMonth: d.getMonth() === month, today: dateISO(d) === dateISO() };
  });
}
function eventKind(date, done = false) {
  if (done) return "o";
  const n = daysUntil(date);
  if (n === null) return "";
  return n < 0 ? "b" : n <= state.settings.sla.dueSoonDays ? "w" : "";
}
function calendarEvents(projects) {
  const map = new Map();
  const push = (date, e) => { if (!date) return; if (!map.has(date)) map.set(date, []); map.get(date).push({ ...e, date }); };
  projects.forEach(p => (p.products || []).forEach(pr => {
    // Al filtrar por líder o categoría, el calendario muestra solo esos productos (obs. Gestor de Datos).
    if (!productMatchesFilters(pr, p)) return;
    const done = !isOpenProduct(pr);
    if (pr.startDate) push(pr.startDate, { projectId: p.id, productId: pr.id, company: p.company,
      title: `Inicio · ${pr.name}`, subtitle: `${p.code} · ${pr.role}`, kind: done ? "o" : "" });
    if (pr.endDate) push(pr.endDate, { projectId: p.id, productId: pr.id, company: p.company,
      title: `Objetivo · ${pr.name}`, subtitle: `${p.code} · ${fmtPct(productProgress(pr))}`, kind: eventKind(pr.endDate, done) });
    (pr.milestones || []).filter(m => m.date).forEach(m => push(m.date, { projectId: p.id, productId: pr.id, company: p.company,
      title: m.name, subtitle: `${pr.name}`, kind: eventKind(m.date, m.progress >= 100) }));
    if (pr.nextAction?.date && pr.nextAction.description) push(pr.nextAction.date, { projectId: p.id, productId: pr.id,
      company: p.company, title: pr.nextAction.description, subtitle: `${pr.name} · próxima acción`, kind: eventKind(pr.nextAction.date) });
    const n = lastNovelty(pr, "Suspensión");
    if (pr.status === "Suspendido" && n?.newDate) push(n.newDate, { projectId: p.id, productId: pr.id, company: p.company,
      title: `Revisión de suspensión · ${pr.name}`, subtitle: p.code, kind: eventKind(n.newDate) });
  }));
  [...map.values()].forEach(l => l.sort((a, b) => a.company.localeCompare(b.company, "es")));
  return map;
}

];

function fld(o) {
  const { label, path, value, type = "text", span = "c4", list, min, max, step, hint, readonly, placeholder } = o;
  const attrs = [`type="${type}"`, `data-path="${esc(path)}"`, `data-fkey="${esc(path)}"`,
    `data-type="${type === "number" ? "number" : "text"}"`, `id="f_${esc(path)}"`, `value="${esc(value ?? "")}"`,
    list ? `list="${esc(list)}"` : "", min !== undefined ? `min="${min}"` : "", max !== undefined ? `max="${max}"` : "",
    step !== undefined ? `step="${step}"` : "", readonly ? "readonly" : "",
    placeholder ? `placeholder="${esc(placeholder)}"` : ""].filter(Boolean).join(" ");
  return `<div class="f ${span}"><label for="f_${esc(path)}">${esc(label)}</label><input ${attrs}>
    ${hint ? `<span class="hint">${esc(hint)}</span>` : ""}</div>`;
}
function sel(o) {
  const { label, path, value, options, span = "c4", hint, allowEmpty, emptyLabel = "Sin definir" } = o;
  return `<div class="f ${span}"><label for="f_${esc(path)}">${esc(label)}</label>
    <select data-path="${esc(path)}" data-fkey="${esc(path)}" data-type="text" id="f_${esc(path)}">
      ${allowEmpty ? `<option value="" ${!value ? "selected" : ""}>${esc(emptyLabel)}</option>` : ""}
      ${options.map(x => `<option value="${esc(x)}" ${String(x) === String(value) ? "selected" : ""}>${esc(x)}</option>`).join("")}
    </select>${hint ? `<span class="hint">${esc(hint)}</span>` : ""}</div>`;
}
function txt(o) {
  const { label, path, value, span = "c12", hint, placeholder } = o;
  return `<div class="f ${span}"><label for="f_${esc(path)}">${esc(label)}</label>
    <textarea data-path="${esc(path)}" data-fkey="${esc(path)}" data-type="text" id="f_${esc(path)}"
      ${placeholder ? `placeholder="${esc(placeholder)}"` : ""}>${esc(value ?? "")}</textarea>
    ${hint ? `<span class="hint">${esc(hint)}</span>` : ""}</div>`;
}
function chk(o) {
  const { label, path, checked, hint, span = "c4" } = o;
  return `<div class="f ${span}"><label>&nbsp;</label>
    <label class="ck"><input type="checkbox" data-path="${esc(path)}" data-fkey="${esc(path)}" data-type="bool" ${checked ? "checked" : ""}>
      <span><strong>${esc(label)}</strong>${hint ? `<span>${esc(hint)}</span>` : ""}</span></label></div>`;
}
function section(id, title, body, extra = "") {
  const open = state.ui.openSections.has(id);
  return `<details class="acc" data-section="${esc(id)}" ${open ? "open" : ""}>
    <summary><span>${esc(title)}${extra ? ` <span class="note" style="font-weight:500">· ${esc(extra)}</span>` : ""}</span></summary>
    <div class="acc-b">${body}</div></details>`;
}

function isDirty() {
  return state.draft && state.draftBaseline && JSON.stringify(state.draft) !== JSON.stringify(state.draftBaseline);
}
/** Redibuja la interfaz que está editando el borrador conservando foco, cursor y desplazamiento. */
function rerenderDraftUI() {
  const inDrawer = document.getElementById("drawer").classList.contains("open");
  const host = inDrawer ? document.getElementById("drawerBody") : document.getElementById("viewRoot");
  const active = document.activeElement;
  const key = active && host.contains(active) ? active.getAttribute("data-fkey") : null;
  const caret = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const scroll = inDrawer ? host.scrollTop : window.scrollY;
  if (inDrawer) { renderDrawerBody(); renderDrawerHead(); renderDrawerFooter(); host.scrollTop = scroll; }
  else { renderView(); window.scrollTo(0, scroll); }
  if (key) {
    const el = host.querySelector(`[data-fkey="${CSS.escape(key)}"]`);
    if (el) {
      el.focus();
      if (caret !== null && typeof el.setSelectionRange === "function" && ["text", "search", "url", "tel", "password"].includes(el.type)) {
        try { el.setSelectionRange(caret, caret); } catch (e) { /* tipos sin selección */ }
      }
    }
  }
}

let lastFocused = null;
function openProject(id, productId = "") {
  const p = state.projects.find(x => x.id === id);
  if (!p) return;
  state.selectedId = id;
  state.draft = clone(p);
  state.draftBaseline = clone(p);
  state.drawerMode = "detail";
  if (productId) state.ui.openSections.add("sec-products");
  lastFocused = document.activeElement;
  renderDrawer();
  const dr = document.getElementById("drawer");
  dr.classList.add("open");
  dr.setAttribute("aria-hidden", "false");
  document.getElementById("drawerVeil").classList.add("open");
  setTimeout(() => {
    const first = dr.querySelector("input,select,textarea,button");
    if (first) first.focus();
    if (productId) {
      const el = dr.querySelector(`[data-product-anchor="${CSS.escape(productId)}"]`);
      if (el) el.scrollIntoView({ block: "center" });
    }
  }, 50);
}
function closeDrawer(force = false) {
  if (!force && state.drawerMode === "detail" && isDirty()) {
    confirmModal("Cambios sin guardar", "Si cierra la ficha ahora, los cambios del formulario se descartan.",
      [{ label: "Seguir editando" }, { label: "Descartar", kind: "btn-bad", action: () => closeDrawer(true) }]);
    return;
  }
  const dr = document.getElementById("drawer");
  dr.classList.remove("open");
  dr.setAttribute("aria-hidden", "true");
  document.getElementById("drawerVeil").classList.remove("open");
  state.draft = null; state.draftBaseline = null; state.selectedId = null; state.drawerMode = null;
  if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
  renderApp();
}

let modalHandlers = {};
function openModal(html) {
  document.getElementById("modal").innerHTML = html;
  document.getElementById("modalVeil").classList.add("open");
  setTimeout(() => {
    const el = document.querySelector("#modal input,#modal select,#modal textarea,#modal button");
    if (el) el.focus();
  }, 30);
}
function closeModal() { document.getElementById("modalVeil").classList.remove("open"); modalHandlers = {}; }
function confirmModal(title, text, buttons) {
  modalHandlers = {};
  openModal(`<div class="m-h"><h2>${esc(title)}</h2>
      <button class="btn btn-ico btn-plain" data-action="close-modal" aria-label="Cerrar">✕</button></div>
    <div class="m-b"><p class="note" style="font-size:13px;margin:0">${esc(text)}</p></div>
    <div class="m-f">${buttons.map((b, i) => {
      if (b.action) modalHandlers[i] = b.action;
      return `<button class="btn ${b.kind || ""}" data-modal-action="${i}">${esc(b.label)}</button>`;
    }).join("")}</div>`);
}
function toast(title, message = "", type = "success") {
  const zone = document.getElementById("toastZone");
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.innerHTML = `<strong>${esc(title)}</strong>${message ? esc(message) : ""}`;
  zone.appendChild(el);
  setTimeout(() => el.remove(), 4600);
}
function field(f) {
  const span = f.span || "c6";
  if (f.type === "static") return `<div class="f ${span}"><label>${esc(f.label)}</label><p class="note" style="margin:0">${esc(f.value)}</p></div>`;
  if (f.type === "textarea") return `<div class="f ${span}"><label for="pa_${esc(f.id)}">${esc(f.label)}</label>
    <textarea id="pa_${esc(f.id)}">${esc(f.value || "")}</textarea>${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ""}</div>`;
  if (f.type === "select") return `<div class="f ${span}"><label for="pa_${esc(f.id)}">${esc(f.label)}</label>
    <select id="pa_${esc(f.id)}" ${f.refresh ? `data-modal-refresh="${esc(f.refresh)}"` : ""}>
      ${(f.options || []).map(o => `<option ${String(o) === String(f.value) ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>
    ${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ""}</div>`;
  if (f.type === "checkbox") return `<div class="f ${span}"><label>&nbsp;</label>
    <label class="ck"><input type="checkbox" id="pa_${esc(f.id)}" ${f.value ? "checked" : ""}>
      <span><strong>${esc(f.label)}</strong>${f.hint ? `<span>${esc(f.hint)}</span>` : ""}</span></label></div>`;
  return `<div class="f ${span}"><label for="pa_${esc(f.id)}">${esc(f.label)}</label>
    <input id="pa_${esc(f.id)}" type="${esc(f.type || "text")}" value="${esc(f.value ?? "")}"
      ${f.list ? `list="${esc(f.list)}"` : ""} ${f.min !== undefined ? `min="${f.min}"` : ""}
      ${f.max !== undefined ? `max="${f.max}"` : ""} ${f.step !== undefined ? `step="${f.step}"` : ""}>
    ${f.hint ? `<span class="hint">${esc(f.hint)}</span>` : ""}</div>`;
}
function openForm({ title, intro, fields, submit, validate, run, context }) {
  modalHandlers = {};
  modalHandlers.submit = () => {
    const v = {};
    const missing = [];
    fields.forEach(f => {
      if (f.type === "static") return;
      const el = document.getElementById(`pa_${f.id}`);
      if (!el) return;
      v[f.id] = f.type === "checkbox" ? el.checked : (f.type === "number" ? Number(el.value) || 0 : el.value.trim());
      if (f.required && (f.type === "number" ? !(v[f.id] > 0) : !v[f.id])) missing.push(f.label.replace(" *", ""));
    });
    if (missing.length) { toast("Faltan datos obligatorios", missing.join(", "), "error"); return false; }
    const err = validate ? validate(v) : "";
    if (err) { toast("Revise los datos", err, "error"); return false; }
    run(v);
    closeModal();
    return true;
  };
  if (context) modalHandlers.context = context;
  openModal(`<div class="m-h"><h2>${esc(title)}</h2>
      <button class="btn btn-ico btn-plain" data-action="close-modal" aria-label="Cerrar">✕</button></div>
    <div class="m-b"><p class="note" style="margin:0 0 16px">${esc(intro)}</p>
      <div class="grid">${fields.map(field).join("")}</div></div>
    <div class="m-f"><button class="btn" data-action="close-modal">Cancelar</button>
      <button class="btn btn-pri" data-modal-submit="1">${esc(submit)}</button></div>`);
}
/** Guarda, ejecuta el cierre automático y refresca lo que esté abierto. */
function afterMutation(p, msg = "", detail = "") {
  pr_touch(p);
  const res = runAutoClosure(p);
  syncCatalogs();
  saveState();
  if (state.draft && state.selectedId === p.id) { state.draft = clone(p); state.draftBaseline = clone(p); renderDrawer(); }
  renderApp();
  if (msg) toast(msg, detail);
  if (res.closed.length) toast("Cierre automático de producto", `${res.closed.join(", ")} pasó a Cerrado tras superar la validación.`);
  if (res.projectClosed) toast("Proyecto maestro cerrado", `${p.code} se cerró automáticamente: todos sus productos están cerrados.`);
}

/** Consolida los requisitos «Definido» de todos los productos del proyecto en una sola
    solicitud al cliente, con reunión, medio, asistentes y evidencia (RN-11). */
function openProjectRequest(projectId) {
  const p = state.projects.find(x => x.id === projectId);

  const perm = permissionFor("coordinate", p);
  if (!perm.ok) { toast("Sin permisos", perm.reason, "error"); return; }
  const grupos = (p.products || [])
    .map(pr => ({ pr, reqs: (pr.requirements || []).filter(r => r.status === "Definido") }))
    .filter(g => g.reqs.length);
  if (!grupos.length) { toast("Nada por solicitar", "Ningún producto tiene requisitos definidos sin solicitar.", "warning"); return; }
  const total = grupos.reduce((n, g) => n + g.reqs.length, 0);
  openForm({
    title: `Solicitud consolidada al cliente · ${p.code}`,
    intro: `Una sola solicitud agrupa los ${total} requisito(s) definidos en ${grupos.length} producto(s), en lugar de gestionarlos por separado (RN-11).`,
    fields: [
      { id: "list", type: "static", label: "Requisitos consolidados",

      { id: "date", type: "date", label: "Fecha de la reunión o solicitud *", value: dateISO(), required: true, span: "c4" },
      { id: "medium", type: "select", label: "Medio *", options: ["Reunión", "Llamada", "Correo", "Mensaje"], value: "Reunión", span: "c4" },
      { id: "contact", type: "select", label: "Contacto del cliente",

      { id: "attendees", type: "text", label: "Asistentes", value: "", span: "c6", hint: "Personas de Rehavid y del cliente." },
      { id: "evidence", type: "text", label: "Evidencia (acta, correo, enlace)", value: "", span: "c6" },
      { id: "notes", type: "textarea", label: "Acuerdos y observaciones", value: "", span: "c12" }
    ],
    submit: "Registrar solicitud consolidada",
    run: v => {
      grupos.forEach(g => {
        g.reqs.forEach(r => { r.status = "Solicitado al cliente"; r.requestedAt = v.date; r.requestedBy = currentUser(); r.evidence = v.evidence; });
        g.pr.novelties.unshift(makeNovelty({ type: "Solicitud de información",

                                 medium: v.medium, attendees: v.attendees, contact: v.contact,

                                 evidence: v.evidence, notes: v.notes });

      { id: "nextDate", type: "date", label: "Fecha de la próxima acción", value: pr.nextAction?.date || "", span: "c4" }
    ];
    openForm({
      title: `Registrar novedad · ${pr.name}`,
      intro: cerrado
        ? "El producto está cerrado: la observación queda en la bitácora sin modificar el estado ni el avance."
        : needsCause
        ? "Un retraso, una suspensión o un bloqueo exigen causa, responsable, acción y nueva fecha (RN-15). El plan se recalcula con ese desplazamiento."
        : "El líder del producto mantiene actualizado el panel: avance, horas, fechas, novedades y próxima acción (§11).",
      fields, submit: "Registrar novedad",
      context: { kind: "novelty", projectId: p.id, productId: pr.id },
      validate: v => (v.newDate && pr.startDate && v.newDate < pr.startDate) ? "La nueva fecha no puede ser anterior al inicio." : "",
      run: v => {
        const beforeState = pr.status, beforeEnd = pr.endDate;
        const beforeProgress = productProgress(pr);
        if (cerrado) {
          // Observación posterior al cierre: bitácora sí, estado no.
          pr.novelties.unshift(makeNovelty({ type: "Nota", cause: v.cause }));
          logEvent(p, { type: "Observación tras el cierre", entity: pr.name, field: "bitácora", after: v.cause,
                        reason: "El producto cerrado no se modifica; la novedad queda registrada." });
          afterMutation(p, "Observación registrada", `${pr.name} sigue cerrado.`);
          return;
        }
        if (!usesMilestoneProgress(pr) && v.progress !== undefined) pr.progress = clamp(v.progress, 0, 100);
        if (v.hoursExecuted !== undefined) pr.hoursExecuted = Number(v.hoursExecuted) || 0;
        if (v.newDate && v.newDate !== pr.endDate) {
          const days = beforeEnd ? Math.round((toDate(v.newDate) - toDate(beforeEnd)) / 86400000) : 0;
          if (!pr.plannedEnd) pr.plannedEnd = beforeEnd;
          if (!pr.plannedStart) pr.plannedStart = pr.startDate;
          pr.endDate = v.newDate;
          if (v.shift && days > 0) {
            (pr.milestones || []).filter(m => m.date && m.progress < 100).forEach(m => {
              if (!m.baselineDate) m.baselineDate = m.date;
              m.date = dateISO(addDays(toDate(m.date), days));
            });
          }
          logEvent(p, { type: "Reprogramado", entity: pr.name, field: "fecha objetivo", before: beforeEnd, after: v.newDate,
                        reason: `${v.cause}${v.shift && days > 0 ? ` · hitos pendientes desplazados ${days} día(s)` : ""}` });
        }
        if (v.type === "Suspensión") pr.status = "Suspendido";
        // Un bloqueo no cambia el estado: el producto sigue donde estaba, con la alerta en la bitácora.
        if (v.type === "Reanudación") pr.status = "En ejecución";
        if (["Avance", "Retraso"].includes(v.type) && pr.status === "Programado") pr.status = "En ejecución";
        if (v.nextAction) pr.nextAction = { description: v.nextAction, owner: currentUser(), date: v.nextDate || "" };
        pr.novelties.unshift(makeNovelty({ type: v.type, cause: v.cause, action: v.action, owner: v.owner,
                                           newDate: v.newDate, progress: productProgress(pr), hoursExecuted: pr.hoursExecuted }));
        pr.lastUpdateAt = new Date().toISOString();
        logEvent(p, { type: v.type === "Suspensión" ? "Suspendido" : v.type === "Reanudación" ? "Reanudado" : "Actualizado",
                      entity: pr.name, field: "avance y estado",
                      before: `${fmtPct(beforeProgress)} · ${beforeState}`, after: `${fmtPct(productProgress(pr))} · ${pr.status}`,
                      reason: v.cause });
        afterMutation(p, "Novedad registrada", `${pr.name} · ${v.type}`);
      }
    });
  },
  milestones: (p, pr) => {
    const list = pr.milestones || [];

/* ------------------- plan de trabajo final versionado (§9) ------------------- */

function openPlanEditor(projectId) {
  const p = state.projects.find(x => x.id === projectId);
  if (!p) return;
  const perm = permissionFor("coordinate", p);
  if (!perm.ok) { toast("Sin permisos", perm.reason, "error"); return; }
  const fp = p.finalPlan || {};
  modalHandlers = {};
  modalHandlers.submit = () => {
    const reason = document.getElementById("pa_reason").value.trim();
    if (!reason) { toast("Motivo obligatorio", "Toda versión del plan exige justificación (RN-14).", "error"); return false; }
    // El plan final no se aprueba con asignaciones sin resolver (ajuste de la validación de usuarios).
    const sinResolver = (p.products || []).filter(pr => isOpenProduct(pr) && pr.assignment.status !== "Aceptada");
    if (sinResolver.length) {
      toast("Aprobación bloqueada", `Asignaciones sin resolver: ${sinResolver.map(x => `${x.name} (${x.assignment.status})`).join("; ")}.`, "error");
      return false;
    }
    const items = [];
    let bad = "";
    const sinFechas = [];
    (p.products || []).forEach((pr, i) => {
      const s = document.getElementById(`pa_s_${i}`).value;
      const e = document.getElementById(`pa_e_${i}`).value;
      const h = Number(document.getElementById(`pa_h_${i}`)?.value) || pr.hoursSold;
      if (s && e && e < s) bad = `${pr.name}: la fecha de cierre es anterior al inicio.`;
      if (isOpenProduct(pr) && (!s || !e)) sinFechas.push(pr.name);
      const ms = (pr.milestones || []).map((m, j) => ({ name: m.name,
        date: document.getElementById(`pa_m_${i}_${j}`)?.value || m.date }));
      items.push({ productId: pr.id, name: pr.name, start: s, end: e, hours: h, role: pr.role, milestones: ms });
    });
    if (bad) { toast("Revise las fechas", bad, "error"); return false; }
    if (sinFechas.length) { toast("Aprobación bloqueada", `Productos abiertos sin fechas definitivas: ${sinFechas.join(", ")}.`, "error"); return false; }
    // Aviso preventivo: fechas en festivo o fin de semana (no bloquea, advierte).
    const hols = new Map([...colombiaHolidays(new Date().getFullYear()), ...colombiaHolidays(new Date().getFullYear() + 1)]
      .map(h => [h.date, h.name]));
    const choques = [];
    items.forEach(it => [["inicio", it.start], ["cierre", it.end], ...it.milestones.map(m => [m.name, m.date])].forEach(([lbl, d]) => {
      if (!d) return;
      const day = toDate(d)?.getDay();
      if (hols.has(d)) choques.push(`${it.name} · ${lbl} cae en festivo (${hols.get(d)})`);
      else if (day === 0 || day === 6) choques.push(`${it.name} · ${lbl} cae en fin de semana`);
    }));
    if (choques.length) toast("Revise el calendario", choques.slice(0, 4).join(" · "), "warning");
    if (fp.version) p.planHistory = [makeFinalPlan(fp), ...(p.planHistory || [])].slice(0, 20);
    const version = (fp.version || 0) + 1;
    p.finalPlan = makeFinalPlan({
      version, approvedAt: new Date().toISOString(), approvedBy: currentUser(), coordinatorRole: myCargo(),
      items, clientCommitments: document.getElementById("pa_cc").value.trim(),
      rehavidCommitments: document.getElementById("pa_rc").value.trim(),
      requirementsNote: document.getElementById("pa_rq").value.trim(), deviationReason: reason
    });
    items.forEach(it => {
      const pr = p.products.find(x => x.id === it.productId);
      if (!pr) return;
      if (!pr.plannedStart) pr.plannedStart = pr.startDate || it.start;
      if (!pr.plannedEnd) pr.plannedEnd = pr.assignment.requestedDate || pr.endDate || it.end;
      const before = `${pr.startDate || "—"} → ${pr.endDate || "—"}`;
      if (Number(it.hours) > 0 && Number(it.hours) !== pr.hoursSold) {
        logEvent(p, { type: "Plan final", entity: pr.name, field: "horas", before: String(pr.hoursSold), after: String(it.hours), reason });
        pr.hoursSold = Number(it.hours);
      }
      it.milestones.forEach((m, j) => {
        const mm = (pr.milestones || [])[j];
        if (mm && m.date && m.date !== mm.date) { if (!mm.baselineDate) mm.baselineDate = mm.date; mm.date = m.date; }
      });
      pr.startDate = it.start; pr.endDate = it.end;
      if (pr.status === "Pendiente de información" && it.start && it.end && pr.assignment.status === "Aceptada") pr.status = "Programado";
      if (before !== `${it.start} → ${it.end}`)
        logEvent(p, { type: "Plan final", entity: pr.name, field: "programación", before, after: `${it.start} → ${it.end}`, reason });
    });
    logEvent(p, { type: "Plan final", entity: "Proyecto", field: "versión del plan",
                  before: fp.version ? `v${fp.version}` : "sin plan", after: `v${version}`, reason });
    closeModal();
    afterMutation(p, `Plan de trabajo final versión ${version}`, "Queda como referencia obligatoria para la ejecución y el cierre.");
    return true;
  };
  openModal(`<div class="m-h"><h2>${fp.version ? `Nueva versión del plan · v${fp.version + 1}` : "Construir el plan de trabajo final"}</h2>
      <button class="btn btn-ico btn-plain" data-action="close-modal" aria-label="Cerrar">✕</button></div>
    <div class="m-b">
      <p class="note" style="margin:0 0 16px">Contraste el plan estimado de la venta con la capacidad aceptada, los requisitos y las fechas
        acordadas. El resultado se versiona y reemplaza al plan de venta como referencia operativa (RN-13, RN-14).</p>
      <p class="note" style="margin:0 0 16px"><b>Plan estimado de la venta:</b> ${esc(p.estimatedPlan || "—")}</p>
      <div class="tw" style="margin-bottom:16px"><table class="t">

        <tbody>${(p.products || []).map((pr, i) => `<tr>
