/* ---------------------------- 8.2 Centro de alertas ---------------------------- */

function renderAlertCenter(projects) {
  const all = projects.flatMap(p => projectAlerts(p).map(a => ({ ...a, project: p })));
  if (!all.length) {
    return `<section class="panel">${empty("Sin alertas abiertas",
      "Ningún producto visible tiene pendientes de aceptación, contacto, programación, retraso, suspensión o desviación de horas.", false)}</section>`;
  }
  const byCode = groupBy(all, a => a.code);
  return `<section class="panel" style="margin-bottom:14px"><div class="panel-head">
      <div><h2>${all.length} alerta(s) abierta(s)</h2><p>Agrupadas por tipo. Cada fila abre el producto para registrar la acción correspondiente.</p></div>
      <div class="panel-actions"><button class="btn btn-sm" data-action="export-alerts">Exportar alertas</button></div>
    </div></section>
    ${ALERT_DEFS.filter(def => byCode.has(def.code)).map(def => {
      const rows = byCode.get(def.code);
      return `<div class="alert-group">
        <div class="alert-group-head">
          ${pill(def.severity, def.severity === "Crítica" ? "red" : def.severity === "Alta" ? "amber" : "gray")}
          <div><strong>${esc(def.label)}</strong><p>${esc(def.desc)}</p></div>
          <span class="alert-count">${rows.length}</span>
        </div>
        ${rows.map(a => `<div class="alert-row">
          <div><button class="project-link" data-open-project="${esc(a.project.id)}" data-open-product="${esc(a.productId)}">${esc(a.project.code)} · ${esc(a.productName)}</button>
               <div class="tiny muted">${esc(a.project.company)}</div></div>
          <div class="tiny">${esc(a.detail)}</div>
          <div>${filterValue("owner", a.owner, a.owner || "Sin responsable")}</div>
          <div>${pill(productCondition((a.project.products || []).find(x => x.id === a.productId) || {}, a.project), conditionColor(productCondition((a.project.products || []).find(x => x.id === a.productId) || {}, a.project)))}</div>
          <div><button class="btn btn-sm" data-open-project="${esc(a.project.id)}" data-open-product="${esc(a.productId)}">Gestionar</button></div>
        </div>`).join("")}
      </div>`;
    }).join("")}`;
}

/* --------------------------- 8.3 Mis asignaciones --------------------------- */

function renderAssignments() {
  const owner = state.ui.assignmentOwner || state.session.user;
  const people = unique([...(state.settings.catalogs.people || []), owner]);
  const rows = state.projects
    .filter(p => p.state !== "Borrador")
    .flatMap(p => (p.products || []).filter(pr => pr.owner === owner).map(pr => ({ p, pr })))
    .sort((a, b) => {
      const ca = CONDITION_RANK[productCondition(a.pr, a.p)], cb = CONDITION_RANK[productCondition(b.pr, b.p)];
      return ca - cb || String(a.pr.endDate || "9999").localeCompare(String(b.pr.endDate || "9999"));
    });
  const pending = rows.filter(({ pr }) => isOpenProduct(pr) && !pr.acceptedAt).length;

  return `<section class="panel" style="margin-bottom:14px">
    <div class="panel-head">
      <div><h2>Asignaciones de ${esc(owner)}</h2>
        <p>${rows.length} producto(s) asignado(s)${pending ? ` · ${pending} sin aceptar` : ""}. La aceptación deja trazabilidad y activa el compromiso de contacto con el cliente (RN-06).</p></div>
      <div class="panel-actions">
        <label class="sr-only" for="assignmentOwner">Ver asignaciones de</label>
        <select id="assignmentOwner" class="btn">${people.map(x => `<option ${x === owner ? "selected" : ""}>${esc(x)}</option>`).join("")}</select>
      </div>
    </div>
  </section>
  ${rows.length ? rows.map(({ p, pr }) => renderAssignmentCard(p, pr)).join("")
                : `<section class="panel">${empty("Sin asignaciones", `No hay productos asignados a ${owner}. Cambie de responsable o registre una venta.`)}</section>`}`;
}
function renderAssignmentCard(p, pr) {
  const cond = productCondition(pr, p);
  const alerts = productAlerts(pr, p);
  const steps = [
    { label: "Asignado", done: Boolean(pr.assignedAt), detail: formatStamp(pr.assignedAt) },
    { label: "Aceptado", done: Boolean(pr.acceptedAt), detail: pr.acceptedAt ? formatStamp(pr.acceptedAt) : "Pendiente" },
    { label: "Contactado", done: Boolean(pr.contactedAt), detail: pr.contactedAt ? formatDate(pr.contactedAt, true) : "Pendiente" },
    { label: "Programado", done: Boolean(pr.scheduleConfirmed), detail: pr.scheduleConfirmed ? `${formatDate(pr.startDate, true)} → ${formatDate(pr.endDate, true)}` : "Pendiente" }
  ];
  return `<article class="assign-card">
    <div class="assign-head">
      <div style="flex:1;min-width:200px">
        <h3>${esc(pr.name)} <span class="tiny muted">· ${esc(pr.routing)}${pr.technology ? ` · ${esc(pr.technology)}` : ""}${pr.complexity ? ` · complejidad ${esc(pr.complexity)}` : ""}</span></h3>
        <p><button class="project-link" data-open-project="${esc(p.id)}" data-open-product="${esc(pr.id)}">${esc(p.code)} · ${esc(p.company)}</button> · PPR ${esc(p.ppr)} · ${esc(p.type)}</p>
        <div class="steps">${steps.map(s => `<span class="step-chip ${s.done ? "done" : "pending"}" title="${esc(s.detail)}">${s.done ? "✓" : "•"} ${esc(s.label)}</span>`).join("")}</div>
      </div>
      <div style="text-align:right">${pill(pr.status, stateColor(pr.status))} ${pill(cond, conditionColor(cond))}</div>
    </div>
    <div class="assign-meta">
      <div><span>Horas</span><b>${fmtNum(pr.hoursExecuted)} / ${fmtNum(pr.hoursSold)} h</b></div>
      <div><span>Saldo</span><b>${fmtNum(productHoursBalance(pr))} h</b></div>
      <div><span>Programación</span><b>${pr.scheduleConfirmed ? `${formatDate(pr.startDate, true)} → ${formatDate(pr.endDate, true)}` : "Sin confirmar"}</b></div>
      <div><span>Avance</span><b>${fmtPct(productProgress(pr))}</b></div>
      <div><span>Última actualización</span><b>${pr.lastUpdateAt ? formatStamp(pr.lastUpdateAt) : "Sin registro"}</b></div>
    </div>
    ${alerts.length ? `<div class="tiny" style="margin-bottom:9px">${alerts.map(a => `${pill(a.label, a.severity === "Crítica" || a.severity === "Alta" ? "red" : "amber")} <span class="muted">${esc(a.detail)}</span>`).join("<br>")}</div>` : ""}
    ${renderProductActions(p, pr)}
  </article>`;
}
function renderProductActions(p, pr) {
  const d = `data-project="${esc(p.id)}" data-product="${esc(pr.id)}"`;
  const btns = [];
  if (!pr.acceptedAt && isOpenProduct(pr)) btns.push(`<button class="btn btn-sm btn-primary" data-product-action="accept" ${d}>Aceptar asignación</button>`);
  if (isOpenProduct(pr)) btns.push(`<button class="btn btn-sm" data-product-action="reassign" ${d}>Reasignar</button>`);
  if (pr.acceptedAt && isOpenProduct(pr)) btns.push(`<button class="btn btn-sm" data-product-action="contact" ${d}>${pr.contactedAt ? "Nuevo contacto" : "Registrar contacto"}</button>`);
  if (isOpenProduct(pr)) btns.push(`<button class="btn btn-sm" data-product-action="schedule" ${d}>${pr.scheduleConfirmed ? "Reprogramar" : "Programar"}</button>`);
  if (["Programado", "En ejecución"].includes(pr.status)) btns.push(`<button class="btn btn-sm" data-product-action="progress" ${d}>Actualizar avance</button>`);
  if (["Programado", "En ejecución"].includes(pr.status)) btns.push(`<button class="btn btn-sm btn-danger" data-product-action="suspend" ${d}>Suspender</button>`);
  if (pr.status === "Suspendido") btns.push(`<button class="btn btn-sm btn-success" data-product-action="resume" ${d}>Reanudar</button>`);
  if (["Programado", "En ejecución"].includes(pr.status)) btns.push(`<button class="btn btn-sm btn-success" data-product-action="finish" ${d}>Finalizar producto</button>`);
  if (pr.status === "Finalizado") btns.push(`<button class="btn btn-sm btn-success" data-product-action="close" ${d}>Cerrar producto</button>`);
  btns.push(`<button class="btn btn-sm" data-open-project="${esc(p.id)}" data-open-product="${esc(pr.id)}">Abrir ficha</button>`);
  return `<div class="product-actions">${btns.join("")}</div>`;
}

/* ------------------------------ 8.5 Calendario ------------------------------ */

function addDays(base, days) { const d = new Date(base); d.setDate(d.getDate() + days); return d; }
function easterDate(year) {
  const a = year % 19, b = Math.floor(year / 100), c = year % 100, d = Math.floor(b / 4), e = b % 4,
        f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30,
        i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7,
        m = Math.floor((a + 11 * h + 22 * l) / 451),
        month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(year, month - 1, day, 12);
}
function observedMonday(year, month, day) {
  const d = new Date(year, month - 1, day, 12);
  return addDays(d, d.getDay() === 1 ? 0 : (8 - d.getDay()) % 7);   // Ley Emiliani
}
function colombiaHolidays(year) {
  const out = [], add = (d, name) => out.push({ date: dateISO(d), name });
  add(new Date(year, 0, 1, 12), "Año Nuevo");
  add(observedMonday(year, 1, 6), "Día de los Reyes Magos");
  add(observedMonday(year, 3, 19), "Día de San José");
  add(new Date(year, 4, 1, 12), "Día del Trabajo");
  const easter = easterDate(year);
  add(addDays(easter, -3), "Jueves Santo");
  add(addDays(easter, -2), "Viernes Santo");
  add(addDays(easter, 43), "Ascensión del Señor");
  add(addDays(easter, 64), "Corpus Christi");
  add(addDays(easter, 71), "Sagrado Corazón de Jesús");
  add(observedMonday(year, 6, 29), "San Pedro y San Pablo");
  add(new Date(year, 6, 20, 12), "Día de la Independencia");
  add(new Date(year, 7, 7, 12), "Batalla de Boyacá");
  add(observedMonday(year, 8, 15), "Asunción de la Virgen");
  add(observedMonday(year, 10, 12), "Día de la Diversidad Étnica y Cultural");
  add(observedMonday(year, 11, 1), "Todos los Santos");
  add(observedMonday(year, 11, 11), "Independencia de Cartagena");
  add(new Date(year, 11, 8, 12), "Inmaculada Concepción");
  add(new Date(year, 11, 25, 12), "Navidad");
  return out.sort((a, b) => a.date.localeCompare(b.date));
}
function calendarCells(year, month) {
  const first = new Date(year, month, 1, 12);
  const start = addDays(first, -((first.getDay() + 6) % 7));
  return Array.from({ length: 42 }, (_, i) => {
    const d = addDays(start, i);
    return { date: dateISO(d), day: d.getDate(), inMonth: d.getMonth() === month, today: dateISO(d) === dateISO() };
  });
}
function eventColor(date, done = false) {
  if (done) return "green";
  const n = daysUntil(date);
  if (n === null) return "";
  if (n < 0) return "red";
  return n <= state.settings.sla.dueSoonDays ? "amber" : "";
}
function calendarEvents(projects) {
  const map = new Map();
  const push = (date, e) => { if (!date) return; if (!map.has(date)) map.set(date, []); map.get(date).push({ ...e, date }); };
  projects.forEach(p => {
    (p.products || []).forEach(pr => {
      const done = !isOpenProduct(pr);
      if (pr.startDate) push(pr.startDate, { projectId: p.id, productId: pr.id, company: p.company,
        title: `Inicio · ${pr.name}`, subtitle: `${p.code} · ${pr.owner || "Sin responsable"}`, color: done ? "green" : "" });
      if (pr.endDate) push(pr.endDate, { projectId: p.id, productId: pr.id, company: p.company,
        title: `Fecha objetivo · ${pr.name}`, subtitle: `${p.code} · ${fmtPct(productProgress(pr))} de avance`, color: eventColor(pr.endDate, done) });
      (pr.milestones || []).filter(m => m.date).forEach(m => push(m.date, { projectId: p.id, productId: pr.id, company: p.company,
        title: m.name, subtitle: `${pr.name} · ${m.owner || pr.owner || "Sin responsable"}${m.confirmed ? "" : " · sin confirmar"}`,
        color: eventColor(m.date, m.progress >= 100) }));
      const n = lastNovelty(pr, "Suspensión");
      if (pr.status === "Suspendido" && n?.newDate) push(n.newDate, { projectId: p.id, productId: pr.id, company: p.company,
        title: `Revisión de suspensión · ${pr.name}`, subtitle: `${p.code} · ${n.owner || "Sin responsable"}`, color: eventColor(n.newDate) });
    });
  });
  [...map.values()].forEach(list => list.sort((a, b) => a.company.localeCompare(b.company, "es") || a.title.localeCompare(b.title, "es")));
  return map;
}
function renderCalendar(projects) {
  const companyFilter = state.ui.calendarCompany;
  const scoped = companyFilter ? projects.filter(p => p.company === companyFilter) : projects;
  const { year, month } = state.calendar;
  const cells = calendarCells(year, month);
  const holidays = colombiaHolidays(year);
  const holidayMap = new Map(holidays.map(h => [h.date, h]));
  const events = calendarEvents(scoped);
  const monthDates = cells.filter(c => c.inMonth).map(c => c.date);
  const monthEvents = monthDates.flatMap(d => events.get(d) || []);
  const monthHolidays = holidays.filter(h => toDate(h.date)?.getMonth() === month);
  const companies = unique(projects.map(p => p.company));
  const overdue = scoped.flatMap(p => (p.products || []).filter(pr => isOpenProduct(pr) && pr.endDate && (daysUntil(pr.endDate) ?? 0) < 0)).length;
  const years = Array.from({ length: 9 }, (_, i) => year - 4 + i);

  return `<section class="panel">
    <div class="calendar-toolbar">
      <button class="btn btn-sm" data-calendar-shift="-1">← Mes anterior</button>
      <div class="calendar-title"><strong>${MONTHS[month]} ${year}</strong>
        <span>${companyFilter ? `Calendario de ${esc(companyFilter)}` : "Calendario consolidado del portafolio"} · ${scoped.length} proyecto(s)</span></div>
      <div class="calendar-controls">

        <button class="btn btn-sm" data-calendar-today="1">Hoy</button>
        <label class="sr-only" for="calendarMonth">Mes</label>
        <select id="calendarMonth">${MONTHS.map((m, i) => `<option value="${i}" ${i === month ? "selected" : ""}>${m}</option>`).join("")}</select>
        <label class="sr-only" for="calendarYear">Año</label>
        <select id="calendarYear">${years.map(y => `<option ${y === year ? "selected" : ""}>${y}</option>`).join("")}</select>
        <button class="btn btn-sm" data-calendar-shift="1">Mes siguiente →</button>
      </div>
    </div>
    <div class="calendar-metrics">
      <div class="calendar-metric"><span>Eventos del mes</span><b>${monthEvents.length}</b></div>
      <div class="calendar-metric"><span>Empresas visibles</span><b>${companyFilter ? 1 : companies.length}</b></div>
      <div class="calendar-metric"><span>Productos vencidos</span><b>${overdue}</b></div>
      <div class="calendar-metric"><span>Festivos del mes</span><b>${monthHolidays.length}</b></div>
    </div>
    <div class="holiday-strip"><strong>Festivos nacionales (referencia de planeación)</strong>
      ${monthHolidays.length ? monthHolidays.map(h => `<span class="holiday-chip">${formatDate(h.date, true)} · ${esc(h.name)}</span>`).join("")
                             : `<span class="holiday-chip">Sin festivos nacionales este mes</span>`}</div>
    <div class="calendar-grid">
      ${WEEKDAYS.map(d => `<div class="weekday">${d}</div>`).join("")}
      ${cells.map(c => renderDay(c, events.get(c.date) || [], holidayMap.get(c.date))).join("")}
    </div>
  </section>
  <section class="agenda"><details><summary>Ver agenda del mes agrupada por empresa</summary>
    <div class="agenda-list">${renderAgenda(monthEvents)}</div></details></section>`;
}
function renderDay(c, events, holiday) {
  return `<div class="day ${c.inMonth ? "" : "out"} ${c.today ? "today" : ""} ${holiday ? "holiday" : ""}">
    <div class="day-head"><span>${c.day}</span>${holiday ? `<span class="holiday-name">${esc(holiday.name)}</span>` : ""}</div>
    ${events.slice(0, 3).map(e => `<button class="event ${e.color}" data-open-project="${esc(e.projectId)}" data-open-product="${esc(e.productId)}">

    ${events.length > 3 ? `<button class="more-events" data-day-events="${esc(c.date)}">+ ${events.length - 3} eventos</button>` : ""}
  </div>`;
}
function renderAgenda(events) {
  if (!events.length) return `<div class="empty" style="padding:24px"><strong>Sin eventos en el mes</strong></div>`;
  const groups = [...groupBy(events, e => e.company || "Sin empresa").entries()].sort((a, b) => a[0].localeCompare(b[0], "es"));

/* --- helpers de formulario: cada control lleva data-path (ruta dentro del borrador) --- */
function fld(opts) {
  const { label, path, value, type = "text", span = "span-4", list, min, max, step, hint, readonly, placeholder } = opts;
  const attrs = [
    `type="${type}"`, `data-path="${esc(path)}"`, `data-fkey="${esc(path)}"`,
    `data-type="${type === "number" ? "number" : "text"}"`, `id="f_${esc(path)}"`,
    `value="${esc(value ?? "")}"`,
    list ? `list="${esc(list)}"` : "", min !== undefined ? `min="${min}"` : "",
    max !== undefined ? `max="${max}"` : "", step !== undefined ? `step="${step}"` : "",
    readonly ? "readonly" : "", placeholder ? `placeholder="${esc(placeholder)}"` : ""
  ].filter(Boolean).join(" ");
  return `<div class="field ${span}"><label for="f_${esc(path)}">${esc(label)}</label><input ${attrs}>
    ${hint ? `<span class="hint">${esc(hint)}</span>` : ""}</div>`;
}
function sel(opts) {
  const { label, path, value, options, span = "span-4", hint, allowEmpty, emptyLabel = "Sin definir" } = opts;
  return `<div class="field ${span}"><label for="f_${esc(path)}">${esc(label)}</label>
    <select data-path="${esc(path)}" data-fkey="${esc(path)}" data-type="text" id="f_${esc(path)}">
      ${allowEmpty ? `<option value="" ${!value ? "selected" : ""}>${esc(emptyLabel)}</option>` : ""}
      ${options.map(o => `<option value="${esc(o)}" ${String(o) === String(value) ? "selected" : ""}>${esc(o)}</option>`).join("")}
    </select>${hint ? `<span class="hint">${esc(hint)}</span>` : ""}</div>`;
}
function txt(opts) {
  const { label, path, value, span = "span-12", hint, placeholder } = opts;
  return `<div class="field ${span}"><label for="f_${esc(path)}">${esc(label)}</label>
    <textarea data-path="${esc(path)}" data-fkey="${esc(path)}" data-type="text" id="f_${esc(path)}" ${placeholder ? `placeholder="${esc(placeholder)}"` : ""}>${esc(value ?? "")}</textarea>
    ${hint ? `<span class="hint">${esc(hint)}</span>` : ""}</div>`;
}
function chk(opts) {
  const { label, path, checked, hint, span = "span-4" } = opts;
  return `<div class="field ${span}"><label>&nbsp;</label>
    <label class="validation" style="cursor:pointer">
      <input type="checkbox" data-path="${esc(path)}" data-fkey="${esc(path)}" data-type="bool" ${checked ? "checked" : ""}>
      <span><strong>${esc(label)}</strong>${hint ? `<span>${esc(hint)}</span>` : ""}</span></label></div>`;
}
function section(id, title, body, extra = "") {
  const open = state.ui.openSections.has(id);
  return `<details class="accordion" data-section="${esc(id)}" ${open ? "open" : ""}>
    <summary><span>${esc(title)}${extra ? ` <span class="tiny muted">· ${esc(extra)}</span>` : ""}</span></summary>
    <div class="accordion-body">${body}</div></details>`;
}

/* ------------------------------- apertura ------------------------------- */
function openProject(id, productId = "") {
  const p = state.projects.find(x => x.id === id);
  if (!p) return;
  state.selectedId = id;
  state.draft = clone(p);
  state.draftBaseline = clone(p);
  state.drawerMode = p.state === "Borrador" ? "sale" : "detail";
  state.wizardStep = p.state === "Borrador" ? 1 : 1;
  if (productId) state.ui.openSections.add("sec-products");
  openDrawer();
  if (productId) {
    setTimeout(() => {
      const el = document.querySelector(`#drawerBody [data-product-anchor="${CSS.escape(productId)}"]`);
      if (el) el.scrollIntoView({ block: "center" });
    }, 60);
  }
}
function newSale() {
  state.selectedId = null;
  const p = makeProject({
    state: "Borrador", saleDate: dateISO(), seller: currentUser(),
    products: [makeProduct({ name: "", hoursSold: 0, routing: "Otra" })],
    contacts: [makeContact({ primary: true })]
  });
  p.coordinator = resolveCoordinator(p);
  state.draft = p;
  state.draftBaseline = clone(p);
  state.drawerMode = "sale";
  state.wizardStep = 1;
  openDrawer();
}
let lastFocusedBeforeDrawer = null;
function openDrawer() {
  lastFocusedBeforeDrawer = document.activeElement;
  renderDrawer();
  const drawer = document.getElementById("drawer");
  drawer.classList.add("open");
  drawer.setAttribute("aria-hidden", "false");
  document.getElementById("drawerBackdrop").classList.add("open");
  setTimeout(() => {
    const first = drawer.querySelector("input,select,textarea,button");
    if (first) first.focus();
  }, 40);
}
function isDirty() {
  return state.draft && state.draftBaseline && JSON.stringify(state.draft) !== JSON.stringify(state.draftBaseline);
}
function closeDrawer(force = false) {
  if (!force && isDirty()) {
    confirmModal("Hay cambios sin guardar",
      "Si cierra la ficha ahora, los cambios del formulario se descartan.",
      [{ label: "Seguir editando", kind: "" }, { label: "Descartar cambios", kind: "btn-danger", action: () => closeDrawer(true) }]);
    return;
  }
  const drawer = document.getElementById("drawer");
  drawer.classList.remove("open");
  drawer.setAttribute("aria-hidden", "true");
  document.getElementById("drawerBackdrop").classList.remove("open");
  state.draft = null; state.draftBaseline = null; state.selectedId = null; state.drawerMode = null;
  if (lastFocusedBeforeDrawer && document.contains(lastFocusedBeforeDrawer)) lastFocusedBeforeDrawer.focus();
}

/* ------------------------------- render ------------------------------- */
function renderDrawer() { renderDrawerHead(); renderDrawerBody(); renderDrawerFooter(); }
function renderDrawerHead() {
  const p = state.draft; if (!p) return;
  const isSale = state.drawerMode === "sale";
  const gState = projectGlobalState(p), cond = projectCondition(p);
  document.getElementById("drawerHead").innerHTML = `
    <div class="drawer-title">
      <span>${esc(isSale ? "Registro de venta" : p.company || "Empresa sin definir")}</span>
      <h2 id="drawerHeading">${esc(p.code)}${isSale ? "" : ` · ${esc(p.company)}`}</h2>
      <p>${esc(p.type)} · ${esc(p.ppr || "Sin PPR")} · ${(p.products || []).length} producto(s) · ${fmtNum(projectHoursSold(p))} h vendidas${p.demo ? " · demo" : ""}</p>
    </div>
    ${isSale ? pill("Borrador", "gray") : `${pill(gState, stateColor(gState))} ${pill(cond, conditionColor(cond))}`}
    <button class="btn btn-icon btn-ghost" data-action="close-drawer" aria-label="Cerrar ficha">×</button>`;
}
function renderDrawerBody() {
  const p = state.draft; if (!p) return;
  document.getElementById("drawerBody").innerHTML =
    state.drawerMode === "sale" ? renderSaleWizard(p) : renderProjectDetail(p);
  syncNumberDisplays();
}
function rerenderDrawerBody() {
  const body = document.getElementById("drawerBody");
  const active = document.activeElement;
  const key = active && body.contains(active) ? active.getAttribute("data-fkey") : null;
  const caret = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const scroll = body.scrollTop;
  renderDrawerBody();
  renderDrawerHead();
  renderDrawerFooter();
  body.scrollTop = scroll;
  if (key) {
    const el = body.querySelector(`[data-fkey="${CSS.escape(key)}"]`);
    if (el) {
      el.focus();
      if (caret !== null && typeof el.setSelectionRange === "function" && ["text", "search", "url", "tel", "password"].includes(el.type)) {
        try { el.setSelectionRange(caret, caret); } catch (e) { /* tipos que no lo soportan */ }
      }
    }
  }
}
function syncNumberDisplays() {
  document.querySelectorAll("[data-live]").forEach(el => {
    const fn = { hoursSold: () => fmtNum(projectHoursSold(state.draft)) }[el.dataset.live];
    if (fn) el.textContent = fn();
  });
}

function renderClosurePanel(p) {

  return `<div class="validation-list" style="margin-bottom:12px">
      ${products.map(pr => {
        const ok = pr.status === "Cerrado";
        return `<div class="validation ${ok ? "ok" : "fail"}">

          <div><strong>${esc(pr.name)}</strong>
            <span>${esc(pr.status)} · ${fmtNum(pr.hoursExecuted)}/${fmtNum(pr.hoursSold)} h · entregable: ${esc(pr.deliverable?.description || pr.deliverable?.url || "sin registrar")}</span></div></div>`;

/* ---------------- 10. MODALES, AVISOS Y ACCIONES SOBRE PRODUCTOS ---------------- */

let modalHandlers = {};
function openModal(html) {
  document.getElementById("modal").innerHTML = html;
  document.getElementById("modalBackdrop").classList.add("open");
  setTimeout(() => {
    const el = document.querySelector("#modal input,#modal select,#modal textarea,#modal button");
    if (el) el.focus();
  }, 30);
}
function closeModal() {
  document.getElementById("modalBackdrop").classList.remove("open");
  modalHandlers = {};
}
function confirmModal(title, text, buttons) {
  modalHandlers = {};
  const html = `<div class="modal-head"><h2>${esc(title)}</h2>
      <button class="btn btn-icon btn-ghost" data-action="close-modal" aria-label="Cerrar">×</button></div>
    <div class="modal-body"><p style="font-size:11px;line-height:1.6;margin:0">${esc(text)}</p></div>
    <div class="modal-foot">${buttons.map((b, i) => {
      if (b.action) modalHandlers[i] = b.action;
      return `<button class="btn ${b.kind || ""}" data-modal-action="${i}">${esc(b.label)}</button>`;
    }).join("")}</div>`;
  openModal(html);
}
function toast(title, message = "", type = "success") {
  const zone = document.getElementById("toastZone");
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.innerHTML = `<strong>${esc(title)}</strong>${message ? esc(message) : ""}`;
  zone.appendChild(el);
  setTimeout(() => el.remove(), 4200);
}

/** Formularios de gestión del producto (§5.6 a §5.10). */
function productActionForm(kind, p, pr) {
  const contactOptions = (p.contacts || []).map(c => `${c.name}${c.primary ? " (principal)" : ""}`);
  const overdue = productCondition(pr, p) === "Retrasado";
  const forms = {
    accept: {
      title: `Aceptar la asignación · ${pr.name}`,
      intro: "La aceptación deja trazabilidad y activa el compromiso de contactar al cliente (RN-06).",
      fields: [{ id: "note", label: "Observación (opcional)", type: "textarea", span: "span-12" }],
      submit: "Aceptar asignación",
      run: v => {
        pr.acceptedAt = new Date().toISOString();
        pr.acceptedBy = currentUser();
        logEvent(p, { type: "Aceptado", entity: pr.name, field: "asignación", before: "pendiente", after: `aceptada por ${currentUser()}`, reason: v.note });
      }
    },
    reassign: {
      title: `Reasignar · ${pr.name}`,
      intro: "La reasignación genera una nueva notificación y reinicia la aceptación (RN-06).",
      fields: [
        { id: "owner", label: "Nuevo responsable *", type: "text", list: "dlPeople", value: "", required: true, span: "span-6" },
        { id: "reason", label: "Motivo *", type: "textarea", required: true, span: "span-12" }
      ],
      submit: "Reasignar",
      run: v => {
        const before = pr.owner;
        pr.owner = v.owner;
        pr.assignedAt = new Date().toISOString();
        pr.acceptedAt = ""; pr.acceptedBy = "";
        logEvent(p, { type: "Reasignado", entity: pr.name, field: "responsable", before, after: v.owner, reason: v.reason });
        queueNotification(p, { scope: "product", to: v.owner, productId: pr.id, productName: pr.name, reason: `Reasignación: ${v.reason}` });
      }
    },
    contact: {
      title: `Registrar contacto con el cliente · ${pr.name}`,
      intro: "Confirme alcance, disponibilidad, sedes y recursos. El contacto habilita la programación definitiva (§5.7).",
      fields: [
        { id: "date", label: "Fecha del contacto *", type: "date", value: dateISO(), required: true, span: "span-4" },
        { id: "contact", label: "Persona contactada", type: "select", options: contactOptions.length ? contactOptions : ["Sin contactos registrados"], span: "span-8" },
        { id: "note", label: "Resultado del contacto *", type: "textarea", required: true, span: "span-12",
          hint: "Alcance confirmado, disponibilidad, sedes, accesos o condiciones acordadas." }
      ],
      submit: "Registrar contacto",
      run: v => {
        pr.contactedAt = v.date;
        pr.contactNote = v.note;
        logEvent(p, { type: "Contactado", entity: pr.name, field: "contacto con el cliente",
                      before: "sin registro", after: `${v.contact} · ${formatDate(v.date, true)}`, reason: v.note });
      }
    },
    schedule: {
      title: `${pr.scheduleConfirmed ? "Reprogramar" : "Programar"} · ${pr.name}`,
      intro: "El plan preliminar de la venta se convierte en programación confirmada con el cliente (RN-07).",
      guard: () => pr.contactedAt ? "" : "Registre primero el contacto con el cliente: la programación definitiva se construye a partir de ese contacto (§5.7).",
      fields: [
        { id: "startDate", label: "Inicio *", type: "date", value: pr.startDate || dateISO(), required: true, span: "span-4" },
        { id: "endDate", label: "Fecha objetivo *", type: "date", value: pr.endDate || "", required: true, span: "span-4" },
        { id: "confirmed", label: "Confirmada con el cliente", type: "checkbox", value: true, span: "span-4" },
        { id: "reason", label: pr.scheduleConfirmed ? "Motivo de la reprogramación *" : "Observación", type: "textarea",
          required: Boolean(pr.scheduleConfirmed), span: "span-12" }
      ],
      submit: pr.scheduleConfirmed ? "Reprogramar" : "Confirmar programación",
      validate: v => v.endDate < v.startDate ? "La fecha objetivo no puede ser anterior al inicio." : "",
      run: v => {
        const before = pr.scheduleConfirmed ? `${pr.startDate} → ${pr.endDate}` : "sin programación";
        const reprogram = pr.scheduleConfirmed;
        pr.startDate = v.startDate; pr.endDate = v.endDate;
        pr.scheduleConfirmed = Boolean(v.confirmed);
        if (pr.status === "Pendiente de contacto" && pr.scheduleConfirmed) pr.status = "Programado";
        logEvent(p, { type: reprogram ? "Reprogramado" : "Programado", entity: pr.name, field: "programación",
                      before, after: `${v.startDate} → ${v.endDate}`, reason: v.reason });
      }
    },
    progress: {
      title: `Actualizar avance · ${pr.name}`,
      intro: overdue
        ? "El producto está retrasado: registre causa, acción y nueva fecha antes de continuar (RN-08)."
        : "Registre avance, horas utilizadas y la próxima acción (§5.8).",
      fields: [
        ...(usesMilestoneProgress(pr)
          ? [{ id: "info", label: "Avance", type: "static", value: `${fmtPct(productProgress(pr))} calculado desde los hitos. Edite los hitos en la ficha del proyecto.`, span: "span-6" }]
          : [{ id: "progress", label: "Avance %", type: "number", value: pr.progress, min: 0, max: 100, span: "span-3" }]),
        { id: "hoursExecuted", label: "Horas ejecutadas", type: "number", value: pr.hoursExecuted, min: 0, step: 0.5, span: "span-3" },
        { id: "note", label: "Próxima acción o novedad *", type: "textarea", required: true, span: "span-12" },
        ...(overdue ? [
          { id: "cause", label: "Causa del retraso *", type: "textarea", required: true, span: "span-6" },
          { id: "action", label: "Acción correctiva *", type: "textarea", required: true, span: "span-6" },
          { id: "owner", label: "Responsable de la acción *", type: "text", list: "dlPeople", value: pr.owner, required: true, span: "span-6" },
          { id: "newDate", label: "Nueva fecha objetivo *", type: "date", required: true, span: "span-6" }
        ] : [])
      ],
      submit: "Guardar actualización",
      run: v => {
        const before = `${fmtPct(productProgress(pr))} · ${fmtNum(pr.hoursExecuted)} h`;
        if (!usesMilestoneProgress(pr) && v.progress !== undefined) pr.progress = clamp(v.progress, 0, 100);
        pr.hoursExecuted = Number(v.hoursExecuted) || 0;
        if (pr.status === "Programado") pr.status = "En ejecución";
        if (overdue) {
          pr.novelties.unshift(makeNovelty({ type: "Retraso", cause: v.cause, action: v.action, owner: v.owner, newDate: v.newDate }));
          const beforeDate = pr.endDate;
          pr.endDate = v.newDate;
          logEvent(p, { type: "Reprogramado", entity: pr.name, field: "fecha objetivo", before: beforeDate, after: v.newDate, reason: v.cause });
        }
        logEvent(p, { type: "Actualizado", entity: pr.name, field: "avance y horas",
                      before, after: `${fmtPct(productProgress(pr))} · ${fmtNum(pr.hoursExecuted)} h`, reason: v.note });
      }
    },
    suspend: {
      title: `Suspender · ${pr.name}`,
      intro: "Toda suspensión exige causa, acción correctiva, responsable y nueva fecha de revisión (RN-08).",
      fields: [
        { id: "cause", label: "Causa *", type: "textarea", required: true, span: "span-6" },
        { id: "action", label: "Acción correctiva *", type: "textarea", required: true, span: "span-6" },
        { id: "owner", label: "Responsable *", type: "text", list: "dlPeople", value: pr.owner, required: true, span: "span-6" },
        { id: "newDate", label: "Fecha de revisión *", type: "date", required: true, span: "span-6" }
      ],
      submit: "Suspender producto",
      run: v => {
        const before = pr.status;
        pr.status = "Suspendido";
        pr.novelties.unshift(makeNovelty({ type: "Suspensión", cause: v.cause, action: v.action, owner: v.owner, newDate: v.newDate }));
        logEvent(p, { type: "Suspendido", entity: pr.name, field: "estado operativo", before, after: "Suspendido", reason: v.cause });
      }
    },
    resume: {
      title: `Reanudar · ${pr.name}`,
      intro: "La reanudación se registra como evento y devuelve el producto a «En ejecución» (RN-09).",
      fields: [
        { id: "note", label: "Condiciones de la reanudación *", type: "textarea", required: true, span: "span-12" },
        { id: "endDate", label: "Nueva fecha objetivo", type: "date", value: pr.endDate, span: "span-6" }
      ],
      submit: "Reanudar producto",
      run: v => {
        pr.status = "En ejecución";
        if (v.endDate && v.endDate !== pr.endDate) {
          logEvent(p, { type: "Reprogramado", entity: pr.name, field: "fecha objetivo", before: pr.endDate, after: v.endDate, reason: v.note });
          pr.endDate = v.endDate;
        }
        pr.novelties.unshift(makeNovelty({ type: "Reanudación", cause: v.note, action: "Reanudación de la ejecución", owner: pr.owner, newDate: v.endDate || pr.endDate }));
        logEvent(p, { type: "Reanudado", entity: pr.name, field: "estado operativo", before: "Suspendido", after: "En ejecución", reason: v.note });
      }
    },
    finish: {
      title: `Finalizar producto · ${pr.name}`,
      intro: "Un producto se finaliza con entregable, horas ejecutadas, fecha real y validación del responsable (RN-10).",
      fields: [
        { id: "description", label: "Entregable o evidencia *", type: "text", list: "dlDeliverables", value: pr.deliverable?.description, required: true, span: "span-6" },
        { id: "url", label: "Enlace o ubicación", type: "text", value: pr.deliverable?.url, span: "span-6" },

        { id: "validatedBy", label: "Validado por *", type: "text", list: "dlPeople", value: currentUser(), required: true, span: "span-4" }
      ],
      submit: "Finalizar producto",
      run: v => {
        const before = pr.status;
        pr.deliverable = { description: v.description, url: v.url, validatedBy: v.validatedBy, validatedAt: v.finishedAt };

/* ------------------- 11. GUARDAR, ACTIVAR Y ELIMINAR ------------------- */

function collectDiffs(before, after, prefix = "") {
  const diffs = [];
  const walk = (a, b, path) => {
    if (Array.isArray(a) || Array.isArray(b)) {
      const la = Array.isArray(a) ? a : [], lb = Array.isArray(b) ? b : [];
      const max = Math.max(la.length, lb.length);
      for (let i = 0; i < max; i++) walk(la[i], lb[i], `${path}${path ? "." : ""}${i}`);
      return;
    }
    if (a && typeof a === "object" || b && typeof b === "object") {
      const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
      keys.forEach(k => walk(a?.[k], b?.[k], `${path}${path ? "." : ""}${k}`));
      return;
    }
    if (String(a ?? "") !== String(b ?? "")) diffs.push({ path, before: a, after: b });
  };
  walk(before, after, prefix);
  return diffs.filter(d => !/^log(\.|$)/.test(d.path))
              .filter(d => !/(^|\.)(updatedAt|lastUpdateAt|id)$/.test(d.path));
}
function describeDiff(d, project) {
  const m = /^products\.(\d+)\.(.+)$/.exec(d.path);
  if (m) {
    const pr = (project.products || [])[Number(m[1])];
    return { entity: pr ? pr.name : `Producto ${Number(m[1]) + 1}`, field: m[2] };
  }
  const c = /^contacts\.(\d+)\.(.+)$/.exec(d.path);
  if (c) {
    const ct = (project.contacts || [])[Number(c[1])];
    return { entity: ct ? `Contacto ${ct.name || Number(c[1]) + 1}` : `Contacto ${Number(c[1]) + 1}`, field: c[2] };
  }
  return { entity: "Proyecto", field: d.path };
}
function sensitiveDiffs(diffs) {
  return diffs.filter(d => SENSITIVE_FIELDS.some(s => s.path.test(d.path)));
}
function commitDraft({ reason = "", skipDiff = false } = {}) {
  const draft = state.draft;
  const baseline = state.draftBaseline;
  const diffs = skipDiff ? [] : collectDiffs(baseline, draft);
  diffs.forEach(d => {
    const info = describeDiff(d, draft);
    logEvent(draft, { type: "Editado", entity: info.entity, field: info.field,
                      before: d.before, after: d.after, reason });
  });
  draft.updatedAt = new Date().toISOString();
  const i = state.projects.findIndex(x => x.id === state.selectedId);
  if (i >= 0) state.projects[i] = clone(draft);
  else { state.projects.unshift(clone(draft)); state.selectedId = draft.id; }
  state.draftBaseline = clone(draft);
  syncCatalogs();
  saveState();
  renderApp();
  return diffs.length;
}
function saveProject() {
  const p = state.draft;
  if (!p) return;
  const problems = [];
  if (!String(p.company).trim()) problems.push("empresa");
  if (!String(p.ppr).trim()) problems.push("PPR");
  if ((p.products || []).some(x => !String(x.name).trim())) problems.push("nombre de todos los productos");
  if ((p.products || []).some(x => !(Number(x.hoursSold) > 0))) problems.push("horas mayores que cero en cada producto");
  if (problems.length) { toast("No se puede guardar", `Complete: ${problems.join(", ")}.`, "error"); return; }
  if ((p.contacts || []).length > 3) { toast("Demasiados contactos", "Máximo tres contactos por proyecto.", "error"); return; }

  const diffs = collectDiffs(state.draftBaseline, p);
  if (!diffs.length) { toast("Sin cambios", "No hay modificaciones para guardar."); return; }
  const sensitive = sensitiveDiffs(diffs);
  if (sensitive.length && p.state !== "Borrador") {
    askReason(sensitive, reason => {
      commitDraft({ reason });
      renderDrawer();
      toast("Cambios guardados", `${diffs.length} campo(s) actualizados con motivo registrado.`);
    });
    return;
  }
  const n = commitDraft();
  renderDrawer();
  toast("Cambios guardados", `${n} campo(s) actualizados en ${p.code}.`);
}

function openSummary() {

    .sort((a, b) => b.count - a.count);
  const byPpr = build(p => p.ppr || "Sin PPR", "ppr");
  const byCoordinator = build(p => p.coordinator || "Sin coordinación", "coordinator");
  const products = projects.flatMap(p => (p.products || []).map(pr => ({ pr, p })));
  const byRouting = [...groupBy(products, x => x.pr.routing).entries()]
    .map(([label, list]) => ({ label, key: "routing", count: list.length, hours: sum(list, x => x.pr.hoursSold),
                               risky: list.filter(x => ["En riesgo", "Retrasado"].includes(productCondition(x.pr, x.p))).length }))
    .sort((a, b) => b.count - a.count);

    .sort((a, b) => b.count - a.count);
  const max = Math.max(1, ...[...byPpr, ...byCoordinator, ...byRouting, ...byOwner].map(x => x.count));

      ${filterValue(r.key, r.label, r.label)}
      <div class="bar"><span style="width:${r.count / max * 100}%"></span></div>

        <div><h3 style="font-size:12px">Por categoría de producto</h3><div class="bar-list">${bars(byRouting)}</div></div>
        <div><h3 style="font-size:12px">Por responsable</h3><div class="bar-list">${bars(byOwner)}</div></div>

function exportCSV() {
  const rows = visibleProjects().flatMap(p => (p.products || []).length
    ? p.products.map(pr => productRow(p, pr))
    : [productRow(p, makeProduct({ name: "(sin productos)" }))]);
  if (!rows.length) { toast("Sin datos para exportar", "Retire los filtros o registre una venta.", "warning"); return; }
  download(`rehavid_portafolio_${dateISO()}.csv`, "\uFEFF" + toCSV(rows), "text/csv;charset=utf-8");
}
function productRow(p, pr) {
  return {
    codigo: p.code, empresa: p.company, ppr: p.ppr, tipo: p.type, estado_proyecto: p.state,
    estado_global: projectGlobalState(p), condicion_proyecto: projectCondition(p),
    coordinacion: p.coordinator, vendedor: p.seller, orden_servicio: p.commercialRef, fecha_venta: p.saleDate,
    producto: pr.name, categoria: pr.routing, tecnologia: pr.technology, complejidad: pr.complexity,
    responsable: pr.owner, estado_producto: pr.status, condicion_producto: productCondition(pr, p),
    aceptada: pr.acceptedAt ? "Sí" : "No", contactado: pr.contactedAt || "",
    programacion_confirmada: pr.scheduleConfirmed ? "Sí" : "No",
    inicio: pr.startDate, fecha_objetivo: pr.endDate,
    horas_vendidas: pr.hoursSold, horas_ejecutadas: pr.hoursExecuted, saldo_horas: productHoursBalance(pr),
    avance: Math.round(productProgress(pr)),
    entregable: pr.deliverable?.description || "", alertas: productAlerts(pr, p).map(a => a.label).join(" | "),
    valor_contratado: p.value, valor_facturado: p.invoicedValue,
    ultima_actualizacion: pr.lastUpdateAt || p.updatedAt
  };
}
function exportAlerts() {
  const rows = visibleProjects().flatMap(p => projectAlerts(p).map(a => ({
    alerta: a.label, severidad: a.severity, detalle: a.detail,
    codigo: p.code, empresa: p.company, producto: a.productName, responsable: a.owner,
    estado_producto: (p.products.find(x => x.id === a.productId) || {}).status || "",
    condicion: productCondition(p.products.find(x => x.id === a.productId) || {}, p)
  })));
  if (!rows.length) { toast("Sin alertas para exportar", "", "warning"); return; }
  download(`rehavid_alertas_${dateISO()}.csv`, "\uFEFF" + toCSV(rows), "text/csv;charset=utf-8");
}
function exportAudit() {
  const rows = state.projects.flatMap(p => (p.log || []).map(l => ({
    fecha: l.date, usuario: l.user, proyecto: p.code, empresa: p.company,
    evento: l.type, entidad: l.entity, campo: l.field, anterior: l.before, nuevo: l.after, motivo: l.reason
  }))).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha)));
  if (!rows.length) { toast("Sin registros de auditoría", "", "warning"); return; }
  download(`rehavid_auditoria_${dateISO()}.csv`, "\uFEFF" + toCSV(rows), "text/csv;charset=utf-8");

function parseCSV(text) {
  const rows = [];
  let row = [], cell = "", quote = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i], next = text[i + 1];
    if (ch === '"' && quote && next === '"') { cell += '"'; i++; }
    else if (ch === '"') quote = !quote;
    else if (ch === "," && !quote) { row.push(cell); cell = ""; }
    else if ((ch === "\n" || ch === "\r") && !quote) {
      if (ch === "\r" && next === "\n") i++;
      row.push(cell);
      if (row.some(x => x.trim())) rows.push(row);
      row = []; cell = "";
    } else cell += ch;
  }
  row.push(cell);
  if (row.some(x => x.trim())) rows.push(row);
  return rows;
}
/** Importación CSV no destructiva: solo se actualizan las columnas presentes en el archivo. */
const CSV_PROJECT_FIELDS = { empresa: "company", ppr: "ppr", tipo: "type", coordinacion: "coordinator",
                             vendedor: "seller", orden_servicio: "commercialRef", fecha_venta: "saleDate",
                             valor_contratado: "value", valor_facturado: "invoicedValue" };
const CSV_PRODUCT_FIELDS = { categoria: "routing", tecnologia: "technology", complejidad: "complexity",
                             responsable: "owner", estado_producto: "status", inicio: "startDate",
                             fecha_objetivo: "endDate", horas_vendidas: "hoursSold",
                             horas_ejecutadas: "hoursExecuted", avance: "progress" };
const CSV_NUMERIC = new Set(["value", "invoicedValue", "hoursSold", "hoursExecuted", "progress"]);
function importCSVText(text) {
  const rows = parseCSV(text);
  if (rows.length < 2) throw new Error("El archivo CSV no tiene datos.");
  const headers = rows[0].map(h => norm(h).replace(/\s+/g, "_"));
  let created = 0, updatedProjects = 0, updatedProducts = 0, skipped = 0;
  rows.slice(1).forEach(r => {
    const o = {};
    headers.forEach((h, i) => { if (h) o[h] = (r[i] ?? "").trim(); });
    const code = o.codigo || o.code;
    if (!code) { skipped++; return; }
    let p = state.projects.find(x => norm(x.code) === norm(code));
    if (!p) {
      p = makeProject({ code, company: o.empresa || "", state: "Borrador" });
      logEvent(p, { type: "Importado", entity: "Proyecto", after: code, reason: "Creado desde importación CSV como borrador (RN-04)." });
      state.projects.push(p);
      created++;
    } else updatedProjects++;
    Object.entries(CSV_PROJECT_FIELDS).forEach(([col, field]) => {
      if (!(col in o) || o[col] === "") return;
      const value = CSV_NUMERIC.has(field) ? Number(o[col]) || 0 : o[col];
      if (String(p[field] ?? "") === String(value)) return;
      logEvent(p, { type: "Importado", entity: "Proyecto", field, before: p[field], after: value, reason: "Importación CSV." });
      p[field] = value;
    });
    const productName = o.producto || o.product;
    if (productName && productName !== "(sin productos)") {
      let pr = (p.products || []).find(x => norm(x.name) === norm(productName));
      if (!pr) { pr = makeProduct({ name: productName }); p.products.push(pr); }
      Object.entries(CSV_PRODUCT_FIELDS).forEach(([col, field]) => {
        if (!(col in o) || o[col] === "") return;
        let value = CSV_NUMERIC.has(field) ? Number(o[col]) || 0 : o[col];
        if (field === "status" && !PRODUCT_STATES.includes(value)) return;
        if (field === "routing" && !ROUTINGS.includes(value)) return;
        if (String(pr[field] ?? "") === String(value)) return;
        logEvent(p, { type: "Importado", entity: pr.name, field, before: pr[field], after: value, reason: "Importación CSV." });
        pr[field] = value;
      });
      updatedProducts++;
    }
    p.updatedAt = new Date().toISOString();
  });
  state.projects = state.projects.map(makeProject);
  syncCatalogs();
  saveState();
  renderApp();
  toast("CSV importado", `${created} proyecto(s) creados · ${updatedProjects} actualizados · ${updatedProducts} producto(s) · ${skipped} fila(s) sin código.`);
}
function importFile(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const text = String(reader.result || "");
      if (file.name.toLowerCase().endsWith(".json")) {
        const data = JSON.parse(text);
        if (!Array.isArray(data.projects)) throw new Error("El archivo JSON no contiene proyectos.");
        confirmModal("Restaurar respaldo JSON",
          `Se reemplazarán los ${state.projects.length} proyecto(s) actuales por los ${data.projects.length} del archivo. Descargue un respaldo antes de continuar.`,
          [{ label: "Cancelar", kind: "" },
           { label: "Reemplazar la base", kind: "btn-danger", action: () => {
              state.projects = data.projects.map(makeProject);
              state.outbox = Array.isArray(data.outbox) ? data.outbox : [];
              state.settings = mergeDeep(clone(DEFAULT_SETTINGS), data.settings || {});
              syncCatalogs(); saveState(); closeModal(); renderApp();
              toast("Respaldo restaurado", `${state.projects.length} proyecto(s) cargados.`);
            } }]);
      } else importCSVText(text);
    } catch (e) {
      console.error(e);
      toast("No fue posible importar", e.message, "error");
    }
  };
  reader.readAsText(file, "UTF-8");
}

/* ------------------------ 13. ENTRADA DE DATOS EN LA FICHA ------------------------ */

// Rutas que cambian la estructura del formulario y obligan a redibujar la ficha
// (conservando foco, posición del cursor y secciones abiertas).
const STRUCTURAL_PATHS = [/^products\.\d+\.routing$/, /^products\.\d+\.status$/, /^type$/];

function handleDraftInput(el) {
  if (!state.draft) return false;
  const path = el.dataset.path;
  if (!path) return false;
  let value;
  if (el.type === "checkbox") value = el.checked;
  else if (el.dataset.type === "number" || el.type === "number") value = Number(el.value) || 0;
  else value = el.value;

  if (/^products\.\d+\.progress$/.test(path) || /\.milestones\.\d+\.progress$/.test(path)) value = clamp(value, 0, 100);
  setPath(state.draft, path, value);

  const m = /^products\.(\d+)\.routing$/.exec(path);
  if (m) {
    const pr = state.draft.products[Number(m[1])];
    if (value !== "Medición objetiva") pr.technology = "";
    if (value !== "Diseño") pr.complexity = "";
    if (!pr.owner) pr.owner = resolveProductOwner(state.draft, pr);
  }
  if (path === "type") state.draft.coordinator = resolveCoordinator(state.draft) || state.draft.coordinator;
  if (/^products\.\d+\.status$/.test(path)) {
    const pr = state.draft.products[Number(/^products\.(\d+)\./.exec(path)[1])];
    if (["Finalizado", "Cerrado"].includes(pr.status)) pr.progress = 100;
  }
  return STRUCTURAL_PATHS.some(rx => rx.test(path));
}
function addRow(path) {
  if (!state.draft) return;
  if (path === "products") {
    const pr = makeProduct({ name: "", hoursSold: 0, routing: "Otra" });
    pr.owner = resolveProductOwner(state.draft, pr);
    if (state.draft.state === "Activo") { pr.assignedAt = new Date().toISOString(); }
    state.draft.products.push(pr);
  } else if (path === "contacts") {
    if ((state.draft.contacts || []).length >= 3) { toast("Máximo tres contactos", "La especificación permite entre uno y tres contactos.", "warning"); return; }
    state.draft.contacts.push(makeContact({ primary: !(state.draft.contacts || []).length }));
  } else {
    const list = getPath(state.draft, path);
    if (Array.isArray(list)) list.push(makeMilestone({ name: "", date: "" }));
  }
  rerenderDrawerBody();
}
function removeRow(path, index) {
  if (!state.draft) return;
  const list = path === "products" ? state.draft.products
             : path === "contacts" ? state.draft.contacts
             : getPath(state.draft, path);
  if (!Array.isArray(list)) return;
  const removed = list[index];
  const finish = () => {
    list.splice(index, 1);
    if (path === "contacts" && state.draft.contacts.length && state.draft.contacts.every(c => !c.primary)) state.draft.contacts[0].primary = true;
    rerenderDrawerBody();
  };
  if (path === "products" && removed && (removed.name || removed.hoursSold)) {
    confirmModal("Eliminar producto",
      `Se eliminará «${removed.name || "producto sin nombre"}» con sus hitos, novedades y entregable. El cambio queda en la bitácora al guardar.`,
      [{ label: "Cancelar", kind: "" }, { label: "Eliminar", kind: "btn-danger", action: () => { finish(); closeModal(); } }]);
    return;
  }
  finish();
}

        const ids = state.projects.filter(p => p.demo).map(p => p.id);
        state.projects = state.projects.filter(p => !p.demo);

      } }]),

document.addEventListener("change", e => {
  const el = e.target;

  if (el.matches("[data-filter-select]")) { setSingleFilter(el.dataset.filterSelect, el.value); return; }
  if (el.id === "sortProjects") { state.sort = el.value; renderView(); return; }
  if (el.id === "assignmentOwner") { state.ui.assignmentOwner = el.value; renderApp(); return; }
  if (el.id === "sessionUser") { state.session.user = el.value; saveState(); renderApp(); return; }
  if (el.id === "calendarCompany") { state.ui.calendarCompany = el.value; renderView(); return; }
  if (el.id === "calendarMonth") { state.calendar.month = Number(el.value); renderView(); return; }
  if (el.id === "calendarYear") { state.calendar.year = Number(el.value); renderView(); return; }

  if (el.matches("[data-sla]")) {
    state.settings.sla[el.dataset.sla] = clamp(Number(el.value) || 0, 0, 1000);
    saveState(); renderApp();
    return;
  }
  if (el.matches("[data-setting]")) { state.settings[el.dataset.setting] = el.value; saveState(); return; }
  if (el.matches("[data-catalog]")) {
    state.settings.catalogs[el.dataset.catalog] = unique(el.value.split(",").map(x => x.trim()));
    saveState(); renderDataLists();
    return;
  }
  const ruleRow = el.closest("[data-rule]");
  if (ruleRow && el.matches("[data-rule-field]")) {
    const rule = state.settings.assignmentRules.find(r => r.id === ruleRow.dataset.rule);
    if (rule) {
      rule[el.dataset.ruleField] = el.value;
      if (el.dataset.ruleField === "scope") rule.field = rule.scope === "project" ? "type" : "routing";
      saveState(); renderApp();
    }
    return;
  }
  if (el.matches("[data-contact-primary]")) {
    const i = Number(el.dataset.contactPrimary);
    (state.draft.contacts || []).forEach((c, j) => c.primary = j === i);
    rerenderDrawerBody();
    return;
  }
  if (el.matches("[data-path]")) {
    const structural = handleDraftInput(el);
    if (structural) rerenderDrawerBody();
    else { renderDrawerHead(); renderDrawerFooter(); syncNumberDisplays(); }
    return;
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (document.getElementById("modalBackdrop").classList.contains("open")) closeModal();
    else if (document.getElementById("drawer").classList.contains("open")) closeDrawer();
    return;
  }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    document.getElementById("globalSearch").focus();
    return;
  }
  if (e.key === "Tab") trapFocus(e);
});
function trapFocus(e) {
  const modalOpen = document.getElementById("modalBackdrop").classList.contains("open");
  const drawerOpen = document.getElementById("drawer").classList.contains("open");
  const container = modalOpen ? document.getElementById("modal") : drawerOpen ? document.getElementById("drawer") : null;
  if (!container) return;
  const focusable = [...container.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')]
    .filter(el => el.offsetParent !== null);
  if (!focusable.length) return;
  const first = focusable[0], last = focusable[focusable.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
}
window.addEventListener("beforeunload", e => {
  if (isDirty()) { e.preventDefault(); e.returnValue = ""; }
});
