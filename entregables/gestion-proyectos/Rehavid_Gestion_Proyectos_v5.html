<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Rehavid · Gestión de proyectos: venta, activación, asignación automática, programación confirmada, ejecución, alertas y cierre por producto." />
  <title>Rehavid | Gestión de proyectos</title>
  <style>
    :root{
      --bg:#f5f7fa; --surface:#fff; --surface-2:#f8fafc; --text:#172033; --muted:#64748b; --line:#dfe6ee;
      --brand:#135fa7; --brand-2:#0d477f; --brand-soft:#eaf3fc; --navy:#0d2744;
      --green:#16845b; --green-soft:#e7f6ef; --amber:#b97300; --amber-soft:#fff3d9;
      --red:#c83d4f; --red-soft:#fdecef; --violet:#5b3fa8; --violet-soft:#efeaff;
      --shadow:0 8px 24px rgba(18,45,77,.08); --radius:14px; --sidebar:224px;
    }
    *{box-sizing:border-box}
    html{font-size:15px}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    a{color:var(--brand)}
    .hidden{display:none!important}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    :focus-visible{outline:2px solid var(--brand);outline-offset:2px}

    /* ---------- Estructura ---------- */
    .app{min-height:100vh;display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr)}
    .sidebar{position:sticky;top:0;height:100vh;background:var(--navy);color:#fff;padding:20px 14px;display:flex;flex-direction:column;gap:18px;z-index:20}
    .brand{display:flex;align-items:center;gap:10px;padding:0 8px}
    .brand-mark{width:38px;height:38px;border-radius:11px;background:#fff;color:var(--brand-2);display:grid;place-items:center;font-weight:900}
    .brand strong{display:block;font-size:14px;letter-spacing:.08em}
    .brand span{display:block;font-size:10px;color:#b9c9da;margin-top:2px}
    .nav{display:grid;gap:4px}
    .nav button{border:0;background:transparent;color:#cbd8e6;border-radius:10px;padding:10px 12px;text-align:left;font-weight:720;display:flex;align-items:center;gap:10px;width:100%}
    .nav button:hover{background:rgba(255,255,255,.08);color:#fff}
    .nav button.active{background:#fff;color:var(--brand-2)}
    .nav-icon{width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:10px;flex:none}
    .nav button.active .nav-icon{background:var(--brand-soft)}
    .nav-badge{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:9px;font-weight:800;padding:2px 6px;min-width:18px;text-align:center}
    .nav button.active .nav-badge{background:var(--red);color:#fff}
    .nav-badge.zero{display:none}
    .sidebar-foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.12);padding:12px 8px 0;color:#aebfd0;font-size:10px;line-height:1.5}
    .save-state{display:flex;align-items:center;gap:7px;margin-top:8px}
    .save-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;flex:none}

    .workspace{min-width:0}
    .topbar{min-height:72px;background:rgba(255,255,255,.97);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 24px;position:sticky;top:0;z-index:15;flex-wrap:wrap}
    .mobile-menu{display:none}
    .page-title{min-width:210px}
    .page-title h1{font-size:19px;margin:0;letter-spacing:-.025em}
    .page-title p{font-size:11px;color:var(--muted);margin:3px 0 0}
    .search{flex:1;min-width:220px;max-width:560px;position:relative}
    .search input{width:100%;height:40px;border:1px solid var(--line);border-radius:10px;padding:0 14px 0 38px;background:var(--surface-2);outline:none}
    .search input:focus{border-color:#8eb8df;background:#fff;box-shadow:0 0 0 3px rgba(19,95,167,.1)}
    .search span{position:absolute;left:14px;top:9px;color:var(--muted)}
    .top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .session-user{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:9px;padding:4px 8px;background:#fff}
    .session-user label{font-size:9px;color:var(--muted);font-weight:780;text-transform:uppercase;letter-spacing:.04em}
    .session-user select{border:0;outline:none;font-size:11px;font-weight:760;max-width:150px;background:transparent}

    .btn{border:1px solid var(--line);background:#fff;color:var(--text);border-radius:9px;padding:9px 12px;font-weight:760;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}
    .btn:hover{border-color:#b5c5d5;background:#f8fafc}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
    .btn-primary:hover{background:var(--brand-2);border-color:var(--brand-2)}
    .btn-success{background:var(--green);border-color:var(--green);color:#fff}
    .btn-success:hover{background:#116b49;border-color:#116b49}
    .btn-danger{color:var(--red);border-color:#efc4cb}
    .btn-danger:hover{background:var(--red-soft)}
    .btn-ghost{border-color:transparent;background:transparent}
    .btn-sm{padding:7px 9px;font-size:11px}
    .btn-icon{width:38px;height:38px;padding:0}

    .content{padding:22px 24px 46px;max-width:1720px;margin:auto}
    .demo-banner{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid #f0d597;background:#fff8e8;color:#6f4e0a;border-radius:11px;padding:9px 12px;margin-bottom:14px;font-size:11px}

    /* ---------- Filtros ---------- */
    .filterbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .filterbar select{height:36px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 28px 0 10px;font-size:11px;min-width:132px;color:var(--text)}
    .filter-help{margin-left:auto;font-size:10px;color:var(--muted)}
    .active-filters{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 14px}
    .filter-chip{border:1px solid #c7dcef;background:var(--brand-soft);color:var(--brand-2);border-radius:999px;padding:5px 9px;font-size:10px;font-weight:760}
    .filter-chip:hover{background:#dbeafa}

    /* ---------- Indicadores ---------- */
    .metrics{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
    .metric{border:0;border-right:1px solid var(--line);background:#fff;text-align:left;padding:15px 16px;min-height:84px}
    .metric:last-child{border-right:0}
    .metric:hover{background:#fafcff}
    .metric[aria-pressed="true"]{background:var(--brand-soft)}
    .metric span{display:block;color:var(--muted);font-size:9px;font-weight:780;text-transform:uppercase;letter-spacing:.05em}
    .metric strong{display:block;font-size:24px;line-height:1;margin-top:8px;letter-spacing:-.04em}
    .metric small{display:block;color:var(--muted);font-size:9px;margin-top:5px}
    .metric.danger strong{color:var(--red)}
    .metric.warning strong{color:var(--amber)}
    .metric.info strong{color:var(--brand)}
    .hours-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;margin-bottom:14px}
    .hours-cell{padding:13px 16px;border-right:1px solid var(--line)}
    .hours-cell:last-child{border-right:0}
    .hours-cell span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;font-weight:780;letter-spacing:.05em}
    .hours-cell b{display:block;font-size:19px;margin-top:5px;letter-spacing:-.03em}
    .hours-cell small{display:block;font-size:9px;color:var(--muted);margin-top:3px}

    /* ---------- Flujo ---------- */
    .flow{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px;margin-bottom:14px}
    .flow-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;flex-wrap:wrap}
    .flow-head strong{font-size:12px}
    .flow-head span{font-size:9px;color:var(--muted)}
    .flow-row{display:grid;grid-template-columns:repeat(6,minmax(96px,1fr));gap:5px;overflow-x:auto}
    .flow-step{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px;text-align:left;min-width:96px}
    .flow-step:hover,.flow-step.selected{border-color:#86b5df;background:var(--brand-soft)}
    .flow-step b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .flow-step span{display:block;font-size:16px;font-weight:900;color:var(--brand);margin-top:3px}

    /* ---------- Paneles y tablas ---------- */
    .panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 1px 2px rgba(15,23,42,.02);overflow:hidden}
    .panel+.panel{margin-top:14px}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
    .panel-head h2{font-size:14px;margin:0}
    .panel-head p{font-size:10px;color:var(--muted);margin:3px 0 0;max-width:70ch}
    .panel-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    .table-wrap{overflow:auto}
    .data-table{width:100%;border-collapse:collapse;min-width:1100px}
    .data-table th{position:sticky;top:0;background:#f8fafc;color:#536579;font-size:9px;text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:10px 11px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
    .data-table td{padding:11px;border-bottom:1px solid #edf1f5;font-size:11px;vertical-align:middle}
    .data-table tbody tr:hover{background:#fbfdff}
    .project-link{border:0;background:transparent;padding:0;text-align:left;color:var(--text);font-weight:790}
    .project-link:hover{color:var(--brand);text-decoration:underline}
    .muted{color:var(--muted)}
    .tiny{font-size:9px}
    .nowrap{white-space:nowrap}
    .filter-value{font-weight:720;border-bottom:1px dashed #aab8c5;cursor:zoom-in;background:none;border-left:0;border-right:0;border-top:0;padding:0;font-size:inherit;color:inherit;text-align:left}
    .filter-value:hover{color:var(--brand)}

    .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:790;white-space:nowrap}
    .pill.blue{background:var(--brand-soft);color:var(--brand-2)}
    .pill.green{background:var(--green-soft);color:var(--green)}
    .pill.amber{background:var(--amber-soft);color:#7a4e00}
    .pill.red{background:var(--red-soft);color:#912838}
    .pill.gray{background:#eef2f6;color:#536273}
    .pill.violet{background:var(--violet-soft);color:var(--violet)}
    .dot{width:7px;height:7px;border-radius:50%;flex:none}
    .dot.green{background:var(--green)}.dot.amber{background:var(--amber)}.dot.red{background:var(--red)}.dot.gray{background:#94a3b8}

    .progress{height:6px;background:#edf2f6;border-radius:99px;overflow:hidden;min-width:70px;flex:1}
    .progress span{display:block;height:100%;background:var(--brand);border-radius:99px}
    .progress.red span{background:var(--red)}.progress.amber span{background:var(--amber)}.progress.green span{background:var(--green)}
    .progress-line{display:flex;align-items:center;gap:7px;min-width:110px}
    .progress-line b{font-size:10px;min-width:32px;text-align:right}
    .alert-cell{max-width:250px}
    .alert-cell strong{display:block;font-size:10px}
    .alert-cell span{display:block;font-size:9px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .empty{padding:46px 20px;text-align:center;color:var(--muted)}
    .empty strong{display:block;color:var(--text);font-size:15px;margin-bottom:6px}
    .empty p{font-size:11px;margin:0 auto 15px;max-width:540px;line-height:1.6}

    /* ---------- Empresas ---------- */
    .company-list{display:grid;gap:12px}
    .company-block{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
    .company-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:#fbfdff;border-bottom:1px solid var(--line)}
    .company-name{display:flex;align-items:center;gap:10px}
    .company-avatar{width:34px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand-2);display:grid;place-items:center;font-weight:900;font-size:11px;flex:none}
    .company-name h3{font-size:13px;margin:0}
    .company-name p{font-size:9px;color:var(--muted);margin:3px 0 0}
    .company-stats{display:flex;gap:14px}
    .company-stats span{font-size:9px;color:var(--muted);text-align:right}
    .company-stats b{display:block;color:var(--text);font-size:13px;margin-bottom:2px}
    .company-project{border-bottom:1px solid #edf1f5}
    .company-project:last-child{border-bottom:0}
    .company-project-summary{display:grid;grid-template-columns:32px minmax(240px,1.6fr) 120px 140px 120px 130px;gap:10px;align-items:center;padding:12px 14px}
    .company-project-summary:hover{background:#fbfdff}
    .expand-btn{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:8px;flex:none}
    .project-products{background:#f8fafc;border-top:1px solid #e9eef4;padding:10px 14px 14px 52px}

    /* ---------- Tarjeta de producto ---------- */
    .product-card{border:1px solid var(--line);background:#fff;border-radius:11px;margin-top:8px;overflow:hidden}
    .product-card.red{border-left:4px solid var(--red)}
    .product-card.amber{border-left:4px solid var(--amber)}
    .product-card.green{border-left:4px solid var(--green)}
    .product-card.gray{border-left:4px solid #cbd5e1}
    .product-top{display:grid;grid-template-columns:minmax(190px,1.5fr) 150px 130px 150px 110px;gap:10px;align-items:center;padding:11px 12px}
    .product-top strong{font-size:11px;display:block}
    .product-top small{display:block;color:var(--muted);font-size:9px;margin-top:2px}
    .product-actions{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 11px;border-top:1px dashed #e8eef4;margin-top:2px;padding-top:9px}
    .milestone-table{width:100%;border-collapse:collapse;background:#fbfdff}
    .milestone-table th,.milestone-table td{font-size:9px;padding:7px 10px;border-top:1px solid #edf1f5;text-align:left}
    .milestone-table th{color:var(--muted);font-weight:750}

    /* ---------- Alertas ---------- */
    .alert-group{border:1px solid var(--line);border-radius:11px;background:#fff;margin-bottom:10px;overflow:hidden}
    .alert-group-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:#fbfdff}
    .alert-group-head strong{font-size:12px}
    .alert-group-head p{margin:2px 0 0;font-size:9px;color:var(--muted)}
    .alert-count{margin-left:auto;font-size:11px;font-weight:850}
    .alert-row{display:grid;grid-template-columns:minmax(200px,1.4fr) minmax(160px,1fr) 130px 120px 110px;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid #edf1f5;font-size:10px}
    .alert-row:last-child{border-bottom:0}
    .alert-row:hover{background:#fbfdff}

    /* ---------- Asignaciones ---------- */
    .assign-card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:13px 14px;margin-bottom:10px}
    .assign-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap}
    .assign-head h3{font-size:13px;margin:0}
    .assign-head p{font-size:10px;color:var(--muted);margin:4px 0 0}
    .assign-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:11px 0}
    .assign-meta div span{display:block;font-size:8px;color:var(--muted);text-transform:uppercase;font-weight:800;letter-spacing:.04em}
    .assign-meta div b{display:block;font-size:11px;margin-top:3px}
    .steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
    .step-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:9px;font-weight:760;color:var(--muted);background:#fff}
    .step-chip.done{border-color:#bfe5d4;background:var(--green-soft);color:var(--green)}
    .step-chip.pending{border-color:#f0d597;background:var(--amber-soft);color:#7a4e00}

    /* ---------- Calendario ---------- */
    .calendar-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
    .calendar-title{text-align:center}
    .calendar-title strong{display:block;font-size:17px;text-transform:capitalize}
    .calendar-title span{font-size:9px;color:var(--muted)}
    .calendar-controls{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
    .calendar-controls select{height:34px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:10px;padding:0 8px}
    .calendar-metrics{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
    .calendar-metric{padding:12px 14px;border-right:1px solid var(--line)}
    .calendar-metric:last-child{border-right:0}
    .calendar-metric span{font-size:9px;color:var(--muted)}
    .calendar-metric b{display:block;font-size:18px;margin-top:4px}
    .holiday-strip{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:#fffaf0}
    .holiday-strip strong{font-size:9px;color:#7a4e00;margin-right:4px}
    .holiday-chip{font-size:9px;border:1px solid #efd79e;background:#fff5dd;color:#795000;border-radius:999px;padding:4px 7px}
    .calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(115px,1fr));overflow:auto}
    .weekday{background:#f7f9fc;color:#66778a;font-size:9px;font-weight:850;text-transform:uppercase;padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
    .day{min-height:120px;padding:7px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#fff}
    .day.out{background:#fafbfc;color:#9aa6b2}
    .day.today{box-shadow:inset 0 0 0 2px rgba(19,95,167,.28)}
    .day.holiday{background:#fffdf7}
    .day-head{display:flex;justify-content:space-between;gap:5px;font-size:10px;font-weight:850;margin-bottom:6px}
    .holiday-name{font-size:7px;color:#986300;text-align:right;max-width:80px}
    .event{display:block;width:100%;border:0;border-left:3px solid var(--brand);background:var(--brand-soft);color:var(--brand-2);border-radius:6px;text-align:left;padding:5px 6px;margin-top:4px}
    .event.red{border-left-color:var(--red);background:var(--red-soft);color:#8d2636}
    .event.amber{border-left-color:var(--amber);background:var(--amber-soft);color:#704900}
    .event.green{border-left-color:var(--green);background:var(--green-soft);color:#126746}
    .event b{display:block;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .event span{display:block;font-size:7px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .more-events{border:0;background:transparent;color:var(--brand);font-size:8px;font-weight:800;padding:3px 0}
    .agenda{margin-top:14px}
    .agenda details{border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:8px}
    .agenda summary{padding:11px 12px;font-size:11px;font-weight:780;cursor:pointer}
    .agenda-list{border-top:1px solid var(--line)}
    .agenda-item{display:grid;grid-template-columns:95px minmax(210px,1fr) 150px 120px;gap:10px;padding:9px 12px;border-bottom:1px solid #edf1f5;font-size:10px}
    .agenda-item:last-child{border-bottom:0}

    /* ---------- Administración ---------- */
    .admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
    .admin-section{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px}
    .admin-section h2{font-size:14px;margin:0 0 4px}
    .admin-section>p{font-size:10px;color:var(--muted);margin:0 0 14px;line-height:1.6}
    .form-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px}
    .field{grid-column:span 4}
    .span-2{grid-column:span 2}.span-3{grid-column:span 3}.span-4{grid-column:span 4}
    .span-5{grid-column:span 5}.span-6{grid-column:span 6}.span-8{grid-column:span 8}
    .span-9{grid-column:span 9}.span-12{grid-column:span 12}
    .field label{display:block;font-size:9px;font-weight:780;color:#526276;margin-bottom:5px}
    .field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 9px;font-size:11px;outline:none;color:var(--text)}
    .field input,.field select{height:36px}
    .field textarea{min-height:70px;resize:vertical}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:#8db8df;box-shadow:0 0 0 3px rgba(19,95,167,.08)}
    .field input[aria-invalid="true"],.field select[aria-invalid="true"]{border-color:var(--red);background:#fffafb}
    .field .hint{font-size:8px;color:var(--muted);margin-top:4px;display:block}
    .field .err{font-size:8px;color:var(--red);margin-top:4px;display:block;font-weight:700}
    .button-row{display:flex;gap:8px;flex-wrap:wrap}
    .note{font-size:9px;color:var(--muted);line-height:1.6;margin-top:10px}
    .rule-list{display:grid;gap:7px}
    .rule{border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:10px;line-height:1.5}
    .rule strong{display:block;margin-bottom:3px}
    .rule-row{display:grid;grid-template-columns:1fr 1fr 1fr 1fr 34px;gap:7px;align-items:end;border:1px solid var(--line);border-radius:9px;padding:9px;margin-bottom:7px}
    .rule-row .field{grid-column:auto}
    .rule-row .row-delete{align-self:center}

    /* ---------- Drawer ---------- */
    .drawer-backdrop{position:fixed;inset:0;background:rgba(8,22,38,.38);z-index:50;opacity:0;pointer-events:none;transition:.18s}
    .drawer-backdrop.open{opacity:1;pointer-events:auto}
    .drawer{position:fixed;top:0;right:0;height:100vh;width:min(920px,96vw);background:#fff;z-index:55;transform:translateX(102%);transition:transform .2s;display:flex;flex-direction:column;box-shadow:-18px 0 48px rgba(8,22,38,.18)}
    .drawer.open{transform:translateX(0)}
    .drawer-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
    .drawer-title{flex:1;min-width:0}
    .drawer-title span{display:block;color:var(--brand);font-size:10px;font-weight:820}
    .drawer-title h2{font-size:18px;margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .drawer-title p{font-size:9px;color:var(--muted);margin:4px 0 0}
    .drawer-body{overflow:auto;flex:1;padding:14px 18px 26px;background:#f8fafc}
    .drawer-footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;background:#fff;flex-wrap:wrap}
    .drawer-footer .spacer{flex:1}
    .summary-strip{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:10px}
    .summary-item{padding:10px 11px;border-right:1px solid var(--line)}
    .summary-item:last-child{border-right:0}
    .summary-item span{display:block;font-size:8px;color:var(--muted);text-transform:uppercase;font-weight:800}
    .summary-item b{display:block;font-size:11px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .accordion{background:#fff;border:1px solid var(--line);border-radius:11px;margin-top:9px;overflow:hidden}
    .accordion>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:820}
    .accordion>summary::-webkit-details-marker{display:none}
    .accordion>summary::after{content:"+";color:var(--muted);font-weight:700}
    .accordion[open]>summary::after{content:"−"}
    .accordion-body{border-top:1px solid var(--line);padding:14px}
    .nested{border:1px solid var(--line);border-radius:9px;margin-top:12px;background:#fff}
    .nested>summary{padding:10px 11px;font-size:10px;font-weight:790;cursor:pointer}
    .nested-body{border-top:1px solid var(--line);padding:11px}
    .editor-card{border:1px solid var(--line);border-radius:10px;background:#fff;padding:11px;margin-bottom:9px}
    .editor-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
    .editor-card-head strong{font-size:10px}
    .editor-card-head span{font-size:8px;color:var(--muted)}
    .compact-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:8px}
    .compact-grid .field input,.compact-grid .field select{height:33px;font-size:10px}
    .compact-grid .field textarea{font-size:10px;min-height:54px}
    .row-delete{border:0;background:transparent;color:var(--red);font-weight:900;font-size:17px;line-height:1}
    .log-list{display:grid;gap:0}
    .log-item{display:grid;grid-template-columns:110px 1fr;gap:10px;font-size:9px;padding:8px 0;border-bottom:1px solid #edf1f5}
    .log-item:last-child{border-bottom:0}
    .log-item time{color:var(--muted)}
    .log-item strong{display:block;font-size:10px}
    .log-item span{display:block;color:var(--muted);margin-top:2px;line-height:1.5}
    .diff{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:8px;background:#f5f7fa;border-radius:5px;padding:2px 5px;display:inline-block;margin-top:3px}

    /* ---------- Wizard ---------- */
    .wizard-steps{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
    .wizard-step{flex:1;min-width:130px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;text-align:left}
    .wizard-step b{display:block;font-size:10px}
    .wizard-step span{display:block;font-size:8px;color:var(--muted);margin-top:2px}
    .wizard-step.active{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-2)}
    .wizard-step.done{border-color:#bfe5d4;background:var(--green-soft)}
    .validation-list{display:grid;gap:6px}
    .validation{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:9px 10px;font-size:10px;background:#fff}
    .validation.ok{border-color:#bfe5d4;background:var(--green-soft)}
    .validation.fail{border-color:#efc4cb;background:var(--red-soft)}
    .validation .mark{font-weight:900;font-size:12px;line-height:1.2;flex:none}
    .validation.ok .mark{color:var(--green)}
    .validation.fail .mark{color:var(--red)}
    .validation strong{display:block;font-size:10px}
    .validation span{display:block;color:var(--muted);font-size:9px;margin-top:2px;line-height:1.5}
    .validation.fail span{color:#912838}

    /* ---------- Modal, toasts ---------- */
    .modal-backdrop{position:fixed;inset:0;background:rgba(8,22,38,.42);z-index:70;display:none;place-items:center;padding:18px}
    .modal-backdrop.open{display:grid}
    .modal{width:min(780px,96vw);max-height:88vh;overflow:auto;background:#fff;border-radius:14px;box-shadow:0 24px 70px rgba(8,22,38,.22)}
    .modal-head{display:flex;align-items:center;justify-content:space-between;padding:15px 17px;border-bottom:1px solid var(--line);gap:10px}
    .modal-head h2{font-size:15px;margin:0}
    .modal-body{padding:16px}
    .modal-foot{padding:12px 17px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
    .summary-bars{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    .bar-list{display:grid;gap:8px}
    .bar-item{display:grid;grid-template-columns:130px 1fr 40px;gap:8px;align-items:center;font-size:9px}
    .bar{height:8px;background:#eef2f6;border-radius:99px;overflow:hidden}
    .bar span{display:block;height:100%;background:var(--brand);border-radius:99px}
    .mail-preview{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fbfdff;font-size:10px;line-height:1.65;white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;max-height:280px;overflow:auto}
    .toast-zone{position:fixed;right:18px;bottom:18px;z-index:90;display:grid;gap:8px}
    .toast{background:#172033;color:#fff;border-radius:10px;padding:10px 12px;box-shadow:var(--shadow);font-size:10px;min-width:264px;max-width:340px;line-height:1.5}
    .toast strong{display:block;font-size:11px;margin-bottom:2px}
    .toast.error{background:#8f2635}
    .toast.warning{background:#765000}

    /* ---------- Responsive ---------- */
    @media(max-width:1320px){
      .metrics{grid-template-columns:repeat(3,minmax(0,1fr))}
      .metric:nth-child(3){border-right:0}
      .metric:nth-child(-n+3){border-bottom:1px solid var(--line)}
    }
    @media(max-width:1180px){
      .company-project-summary{grid-template-columns:32px minmax(220px,1fr) 110px 120px 120px}
      .company-project-summary>div:nth-child(5){display:none}
      .product-top{grid-template-columns:minmax(170px,1fr) 140px 120px 110px}
      .product-top>div:nth-child(4){display:none}
      .admin-grid{grid-template-columns:1fr}
      .summary-bars{grid-template-columns:1fr}
      .alert-row{grid-template-columns:minmax(180px,1.3fr) minmax(140px,1fr) 120px 110px}
      .alert-row>div:nth-child(5){display:none}
      .hours-strip{grid-template-columns:1fr 1fr}
      .hours-cell:nth-child(2){border-right:0}
      .hours-cell:nth-child(-n+2){border-bottom:1px solid var(--line)}
    }
    @media(max-width:850px){
      .app{grid-template-columns:1fr}
      .sidebar{position:fixed;left:0;transform:translateX(-105%);transition:transform .2s;width:248px}
      .sidebar.open{transform:translateX(0)}
      .mobile-menu{display:inline-flex}
      .topbar{padding:10px 12px}
      .page-title{min-width:0}
      .page-title p{display:none}
      .search{order:5;flex-basis:100%;max-width:none}
      .content{padding:14px 10px 34px}
      .metrics{grid-template-columns:1fr 1fr}
      .metric{border-right:1px solid var(--line)!important}
      .metric:nth-child(2n){border-right:0!important}
      .metric{border-bottom:1px solid var(--line)}
      .calendar-metrics{grid-template-columns:1fr 1fr}
      .calendar-metric:nth-child(2n){border-right:0}
      .calendar-metric:nth-child(-n+2){border-bottom:1px solid var(--line)}
      .company-stats{display:none}
      .company-project-summary{grid-template-columns:32px minmax(180px,1fr) 110px}
      .company-project-summary>div:nth-child(4),.company-project-summary>div:nth-child(5),.company-project-summary>div:nth-child(6){display:none}
      .project-products{padding-left:12px}
      .product-top{grid-template-columns:1fr 120px}
      .product-top>div:nth-child(3),.product-top>div:nth-child(4),.product-top>div:nth-child(5){display:none}
      .alert-row{grid-template-columns:1fr 110px}
      .alert-row>div:nth-child(3),.alert-row>div:nth-child(4),.alert-row>div:nth-child(5){display:none}
      .summary-strip{grid-template-columns:1fr 1fr}
      .summary-item{border-bottom:1px solid var(--line)}
      .summary-item:nth-child(2n){border-right:0}
      .summary-item:last-child{grid-column:1/-1;border-bottom:0}
      .form-grid,.compact-grid{grid-template-columns:1fr 1fr}
      .field,.span-2,.span-3,.span-4,.span-5,.span-6,.span-8,.span-9,.span-12{grid-column:span 1}
      .field.span-12,.field.span-9,.field.span-8,.field.span-6{grid-column:1/-1}
      .drawer{width:100vw}
      .agenda-item{grid-template-columns:80px 1fr}
      .agenda-item>div:nth-child(3),.agenda-item>div:nth-child(4){display:none}
      .rule-row{grid-template-columns:1fr 1fr}
      .rule-row .field{grid-column:auto}
    }
    @media(max-width:520px){
      .hide-mobile{display:none}
      .metrics{grid-template-columns:1fr}
      .metric{border-right:0!important}
      .hours-strip{grid-template-columns:1fr}
      .hours-cell{border-right:0;border-bottom:1px solid var(--line)}
      .calendar-metrics{grid-template-columns:1fr}
      .calendar-metric{border-right:0!important;border-bottom:1px solid var(--line)}
      .filterbar select{flex:1;min-width:45%}
      .filter-help{width:100%;margin:0}
      .summary-strip{grid-template-columns:1fr}
      .summary-item{border-right:0;border-bottom:1px solid var(--line)}
      .summary-item:last-child{grid-column:auto}
      .form-grid,.compact-grid{grid-template-columns:1fr}
      .field,.field.span-12,.field.span-9,.field.span-8,.field.span-6{grid-column:1}
      .drawer-head{padding:13px}
      .drawer-body{padding:10px}
      .drawer-footer{padding:10px}
      .calendar-grid{grid-template-columns:repeat(7,105px)}
      .rule-row{grid-template-columns:1fr}
    }
    @media print{
      .sidebar,.topbar,.filterbar,.active-filters,.demo-banner,.panel-actions,.drawer,.drawer-backdrop,.product-actions{display:none!important}
      .app{display:block}
      .content{padding:0}
      .panel,.metrics,.flow,.company-block{box-shadow:none;break-inside:avoid}
      body{background:#fff}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">RH</div>
      <div><strong>REHAVID</strong><span>Gestión de proyectos</span></div>
    </div>
    <nav class="nav" id="mainNav" aria-label="Navegación principal"></nav>
    <div class="sidebar-foot">
      Venta → activación → asignación → programación confirmada → ejecución → cierre por producto.
      <div class="save-state"><span class="save-dot" aria-hidden="true"></span><span id="saveState">Datos guardados</span></div>
    </div>
  </aside>

  <main class="workspace">
    <header class="topbar">
      <button class="btn btn-icon mobile-menu" id="mobileMenu" aria-label="Abrir menú" aria-expanded="false">☰</button>
      <div class="page-title"><h1 id="pageTitle">Panel de portafolio</h1><p id="pageSubtitle"></p></div>
      <div class="search">
        <span aria-hidden="true">⌕</span>
        <label class="sr-only" for="globalSearch">Buscar</label>
        <input id="globalSearch" type="search" placeholder="Buscar empresa, proyecto, PPR, producto o responsable…" />
      </div>
      <div class="top-actions">
        <div class="session-user">
          <label for="sessionUser">Usuario</label>
          <select id="sessionUser" title="Usuario que queda registrado en la bitácora de auditoría"></select>
        </div>
        <button class="btn hide-mobile" data-action="open-summary">Consolidación</button>
        <button class="btn btn-primary" data-action="new-sale">＋ Registrar venta</button>
      </div>
    </header>

    <div class="content">
      <div id="demoBanner"></div>
      <div class="filterbar" id="filterBar"></div>
      <div class="active-filters" id="activeFilters"></div>
      <div id="viewRoot"></div>
    </div>
  </main>
</div>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="drawerHeading">
  <div class="drawer-head" id="drawerHead"></div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-footer" id="drawerFooter"></div>
</aside>

<div class="modal-backdrop" id="modalBackdrop"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<input type="file" id="importFile" accept=".json,.csv,application/json,text/csv" hidden />
<div id="dataLists"></div>
<div class="toast-zone" id="toastZone" role="status" aria-live="polite"></div>

<script>
"use strict";
/* =============================================================================
   REHAVID · Gestión de proyectos · v5
   Implementa la "Especificación funcional y flujograma del proceso de gestión
   de proyectos" v1.0 (11/08/2026).

   Estructura del archivo
     1. Catálogos y parámetros            5. Motor de asignación y notificaciones
     2. Utilidades                         6. Persistencia y migración
     3. Modelo de datos                    7. Vistas
     4. Lógica derivada (estado,           8. Detalle, registro de venta y acciones
        condición, alertas)                9. Eventos e inicialización
   ============================================================================= */

/* ------------------------------ 1. CATÁLOGOS ------------------------------ */

const APP_VERSION = "5.0.0";
const STORAGE_KEY = "rehavid_gestion_proyectos_v5";
const LEGACY_STORAGE_KEY = "rehavid_project_hub_v1";   // base de la versión 4

const PROJECT_TYPES   = ["Tipo 1", "Tipo 2"];
const PROJECT_STATES  = ["Borrador", "Activo", "Cerrado"];                                   // ciclo del proyecto maestro
const PRODUCT_STATES  = ["Pendiente de contacto", "Programado", "En ejecución",
                         "Suspendido", "Finalizado", "Cerrado"];                             // §7.1 estado operativo
const CONDITIONS      = ["En tiempo", "En riesgo", "Retrasado"];                             // §7.1 condición de gestión
const ROUTINGS        = ["Tipo 1", "Tipo 2", "Medición objetiva", "Tablero BI", "Diseño", "Otra"];
const TECHNOLOGIES    = ["Xsens", "TuMeke", "BVB", "Tobii 3",
                         "Electromiografía de superficie", "Biofeedback"];
const COMPLEXITIES    = ["Baja", "Media", "Alta"];
const NOVELTY_TYPES   = ["Retraso", "Suspensión", "Reanudación"];
const EVENT_TYPES     = ["Creado", "Activado", "Asignado", "Aceptado", "Reasignado", "Contactado",
                         "Programado", "Reprogramado", "Actualizado", "Suspendido", "Reanudado",
                         "Entregable cargado", "Finalizado", "Cerrado", "Editado", "Importado"];

// El estado operativo menos avanzado define el estado global del proyecto (RN-13).
const STATE_RANK = { "Pendiente de contacto": 0, "Suspendido": 1, "Programado": 2,
                     "En ejecución": 3, "Finalizado": 4, "Cerrado": 5 };
const CONDITION_RANK = { "Retrasado": 0, "En riesgo": 1, "En tiempo": 2 };
const OPEN_STATES = ["Pendiente de contacto", "Programado", "En ejecución", "Suspendido"];

// §7.3 · Alertas de gestión. `test` recibe (producto, proyecto, sla) y devuelve
// false o el texto de detalle que se muestra en el centro de alertas.
const ALERT_DEFS = [
  { code: "not_accepted", label: "Asignación no aceptada", severity: "Alta",
    desc: "El responsable no ha confirmado la tarea dentro del acuerdo de servicio configurado.",
    test: (pr, p, sla) => {
      if (p.state !== "Activo" || !isOpenProduct(pr) || pr.acceptedAt || !pr.assignedAt) return false;
      const h = hoursSince(pr.assignedAt);
      return h > sla.acceptHours ? `Asignado hace ${fmtNum(h / 24)} día(s); el acuerdo es de ${sla.acceptHours} h.` : false;
    } },
  { code: "not_contacted", label: "Cliente no contactado", severity: "Alta",
    desc: "Existe asignación, pero no hay registro de contacto.",
    test: (pr, p, sla) => {
      if (p.state !== "Activo" || !isOpenProduct(pr) || pr.contactedAt) return false;
      const base = pr.acceptedAt || pr.assignedAt;
      if (!base) return false;
      const d = Math.floor(hoursSince(base) / 24);
      return d > sla.contactDays ? `Sin registro de contacto ${d} día(s) después de la asignación.` : false;
    } },
  { code: "not_scheduled", label: "Sin programación", severity: "Alta",
    desc: "El producto fue vendido, pero no tiene fecha confirmada con el cliente.",
    test: (pr, p, sla) => {
      if (p.state !== "Activo" || !isOpenProduct(pr)) return false;
      if (pr.startDate && pr.endDate && pr.scheduleConfirmed) return false;
      const base = p.activatedAt || p.createdAt;
      const d = base ? Math.floor(hoursSince(base) / 24) : 0;
      return d > sla.scheduleDays
        ? `Sin programación confirmada ${d} día(s) después de activar el proyecto.`
        : (!pr.startDate && !pr.endDate ? "Sin fechas confirmadas con el cliente." : false);
    } },
  { code: "due_soon", label: "Próximo a vencer", severity: "Media",
    desc: "La fecha objetivo se aproxima y el avance no es suficiente.",
    test: (pr, p, sla) => {
      if (!isOpenProduct(pr) || !pr.endDate) return false;
      const left = daysUntil(pr.endDate);
      if (left === null || left < 0 || left > sla.dueSoonDays) return false;
      const expected = expectedProgress(pr);
      const real = productProgress(pr);
      return real + sla.progressTolerance < expected
        ? `Faltan ${left} día(s) y el avance es ${fmtPct(real)} frente a ${fmtPct(expected)} esperado.`
        : false;
    } },
  { code: "overdue", label: "Retrasado", severity: "Crítica",
    desc: "La fecha programada venció sin cierre.",
    test: (pr) => {
      if (!isOpenProduct(pr) || !pr.endDate) return false;
      const left = daysUntil(pr.endDate);
      return left !== null && left < 0 ? `Venció el ${formatDate(pr.endDate, true)} (${Math.abs(left)} día(s)).` : false;
    } },
  { code: "suspended", label: "Suspendido", severity: "Alta",
    desc: "La actividad está detenida y debe existir causa, responsable y fecha de revisión.",
    test: (pr) => {
      if (pr.status !== "Suspendido") return false;
      const n = lastNovelty(pr, "Suspensión");
      if (!n || !n.cause || !n.owner || !n.newDate) return "Suspendido sin causa, responsable o fecha de revisión completa (RN-08).";
      return `Causa: ${n.cause} · revisión ${formatDate(n.newDate, true)}.`;
    } },
  { code: "stale", label: "Sin actualización", severity: "Media",
    desc: "No se han registrado novedades durante el periodo de control configurado.",
    test: (pr, p, sla) => {
      if (p.state !== "Activo" || !["Programado", "En ejecución"].includes(pr.status)) return false;
      const base = pr.lastUpdateAt || pr.assignedAt || p.activatedAt;
      if (!base) return false;
      const d = Math.floor(hoursSince(base) / 24);
      return d > sla.updateDays ? `Última actualización hace ${d} día(s).` : false;
    } },
  { code: "hours_deviation", label: "Desviación de horas", severity: "Alta",
    desc: "Las horas ejecutadas superan o se aproximan al límite vendido.",
    test: (pr, p, sla) => {
      const sold = Number(pr.hoursSold) || 0, used = Number(pr.hoursExecuted) || 0;
      if (pr.status === "Cerrado" || sold <= 0) return false;
      const pct = used / sold * 100;
      if (pct > 100) return `${fmtNum(used)} h ejecutadas sobre ${fmtNum(sold)} h vendidas (${fmtPct(pct)}).`;
      if (!isOpenProduct(pr)) return false;   // ya finalizado y dentro de lo vendido: no hay nada que gestionar
      return pct >= sla.hoursWarnPct ? `${fmtPct(pct)} de las horas vendidas consumidas (saldo ${fmtNum(sold - used)} h).` : false;
    } }
];
const ALERT_BY_CODE = Object.fromEntries(ALERT_DEFS.map(a => [a.code, a]));
const SEVERITY_RANK = { "Crítica": 0, "Alta": 1, "Media": 2 };

const MONTHS   = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio",
                  "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
const WEEKDAYS = ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"];

/* ------------------------------ 2. UTILIDADES ------------------------------ */

function clone(v) { return JSON.parse(JSON.stringify(v)); }
function uid(prefix = "id") { return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`; }
function esc(v) {
  return String(v ?? "").replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;")
                        .replaceAll('"', "&quot;").replaceAll("'", "&#039;");
}
function norm(v) { return String(v ?? "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim(); }
function clamp(v, min, max) { return Math.max(min, Math.min(max, Number(v) || 0)); }
function sum(list, getter = x => x) { return (list || []).reduce((a, x) => a + (Number(getter(x)) || 0), 0); }
function avg(list, getter = x => x) { return (list || []).length ? sum(list, getter) / list.length : 0; }
function unique(list) {
  return [...new Set((list || []).map(x => String(x ?? "").trim()).filter(Boolean))]
    .sort((a, b) => a.localeCompare(b, "es"));
}
function groupBy(list, getter) {
  const m = new Map();
  (list || []).forEach(x => { const k = getter(x) || "Sin definir"; if (!m.has(k)) m.set(k, []); m.get(k).push(x); });
  return m;
}
function initials(v) {
  return String(v || "NA").split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0]).join("").toUpperCase();
}
function dateISO(d = new Date()) {
  const x = new Date(d);
  if (Number.isNaN(x.getTime())) return "";
  return new Date(x.getTime() - x.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function dateOffset(days) { const d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + days); return dateISO(d); }
function toDate(v) { if (!v) return null; const d = new Date(`${String(v).slice(0, 10)}T12:00:00`); return Number.isNaN(d.getTime()) ? null : d; }
function formatDate(v, short = false) { const d = toDate(v); return d ? (short ? DATE_SHORT : DATE_LONG).format(d) : "Sin fecha"; }
function formatStamp(v) {
  if (!v) return "Sin fecha";
  const d = new Date(v);
  return Number.isNaN(d.getTime()) ? "Sin fecha"
    : `${DATE_SHORT.format(d)} ${d.toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" })}`;
}
function daysUntil(v) { const d = toDate(v), t = toDate(dateISO()); return d && t ? Math.round((d - t) / 86400000) : null; }
function hoursSince(stamp) {
  const d = new Date(stamp);
  return Number.isNaN(d.getTime()) ? 0 : Math.max(0, (Date.now() - d.getTime()) / 3600000);
}
function fmtMoney(v) { return MONEY.format(Number(v) || 0); }
function fmtNum(v) { return NUM.format(Number(v) || 0); }
function fmtPct(v) { return `${Math.round(Number(v) || 0)}%`; }
function isEmail(v) { return /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(String(v || "").trim()); }
function isPhone(v) { return String(v || "").replace(/[^\d]/g, "").length >= 7; }
function setPath(obj, path, value) {
  const parts = String(path).split(".");
  let t = obj;
  parts.slice(0, -1).forEach(k => { if (!t[k] || typeof t[k] !== "object") t[k] = {}; t = t[k]; });
  t[parts.at(-1)] = value;
}
function getPath(obj, path) { return String(path).split(".").reduce((v, k) => v?.[k], obj); }
function mergeDeep(target, source) {
  Object.entries(source || {}).forEach(([k, v]) => {
    if (v && typeof v === "object" && !Array.isArray(v) && target[k] && typeof target[k] === "object") mergeDeep(target[k], v);
    else target[k] = v;
  });
  return target;
}
function currentUser() { return state.session.user || "Usuario"; }

function makeContact(raw = {}) {

  return {

    startDate: raw.startDate || "",

    closedAt: raw.closedAt || "",
    lastUpdateAt: raw.lastUpdateAt || raw.assignedAt || "",
    notes: String(raw.notes || "")
  };
}
function makeProject(raw = {}) {
  const type = PROJECT_TYPES.includes(raw.type) ? raw.type : "Tipo 1";
  const p = {
    id: raw.id || uid("prj"),
    code: String(raw.code || "").trim(),
    company: String(raw.company || "").trim(),
    ppr: String(raw.ppr || "").trim(),
    type,
    seller: String(raw.seller || "").trim(),
    saleDate: raw.saleDate || dateISO(),
    commercialRef: String(raw.commercialRef || "").trim(),
    estimatedPlan: String(raw.estimatedPlan || ""),
    coordinator: String(raw.coordinator || "").trim(),
    state: PROJECT_STATES.includes(raw.state) ? raw.state : "Borrador",
    activatedAt: raw.activatedAt || "",
    closedAt: raw.closedAt || "",
    contacts: Array.isArray(raw.contacts) ? raw.contacts.slice(0, 3).map(makeContact) : [],
    products: Array.isArray(raw.products) ? raw.products.map(makeProduct) : [],
    value: Number(raw.value) || 0,
    invoicedValue: Number(raw.invoicedValue) || 0,
    notes: String(raw.notes || ""),
    tags: Array.isArray(raw.tags) ? raw.tags : [],
    demo: Boolean(raw.demo),
    log: Array.isArray(raw.log) ? raw.log : [],
    createdAt: raw.createdAt || new Date().toISOString(),
    updatedAt: raw.updatedAt || new Date().toISOString()
  };
  if (!p.code) p.code = nextProjectCode();
  if (p.contacts.length && p.contacts.every(c => !c.primary)) p.contacts[0].primary = true;
  return p;
}
function nextProjectCode() {
  const year = new Date().getFullYear();
  const used = new Set((state.projects || []).map(p => String(p.code || "").toUpperCase()));
  let n = (state.projects || []).reduce((max, p) => {
    const m = /^PRY-(\d{4})-(\d+)$/i.exec(String(p.code || ""));
    return m && Number(m[1]) === year ? Math.max(max, Number(m[2])) : max;
  }, 0);
  let code;
  do { n += 1; code = `PRY-${year}-${String(n).padStart(3, "0")}`; } while (used.has(code));
  return code;
}
function duplicateCandidates(p) {
  return state.projects.filter(x =>
    x.id !== p.id && x.state !== "Cerrado" && norm(x.company) === norm(p.company) &&
    ((String(p.commercialRef || "").trim() && norm(x.commercialRef) === norm(p.commercialRef)) ||
     (norm(x.ppr) === norm(p.ppr) && norm(x.ppr) !== "")));
}
function logEvent(p, { type = "Editado", entity = "", field = "", before = "", after = "", reason = "" }) {
  p.log = p.log || [];
  p.log.unshift({ id: uid("log"), date: new Date().toISOString(), user: currentUser(),
                  type, entity, field, before: String(before ?? ""), after: String(after ?? ""), reason });
  if (p.log.length > 500) p.log.length = 500;
}

/* --------------------- 4. LÓGICA DERIVADA (RN-13, §7.1) --------------------- */

function isOpenProduct(pr) { return OPEN_STATES.includes(pr.status); }
function lastNovelty(pr, type) {
  return (pr.novelties || []).filter(n => !type || n.type === type)
    .sort((a, b) => String(b.date).localeCompare(String(a.date)))[0] || null;
}
function productProgress(pr) {
  if (["Finalizado", "Cerrado"].includes(pr.status)) return 100;
  const ms = pr.milestones || [];
  if (ms.length) {
    const weight = sum(ms, m => Math.max(0, m.hoursAssigned));
    return weight ? clamp(sum(ms, m => clamp(m.progress, 0, 100) * Math.max(0, m.hoursAssigned)) / weight, 0, 100)
                  : clamp(avg(ms, m => m.progress), 0, 100);
  }
  return clamp(pr.progress, 0, 100);
}
function usesMilestoneProgress(pr) { return (pr.milestones || []).length > 0 && !["Finalizado", "Cerrado"].includes(pr.status); }
function expectedProgress(pr) {
  const start = toDate(pr.startDate), end = toDate(pr.endDate), today = toDate(dateISO());
  if (!start || !end || !today || end <= start) return 0;
  return clamp((today - start) / (end - start) * 100, 0, 100);
}
function productHoursBalance(pr) { return (Number(pr.hoursSold) || 0) - (Number(pr.hoursExecuted) || 0); }
function projectHoursSold(p) { return sum(p.products, x => x.hoursSold); }              // RN-03 · suma automática
function projectHoursExecuted(p) { return sum(p.products, x => x.hoursExecuted); }
function projectProgress(p) {
  const list = p.products || [];
  if (!list.length) return 0;
  const weight = sum(list, x => Math.max(0, x.hoursSold));
  return weight ? clamp(sum(list, x => productProgress(x) * Math.max(0, x.hoursSold)) / weight, 0, 100)
                : clamp(avg(list, productProgress), 0, 100);
}
function projectGlobalState(p) {
  if (p.state === "Borrador") return "Borrador";
  const list = p.products || [];
  if (!list.length) return "Sin productos";
  if (list.every(x => x.status === "Cerrado")) return "Cerrado";
  return list.slice().sort((a, b) => STATE_RANK[a.status] - STATE_RANK[b.status])[0].status;
}
function productAlerts(pr, p) {
  const sla = state.settings.sla;
  const out = [];
  ALERT_DEFS.forEach(def => {
    let detail = false;
    try { detail = def.test(pr, p, sla); } catch (e) { console.error("Alerta", def.code, e); }
    if (detail) out.push({ code: def.code, label: def.label, severity: def.severity,
                           detail: typeof detail === "string" ? detail : def.desc,
                           projectId: p.id, productId: pr.id, productName: pr.name, owner: pr.owner });
  });
  return out.sort((a, b) => SEVERITY_RANK[a.severity] - SEVERITY_RANK[b.severity]);
}
function projectAlerts(p) { return (p.products || []).flatMap(pr => productAlerts(pr, p)); }
function productCondition(pr, p) {
  if (!isOpenProduct(pr)) return "En tiempo";
  const alerts = productAlerts(pr, p).map(a => a.code);
  if (alerts.includes("overdue")) return "Retrasado";
  if (pr.status === "Suspendido") {
    const n = lastNovelty(pr, "Suspensión");
    const left = n && n.newDate ? daysUntil(n.newDate) : null;
    return left !== null && left < 0 ? "Retrasado" : "En riesgo";
  }
  return alerts.length ? "En riesgo" : "En tiempo";
}
function projectCondition(p) {
  if (p.state === "Borrador") return "En tiempo";
  const list = (p.products || []).filter(isOpenProduct);
  if (!list.length) return "En tiempo";
  return list.map(pr => productCondition(pr, p))
    .sort((a, b) => CONDITION_RANK[a] - CONDITION_RANK[b])[0];
}
function conditionColor(c) { return c === "Retrasado" ? "red" : c === "En riesgo" ? "amber" : "green"; }
function stateColor(s) {
  if (s === "Cerrado") return "gray";
  if (s === "Finalizado") return "green";
  if (s === "En ejecución") return "blue";
  if (s === "Suspendido") return "red";
  if (s === "Programado") return "violet";
  if (s === "Borrador" || s === "Sin productos") return "gray";
  return "amber";                                   // Pendiente de contacto
}
function topAlert(p) {
  const list = projectAlerts(p);
  if (!list.length) {
    if (p.state === "Borrador") return { label: "Borrador sin activar", detail: "Complete las validaciones para activar.", severity: "Media", color: "amber" };
    if (p.state === "Cerrado") return { label: "Proyecto cerrado", detail: "Todos los productos están cerrados.", severity: "", color: "green" };
    return { label: "Sin alertas", detail: "Dentro de control.", severity: "", color: "green" };
  }
  const a = list[0];
  return { ...a, color: a.severity === "Crítica" ? "red" : a.severity === "Alta" ? "red" : "amber",
           detail: `${a.productName}: ${a.detail}`, extra: list.length - 1 };
}
function nextCommitment(p) {
  // Próximo compromiso = la fecha más cercana entre programación e hitos confirmados.
  const items = [];
  (p.products || []).filter(isOpenProduct).forEach(pr => {
    if (pr.endDate) items.push({ date: pr.endDate, label: `Cierre de ${pr.name}`, owner: pr.owner, productId: pr.id });
    (pr.milestones || []).filter(m => m.date && m.progress < 100)
      .forEach(m => items.push({ date: m.date, label: `${pr.name} · ${m.name}`, owner: m.owner || pr.owner, productId: pr.id }));
    const n = lastNovelty(pr, "Suspensión");
    if (pr.status === "Suspendido" && n?.newDate) items.push({ date: n.newDate, label: `Revisión de suspensión · ${pr.name}`, owner: n.owner || pr.owner, productId: pr.id });
  });
  return items.sort((a, b) => a.date.localeCompare(b.date))[0] || null;
}
function lastProjectUpdate(p) {
  return [p.updatedAt, ...(p.products || []).map(x => x.lastUpdateAt)]
    .filter(Boolean).sort().at(-1) || p.updatedAt;
}
function canCloseProduct(pr) {
  // RN-10 · no se finaliza sin entregable o evidencia de cumplimiento.
  return Boolean(String(pr.deliverable?.description || "").trim() || String(pr.deliverable?.url || "").trim());
}
function canCloseProject(p) {
  // RN-11 · el proyecto maestro solo se cierra cuando todos sus productos están cerrados.
  return (p.products || []).length > 0 && p.products.every(x => x.status === "Cerrado");
}

/* ------------- 5. MOTOR DE ASIGNACIÓN Y NOTIFICACIONES (§5.5, §6) ------------- */

function activeRules() { return (state.settings.assignmentRules || []).filter(r => r.active !== false); }
function matchRuleValue(rule, p, pr) {
  const value = rule.scope === "project" ? p[rule.field] : (pr ? pr[rule.field] : "");
  return norm(value) === norm(rule.value);
}
function resolveCoordinator(p) {
  const rule = activeRules().find(r => r.scope === "project" && matchRuleValue(r, p, null));
  return rule ? rule.assignTo : "";
}
function resolveProductOwner(p, pr) {
  const rule = activeRules().find(r => r.scope === "product" && matchRuleValue(r, p, pr));
  return rule ? rule.assignTo : resolveCoordinator(p);
}
/**
 * Evalúa todas las reglas en paralelo (RN-05). Devuelve la lista de asignaciones
 * previstas: una para el coordinador del proyecto y una por cada producto.
 */
function planAssignments(p) {
  const out = [];
  const coordinator = resolveCoordinator(p);
  if (coordinator) out.push({ scope: "project", to: coordinator, productId: "", productName: "",
                              reason: `Tipo de proyecto = ${p.type}` });
  (p.products || []).forEach(pr => {
    const rule = activeRules().find(r => r.scope === "product" && matchRuleValue(r, p, pr));
    const to = pr.owner || (rule ? rule.assignTo : coordinator);
    if (!to) return;
    out.push({ scope: "product", to, productId: pr.id, productName: pr.name,
               reason: rule ? `Producto = ${rule.value}` : `Tipo de proyecto = ${p.type}` });
  });
  return out;
}
function notificationBody(p, assignment) {
  const pr = (p.products || []).find(x => x.id === assignment.productId);
  const principal = (p.contacts || []).find(c => c.primary) || (p.contacts || [])[0];
  const lines = [
    `Proyecto: ${p.code} · ${p.company}`,
    `PPR: ${p.ppr} · Tipo: ${p.type} · Vendedor: ${p.seller || "Sin registrar"}`,
    ""
  ];
  if (pr) {
    lines.push(`Producto asignado: ${pr.name}`,
               `Horas vendidas: ${fmtNum(pr.hoursSold)} h · Categoría: ${pr.routing}`);
    if (pr.technology) lines.push(`Tecnología: ${pr.technology}`);
    if (pr.complexity) lines.push(`Complejidad de diseño: ${pr.complexity}`);
  } else {
    lines.push(`Coordinación del proyecto (${p.products.length} producto[s], ${fmtNum(projectHoursSold(p))} h vendidas)`);
  }
  lines.push("",
    `Plan estimado: ${p.estimatedPlan || "Sin registrar"}`,
    `Fecha objetivo inicial: ${pr && pr.endDate ? formatDate(pr.endDate) : "Por confirmar con el cliente"}`,
    "",
    "Contactos del cliente:");
  (p.contacts || []).forEach(c => lines.push(
    `  · ${c.name}${c.role ? ` (${c.role})` : ""} — ${c.email || "sin correo"} — ${c.phone || "sin teléfono"}${c.primary ? "  [PRINCIPAL]" : ""}`));
  if (!p.contacts?.length) lines.push("  · Sin contactos registrados");
  lines.push("",
    "Acción requerida: aceptar la asignación, contactar al cliente, confirmar la programación y actualizar el panel.",
    `Enlace directo: abrir la aplicación → Mis asignaciones → ${p.code}${pr ? ` → ${pr.name}` : ""}`,
    "",
    `Contacto principal: ${principal ? `${principal.name} · ${principal.email || "sin correo"} · ${principal.phone || "sin teléfono"}` : "sin definir"}`);
  return lines.join("\n");
}
function queueNotification(p, assignment) {
  const pr = (p.products || []).find(x => x.id === assignment.productId);
  state.outbox.unshift({
    id: uid("ntf"),
    date: new Date().toISOString(),
    to: assignment.to,
    scope: assignment.scope,
    projectId: p.id,
    projectCode: p.code,
    company: p.company,
    productId: assignment.productId,
    productName: assignment.productName,
    reason: assignment.reason,
    subject: `[${p.code}] ${pr ? `Producto asignado: ${pr.name}` : `Coordinación de proyecto ${p.type}`} · ${p.company}`,
    body: notificationBody(p, assignment),
    status: "Pendiente de envío"
  });
  if (state.outbox.length > 400) state.outbox.length = 400;
}
/** §5.4 y §5.5 · activa el proyecto, asigna responsables y genera las notificaciones. */
function runAssignmentEngine(p, { silent = false } = {}) {
  const coordinator = resolveCoordinator(p);
  if (coordinator && !p.coordinator) p.coordinator = coordinator;
  const stamp = new Date().toISOString();
  const plan = planAssignments(p);
  plan.forEach(a => {
    if (a.scope === "product") {
      const pr = p.products.find(x => x.id === a.productId);
      if (!pr) return;
      if (!pr.owner) pr.owner = a.to;
      if (!pr.assignedAt) pr.assignedAt = stamp;
      if (!pr.lastUpdateAt) pr.lastUpdateAt = stamp;
      logEvent(p, { type: "Asignado", entity: pr.name, field: "responsable", after: pr.owner, reason: a.reason });
    } else {
      logEvent(p, { type: "Asignado", entity: "Proyecto", field: "coordinación", after: a.to, reason: a.reason });
    }
    queueNotification(p, { ...a, to: a.scope === "product" ? (p.products.find(x => x.id === a.productId)?.owner || a.to) : a.to });
  });
  if (!silent) toast("Asignaciones generadas", `${plan.length} notificación(es) en la bandeja de envío.`);
  return plan;
}

/* ------------------- 6. PERSISTENCIA, MIGRACIÓN Y DEMOSTRACIÓN ------------------- */

function loadState() {
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); }
  catch (e) { console.error(e); toast("Almacenamiento no disponible", "Los cambios no se conservarán al cerrar.", "error"); }

  if (raw) {
    try {
      const saved = JSON.parse(raw);
      state.projects = Array.isArray(saved.projects) ? saved.projects.map(makeProject) : [];
      state.outbox = Array.isArray(saved.outbox) ? saved.outbox : [];
      state.settings = mergeDeep(clone(DEFAULT_SETTINGS), saved.settings || {});
      if (saved.session?.user) state.session.user = saved.session.user;
      syncCatalogs();
      return;
    } catch (e) {
      console.error(e);
      toast("No se pudieron leer los datos guardados", "Se cargó una base demostrativa.", "warning");
    }
  }
  // Migración automática desde la versión 4 (mismo navegador).
  try {
    const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
    if (legacy) {
      const data = JSON.parse(legacy);
      if (Array.isArray(data.projects) && data.projects.length) {
        state.projects = data.projects.map(migrateLegacyProject).filter(Boolean);
        state.settings.demoMode = state.projects.every(p => p.demo);
        syncCatalogs();
        saveState(true);
        toast("Base de la versión 4 migrada", `${state.projects.length} proyecto(s) convertidos al modelo de productos.`);
        return;
      }
    }
  } catch (e) { console.error(e); }

  state.projects = demoProjects();
  state.settings.demoMode = true;
  syncCatalogs();
  saveState(true);
}
function saveState(silent = false) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      version: APP_VERSION, savedAt: new Date().toISOString(),
      projects: state.projects, outbox: state.outbox,
      settings: state.settings, session: state.session
    }));
    const el = document.getElementById("saveState");
    if (el) el.textContent = `Guardado ${new Date().toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" })}`;
  } catch (e) {
    console.error(e);
    if (!silent) toast("No fue posible guardar", "Descargue un respaldo JSON antes de cerrar el navegador.", "error");
  }
}
function syncCatalogs() {
  const c = state.settings.catalogs || (state.settings.catalogs = clone(DEFAULT_SETTINGS.catalogs));
  c.companies = unique([...(c.companies || []), ...state.projects.map(p => p.company)]);
  c.pprs = unique([...(c.pprs || []), ...state.projects.map(p => p.ppr)]);
  c.products = unique([...(c.products || []), ...state.projects.flatMap(p => (p.products || []).map(x => x.name))]);
  c.sellers = unique([...(c.sellers || []), ...state.projects.map(p => p.seller)]);
  c.people = unique([
    ...(c.people || []),
    ...(state.settings.assignmentRules || []).map(r => r.assignTo),
    ...state.projects.map(p => p.coordinator),
    ...state.projects.flatMap(p => (p.products || []).map(x => x.owner)),
    ...state.projects.flatMap(p => (p.products || []).flatMap(x => (x.milestones || []).map(m => m.owner)))
  ]);
  if (!c.people.includes(state.session.user)) state.session.user = c.people[0] || "Usuario";
}

/** Convierte un proyecto de la versión 4 (actividades con nombre de producto) al modelo v5. */
function migrateLegacyProject(old = {}) {
  const stageMap = {
    "Venta aprobada": "Pendiente de contacto", "Transferencia": "Pendiente de contacto",
    "Planeación": "Programado", "Ejecución": "En ejecución", "Validación técnica": "En ejecución",
    "Cierre integral": "Finalizado", "Cerrado": "Cerrado"
  };
  const status = stageMap[old.stage] || "Pendiente de contacto";
  const groups = groupBy(Array.isArray(old.workItems) ? old.workItems : [],
                         a => String(a.product || "").trim() || old.service || old.title || "Producto principal");
  const names = [...groups.keys()];
  const soldTotal = Number(old.hoursSold) || 0;
  const products = (names.length ? names : [old.service || old.title || "Producto principal"]).map((name, index) => {
    const items = groups.get(name) || [];
    const assigned = sum(items, a => a.hoursAssigned);
    return makeProduct({
      name,
      hoursSold: assigned > 0 ? assigned : (soldTotal / (names.length || 1)) || 0,
      hoursExecuted: items.length ? sum(items, a => a.hoursExecuted) : Number(old.hoursExecuted) || 0,
      routing: /bi|tablero/i.test(name) ? "Tablero BI" : /dise/i.test(name) ? "Diseño" : (old.type === "Tipo 2" ? "Tipo 2" : "Tipo 1"),
      complexity: /dise/i.test(name) ? "Media" : "",
      owner: old.projectLead || old.currentOwner || "",
      assignedAt: old.createdAt || new Date().toISOString(),
      startDate: old.startDate || "",
      endDate: old.dueDate || "",
      scheduleConfirmed: Boolean(old.startDate && old.dueDate),
      status: items.length && items.every(a => ["Completado", "Cancelado"].includes(a.status)) ? "Finalizado" : status,
      progress: clamp(old.stage === "Cerrado" ? 100 : 0, 0, 100),
      lastUpdateAt: old.updatedAt || old.createdAt || "",
      notes: [old.scope, old.deliverables].filter(Boolean).join(" · "),
      deliverable: { description: old.deliverables || "", url: "", validatedBy: "", validatedAt: "" },
      milestones: items.map(a => makeMilestone({
        name: a.activity, owner: a.owner, date: a.dueDate,
        confirmed: Boolean(a.dueDate),
        progress: ["Completado"].includes(a.status) ? 100 : clamp(a.progress, 0, 100),
        hoursAssigned: a.hoursAssigned, hoursExecuted: a.hoursExecuted, notes: a.notes
      })),
      // Los bloqueos del proyecto v4 se adjuntan solo al primer producto para no duplicarlos.
      novelties: (index > 0 ? [] : (old.blockers || []).filter(b => !b.resolved)).map(b => makeNovelty({
        type: "Retraso", cause: b.description, action: "Migrado desde la versión 4",
        owner: b.owner || old.projectLead, newDate: b.dueDate, date: old.updatedAt
      }))
    });
  });
  const contacts = old.clientContact || old.clientEmail || old.clientPhone
    ? [makeContact({ name: old.clientContact || "Contacto del cliente", email: old.clientEmail, phone: old.clientPhone, primary: true })]
    : [];
  const p = makeProject({
    id: old.id, code: old.code, company: old.company, ppr: old.ppr, type: old.type,
    seller: old.portfolioOwner || "", saleDate: old.orderDate || dateISO(),
    commercialRef: old.code || "", estimatedPlan: old.scope || old.notes || "Plan migrado desde la versión 4",
    coordinator: old.portfolioOwner || "", contacts, products,
    state: old.stage === "Cerrado" || old.status === "Cerrado" ? "Cerrado" : "Activo",
    activatedAt: old.createdAt || new Date().toISOString(),
    value: old.value, invoicedValue: old.invoicedValue, notes: old.notes,
    createdAt: old.createdAt, updatedAt: old.updatedAt,
    demo: /demostraci|^DEM-/i.test(`${old.company} ${old.code}`)
  });
  if (p.state === "Cerrado") p.products.forEach(pr => { pr.status = "Cerrado"; pr.progress = 100; });
  logEvent(p, { type: "Importado", entity: "Proyecto", field: "modelo de datos",
                before: "v4 · actividades", after: `v5 · ${p.products.length} producto(s)`,
                reason: "Migración automática: las actividades se agruparon como productos e hitos." });
  return p;
}

                     test: p => (p.products || []).some(x => isOpenProduct(x) && (x.status === "Pendiente de contacto" || !x.scheduleConfirmed)) },
  running:         { label: "Productos en ejecución", test: p => (p.products || []).some(x => x.status === "En ejecución") },
  at_risk:         { label: "En riesgo o retrasados", test: p => ["En riesgo", "Retrasado"].includes(projectCondition(p)) && p.state === "Activo" },
  suspended:       { label: "Suspendidos",           test: p => (p.products || []).some(x => x.status === "Suspendido") },
  with_alerts:     { label: "Con alertas abiertas",  test: p => projectAlerts(p).length > 0 }
};
function filterOptions(key) {
  const def = FILTER_DEFS.find(d => d.key === key);
  return def ? unique(state.projects.flatMap(def.get)) : [];
}
function matchesFilters(p) {
  for (const def of FILTER_DEFS) {
    const selected = state.filters[def.key];
    if (!selected || !selected.length) continue;
    const values = def.get(p).map(String);
    if (!selected.some(v => values.includes(String(v)))) return false;
  }
  for (const key of state.filters.special) {
    const sf = SPECIAL_FILTERS[key];
    if (sf && !sf.test(p)) return false;
  }
  if (state.search) {
    const haystack = norm([
      p.code, p.company, p.ppr, p.type, p.seller, p.commercialRef, p.coordinator, p.estimatedPlan, p.notes,
      ...(p.tags || []),
      ...(p.contacts || []).flatMap(c => [c.name, c.role, c.email, c.phone]),
      ...(p.products || []).flatMap(x => [x.name, x.owner, x.routing, x.technology, x.complexity, x.notes,
                                          x.deliverable?.description,
                                          ...(x.milestones || []).map(m => m.name),
                                          ...(x.novelties || []).map(n => n.cause)])
    ].join(" "));
    if (!haystack.includes(norm(state.search))) return false;
  }
  return true;
}
function visibleProjects() {
  const list = state.projects.filter(matchesFilters);
  return list.slice().sort((a, b) => {
    if (state.sort === "company") return a.company.localeCompare(b.company, "es") || a.code.localeCompare(b.code, "es");
    if (state.sort === "due") {
      const da = nextCommitment(a)?.date || "9999-12-31", db = nextCommitment(b)?.date || "9999-12-31";
      return da.localeCompare(db);
    }
    if (state.sort === "updated") return String(lastProjectUpdate(b)).localeCompare(String(lastProjectUpdate(a)));
    const ca = CONDITION_RANK[projectCondition(a)], cb = CONDITION_RANK[projectCondition(b)];
    if (ca !== cb) return ca - cb;
    const aa = projectAlerts(a).length, ab = projectAlerts(b).length;
    if (aa !== ab) return ab - aa;
    return (nextCommitment(a)?.date || "9999").localeCompare(nextCommitment(b)?.date || "9999");
  });
}
function toggleFilter(key, value) {
  if (!value) return;
  const list = state.filters[key];
  if (!list) return;
  const i = list.indexOf(value);
  if (i >= 0) list.splice(i, 1); else list.push(value);
  renderApp();
}
function setSingleFilter(key, value) { state.filters[key] = value ? [value] : []; renderApp(); }
function clearFilters() {
  Object.keys(state.filters).forEach(k => state.filters[k] = []);
  state.search = "";
  const s = document.getElementById("globalSearch");
  if (s) s.value = "";
  renderApp();
}
function activeFilterCount() {
  return Object.values(state.filters).reduce((n, x) => n + x.length, 0) + (state.search ? 1 : 0);
}
function filterLabel(key, value) {
  const def = FILTER_DEFS.find(d => d.key === key);
  if (def?.optionLabel) return def.optionLabel(value);
  if (key === "special") return SPECIAL_FILTERS[value]?.label || value;
  return value;
}

}

function renderDemoBanner() {

  document.getElementById("demoBanner").innerHTML = demo
    ? `<div class="demo-banner"><div><strong>${demo} proyecto(s) demostrativos</strong> · no representan la operación real y aparecen marcados con la etiqueta «demo» en el panel.</div>
       <button class="btn btn-sm" data-action="remove-demo">Eliminar datos demostrativos</button></div>`
    : "";
}
function renderFilterBar() {
  const bar = document.getElementById("filterBar");
  if (state.view === "admin") { bar.innerHTML = ""; return; }
  const selects = FILTER_DEFS.map(def => {
    const options = filterOptions(def.key);

    return `<select data-filter-select="${esc(def.key)}" aria-label="Filtrar por ${esc(def.label)}">
      <option value="">${esc(def.label)}: todos</option>

    </select>`;
  }).join("");
  bar.innerHTML = selects +
    `<button class="btn btn-sm" data-action="clear-filters" ${activeFilterCount() ? "" : "disabled"}>Limpiar</button>
     <span class="filter-help">Clic sobre cualquier dato subrayado para filtrar o retirar el filtro.</span>`;
}
function renderActiveFilters() {
  const host = document.getElementById("activeFilters");
  if (state.view === "admin") { host.innerHTML = ""; return; }
  const labels = Object.fromEntries(FILTER_DEFS.map(d => [d.key, d.label]));
  labels.special = "Vista";
  const chips = [];
  Object.entries(state.filters).forEach(([k, list]) => (list || []).forEach(v =>
    chips.push(`<button class="filter-chip" data-remove-filter="${esc(k)}" data-value="${esc(v)}" title="Retirar filtro">${esc(labels[k] || k)}: ${esc(filterLabel(k, v))} ×</button>`)));
  if (state.search) chips.push(`<button class="filter-chip" data-action="clear-search">Búsqueda: ${esc(state.search)} ×</button>`);

function renderView() {

  else if (state.view === "assignments") root.innerHTML = renderAssignments();

function empty(title, text, action = true) {

}
function pill(text, color, extra = "") { return `<span class="pill ${color}" ${extra}>${esc(text)}</span>`; }
function filterValue(key, value, text, cls = "") {
  return `<button type="button" class="filter-value ${cls}" data-filter-key="${esc(key)}" data-filter-value="${esc(value)}" title="Clic para filtrar o retirar el filtro">${esc(text)}</button>`;

function conditionChip(cond) {

function progressBar(value, color = "") {

/* --------------------------- 8.1 Panel de portafolio --------------------------- */

function renderPortfolio(projects) {
  const products = projects.flatMap(p => (p.products || []).map(pr => ({ pr, p })));
  const activeProjects = projects.filter(p => p.state === "Activo").length;
  const pendingSetup = products.filter(({ pr }) => isOpenProduct(pr) && (pr.status === "Pendiente de contacto" || !pr.scheduleConfirmed)).length;
  const running = products.filter(({ pr }) => pr.status === "En ejecución").length;
  const risky = products.filter(({ pr, p }) => isOpenProduct(pr) && ["En riesgo", "Retrasado"].includes(productCondition(pr, p))).length;
  const suspended = products.filter(({ pr }) => pr.status === "Suspendido").length;
  const alerts = projects.reduce((n, p) => n + projectAlerts(p).length, 0);

  const sold = sum(projects, projectHoursSold);
  const executed = sum(projects, projectHoursExecuted);
  const stateCounts = PRODUCT_STATES.map(s => ({ s, count: products.filter(({ pr }) => pr.status === s).length }));

  return `
  <section class="metrics">
    ${metricButton("Proyectos activos", activeProjects, "Con responsabilidad vigente", "active", "info")}
    ${metricButton("Pendientes de contacto o programación", pendingSetup, "Productos sin programación confirmada", "pending_contact", pendingSetup ? "warning" : "")}
    ${metricButton("Productos en ejecución", running, "Trabajo en curso", "running", "")}
    ${metricButton("En riesgo o retrasados", risky, "Requieren gestión inmediata", "at_risk", risky ? "danger" : "")}
    ${metricButton("Suspendidos", suspended, "Detenidos con causa registrada", "suspended", suspended ? "warning" : "")}
    ${metricButton("Alertas abiertas", alerts, "Ver el centro de alertas", "with_alerts", alerts ? "danger" : "")}
  </section>
  <section class="hours-strip">
    <div class="hours-cell"><span>Horas vendidas</span><b>${fmtNum(sold)}</b><small>Suma automática de los productos (RN-03)</small></div>
    <div class="hours-cell"><span>Horas ejecutadas</span><b>${fmtNum(executed)}</b><small>${fmtPct(sold ? executed / sold * 100 : 0)} de lo vendido</small></div>
    <div class="hours-cell"><span>Horas disponibles</span><b>${fmtNum(sold - executed)}</b><small>Saldo en los proyectos visibles</small></div>
    <div class="hours-cell"><span>Valor contratado</span><b>${fmtMoney(sum(projects, p => p.value))}</b><small>Facturado ${fmtMoney(sum(projects, p => p.invoicedValue))}</small></div>
  </section>
  <section class="flow">
    <div class="flow-head"><strong>Estado operativo de los productos</strong><span>Seleccione un estado para filtrar el panel.</span></div>
    <div class="flow-row">${stateCounts.map(x => `
      <button class="flow-step ${state.filters.state.includes(x.s) ? "selected" : ""}" data-filter-key="state" data-filter-value="${esc(x.s)}" data-single-click="1">
        <b>${esc(x.s)}</b><span>${x.count}</span></button>`).join("")}</div>
  </section>
  <section class="panel">
    <div class="panel-head">
      <div><h2>Proyectos</h2><p>${projects.length} proyecto(s) visible(s). La tabla prioriza la condición de gestión, la alerta principal y el próximo compromiso.</p></div>
      <div class="panel-actions">
        <label class="sr-only" for="sortProjects">Ordenar</label>
        <select id="sortProjects" class="btn">
          <option value="risk" ${state.sort === "risk" ? "selected" : ""}>Ordenar: condición y alertas</option>
          <option value="due" ${state.sort === "due" ? "selected" : ""}>Ordenar: próximo compromiso</option>
          <option value="company" ${state.sort === "company" ? "selected" : ""}>Ordenar: empresa</option>

    ${projects.length ? renderPortfolioTable(projects) : empty("No hay proyectos en esta vista", "Retire los filtros activos o registre una venta para comenzar.")}

}
function metricButton(label, value, desc, special, cls) {
